<title>常総学院</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}

  font-size:clamp(23px,5.4vw,42px);line-height:1.5;letter-spacing:.01em}

.badge{position:absolute;left:12px;top:12px;background:rgba(127,127,127,.16);color:var(--dim);

<script>
const D={"name": "常総学院", "file": "001_編集用", "dur": 967.65, "segs": [], "subs": [{"t": 0.0, "x": "1984年8月21日。"}, {"t": 2.6666666666666665, "x": "兵庫県の甲子園球場。"}, {"t": 4.433333333333334, "x": "夏の全国高校野球。決勝の日だ。"}, {"t": 7.016666666666667, "x": "戦ったのは、大阪のPL学園と、茨城の取手二。"}, {"t": 10.733333333333333, "x": "PLには2年生の桑田真澄と清原和博がいた。"}, {"t": 14.25, "x": "あの2人が、まだ2年生だったのね。"}, {"t": 16.783333333333335, "x": "ああ。試合は延長10回までもつれた。"}, {"t": 19.183333333333334, "x": "10回表。取手二は\n中島彰一の本塁打などで4点を取る。"}, {"t": 23.066666666666666, "x": "結果は8対4。取手二の優勝だ。"}, {"t": 25.5, "x": "日本高野連の記録には\n「茨城勢として初優勝」とある。"}, {"t": 29.483333333333334, "x": "その取手二の監督が、木内幸男さんね？"}, {"t": 32.36666666666667, "x": "そうだ。ただ、今回の主役は取手二ではない。"}, {"t": 35.3, "x": "この夏のすぐあと。木内は別の学校へ移っている。"}, {"t": 38.516666666666666, "x": "茨城県土浦市の私立高校。常総学院だ。"}, {"t": 41.9, "x": "どんな学校だったの？"}, {"t": 43.43333333333333, "x": "創立は1983年。木内が来た年はまだ2年目だった。"}, {"t": 48.4, "x": "そんな新しい学校で、甲子園に行けたのかしら？"}, {"t": 51.56666666666667, "x": "行けた。それもただ出ただけではない。"}, {"t": 53.75, "x": "春と夏をあわせて、甲子園の決勝に4回立っている。"}, {"t": 57.3, "x": "4回も？"}, {"t": 58.233333333333334, "x": "ああ。そのうち2回は負け、2回は勝った。"}, {"t": 60.916666666666664, "x": "できて間もない学校は、どんな道を\n通って決勝まで来たのか。"}, {"t": 64.66666666666667, "x": "そして木内が去ったあと、野球部はどうなったのか。"}, {"t": 67.81666666666666, "x": "今日はその2つを追うのね。"}, {"t": 69.55, "x": "そうだ。日付と点数をもとに、順番に見ていく。"}, {"t": 72.76666666666667, "x": "取手二の優勝までの話は前に別の回で取り上げた。"}, {"t": 76.08333333333333, "x": "今回はその続き。常総学院の話だ。"}, {"t": 79.0, "x": "最後まで見てもらえたらうれしい。"}, {"t": 80.81666666666666, "x": "本編の前に、チャンネル登録と\n高評価をお願いしたい。"}, {"t": 84.81666666666666, "x": "1985年の春。千葉の中学生が常総学院に入ってきた。"}, {"t": 89.48333333333333, "x": "名前は島田直也。のちのエースだ。"}, {"t": 91.73333333333333, "x": "島田は2024年の取材で、\n入学のころをこう話している。"}, {"t": 95.63333333333334, "x": "木内が常総学院へ移ると聞いて、"}, {"t": 97.85, "x": "幼なじみと一緒に進学を決めた。"}, {"t": 100.25, "x": "監督を追いかけて入ったのね。"}, {"t": 102.3, "x": "同じように考えた中学生は、ほかにもたくさんいた。"}, {"t": 105.68333333333334, "x": "入ってみると野球部の1年生だけで120人いたそうだ。"}, {"t": 109.4, "x": "1学年だけで120人？"}, {"t": 111.41666666666667, "x": "ああ。まず、力に合わせていくつかの組に分けられた。"}, {"t": 114.71666666666667, "x": "島田は体が小さく、いちばん下の組から始まった。"}, {"t": 118.23333333333333, "x": "最初は監督と話す機会もなかったと言う。"}, {"t": 120.98333333333333, "x": "島田が得意だったのは、肩の強さと足の速さだ。"}, {"t": 124.28333333333333, "x": "打撃練習で投げる役に呼ばれ、\n上の組に上がっていった。"}, {"t": 127.8, "x": "エースの背番号をもらえたのは2年生の秋だ。"}, {"t": 130.61666666666667, "x": "いちばん下から、エースまで上がったのね。"}, {"t": 133.66666666666666, "x": "1987年の春。常総学院はセンバツに初めて出た。"}, {"t": 138.03333333333333, "x": "創立から4年目のことだ。"}, {"t": 139.83333333333334, "x": "初戦の相手は、兵庫の明石。この試合は負けている。"}, {"t": 143.23333333333332, "x": "初めての甲子園は1試合で終わったのね。"}, {"t": 145.91666666666666, "x": "島田は初めてのマウンドと打席で\n足が震えたと話している。"}, {"t": 149.53333333333333, "x": "ただ、その夏も茨城大会を勝ち抜いた。"}, {"t": 152.3, "x": "春と夏。続けて甲子園に出ることになった。"}, {"t": 155.36666666666667, "x": "夏は怖くなかったのかしら？"}, {"t": 157.33333333333334, "x": "島田によると、一度出ていたので\n怖いものはなかったそうだ。"}, {"t": 160.83333333333334, "x": "組み合わせが決まった時、木内は\nデータを見て「大丈夫だ」と言った。"}, {"t": 164.98333333333332, "x": "島田は、その一言でかなり\n楽になったと振り返っている。"}, {"t": 169.21666666666667, "x": "1987年の夏。1回戦の相手は福井商だ。"}, {"t": 173.15, "x": "ここで勝って常総学院は\n甲子園での初めての1勝を挙げた。"}, {"t": 176.81666666666666, "x": "2回戦は沖縄水産。エースは上原晃。"}, {"t": 179.66666666666666, "x": "のちに中日に入る投手だ。"}, {"t": 181.7, "x": "相手のほうが強いと言われていたの？"}, {"t": 183.85, "x": "ああ。島田は\n「沖水有利」の声があったと話している。"}, {"t": 187.38333333333333, "x": "結果は7対0。常総学院の完封勝ちだった。"}, {"t": 190.85, "x": "言われていたのと、逆の結果になったのね。"}, {"t": 193.58333333333334, "x": "3回戦は香川の尽誠学園。"}, {"t": 195.56666666666666, "x": "エースは伊良部秀輝だ。"}, {"t": 197.05, "x": "のちにロッテに1位で入り、\n大リーグでも投げた投手だ。"}, {"t": 200.28333333333333, "x": "この試合も6対0。2試合続けての完封だ。"}, {"t": 203.55, "x": "2試合続けて、相手を0点に？"}, {"t": 205.86666666666667, "x": "そうだ。2試合とも投げていたのは島田だ。"}, {"t": 208.48333333333332, "x": "2回戦は夕方の試合で、3回戦は\n次の日の朝いちばんだった。"}, {"t": 212.63333333333333, "x": "それでも3回戦が10時ごろに終わったので、"}, {"t": 215.23333333333332, "x": "準々決勝まで、1日半休めたという。"}, {"t": 218.05, "x": "これはくじを引いた時に木内が\n言っていたとおりだった。"}, {"t": 221.06666666666666, "x": "3回戦を2日目に引いたら、決勝まで\n4日続けて投げることになる。"}, {"t": 225.41666666666666, "x": "最初の試合なら、1日半あく。"}, {"t": 227.5, "x": "「いいくじを引いたな」と。"}, {"t": 229.15, "x": "くじの時から先の日程まで数えていたのね。"}, {"t": 232.13333333333333, "x": "島田は当時、1人でマウンドを守っていた。"}, {"t": 234.83333333333334, "x": "本人は、この休みが決勝に向けて\nプラスになったと話している。"}, {"t": 238.81666666666666, "x": "準々決勝の相手は愛知の中京。いまの中京大中京だ。"}, {"t": 242.68333333333334, "x": "1回表に、いきなり4点を取られた。"}, {"t": 245.23333333333332, "x": "それは苦しい始まりね。"}, {"t": 246.91666666666666, "x": "島田はその1回に、左ひじに球を当てられている。"}, {"t": 250.18333333333334, "x": "本人はそれで力みが取れたと振り返っている。"}, {"t": 252.85, "x": "そのあとは点を与えず、7対4の逆転勝ちだ。"}, {"t": 255.98333333333332, "x": "準決勝は西東京の東亜学園。エースは川島堅。"}, {"t": 259.4, "x": "のちに広島に1位で入る投手だ。"}, {"t": 261.6333333333333, "x": "6回に1点を先に取られた。"}, {"t": 263.6333333333333, "x": "8回裏。島田が自分で本塁打を打って1対1。"}, {"t": 267.03333333333336, "x": "投げている人が、自分で打ったの？"}, {"t": 269.3333333333333, "x": "ああ。試合は延長10回、2対1のサヨナラ勝ちだ。"}, {"t": 272.6333333333333, "x": "夏の初出場で決勝まで来たことになる。"}, {"t": 276.0, "x": "決勝の相手は、大阪のPL学園。"}, {"t": 278.35, "x": "1984年に木内が破った学校だ。"}, {"t": 281.48333333333335, "x": "主将は立浪和義。\nこの年の春のセンバツも勝っていた。"}, {"t": 285.35, "x": "春と夏の両方を狙っていたのね。"}, {"t": 287.6666666666667, "x": "そうだ。島田によると試合の前に木内はこう言った。"}, {"t": 290.81666666666666, "x": "「大人と子どもほどの差がある」。"}, {"t": 292.6333333333333, "x": "監督が、そこまで言ったの？"}, {"t": 294.6666666666667, "x": "島田はそう振り返っている。"}, {"t": 296.3333333333333, "x": "そして決勝の朝。島田は4番に入るよう言われた。"}, {"t": 299.56666666666666, "x": "投げるだけでなく、打つほうの中心も任されたわけだ。"}, {"t": 302.8333333333333, "x": "試合は1回に1点を取られた。"}, {"t": 304.78333333333336, "x": "前半のうちに、4点を取られている。"}, {"t": 307.23333333333335, "x": "中京戦と同じで、また1回に点を取られたのね。"}, {"t": 310.55, "x": "結果は2対5。常総学院は準優勝に終わった。"}, {"t": 313.9, "x": "最後まで追いつけなかったのね。"}, {"t": 315.8666666666667, "x": "PLはこの大会、全部の試合で1回に点を取っていた。"}, {"t": 319.4, "x": "日本高野連の記録には\n「史上4回目の春夏優勝」とある。"}, {"t": 323.4166666666667, "x": "このチームには1年生の仁志敏久も出ていた。"}, {"t": 326.3333333333333, "x": "のちに巨人で活躍する選手だ。"}, {"t": 328.53333333333336, "x": "島田はのちに、仁志からこう言われたという。"}, {"t": 331.05, "x": "「本気で勝とうとしていたのは島田さんだけですよ」。"}, {"t": 333.8666666666667, "x": "島田は翌年、日本ハムに入団した。"}, {"t": 336.6333333333333, "x": "初めての夏で、準優勝だったのね。"}, {"t": 339.8, "x": "それから6年がたった1993年の夏。"}, {"t": 343.1, "x": "常総学院は甲子園でベスト4まで進んだ。"}, {"t": 345.96666666666664, "x": "そして翌年、1994年の春。"}, {"t": 348.81666666666666, "x": "常総学院は、センバツの決勝に進んだ。"}, {"t": 351.6666666666667, "x": "4月4日。相手は和歌山の智弁和歌山だ。"}, {"t": 354.68333333333334, "x": "どんな試合になったの？"}, {"t": 356.2, "x": "点を取り合う試合だった。"}, {"t": 357.68333333333334, "x": "智弁和歌山が試合の中ごろに逆転した。"}, {"t": 360.3666666666667, "x": "常総学院は8回に追いついた。"}, {"t": 362.46666666666664, "x": "けれど9回に勝ち越されて、5対7。"}, {"t": 365.03333333333336, "x": "2度目の決勝も、準優勝だった。"}, {"t": 367.48333333333335, "x": "またしてもあと一歩だったのね。"}, {"t": 369.46666666666664, "x": "智弁和歌山は、この大会の5試合すべてで\n10本以上の安打を打っていた。"}, {"t": 373.8333333333333, "x": "そしてこれが智弁和歌山の初めての優勝だった。"}, {"t": 377.51666666666665, "x": "2001年の春。"}, {"t": 378.8, "x": "このセンバツから\n「21世紀枠」ができて、34校が出た。"}, {"t": 383.1166666666667, "x": "常総学院には、投げ方の違う投手が3人いた。"}, {"t": 386.48333333333335, "x": "エースの村上。外野も守る、左投げの村田。"}, {"t": 389.7, "x": "そして横から投げる平沢だ。"}, {"t": 391.78333333333336, "x": "3人で、順番に投げたの？"}, {"t": 393.9, "x": "数字で見ると村上が5試合で33回を投げている。"}, {"t": 397.18333333333334, "x": "ただ、木内は大会の前の練習試合を見て、"}, {"t": 400.03333333333336, "x": "「エースが一番ダメ。"}, {"t": 401.1666666666667, "x": "2番手、3番手が絶好調」だったと話している。"}, {"t": 404.56666666666666, "x": "ところが甲子園で2人を出すと、もたなかった。"}, {"t": 407.5, "x": "エースを出したら、おさえた。"}, {"t": 409.05, "x": "木内はそう振り返っている。"}, {"t": 410.8666666666667, "x": "やってみて決めていったのね。"}, {"t": 412.6666666666667, "x": "木内はのちに、こうも話している。"}, {"t": 414.81666666666666, "x": "「『一戦必勝』ってのは弱いうちの話だから」。"}, {"t": 417.56666666666666, "x": "強くなったら最後まで勝つ\n計算をしないと優勝できない。"}, {"t": 420.9166666666667, "x": "組み合わせが決まると、\n優勝までの投手の使い方を先に考えていた。"}, {"t": 425.3833333333333, "x": "先の試合まで、数えて動いていたのね。"}, {"t": 428.03333333333336, "x": "3人の使い分けがはっきり\n出たのが仙台育英との決勝だ。"}, {"t": 431.73333333333335, "x": "6対2で迎えた6回。"}, {"t": 433.25, "x": "村上が1点を取られ、まだピンチが続いた。"}, {"t": 436.15, "x": "木内はすぐに村田に代えて、ここを切り抜けた。"}, {"t": 439.01666666666665, "x": "7回は満塁。代わった平沢が四球を出して1点が入る。"}, {"t": 442.8833333333333, "x": "満塁で押し出しは苦しいわね。"}, {"t": 444.85, "x": "すると木内は、中堅を守っていた村田を、"}, {"t": 447.56666666666666, "x": "もう一度マウンドに戻した。"}, {"t": 449.3833333333333, "x": "一度下がった投手を、また戻したの？"}, {"t": 451.9166666666667, "x": "ああ。マウンドを降りたあと、\n外野を守っていたからできたことだ。"}, {"t": 455.5, "x": "仙台育英は、終わりまで追い上げてきた。"}, {"t": 457.96666666666664, "x": "それでもあと1点が届かず7対6。"}, {"t": 460.4166666666667, "x": "常総学院は甲子園で初めて優勝した。"}, {"t": 463.25, "x": "3度目の決勝で、やっと勝てたのね。"}, {"t": 465.78333333333336, "x": "木内は試合のあとこう話したと伝えられている。"}, {"t": 468.53333333333336, "x": "「高校野球でここまでやるかと\n思われるでしょうが、勘弁してください」。"}, {"t": 472.45, "x": "最初の準優勝から、ここまで14年かかっている。"}, {"t": 476.28333333333336, "x": "2003年。木内は大会の前から、\nこの夏で監督をやめると宣言していた。"}, {"t": 481.35, "x": "自分で最後の夏と決めていたのね。"}, {"t": 483.68333333333334, "x": "この年の茨城大会は、左の磯部と\n仁平が中心に投げた。"}, {"t": 487.78333333333336, "x": "もう1人。飯島という右の横手投げがいた。"}, {"t": 490.5833333333333, "x": "前の年の夏は背番号1で甲子園に立っている。"}, {"t": 493.6, "x": "その直後に右ひじを痛め、調子が戻っていなかった。"}, {"t": 496.96666666666664, "x": "この夏の茨城大会で投げたのは、\n1回と3分の1だけだ。"}, {"t": 501.0833333333333, "x": "それなのに甲子園で使ったの？"}, {"t": 503.1666666666667, "x": "ああ。木内はのちの取材でこう話している。"}, {"t": 505.71666666666664, "x": "ブルペンでは打たせない球を投げていた。"}, {"t": 507.9166666666667, "x": "だからいちばん手ごわい相手に\nぶつけてみようと思った、と。"}, {"t": 511.21666666666664, "x": "その相手が、2回戦の智弁和歌山だった。"}, {"t": 514.1333333333333, "x": "1994年に負けた、あの学校ね。"}, {"t": 517.25, "x": "そうだ。2対2の5回。"}, {"t": 518.7333333333333, "x": "ピンチで飯島がマウンドに上がった。"}, {"t": 520.8333333333334, "x": "飯島はその回を0点におさえ、"}, {"t": 522.8333333333334, "x": "9回までの5回を1点にまとめた。"}, {"t": 525.1166666666667, "x": "飯島はそのあとの試合でもマウンドに立ち続けた。"}, {"t": 528.0666666666667, "x": "準決勝では、群馬の桐生第一に勝っている。"}, {"t": 531.0, "x": "同じ日の第1試合では宮城の東北が\n島根の江の川に6対1で勝った。"}, {"t": 535.5833333333334, "x": "東北はこの試合、左投手と\n横手投げの真壁の2人で投げ切っている。"}, {"t": 540.1166666666667, "x": "決勝の相手がここで決まったのね。"}, {"t": 542.3833333333333, "x": "ああ。木内はのちに、記者にこう認めている。"}, {"t": 545.0833333333334, "x": "真壁が先発していたら負けていた。"}, {"t": 54 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
