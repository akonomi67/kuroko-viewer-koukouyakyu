<style>

<script>
const D={"name": "智弁学園", "file": "028_編集用", "dur": 937.7, "segs": [], "subs": [{"t": 0.0, "x": "2016年3月31日。"}, {"t": 2.25, "x": "兵庫県の甲子園球場。"}, {"t": 4.016666666666667, "x": "春のセンバツの決勝は、延長11回の裏に入っていた。"}, {"t": 7.7, "x": "奈良の智弁学園と、香川の高松商。"}, {"t": 10.233333333333333, "x": "スコアは1対1だ。"}, {"t": 11.683333333333334, "x": "2アウト、一塁にランナーがいる。"}, {"t": 13.7, "x": "打席に立ったのは、6番を打つ\nエースの村上頌樹だった。"}, {"t": 17.45, "x": "ピッチャーが自分で打つ場面なのね。"}, {"t": 19.6, "x": "ああ。村上はこの決勝まで、\n4試合を1人で投げ切ってきた。"}, {"t": 23.55, "x": "打球はセンターの頭の上を越えていった。"}, {"t": 25.95, "x": "一塁ランナーが、ホームに滑り込む。"}, {"t": 28.35, "x": "サヨナラ？"}, {"t": 29.216666666666665, "x": "サヨナラだ。2対1。"}, {"t": 30.633333333333333, "x": "智弁学園が初めて全国の頂点に立った。"}, {"t": 33.56666666666667, "x": "前の日の準決勝も、9回裏の逆転サヨナラだった。"}, {"t": 37.25, "x": "2日続けてサヨナラで日本一なんて、すごい春ね。"}, {"t": 40.766666666666666, "x": "ただ、この学校ができたのは1965年だ。"}, {"t": 44.166666666666664, "x": "日本一まで、51年かかったことになる。"}, {"t": 47.21666666666667, "x": "51年？　名前はよく聞く学校なのに。"}, {"t": 49.86666666666667, "x": "どうして奈良の智弁は、そんなに\n長く頂点に届かなかったのかしら。"}, {"t": 54.61666666666667, "x": "今回は奈良県五條市の智弁学園。\nその野球部の60年あまりを、日付と数字で辿っていく。"}, {"t": 60.583333333333336, "x": "役に立ったと思ったら、チャンネル登録と\n高評価をお願いします。"}, {"t": 64.6, "x": "ところで「智弁」って聞くと、\n和歌山の学校も思い浮かぶんだけど。"}, {"t": 68.76666666666667, "x": "そこが今回の大事なところだ。"}, {"t": 70.76666666666667, "x": "和歌山の智辯和歌山は、\n同じ学校法人がつくった学校だ。"}, {"t": 74.71666666666667, "x": "開校は1978年。奈良の智弁学園より、\n13年あとになる。"}, {"t": 79.66666666666667, "x": "じゃあ奈良のほうがお兄さんなのね。"}, {"t": 81.66666666666667, "x": "ああ。ところが甲子園の優勝は、\n和歌山のほうが先だった。"}, {"t": 85.35, "x": "和歌山は1994年の春に初優勝。"}, {"t": 88.31666666666666, "x": "夏も1997年と2000年に勝っている。"}, {"t": 91.78333333333333, "x": "弟のほうが先に3回も日本一になったの？"}, {"t": 94.91666666666667, "x": "そうだ。2016年の準決勝の\nあと、こんな言葉も報じられた。"}, {"t": 99.16666666666667, "x": "「『智弁』と言えば和歌山でなく、\n奈良と言われるようになりたい」。"}, {"t": 102.65, "x": "うーん、その気持ちは分かる気がするわ。"}, {"t": 105.0, "x": "じゃあ1965年の開校から順に見ていこう。"}, {"t": 108.83333333333333, "x": "智弁学園は1965年に、\n奈良県の私立高校として開校した。"}, {"t": 113.68333333333334, "x": "野球部も同じ年にできている。"}, {"t": 115.63333333333334, "x": "最初の甲子園は1968年の夏。"}, {"t": 118.53333333333333, "x": "第50回の記念大会だった。"}, {"t": 120.7, "x": "この年は全国の2485校から、\n48校が甲子園に勝ち上がっている。"}, {"t": 126.21666666666667, "x": "できて3年で甲子園？"}, {"t": 127.58333333333333, "x": "ずいぶん早いわね。"}, {"t": 128.95, "x": "ああ。ただこの夏の試合の中身は、\n今回の資料では確かめられなかった。"}, {"t": 133.4, "x": "だから先へ進もう。名前が全国に\n広まったのは1970年代の春だ。"}, {"t": 138.48333333333332, "x": "1976年。智弁学園は初めてセンバツに出た。"}, {"t": 142.35, "x": "1回戦は北海道の札幌商に5対0。"}, {"t": 144.98333333333332, "x": "2回戦は愛知の岡崎工に4対3。"}, {"t": 147.65, "x": "初めての春で2つ勝ったのね。"}, {"t": 149.85, "x": "準々決勝は兵庫の東洋大姫路に\n3対11で敗れた。それでもベスト8だ。"}, {"t": 155.03333333333333, "x": "そして翌年の1977年。"}, {"t": 157.45, "x": "智弁学園は春も夏も甲子園に出た。"}, {"t": 160.01666666666668, "x": "春は茨城の土浦日大に4対2。"}, {"t": 162.36666666666667, "x": "千葉の銚子商に4対1。"}, {"t": 164.18333333333334, "x": "準々決勝では東京の早稲田実を4対2で破った。"}, {"t": 167.66666666666666, "x": "早稲田実業にも勝ったの？"}, {"t": 169.5, "x": "ああ。初めてのベスト4だ。"}, {"t": 171.2, "x": "準決勝は和歌山の箕島に0対2で敗れた。"}, {"t": 174.31666666666666, "x": "このときのエースは山口哲治。\nのちに近鉄に入った投手だ。"}, {"t": 178.25, "x": "1979年には、\nパ・リーグの最優秀防御率を取っている。"}, {"t": 183.3, "x": "1977年の夏は、どうやって甲子園に出たの？"}, {"t": 187.16666666666666, "x": "そこが奈良の野球の、少し変わった歴史だ。"}, {"t": 190.0, "x": "そのころの夏は、奈良と和歌山で\n1つの代表を争っていた。"}, {"t": 193.85, "x": "それぞれの県大会を勝った学校が、決勝でぶつかる。"}, {"t": 197.06666666666666, "x": "紀和大会と呼ばれた。"}, {"t": 198.68333333333334, "x": "2つの県で1枚の切符だったのね。"}, {"t": 201.23333333333332, "x": "ああ。その紀和大会は1977年が最後になった。"}, {"t": 205.1, "x": "最後に勝って甲子園へ行った\n学校が、智弁学園だった。"}, {"t": 208.73333333333332, "x": "最後の勝者なのね。"}, {"t": 210.23333333333332, "x": "そして翌年の1978年。"}, {"t": 212.66666666666666, "x": "和歌山に智辯和歌山ができた。"}, {"t": 214.86666666666667, "x": "紀和大会がなくなった次の年に、\n和歌山の智弁ができたの？"}, {"t": 218.81666666666666, "x": "ああ。和歌山の智弁が初めて\n甲子園に出たのは、1985年の春だ。"}, {"t": 223.85, "x": "奈良の智弁の初出場から、17年あとのことになる。"}, {"t": 227.43333333333334, "x": "そうだ。もし\n紀和大会が続いていたら、という見方もある。"}, {"t": 230.98333333333332, "x": "2つの智弁は毎年のように、1枚の切符を\n取り合っていたかもしれないと。"}, {"t": 235.53333333333333, "x": "同じ名前の学校同士で、それは\nちょっと見てみたかったかも。"}, {"t": 239.75, "x": "次の山は1995年の夏だ。"}, {"t": 242.45, "x": "2回戦は富山の高岡商に10対0。"}, {"t": 244.9, "x": "3回戦は青森山田に5対2。"}, {"t": 247.11666666666667, "x": "準々決勝は大阪のPL学園と打ち合いになった。"}, {"t": 250.46666666666667, "x": "PL学園って、あの強い学校よね。"}, {"t": 253.11666666666667, "x": "ああ。それを8対6で破った。"}, {"t": 255.05, "x": "夏は初めてのベスト4だ。"}, {"t": 256.96666666666664, "x": "準決勝は石川の星稜に1対3。"}, {"t": 259.26666666666665, "x": "決勝には届かなかった。"}, {"t": 260.98333333333335, "x": "この夏、1年生でホームランを打った\n選手もいた。のちに阪神に入る庄田隆弘だ。"}, {"t": 266.43333333333334, "x": "1年生で甲子園のホームランなんてすごいわね。"}, {"t": 269.3666666666667, "x": "そしてこの夏のチームで\n主将をしていたのが、小坂将商だった。"}, {"t": 273.4166666666667, "x": "その人の名前、覚えておいたほうがいい？"}, {"t": 275.93333333333334, "x": "ああ。2016年に日本一になったときの監督だからな。"}, {"t": 279.8, "x": "小坂は高校時代の奈良を、のちにこう振り返っている。"}, {"t": 283.03333333333336, "x": "当時は天理が全盛で、すでに\n全国制覇を2度していた。"}, {"t": 286.53333333333336, "x": "天理の選手は体が大きく、\n中学時代の実績もすごかったと。"}, {"t": 290.81666666666666, "x": "そんな相手が同じ県にいたら大変ね。"}, {"t": 293.35, "x": "試合で敬遠されたこともあったが、\n気持ちで打ち返したそうだ。"}, {"t": 296.98333333333335, "x": "整列の時点で気持ちで\n負けなければ、試合にも負けない。"}, {"t": 300.4166666666667, "x": "小坂の指導の根っこには、\nこの考え方があると伝えられている。"}, {"t": 304.8833333333333, "x": "和歌山の智弁とは、甲子園でぶつかったことはあるの？"}, {"t": 308.2, "x": "公式戦で最初にぶつかったのは、\n1995年の秋の近畿大会だ。"}, {"t": 313.1666666666667, "x": "準々決勝で、和歌山が5対0で勝っている。"}, {"t": 316.26666666666665, "x": "あのベスト4の夏のすぐあとね。"}, {"t": 318.3833333333333, "x": "甲子園での初めての対戦は\n2002年の夏。3回戦だった。"}, {"t": 322.48333333333335, "x": "結果は智辯和歌山が7対3で勝った。"}, {"t": 325.0833333333333, "x": "和歌山はその夏、決勝まで進んで準優勝している。"}, {"t": 328.65, "x": "最初の兄弟対決は、弟が勝ったのね。"}, {"t": 331.68333333333334, "x": "ああ。その4年後の2006年、\n小坂が智弁学園の監督になった。"}, {"t": 336.05, "x": "1995年の主将が、今度はベンチから\n指揮をとることになったんだ。"}, {"t": 340.81666666666666, "x": "自分がいた学校の監督になったのね。"}, {"t": 343.4, "x": "2014年の春には、のちに巨人に入る岡本和真がいた。"}, {"t": 347.3666666666667, "x": "1回戦の三重戦で、バックスクリーンへの1本を\n含む2本のホームランを打っている。"}, {"t": 352.2, "x": "1試合に2本も？"}, {"t": 353.6166666666667, "x": "ああ。スタンドにはプロのスカウトも来ていて、\n岡本の打席を見ていたと伝えられている。"}, {"t": 358.71666666666664, "x": "ただ2回戦は栃木の佐野日大に、\n延長10回のサヨナラで敗れた。"}, {"t": 363.15, "x": "あの岡本選手がいても、優勝は簡単じゃないのね。"}, {"t": 367.03333333333336, "x": "そして2016年の春。"}, {"t": 368.73333333333335, "x": "第88回のセンバツだ。"}, {"t": 370.75, "x": "エースの村上は、1回戦の福井工大福井を\n9回無失点に抑えた。"}, {"t": 375.23333333333335, "x": "2回戦の鹿児島実は1失点。"}, {"t": 377.3, "x": "準々決勝の滋賀学園には、\nヒットを2本しか許さなかった。"}, {"t": 381.4166666666667, "x": "ほとんど点を取られていないじゃない。"}, {"t": 383.43333333333334, "x": "ああ。準々決勝までの3試合、\nすべて1人で投げ切っている。"}, {"t": 387.3, "x": "準決勝は3月30日。"}, {"t": 389.1666666666667, "x": "相手は京都の龍谷大平安だった。"}, {"t": 391.56666666666666, "x": "平安は2年前のセンバツで優勝した学校だ。"}, {"t": 394.5, "x": "平安の1点は、エラーがからんで入ったものだった。"}, {"t": 397.6, "x": "それでも村上は「エラーよりも、\n僕が悪すぎた」と、自分の投球を責めている。"}, {"t": 402.55, "x": "智弁学園は0対1のまま、9回の裏を迎えた。"}, {"t": 406.01666666666665, "x": "あと1回しかないのね。"}, {"t": 407.6166666666667, "x": "このとき村上は、ベンチの前で\nキャッチボールをしていた。"}, {"t": 410.8833333333333, "x": "延長に備えていたんだ。"}, {"t": 412.3, "x": "あとで「延長、あると\n思ってましたから」と話している。"}, {"t": 416.0, "x": "まだ投げるつもりだったのね。"}, {"t": 417.8, "x": "ところが1アウトから4本続けてヒットが出た。"}, {"t": 420.68333333333334, "x": "最後は1番打者の2点タイムリーで、\n2対1の逆転サヨナラだ。"}, {"t": 424.8, "x": "キャッチボールしてた人が、\nそのまま決勝に行っちゃったのね。"}, {"t": 428.4166666666667, "x": "ああ。この勝利で、1977年の春と\n1995年の夏のベスト4を上回った。"}, {"t": 434.6166666666667, "x": "学校として初めての決勝だった。"}, {"t": 437.05, "x": "宿舎ではどんなふうに過ごしていたの？"}, {"t": 439.3833333333333, "x": "粘り強さが目標で、毎朝納豆を2\nパック食べるのが決まりだったそうだ。"}, {"t": 443.8333333333333, "x": "村上は納豆が苦手だったが、\n気合いで食べていたという。"}, {"t": 447.31666666666666, "x": "粘りって、そういう意味もあったのね。"}, {"t": 449.65, "x": "そして翌日の決勝。相手の高松商は、\n前の年の秋に神宮大会で優勝していた。"}, {"t": 455.31666666666666, "x": "勝てば56年ぶりの春の優勝という、四国の古豪だ。"}, {"t": 458.9166666666667, "x": "試合は1対1のまま延長に入り、\n11回の裏、あの一打が出た。"}, {"t": 463.23333333333335, "x": "高松商のショートが中継してホームへ\n投げたが、わずかに届かなかった。"}, {"t": 467.56666666666666, "x": "高松商の監督は試合のあと、「選手たちは\nよくやったと思っています」と話した。"}, {"t": 472.73333333333335, "x": "そして「勝つつもりでやってましたから」と、\n選手の悔しさを思いやっている。"}, {"t": 477.43333333333334, "x": "相手も本気で日本一を狙っていたのね。"}, {"t": 480.1, "x": "5試合で投げたのは47イニング、669球。"}, {"t": 483.76666666666665, "x": "打たれたヒットは33本で、自責点は2。"}, {"t": 486.56666666666666, "x": "防御率は0.38だった。"}, {"t": 488.76666666666665, "x": "最後は自分で打って勝つなんて、まさにエースね。"}, {"t": 491.73333333333335, "x": "村上はそのあと大学を経て、\n2020年に阪神から指名されている。"}, {"t": 496.85, "x": "日本一になったあとは、どうなったの？"}, {"t": 499.31666666666666, "x": "次に大きく動いたのは2020年の秋だ。"}, {"t": 502.06666666666666, "x": "この秋の奈良大会の決勝で、\n智弁学園は天理に2対8で敗れている。"}, {"t": 506.5833333333333, "x": "だから近畿大会には、奈良の2位として出た。"}, {"t": 509.55, "x": "2位からのスタートなのね。"}, {"t": 511.21666666666664, "x": "ところがそこから滋賀学園、\n龍谷大平安、市和歌山を倒した。"}, {"t": 515.4166666666666, "x": "決勝は大阪桐蔭に7対3。"}, {"t": 517.3833333333333, "x": "9年ぶりの近畿の頂点だった。"}, {"t": 519.7, "x": "大阪桐蔭にも勝ったの？"}, {"t": 521.4666666666667, "x": "ああ。秋の公式戦は8勝1敗。"}, {"t": 523.6666666666666, "x": "負けたのは天理との1試合だけだ。"}, {"t": 525.8833333333333, "x": "小坂は「選手の力自体は今年の方が\n絶対にある」と話している。"}, {"t": 530.5333333333333, "x": "2016年より強いって、監督が言ったのね。"}, {"t": 533.7666666666667, "x": "ただ翌2021年の春は、準々決勝で\n大分の明豊に4対6で敗れた。"}, {"t": 538.9666666666667, "x": "その年の夏に、智弁学園は\n初めての景色を見ることになる。"}, {"t": 543.5166666666667, "x": "2021年の夏。第103回の全国高校野球選手権だ。"}, {"t": 548.0166666666667, "x": "1回戦は岡山の倉敷商に10対3。"}, {"t": 550.7166666666667, "x": "8月21日の2回戦は、神奈川の横浜に5対0で勝った。"}, {"t": 555.1333333333333, "x": "8月25日の3回戦は、山梨の日本航空に7対1だ。"}, {"t": 559.7166666666667, "x": "打って勝ってるのね。"}, {"t": 561.05, "x": "ああ。1回戦から1試合も欠かさず、\n2桁のヒットを打っていた。"}, {"t": 565.15, "x": "8月26日の準々決勝。"}, {"t": 567.35, "x": "相手は高知の明徳義塾だった。"}, {"t": 569.5333333333333, "x": "智弁学園は1対2の1点差で、9回の裏を迎えた。"}, {"t": 573.1333333333333, "x": "ノーアウト一塁。2番打者はバントの構えを見せた。"}, {"t": 576.3, "x": "まずは送りバントよね。"}, {"t": 577.8, "x": "ところがそこからバットを引いて打った。"}, {"t": 579.8, "x": "打球はセンター前に抜けた。"}, {"t": 581.75, "x": "えっ、打っちゃったの？"}, {"t": 583.2, "x": "明徳義塾の監督は、試合のあとでこう話した。"}, {"t": 586.4166666666666, "x": "2番のバスターは想定外だった。"}, {"t": 588.3333333333334, "x": "送ってきたら4番は敬遠するつもりだったと。"}, {"t": 591.25, "x": "作戦の読み合いだったのね。"}, {"t": 593.1166666666667, "x": "そのあとデッドボールが2つあり、\n押し出しで同点になった。"}, {"t": 596.5166666666667, "x": "最後は5番の一打がライト前へ。"}, {"t": 598.3666666666667, "x": "3対2のサヨナラ勝ちだ。"}, {"t": 600.15, "x": "夏のベスト4は、1995年以来26年ぶりだった。"}, {"t": 604.4833333333333, "x": "小坂さんが主将だった年以来ね！"}, {"t": 606.8, "x": "8月28日の準決勝は、京都国際に3対1。"}, {"t": 610.6666666666666, "x": "智弁学園はついに、夏の決勝のグラウンドに立った。"}, {"t": 614.6, "x": "決勝の相手は、もしかして……。"}, {"t": 616.6833333333333, "x": "ああ。和歌山の智辯和歌山だった。"}, {"t": 618.9333333333333, "x": "夏の甲子園の決勝が\n智弁同士になるのは、これが初めてだ。"}, {"t": 622.7666666666667, "x": "甲子園で2校がぶつかるのも、\n2002年以来19年ぶりの2度目だった。"}, {"t": 627.3833333333333, "x": "見ている人は、どっちがどっちか分かったの？"}, {"t": 630.1166666666667, "x": "そこもよく話題になった。"}, {"t": 631.5666666666667, "x": "両校とも、ユニフォームの「智弁」の文字は朱赤だ。"}, {"t": 634.9333333333333, "x": "メーカーが違うので、文字の形は少しだけ違う。"}, {"t": 638.0833333333334, "x": "左腕の校章の色は、奈良が\n濃い紺、和歌山が紫だった。"}, {"t": 642.05, "x": "本当に似てるのね。"}, {"t": 643.5, "x": "修学旅行の行き先も同じで、\n一緒に行く予定だと報じられていた。"}, {"t": 647.7166666666667, "x": "仲がいいのね。でも試合は真剣勝負ね。"}, {"t": 650.4333333333333, "x": "ああ。試合は1回に和歌山が4点を取った。"}, {"t": 653.2, "x": "智弁学園は2回に2点を返し、4対2と迫った。"}, {"t": 656.6333333333333, "x": "ただ和歌山は6回から9回まで、毎回点を重ねた。"}, {"t": 660.1833333333333, "x": "結果は2対9。智弁学園は準優勝だった。"}, {"t": 663.3333333333334, "x": "最後はまた、弟の智弁が勝ったのね。"}, {"t": 666.05, "x": "和歌山にとっては、21年ぶり3度目の夏の優勝だった。"}, {"t": 669.9166666666666, "x": "公式戦での2校の対戦は、これで\n和歌山の3勝2敗になった。"}, {"t": 674.05, "x": "智弁学園の2勝は、どちらも2019年の近畿大会だ。"}, {"t": 678.0, "x": "春の1回戦は9対7。"}, {"t": 679.7333333333333, "x": "秋の準々決勝は17対13だった。"}, {"t": 682.6666666666666, "x": "17対13？　2校で30点も入ったの？"}, {"t": 685.8333333333334, "x": "ああ。打ち合いになると、\nどちらも引かない2校なんだ。"}, {"t": 689.05, "x": "負けっぱなしじゃないのね。"}, {"t": 690.6666666666666, "x": "ああ。そして夏の準優勝は、\n智弁学園の夏の最高の成績になった。"}, {"t": 695.9666666666667, "x": "そのあとの夏は、どうだったの？"}, {"t": 698.0666666666667, "x": "2023年の夏は甲子園に出て、\n岩手の花巻東に2対5で敗れた。"}, {"t": 703.0166666666667, "x": "2024年の夏も2年続けて出場した。"}, {"t": 705.9666666666667, "x": "夏の甲子園は22度目だった。"}, {"t": 708.15, "x": "この夏は準々決勝まで勝ち進み、\n京都国際に0対4で敗れた。"}, {"t": 712.65, "x": "京都国際はそのまま勝ち続け、\nこの夏に初めて日本一になっている。"}, {"t": 717.3333333333334, "x": "2021年に準決勝で勝った相手ね。"}, {"t": 720.2166666666667, "x": "そうだ。そして2025年の夏は、\n奈良大会の決勝で天理に2対3で敗れた。"}, {"t": 725.6666666666666, "x": "あと1点で甲子園だったのね。"}, {"t": 727.7, "x": "ああ。奈良で勝つことの難しさは、\n今も変わっていない。"}, {"t": 731.7, "x": "そして今年、2026年の春。"}, {"t": 734.0666666666667, "x": "第98回のセンバツだ。"}, {"t": 736.0333333333333, "x": "智弁学園は1回戦で、岩手の花巻東に4対0で勝った。"}, {"t": 740.3, "x": "2回戦は鹿児島の神村学園。"}, {"t": 742.3333333333334, "x": "延長のタイブレークで2対1だった。"}, {"t": 744.6, "x": "準々決勝は埼玉の花咲徳栄。"}, {"t": 747.05, "x": "2回までに0対8と離された。"}, {"t": 749.4666666666667, "x": "8点差？　それはもう厳しいでしょ。"}, {"t": 751.75, "x": "ところが5回に試合をひっくり返し、12対8で勝った。"}, {"t": 755.4666666666667, "x": "8点差から逆転したの！？"}, {"t": 757.3666666666667, "x": "準決勝は愛知の中京大中京に、\n8回に勝ち越して2対1だ。"}, {"t": 761.6833333333333, "x": "2回戦から3試合続けての逆転勝ち。"}, {"t": 764.2, "x": "10年ぶりの決勝だった。"}, {"t": 766.1, "x": "まるで2016年の粘りが戻ってきたみたいね。"}, {"t": 769.2666666666667, "x": "決勝は3月31日。2016年に\n初めて勝った日と同じ日付だ。"}, {"t": 774.2833333333333, "x": "相手は大阪桐蔭。智弁学園のエースには、\n投げられる球数の壁もあった。"}, {"t": 779.0, "x": "球数の壁って？"}, {"t": 780.4166666666666, "x": "今の高校野球には、1週間で\n500球までという決まりがある。"}, {"t": 784.25, "x": "エースはこの時点で369球。"}, {"t": 786.55, "x": "残りは131球だった。"}, {"t": 788.7166666666667, "x": "決勝の1試合を投げ切れるかどうか、という数字ね。"}, {"t": 791.9666666666667, "x": "試合は3対7。智弁学園は春の準優勝になった。"}, {"t": 795.5, "x": "小坂は試合の前、相手を\n「全てのことにおいて隙がない」と評していた。"}, {"t": 800.05, "x": "そのうえで、決勝と思わず\n「5番目の相手が大阪桐蔭」という\n気持ちで臨むと話している。"}, {"t": 805.6833333333333, "x": "あくまで、いつもの1試合として戦ったのね。"}, {"t": 808.7166666666667, "x": "ただこの夏の奈良大会を\n勝ち抜いたのは、天理だった。"}, {"t": 812.6666666666666, "x": "最初の問いに戻るわね。"}, {"t": 814.0666666666667, "x": "どうして日本一まで51年もかかったの？"}, {"t": 817.0666666666667, "x": "1つの答えに決めることはできない。\nただ数字から見えることはある。"}, {"t": 820.95, "x": "まず、夏の甲子園に出るための道が狭かった。"}, {"t": 824.0, "x": "1977年までは和歌山と2県で1枚。\nそのあとも奈良には天理がいた。"}, {"t": 829.1166666666667, "x": "2020年の秋でさえ、奈良の決勝では\n天理に2対8で敗れている。"}, {"t": 833.6, "x": "まず奈良で勝つことが、いちばん大変だったのね。"}, {"t": 836.6833333333333, "x": "ああ。それでも智弁学園は const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
