<script>
const D={"name": "午前の決勝", "file": "037_編集用", "dur": 674.56665625, "segs": [], "subs": [{"t": 0.0, "x": "2011年8月20日、阪神甲子園球場。"}, {"t": 3.45, "x": "夏の全国大会の決勝が始まった。"}, {"t": 6.033333333333333, "x": "プレーボールは、午前9時31分だ。"}, {"t": 8.633333333333333, "x": "朝の9時半？　決勝なのにずいぶん早いのね。"}, {"t": 11.516666666666667, "x": "ああ。スタンドには4万7千人が入っていた。"}, {"t": 14.483333333333333, "x": "日本高等学校野球連盟は、大会ごとの出来事を\n「大会小史」にまとめている。"}, {"t": 19.8, "x": "その2011年の欄の最後に、こう書いてある。"}, {"t": 22.816666666666666, "x": "決勝も午前9時半開始と、\n史上初の「午前決勝」となった。"}, {"t": 27.283333333333335, "x": "史上初めて？　夏の大会って\n100年近く続いているわよね。"}, {"t": 31.3, "x": "2011年の大会は第93回だ。"}, {"t": 34.1, "x": "つまり92回分の夏、決勝は1度も\n午前に始まっていなかったことになる。"}, {"t": 39.083333333333336, "x": "決勝ってお昼すぎにやるものだと思っていたわ。"}, {"t": 42.0, "x": "その思い込みが、この年に初めて崩れた。"}, {"t": 44.88333333333333, "x": "でもどうして朝に始めることになったの？"}, {"t": 47.43333333333333, "x": "理由は大会小史に1つの言葉で\n書いてある。「節電」だ。"}, {"t": 51.28333333333333, "x": "節電って電気を使うのを控えることよね。"}, {"t": 54.06666666666667, "x": "そうだ。今回はこの決勝の時刻だけを追いかける。"}, {"t": 57.15, "x": "どんな年だったのか。なぜ朝になったのか。"}, {"t": 59.86666666666667, "x": "そしてそのあと決勝の時刻はどう動いたのか。"}, {"t": 62.65, "x": "始める前にチャンネル登録と高評価をお願いしたい。"}, {"t": 65.88333333333334, "x": "よろしくね。"}, {"t": 67.38333333333334, "x": "まず2011年がどんな1年だったかを確かめておこう。"}, {"t": 70.83333333333333, "x": "この年の3月11日に、東日本大震災が起きた。"}, {"t": 74.85, "x": "東北の太平洋側が、大きな被害を受けた地震ね。"}, {"t": 78.36666666666666, "x": "ああ。その少しあとに、春の選抜大会があった。"}, {"t": 81.65, "x": "日本高野連の選抜の大会小史に\nよると、開幕は震災の12日後だ。"}, {"t": 86.43333333333334, "x": "開会式の入場行進は取りやめた。"}, {"t": 88.78333333333333, "x": "太鼓やラッパを使う鳴り物の応援も禁止した。"}, {"t": 91.78333333333333, "x": "春の甲子園はとても静かだったのね。"}, {"t": 94.26666666666667, "x": "スローガンは「がんばろう！日本」。"}, {"t": 96.35, "x": "被災した人と救助や支援にあたる人を\n応援する大会とした、と書いてある。"}, {"t": 101.06666666666666, "x": "じゃあ夏の大会はどうだったの？"}, {"t": 103.06666666666666, "x": "夏も同じ「がんばろう！"}, {"t": 104.46666666666667, "x": "日本」をスローガンにした。"}, {"t": 106.3, "x": "被災地を支える大会として、\n義援金を集める募金の活動もした。"}, {"t": 110.68333333333334, "x": "春と夏で同じ言葉を掲げたのね。"}, {"t": 113.16666666666667, "x": "夏の大会は8月6日に始まり、\n8月20日に決勝を迎えた。"}, {"t": 117.61666666666666, "x": "日程はおよそ2週間だ。"}, {"t": 119.43333333333334, "x": "その2週間の中で、\n試合の時刻の決め方が変わったってこと？"}, {"t": 123.53333333333333, "x": "そういうことだ。ただその前に\n1つ見ておきたいものがある。"}, {"t": 126.91666666666667, "x": "甲子園の明かりの話だ。"}, {"t": 129.25, "x": "明かりって夜に球場を照らす大きなライトのこと？"}, {"t": 132.21666666666667, "x": "ああ。大会小史では「照明」や\n「点灯」と書かれている。"}, {"t": 136.03333333333333, "x": "甲子園に夜の照明の塔ができたのは、\n1956年の5月だ。"}, {"t": 140.56666666666666, "x": "その夏の大会では、第1日の第3試合で、\n初めてのナイターがあった。"}, {"t": 145.35, "x": "1956年の夏から、夜でも\n試合ができるようになったのね。"}, {"t": 149.78333333333333, "x": "春の選抜では1958年の興国商と\n坂出商の試合が、初めてのナイターだった。"}, {"t": 155.73333333333332, "x": "選抜の大会小史は、これを\n大会史上初のナイターと書いている。"}, {"t": 159.88333333333333, "x": "明かりができたおかげで、暗くなっても\n最後まで試合ができるのね。"}, {"t": 163.76666666666668, "x": "そうだ。試合が長引いても、\n明かりをつければ続けられる。"}, {"t": 167.2, "x": "1956年から2011年までで、55年がたっている。"}, {"t": 171.66666666666666, "x": "明かりは甲子園にとって\n当たり前のものになっていたのね。"}, {"t": 174.95, "x": "ところが2011年の夏は、その明かりが問題になった。"}, {"t": 178.8, "x": "明かりが問題？　どういうこと？"}, {"t": 180.75, "x": "明かりをつければ、電気を使う。"}, {"t": 182.71666666666667, "x": "そしてこの夏は電気そのものが\n足りなくなるかもしれなかった。"}, {"t": 186.93333333333334, "x": "大会小史はまず電気の事情から書いている。"}, {"t": 189.56666666666666, "x": "原発の事故がもとになって、\n電気が足りなくなる心配があった。"}, {"t": 193.6, "x": "震災のあとの夏は、あちこちで電気を控えていたのね。"}, {"t": 197.13333333333333, "x": "ああ。そこで甲子園でも節電の工夫をした。"}, {"t": 199.86666666666667, "x": "大会小史の言葉では\n「点灯時間を極力避けるため」だ。"}, {"t": 203.91666666666666, "x": "明かりをつける時間を、なるべく\n短くしたいってことね。"}, {"t": 207.36666666666667, "x": "そうだ。試合を早く始めて、\n明るいうちに終わらせようとした。"}, {"t": 211.13333333333333, "x": "決めた時刻は2つある。"}, {"t": 212.71666666666667, "x": "1つ目。準決勝までは\nその日の第1試合を午前8時に始める。"}, {"t": 217.08333333333334, "x": "朝の8時に1試合目なのね。"}, {"t": 219.18333333333334, "x": "2つ目。決勝は午前9時半に始める。"}, {"t": 222.0, "x": "決勝が9時半。それが\nさっきの9時31分のプレーボールね。"}, {"t": 225.96666666666667, "x": "そういうことだ。予定の9時半から、\nほぼそのまま始まった。"}, {"t": 229.83333333333334, "x": "朝から始めれば、暗くなる前に終わりやすいものね。"}, {"t": 233.11666666666667, "x": "ああ。ねらいは明かりをつける時間を減らすことだ。"}, {"t": 235.9, "x": "この夏の大会小史には、長い\n試合の記録も書いてある。"}, {"t": 239.43333333333334, "x": "延長戦になった試合が8つあり、\nこれは大会のタイ記録だった。"}, {"t": 243.46666666666667, "x": "延長が多いと1日の終わりはどんどん遅くなりそうね。"}, {"t": 246.7, "x": "ああ。如水館という学校は、\n延長戦を3試合続けて戦った。"}, {"t": 250.95, "x": "春と夏の大会を通して、\n3試合続けての延長戦は初めてだったという。"}, {"t": 255.8, "x": "長い試合が多い夏に、朝から始める\n決まりが重なったのね。"}, {"t": 259.7, "x": "ただしどの日に明かりをつけたかまでは、\n大会小史には書いていない。"}, {"t": 263.51666666666665, "x": "書いてあるのは、点灯時間を避けるために\n時刻を早めた、ということだ。"}, {"t": 267.9166666666667, "x": "決まりの理由は、よく分かったわ。"}, {"t": 270.56666666666666, "x": "ではその決勝の日を見ていこう。"}, {"t": 272.45, "x": "2011年8月20日。"}, {"t": 274.3333333333333, "x": "第93回大会の最後の日だ。"}, {"t": 276.75, "x": "顔合わせは西東京の日大三と、青森の光星学院。"}, {"t": 280.4, "x": "光星学院は青森の学校として\n42年ぶりに決勝まで進んだ。"}, {"t": 284.8, "x": "42年前にも青森の学校が決勝に出ていたの？"}, {"t": 288.21666666666664, "x": "ああ。1969年の第51回大会の三沢だ。"}, {"t": 292.1, "x": "大会小史はその三沢以来と書いている。"}, {"t": 294.6666666666667, "x": "青森にとっては、久しぶりの決勝だったのね。"}, {"t": 297.78333333333336, "x": "日本経済新聞は、この日の試合をこう伝えている。"}, {"t": 300.95, "x": "午前9時31分にプレーボール。"}, {"t": 302.96666666666664, "x": "観衆は超満員の4万7千人。"}, {"t": 305.35, "x": "電力の事情に配慮して、史上初めて\n午前に始まる決勝になった、と。"}, {"t": 310.15, "x": "朝の9時半なのに、スタンドがいっぱいだったのね。"}, {"t": 313.28333333333336, "x": "ああ。観る人も朝早くから\n球場に集まっていたことになる。"}, {"t": 316.9166666666667, "x": "点数は11対0。日大三が\n10年ぶり2度目の優勝を果たした。"}, {"t": 321.3666666666667, "x": "試合の中身はどうだったの？"}, {"t": 323.1666666666667, "x": "日大三と光星学院のことは、\nそれぞれ前の回でくわしく話した。"}, {"t": 327.46666666666664, "x": "今回は試合の中身には入らない。"}, {"t": 329.45, "x": "主役は時刻だからな。"}, {"t": 331.2, "x": "じゃあ時刻の話に戻りましょう。"}, {"t": 333.26666666666665, "x": "大会小史の2011年の欄には、\nいくつかのことが並んでいる。"}, {"t": 337.3666666666667, "x": "優勝した学校。42年ぶりの決勝。"}, {"t": 340.01666666666665, "x": "8つの延長戦。被災地を支える募金。"}, {"t": 342.68333333333334, "x": "そして最後の1文が、午前8時と\n午前9時半、史上初の午前決勝だ。"}, {"t": 347.6333333333333, "x": "どこが勝ったかと同じ欄に、\n始まった時刻も書かれたのね。"}, {"t": 351.43333333333334, "x": "ああ。震災の年だったことが、\n試合の時刻にまで表れている。"}, {"t": 355.43333333333334, "x": "決勝の時刻って、ふだんはあまり気にしないものね。"}, {"t": 358.65, "x": "だからこそこの1文は目に止まる。"}, {"t": 361.4, "x": "じゃあ午前でない決勝は、\nふだんはいつごろ始まっていたの？"}, {"t": 364.9, "x": "それが分かる1文が、5年後の大会小史にある。"}, {"t": 368.0, "x": "2016年、第98回大会の欄だ。"}, {"t": 371.06666666666666, "x": "リオデジャネイロのオリンピックのテレビ中継の\n関係で、決勝の時刻を動かした。"}, {"t": 375.7, "x": "例年より1時間遅らせて、\n午後2時に始めた、と書いてある。"}, {"t": 379.68333333333334, "x": "例年より1時間遅くて\n午後2時。ということは例年は午後1時ね。"}, {"t": 383.85, "x": "そうだ。そのころの決勝は、午後1時に\n始まるのが例年だったと分かる。"}, {"t": 388.3833333333333, "x": "午後1時と比べると、2011年の9時半は\n3時間半も早いのね。"}, {"t": 393.06666666666666, "x": "ああ。お昼の時刻から、朝の時刻へ\n大きく前に動いたわけだ。"}, {"t": 396.95, "x": "ただし2011年より前の決勝の時刻は、\nここでは言わない。"}, {"t": 400.78333333333336, "x": "確かめられたのは、2016年の欄にある\n「例年」という言葉までだ。"}, {"t": 405.48333333333335, "x": "それでも決勝はお昼すぎ、という\nわたしの思い込みは合っていたのね。"}, {"t": 409.43333333333334, "x": "ああ。大会小史の書き方からも、そう読める。"}, {"t": 412.5, "x": "2016年はオリンピックのために遅らせたのね。"}, {"t": 415.65, "x": "そうだ。2011年は電気のために早めた。"}, {"t": 418.53333333333336, "x": "2016年はテレビのために遅らせた。"}, {"t": 421.25, "x": "決勝の時刻って、野球の外の事情でも動くのね。"}, {"t": 425.23333333333335, "x": "ではそのあとはどうなったか。"}, {"t": 426.71666666666664, "x": "大会小史に時刻が書かれた年を順に見る。"}, {"t": 429.55, "x": "まずは2021年。第103回大会だ。"}, {"t": 432.56666666666666, "x": "この夏は雨が続き、決勝は\n4日遅れて8月29日になった。"}, {"t": 436.93333333333334, "x": "大会小史は決勝が史上いちばん\n遅くなった、と書いている。"}, {"t": 440.68333333333334, "x": "あれ？　それも「史上」の記録なのね。"}, {"t": 443.35, "x": "ああ。ただしこっちは日付の話だ。"}, {"t": 445.5, "x": "始める時刻の話ではない。"}, {"t": 447.5833333333333, "x": "2011年は時刻が早くなって、\n2021年は日にちが遅くなったのね。"}, {"t": 452.71666666666664, "x": "向きのちがう2つの記録だ。"}, {"t": 454.7, "x": "そのころの夏で、ほかに時刻に\n関わりそうな話はあるの？"}, {"t": 458.43333333333334, "x": "大会小史を読むと、年を追うごとに\n増えていく言葉がある。「暑さ」だ。"}, {"t": 462.7, "x": "少しさかのぼって、2018年の欄を見てみよう。"}, {"t": 466.0, "x": "熱中症の対策として、開会式の途中に\n選手が水を飲む時間を設けた。"}, {"t": 470.8833333333333, "x": "学校の応援団には、細かい\n霧を出す機械を貸し出した。"}, {"t": 474.55, "x": "開会式の途中でも、水を飲む時間が要るのね。"}, {"t": 477.76666666666665, "x": "次の2019年の欄にも、暑さの対策が並んでいる。"}, {"t": 481.5, "x": "球場の中の通路に、エアコンを増やした。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
