<script>
const D={"name": "夏の優勝7回", "file": "039_編集用", "dur": 856.81665625, "segs": [], "subs": [{"t": 0.0, "x": "夏の甲子園でいちばん多く優勝している学校ってどこ？"}, {"t": 3.316666666666667, "x": "やっぱり、最近よく勝っている大阪桐蔭かしら。"}, {"t": 6.483333333333333, "x": "大阪桐蔭は5回だ。多いがいちばんではない。"}, {"t": 9.233333333333333, "x": "いちばん多いのは、愛知の中京大中京。"}, {"t": 11.7, "x": "夏の優勝は7回だ。"}, {"t": 13.516666666666667, "x": "7回も勝ってるの？"}, {"t": 15.0, "x": "ああ。しかも2位の学校と並んでいない。"}, {"t": 17.216666666666665, "x": "7回は1校だけだ。"}, {"t": 18.8, "x": "日本高野連の大会小史にも、2009年の夏に\n「史上最多となる7度目」を果たしたと書いてある。"}, {"t": 25.35, "x": "その7回はいつごろ勝ったの？"}, {"t": 27.366666666666667, "x": "最初の優勝は1931年。"}, {"t": 29.716666666666665, "x": "最後の7回目は2009年だ。"}, {"t": 31.95, "x": "間は78年ある。"}, {"t": 33.71666666666667, "x": "78年もかけて7回なのね。"}, {"t": 36.18333333333333, "x": "今回は、この7回の優勝を、年と\n決勝の点数で1つずつ並べていく。"}, {"t": 41.0, "x": "途中で、最多の座を広島商と\n追いかけ合った流れも見る。"}, {"t": 44.53333333333333, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 47.96666666666667, "x": "よろしくね。"}, {"t": 49.46666666666667, "x": "まずいまの数を確かめておこう。"}, {"t": 51.36666666666667, "x": "阪神甲子園球場の「歴代優勝校」の表を使う。"}, {"t": 54.93333333333333, "x": "この表で5回以上勝っている学校は3つしかない。"}, {"t": 57.86666666666667, "x": "中京大中京が7回。広島商が6回。"}, {"t": 60.766666666666666, "x": "大阪桐蔭が5回だ。"}, {"t": 62.46666666666667, "x": "7回と6回と5回。1回ずつ差があるのね。"}, {"t": 65.6, "x": "そうだ。大阪桐蔭の5回は、\n1991年から2018年までの5回だ。"}, {"t": 71.11666666666666, "x": "広島商の6回は、1924年から1988年までに積んだ。"}, {"t": 76.36666666666666, "x": "中京大中京の7回は、1931年から2009年までになる。"}, {"t": 81.41666666666667, "x": "中京大中京と広島商は、\nずいぶん前から勝っていたのね。"}, {"t": 85.38333333333334, "x": "ああ。2026年の夏は第108回だった。"}, {"t": 88.45, "x": "優勝は和歌山の智辯和歌山だ。"}, {"t": 90.65, "x": "日本高野連のページには5年ぶり4度目の優勝とある。"}, {"t": 93.95, "x": "この2026年の大会が終わっても、\n7回はまだ中京大中京だけだ。"}, {"t": 98.95, "x": "いちばん多い学校はずっと変わってないのね。"}, {"t": 101.51666666666667, "x": "ここで1つ、名前のことを話しておく。"}, {"t": 104.08333333333333, "x": "表を見ると、中京大中京の名前は\n2009年の1回しか出てこない。"}, {"t": 108.6, "x": "えっ、7回じゃないの？"}, {"t": 110.25, "x": "残りの6回は「中京商」という名前で載っている。"}, {"t": 113.48333333333333, "x": "学校の歴史のページによると、1923年に\n中京商業学校として開校した。"}, {"t": 119.13333333333334, "x": "1947年に中京商業高等学校、\n1967年に中京高校と名前が変わった。"}, {"t": 125.86666666666666, "x": "そして1995年に、いまの中京大中京になった。"}, {"t": 129.98333333333332, "x": "名前が4回も変わってるのね。"}, {"t": 132.0, "x": "大会小史は、2009年の優勝を\n「中京商時代を含め」7度目と書いている。"}, {"t": 137.25, "x": "名前が違っても、同じ学校として数えているわけだ。"}, {"t": 141.25, "x": "では1回目から見ていく。"}, {"t": 142.83333333333334, "x": "1931年の第17回。"}, {"t": 145.23333333333332, "x": "地方の大会に出た学校は634校。"}, {"t": 148.1, "x": "全国に出たのは22校だった。"}, {"t": 150.4, "x": "中京商はその22校の1つだ。"}, {"t": 152.9, "x": "その年の春はどうだったの？"}, {"t": 154.78333333333333, "x": "高校野球ドットコムの記事によると、\n1931年の春の大会で中京商は決勝まで行った。"}, {"t": 161.13333333333333, "x": "決勝の相手は広島商。そこで負けている。"}, {"t": 164.08333333333334, "x": "広島商って、さっきの6回の学校よね。"}, {"t": 167.11666666666667, "x": "そうだ。この2校は、このころから顔を合わせていた。"}, {"t": 170.23333333333332, "x": "そして同じ年の夏、中京商は決勝で\n台湾の嘉義農林に4対0で勝った。"}, {"t": 175.25, "x": "これが夏の1回目の優勝だ。"}, {"t": 177.33333333333334, "x": "嘉義農林はショートでも出てきた学校ね。"}, {"t": 179.85, "x": "ああ。くわしくはそちらで話した。"}, {"t": 181.9, "x": "この1931年の夏は、球場にも1つ変化があった。"}, {"t": 186.11666666666667, "x": "大会小史には「アルプススタンドにも\n大屋根できる」とある。"}, {"t": 189.8, "x": "屋根ができた夏に、初めて勝ったのね。"}, {"t": 192.46666666666667, "x": "春は決勝で負けて、夏は\n決勝で勝った。同じ年の話だ。"}, {"t": 196.61666666666667, "x": "2回目は次の1932年の第18回だ。"}, {"t": 200.03333333333333, "x": "地方の大会に出た学校は660校。"}, {"t": 202.7, "x": "前の年より26校多い。"}, {"t": 204.56666666666666, "x": "大会小史によると、この年から\n地方の大会が2段階になった。"}, {"t": 208.68333333333334, "x": "まず府県ごとの第1次の大会。"}, {"t": 210.6, "x": "次に地区ごとの第2次の大会だ。"}, {"t": 212.98333333333332, "x": "全国に出るまでの道が長くなったのね。"}, {"t": 215.66666666666666, "x": "その年、中京商はまた全国に出てきた。"}, {"t": 218.51666666666668, "x": "決勝の相手は愛媛の松山商。"}, {"t": 220.53333333333333, "x": "4対3、1点差の勝ちだった。"}, {"t": 222.93333333333334, "x": "2年続けての優勝ね。"}, {"t": 224.7, "x": "3回目が1933年の第19回。"}, {"t": 227.68333333333334, "x": "参加は671校だった。"}, {"t": 229.93333333333334, "x": "決勝は平安中に2対1で勝った。"}, {"t": 232.38333333333333, "x": "ここも1点差なのね。"}, {"t": 233.98333333333332, "x": "平安中はいまの龍谷大平安だ。\nこの学校も前の本編で取り上げた。"}, {"t": 238.46666666666667, "x": "この大会の準決勝が、明石中との延長25回の試合だ。"}, {"t": 242.53333333333333, "x": "その一日のことは、前の本編でくわしく話した。"}, {"t": 245.98333333333332, "x": "あの延長25回の夏に、優勝もしていたのね。"}, {"t": 249.26666666666668, "x": "大会小史は、1933年のところにこう書いている。"}, {"t": 253.13333333333333, "x": "中京商が「3連勝」を達成した、とある。"}, {"t": 256.4, "x": "3年続けて夏の日本一になったのね。"}, {"t": 259.28333333333336, "x": "同じ1933年の欄には「審判は4人制に」ともある。"}, {"t": 263.6666666666667, "x": "審判が4人になった夏に、3連覇が決まったわけだ。"}, {"t": 267.25, "x": "大会の決まりもいろいろ変わった夏なのね。"}, {"t": 270.43333333333334, "x": "夏に3年続けて勝った学校って、ほかにもいるの？"}, {"t": 273.9166666666667, "x": "阪神甲子園球場の表で、同じ名前が\n3年続けて並ぶところを探してみる。"}, {"t": 278.93333333333334, "x": "あるのは、1931年から1933年の中京商だけだ。"}, {"t": 283.98333333333335, "x": "1か所だけなのね。"}, {"t": 285.4, "x": "2年続けてならほかにもある。"}, {"t": 287.3, "x": "和歌山中は1921年と1922年。"}, {"t": 290.75, "x": "広島商は1929年と1930年に続けて勝った。"}, {"t": 295.45, "x": "でも、どの学校も3年目は勝っていない。"}, {"t": 298.15, "x": "3年目がむずかしいのね。"}, {"t": 299.93333333333334, "x": "いちばん近づいたのは、2006年の駒大苫小牧だ。"}, {"t": 303.4166666666667, "x": "大会小史には「史上2校目の3連覇を目指した\n駒大苫小牧は準優勝に終わった」とある。"}, {"t": 309.28333333333336, "x": "史上2校目ってことは、1校目は中京商なのね。"}, {"t": 312.6166666666667, "x": "そうだ。駒大苫小牧の話も、前の本編で取り上げた。"}, {"t": 316.45, "x": "1933年から2026年まで、\n夏の3連覇は1校目のままだ。"}, {"t": 322.2, "x": "ここからは最多の座の動きを見ていく。"}, {"t": 324.43333333333334, "x": "中京商が勝ち始める前は、広島商が先を走っていた。"}, {"t": 328.28333333333336, "x": "広島商は1924年の第10回で初めて優勝した。"}, {"t": 332.35, "x": "そのあと1929年と1930年にも勝って、3回になった。"}, {"t": 337.46666666666664, "x": "1930年の時点では、広島商がいちばん多かったのね。"}, {"t": 341.71666666666664, "x": "ああ。表で3回以上勝った\n学校は、そのころ広島商だけだ。"}, {"t": 345.7, "x": "そこへ中京商が1931年から3つ続けて勝った。"}, {"t": 349.85, "x": "1933年で中京商も3回。並んだのね。"}, {"t": 353.7, "x": "そうだ。そして1937年の第23回、\n中京商が4回目の優勝をする。"}, {"t": 359.3333333333333, "x": "決勝は熊本工に3対1だった。"}, {"t": 361.8333333333333, "x": "これで中京商が1つ前に出たのね。"}, {"t": 364.35, "x": "ああ。ここから中京商の単独の1位が始まる。"}, {"t": 367.3666666666667, "x": "5回目は戦後の1954年、第36回だ。"}, {"t": 370.98333333333335, "x": "決勝は静岡商に3対0で勝った。"}, {"t": 373.6, "x": "4回目から17年あいたのね。"}, {"t": 375.8333333333333, "x": "参加した学校の数もずいぶん変わっていた。"}, {"t": 378.46666666666664, "x": "1937年は654校。"}, {"t": 381.15, "x": "1954年は1705校だ。"}, {"t": 383.98333333333335, "x": "2倍半くらいに増えてるのね。"}, {"t": 385.9166666666667, "x": "出場校一覧を見ると、中京商はこのあとも\n愛知の代表に続けて入っている。"}, {"t": 390.81666666666666, "x": "1955年、1956年、そして1958年だ。"}, {"t": 395.76666666666665, "x": "ただ、この3回は優勝していない。"}, {"t": 398.01666666666665, "x": "広島商も追ってくる。"}, {"t": 399.3666666666667, "x": "1957年の第39回で、法政二に3対1で勝った。"}, {"t": 404.01666666666665, "x": "これで広島商は4回。"}, {"t": 405.53333333333336, "x": "中京商とは1つ差まで来た。"}, {"t": 407.73333333333335, "x": "じわじわ追いかけてくるのね。"}, {"t": 409.5, "x": "中京商はまた離す。6回目は1966年の第48回だ。"}, {"t": 414.4166666666667, "x": "決勝の相手はまた松山商だった。"}, {"t": 416.56666666666666, "x": "3対1で勝っている。"}, {"t": 418.2, "x": "1932年と同じ相手ね。"}, {"t": 420.71666666666664, "x": "この年は春と夏の両方で優勝した年でもある。"}, {"t": 423.8, "x": "大会小史には「2回目の春夏連続優勝、\n優勝も6回目」とある。"}, {"t": 428.53333333333336, "x": "春夏連覇の話は、前の本編でくわしく話した。"}, {"t": 432.15, "x": "これで6回対4回。また2つ差になったのね。"}, {"t": 435.35, "x": "広島商は、1973年の第55回で5回目を取る。"}, {"t": 439.48333333333335, "x": "決勝は静岡に3対2だった。"}, {"t": 441.6666666666667, "x": "そして1988年の第70回。"}, {"t": 444.53333333333336, "x": "広島商は福岡第一に1対0で勝った。"}, {"t": 447.5833333333333, "x": "これで広島商も6回ね。"}, {"t": 449.53333333333336, "x": "大会小史の1988年のところには、こう書いてある。"}, {"t": 453.56666666666666, "x": "「広島商が6度目の優勝、中京に並ぶ」。"}, {"t": 456.56666666666666, "x": "公式の記録にも「並ぶ」って書いてあるのね。"}, {"t": 459.6333333333333, "x": "ああ。中京商の単独の1位は、\n1937年から1988年まで51年続いた。"}, {"t": 466.4166666666667, "x": "1988年からは、2校が6回で並んだ。"}, {"t": 470.65, "x": "広島商の6回の決勝も点数を見てみたいわ。"}, {"t": 473.8333333333333, "x": "出場校一覧で並べてみよう。"}, {"t": 475.8666666666667, "x": "1924年は松本商に3対0。"}, {"t": 478.6666666666667, "x": "1929年は海草中に3対0。"}, {"t": 481.71666666666664, "x": "1930年は諏訪蚕糸に8対2。"}, {"t": 484.46666666666664, "x": "1957年は法政二に3対1。"}, {"t": 487.2, "x": "1973年は静岡に3対2。"}, {"t": 490.1166666666667, "x": "そして1988年は福岡第一に1対0だ。"}, {"t": 494.0, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
