<title>西条</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

<script>
const D={"name": "西条", "file": "024_編集用", "dur": 960.9, "segs": [], "subs": [{"t": 0.0, "x": "1959年8月18日。"}, {"t": 2.566666666666667, "x": "兵庫県の甲子園球場。"}, {"t": 4.316666666666666, "x": "夏の全国大会の決勝は、延長戦に入っていた。"}, {"t": 7.816666666666666, "x": "スコアは2対2。4回の裏から\n先は、どちらにも点が入らない。"}, {"t": 12.016666666666667, "x": "4回からずっと、0点同士なの？"}, {"t": 14.45, "x": "そうだ。9回が終わっても動かない。"}, {"t": 16.7, "x": "10回、11回、12回。"}, {"t": 18.65, "x": "スコアボードに0が並んでいった。"}, {"t": 20.7, "x": "14回が終わっても、まだ2対2のままだった。"}, {"t": 23.766666666666666, "x": "普通の試合より、もう5回も長いじゃない。"}, {"t": 26.383333333333333, "x": "マウンドにいたのは、愛媛の公立校のエースだ。"}, {"t": 29.216666666666665, "x": "この夏のチームの4つの勝ちは、\n全部この投手が投げて取ってきた。"}, {"t": 33.3, "x": "そして15回の表。試合は\nたった1つの回で大きく動いた。"}, {"t": 37.21666666666667, "x": "えっ、何が起きたの？"}, {"t": 38.81666666666667, "x": "その話は、もう少しあとにしよう。"}, {"t": 41.733333333333334, "x": "今回の学校は、愛媛県立西条高校だ。"}, {"t": 44.766666666666666, "x": "場所は愛媛県の東のほうにある西条市だ。"}, {"t": 47.55, "x": "1959年の夏、この学校は全国の頂点に立った。"}, {"t": 51.85, "x": "でも愛媛の高校野球って、\n松山商のイメージが強いわよね。"}, {"t": 55.8, "x": "ああ。それまで愛媛の夏の優勝は3回あった。"}, {"t": 58.75, "x": "1935年と1953年の松山商。\nそれに1950年の松山東だ。"}, {"t": 65.16666666666667, "x": "3回とも松山の学校だった。"}, {"t": 67.46666666666667, "x": "じゃあ西条は、松山の外から初めての日本一なのね。"}, {"t": 71.25, "x": "そうなる。しかも西条はその3年前に、\n甲子園の準決勝で負けている。"}, {"t": 75.78333333333333, "x": "点差はたった1点だった。"}, {"t": 77.6, "x": "1点差で負けた学校が、どうして\n3年で日本一まで行けたのかしら。"}, {"t": 82.05, "x": "今回はその答えを、西条高校の歩みと\n甲子園の試合の点数から辿っていく。"}, {"t": 86.98333333333333, "x": "面白いと思ったら、チャンネル登録と\n高評価をお願いします。"}, {"t": 90.83333333333333, "x": "よろしくね！"}, {"t": 92.33333333333333, "x": "西条高校の始まりは1896年4月だ。"}, {"t": 95.86666666666666, "x": "最初の名前は「愛媛県尋常中学東予分校」だった。"}, {"t": 99.8, "x": "分校から始まったのね。"}, {"t": 101.58333333333333, "x": "3年後の1899年に独立して、\n愛媛県西条中学校になった。"}, {"t": 106.81666666666666, "x": "1902年には愛媛県立西条中学校と名前を改めている。"}, {"t": 111.05, "x": "この学校は、建っている場所も少し変わっている。"}, {"t": 113.98333333333333, "x": "江戸時代のここには、西条藩の陣屋があった。"}, {"t": 117.0, "x": "陣屋って、お城みたいなもの？"}, {"t": 119.08333333333333, "x": "城を持たない藩が置いた、政治の拠点だ。"}, {"t": 121.7, "x": "学校の門は今も「大手門」と呼ばれている。"}, {"t": 124.56666666666666, "x": "2014年には体育館を建て直す工事に合わせて、\n陣屋跡の発掘の報告書もまとめられた。"}, {"t": 130.58333333333334, "x": "学校の下に、江戸時代が眠っているのね。"}, {"t": 133.46666666666667, "x": "秋の西条まつりの日には、\n大手門の前の御殿前に屋台が集まる。"}, {"t": 137.6, "x": "その日は大手門が閉まって校内に\n入れないと、学校が案内している。"}, {"t": 141.76666666666668, "x": "町のお祭りの真ん中にある学校なのね。"}, {"t": 144.93333333333334, "x": "戦後の1948年4月。"}, {"t": 147.26666666666668, "x": "学制改革で西条中学校は西条第一高校になった。"}, {"t": 151.08333333333334, "x": "町の女学校のほうは、西条第二高校になっている。"}, {"t": 154.38333333333333, "x": "翌年の1949年9月にこの2つが1つになった。"}, {"t": 158.4, "x": "新しい名前は西条北高校だ。"}, {"t": 160.7, "x": "1950年4月からは男女共学になった。"}, {"t": 164.03333333333333, "x": "数年で名前がずいぶん変わるのね。"}, {"t": 166.2, "x": "この西条北高校から、のちの大投手が\n出ている。藤田元司だ。"}, {"t": 170.43333333333334, "x": "1931年に生まれ、新居浜市で育った。"}, {"t": 173.8, "x": "西条北高校から1952年に慶応大学へ進んだ。"}, {"t": 177.83333333333334, "x": "社会人の日本石油を経て、1957年に巨人へ入った。"}, {"t": 182.26666666666668, "x": "1年目は17勝。いきなり新人王だ。"}, {"t": 185.11666666666667, "x": "最初の年から大活躍じゃない。"}, {"t": 187.33333333333334, "x": "2年目は29勝。この年は最高殊勲選手に選ばれた。"}, {"t": 191.16666666666666, "x": "3年目は27勝で最多勝。"}, {"t": 193.18333333333334, "x": "2年続けて最高殊勲選手になった。"}, {"t": 195.81666666666666, "x": "その3年目が1959年だ。"}, {"t": 198.51666666666668, "x": "あれ、西条が甲子園で優勝した年と同じね。"}, {"t": 201.68333333333334, "x": "そうだ。この偶然はあとでもう一度出てくる。"}, {"t": 204.91666666666666, "x": "1955年4月。西条北高校は西条南高校を\n合わせて、名前を西条高校に変えた。"}, {"t": 211.26666666666668, "x": "いまの校名はここから始まっている。"}, {"t": 213.43333333333334, "x": "その1か月前の1955年3月。"}, {"t": 216.25, "x": "野球部に新しい監督が来ていた。"}, {"t": 218.6, "x": "西条の卒業生で、立教大学を出た矢野監督だ。"}, {"t": 222.23333333333332, "x": "自分の母校に、監督として戻ってきたのね。"}, {"t": 225.31666666666666, "x": "生まれも西条市だと地元の新聞は伝えている。"}, {"t": 228.16666666666666, "x": "同窓会の記録では、矢野監督の考えは\n「猛練習こそ学生野球の本道」だった。"}, {"t": 233.78333333333333, "x": "そして精神を重んじる野球を貫いたと書かれている。"}, {"t": 237.05, "x": "かなり厳しい練習だったのかしら。"}, {"t": 239.28333333333333, "x": "記録にあるのはその言葉までだ。\nただ結果はすぐに出た。"}, {"t": 243.33333333333334, "x": "矢野監督が来て1年後の1956年。"}, {"t": 246.33333333333334, "x": "西条は春のセンバツに初めて出た。"}, {"t": 248.7, "x": "初戦の相手は群馬の桐生だった。"}, {"t": 250.66666666666666, "x": "7回と8回に1点ずつ取られ、0対2で敗れた。"}, {"t": 254.3, "x": "初めての甲子園は、勝てなかったのね。"}, {"t": 256.9166666666667, "x": "だが同じ年の夏。西条は夏の甲子園にも初めて出た。"}, {"t": 260.71666666666664, "x": "1回戦の相手は兵庫の県尼崎。"}, {"t": 263.0, "x": "3回に取った1点を守って1対0で勝った。"}, {"t": 266.05, "x": "2回戦は東京の早稲田実。"}, {"t": 267.8333333333333, "x": "9回に2点を取って3対1だ。"}, {"t": 270.06666666666666, "x": "準々決勝は宮城の仙台二。ここも2対0で勝った。"}, {"t": 273.73333333333335, "x": "3試合で、取られたのはたった1点？"}, {"t": 276.15, "x": "そうだ。守り勝つチームだった。"}, {"t": 278.1666666666667, "x": "そして準決勝で京都の平安とぶつかった。"}, {"t": 280.96666666666664, "x": "試合は0対0のまま9回に入った。"}, {"t": 283.43333333333334, "x": "9回の表に平安が1点を取った。"}, {"t": 285.8666666666667, "x": "西条はその裏に点を返せなかった。0対1だ。"}, {"t": 289.21666666666664, "x": "最後の最後で、1点を取られたのね……。"}, {"t": 291.76666666666665, "x": "平安はこの大会で優勝している。"}, {"t": 293.76666666666665, "x": "決勝は岐阜商に3対2だった。"}, {"t": 296.06666666666666, "x": "優勝したチームに、1点差で負けたってことね。"}, {"t": 299.1333333333333, "x": "冒頭で話した「準決勝の1点」は、この試合のことだ。"}, {"t": 303.06666666666666, "x": "それでも初めての夏で4強だ。"}, {"t": 305.03333333333336, "x": "春と夏をあわせて、この年だけで\n甲子園に2度来ている。"}, {"t": 308.7, "x": "矢野監督が来て、たった1年でそこまで行ったのね。"}, {"t": 312.6166666666667, "x": "そこから2年。西条は1957年と\n1958年の夏は甲子園に出ていない。"}, {"t": 318.5, "x": "当時の愛媛は、1つの県だけで\n夏の代表を出せなかった。"}, {"t": 322.26666666666665, "x": "香川と愛媛で「北四国大会」を戦い、\n勝った1校だけが甲子園へ行けた。"}, {"t": 327.4, "x": "2つの県で、枠が1つだけなの？"}, {"t": 329.96666666666664, "x": "そうだ。1959年の大会でも、\n多くの府県が2つで1校を出す形だった。"}, {"t": 335.55, "x": "この年は北海道が南と北に分かれた。"}, {"t": 338.1333333333333, "x": "長野と静岡と広島は1県で出られるようになった。"}, {"t": 341.55, "x": "そのぶん地区が6つ増えて、出場は29校になった。"}, {"t": 345.21666666666664, "x": "それでも今よりずっと狭い門ね。"}, {"t": 347.35, "x": "西条はこの年、夏の愛媛の大会で優勝した。"}, {"t": 350.46666666666664, "x": "続く北四国大会でも勝った。"}, {"t": 352.6666666666667, "x": "3年ぶり2回目の夏の甲子園だ。"}, {"t": 355.1166666666667, "x": "まず県で勝って、次に香川の学校とも戦ってたのね。"}, {"t": 358.8333333333333, "x": "大会は8月8日に始まった。"}, {"t": 360.8666666666667, "x": "雨で2日延びて、9日間の大会になった。"}, {"t": 364.6333333333333, "x": "1959年8月11日。"}, {"t": 367.15, "x": "西条の初戦の相手は神奈川の法政二だった。"}, {"t": 370.1333333333333, "x": "法政二は3年続けて夏の甲子園に来ていた強豪だ。"}, {"t": 373.65, "x": "2回の表。藤岡のセンター前への当たりを、\n相手のセンターが後ろへそらした。"}, {"t": 378.3666666666667, "x": "これで西条が1点を先に取った。"}, {"t": 380.53333333333336, "x": "3回と4回にも1点ずつ。"}, {"t": 382.3666666666667, "x": "8回に2点、9回にも1点を足した。"}, {"t": 385.1166666666667, "x": "エースの金子は法政二の打線をヒット\n4本に抑えた。6対0の完封だ。"}, {"t": 389.93333333333334, "x": "強いところ相手に、0点で抑えたのね。"}, {"t": 392.6333333333333, "x": "しかも法政二は、次の年の夏に日本一になっている。"}, {"t": 396.3666666666667, "x": "未来の優勝校を、0点に抑えたってこと？"}, {"t": 399.21666666666664, "x": "結果だけ見ればそうなる。"}, {"t": 400.75, "x": "2回戦は8月15日。"}, {"t": 402.46666666666664, "x": "相手は長野の松商学園だった。"}, {"t": 404.78333333333336, "x": "夏の甲子園はこれが15回目という古豪だ。"}, {"t": 407.48333333333335, "x": "西条は1回の表に1点を先に取った。"}, {"t": 410.18333333333334, "x": "だが松商学園は3回と5回と7回に1点ずつ返してきた。"}, {"t": 414.3, "x": "7回が終わって1対3。この夏の西条が、\n初めて追いかける側に回った。"}, {"t": 419.25, "x": "ここで負けちゃうの？"}, {"t": 420.55, "x": "8回の表に西条は2点を取り、3対3に追いついた。"}, {"t": 424.1666666666667, "x": "9回は両チームとも0点。"}, {"t": 425.76666666666665, "x": "試合は延長に入った。"}, {"t": 427.3666666666667, "x": "10回の表に西条がまた2点。\nその裏を抑えて5対3で勝った。"}, {"t": 431.6333333333333, "x": "追いついて、最後に突き放したのね。"}, {"t": 434.6333333333333, "x": "準々決勝は次の日の8月16日。"}, {"t": 437.3, "x": "相手は京都の平安だった。"}, {"t": 439.26666666666665, "x": "平安って、3年前に1点差で負けた相手じゃない！"}, {"t": 442.5833333333333, "x": "そうだ。平安は4年続けての出場で、\n夏の甲子園は17回目だった。"}, {"t": 447.4166666666667, "x": "試合はまた0が並んだ。"}, {"t": 449.01666666666665, "x": "西条は8回まで1点も取れなかった。"}, {"t": 451.5, "x": "そして8回の裏。先に1点を取ったのは平安だった。"}, {"t": 455.1666666666667, "x": "また平安に1点……。"}, {"t": 456.3, "x": "3年前と同じ流れじゃない。"}, {"t": 458.3333333333333, "x": "ところが9回の表。西条は2点を\n取って試合をひっくり返した。"}, {"t": 462.43333333333334, "x": "その裏を0点に抑えて、2対1で勝った。"}, {"t": 465.3333333333333, "x": "3年前は9回に1点を取られて負けた。"}, {"t": 467.8333333333333, "x": "今度は9回に2点を取って勝ったのね。"}, {"t": 470.43333333333334, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
