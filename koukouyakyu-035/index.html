<script>
const D={"name": "花咲徳栄と埼玉3度目の決勝", "file": "035_編集用", "dur": 904.7, "segs": [], "subs": [{"t": 0.0, "x": "2017年8月23日、阪神甲子園球場。"}, {"t": 3.8, "x": "夏の全国大会の決勝が行われた。"}, {"t": 6.45, "x": "埼玉の花咲徳栄と広島の広陵の試合だ。"}, {"t": 9.666666666666666, "x": "点数は14対4。花咲徳栄が勝った。"}, {"t": 12.783333333333333, "x": "決勝で10点差もついたのね。"}, {"t": 14.866666666666667, "x": "日本高野連の大会小史はこの試合をこう書いている。"}, {"t": 18.05, "x": "花咲徳栄が広陵を破り、埼玉県勢として\n初めて全国の頂点に立った。"}, {"t": 23.316666666666666, "x": "初めて？　埼玉って、学校の数も多いでしょ？"}, {"t": 26.533333333333335, "x": "ああ。それでも夏の優勝はこの年まで1回もなかった。"}, {"t": 29.966666666666665, "x": "夏の大会が始まったのは1915年だ。"}, {"t": 32.9, "x": "2017年の大会は第99回だった。"}, {"t": 36.13333333333333, "x": "99回目で、やっと初めての優勝なの？"}, {"t": 39.21666666666667, "x": "そうだ。埼玉の学校は、それまで\n2回、決勝で敗れている。"}, {"t": 43.18333333333333, "x": "春の選抜では2回も優勝している。"}, {"t": 45.55, "x": "それでも夏だけは最後の1勝に届かなかった。"}, {"t": 48.56666666666667, "x": "どうしてそんなに長くかかったの？"}, {"t": 50.7, "x": "今回は公式の記録だけを使ってその道のりをたどる。"}, {"t": 54.1, "x": "最後に、2017年の夏の6試合を1つずつ見ていく。"}, {"t": 57.93333333333333, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 61.35, "x": "よろしくね。"}, {"t": 62.85, "x": "まず埼玉のまわりを見てみる。"}, {"t": 64.63333333333334, "x": "関東には1つの都と6つの県がある。"}, {"t": 67.08333333333333, "x": "それぞれが夏に初めて優勝した年を並べてみよう。"}, {"t": 70.25, "x": "使うのは、阪神甲子園球場の「夏の歴代優勝校」だ。"}, {"t": 74.5, "x": "いちばん早いのはどこ？"}, {"t": 76.0, "x": "東京だ。1916年の第2回大会で、\nもう優勝校が出ている。"}, {"t": 80.63333333333334, "x": "次が神奈川で1949年。湘南が勝った。"}, {"t": 84.15, "x": "栃木は1962年の作新学院。"}, {"t": 86.9, "x": "千葉は1967年の習志野だ。"}, {"t": 89.66666666666667, "x": "茨城は1984年の取手二。"}, {"t": 92.26666666666667, "x": "群馬は1999年の桐生第一だった。"}, {"t": 95.56666666666666, "x": "じゃあ埼玉は？"}, {"t": 96.68333333333334, "x": "2017年の花咲徳栄だ。"}, {"t": 99.01666666666667, "x": "関東の7つの都と県で、いちばん最後だった。"}, {"t": 102.11666666666666, "x": "群馬から18年もあとなのね。"}, {"t": 104.33333333333333, "x": "ああ。1999年からの18年間、関東で\n夏の優勝がないのは埼玉だけだった。"}, {"t": 110.38333333333334, "x": "となりの県が先に優勝旗を\n持って帰るのを見ていたのね。"}, {"t": 113.83333333333333, "x": "東京の1916年から数えると、101年の差がある。"}, {"t": 117.96666666666667, "x": "100年以上……。数字にすると大きいわね。"}, {"t": 120.41666666666667, "x": "優勝の回数でいうとどうなの？"}, {"t": 122.41666666666667, "x": "同じ表で2025年までを数えると、\n東京と神奈川が8回ずつだ。"}, {"t": 126.9, "x": "千葉が3回。茨城、栃木、群馬が2回ずつ。"}, {"t": 130.18333333333334, "x": "そして埼玉が1回。その1回が2017年だ。"}, {"t": 133.75, "x": "関東でいちばん少なくて、いちばん遅いのね。"}, {"t": 136.71666666666667, "x": "ああ。だからこそ、2017年の1勝が\nどう生まれたかを追う意味がある。"}, {"t": 141.51666666666668, "x": "次は日本高野連の出場校一覧を見る。"}, {"t": 144.26666666666668, "x": "この表には年ごとに\n都道府県の代表の学校が並んでいる。"}, {"t": 147.9, "x": "埼玉の欄を1949年から順に読んでいく。"}, {"t": 151.35, "x": "1949年は熊谷。1950年は空いている。"}, {"t": 155.38333333333333, "x": "1951年はまた熊谷。そのあと\n1952年から5年続けて空いている。"}, {"t": 161.1, "x": "空いているってどういうこと？"}, {"t": 162.68333333333334, "x": "その年は埼玉の学校が全国大会に\n出ていないということだ。"}, {"t": 166.55, "x": "1957年と1958年は大宮。"}, {"t": 169.9, "x": "1959年は川越。"}, {"t": 172.05, "x": "1960年は大宮で、1961年と\n1962年はまた空いている。"}, {"t": 177.85, "x": "1949年から1973年までの25回で、\n埼玉の名前があるのは15回だけ。"}, {"t": 184.36666666666667, "x": "残りの10回は空いている。"}, {"t": 186.1, "x": "25回のうち10回も全国に出られなかったのね。"}, {"t": 189.36666666666667, "x": "1974年から様子が変わる。"}, {"t": 191.88333333333333, "x": "この年の上尾から、埼玉の欄は\n毎年うまるようになった。"}, {"t": 195.53333333333333, "x": "表がある2024年まで、欄が空いたことは1度もない。"}, {"t": 199.01666666666668, "x": "2020年だけは大会そのものが開かれていない。"}, {"t": 202.28333333333333, "x": "毎年出られるようになったのは1974年からなのね。"}, {"t": 206.13333333333333, "x": "そうだ。全国で勝つには、まず\n全国に出ないと始まらない。"}, {"t": 209.93333333333334, "x": "毎年出るようになった1974年から、\n初めての優勝まで43年かかったことになる。"}, {"t": 216.63333333333333, "x": "1974年からは、どんな学校が出ていたの？"}, {"t": 220.18333333333334, "x": "1974年から2016年までの43回を、\nこの表で数えてみた。"}, {"t": 225.36666666666667, "x": "1998年と2008年は記念大会で、\n埼玉から2校ずつ出ている。"}, {"t": 230.6, "x": "いちばん多く名前があるのは浦和学院で、12回だ。"}, {"t": 233.8, "x": "次が春日部共栄の5回。"}, {"t": 235.46666666666667, "x": "上尾、所沢商、熊谷商、\n聖望学園なども何度か出ている。"}, {"t": 239.93333333333334, "x": "いろいろな学校が代わる代わる出ていたのね。"}, {"t": 242.5, "x": "ああ。そして花咲徳栄の名前は、\n2001年に初めて出てくる。"}, {"t": 246.8, "x": "2016年までの花咲徳栄は4回だった。"}, {"t": 250.13333333333333, "x": "12回の浦和学院と比べると、ずっと少ないのね。"}, {"t": 253.61666666666667, "x": "そうだ。初めての優勝は、いちばん\n多く出ていた学校ではなかった。"}, {"t": 257.71666666666664, "x": "この話はあとで花咲徳栄のところでもう1度出てくる。"}, {"t": 261.85, "x": "では埼玉の学校の決勝を見ていく。"}, {"t": 264.18333333333334, "x": "日本高野連の決勝の記録で\n埼玉の学校を探すと、2校が見つかる。"}, {"t": 268.8, "x": "1つ目は1951年。"}, {"t": 270.76666666666665, "x": "第33回大会の熊谷だ。"}, {"t": 273.1166666666667, "x": "表の上では1949年に続く2回目の出場だった。"}, {"t": 277.1333333333333, "x": "決勝の相手は京都の平安。"}, {"t": 278.96666666666664, "x": "点数は4対7。熊谷は3点差で敗れた。"}, {"t": 282.18333333333334, "x": "決勝まで行って、3点差だったのね。"}, {"t": 284.73333333333335, "x": "この年の全国の参加校は1633校だった。"}, {"t": 288.4, "x": "その中で2番目まで来たことになる。"}, {"t": 290.76666666666665, "x": "1633校の2番目なら、立派な成績ね。"}, {"t": 294.48333333333335, "x": "ところが1952年からの5年間、\n埼玉の欄はまた空いている。"}, {"t": 298.93333333333334, "x": "決勝まで行った次の年から、\nまた全国に出られなかったのね。"}, {"t": 302.9, "x": "この年の大会小史には、球場に\nアルミニウムの大屋根が「復活」した、と書いてある。"}, {"t": 308.48333333333335, "x": "球場の様子も少しずつ戻っていった時代なのね。"}, {"t": 311.6666666666667, "x": "熊谷の準優勝から、埼玉の次の決勝までは42年あく。"}, {"t": 316.51666666666665, "x": "夏の決勝が遠かったあいだに、\n春の選抜では埼玉が先に勝った。"}, {"t": 320.85, "x": "1968年の第40回選抜大会だ。"}, {"t": 324.3833333333333, "x": "日本高野連の選抜の大会小史にはこう書いてある。"}, {"t": 327.6666666666667, "x": "「大宮工が初出場で優勝。出場30校。」"}, {"t": 331.0, "x": "初めて出て、いきなり優勝？"}, {"t": 333.06666666666666, "x": "そうだ。埼玉の学校が全国大会で\n優勝したのは、これが初めてだった。"}, {"t": 337.8833333333333, "x": "そしてこの年の夏、\n埼玉の代表になったのも大宮工だった。"}, {"t": 342.05, "x": "春に優勝した学校が夏も来たのね。"}, {"t": 344.68333333333334, "x": "ああ。この夏は第50回の記念大会だった。"}, {"t": 347.65, "x": "大会小史によると、48の代表が出ている。"}, {"t": 350.81666666666666, "x": "ただ、この夏を制したのは大阪の興国だった。"}, {"t": 353.8833333333333, "x": "興国にとってもこれが初めての優勝だった。"}, {"t": 356.78333333333336, "x": "春に勝っても夏はまた別の勝負なのね。"}, {"t": 360.0, "x": "2校目は1993年。"}, {"t": 361.96666666666664, "x": "第75回の記念大会だ。"}, {"t": 364.15, "x": "埼玉代表の春日部共栄が、決勝まで勝ち進んだ。"}, {"t": 367.73333333333335, "x": "埼玉の学校の決勝は、熊谷から42年ぶりだった。"}, {"t": 371.53333333333336, "x": "相手は兵庫の育英。"}, {"t": 372.85, "x": "点数は2対3。1点差で敗れた。"}, {"t": 375.3833333333333, "x": "1点差……。あと1点で同点だったのね。"}, {"t": 378.05, "x": "育英にとってもこれが初めての優勝だった。"}, {"t": 380.75, "x": "この年の全国の参加校は4071校。"}, {"t": 383.65, "x": "1951年の2倍を大きく超えている。"}, {"t": 386.7, "x": "学校の数が増えてもまた2番目まで来たのね。"}, {"t": 389.6666666666667, "x": "ああ。ところが1993年のあと、\n埼玉の学校は4強にも届かない夏が続く。"}, {"t": 395.53333333333336, "x": "どれくらい続いたの？"}, {"t": 396.95, "x": "次に埼玉の学校が4強に入るのは\n2017年。24年後だった。"}, {"t": 401.73333333333335, "x": "決勝どころか、4強までも24年かかったのね。"}, {"t": 405.1666666666667, "x": "その24年の間も、埼玉の代表は\n毎年甲子園に出ている。"}, {"t": 409.28333333333336, "x": "出るところまでは来ていた。そこから先が遠かった。"}, {"t": 413.05, "x": "その間に、春の選抜ではもう1度、埼玉が勝っている。"}, {"t": 416.73333333333335, "x": "2013年の第85回選抜大会だ。"}, {"t": 419.8333333333333, "x": "大会小史には「浦和学院（埼玉）が\n春夏を通じて初優勝」とある。"}, {"t": 424.9, "x": "大宮工から45年ぶりの春の優勝ね。"}, {"t": 427.75, "x": "この年の夏も、埼玉の代表は浦和学院だった。"}, {"t": 431.1166666666667, "x": "ところが夏を制したのは、群馬の前橋育英だった。"}, {"t": 434.4166666666667, "x": "大会小史は、前橋育英が延岡学園を\n下して初優勝した、と書いている。"}, {"t": 439.55, "x": "となりの群馬はこれで夏の優勝が2回目になったのね。"}, {"t": 442.95, "x": "そうだ。春は2回勝っている埼玉が、夏はまだ0回。"}, {"t": 446.55, "x": "1968年も2013年も、春に勝った\nその夏は別の学校が勝った。"}, {"t": 452.1166666666667, "x": "同じことが2回起きたのね。"}, {"t": 454.05, "x": "前橋育英の名前は、2017年の夏にもう1度出てくる。"}, {"t": 457.85, "x": "覚えておいてほしい。"}, {"t": 459.68333333333334, "x": "ここで2017年の主役、花咲徳栄の話に入る。"}, {"t": 463.6666666666667, "x": "出場校一覧で、花咲徳栄の名前が\n最初に出てくるのは2001年だ。"}, {"t": 468.55, "x": "Numberの記事によるとこれが\n甲子園への初めての出場だった。"}, {"t": 472.21666666666664, "x": "次は10年後の2011年。"}, {"t": 474.23333333333335, "x": "そして2015年、2016年、2017年と、\n3年続けて埼玉の代表になった。"}, {"t": 480.46666666666664, "x": "2017年で、夏は5回目なのね。"}, {"t": 483.2, "x": "そうだ。2015年と2016年は、\nその夏に優勝した学校に敗れている。"}, {"t": 488.3666666666667, "x": "2015年は東海大相模、2016年は作新学院だ。"}, {"t": 492.5, "x": "大会小史によると、東海大相模は45年ぶり2度目、\n作新学院は54年ぶり2度目の優勝だった。"}, {"t": 499.35, "x": "2年続けて優勝する学校に止められたのね。"}, {"t": 502.35, "x": "ああ。3年目の2017年、花咲徳栄は\nまた甲子園に戻ってきた。"}, {"t": 507.1333333333333, "x": "この年の全国の参加校は3839校。\nその頂点を決める大会だ。"}, {"t": 512.5166666666667, "x": "3839校の中から、1校だけね。"}, {"t": 516.5 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
