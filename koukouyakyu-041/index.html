<title>第1回センバツ王者と2度の夏</title>
<style>

<script>
const D={"name": "第1回センバツ王者と2度の夏", "file": "041_編集用", "dur": 729.55, "segs": [], "subs": [{"t": 0.0, "x": "春の選抜って、いちばん最初の優勝校はどこなの？"}, {"t": 3.466666666666667, "x": "1924年4月、名古屋で開かれた第1回大会。"}, {"t": 7.233333333333333, "x": "優勝したのは香川の高松商だ。"}, {"t": 9.583333333333334, "x": "日本高野連の大会小史には、こう書いてある。"}, {"t": 12.533333333333333, "x": "「新調の紫紺の大優勝旗は\n高松商・野村栄一主将へ」。"}, {"t": 16.283333333333335, "x": "新しく作った旗を、最初に受け取った学校なのね。"}, {"t": 19.866666666666667, "x": "そうだ。しかも高松商は、\n翌年の夏の大会でも日本一になっている。"}, {"t": 24.766666666666666, "x": "春の最初の王者が、すぐ夏も勝ったの？"}, {"t": 27.55, "x": "ああ。夏は1925年と1927年の2回。"}, {"t": 31.4, "x": "春は1924年と1960年の2回だ。"}, {"t": 35.13333333333333, "x": "そして高松商は、いまも香川の県立の商業高校だ。"}, {"t": 38.96666666666667, "x": "どうして香川の公立校が、\n最初の時代に春も夏も勝てたの？"}, {"t": 43.06666666666667, "x": "今回は1924年からの高松商の歩みを、\n大会の表と記録から辿っていく。"}, {"t": 48.61666666666667, "x": "見ていくのは5つ。第1回の春と2度の夏、\n1960年の春、長い空白、そして最近の春だ。"}, {"t": 55.733333333333334, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 59.166666666666664, "x": "よろしくね。"}, {"t": 60.666666666666664, "x": "まず学校の場所だ。\n香川県高松市の松島町一丁目にある。"}, {"t": 64.76666666666667, "x": "香川県の学校紹介によると、\nJRの栗林駅から1,100メートル。"}, {"t": 69.2, "x": "ことでんの瓦町駅からは700メートルの所だ。"}, {"t": 72.53333333333333, "x": "高松の街の真ん中に近いのね。"}, {"t": 74.96666666666667, "x": "いまの学科は3つある。"}, {"t": 76.26666666666667, "x": "商業科、情報科、外国語科だ。"}, {"t": 78.83333333333333, "x": "全校の生徒は901人と書いてある。"}, {"t": 81.5, "x": "野球の学校っていうより、ふつうの商業高校なのね。"}, {"t": 84.9, "x": "校訓は「至誠、剛健、協同、勤労、敬愛」。"}, {"t": 88.26666666666667, "x": "学校の行事の欄には、\n夏の香川大会の応援も入っている。"}, {"t": 92.23333333333333, "x": "野球の応援が、学校の行事になってるのね。"}, {"t": 95.2, "x": "野球部は、Numberの記事の写真説明に\n「1909年創部」とある。"}, {"t": 99.88333333333334, "x": "記事の中では「高商」とも呼ばれている。"}, {"t": 103.15, "x": "では1924年の春に戻る。"}, {"t": 105.43333333333334, "x": "第1回の選抜中等学校野球大会だ。"}, {"t": 108.36666666666666, "x": "会場は甲子園ではない。"}, {"t": 109.75, "x": "名古屋市の郊外、八事の山本球場だった。"}, {"t": 112.9, "x": "最初の春は名古屋だったのね。"}, {"t": 114.9, "x": "その話はショートでもした。"}, {"t": 116.5, "x": "開幕は4月1日だ。"}, {"t": 118.26666666666667, "x": "始球式をしたのは、\n当時の名古屋市長の川崎卓吉だった。"}, {"t": 122.18333333333334, "x": "大会小史には「過去一年間の試合で\n最強チームと認められた」8校とある。"}, {"t": 127.28333333333333, "x": "8校だけの大会だったの？"}, {"t": 129.23333333333332, "x": "ああ。出場校の一覧に並ぶのは、\n東京の早稲田実と横浜商、愛知一中、立命館中。"}, {"t": 135.38333333333333, "x": "それに市岡中、和歌山中、高松商、松山商の8校だ。"}, {"t": 139.8, "x": "四国からは香川と愛媛から1校ずつね。"}, {"t": 142.51666666666668, "x": "決勝の成績は2対0。"}, {"t": 144.16666666666666, "x": "高松商が早稲田実に勝った。"}, {"t": 146.28333333333333, "x": "この決勝の相手のことは、早稲田実業の回で話した。"}, {"t": 149.81666666666666, "x": "今回は勝った高松商の表のほうを見ていく。"}, {"t": 152.71666666666667, "x": "表のほう？"}, {"t": 153.58333333333334, "x": "出場校の一覧には、香川の欄がある。"}, {"t": 156.21666666666667, "x": "第1回から第5回まで、その欄には\n毎年「高松商」と書いてある。"}, {"t": 160.93333333333334, "x": "最初の5回は、ずっと春に出てたのね。"}, {"t": 163.61666666666667, "x": "そうだ。1928年の第5回だけは、\n高松中と2校の名前が並ぶ。"}, {"t": 169.45, "x": "1925年の第2回は舞台が変わった。"}, {"t": 172.46666666666667, "x": "大会小史には「舞台は\n前年夏完成の阪神甲子園球場に」とある。"}, {"t": 177.25, "x": "甲子園球場ができて、春の大会もそこに移ったのね。"}, {"t": 180.96666666666667, "x": "同じ欄には「選考委員会制度が確立」とも\n書いてある。"}, {"t": 184.66666666666666, "x": "出る学校を委員会で選ぶ形が、\nこの年に固まったわけだ。"}, {"t": 188.56666666666666, "x": "選ぶ仕組みが、この年に決まったのね。"}, {"t": 191.16666666666666, "x": "出場は12校に増えた。"}, {"t": 192.88333333333333, "x": "この年も高松商は決勝まで進んだ。"}, {"t": 195.36666666666667, "x": "相手は愛媛の松山商だ。"}, {"t": 197.36666666666667, "x": "第1回にも出てた四国の学校どうしね。"}, {"t": 200.08333333333334, "x": "結果は3対2で松山商の勝ち。"}, {"t": 202.2, "x": "高松商は準優勝だった。"}, {"t": 204.3, "x": "2年続けて決勝に出て、1回勝って1回負けたのね。"}, {"t": 208.03333333333333, "x": "ああ。そしてこの年の夏に、\n高松商はもう1つ大きな記録を作る。"}, {"t": 213.13333333333333, "x": "1925年の夏は、\n第11回の全国中等学校優勝野球大会だ。"}, {"t": 218.41666666666666, "x": "出場校の一覧では、全参加校は302校。"}, {"t": 221.55, "x": "代表は21校だった。"}, {"t": 223.43333333333334, "x": "302校のうち甲子園に来たのは21校なのね。"}, {"t": 226.81666666666666, "x": "大会小史によると、この年は東北などの地区が\n分かれて代表が21校に増えた。"}, {"t": 231.93333333333334, "x": "国旗と大会の旗をあげることも、\nこの年に始まっている。"}, {"t": 235.53333333333333, "x": "決勝の成績は5対3。"}, {"t": 237.13333333333333, "x": "高松商が早稲田実に勝って優勝した。"}, {"t": 239.93333333333334, "x": "また早稲田実と決勝で当たったの？"}, {"t": 242.21666666666667, "x": "そうだ。前の年の春に続いて、\n決勝の相手は早稲田実だった。"}, {"t": 246.35, "x": "大会小史の第11回の欄には、こういう1行がある。"}, {"t": 249.76666666666668, "x": "「初めて四国ヘ優勝旗」。"}, {"t": 251.53333333333333, "x": "それまで四国の学校は、夏に\n勝ったことがなかったのね。"}, {"t": 255.18333333333334, "x": "デイリースポーツの香川の特集にも、\n四国勢として初優勝とある。"}, {"t": 259.3666666666667, "x": "同じ欄には、もう1つ面白いことが書いてある。"}, {"t": 262.4, "x": "大阪放送局が試合の経過をラジオで放送した。"}, {"t": 265.6333333333333, "x": "ラジオで試合の様子が伝わったのね。"}, {"t": 267.98333333333335, "x": "ああ。四国に初めて旗が渡った夏は、\nラジオが試合を伝えた夏でもあった。"}, {"t": 273.3833333333333, "x": "ここで、夏の出場校の一覧の香川の欄を、\n年の順に読んでみる。"}, {"t": 277.73333333333335, "x": "1925年は高松商。"}, {"t": 279.8333333333333, "x": "1926年は高松中。"}, {"t": 282.26666666666665, "x": "1927年は高松商。"}, {"t": 284.46666666666664, "x": "1928年は高松中。そして1929年はまた高松商だ。"}, {"t": 290.05, "x": "高松商と高松中が、1年おきに並んでるのね。"}, {"t": 293.65, "x": "ああ。同じ高松の2つの学校の名前が交互に出てくる。"}, {"t": 297.4166666666667, "x": "1926年の夏は、高松中が香川の代表だったのね。"}, {"t": 301.9166666666667, "x": "そうだ。その年の夏の優勝は静岡中だった。"}, {"t": 305.0833333333333, "x": "そして高松商が次に夏の甲子園に\n出たのが、1927年だ。"}, {"t": 310.48333333333335, "x": "1927年の第13回大会。"}, {"t": 313.18333333333334, "x": "全参加校は389校、代表は22校だった。"}, {"t": 317.06666666666666, "x": "決勝は5対1。高松商が広島の広陵中に勝った。"}, {"t": 320.9166666666667, "x": "2年前は302校だったのに、\nもう389校になってるのね。"}, {"t": 325.46666666666664, "x": "この夏のチームの中心にいたのが、水原茂だ。"}, {"t": 328.7, "x": "デイリースポーツの特集は、のちにプロで\n監督としても実績を残した人と紹介している。"}, {"t": 334.25, "x": "記事には「元巨人」と書いてある。"}, {"t": 336.5833333333333, "x": "プロ野球の巨人にいた人なのね。"}, {"t": 338.85, "x": "そして大会小史の第13回の欄には、こうある。"}, {"t": 342.06666666666666, "x": "「JOBKが実況放送開始」。"}, {"t": 344.31666666666666, "x": "2年前は試合の経過で、今度は実況なのね。"}, {"t": 347.4166666666667, "x": "そうだ。この年は選手に\n傷害保険がかけられた、とも書いてある。"}, {"t": 351.46666666666664, "x": "1925年の経過の放送、1927年の実況放送。"}, {"t": 356.23333333333335, "x": "ラジオの伝え方がちがう2つの夏に、\nどちらも高松商が勝っている。"}, {"t": 360.7, "x": "表で並べると、偶然だけど面白い一致ね。"}, {"t": 364.15, "x": "ここで、高松商の決勝を1つの表にしてみる。"}, {"t": 367.35, "x": "1924年春は2対0で早稲田実に勝って優勝。"}, {"t": 371.06666666666666, "x": "1925年春は2対3で松山商に負けて準優勝。"}, {"t": 375.0833333333333, "x": "1925年夏は5対3で早稲田実に勝って優勝。"}, {"t": 378.81666666666666, "x": "1927年夏は5対1で広陵中に勝って優勝。"}, {"t": 382.75, "x": "4年の間に、決勝に4回も出てるのね。"}, {"t": 385.6666666666667, "x": "ああ。1924年から1927年の4年で決勝は4回だ。"}, {"t": 390.6666666666667, "x": "最初の時代の高松商は、それだけ強かったのね。"}, {"t": 394.1166666666667, "x": "デイリースポーツの特集の記録の欄も見てほしい。"}, {"t": 397.0, "x": "2018年の時点で、夏の出場回数も\n勝利数も香川の1位は高松商だ。"}, {"t": 402.3333333333333, "x": "出場は19回、勝ちは22勝と書いてある。"}, {"t": 405.48333333333335, "x": "香川でいちばん夏に出て、\nいちばん勝ってる学校なのね。"}, {"t": 409.5, "x": "春の2回目の優勝が1960年ね。"}, {"t": 412.26666666666665, "x": "1924年からだいぶ空いてるわ。"}, {"t": 414.93333333333334, "x": "そうだ。大会小史の第32回の欄には、こう書いてある。"}, {"t": 418.7, "x": "「高松商が\n山口富士雄の優勝戦史上初のサヨナラ本塁打で\n米子東をうっちゃり」。"}, {"t": 423.95, "x": "決勝でサヨナラのホームランは、\nそのときが初めてなの？"}, {"t": 427.43333333333334, "x": "ああ。小史は「優勝戦史上初」と書いている。"}, {"t": 430.56666666666666, "x": "続けて「36年ぶりに優勝」とある。"}, {"t": 433.56666666666666, "x": "第1回の優勝から36年ぶりの春の優勝ね。"}, {"t": 437.05, "x": "出場校の一覧では、決勝の成績は2対1。"}, {"t": 440.1333333333333, "x": "相手は鳥取の米子東だ。"}, {"t": 442.15, "x": "この大会の出場は23校だった。"}, {"t": 444.78333333333336, "x": "第1回は8校だったから、ずいぶん増えたのね。"}, {"t": 447.8666666666667, "x": "同じ大会には、沖縄から那覇が初めて出ている。"}, {"t": 451.05, "x": "翌年の1961年の春も、高松商は決勝まで進んだ。"}, {"t": 455.68333333333334, "x": "相手は神奈川の法政二。"}, {"t": 457.2, "x": "0対4で負けて準優勝だった。"}, {"t": 459.48333333333335, "x": "法政二はこの春、前の年の夏に続けて優勝している。"}, {"t": 463.3, "x": "法政二の回にも出てきた試合ね。"}, {"t": 465.56666666666666, "x": "そうだ。高松商は2年続けて、\n春の決勝に立ったことになる。"}, {"t": 470.43333333333334, "x": "夏に目を戻す。デイリースポーツの特集には\n1970年の第52回で4強とある。"}, {"t": 476.1, "x": "このときの監督は、春夏あわせて\n10回甲子園に出た人だと書いてある。"}, {"t": 480.76666666666665, "x": "夏の優勝は1927年が最後だけど、\nそのあとも上まで行ってたのね。"}, {"t": 485.78333333333336, "x": "ただ、そのあとは苦しい時期も来た。"}, {"t": 488.06666666666666, "x": "1976年の第58回から、\n5大会続けて夏の代表になった。"}, {"t": 493.3833333333333, "x": "5年続けて出られたなら、すごいじゃない。"}, {"t": 495.96666666666664, "x": "ところが特集によれ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
