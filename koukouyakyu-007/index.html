<title>星稜</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;-webkit-text-size-adjust:100%;
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:17px;margin:4px 0 14px;font-weight:600;letter-spacing:.02em}
.meta{color:var(--dim);font-size:13px;font-weight:400;margin-left:8px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;
  min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:46px 20px 26px;box-shadow:0 2px 14px rgba(0,0,0,.10)}
#now{margin:0;text-align:center;white-space:pre-wrap;word-break:break-word;font-weight:700;
  font-size:clamp(23px,5.4vw,42px);line-height:1.5;letter-spacing:.01em}
#nextline{margin:16px 0 0;text-align:center;white-space:pre-wrap;word-break:break-word;
  color:var(--dim);font-size:clamp(13px,2.8vw,17px);line-height:1.6}
.badge{position:absolute;left:12px;top:12px;background:rgba(127,127,127,.16);color:var(--dim);
  font-size:12px;padding:3px 9px;border-radius:20px;line-height:1.6;letter-spacing:.04em}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0 6px;flex-wrap:wrap}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:9px 14px;font-size:15px;cursor:pointer;font-family:inherit}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:80px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}
input[type=range]{width:100%;accent-color:var(--accent)}
.marks{position:relative;height:7px;margin:2px 0 14px}
.marks i{position:absolute;top:0;width:1px;height:7px;background:var(--line)}
.tabs{display:flex;gap:6px;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;
  color:var(--ink);padding:7px 12px;font-weight:600}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  -webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(127,127,127,.07)}
.row.on{background:rgba(184,66,47,.12)}
.row b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;
  min-width:48px;flex:none;padding-top:2px}
.row span{white-space:pre-wrap;flex:1;font-size:16px;line-height:1.65}
.tip{color:var(--dim);font-size:12.5px;margin:10px 2px 0}
@media(max-width:620px){.wrap{padding:10px}.time{font-size:12px}
  .bar button{padding:9px 11px;font-size:14px}.stage{padding:42px 14px 22px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script>
const D={"name": "星稜", "file": "007_編集用", "dur": 1021.8, "segs": [], "subs": [{"t": 0.0, "x": "部員8人から始まって、今は北陸の名門と\n呼ばれる野球部がある。石川の星稜だ。"}, {"t": 5.65, "x": "名門って、たくさん勝ってきたから？"}, {"t": 8.05, "x": "ところが、星稜の歴史を語ると、まず\n出てくるのは負けた試合なんだ。"}, {"t": 12.3, "x": "1つ目は1979年8月16日、夏の甲子園の3回戦。"}, {"t": 17.166666666666668, "x": "相手は和歌山の箕島だ。"}, {"t": 18.966666666666665, "x": "3対3のまま延長18回。その表、\n星稜の攻撃中に場内アナウンスが流れた。"}, {"t": 24.6, "x": "決着がつかなければ、翌朝8時30分から\n再試合になるという知らせだ。"}, {"t": 29.533333333333335, "x": "次の日の朝にもう1回やるってこと？"}, {"t": 31.966666666666665, "x": "そうだ。それを聞いた星稜の監督はこう話している。"}, {"t": 35.15, "x": "「堅田の肩が落ちるのがわかりました」。"}, {"t": 37.516666666666666, "x": "堅田って、ピッチャー？"}, {"t": 39.083333333333336, "x": "ああ。エースの堅田外司昭だ。"}, {"t": 41.05, "x": "星稜には、堅田しか投手がいなかった。"}, {"t": 43.733333333333334, "x": "その裏、箕島がサヨナラ勝ちを決めた。"}, {"t": 46.31666666666667, "x": "そして13年後。1992年の同じ8月16日。"}, {"t": 50.666666666666664, "x": "星稜の4番は、甲子園で一度も\nバットを振れずに夏を終えた。"}, {"t": 54.266666666666666, "x": "5打席すべて敬遠されたからだ。"}, {"t": 56.46666666666667, "x": "どっちも同じ日付なのね。"}, {"t": 58.3, "x": "監督は「8月16日は僕にとって\n特別なんですよ」と言っている。"}, {"t": 62.96666666666667, "x": "でもどっちも負けた試合よね。"}, {"t": 64.73333333333333, "x": "負けた試合で名前が残る\n学校って、なんだか不思議ね。"}, {"t": 68.76666666666667, "x": "星稜はどうやって、北陸を代表する名門になったの？"}, {"t": 72.3, "x": "今回は星稜高校の野球部を、\n日付と数字をもとに辿っていく。"}, {"t": 76.33333333333333, "x": "部員8人の出発から、夏の準優勝2回、\nそして今の星稜までだ。"}, {"t": 81.06666666666666, "x": "気に入ってもらえたら、チャンネル登録と\n高評価をお願いします。"}, {"t": 84.86666666666666, "x": "お願いします！"}, {"t": 86.51666666666667, "x": "星稜高校は石川県金沢市にある私立の学校だ。"}, {"t": 89.95, "x": "開校は1962年。はじめの名前は\n「実践第二高等学校」だった。"}, {"t": 95.31666666666666, "x": "最初から星稜じゃなかったのね。"}, {"t": 97.41666666666667, "x": "翌年に、生徒と先生から名前を\n募って「星稜」に変えた。"}, {"t": 101.51666666666667, "x": "野球部も開校と同じ1962年にできている。"}, {"t": 105.15, "x": "じゃあ、最初から強かったの？"}, {"t": 107.16666666666667, "x": "いや、そうじゃない。"}, {"t": 108.31666666666666, "x": "この野球部を作り上げたのが山下という監督だ。"}, {"t": 111.38333333333334, "x": "1945年2月に石川県で生まれた。"}, {"t": 114.35, "x": "高校は地元の門前高校だ。"}, {"t": 116.43333333333334, "x": "そのあと東京の駒澤大学に進んだ。"}, {"t": 118.88333333333334, "x": "大学ではレギュラーではなかった。"}, {"t": 120.83333333333333, "x": "卒業して金沢の星稜で社会科の先生になった。"}, {"t": 124.16666666666667, "x": "そこで野球部の監督も任されたんだ。"}, {"t": 126.71666666666667, "x": "先生と監督を両方やってたのね。"}, {"t": 129.1, "x": "ところが、当時の部員はたった8人だった。"}, {"t": 131.98333333333332, "x": "8人？野球って9人いないとできないわよね。"}, {"t": 135.01666666666668, "x": "そうだ。しかも野球部の専用グラウンドも無かった。"}, {"t": 138.1, "x": "それでも山下は、全校生徒の前でこう宣言した。"}, {"t": 141.46666666666667, "x": "「3年で甲子園に行く」。"}, {"t": 143.11666666666667, "x": "8人なのに？みんな驚いたでしょ。"}, {"t": 145.51666666666668, "x": "「8人で甲子園なんて無理だ」と、\n生徒たちに笑われたそうだ。"}, {"t": 149.35, "x": "山下は後に「まだ弱いチームだったので、\n超スパルタでやった」と話している。"}, {"t": 154.21666666666667, "x": "冬はグラウンドの雪かきを、\n生徒たちが手伝うようになった。"}, {"t": 157.91666666666666, "x": "学校のみんなが応援し始めたのね。"}, {"t": 160.31666666666666, "x": "監督になって2年後には、北陸大会で\n準優勝するチームになった。"}, {"t": 165.33333333333334, "x": "1971年の夏。星稜は\n石川大会の決勝まで勝ち上がった。"}, {"t": 170.16666666666666, "x": "でも決勝で敗れて甲子園には届かなかった。"}, {"t": 172.98333333333332, "x": "試合のあと、生徒たちが監督に\n「トイレに来てください」と言った。"}, {"t": 177.21666666666667, "x": "え、なんか怖い呼び出しね。"}, {"t": 179.05, "x": "山下も厳しい練習の仕返しをされると思ったそうだ。"}, {"t": 182.35, "x": "ところが選手たちは、山下を肩車で担ぎ上げた。"}, {"t": 185.93333333333334, "x": "仕返しじゃなくて、感謝だったのね。"}, {"t": 188.31666666666666, "x": "そして翌年の1972年夏。"}, {"t": 190.93333333333334, "x": "第54回大会で、星稜は甲子園に初めて出た。"}, {"t": 194.51666666666668, "x": "「3年で行く」という宣言より、\n1年遅れての出場だった。"}, {"t": 198.5, "x": "1年遅れでも、8人からならすごいじゃない。"}, {"t": 201.43333333333334, "x": "2度目の夏は1976年の第58回大会だ。"}, {"t": 205.36666666666667, "x": "2年生エースの小松辰雄が、大車輪の働きを見せた。"}, {"t": 208.98333333333332, "x": "星稜は勝ち進み、石川県勢として\n初めて準決勝に進んだ。"}, {"t": 213.38333333333333, "x": "小松辰雄って、プロに行った人？"}, {"t": 215.73333333333332, "x": "そうだ。のちに中日で投げた投手だ。"}, {"t": 218.21666666666667, "x": "翌1977年春には第49回のセンバツにも\n初めて出ている。"}, {"t": 223.2, "x": "これで春も夏も出たことになるのね。"}, {"t": 225.58333333333334, "x": "ああ。そして星稜の名前を全国に残す夏がやってくる。"}, {"t": 229.76666666666668, "x": "1979年夏の第61回大会。"}, {"t": 232.95, "x": "星稜にとって4回目の夏の甲子園だった。"}, {"t": 235.81666666666666, "x": "初戦の2回戦は京都の宇治に8対0で勝った。"}, {"t": 238.93333333333334, "x": "3回戦の相手が箕島だ。\nこの年の春のセンバツの優勝校だった。"}, {"t": 243.45, "x": "いきなり強い相手と当たったのね。"}, {"t": 245.56666666666666, "x": "山下は箕島の投手を打つために、ある作戦を立てた。"}, {"t": 249.1, "x": "バッターボックスの前寄りで、ベースに近づいて立つ。"}, {"t": 252.15, "x": "デッドボールも覚悟で打ちにいく、という作戦だ。"}, {"t": 255.13333333333333, "x": "体ごとぶつかっていく感じね。"}, {"t": 257.26666666666665, "x": "4回、星稜は5番の堅田のヒットで1点を先に取った。"}, {"t": 260.98333333333335, "x": "箕島もすぐに追いつき、1対1のまま延長に入った。"}, {"t": 264.53333333333336, "x": "12回表、星稜が1点を勝ち越す。"}, {"t": 267.23333333333335, "x": "でもその裏、ツーアウトから\nホームランで追いつかれた。"}, {"t": 270.3, "x": "あと1人だったのに！"}, {"t": 271.76666666666665, "x": "16回表には、7番打者のライト前ヒットで3対2。"}, {"t": 275.48333333333335, "x": "星稜はまた1点をリードした。"}, {"t": 277.3666666666667, "x": "16回裏、箕島は2人続けて\nアウトになった。あと1人だ。"}, {"t": 281.48333333333335, "x": "次の打者が、一塁側のファウルゾーンに\n打球を上げた。"}, {"t": 284.8333333333333, "x": "それを捕れば星稜の勝ちね。"}, {"t": 286.6666666666667, "x": "ところが、追いかけた一塁手の加藤が転んでしまった。"}, {"t": 289.96666666666664, "x": "ボールは捕れなかった。"}, {"t": 291.28333333333336, "x": "打ち直しになった打者は、\n左中間へホームランを打った。"}, {"t": 294.6, "x": "えっ、また同点！？"}, {"t": 295.96666666666664, "x": "3対3だ。山下はこう振り返っている。"}, {"t": 298.6666666666667, "x": "「加藤が転がった瞬間は、まあ\n仕方がないと思いました」。"}, {"t": 302.1333333333333, "x": "「同点に追いつかれたことで、\n加藤は大丈夫かなと思いました」。"}, {"t": 305.93333333333334, "x": "怒るんじゃなくて、選手を心配してたのね。"}, {"t": 308.8, "x": "17回は両チームとも3人で攻撃が終わった。"}, {"t": 311.85, "x": "そして18回表に、\nあの再試合のアナウンスが流れたわけだ。"}, {"t": 315.8, "x": "それでも堅田はヒットを打ち、星稜は満塁まで攻めた。"}, {"t": 319.1, "x": "だがあと1本が出なかった。"}, {"t": 320.81666666666666, "x": "18回裏。山下は伝令にメモを\n持たせてマウンドに送った。"}, {"t": 324.81666666666666, "x": "メモ？何て書いてあったの？"}, {"t": 326.6666666666667, "x": "「悔いのないように投げろよ」だ。"}, {"t": 328.43333333333334, "x": "でも堅田は疲れ切っていて、\nそのメモを読めなかったそうだ。"}, {"t": 332.0833333333333, "x": "それだけ、全部出し切ってたのね。"}, {"t": 334.4166666666667, "x": "ワンアウト一塁二塁から、\n打球がショートの頭を越えた。"}, {"t": 337.75, "x": "二塁ランナーがホームに滑り込み、\n箕島のサヨナラ勝ちだ。"}, {"t": 341.25, "x": "4時間近い試合だった。"}, {"t": 342.9, "x": "星稜の堅田は1人で208球を投げた。"}, {"t": 345.7, "x": "箕島のエースの石井は257球を投げている。"}, {"t": 348.95, "x": "2人とも最後まで投げ切ったのね。"}, {"t": 351.2, "x": "この試合のテレビ視聴率は29.4パーセントだった。"}, {"t": 354.6666666666667, "x": "山下は「その時間、金沢の町に\n人がいなかったらしい」と話している。"}, {"t": 359.3333333333333, "x": "ちょうどお盆で、盆踊りに集まった人も、\n途中で家に帰ってテレビを見たそうだ。"}, {"t": 364.1666666666667, "x": "町じゅうが星稜を応援してたのね。"}, {"t": 366.8666666666667, "x": "あれだけの試合で負けたら、\n監督はつらかったでしょうね。"}, {"t": 370.26666666666665, "x": "山下は「みなさんによくやったと\n言ってもらった」と言う。"}, {"t": 373.6166666666667, "x": "「でも、やっぱり負けたことは\n悔しかった」とも話している。"}, {"t": 377.1666666666667, "x": "そして、この試合で自分の器の小ささが\nよくわかった、と振り返った。"}, {"t": 381.65, "x": "自分のことをそんなふうに言うのね。"}, {"t": 383.75, "x": "さらにこんな言葉もある。"}, {"t": 385.3, "x": "「もしあの試合に勝っていたら、天狗になって\n監督をクビになったかもしれない」。"}, {"t": 389.73333333333335, "x": "負けたことが、かえってよかったってこと？"}, {"t": 392.31666666666666, "x": "少なくとも山下はそう受け止めている。"}, {"t": 394.7, "x": "「僕の野球観、人生観を変えてくれたのが、\nあの延長18回でした」。"}, {"t": 399.1666666666667, "x": "あの夏を見ていた下級生たちは、\n前よりも練習に打ち込んだ。"}, {"t": 402.8666666666667, "x": "星稜は1981年春のセンバツから\n5季続けて甲子園に出た。"}, {"t": 407.5833333333333, "x": "5季連続って、春夏春夏春ってこと？"}, {"t": 410.6166666666667, "x": "そうだ。こうして星稜は、\n甲子園の常連になっていった。"}, {"t": 414.2, "x": "延長18回を投げた堅田さんは、そのあとどうなったの？"}, {"t": 417.81666666666666, "x": "堅田は高校野球の審判になった。"}, {"t": 420.26666666666665, "x": "審判！？今度は審判として甲子園に戻ったのね。"}, {"t": 423.5833333333333, "x": "2018年8月6日。"}, {"t": 425.45, "x": "第100回の記念大会の1回戦だ。"}, {"t": 427.96666666666664, "x": "この日の始球式に立ったのが、\n箕島のエースだった石井だ。"}, {"t": 431.65, "x": "今は名字が変わって、\n木村竹志という名前になっている。"}, {"t": 435.06666666666666, "x": "そして、その試合の球審を務めていたのが堅田だった。"}, {"t": 438.71666666666664, "x": "39年前に投げ合った2人が、\n同じグラウンドにいたのね。"}, {"t": 442.6333333333333, "x": "木村の投げたアンダースローの球は、\nワンバウンドせずにミットに届いた。"}, {"t": 446.65, "x": "投げ終わると、2人はがっちりと握手を交わした。"}, {"t": 449.55, "x": "木村は「僕の人生の中でも、ずっと\nあの試合が残っている」と話している。"}, {"t": 454.45, "x": "負けた側も勝った側も、ずっと\n大事にしてる試合なのね。"}, {"t": 458.55, "x": "1989年1月7日。"}, {"t": 460.93333333333334, "x": "昭和天皇が亡くなり、元号が平成に変わった。"}, {"t": 464.06666666666666, "x": "山下はこのとき野球のやり方を見直したという。"}, {"t": 467.01666666666665, "x": "「勝つ野球から、選手を育てる\n野球にしようと考えました」。"}, {"t": 470.81666666666666, "x": "練習をゆるくしたってこと？"}, {"t": 472.65, "x": "いや。練習の厳しさは同じだと言っている。"}, {"t": 475.31666666666666, "x": "変えたのはグラウンドの外のことだ。"}, {"t": 477.4, "x": "広島に遠征したときは、\n平和記念資料館を見学させた。"}, {"t": 481.3666666666667, "x": "同じ10代の若者が、どんな気持ちで\n戦争に行ったのかを考えさせたんだ。"}, {"t": 486.05, "x": "野球だけじゃなくて、人として育てようとしたのね。"}, {"t": 489.4166666666667, "x": "山下は「心を磨かないと野球は\nうまくならない」と話している。"}, {"t": 493.43333333333334, "x": "この翌年に入ってきたのが松井秀喜だ。"}, {"t": 496.21666666666664, "x": "あの松井さん！星稜だったのね。"}, {"t": 498.4, "x": "山下には、松井が\n1年生の冬の忘れられない場面がある。"}, {"t": 502.2, "x": "ティーバッティングで、\nほかの選手はいい音を響かせていた。"}, {"t": 505.3666666666667, "x": "ところが、松井のバットからは大きな音がしなかった。"}, {"t": 508.7, "x": "調子が悪かったの？"}, {"t": 510.1333333333333, "x": "違う。ボールの下を打って、回転をかける\n打ち方を練習していたんだ。"}, {"t": 514.3166666666667, "x": "山下は「こいつは違うな」と\n思い、あえて注意しなかった。"}, {"t": 518.1833333333333, "x": "周りからは、勝手なことしてるように見えたかもね。"}, {"t": 521.3, "x": "実際「怒らないんですか」と聞かれたそうだ。"}, {"t": 524.1666666666666, "x": "山下は「松井は考えてやっているから」と答えた。"}, {"t": 527.55, "x": "松井は野球部を引退するとき山下に頭を下げた。"}, {"t": 530.7833333333333, "x": "「僕が考えて練習していたとき、何も\n言わなくてありがとうございました」。"}, {"t": 535.1666666666666, "x": "監督の見守りが、ちゃんと伝わってたのね。"}, {"t": 538.0666666666667, "x": "1991年夏の第73回大会。"}, {"t": 541.2833333333333, "x": "星稜にとって10回目の夏の甲子園だ。"}, {"t": 543.95, "x": "2年生の松井を中心に、星稜は\n2度目のベスト4に進んだ。"}, {"t": 548.0333333333333, "x": "小松さんのとき以来の、ベスト4ね。"}, {"t": 551.0666666666667, "x": "1992年夏の第74回大会。"}, {"t": 554.1833333333333, "x": "松井は3年生で、4番を打っていた。"}, {"t": 556.7, "x": "1回戦は新潟の長岡向陵に11対0で大勝した。"}, {"t": 560.4666666666667, "x": "2回戦は8月16日。"}, {"t": 562.2833333333333, "x": "相手は高知の明徳義塾だった。"}, {"t": 564.4666666666667, "x": "この試合で、松井は5打席すべて敬遠された。"}, {"t": 567.5, "x": "5回とも、勝負してもらえなかったの？"}, {"t": 570.05, "x": "そうだ。試合は2対3で星稜が敗れた。"}, {"t": 572.7, "x": "この敬遠は、のちに社会問題として\n大きく取り上げられた。"}, {"t": 576.3, "x": "ただし敬遠は野球のルールで認められた作戦だ。"}, {"t": 579.25, "x": "当時の松井は、打席で感情を一切表に出さなかった。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
