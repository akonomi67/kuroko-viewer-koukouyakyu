<script>
const D={"name": "早稲田実業", "file": "006_編集用", "dur": 984.46665625, "segs": [], "subs": [{"t": 0.0, "x": "2006年8月21日。"}, {"t": 2.033333333333333, "x": "兵庫県の甲子園球場。"}, {"t": 3.816666666666667, "x": "夏の決勝は、前の日に決着がつかなかった。"}, {"t": 6.966666666666667, "x": "延長15回、1対1の引き分けだ。"}, {"t": 9.666666666666666, "x": "それで、次の日にもう1回やったのね。"}, {"t": 12.25, "x": "そうだ。決勝の再試合は37年ぶりだった。"}, {"t": 15.383333333333333, "x": "9回表、2アウト。早稲田実業が\n4対3で1点リードしている。"}, {"t": 19.816666666666666, "x": "マウンドには、早実のエースの斎藤佑樹。"}, {"t": 22.433333333333334, "x": "打席には、駒大苫小牧のエースの田中将大。"}, {"t": 25.833333333333332, "x": "最後の打者が、相手のエースだったの？"}, {"t": 28.3, "x": "ああ。斎藤はスライダーを続けて追い込んだ。"}, {"t": 30.85, "x": "ファウルで粘られて、7球目。"}, {"t": 32.833333333333336, "x": "投げたのは144キロのまっすぐだった。"}, {"t": 35.483333333333334, "x": "空振り三振。早稲田実業の、夏の初めての優勝だ。"}, {"t": 39.43333333333333, "x": "夏は初めてなのね。もっと前から強いと思ってた。"}, {"t": 42.833333333333336, "x": "この学校は、1915年の第1回大会にも出ている。"}, {"t": 46.733333333333334, "x": "それでも、深紅の優勝旗には91年かかった。"}, {"t": 50.13333333333333, "x": "91年ってすごく長いわね。"}, {"t": 52.36666666666667, "x": "その間に春の優勝が1回ある。"}, {"t": 54.55, "x": "1957年。投げていたのは2年生の王貞治だ。"}, {"t": 58.46666666666667, "x": "あの王さん？ホームランの人よね。"}, {"t": 60.6, "x": "そうだ。そして1980年には、\n1年生の荒木大輔がいた。"}, {"t": 65.33333333333333, "x": "王さん、荒木さん、斎藤さん。"}, {"t": 67.18333333333334, "x": "名前だけで人が集まりそう。"}, {"t": 69.05, "x": "どうして早実は、時代ごとに主役が出てくるの？"}, {"t": 72.23333333333333, "x": "今回は、早稲田実業の野球部の歴史を辿る。"}, {"t": 75.4, "x": "3つの時代を、日付と数字をもとに見ていく。"}, {"t": 78.3, "x": "最後に2015年の1年生の話もする。"}, {"t": 81.38333333333334, "x": "面白かったら、チャンネル登録と高評価をお願いね。"}, {"t": 85.28333333333333, "x": "早稲田実業学校は、1901年に開校した。"}, {"t": 88.85, "x": "はじめの100年は、男子校だった。"}, {"t": 91.13333333333334, "x": "校舎は東京の早稲田鶴巻町にあった。"}, {"t": 93.78333333333333, "x": "早稲田大学の近くね。"}, {"t": 95.53333333333333, "x": "ああ。早稲田大学の系属校だ。"}, {"t": 97.73333333333333, "x": "野球部は、1915年の第1回の夏の大会に出た。"}, {"t": 101.66666666666667, "x": "1924年の第1回の選抜では、決勝まで進んだ。"}, {"t": 105.75, "x": "決勝の相手は、香川の高松商だった。"}, {"t": 108.61666666666666, "x": "春も夏も第1回から出てるのね。"}, {"t": 110.96666666666667, "x": "古い時代の話は別の回で触れている。"}, {"t": 113.46666666666667, "x": "今回は戦後の話から始めよう。"}, {"t": 115.71666666666667, "x": "1955年の夏。早実に、29歳の監督が来た。"}, {"t": 120.15, "x": "宮井監督だ。"}, {"t": 121.4, "x": "29歳ってずいぶん若いわね。"}, {"t": 123.55, "x": "その翌年の1956年。ひとりの1年生が入ってくる。"}, {"t": 127.76666666666667, "x": "東京の墨田区で生まれた、王貞治だ。"}, {"t": 130.51666666666668, "x": "いよいよ王さんね。"}, {"t": 132.25, "x": "王は、はじめは投手だった。"}, {"t": 134.1, "x": "左投げで、球はとても重かったと伝えられている。"}, {"t": 137.26666666666668, "x": "受けていた捕手は、140\nキロくらい出ていたと話している。"}, {"t": 140.96666666666667, "x": "その時代に140キロって、速いわね。"}, {"t": 143.81666666666666, "x": "ただ、はじめは四球が多かった。"}, {"t": 145.93333333333334, "x": "そこで、振りかぶらない投げ方に変えた。"}, {"t": 148.4, "x": "これで球が安定したと伝えられている。"}, {"t": 150.85, "x": "投げ方を変えてよくなったのね。"}, {"t": 152.86666666666667, "x": "1957年の春。第29回の選抜大会だ。"}, {"t": 156.91666666666666, "x": "王は2年生で、エースだった。"}, {"t": 158.86666666666667, "x": "初戦の相手は大阪の寝屋川。"}, {"t": 160.86666666666667, "x": "1安打10奪三振で完封した。"}, {"t": 163.23333333333332, "x": "いきなり完封なのね。"}, {"t": 164.78333333333333, "x": "準々決勝は山口の柳井。"}, {"t": 166.73333333333332, "x": "5安打11奪三振。四球はひとつも出さずに完封だ。"}, {"t": 170.38333333333333, "x": "準決勝は福岡の久留米商。"}, {"t": 172.36666666666667, "x": "4安打でまた完封した。"}, {"t": 174.18333333333334, "x": "3試合続けて、点を取られてないの？"}, {"t": 176.73333333333332, "x": "ああ。3試合連続の完封だ。"}, {"t": 178.81666666666666, "x": "決勝までに、34イニング続けて点を与えていない。"}, {"t": 182.25, "x": "決勝の相手は高知商だった。"}, {"t": 184.28333333333333, "x": "決勝も0点で抑えたの？"}, {"t": 186.18333333333334, "x": "いや、3点を取られた。"}, {"t": 187.78333333333333, "x": "左手の中指と人差し指に、マメができていた。"}, {"t": 191.06666666666666, "x": "そのマメがつぶれて、ボールは血で染まったという。"}, {"t": 193.95, "x": "痛そう。それでも最後まで投げたのね。"}, {"t": 196.45, "x": "ああ。5対3で勝って、早実は初めて日本一になった。"}, {"t": 200.23333333333332, "x": "東京の学校が、選抜で優勝したのも初めてだ。"}, {"t": 203.61666666666667, "x": "優勝旗が、初めて箱根の山を越えたと言われた。"}, {"t": 206.86666666666667, "x": "箱根を越えるって、関東に来たってことね。"}, {"t": 209.56666666666666, "x": "東京の人たちも、きっと喜んだのね。"}, {"t": 212.33333333333334, "x": "そうだ。優勝のパレードも、大きなものだった。"}, {"t": 215.9, "x": "その年の夏。早実はまた甲子園に来た。"}, {"t": 218.83333333333334, "x": "2回戦の相手は大阪の寝屋川だった。"}, {"t": 221.43333333333334, "x": "春の初戦と同じ相手ね。"}, {"t": 223.3, "x": "ああ。この試合は、0対0のまま延長に入った。"}, {"t": 226.51666666666668, "x": "延長11回、早実が1点を取った。"}, {"t": 229.16666666666666, "x": "1対0。王は、11回を投げて\nヒットを1本も許さなかった。"}, {"t": 233.4, "x": "ノーヒットノーランってこと？"}, {"t": 235.1, "x": "そうだ。延長でのノーヒットノーランだ。"}, {"t": 237.45, "x": "春も夏も合わせて、この試合のほかに例が無い。"}, {"t": 240.5, "x": "今でも王さんだけの記録なのね。"}, {"t": 242.63333333333333, "x": "王は在学中に、甲子園へ4度出ている。"}, {"t": 245.21666666666667, "x": "1959年には、読売巨人軍に入った。"}, {"t": 248.68333333333334, "x": "1962年に一本足打法を作り上げた。"}, {"t": 251.93333333333334, "x": "そのあとの活躍は、知っての通りだ。"}, {"t": 254.45, "x": "甲子園では、投げる方で名前を残したのね。"}, {"t": 257.35, "x": "ああ。そして早実の練習場は、\n今も王の名前を持っている。"}, {"t": 261.1166666666667, "x": "王貞治記念グラウンドだ。"}, {"t": 262.8833333333333, "x": "八王子市にあって、部員はそこで練習している。"}, {"t": 265.93333333333334, "x": "王さんの名前のグラウンドで、毎日練習するのね。"}, {"t": 269.71666666666664, "x": "時代は進んで、1970年代の終わり。"}, {"t": 272.8333333333333, "x": "早実は1977年の春から、\n1978年の夏まで甲子園に出た。"}, {"t": 278.65, "x": "4季続けての出場だ。"}, {"t": 280.3833333333333, "x": "このころの部員に、荒木健二という選手がいた。"}, {"t": 283.45, "x": "荒木って、さっきの荒木さん？"}, {"t": 285.5, "x": "その兄だ。弟の荒木大輔は1980年の春に入ってきた。"}, {"t": 290.15, "x": "大輔は、リトルリーグで\n世界一になったことで知られていた。"}, {"t": 293.8333333333333, "x": "子どものころから、有名だったのね。"}, {"t": 296.25, "x": "1980年の夏。東東京大会が始まった。"}, {"t": 300.1333333333333, "x": "このとき大輔は三塁手の控えだった。"}, {"t": 302.8, "x": "えっ、投手じゃなかったの？"}, {"t": 304.6, "x": "2年生のエースの芳賀が、\n練習中にふくらはぎを痛めた。"}, {"t": 308.1666666666667, "x": "バントの練習のときだったという。"}, {"t": 310.15, "x": "そこで、1年生の大輔が投げることになった。"}, {"t": 313.35, "x": "急にエースになったのね。"}, {"t": 315.0, "x": "ああ。背番号は11のままだった。"}, {"t": 317.25, "x": "東東京大会の決勝は、二松学舎が相手だった。"}, {"t": 320.76666666666665, "x": "早実は10対4で勝った。"}, {"t": 322.6166666666667, "x": "それでも、優勝候補だと言う人は少なかった。"}, {"t": 325.75, "x": "まだだれも知らなかったのね。"}, {"t": 327.56666666666666, "x": "大輔が控えから甲子園の準優勝投手になるまで、\nわずか2か月だった。"}, {"t": 332.3333333333333, "x": "たった2か月で、そんなに変わったのね。"}, {"t": 334.95, "x": "甲子園の初戦は大阪の北陽。"}, {"t": 337.05, "x": "大輔は、1安打で完封した。6対0だ。"}, {"t": 340.23333333333335, "x": "この日の観客は4万4000人だった。"}, {"t": 342.8, "x": "本人はこう話している。"}, {"t": 344.3666666666667, "x": "北陽戦の2時間で、早実の\nまわりだけが別の世界になった。"}, {"t": 348.5, "x": "1試合で急に有名になったのね。"}, {"t": 350.76666666666665, "x": "2回戦は京都の東宇治。9対1で勝った。"}, {"t": 353.78333333333336, "x": "観客は5万8000人に増えていた。"}, {"t": 356.25, "x": "1万4000人も増えたの？"}, {"t": 358.1666666666667, "x": "ああ。3回戦は札幌商に2対0。"}, {"t": 360.7, "x": "準々決勝は沖縄の興南に3対0。"}, {"t": 363.46666666666664, "x": "準決勝は滋賀の瀬田工に8対0だ。"}, {"t": 366.1333333333333, "x": "また0点ばっかり！"}, {"t": 367.53333333333336, "x": "5試合のうち4試合が完封だった。"}, {"t": 369.76666666666665, "x": "初戦から準決勝まで、44回3分の1を無失点。"}, {"t": 373.68333333333334, "x": "1年生でそれはすごいわね。"}, {"t": 375.6, "x": "この人気は、大ちゃんフィーバーと呼ばれた。"}, {"t": 378.68333333333334, "x": "1980年8月22日。夏の決勝だ。"}, {"t": 382.3833333333333, "x": "相手は神奈川の横浜。"}, {"t": 383.8666666666667, "x": "エースは3年生の愛甲猛だった。"}, {"t": 386.45, "x": "1年生と3年生のエースね。"}, {"t": 388.6666666666667, "x": "1回表。早実が2安打とバント、\nスクイズで1点を取った。"}, {"t": 392.6666666666667, "x": "その裏、横浜は3連打で追いついた。"}, {"t": 395.2, "x": "大輔の無失点は、ここで止まった。"}, {"t": 397.6166666666667, "x": "横浜は2回に1点、3回に2点を足した。"}, {"t": 400.6166666666667, "x": "大輔は3回まで投げて、レフトへ回った。"}, {"t": 403.56666666666666, "x": "最後まで投げられなかったのね。"}, {"t": 405.56666666666666, "x": "早実も4回に2点、5回に1点を返した。"}, {"t": 408.6166666666667, "x": "それでも届かなかった。4対6だ。"}, {"t": 411.0833333333333, "x": "早実は準優勝。横浜は、夏の初めての優勝だった。"}, {"t": 415.15, "x": "あと少しで初優勝だったのね。"}, {"t": 417.35, "x": "愛甲は、のちにこう語っている。"}, {"t": 419.4, "x": "1年生なのに、投げ方が出来上がっていて感心した。"}, {"t": 422.93333333333334, "x": "相手からも認められてたのね。"}, {"t": 424.93333333333334, "x": "愛甲は球場の声援のことも覚えていた。"}, {"t": 427.43333333333334, "x": "女の子の悲鳴はすごかった、と話している。"}, {"t": 430.3333333333333, "x": "アイドルみたいね。"}, {"t": 431.5, "x": "大輔の甲子園は、ここで終わらない。"}, {"t": 433.85, "x": "早実は、大輔がいる間に5季続けて甲子園に出た。"}, {"t": 437.43333333333334, "x": "1980年の夏から、1982年の夏までだ。"}, {"t": 441.76666666666665, "x": "甲子園での成績は、12勝5敗だった。"}, { const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
