<style>

<script>
const D={"name": "天理", "file": "013_編集用", "dur": 948.3333125, "segs": [], "subs": [{"t": 0.0, "x": "1986年8月21日。"}, {"t": 2.7666666666666666, "x": "兵庫県の甲子園球場。"}, {"t": 4.516666666666667, "x": "夏の決勝は9回裏に入っていた。"}, {"t": 6.9, "x": "奈良の天理と、愛媛の松山商。"}, {"t": 9.033333333333333, "x": "スコアは3対2で天理が1点リードしている。"}, {"t": 11.75, "x": "2アウト、ランナーはいない。"}, {"t": 13.25, "x": "あと1人で奈良に初めて優勝旗が渡る。"}, {"t": 15.85, "x": "打球は三塁手の山下の前に転がった。"}, {"t": 18.666666666666668, "x": "これで終わり？"}, {"t": 19.6, "x": "いや。一塁への送球が低いワンバウンドになった。"}, {"t": 22.616666666666667, "x": "ボールはファウルゾーンへ\n転がり、打者は二塁まで進んだ。"}, {"t": 25.85, "x": "うわあ、あと1人のところで。"}, {"t": 27.766666666666666, "x": "そのとき山下は、投手の本橋にこう言ったという。"}, {"t": 30.966666666666665, "x": "「もう一度俺のところに打たせてくれ」。"}, {"t": 33.016666666666666, "x": "次の打球は、本当にまた山下の前に飛んできた。"}, {"t": 36.36666666666667, "x": "山下はそれをさばき、試合が終わった。"}, {"t": 38.96666666666667, "x": "自分のところに来てほしいって、\n言えるのがすごいわね。"}, {"t": 42.166666666666664, "x": "これが奈良県勢の夏の初優勝だ。"}, {"t": 44.65, "x": "奈良って、それまで夏に勝ったことがなかったのね。"}, {"t": 48.31666666666667, "x": "天理って名前はよく聞くけど、どんな学校なの？"}, {"t": 51.266666666666666, "x": "なんで奈良のこの学校が、何度も\n日本一になれたのかしら。"}, {"t": 55.05, "x": "今回は天理の野球部の歴史を、\n日付と数字をもとに辿っていく。"}, {"t": 59.11666666666667, "x": "最後まで見てもらえたら、\nチャンネル登録と高評価をお願いしたい。"}, {"t": 63.05, "x": "よろしくね。"}, {"t": 64.53333333333333, "x": "天理高校があるのは、奈良県の天理市だ。"}, {"t": 67.15, "x": "学校の始まりは1900年にさかのぼる。"}, {"t": 69.91666666666667, "x": "この年に天理教校という学校ができた。"}, {"t": 72.61666666666666, "x": "天理って、天理教の天理なのね。"}, {"t": 74.96666666666667, "x": "そうだ。天理教の学校教育は、ここから始まった。"}, {"t": 78.41666666666667, "x": "1908年には、5年制の天理中学校がつくられた。"}, {"t": 82.3, "x": "今の天理高校は、この旧制中学の創立を\n学校の始まりとして数えている。"}, {"t": 87.23333333333333, "x": "2008年に創立100周年の式典を\n開いたのも、そのためだ。"}, {"t": 91.63333333333334, "x": "1908年って、明治の終わりごろよね。"}, {"t": 94.63333333333334, "x": "ああ。明治41年だ。"}, {"t": 96.41666666666667, "x": "戦争中の1943年には、昼の第一部と\n夜の第二部の形になった。"}, {"t": 101.75, "x": "そして戦後の1948年、\n男女共学の新制高校として新しく出発する。"}, {"t": 107.58333333333333, "x": "高校になったのは、戦後すぐなのね。"}, {"t": 110.1, "x": "そこから天理は、奈良の高校野球の中心になっていく。"}, {"t": 113.51666666666667, "x": "甲子園の優勝は、春に1回、\n夏に2回。あわせて3度だ。"}, {"t": 117.66666666666667, "x": "3回も日本一なんだ。"}, {"t": 119.46666666666667, "x": "ただ、最初からずっと強かったわけではない。"}, {"t": 122.78333333333333, "x": "天理が初めて甲子園に出たのは、1954年春の選抜だ。"}, {"t": 127.16666666666667, "x": "この大会から2大会続けて甲子園に出た。"}, {"t": 130.01666666666668, "x": "だが、どちらも勝てなかった。"}, {"t": 131.9, "x": "それどころか、1点も取れずに帰っている。"}, {"t": 134.63333333333333, "x": "初めての甲子園って、そういうものなのかもね。"}, {"t": 137.66666666666666, "x": "最初の出場から初勝利までは5年かかった。"}, {"t": 140.61666666666667, "x": "初勝利は3回目の出場だった。"}, {"t": 142.75, "x": "1959年春の選抜だ。"}, {"t": 145.3, "x": "相手は福岡の久留米商。2対0で勝った。"}, {"t": 148.1, "x": "同じ年の夏には2つ勝って、ベスト8まで進んでいる。"}, {"t": 151.9, "x": "1959年が、最初の大きな一歩だったのね。"}, {"t": 155.56666666666666, "x": "実はこの1959年の選抜には、\nもう1つ大事な始まりがある。"}, {"t": 160.43333333333334, "x": "野球の話じゃないの？"}, {"t": 162.05, "x": "応援の話だ。ヒットが出たときに\n吹奏楽が鳴らす短い曲があるだろう。"}, {"t": 166.63333333333333, "x": "ソーファーレー、ドレファ、ソッレソー、という音だ。"}, {"t": 169.6, "x": "あ、聞いたことある。いろんな学校が吹いてるやつね。"}, {"t": 172.73333333333332, "x": "あのファンファーレは、\n天理の吹奏楽部が生んだものだ。"}, {"t": 175.78333333333333, "x": "1959年の第31回選抜で、\n天理の吹奏楽部が初めて吹いた。"}, {"t": 181.21666666666667, "x": "えっ、あれって天理の曲だったの？"}, {"t": 183.48333333333332, "x": "ああ。初代の指揮者だった矢野がつくった。"}, {"t": 186.0, "x": "アメリカの作曲家リチャード・\nボウルズの「マクシンカッキー序曲」が\n元になっている。"}, {"t": 191.03333333333333, "x": "その一部のフレーズを使って、\n短い曲にまとめたものだ。"}, {"t": 194.76666666666668, "x": "今はいろんな学校で吹かれてるわよね。"}, {"t": 197.11666666666667, "x": "今では阪神タイガースの応援でも使われている。"}, {"t": 199.9, "x": "天理の曲だと知らない人も多いという。"}, {"t": 202.36666666666667, "x": "吹奏楽部もかなり古いのね。"}, {"t": 204.45, "x": "吹奏楽部ができたのは1936年だ。"}, {"t": 207.63333333333333, "x": "1942年には、天理中学校として\n全国の大会に初めて出て3位に入った。"}, {"t": 213.3, "x": "この大会が、のちの全日本吹奏楽コンクールになる。"}, {"t": 216.86666666666667, "x": "野球より先に、吹奏楽が全国で強かったのね。"}, {"t": 220.36666666666667, "x": "天理の応援は、ほとんど\n同じ曲の繰り返しだと紹介されている。"}, {"t": 224.26666666666668, "x": "「セント・ポール」に「オブラディ・オブラダ」。\nそれに「ラブ・ミー・テンダー」と「ワッショイ」だ。"}, {"t": 230.03333333333333, "x": "そしてチャンスになると、天理ファンファーレが鳴る。"}, {"t": 232.73333333333332, "x": "流行りの曲には、手を出さないという。"}, {"t": 235.06666666666666, "x": "ずっと同じ曲なのが、逆にかっこいいわね。"}, {"t": 237.88333333333333, "x": "南海などで活躍した門田博光も、天理の出身だ。"}, {"t": 241.93333333333334, "x": "プロでもすごい人が出てるのね。"}, {"t": 243.95, "x": "柔道でオリンピック3連覇を果たした\n野村忠宏も天理の出身だ。"}, {"t": 248.05, "x": "2017年の記事では、ドラフトが始まってから\n26人がプロに進んだとされている。"}, {"t": 253.55, "x": "野球だけじゃなくて、いろんな人が出てるのね。"}, {"t": 256.98333333333335, "x": "奈良って、天理のほかにも強い学校があるわよね。"}, {"t": 260.1166666666667, "x": "ああ。智弁学園だ。"}, {"t": 261.51666666666665, "x": "智弁学園の野球部は1965年にできた。"}, {"t": 264.8333333333333, "x": "天理より、ずっとあとから出てきた学校だ。"}, {"t": 267.6, "x": "じゃあ、最初は天理が1強だったの？"}, {"t": 269.98333333333335, "x": "奈良には古くから郡山という伝統校もある。"}, {"t": 272.73333333333335, "x": "奈良の学校として夏に初めて\n甲子園へ出たのは郡山だ。"}, {"t": 276.21666666666664, "x": "1933年のことだ。"}, {"t": 278.43333333333334, "x": "天理と智弁学園と郡山の3校は、\n奈良の御三家と呼ばれてきた。"}, {"t": 282.7, "x": "ただ、夏の甲子園に出た\n回数を見ると、2校が抜けている。"}, {"t": 286.45, "x": "1972年から43年間の夏の奈良代表を\n数えた記事がある。"}, {"t": 291.2, "x": "天理と智弁学園のほかに出たのは、たった4回だ。"}, {"t": 294.56666666666666, "x": "43年で4回だけ？"}, {"t": 296.46666666666664, "x": "郡山が1974年と1993年と2000年。"}, {"t": 300.5833333333333, "x": "桜井が2013年だ。"}, {"t": 302.46666666666664, "x": "1975年から1992年までの18年間は、\n毎年どちらかが出ている。"}, {"t": 308.5, "x": "まさに両雄ね。"}, {"t": 309.7, "x": "智弁学園も2016年の選抜で\n初めて全国の頂点に立った。"}, {"t": 314.23333333333335, "x": "ライバルも日本一になってるのね。"}, {"t": 316.45, "x": "天理が甲子園に出るには、まず奈良で\n智弁学園と競り合うことになる。"}, {"t": 320.48333333333335, "x": "その奈良の代表として、初めて\n全国の頂点に立ったのが1986年だ。"}, {"t": 325.96666666666664, "x": "奈良の人たちは、きっと大喜びだったでしょうね。"}, {"t": 329.56666666666666, "x": "1986年の天理を率いたのは、監督の橋本武徳だ。"}, {"t": 334.1666666666667, "x": "のちに中村は、橋本の野球をこう振り返っている。"}, {"t": 337.4, "x": "バントが好きではなかった。"}, {"t": 338.85, "x": "サインもほとんど出さなかった。"}, {"t": 340.71666666666664, "x": "選手を細かく管理する監督ではなかった、という。"}, {"t": 344.05, "x": "ずいぶん自由な監督さんなのね。"}, {"t": 346.21666666666664, "x": "その年の主将が中村良二だ。"}, {"t": 348.3666666666667, "x": "橋本は中村のことを、\n「史上最高のキャプテン」と呼んだ。"}, {"t": 352.1666666666667, "x": "最高って言われるの、うれしいでしょうね。"}, {"t": 354.56666666666666, "x": "橋本は中村にこう声をかけていた。"}, {"t": 356.98333333333335, "x": "「何かあったら言ってこい。できるだけ\n聞いてやるから」。"}, {"t": 359.8666666666667, "x": "中村は「高校野球はこうあるべき、ということは\n橋本先生から学びました」と話している。"}, {"t": 365.75, "x": "選手のほうから話しやすい監督だったのね。"}, {"t": 368.65, "x": "ある日、中村は練習を半日にしてほしいと頼んだ。"}, {"t": 372.01666666666665, "x": "橋本の答えは\n「午前中だけ全力でやってくれ」だった。"}, {"t": 375.75, "x": "午後に選手が遊びに出ることも\n分かったうえで許したという。"}, {"t": 379.2, "x": "怒られるかと思ったら、任せてくれたのね。"}, {"t": 382.0, "x": "天理はこの前の年、1985年春の選抜にも出ている。"}, {"t": 386.3, "x": "そして1986年の夏、奈良県勢として\n初めて決勝まで勝ち上がった。"}, {"t": 391.7, "x": "決勝に行くこと自体が、奈良では初めてだったんだ。"}, {"t": 395.0, "x": "決勝の相手は、愛媛の松山商だ。"}, {"t": 397.51666666666665, "x": "天理は3対2で逃げ切った。"}, {"t": 399.3666666666667, "x": "最後は冒頭の場面だ。"}, {"t": 400.75, "x": "三塁手の山下が、もう一度来た打球をさばいた。"}, {"t": 404.15, "x": "1回失敗したあとに、ちゃんと取り返したのね。"}, {"t": 407.23333333333335, "x": "主将の中村はこの年のドラフト\n2位で、近鉄に入団している。"}, {"t": 411.35, "x": "キャプテンがそのままプロに行ったんだ。"}, {"t": 413.55, "x": "橋本はその後、天理を\n2度目の日本一にも導くことになる。"}, {"t": 418.1333333333333, "x": "1990年は第72回の大会だ。"}, {"t": 421.21666666666664, "x": "この年、地方大会に出た\n学校の数が初めて4千を超えた。"}, {"t": 425.2, "x": "4,027校だ。"}, {"t": 426.81666666666666, "x": "4千校の頂点って、想像できないわね。"}, {"t": 429.68333333333334, "x": "天理のエースは南竜次だ。"}, {"t": 431.4166666666667, "x": "天理は決勝まで勝ち上がった。"}, {"t": 433.3, "x": "決勝の相手は沖縄水産だ。"}, {"t": 435.35, "x": "沖縄水産は沖縄県勢として初めて決勝に進んでいた。"}, {"t": 439.25, "x": "沖縄の学校が初めて甲子園に\n出てから32年目のことだった。"}, {"t": 443.51666666666665, "x": "どっちも負けられない決勝ね。"}, {"t": 445.46666666666664, "x": "この試合で、天理が取った点は1点だけだった。"}, {"t": 448.45, "x": "南はその1点を守り、9回までゼロに抑え続けた。"}, {"t": 451.96666666666664, "x": "最後は9回裏。2アウトでランナーは二塁にいた。"}, {"t": 455.0833333333333, "x": "一打同点の場面じゃない。"}, {"t": 456.81666666666666, "x": "打球はレフトへの深い当たりになった。"}, {"t": 459.03333333333336, "x": "これを天理のレフトが好捕して、試合が終わった。"}, {"t": 462.05, "x": "最後の最後まで、どっちに転ぶか分からなかったのね。"}, {"t": 465.4166666666667, "x": "1対0の完封だ。天理は\n4年ぶり2度目の夏の優勝を果たした。"}, {"t": 469.73333333333335, "x": "1986年からたった4年で、もう1回なんだ。"}, {"t": 473.46666666666664, "x": "1点を守り切ったエースが、すごかったのね。"}, {"t": 476.85, "x": "夏は2回勝ったけど、春はまだだったのよね。"}, {"t": 479.8333333333333, "x": "そうだ。春の選抜の初優勝は1997年になる。"}, {"t": 483.9166666666667, "x": "このときの天理には、3年生の投手が2人いた。"}, {"t": 487.1333333333333, "x": "左投げの小南と、右投げの長崎だ。"}, {"t": 489.96666666666664, "x": "小南は変化球でかわす投手で、\n長崎は速い球で押す投手だった。"}, {"t": 494.51666666666665, "x": "タイプの違う2人なのね。"}, {"t": 496.2, "x": "2人とも頼れるピッチャーだったってこと？"}, {"t": 498.7, "x": "ああ。二枚看板と呼ばれた。"}, {"t": 500.55, "x": "初戦の相手は徳島商だった。"}, {"t": 502.45, "x": "サヨナラで勝った。"}, {"t": 503.71666666666664, "x": "2回戦は静岡の浜松工。"}, {"t": 505.6, "x": "7安打に抑えて完封した。"}, {"t": 507.55, "x": "準々決勝は山口の西京。"}, {"t": 509.46666666666664, "x": "10奪三振、1失点の完投だ。"}, {"t": 512.1333333333333, "x": "どんどん勢いがついていくのね。"}, {"t": 514.1166666666667, "x": "準決勝は大阪の上宮。"}, {"t": 515.8666666666667, "x": "5安打1失点の完投で、逆転して勝った。"}, {"t": 518.95, "x": "決勝の相手は愛知の中京大中京だ。"}, {"t": 521.5, "x": "ここでは11個の三振を奪い、1失点に抑えた。"}, {"t": 524.9, "x": "最後まで投手が崩れなかったのね。"}, {"t": 527.2, "x": "天理はこれで春夏あわせて3度目の日本一になった。"}, {"t": 530.55, "x": "長崎はその後、プリンスホテルを経て\n2000年のドラフト3位でロッテに入った。"}, {"t": 535.2166666666667, "x": "1986年の夏から数えて11年で、\n3本の優勝旗を手にしたことになる。"}, {"t": 540.9666666666667, "x": "夏2回と春1回、これで3つそろったのね。"}, {"t": 544.55, "x": "1986年のキャプテンだった\n中村さんは、どうなったの？"}, {"t": 548.7833333333333, "x": "近鉄には10年いた。だが一軍では\n41試合に出ただけだった。"}, {"t": 552.9833333333333, "x": "一軍の成績は51打数5安打。"}, {"t": 555.2666666666667, "x": "ホームランは0本だ。"}, {"t": 556.7, "x": "一方で、二軍ではホームランを通算110本打っている。"}, {"t": 560.1833333333333, "x": "二軍ではそんなに打ってたのに。"}, {"t": 562.1166666666667, "x": "最後まで一軍のレギュラーはつかめなかった。"}, {"t": 564.65, "x": "1989年にはキャンプから\n一軍について行き、開幕の一軍にも入った。"}, {"t": 569.8666666666667, "x": "それでも二軍に落ちている。"}, {"t": 571.45, "x": "1998年から、中村は\n藤井寺リトルシニアの監督になった。"}, {"t": 576.2, "x": "中学生の硬式野球のチームだ。"}, {"t": 578.2833333333333, "x": "報酬のないボランティアだった。"}, {"t": 580.2166666666667, "x": "じゃあ、生活はどうしてたの？"}, {"t": 582.1666666666666, "x": "平日の2日は少年野球の練習、\nほかの3日は朝から夕方まで働いた。"}, {"t": 587.0666666666667, "x": "夜はコンビニの夜勤に入っていたという。"}, {"t": 589.4166666666666, "x": "本人は「2年くらいは、3日ほど寝ない\n生活を送りました」と話している。"}, {"t": 594.3166666666667, "x": "それでも野球を教えるのはやめなかったのね。"}, {"t": 596.9333333333333, "x": "中学生の指導は9年続いた。"}, {"t": 599.1333333333333, "x": "そのあと日本新薬の臨時コーチや、\n大和高田クラブのコーチを務めた。"}, {"t": 603.6166666666667, "x": "2008年8月には、天理大学の野球部の監督になる。"}, {"t": 607.5666666666667, "x": "2014年2月に天理高校のコーチになった。"}, {"t": 610.5666666666667, "x": "このとき理事長から、こう頼まれたという。"}, {"t": 613.0833333333334, "x": "「恩師を甲子園に出して監督を引き継いでほしい」。"}, {"t": 616.0333333333333, "x": "恩師って、橋本監督のことね。"}, {"t": 618.5333333333333, "x": "そうだ。橋本は秋の明治神宮大会と\n春の選抜、夏の甲子園の3つに出た。"}, {"t": 623.8833333333333, "x": "そして勇退した。2015年8月、\n中村が監督を引き継いだ。"}, {"t": 628.6166666666667, "x": "師匠を送り出してから、交代したのね。"}, {"t": 631.25, "x": "中村はプロの年月をこう振り返っている。"}, {"t": 633.8333333333334, "x": "「僕は、指導者になるために\nプロの11年間があったんじゃないか」。"}, {"t": 637.8, "x": "プロで苦労したことが、教える側で生きたのね。"}, {"t": 641.3, "x": "中村は2015年の秋から、変わったやり方を始めた。"}, {"t": 645.0166666666667, "x": "ベンチに入るメンバーを、選手の投票で選ぶのだ。"}, {"t": 648.15, "x": "えっ、監督が決めるんじゃないの？"}, {"t": 650.3333333333334, "x": "選手が名前を書いて20人を選ぶ。"}, {"t": 652.4333333333333, "x": "枠の外にもう2人まで書いてよい。"}, {"t": 654.6, "x": "これを春と夏と秋の3つの大会でやっている。"}, {"t": 657.5, "x": "中村は「自分が思う、天理のベストメンバーを\n選んで」と伝えている。"}, {"t": 661.8, "x": "そして「大人の目では\n見えないものがあるんですね」と話している。"}, {"t": 665.7333333333333, "x": "橋本監督の自由なやり方に、ちょっと似てるかも。"}, {"t": 669.1333333333333, "x": "試合中のサインも少ない。"}, {"t": 670.65, "x": "1試合で3つほどだと紹介されている。"}, {"t": 673.1333333333333, "x": "打席の選手には、\nベンチの顔色を見てほしくないと考えている。"}, {"t": 677.0, "x": "「監督、サインはいりません。"}, {"t": 678.5666666666667, "x": "僕が何とかします」と思ってほしいのだという。"}, {"t": 681.4833333333333, "x": "練習の中身もコーチやスタッフと\n話して決め、任せることが多い。"}, {"t": 685.55, "x": "選手にはこうも言っている。"}, {"t": 686.9666666666667, "x": "「一丸になって戦わないと、うちは\n絶対に勝てないよ」。"}, {"t": 690.55, "x": "選手が自分で考えるチームってことね。"}, {"t": 693.1166666666667, "x": "2017年夏、中村は監督として\n初めて甲子園のベンチに入った。"}, {"t": 697.9333333333333, "x": "2回戦で大垣日大に6対0で勝ち、\n監督として初勝利を挙げた。"}, {"t": 702.5, "x": "試合後、中村はこう話して言葉に詰まった。"}, {"t": 705.45, "x": "「まさか僕がね…。母校のユニホームを\n着て、甲子園へ帰って来られるとは\n思ってもいなかったので…」。"}, {"t": 710.95, "x": "母校に帰ってこられて、うれしかったのね。"}, {"t": 713.6333333333333, "x": "この夏、天理はベスト4まで進んだ。"}, {"t": 716.0, "x": "優勝した1990年以来、27年ぶりの4強だ。"}, {"t": 720.1833333333333, "x": "キャプテンが監督になって、また\n強い天理が戻ってきたのね。"}, {"t": 724.0333333333333, "x": "2021年春の選抜でも、天理は4強に入っている。"}, {"t": 727.85, "x": "このときのエースが達孝太だ。"}, {"t": 729.7333333333333, "x": "達は10日間で459球を投げていた。"}, {"t": 732.6333333333333, "x": "1回戦が161球。2回戦が134球。"}, {"t": 736.1833333333333, "x": "準々決勝が164球だ。"}, {"t": 738.6666666666666, "x": "そんなに投げたら、体がもたないんじゃない？"}, {"t": 741.3666666666667, "x": "準々決勝のあと、達は脇腹の痛みを訴えた。"}, {"t": 744.6333333333333, "x": "バントの処理で滑り込んだときに痛めたものだった。"}, {"t": 747.5833333333334, "x": "中村はその日のうちに、準決勝は\n投げさせないと決めた。"}, {"t": 751.2, "x": "具合を聞けば、達は投げられると\n答えただろうと中村は話している。"}, {"t": 755.2666666666667, "x": "その夜に伝えると、達は黙ってうなずいたという。"}, {"t": 758.4, "x": "勝ちたい気持ちより、体を守るほうを選んだのね。"}, {"t": 762.0166666666667, "x": "2024年1月からは、\n天理のOBの藤原が監督を務めている。"}, {"t": 766.55, "x": "藤原は天理大学の監督として、\nリーグ優勝を11回重ねてきた人だ。"}, {"t": 771.55, "x": "また天理の出身の人が監督なのね。"}, {"t": 774.2333333333333, "x": "2025年夏の奈良大会の決勝は、\n天理と智弁学園の対戦になった。"}, {"t": 779.1333333333333, "x": "天理は3対2で勝ち、\n3年ぶり30度目の夏の甲子園を決めた。"}, {"t": 783.3666666666667, "x": "春の選抜に続いて、春夏連続の甲子園だった。"}, {"t": 787.0, "x": "最後はやっぱり、智弁学園との勝負なのね。"}, {"t": 789.9333333333333, "x": "2026年の夏は、奈良大会の決勝を8対0で勝った。"}, {"t": 793.9333333333333, "x": "31度目の出場だ。"}, {"t": 795.7666666666667, "x": "そして2026年8月10日。"}, {"t": 798.05, "x": "甲子園の2回戦で福山に7対2で勝った。"}, {"t": 801.0333333333333, "x": "これで天理の夏の甲子園の勝利は、\n通算50勝になった。"}, {"t": 804.7666666666667, "x": "天理にとっては4年ぶりの甲子園での白星でもあった。"}, {"t": 808.1166666666667, "x": "50勝って、どのくらいすごいの？"}, {"t": 810.3666666666667, "x": "夏の50勝に届いたのは、天理で史上4校目だ。"}, {"t": 813.6333333333333, "x": "中京大中京が79勝。"}, {"t": 815.6166666666667, "x": "龍谷大平安が61勝。"}, {"t": 817.5666666666667, "x": "松山商が60勝。その次が天理になる。"}, {"t": 820.75, "x": "松山商って、1986年の決勝の相手よね。"}, {"t": 824.7666666666667, "x": "そうだ。春と夏をあわせた\n勝利も、この日で80勝に届いた。"}, {"t": 828.8166666666667, "x": "天理はこの夏、準々決勝で三重に7対0で勝った。"}, {"t": 832.4, "x": "2017年以来の4強だ。"}, {"t": 834.4333333333333, "x": "準決勝では健大高崎に敗れ、決勝には届かなかった。"}, {"t": 838.3333333333334, "x": "夏の4強は、2017年と2026年で中村と\n藤原の2人の監督がつかんだことになる。"}, {"t": 844.8833333333333, "x": "監督が替わっても、ちゃんとまた4強まで来てるのね。"}, {"t": 848.7666666666667, "x": "結局、天理がずっと強いのはなんでなのかしら。"}, {"t": 851.8666666666667, "x": "1つは、人がつながってきたことだろう。"}, {"t": 854.4666666666667, "x": "1986年の主将が、プロを経て母校の監督になった。"}, {"t": 858.7333333333333, "x": "今の監督も、天理のOBだ。"}, {"t": 860.85, "x": "橋本の「選手に任せる」考え方は、\n中村の投票やサインの少なさにも表れている。"}, {"t": 866.7666666666667, "x": "教わったやり方が、次の代に渡っていったのね。"}, {"t": 869.9666666666667, "x": "もう1つは、奈良の中で競り合う\n相手がいたことではないか。"}, {"t": 873.4333333333333, "x": "1972年から43年間、夏の代表は\nほとんど天理と智弁学園だった。"}, {"t": 878.9833333333333, "x": "甲子園の前に、毎年いちばん強い\n相手と戦ってきたことになる。"}, {"t": 883.2166666666667, "x": "ライバルがいたから、強くなれたってことね。"}, {"t": 885.9333333333333, "x": "それに応援も変わらない。"}, {"t": 887.2666666666667, "x": "1959年のファンファーレが今も鳴っている。"}, {"t": 890.35, "x": "変えないものを持ちながら、やり方は\n少しずつ新しくしてきた。"}, {"t": 894.2, "x": "それが長く勝ち続ける力になったのかもしれない。"}, {"t": 897.4333333333333, "x": "古いものと新しいものが、両方あるのが天理なのね。"}, {"t": 901.35, "x": "最初の問いに戻るわね。"}, {"t": 902.7666666666667, "x": "奈良のこの学校は、どうして\n何度も日本一になれたの？"}, {"t": 906.3833333333333, "x": "ひとことで言えば、教わった野球が\n次の代へ手渡されてきたからだと思う。"}, {"t": 910.7666666666667, "x": "1986年に優勝した主将の中村は、\n29年後に母校の監督になった。"}, {"t": 916.55, "x": "橋本の「選手に任せる」やり方を、\n自分の代でも続けた。"}, {"t": 920.9, "x": "そして奈良の中には、いつも智弁学園がいたのね。"}, {"t": 924.2, "x": "ああ。甲子園の前に、いちばん\n強い相手と毎年ぶつかってきた。"}, {"t": 928.2333333333333, "x": "でも、夏の優勝は1990年が最後なのよね。"}, {"t": 931.9333333333333, "x": "そうだ。2026年の夏も準決勝で止まり、\n36年ぶりの優勝には届かなかった。"}, {"t": 937.9666666666667, "x": "3度目の夏の日本一は、いつ来るのかしら。"}, {"t": 941.0, "x": "その日の決勝でも、きっと\n1959年のファンファーレが鳴っている。"}, {"t": 945.45, "x": "見てくれて、ありがとう。またね。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
