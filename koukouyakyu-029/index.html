<style>

<script>
const D={"name": "高知高校", "file": "029_編集用", "dur": 1032.45, "segs": [], "subs": [{"t": 0.0, "x": "1975年4月6日。"}, {"t": 2.15, "x": "兵庫県の甲子園球場。"}, {"t": 3.9, "x": "春のセンバツ大会の決勝は、延長13回に入っていた。"}, {"t": 7.7, "x": "点数は5対5。12回の裏には、本塁で\n1人がタッチアウトになっている。"}, {"t": 12.433333333333334, "x": "決勝で延長13回？　ずいぶん長いわね。"}, {"t": 15.283333333333333, "x": "13回の表。攻めるのは高知県の高知高校だ。"}, {"t": 18.65, "x": "この回、三塁打が2本続いた。"}, {"t": 20.75, "x": "2本目を打ったのは杉村繁。"}, {"t": 23.033333333333335, "x": "打球は遊撃手の右を抜けて、\n左中間の深くまで転がった。"}, {"t": 26.966666666666665, "x": "高知はこの回に5点を取った。"}, {"t": 28.883333333333333, "x": "最後は10対5。高知はセンバツで\n初めての優勝を決めた。"}, {"t": 32.61666666666667, "x": "相手はどこだったの？"}, {"t": 34.016666666666666, "x": "神奈川の東海大相模だ。"}, {"t": 35.7, "x": "4番を打っていたのは2年生の原辰徳。"}, {"t": 38.68333333333333, "x": "原辰徳って、あとで巨人に行く人よね。"}, {"t": 41.78333333333333, "x": "そうだ。その原にこの試合で\nホームランを打たれている。"}, {"t": 44.85, "x": "そしてこの日、高知のベンチにいた\n監督は28歳だった。"}, {"t": 48.56666666666667, "x": "名前は岡本道雄。"}, {"t": 50.2, "x": "11年前の夏、この人は同じ甲子園で\n高知の1番打者だった。"}, {"t": 54.666666666666664, "x": "えっ、選手としても甲子園に来ていたの？"}, {"t": 57.416666666666664, "x": "ああ。しかもその夏、高知は日本一になっている。"}, {"t": 60.766666666666666, "x": "11年のあいだに、選手から\n監督になって、また勝ったってこと？"}, {"t": 64.96666666666667, "x": "その11年に、何があったのかしら。"}, {"t": 68.05, "x": "今回は高知高校。高知市にある私立の学校だ。"}, {"t": 71.25, "x": "甲子園には春21回、夏13回。"}, {"t": 73.85, "x": "合わせて34回出ている。"}, {"t": 75.7, "x": "通算は37勝32敗。"}, {"t": 77.75, "x": "日本一は春と夏に1回ずつだ。"}, {"t": 80.26666666666667, "x": "春も夏も勝っているのね。"}, {"t": 82.06666666666666, "x": "高知県で春と夏の両方を勝った\n学校は、高知高校しかない。"}, {"t": 86.01666666666667, "x": "夏の日本一は1964年。"}, {"t": 88.43333333333334, "x": "春の日本一は1975年。"}, {"t": 91.05, "x": "今回はこの2つの優勝がどう\nつながっていたのかを、日付と数字で辿る。"}, {"t": 95.63333333333334, "x": "1番打者だった人が、どうやって\n監督になったのかも気になるわ。"}, {"t": 99.75, "x": "本編の前に、チャンネル登録と\n高評価をお願いしたい。"}, {"t": 103.25, "x": "よろしくね。"}, {"t": 104.21666666666667, "x": "では、まずは学校の始まりから見ていこう。"}, {"t": 107.41666666666667, "x": "学校の始まりは、1899年の4月だ。"}, {"t": 110.8, "x": "明治32年になる。"}, {"t": 112.43333333333334, "x": "高知市の中に、小さな学校ができた。\n名前は江陽学舎。"}, {"t": 116.46666666666667, "x": "最初から高知高校じゃなかったのね。"}, {"t": 118.85, "x": "ああ。4年後の1903年に、江陽学校と名前を変えた。"}, {"t": 122.85, "x": "1906年には、同じ高知市の中で場所を移っている。"}, {"t": 126.71666666666667, "x": "そこが、いまの場所なの？"}, {"t": 128.48333333333332, "x": "ちがう。いまの場所に来るのは、まだ50年も先だ。"}, {"t": 131.68333333333334, "x": "大正に入ると、商業を教える学校になっていく。"}, {"t": 134.83333333333334, "x": "1916年に、簡単な商業の科を置いた。"}, {"t": 138.06666666666666, "x": "1919年には城東商業学校ができた。\nこのときは3年で卒業する学校だった。"}, {"t": 143.88333333333333, "x": "1926年に5年制に上がっている。"}, {"t": 146.85, "x": "城東っていう名前がここで出てくるのね。"}, {"t": 149.35, "x": "ああ。戦争のあとの1948年、新しい\n制度で城東高校と城東中学になった。"}, {"t": 155.21666666666667, "x": "ひとつ、まぎらわしい話をしておく。"}, {"t": 157.53333333333333, "x": "同じ高知市には、県立の城東中という\n別の学校もあった。"}, {"t": 161.4, "x": "1946年の夏の甲子園に、高知県から\n初めて出た学校だ。いまの高知追手前だ。"}, {"t": 167.63333333333333, "x": "名前が同じで、別の学校？"}, {"t": 169.46666666666667, "x": "ややこしいわね。"}, {"t": 170.68333333333334, "x": "だから今回の話の「城東」は、\n私立の城東高校のことだ。"}, {"t": 174.98333333333332, "x": "この城東高校は、1955年に春と\n夏の甲子園に続けて出ている。"}, {"t": 179.88333333333333, "x": "春は初戦で敗れた。だが夏は\n2つ勝って、8強に入った。"}, {"t": 184.05, "x": "最初の夏から、ベスト8？"}, {"t": 186.2, "x": "そうだ。城東の名前で出た\n甲子園は、この2回だけになる。"}, {"t": 189.91666666666666, "x": "翌年の1956年5月、学校を動かす\n法人が学校法人高知学園になった。"}, {"t": 195.76666666666668, "x": "それに合わせて、城東高校は高知高校に、\n城東中学は高知中学に名前を変えた。"}, {"t": 201.18333333333334, "x": "1957年3月。学校は高知市の別の場所に\n移った。ここがいまの場所だ。"}, {"t": 206.85, "x": "名前と場所が、いまの形にそろったのね。"}, {"t": 210.16666666666666, "x": "高知高校として初めての甲子園は、1957年の夏だ。"}, {"t": 214.56666666666666, "x": "結果は2回戦で敗退。"}, {"t": 216.25, "x": "春のセンバツに高知の名前で初めて\n出たのは1962年。ここも2回戦で敗れた。"}, {"t": 221.98333333333332, "x": "なかなか上までは行けないのね。"}, {"t": 223.93333333333334, "x": "1963年の夏。高知はまた甲子園に来た。"}, {"t": 227.61666666666667, "x": "エースは2年生の有藤通世。"}, {"t": 229.73333333333332, "x": "あとでロッテで2000本以上のヒットを\n打つことになる選手だ。"}, {"t": 233.25, "x": "そんな人が、高校ではピッチャーだったの？"}, {"t": 235.93333333333334, "x": "ああ。この夏は2回戦で青森の東奥義塾と当たった。"}, {"t": 239.31666666666666, "x": "延長10回の裏、サヨナラで敗れている。"}, {"t": 242.06666666666666, "x": "あと1歩で、また2回戦ね。"}, {"t": 244.11666666666667, "x": "そして翌年。有藤は3年生になった。"}, {"t": 246.8, "x": "同じ学年には、1番を打つ\n遊撃手がいた。それが岡本道雄だ。"}, {"t": 251.36666666666667, "x": "この夏の監督は溝淵峯男。"}, {"t": 253.68333333333334, "x": "溝淵は土佐、安芸、高知の3校を、春と夏で\n合わせて7回甲子園に連れて行った監督だ。"}, {"t": 260.2, "x": "1964年の夏。第46回の全国高校野球選手権大会だ。"}, {"t": 265.5, "x": "出場は30校。高知は2年続けて甲子園に来た。"}, {"t": 269.05, "x": "初戦は8月12日。相手は秋田の秋田工だ。"}, {"t": 272.3333333333333, "x": "この試合で、思わぬことが起きた。"}, {"t": 274.5, "x": "4番の有藤の顔に、ボールが当たったんだ。"}, {"t": 277.18333333333334, "x": "顔に？　大けがじゃない！"}, {"t": 278.76666666666665, "x": "あごの骨が折れていた。"}, {"t": 280.0, "x": "有藤は入院して、このあとの試合には\n出られなくなった。"}, {"t": 283.51666666666665, "x": "4番がいきなりいなくなっちゃうの？"}, {"t": 285.55, "x": "そうだ。それでも高知はこの試合を4対1で勝っている。"}, {"t": 288.8666666666667, "x": "有藤はこのあと、病院のベッドからテレビで\n仲間の試合を見ていたと伝えられている。"}, {"t": 293.76666666666665, "x": "自分のいないチームを、テレビで見るのね。"}, {"t": 296.21666666666664, "x": "このあと好投を続けたのが、2年生の光内だ。"}, {"t": 299.48333333333335, "x": "まだ2年生なのね。"}, {"t": 300.95, "x": "ああ。ところが災難は、これで終わらなかった。"}, {"t": 304.3333333333333, "x": "2回戦は8月14日。"}, {"t": 306.05, "x": "相手は岩手の花巻商だ。"}, {"t": 307.9166666666667, "x": "この試合で、今度は\n主将の三野の頭の後ろにボールが当たった。"}, {"t": 311.68333333333334, "x": "三野は試合から退いて、そのあとは出られなくなった。"}, {"t": 314.98333333333335, "x": "えっ、また？　4番に続いてキャプテンまで？"}, {"t": 317.75, "x": "そうだ。それでも高知は3対2。"}, {"t": 319.75, "x": "1点差で勝ち抜いた。"}, {"t": 321.3666666666667, "x": "2人がいなくても、勝っちゃうのね。"}, {"t": 323.6, "x": "準々決勝は8月16日。"}, {"t": 325.7, "x": "相手は京都の平安だ。"}, {"t": 327.31666666666666, "x": "平安の捕手は、のちに広島で\n活躍する衣笠祥雄だった。"}, {"t": 331.53333333333336, "x": "この試合を、高知は5対2で勝った。"}, {"t": 333.9166666666667, "x": "平安って、すごく古い強豪よね。"}, {"t": 336.35, "x": "ああ。そして準決勝は8月17日。"}, {"t": 338.96666666666664, "x": "相手は宮崎の宮崎商だ。"}, {"t": 340.98333333333335, "x": "宮崎商は、宮崎県の学校として\n初めて4強に入っていた。"}, {"t": 345.18333333333334, "x": "この試合は1対0。高知が1点を守り切った。"}, {"t": 348.45, "x": "1点差、3点差、1点差。ずっと接戦ね。"}, {"t": 351.8833333333333, "x": "ああ。4試合のうち、3点の差がついたのは\n初戦と準々決勝だけだ。"}, {"t": 356.45, "x": "4番もキャプテンもいないのに、決勝まで来たのね。"}, {"t": 360.0833333333333, "x": "1964年8月18日。"}, {"t": 362.65, "x": "決勝の相手は山口の早鞆だ。"}, {"t": 364.93333333333334, "x": "早鞆のマウンドには、のちに\n大洋に入る亀井進がいた。"}, {"t": 368.8333333333333, "x": "試合は1回の表から動いた。"}, {"t": 370.81666666666666, "x": "高知は四球とバントヒット、\nライト前へのヒットで満塁にした。"}, {"t": 374.56666666666666, "x": "次の打者は三塁へのゴロ。"}, {"t": 376.26666666666665, "x": "早鞆は本塁で1つ、一塁でもう1つ。"}, {"t": 379.01666666666665, "x": "2つのアウトを取りにいった。"}, {"t": 380.75, "x": "ところが一塁への送球が\nそれた。この間に1点が入った。"}, {"t": 384.6333333333333, "x": "相手のミスで先に点が取れたのね。"}, {"t": 386.95, "x": "まだ続きがある。次の打者のとき、\n三塁の走者がホームに走った。"}, {"t": 391.28333333333336, "x": "えっ、ホームスチール？"}, {"t": 392.78333333333336, "x": "そうだ。本塁を盗んで2点目だ。"}, {"t": 395.1166666666667, "x": "決勝の1回で、そんなことをするなんて！"}, {"t": 397.85, "x": "あとは光内だ。早鞆に打たれたヒットは、たった2本。"}, {"t": 401.3333333333333, "x": "2対0。高知は夏の甲子園で初めて優勝した。"}, {"t": 404.6166666666667, "x": "高知県の学校が夏に勝ったのも、\nこれが初めてだった。"}, {"t": 408.31666666666666, "x": "1回戦で4番、2回戦でキャプテン。それでも日本一ね。"}, {"t": 412.1666666666667, "x": "5試合の失点は、合わせて5点。"}, {"t": 414.15, "x": "完封は準決勝と決勝の2試合だ。"}, {"t": 416.6166666666667, "x": "この優勝チームで、1番を\n打っていたのが岡本道雄だった。"}, {"t": 420.6, "x": "冒頭の28歳の監督ね。"}, {"t": 422.81666666666666, "x": "ああ。岡本はこのあと法政大学に進む。"}, {"t": 425.6, "x": "ただ当時の法政は選手が多く、\nレギュラーにはなれなかったと伝えられている。"}, {"t": 430.06666666666666, "x": "日本一の1番打者でも、大学では出られなかったのね。"}, {"t": 433.76666666666665, "x": "有藤の方は近畿大学に進んだ。"}, {"t": 436.1333333333333, "x": "1968年のドラフト会議で、東京オリオンズから\n1位で指名されている。いまのロッテだ。"}, {"t": 442.65, "x": "日本一から3年後の1967年。"}, {"t": 445.55, "x": "高知は春のセンバツで決勝まで進んだ。"}, {"t": 448.15, "x": "このチームには、のちにロッテと\n阪神でプレーする弘田澄男がいた。"}, {"t": 452.28333333333336, "x": "決勝の相手は大分の津久見だ。"}, {"t": 454.4, "x": "今度は春も勝てそう？"}, {"t": 455.95, "x": "4回の表に、津久見が先に1点を取った。"}, {"t": 458.8666666666667, "x": "高知は8回の裏に、1対1に追いついた。"}, {"t": 461.81666666666666, "x": "追いついたのね！"}, {"t": 462.9166666666667, "x": "だがそのあと、点が入らない。"}, {"t": 464.68333333333334, "x": "試合は延長に入った。"}, {"t": 466.26666666666665, "x": "津久見のエースは吉良修一。\nこの試合で16個の三振を取っている。"}, {"t": 470.5, "x": "延長12回の表。津久見にホームランが出た。"}, {"t": 473.45, "x": "2対1。高知は準優勝に終わった。"}, {"t": 475.96666666666664, "x": "あと1点で、春夏の両方だったのに。"}, {"t": 478.6333333333333, "x": "津久見はこの優勝で、大分県の学校として\n初めて甲子園を制した。"}, {"t": 483.0, "x": "そして春の優勝旗は、このあと\n8年、高知高校に来ない。"}, {"t": 487.3833333333333, "x": "1969年。法政大学を出た\n岡本道雄が、母校の監督になった。"}, {"t": 492.8333333333333, "x": "このとき23歳だ。"}, {"t": 494.51666666666665, "x": "23歳！　選手とほとんど年が変わらないじゃない。"}, {"t": 497.78333333333336, "x": "ああ。5年前に日本一になったとき、\n岡本は3年生だった。"}, {"t": 501.8666666666667, "x": "つまり監督になった年の3年生は、岡本が\n卒業したあとに入ってきた後輩だ。"}, {"t": 507.28333333333336, "x": "日本一の先輩が、そのまま監督で来たってことね。"}, {"t": 510.9, "x": "監督として初めての甲子園は、1971年の春だ。"}, {"t": 515.1666666666666, "x": "結果は1回戦で敗退。"}, {"t": 516.7166666666667, "x": "翌年の1972年の春も、初戦で敗れた。"}, {"t": 520.6, "x": "最初はなかなか勝てなかったのね。"}, {"t": 522.8166666666667, "x": "そして1974年。高知は春の甲子園で8強まで進んだ。"}, {"t": 527.2333333333333, "x": "このチームに、2年生の杉村繁がいた。"}, {"t": 530.25, "x": "2回戦では神奈川の横浜と当たった。"}, {"t": 532.75, "x": "延長12回、サヨナラで勝っている。"}, {"t": 535.1833333333333, "x": "横浜に勝ったの！"}, {"t": 536.6, "x": "ただ準々決勝で和歌山の和歌山工に敗れた。"}, {"t": 539.6166666666667, "x": "同じ年の夏も甲子園に出たが、\n2回戦で中京商に敗れている。"}, {"t": 543.9666666666667, "x": "上まで来ているけど、あと少し届かないのね。"}, {"t": 546.9, "x": "杉村は背が170センチに\n届かない、小柄な打者だった。"}, {"t": 550.7333333333333, "x": "それでも強い当たりを打つので、\n「中西太二世」と呼ばれた。"}, {"t": 554.9, "x": "中西太って？"}, {"t": 556.5666666666667, "x": "西鉄ライオンズの強打者だ。"}, {"t": 558.25, "x": "ホームランで有名だった人だ。"}, {"t": 560.1666666666666, "x": "そして神奈川には、1学年下の強打者がいた。"}, {"t": 563.1333333333333, "x": "東海大相模の原辰徳だ。"}, {"t": 565.45, "x": "2人は「西の杉村、東の原」と並べて呼ばれたという。"}, {"t": 569.5833333333334, "x": "冒頭の決勝の2人ね。"}, {"t": 571.9, "x": "1975年の春。第47回のセンバツ大会だ。"}, {"t": 576.05, "x": "出場は29校。この大会は、ひとつ\n大きく変わったことがあった。"}, {"t": 580.5333333333333, "x": "何が変わったの？"}, {"t": 581.8166666666667, "x": "センバツで初めて、金属のバットが使われたんだ。"}, {"t": 584.9833333333333, "x": "大会の本塁打は、合わせて11本出ている。"}, {"t": 587.9166666666666, "x": "木のバットから金属に。"}, {"t": 589.35, "x": "打球が速くなりそうね。"}, {"t": 591.0833333333334, "x": "高知の最初の相手は熊本の熊本工だ。"}, {"t": 593.8333333333334, "x": "5対4。1点差で勝った。"}, {"t": 595.7, "x": "準々決勝は福井の福井商。"}, {"t": 597.6, "x": "2対1でまた1点差だ。"}, {"t": 599.35, "x": "準決勝は兵庫の報徳学園。"}, {"t": 601.2666666666667, "x": "3対2。これも1点差だった。"}, {"t": 603.5833333333334, "x": "3試合続けて1点差？"}, {"t": 605.4333333333333, "x": "ああ。決勝までの3試合で、取った点は10点。"}, {"t": 608.2666666666667, "x": "取られた点は7点。"}, {"t": 609.7833333333333, "x": "大差では1回も勝ってないのね。"}, {"t": 611.9, "x": "そうだ。11年前の夏と同じように、\n競り合いを勝ち抜いた。"}, {"t": 615.7333333333333, "x": "エースは山岡利則。決勝の相手は、\n東海大相模だった。"}, {"t": 620.4833333333333, "x": "4月6日の決勝。先に点を取ったのは東海大相模だ。"}, {"t": 624.2833333333333, "x": "1回の裏。三塁打のあと、暴投で走者が\n三塁と本塁のあいだに挟まれた。"}, {"t": 629.15, "x": "ところが三塁手の送球が走者の体に\n当たった。この間に1点が入った。"}, {"t": 634.0333333333333, "x": "相手が運よく先に点を取ったのね。"}, {"t": 636.3333333333334, "x": "続く原が、レフトのスタンドに\nホームランを打ち込んだ。"}, {"t": 639.5333333333333, "x": "この大会の11本目の本塁打だ。"}, {"t": 641.8666666666667, "x": "スクイズも決まって、東海大相模は\nこの回に3点を取った。"}, {"t": 645.7666666666667, "x": "いきなり3点も取られちゃったの。"}, {"t": 647.85, "x": "ああ。だが高知も追いかける。"}, {"t": 649.4, "x": "4対3と1点差で、5回の表を迎えた。"}, {"t": 652.4666666666667, "x": "1アウトから三塁打。"}, {"t": 653.7666666666667, "x": "続く杉村がセンター前に打って、4対4の同点にした。"}, {"t": 657.6833333333333, "x": "杉村くん、ここでも打ってる！"}, {"t": 659.65, "x": "7回の表。今度は東海大相模の送球がそれた。"}, {"t": 663.2166666666667, "x": "二塁へ走った走者を刺そうとした\n球が、悪送球になったんだ。"}, {"t": 667.0833333333334, "x": "これで高知が5対4と、初めて前に出た。"}, {"t": 669.9833333333333, "x": "逆転ね！"}, {"t": 670.95, "x": "だが8回の裏。原の三塁打から、\n東海大相模が5対5に追いついた。"}, {"t": 675.7, "x": "また振り出しね。"}, {"t": 676.8833333333333, "x": "ここから両チームとも点が入らない。"}, {"t": 678.8833333333333, "x": "試合は延長に入った。"}, {"t": 680.4833333333333, "x": "12回の裏。東海大相模は2アウトから\n一塁と二塁に走者を出した。"}, {"t": 684.9833333333333, "x": "ライト前へのヒット。"}, {"t": 686.1333333333333, "x": "二塁の走者がホームに走った。"}, {"t": 688.1333333333333, "x": "だがライトからの返球がよかった。"}, {"t": 690.0833333333334, "x": "走者は本塁でタッチアウトになった。"}, {"t": 692.4666666666667, "x": "冒頭の、本塁でのアウトね！"}, {"t": 694.5166666666667, "x": "そうだ。そして13回の表。"}, {"t": 696.7, "x": "三塁打のあと、杉村も三塁打。\nこれで勝ち越しの1点だ。"}, {"t": 700.5833333333334, "x": "さらにスクイズで、もう1点。"}, {"t": 702.4333333333333, "x": "そのあとヒットが2本続き、最後にまた三塁打が出た。"}, {"t": 705.9166666666666, "x": "この回だけで5点。10対5だ。"}, {"t": 708.1666666666666, "x": "最後の最後で、一気に決まったのね。"}, {"t": 710.6833333333333, "x": "投げ切ったのは山岡だ。"}, {"t": 712.1, "x": "決勝は3時間33分かかった。"}, {"t": 714.65, "x": "決勝で延長13回は、それまでの最も\n長い記録に並ぶものだった。"}, {"t": 719.1666666666666, "x": "両チームのヒットは合わせて26本。\nこれも決勝の最多の記録に並んだ。"}, {"t": 723.8, "x": "記録だらけの決勝だったのね。"}, {"t": 725.9166666666666, "x": "地元の高知新聞がこの優勝を振り返った記事には、"}, {"t": 728.9666666666667, "x": "「こんな感激見たことない」という\n見出しがついている。"}, {"t": 732.15, "x": "選手として夏、監督として春。"}, {"t": 734.4, "x": "岡本さんは両方で日本一になったのね。"}, {"t": 737.2833333333333, "x": "ああ。選手と監督の両方で\n甲子園の優勝を経験した人は、多くない。"}, {"t": 741.8833333333333, "x": "1964年の夏の1番打者が、\n11年後に春の優勝監督になった。"}, {"t": 747.85, "x": "優勝のあとの1975年の夏。"}, {"t": 750.45, "x": "高知は甲子園に出られなかった。"}, {"t": 752.5833333333334, "x": "春の日本一でも、夏は甲子園に行けなかったのね。"}, {"t": 756.0833333333334, "x": "ああ。その秋、杉村はヤクルトから\nドラフトの1位で指名された。"}, {"t": 760.05, "x": "漫画家の水島新司は、この頃の杉村を\n『ドカベン』の微笑三太郎のモデルにしたと\n伝えられている。"}, {"t": 766.5666666666667, "x": "漫画のモデルにまでなったの？"}, {"t": 768.4166666666666, "x": "プロではおもに内野を守った。\nそして引退したあと、打撃のコーチになった。"}, {"t": 772.9666666666667, "x": "ヤクルトでは、青木宣親や山田哲人、\n村上宗隆といった打者を教えている。"}, {"t": 778.55, "x": "横浜では、内川聖一が首位打者を\n取ったときのコーチだった。"}, {"t": 782.75, "x": "高校の小さな強打者が、\n強打者を育てる人になったのね。"}, {"t": 786.6333333333333, "x": "杉村は2025年の10月に、\nヤクルトのコーチを退いている。"}, {"t": 790.75, "x": "一方の有藤はロッテで三塁を守った。"}, {"t": 793.15, "x": "通算の安打は2057本。"}, {"t": 795.0833333333334, "x": "本塁打は348本だ。"}, {"t": 797.3, "x": "1987年から3年間は、ロッテの監督も務めている。"}, {"t": 801.9, "x": "1964年の夏に、初戦でいなくなった4番の人ね。"}, {"t": 806.1, "x": "そうだ。3年の夏の甲子園は、\n初戦の1打席目で終わった。だが\nプロでは長く打ち続けた。"}, {"t": 812.6, "x": "岡本の高知は、そのあとも甲子園に来ている。"}, {"t": 815.55, "x": "1977年と1979年の夏は、どちらも8強まで進んだ。"}, {"t": 821.1, "x": "夏の日本一には、もう届かなかったの？"}, {"t": 823.9333333333333, "x": "ああ。夏の優勝は、いまも1964年の1回だけだ。"}, {"t": 828.0, "x": "岡本は1990年の春に監督を一度離れた。"} const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
