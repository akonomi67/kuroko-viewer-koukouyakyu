<script>
const D={"name": "沖縄勢初めての夏", "file": "042_編集用", "dur": 978.3, "segs": [], "subs": [{"t": 0.0, "x": "2010年8月21日、阪神甲子園球場。"}, {"t": 3.566666666666667, "x": "夏の全国大会の、決勝の日だ。"}, {"t": 6.05, "x": "この日は、朝から人が集まっていた。"}, {"t": 8.483333333333333, "x": "門が開く時刻は、予定の午前10時から\n1時間25分も早まった。"}, {"t": 13.0, "x": "開門は午前8時35分。"}, {"t": 14.866666666666667, "x": "午前9時には、満員の知らせが出ている。"}, {"t": 17.566666666666666, "x": "試合の前から満員なの？"}, {"t": 19.066666666666666, "x": "どこの学校の決勝？"}, {"t": 20.7, "x": "沖縄の興南と、神奈川の東海大相模だ。"}, {"t": 23.75, "x": "試合は4回に動いた。"}, {"t": 25.116666666666667, "x": "1死から、興南が先に1点を取る。"}, {"t": 27.65, "x": "この回は打者11人が打席に入り、7点が入った。"}, {"t": 31.25, "x": "6回には、3点本塁打などでさらに5点。"}, {"t": 34.083333333333336, "x": "東海大相模の点は7回の1点だけだった。"}, {"t": 37.083333333333336, "x": "13対1。興南の優勝だ。"}, {"t": 39.4, "x": "ずいぶん差がついた決勝ね。"}, {"t": 41.25, "x": "日本高等学校野球連盟は、大会ごとの出来事を\n「大会小史」にまとめている。"}, {"t": 46.56666666666667, "x": "2010年の欄の書き出しはこうだ。"}, {"t": 48.78333333333333, "x": "興南が沖縄勢として初の全国制覇を飾り、\n史上6校目となる春夏連覇も達成した。"}, {"t": 54.78333333333333, "x": "沖縄の学校が夏に勝ったのは、\nこのときが初めてだったの？"}, {"t": 58.71666666666667, "x": "そうだ。そして同じ欄には、\nもう1つ数字が書いてある。"}, {"t": 62.25, "x": "首里が沖縄勢として初めて\n甲子園の土を踏んでから52年。"}, {"t": 66.28333333333333, "x": "52年。半世紀より長いのね。"}, {"t": 68.68333333333334, "x": "今回は、その52年を公式の記録でさかのぼる。"}, {"t": 72.08333333333333, "x": "沖縄の夏はどこで止まり、どこで1歩進んだのか。"}, {"t": 75.15, "x": "年の順に見ていく。"}, {"t": 76.55, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 79.96666666666667, "x": "よろしくね。"}, {"t": 81.46666666666667, "x": "始まりは1958年。"}, {"t": 83.43333333333334, "x": "第40回の記念大会だ。"}, {"t": 85.46666666666667, "x": "大会小史によると、この年は40回の節目で、\n各都道府県から1校ずつが出た。"}, {"t": 90.86666666666666, "x": "沖縄の代表も含めて47校だ。"}, {"t": 93.46666666666667, "x": "試合は甲子園と西宮の2つの球場を使って行われた。"}, {"t": 97.25, "x": "沖縄から出たのは首里。これが\n沖縄勢の初めての甲子園だった。"}, {"t": 101.45, "x": "節目の大会だから、1校ずつ出られたのね。"}, {"t": 104.45, "x": "そうだ。首里のこの夏の話は、\n前にショートで話している。"}, {"t": 108.16666666666667, "x": "今回は点数だけ言っておく。"}, {"t": 109.85, "x": "首里の初戦は、福井の敦賀に0対3だった。"}, {"t": 113.1, "x": "初めての甲子園は、1試合で終わったのね。"}, {"t": 116.0, "x": "ここに1つ目の印を置いておく。"}, {"t": 117.9, "x": "初めて出た年の印だ。"}, {"t": 119.73333333333333, "x": "点数は、沖縄の地元紙の琉球新報が出している\n成績表で確かめた。"}, {"t": 124.43333333333334, "x": "沖縄の学校の夏の試合が、\n1958年から1つずつ並んでいる。"}, {"t": 129.45, "x": "今回はその表と大会小史を、横に並べて見ていくのね。"}, {"t": 133.23333333333332, "x": "では、次の年からも沖縄の代表は出られたのか。"}, {"t": 136.41666666666666, "x": "日本高野連の「出場校一覧」で\n年ごとの代表校を確かめた。"}, {"t": 140.85, "x": "1959年と1960年と1961年。\nこの3年は、沖縄の欄が空いている。"}, {"t": 147.66666666666666, "x": "空いているって、代表がいなかったってこと？"}, {"t": 150.36666666666667, "x": "ああ。この3つの夏は、甲子園の一覧に\n沖縄の学校の名前が無い。"}, {"t": 154.73333333333332, "x": "節目の大会が終わると、しばらく\n出られない夏が続いた。"}, {"t": 158.86666666666667, "x": "欄が埋まったのは、4年後の1962年。第44回大会だ。"}, {"t": 163.66666666666666, "x": "大会小史には、こう書いてある。"}, {"t": 165.7, "x": "沖縄高は宮崎大淀を破り、初の自力甲子園出場なる。"}, {"t": 169.83333333333334, "x": "自力ってどういうこと？"}, {"t": 171.36666666666667, "x": "1校ずつの記念の枠ではない、ということだ。"}, {"t": 174.11666666666667, "x": "宮崎の学校に勝って、\n自分たちの力で出場をつかんだ。"}, {"t": 178.13333333333333, "x": "節目の大会じゃなくても、勝てば\n出られるようになったのね。"}, {"t": 181.66666666666666, "x": "甲子園の初戦の相手は、広島の広陵だった。"}, {"t": 184.73333333333332, "x": "点数は4対6。2点差で敗れている。"}, {"t": 187.48333333333332, "x": "初めての1勝は、まだなのね。"}, {"t": 189.66666666666666, "x": "続く1963年は第45回。"}, {"t": 192.43333333333334, "x": "2回目の記念大会だった。"}, {"t": 194.36666666666667, "x": "参加した学校の数が2000校をこえた年でもある。"}, {"t": 197.43333333333334, "x": "開会式は、台風の名残の雨の中だった。"}, {"t": 200.36666666666667, "x": "この大会で、沖縄代表の首里が初めて1勝を挙げた。"}, {"t": 203.95, "x": "相手は山形の日大山形。点数は4対3だ。"}, {"t": 207.48333333333332, "x": "1点差で、初めての1勝なのね。"}, {"t": 209.93333333333334, "x": "次の試合は山口の下関商に\n0対8。そこで夏が終わった。"}, {"t": 214.38333333333333, "x": "初めての甲子園から、5年で初めての1勝ね。"}, {"t": 217.66666666666666, "x": "ああ。1958年に初めて出て、\n1963年に初めて勝った。"}, {"t": 222.96666666666667, "x": "これが2つ目の印だ。"}, {"t": 225.2, "x": "ここで興南が出てくる。"}, {"t": 226.55, "x": "初めての出場は1966年だ。"}, {"t": 229.55, "x": "初戦の相手は茨城の竜ヶ崎一。"}, {"t": 231.66666666666666, "x": "点数は5対6だった。"}, {"t": 233.41666666666666, "x": "興南も、最初は1点差で負けていたのね。"}, {"t": 236.31666666666666, "x": "そして2年後の1968年。"}, {"t": 238.73333333333332, "x": "第50回の記念大会だ。"}, {"t": 240.68333333333334, "x": "球史の半世紀を祝う大会で、代表は48校が出た。"}, {"t": 244.43333333333334, "x": "入場行進の先頭には、\n歴代の優勝校の校旗が並んで歩いた。"}, {"t": 248.61666666666667, "x": "大会小史は、この夏の興南について1行を残している。"}, {"t": 252.26666666666668, "x": "沖縄代表の興南が勝ち進んで準決勝へ\n進み、気をはいた、という1行だ。"}, {"t": 257.3333333333333, "x": "興南って、2010年に優勝した興南？"}, {"t": 260.25, "x": "そうだ。同じ興南が、42年前にここまで来ていた。"}, {"t": 263.95, "x": "成績表には、準決勝の前に\n勝った試合が4つ並んでいる。"}, {"t": 267.81666666666666, "x": "長野の岡谷工に5対3。"}, {"t": 269.3833333333333, "x": "岐阜の岐阜南に8対5。"}, {"t": 271.26666666666665, "x": "長崎の海星に4対0。"}, {"t": 273.05, "x": "岩手の盛岡一に10対4。"}, {"t": 275.15, "x": "1つ勝つのにも時間がかかったのに、一気に4つも？"}, {"t": 278.65, "x": "ああ。そして全国の4強だ。"}, {"t": 280.8, "x": "じゃあ、このとき決勝まで行けたの？"}, {"t": 283.06666666666666, "x": "いや。準決勝の相手は大阪の興国。"}, {"t": 285.55, "x": "点数は0対14だった。"}, {"t": 287.4166666666667, "x": "興国はこの夏、そのまま初めての優勝を果たしている。"}, {"t": 291.0833333333333, "x": "14点差。4強の先は、まだ遠いのね。"}, {"t": 294.18333333333334, "x": "これが3つ目の印。1勝のあとに4強が来た。"}, {"t": 297.3, "x": "ただ、出場校一覧を見ると、\nこのあとも空いた年がある。"}, {"t": 300.9166666666667, "x": "1969年から1971年の3年と1974年。"}, {"t": 305.96666666666664, "x": "沖縄の欄はまた空いている。"}, {"t": 307.75, "x": "あいだの1972年は名護が\n出て、栃木の足利工に4対5。"}, {"t": 312.18333333333334, "x": "1973年は前原が出て、埼玉の川越工に0対7だった。"}, {"t": 317.1166666666667, "x": "1975年からは、2010年まで\n毎年、沖縄の代表の名前がある。"}, {"t": 322.31666666666666, "x": "毎年出られるようになるまでにも時間がかかったのね。"}, {"t": 325.46666666666664, "x": "1958年から2010年まで、夏の大会は53回あった。"}, {"t": 330.23333333333335, "x": "そのうち沖縄の代表が出たのは43回。"}, {"t": 332.9166666666667, "x": "出なかった夏は10回だ。"}, {"t": 335.28333333333336, "x": "毎年出られるようになってからの夏を、\n成績表で順に見ていく。"}, {"t": 339.15, "x": "1975年の代表は石川。"}, {"t": 341.5833333333333, "x": "新潟の新潟商に4対3で勝った。"}, {"t": 344.1333333333333, "x": "次の試合は、静岡の浜松商に5対6。また1点差だ。"}, {"t": 348.15, "x": "1976年から1978年は、3年続けて豊見城が出た。"}, {"t": 353.78333333333336, "x": "3年続けて同じ学校なのね。"}, {"t": 356.05, "x": "この3年は、どの夏も2つ勝っている。"}, {"t": 358.6666666666667, "x": "そして3つ目の試合で、毎年敗れた。"}, {"t": 361.25, "x": "1976年は石川の星稜に0対1。"}, {"t": 364.6166666666667, "x": "1977年は兵庫の東洋大姫路に3対8。"}, {"t": 368.46666666666664, "x": "1978年は岡山の岡山東商に5対6だ。"}, {"t": 372.6166666666667, "x": "3年とも、2つ勝ってから止まってるのね。"}, {"t": 375.53333333333336, "x": "1979年は中部工が出て、\n群馬の前橋工に3対4。ここも1点差だ。"}, {"t": 381.1, "x": "1980年から1983年は、興南が4年続けて出た。"}, {"t": 386.06666666666666, "x": "1980年は2つ勝ってから、東京の早稲田実業に0対3。"}, {"t": 390.6333333333333, "x": "1982年も2つ勝ってから、広島の広島商に2対4。"}, {"t": 395.25, "x": "1983年は1つ勝ってから、\nまた広島商に3対4で敗れた。"}, {"t": 400.4, "x": "同じ相手に2年続けて止められたのね。"}, {"t": 403.01666666666665, "x": "1984年からは沖縄水産の5年が続く。"}, {"t": 406.6166666666667, "x": "出場校一覧では、1984年から1988年まで\n沖縄の欄が5年続けて沖縄水産になっている。"}, {"t": 414.55, "x": "1988年は4つ勝った。"}, {"t": 416.93333333333334, "x": "1968年の興南と同じ数だ。"}, {"t": 419.98333333333335, "x": "5つ目の試合で、福岡の福岡第一に\n1対5で敗れている。"}, {"t": 424.05, "x": "4つ勝つところまでは、また来たのね。"}, {"t": 426.5833333333333, "x": "ああ。ただ5つ目の勝ちは、\n1958年から1989年まで1度もない。"}, {"t": 432.9166666666667, "x": "そして1990年。第72回大会だ。"}, {"t": 436.31666666666666, "x": "大会小史は、こう書いている。"}, {"t": 438.23333333333335, "x": "沖縄勢が第40回記念大会に初めて甲子園に出てから\n32年目で、沖縄水産が県勢初の決勝進出。"}, {"t": 445.93333333333334, "x": "やっと決勝まで来たのね！"}, {"t": 447.71666666666664, "x": "ああ。1958年から数えて32年目の夏だ。"}, {"t": 451.56666666666666, "x": "この夏の沖縄水産は、決勝までに5つ勝っている。"}, {"t": 454.96666666666664, "x": "群馬の高崎商に7対1。"}, {"t": 456.9, "x": "山梨の甲府工に12対5。"}, {"t": 458.96666666666664, "x": "滋賀の八幡商に5対2。"}, {"t": 460.56666666666666, "x": "神奈川の横浜商に8対5。"}, {"t": 462.75, "x": "そして広島の山陽に6対1だ。"}, {"t": 465.25, "x": "5つ目の勝ちが、ここで初めて出たのね。"}, {"t": 468.0, "x": "決勝の相手は奈良の天理だった。"}, {"t": 470.03333333333336, "x": "点数は0対1。1点差で敗れた。"}, {"t": 472.56666666666666, "x": "天理にとっては、4年ぶり2度目の優勝だった。"}, {"t": 475.6166666666667, "x": "1点差。あと1点で、追いつけたのに。"}, {"t": 478.3333333333333, "x": "この年は地方大会に出た学校の数が、\n初めて4000校をこえた年でもある。"}, {"t": 483.1333333333333, "x": "甲子園の通算2000試合目と、\n700本目の本塁打もこの大会で生まれた。"}, {"t": 487.9, "x": "入場者は92万9千人。"}, {"t": 489.81666666666666, "x": "初めて90万人 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
