<title>広島商</title>
<style>

<script>
const D={"name": "広島商", "file": "042_編集用", "dur": 740.75, "segs": [], "subs": [{"t": 0.0, "x": "夏の甲子園で、優勝の数が2番目に多い学校ってどこ？"}, {"t": 3.8333333333333335, "x": "広島の広島商だ。夏の優勝は6回ある。"}, {"t": 6.966666666666667, "x": "1位は中京大中京の7回。その次が広島商の6回だ。"}, {"t": 11.233333333333333, "x": "その6回目はいつなの？"}, {"t": 12.9, "x": "1988年。昭和63年の夏だ。"}, {"t": 16.35, "x": "中国新聞は、この年の大会を\n「昭和最後の大会」と書いている。"}, {"t": 20.9, "x": "昭和の最後の夏に、6回目を取ったのね。"}, {"t": 23.8, "x": "ああ。では聞くぞ。そのあと広島商は、\n夏の甲子園で何回勝ったと思う？"}, {"t": 28.633333333333333, "x": "6回も勝った学校なら、何回も勝っていそうよね。"}, {"t": 31.95, "x": "答えは最後に言う。"}, {"t": 33.166666666666664, "x": "6回の決勝の点数は前に中京大中京の回で話した。"}, {"t": 37.016666666666666, "x": "今回は、6回目の夏と、そのあとの夏を\n表と地図で追っていく。"}, {"t": 41.25, "x": "勝ったあとの話なのね。"}, {"t": 42.96666666666667, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 46.38333333333333, "x": "よろしくね。"}, {"t": 47.88333333333333, "x": "まず6回の年を表で見てみる。"}, {"t": 49.85, "x": "1924年、1929年、1930年、\n1957年、1973年、1988年だ。"}, {"t": 59.2, "x": "大正から昭和の終わりまで、ばらばらにあるのね。"}, {"t": 62.166666666666664, "x": "1924年は第10回の大会。"}, {"t": 64.65, "x": "日本高野連の大会小史には、こうある。"}, {"t": 67.36666666666666, "x": "「阪神甲子園球場完成」。"}, {"t": 69.35, "x": "甲子園球場ができた1924年に優勝したのね。"}, {"t": 73.16666666666667, "x": "ああ。決勝は松本商に3対0だった。"}, {"t": 75.93333333333334, "x": "1929年の小史には「阪神甲子園球場に\nアルプススタンド完成」とある。"}, {"t": 81.36666666666666, "x": "1929年と次の1930年に広島商は続けて勝った。"}, {"t": 86.26666666666667, "x": "1930年の欄には短く「広島商連勝」と書いてある。"}, {"t": 90.78333333333333, "x": "球場が大きくなっていく時代に、勝ち続けたのね。"}, {"t": 94.08333333333333, "x": "春の選抜でも、1931年の第8回で優勝している。"}, {"t": 98.45, "x": "この大会では、広島商の灰山元治が、\n大会で初めての無安打無得点試合をした。"}, {"t": 104.2, "x": "ヒットを1本も打たせなかったのね。"}, {"t": 106.96666666666667, "x": "戦後の1回目は、1957年の第39回だ。"}, {"t": 110.96666666666667, "x": "小史には「雨中の開会式。"}, {"t": 112.86666666666666, "x": "広島商，4回目の優勝。」とある。"}, {"t": 115.46666666666667, "x": "デイリースポーツの記事によると、決勝で\n決め手の1本を打ったのは佐々木明三。"}, {"t": 119.96666666666667, "x": "記事は広島で被爆した選手だったと書いている。"}, {"t": 123.06666666666666, "x": "戦争のあとの広島から日本一が出たのね。"}, {"t": 126.1, "x": "ああ。5回目は1973年の第55回だ。"}, {"t": 129.63333333333333, "x": "同じ記事によると、9回に\n大利裕二のスリーバントスクイズで、\nサヨナラ勝ちした。"}, {"t": 134.68333333333334, "x": "スリーバントって、2ストライクからのバント？"}, {"t": 137.43333333333334, "x": "そうだ。ファウルになればアウトになる。\nそれでも転がして、決勝の点を取った。"}, {"t": 142.13333333333333, "x": "細かい作戦の学校なのね。"}, {"t": 144.2, "x": "デイリースポーツは、広島商を堅い守りと\n小技で一時代を築いた学校と書いている。"}, {"t": 149.31666666666666, "x": "そして6回目が1988年。"}, {"t": 151.83333333333334, "x": "15年ぶりの優勝だった。"}, {"t": 154.31666666666666, "x": "1988年は第70回の記念大会だった。"}, {"t": 158.13333333333333, "x": "出場校の一覧を見ると、全参加校数は3958校。"}, {"t": 162.38333333333333, "x": "甲子園に来た代表は49校だ。"}, {"t": 164.95, "x": "3958校の中から、最後まで勝ったのね。"}, {"t": 168.7, "x": "小史の第70回の欄には、こう書いてある。"}, {"t": 171.53333333333333, "x": "「70回記念大会。広島商が\n6度目の優勝，中京に並ぶ。」"}, {"t": 175.96666666666667, "x": "同じ欄には「始球式は浩宮さま」ともある。"}, {"t": 179.03333333333333, "x": "浩宮さまは、いまの天皇陛下だ。"}, {"t": 181.7, "x": "いまの天皇陛下ね。"}, {"t": 183.21666666666667, "x": "ああ。小史が書かれた\nころの言い方がそのまま残っている。"}, {"t": 186.51666666666668, "x": "中国新聞はこの年のことを、こう書いている。"}, {"t": 189.38333333333333, "x": "「昭和最後の大会では、強豪を\n次々破って6度目の頂点に」。"}, {"t": 193.4, "x": "「福岡一との決勝は、手に汗握る投手戦でした」。"}, {"t": 196.9, "x": "福岡一って、福岡第一のこと？"}, {"t": 199.5, "x": "そうだ。決勝は1対0で、広島商が勝った。"}, {"t": 202.76666666666668, "x": "中国新聞は8月22日に号外を出して、\nこの優勝を知らせている。"}, {"t": 207.33333333333334, "x": "記事の見出しは「15年ぶり　最多タイ6度目」。"}, {"t": 210.53333333333333, "x": "このときは中京と並んで、いちばん多かったのね。"}, {"t": 213.7, "x": "ああ。そしてこの1対0が、広島商が\n夏の甲子園で勝った最後の試合になる。"}, {"t": 219.4, "x": "最後の試合って、次の年からはどうなったの？"}, {"t": 222.36666666666667, "x": "日本高野連の出場校一覧で、\n広島の欄を1年ずつ読んでいく。"}, {"t": 226.76666666666668, "x": "1989年は近大福山。"}, {"t": 229.26666666666668, "x": "1990年は山陽。1991年は西条農。"}, {"t": 233.51666666666668, "x": "1992年は広島工。"}, {"t": 235.66666666666666, "x": "1993年はまた西条農だ。"}, {"t": 238.53333333333333, "x": "毎年ちがう学校が出ているのね。"}, {"t": 240.75, "x": "1994年は山陽。1995年は宮島工。"}, {"t": 244.83333333333334, "x": "1996年は高陽東。"}, {"t": 247.4, "x": "1997年と1998年と1999年は3年続けて如水館だ。"}, {"t": 253.9, "x": "3年続けて同じ学校なのね。"}, {"t": 256.2, "x": "そうだ。2000年は瀬戸内。"}, {"t": 257.9166666666667, "x": "2001年は如水館。"}, {"t": 259.3833333333333, "x": "2002年と2003年は広陵だ。"}, {"t": 261.85, "x": "地図に置くと、広島市の外の学校も多いわね。"}, {"t": 265.05, "x": "ああ。1989年から2003年までの15回に、\n広島商の名前は1度も無い。"}, {"t": 270.96666666666664, "x": "6回勝った学校が15回も出られなかったのね。"}, {"t": 274.6, "x": "2004年の第86回。"}, {"t": 276.4, "x": "広島の欄に、やっと広島商の名前が戻る。"}, {"t": 279.55, "x": "デイリースポーツの記事は、\n16年ぶりの出場だったと書いている。"}, {"t": 283.45, "x": "チームには、エースで4番の岩本貴裕がいた。"}, {"t": 286.5, "x": "投げて打つ選手ね。それで、どうなったの？"}, {"t": 289.26666666666665, "x": "初戦で敗れた。"}, {"t": 290.53333333333336, "x": "1つも勝てなかったのね。"}, {"t": 292.3333333333333, "x": "記事は、1988年の優勝を最後に広島商は\n長く苦しい時期に入ったと書いている。"}, {"t": 298.35, "x": "そして次の年から、また名前が消える。"}, {"t": 301.56666666666666, "x": "2005年からの広島の欄を見てみる。"}, {"t": 304.0, "x": "2005年は高陽東、2006年は\n如水館、2007年と2008年は広陵だ。"}, {"t": 309.56666666666666, "x": "2009年は如水館、2010年は広陵、2011年は如水館。"}, {"t": 314.0833333333333, "x": "2012年は広島工、2013年は瀬戸内。"}, {"t": 317.5, "x": "2014年は広陵、2015年と2016年は広島新庄。"}, {"t": 321.73333333333335, "x": "2017年と2018年は広陵だ。"}, {"t": 324.7, "x": "広陵と広島新庄が何度も出てるわね。"}, {"t": 327.4166666666667, "x": "スポルティーバの記事は、このころの広島を広陵と\n広島新庄の2校が引っぱる時代として書いている。"}, {"t": 333.3833333333333, "x": "広島新庄を率いた監督は\n広島商の卒業生だった、とも書いた。"}, {"t": 338.05, "x": "広島商の卒業生が、ほかの学校を強くしたのね。"}, {"t": 341.73333333333335, "x": "ああ。2005年から2018年までの14回も\n広島商は夏の甲子園に来なかった。"}, {"t": 347.9, "x": "2019年。広島商は春の県大会に\n勝ち、夏の広島大会にも勝った。"}, {"t": 353.21666666666664, "x": "夏の甲子園は15年ぶりだった。"}, {"t": 355.35, "x": "監督は荒谷忠勝。1995年に\n卒業した広島商の卒業生だ。"}, {"t": 360.93333333333334, "x": "自分の学校に戻って、監督をしていたのね。"}, {"t": 364.03333333333336, "x": "記事で荒谷監督はこう話している。"}, {"t": 366.35, "x": "「11年間は他校にいて、15年間のすべてを\n知っているわけではありません」。"}, {"t": 370.93333333333334, "x": "ずっと見ていたわけじゃない、って\n正直に言ってるのね。"}, {"t": 373.96666666666664, "x": "この年は第101回の大会。"}, {"t": 375.8666666666667, "x": "2019年の5月から、元号は令和になっていた。"}, {"t": 379.3, "x": "広島商は大正と昭和と平成と令和の4つの元号で、\n夏の甲子園に出たことになる。"}, {"t": 384.8833333333333, "x": "4つの時代に出た学校なのね。"}, {"t": 387.5833333333333, "x": "初戦は8月10日の2回戦。"}, {"t": 389.5, "x": "相手は岡山の岡山学芸館だ。"}, {"t": 391.8, "x": "点の動きを表にしてみる。"}, {"t": 393.46666666666664, "x": "1回に岡山学芸館が1点を先に取った。"}, {"t": 396.45, "x": "2回に広島商はスクイズで1対1に追いついた。"}, {"t": 399.65, "x": "ここでもスクイズなのね。"}, {"t": 401.25, "x": "5回は山路祥都のホームランで2対1。"}, {"t": 403.55, "x": "6回にも3点を足して4対1だ。"}, {"t": 406.1333333333333, "x": "3点もリードしたのね。これは勝てそう。"}, {"t": 408.68333333333334, "x": "7回は1点ずつ取り合って、5対3になった。"}, {"t": 411.68333333333334, "x": "ところが8回に岡山学芸館が3点を取った。"}, {"t": 414.8333333333333, "x": "最後は2点の二塁打で、6対5と逆転された。"}, {"t": 418.1333333333333, "x": "えっ、8回にひっくり返されたの？"}, {"t": 420.5, "x": "9回に広島商は2アウト一、二塁まで\n攻めた。でもあと1本が出なかった。"}, {"t": 425.31666666666666, "x": "5対6で敗れた。"}, {"t": 426.76666666666665, "x": "3点も勝ってたのに。"}, {"t": 428.8333333333333, "x": "ベースボールチャンネルの記事は、\nこの試合をこう書いた。"}, {"t": 431.81666666666666, "x": "「1988年以来31年ぶりの勝利は叶わなかった」。"}, {"t": 436.1666666666667, "x": "1988年以来ってあの決勝の1対0から？"}, {"t": 439.96666666666664, "x": "そうだ。1988年の決勝のあと、夏の甲子園では\n1度も勝てていない、ということだ。"}, {"t": 446.1333333333333, "x": "デイリースポーツも、夏の1勝は\n「31年ぶり」の目前で消えた、と書いている。"}, {"t": 451.51666666666665, "x": "8回の表が終わるまではリードしていたのにね。"}, {"t": 454.4, "x": "ああ。勝った岡山学芸館にとっては、春と\n夏を通じて甲子園で初めての勝利だった。"}, {"t": 459.93333333333334, "x": "同じ試合で、片方は初めての1勝、もう\n片方は31年ぶりの1勝がかかっていたのね。"}, {"t": 466.3333333333333, "x": "春の甲子園ではどうなの？"}, {"t": 468.0833333333333, "x": "2022年の春の選抜に、20年ぶりに出た。"}, {"t": 471.46666666666664, "x": "1回戦は福井の丹生に22対7で勝った。"}, {"t": 474.46666666666664, "x": "22点も取ったの！"}, {"t": 476.0, "x": "記事には「史上4校目となる\n甲子園での4元号勝利」とある。"}, {"t": 479.9166666666667, "x": "大正と昭和と平成と令和の4つで甲子園の試合に\n勝った学校は、これで4校目ということだ。"}, {"t": 485.71666666666664, "x": "夏では届かなかった令和の1勝を、春に取ったのね。"}, {"t": 489.1333333333333, "x": "ああ。でも2回戦は戦えなかった。"}, {"t": 491.45, "x": "選抜の大会小史には\n「広島商も2回戦を辞退した」とある。"}, {"t": 495.71666666666664, "x": "チームの関係者に新型コロナウイルスの感染が\n広がったためだ。"}, {"t": 499.73333333333335, "x": "勝ったのに、次の試合ができなかったのね。"}, {"t": 503.0, "x": "2024年の秋に広島商は中国大会に\n勝って、明治神宮大会に出た。"}, {"t": 508.18333333333334, "x": "明治神宮大会には、このときが初めての出場だった。"}, {"t": 5 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
