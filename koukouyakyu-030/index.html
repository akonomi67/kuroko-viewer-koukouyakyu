<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}

<script>
const D={"name": "平成1度きりの私立優勝校", "file": "030_編集用", "dur": 994.45, "segs": [], "subs": [{"t": 0.0, "x": "2026年8月12日、阪神甲子園球場。"}, {"t": 3.533333333333333, "x": "夏の大会の2回戦だ。"}, {"t": 5.366666666666666, "x": "埼玉の花咲徳栄が宮城の仙台育英とぶつかった。"}, {"t": 9.016666666666667, "x": "花咲徳栄は、この夏の49校で\n最後に登場した学校だった。"}, {"t": 13.55, "x": "5回までどちらにも点が入らない。"}, {"t": 15.666666666666666, "x": "6回、仙台育英が1死一・三塁から\n安打を打って1点を取った。"}, {"t": 19.7, "x": "そのあと雨が強くなった。"}, {"t": 21.4, "x": "花咲徳栄は9回まで1点を返せなかった。"}, {"t": 24.5, "x": "0対1。花咲徳栄の夏はこの1試合で終わった。"}, {"t": 28.233333333333334, "x": "1点差の負けなのね。"}, {"t": 29.55, "x": "花咲徳栄って、強い学校なんでしょ？"}, {"t": 32.46666666666667, "x": "ああ。9年前の2017年の夏に、\n甲子園で日本一になっている。"}, {"t": 36.96666666666667, "x": "決勝は14対4。埼玉の学校が夏を\n制したのは、これが初めてだった。"}, {"t": 41.833333333333336, "x": "ただし夏の優勝は、いまもその1回だけだ。"}, {"t": 44.85, "x": "1度勝っても、2度目はそう簡単じゃないのね。"}, {"t": 47.65, "x": "平成に1度だけ夏を制した\n私立の学校は、いまどこにいるの？"}, {"t": 51.63333333333333, "x": "今回はその学校を1校ずつ追いかける。"}, {"t": 54.1, "x": "優勝した夏の記録から数字を1つ選ぶ。"}, {"t": 56.9, "x": "そして2026年の姿を1つ並べる。"}, {"t": 59.85, "x": "この2つを横に並べて平成の夏を辿っていく。"}, {"t": 62.93333333333333, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 66.35, "x": "よろしくね。"}, {"t": 67.85, "x": "まず数え方だ。平成は1989年の1月に\n始まり、2019年の4月に終わった。"}, {"t": 74.23333333333333, "x": "この間の夏の大会は、1989年の第71回から\n2018年の第100回まで。"}, {"t": 80.58333333333333, "x": "ちょうど30回になる。"}, {"t": 82.18333333333334, "x": "2019年の夏は入らないの？"}, {"t": 84.51666666666667, "x": "2019年の夏の大会は、元号が令和に\n変わったあとだ。だから外した。"}, {"t": 89.36666666666666, "x": "30回の優勝校は、阪神甲子園球場の「歴代優勝校」で\n1つずつ確かめた。"}, {"t": 95.13333333333334, "x": "学校の数でいうと22校だ。"}, {"t": 97.2, "x": "いちばん多いのは大阪桐蔭で5回。"}, {"t": 99.3, "x": "帝京、智弁和歌山、日大三、\n駒大苫小牧は2回ずつ勝っている。"}, {"t": 103.86666666666666, "x": "残る17校は平成の夏に1回ずつ勝った。"}, {"t": 106.98333333333333, "x": "じゃあその17校が「1度だけ」の学校？"}, {"t": 109.95, "x": "まだだ。平成より前や後に、\n夏を制した学校がまじっている。"}, {"t": 113.9, "x": "天理は1986年にも勝っている。"}, {"t": 116.55, "x": "横浜は1980年にも勝っている。"}, {"t": 119.4, "x": "東海大相模は1970年、作新学院は\n1962年に、1度目の優勝がある。"}, {"t": 125.7, "x": "松山商と中京大中京は、\n昭和のうちに何度も勝っている。"}, {"t": 129.58333333333334, "x": "この6校を外すと、夏の優勝が通算で\n1回だけの学校は11校になる。"}, {"t": 134.55, "x": "令和の大会で2度目を取った学校はいないの？"}, {"t": 137.33333333333334, "x": "令和の夏は2026年までに7回あった。"}, {"t": 140.35, "x": "優勝は履正社、智辯和歌山、仙台育英、\n慶応、京都国際、沖縄尚学。"}, {"t": 145.81666666666666, "x": "そして2026年はまた智辯和歌山だった。"}, {"t": 148.85, "x": "11校の名前は1つも出てこない。"}, {"t": 151.11666666666667, "x": "11校のうち、佐賀商と佐賀北の2校は県立の学校だ。"}, {"t": 154.93333333333334, "x": "この2校は前に公立校の優勝を数えた回で話した。"}, {"t": 158.36666666666667, "x": "残る9校が今回の主役。"}, {"t": 160.15, "x": "平成に1度だけ夏を制した私立校だ。"}, {"t": 162.96666666666667, "x": "9校もあるのね。"}, {"t": 164.26666666666668, "x": "ただし常総学院、早稲田実業、\n興南の3校は、前の回でくわしく話した。"}, {"t": 169.38333333333333, "x": "2003年の常総学院は、東北との東日本対決を制した。"}, {"t": 173.75, "x": "2006年の早稲田実業は、\n37年ぶりの決勝引き分け再試合を制した。"}, {"t": 178.8, "x": "2010年の興南は、沖縄の学校として\n初めて夏を制し、春夏連覇も果たした。"}, {"t": 184.28333333333333, "x": "この3校はここまでにして、\n残る6校を年の順に見ていく。"}, {"t": 188.16666666666666, "x": "1992年から2017年まで25年の幅があるのね。"}, {"t": 193.15, "x": "1992年の夏。第74回大会だ。"}, {"t": 196.76666666666668, "x": "この年から、甲子園の外野にあった\nラッキーゾーンがなくなった。"}, {"t": 200.53333333333333, "x": "球場の形が変わった年なのね。"}, {"t": 202.9, "x": "優勝したのは福岡の西日本短大付だ。"}, {"t": 205.73333333333332, "x": "福岡の学校が夏を制するのは27年ぶりだった。"}, {"t": 209.16666666666666, "x": "エースは森尾和貴。全ての試合を1人で投げ切った。"}, {"t": 212.55, "x": "大会を通して取られた点はたったの1点だ。"}, {"t": 215.41666666666666, "x": "1人で投げて1点しか取られなかったの？"}, {"t": 218.03333333333333, "x": "そうだ。雑誌のNumberは、45回を\n投げて四死球は4つだったと伝えている。"}, {"t": 222.83333333333334, "x": "決勝の相手は千葉の拓大紅陵。"}, {"t": 224.86666666666667, "x": "点数は1対0だった。"}, {"t": 226.6, "x": "1対0のまま最終回に入った。"}, {"t": 228.91666666666666, "x": "最後の打者は三塁へのフライに倒れた。"}, {"t": 231.41666666666666, "x": "最後まで1点を守り切ったのね。"}, {"t": 233.63333333333333, "x": "森尾はそのあとプロ野球には進まなかった。"}, {"t": 236.26666666666668, "x": "西日本短大付の数字はこれにする。失点1だ。"}, {"t": 239.73333333333332, "x": "失点1。覚えたわ。"}, {"t": 241.4, "x": "では、西日本短大付のその後だ。"}, {"t": 243.78333333333333, "x": "甲子園でまた8強に入るまでには、\n長い時間がかかった。"}, {"t": 247.45, "x": "2024年の夏、2025年の春、2025年の夏。"}, {"t": 251.75, "x": "西日本短大付は3季続けて甲子園に出た。"}, {"t": 254.95, "x": "福岡の学校の3季続けての出場は、\n1955年の小倉以来、70年ぶりだった。"}, {"t": 261.21666666666664, "x": "70年ぶり？ ずいぶん間があいたのね。"}, {"t": 263.81666666666666, "x": "2025年の春の選抜は、\n1987年以来38年ぶり2度目の出場だった。"}, {"t": 270.1, "x": "3月24日の2回戦で山梨学院に11対5で勝った。"}, {"t": 274.1, "x": "これで選抜で初めての8強に入った。"}, {"t": 276.7, "x": "夏も合わせた甲子園で8強に入ったのは、\n優勝した1992年以来だった。"}, {"t": 282.2, "x": "優勝の年から33年ぶりの8強なのね。"}, {"t": 285.35, "x": "準々決勝では神奈川の横浜に逆転で敗れた。"}, {"t": 288.6333333333333, "x": "そして2026年の夏。"}, {"t": 290.5, "x": "福岡大会は3連覇がかかっていた。"}, {"t": 293.0, "x": "1回戦は12対0の5回コールドで勝った。"}, {"t": 295.8, "x": "ところが7月17日の5回戦で、祐誠に2対4で敗れた。"}, {"t": 300.01666666666665, "x": "5回に3点、7回に1点を取られ、反撃は2点まで。"}, {"t": 303.6333333333333, "x": "8強の手前だった。"}, {"t": 305.26666666666665, "x": "3連覇はここで止まったのね。"}, {"t": 307.78333333333336, "x": "1993年の夏。第75回の記念大会だ。"}, {"t": 311.8666666666667, "x": "優勝したのは兵庫の育英。"}, {"t": 313.65, "x": "兵庫に夏の優勝旗が来たのは12年ぶりだった。"}, {"t": 316.7, "x": "育英はこの大会で、2つの大会記録を作っている。"}, {"t": 320.2, "x": "1つは犠打の30。もう1つは四死球の45だ。"}, {"t": 323.7, "x": "犠打が30ってすごい数ね。"}, {"t": 325.6666666666667, "x": "決勝の相手は埼玉の春日部共栄。"}, {"t": 327.95, "x": "3対2の1点差で勝った。"}, {"t": 329.8333333333333, "x": "この大会からは、投手の肩と\nひじの検診も始まっている。"}, {"t": 333.71666666666664, "x": "投げる人の体を見るようになった年なのね。"}, {"t": 336.53333333333336, "x": "かつて大会が開かれた鳴尾球場の跡地に、\n記念碑ができたのもこの年だ。"}, {"t": 341.26666666666665, "x": "育英の野球部にとって、初めての日本一だった。"}, {"t": 344.55, "x": "数字は犠打の30にする。"}, {"t": 346.26666666666665, "x": "育英のその後だ。"}, {"t": 347.46666666666664, "x": "スポルティーバは2026年8月、\n育英の記事を出している。"}, {"t": 351.4166666666667, "x": "見出しは「仙台育英と間違われていませんか？」だ。"}, {"t": 354.76666666666665, "x": "同じ「育英」の名前の学校があるものね。"}, {"t": 357.71666666666664, "x": "ああ。2013年には群馬の前橋育英が、\n2022年には宮城の仙台育英が夏を制した。"}, {"t": 364.0, "x": "記事によると、1993年の主将は、\nいま母校の監督をしている。"}, {"t": 368.65, "x": "2012年からだ。"}, {"t": 370.26666666666665, "x": "日本一のときの主将が監督になって戻ってきたのね。"}, {"t": 373.8833333333333, "x": "育英の甲子園の出場は、春が13回、夏が6回。"}, {"t": 377.53333333333336, "x": "合わせて19回だ。"}, {"t": 379.0, "x": "OBには、巨人の土井正三や、近鉄で\n317勝を挙げた鈴木啓示がいる。"}, {"t": 384.03333333333336, "x": "ただ最後の甲子園は2005年の春の選抜だ。"}, {"t": 387.06666666666666, "x": "2026年の夏まで21年の間、甲子園には出ていない。"}, {"t": 391.21666666666664, "x": "2026年の夏は、兵庫大会の2回戦で\n報徳学園とぶつかった。"}, {"t": 396.01666666666665, "x": "初回に3点を取られ、2回と4回に1点ずつ返した。"}, {"t": 399.6333333333333, "x": "1点差に迫ったが、5回と8回に\n点を足され、3対5で敗れた。"}, {"t": 404.15, "x": "最後まで食らいついた試合ね。"}, {"t": 406.06666666666666, "x": "報道は育英を「春夏合わせて\n19度の甲子園出場を誇る名門」と書いていた。"}, {"t": 411.8333333333333, "x": "1999年の夏。第81回大会。"}, {"t": 415.4166666666667, "x": "優勝したのは群馬の桐生第一だ。"}, {"t": 417.65, "x": "群馬の学校として初めての夏の優勝だった。"}, {"t": 420.65, "x": "決勝までの6試合で、チームの防御率は1.00だった。"}, {"t": 424.55, "x": "6試合で1.00。点をほとんどやらなかったのね。"}, {"t": 428.03333333333336, "x": "エースは左腕の正田樹。"}, {"t": 429.68333333333334, "x": "身長185センチの左腕だった。"}, {"t": 432.15, "x": "デイリースポーツによると、54\nイニングのうち53イニングを正田が投げた。"}, {"t": 436.6333333333333, "x": "Numberは、6試合で708球、\n4日続けての登板もあったと伝えている。"}, {"t": 441.56666666666666, "x": "比叡山に2対0、仙台育英に11対2、静岡に4対3。"}, {"t": 445.8833333333333, "x": "桐蔭学園と樟南には続けて完封で勝った。"}, {"t": 448.8333333333333, "x": "決勝の相手は岡山理大付。"}, {"t": 450.6, "x": "14対1の大差だった。"}, {"t": 452.55, "x": "決勝だけ点の取り方が大きいわね。"}, {"t": 454.96666666666664, "x": "正田はドラフト1位で日本ハムに入った。"}, {"t": 457.56666666666666, "x": "そのあと阪神、台湾のチーム、\n独立リーグと、いくつものチームで投げた。"}, {"t": 462.1, "x": "2026年のいまは、ヤクルトの投手コーチをしている。"}, {"t": 465.5833333333333, "x": "桐生第一の数字は防御率1.00だ。"}, {"t": 468.3666666666667, "x": "桐生第一のその後だ。"}, {"t": 469.8833333333333, "x": "2003年の夏にも甲子園に出ている。"}, {"t": 472.35, "x": "この大会では、桐生第一の選手が\n甲子園の1000本目の本塁打を打った。"}, {"t": 476.8, "x": "その1本はランニング本塁打だった。"}, {"t": 479.1666666666667, "x": "記念の1本がランニングだったのね。"}, {"t": 481.48333333333335, "x": "そして2026年の夏。"}, {"t": 483.35, "x": "群馬大会の準々決勝で、樹徳とぶつかった。"}, {"t": 486.6333333333333, "x": "4対4で9回に入り、1点を勝ち越した。"}, {"t": 489.45, "x": "5対4。3年ぶりの4強入りだ。"}, {"t": 491.8333333333333, "x": "7月24日の準決勝は前橋商に1対4で敗れた。"}, {"t": 495.71666666666664, "x": "秋は群馬の県大会で3位に入り、関東大会に進んだ。"}, {"t": 499.55, "x": "3位を決 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
