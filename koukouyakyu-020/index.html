<script>
const D={"name": "昭和の公立優勝校のいま", "file": "020_編集用", "dur": 920.4, "segs": [], "subs": [{"t": 0.0, "x": "1988年の夏。昭和の最後の夏の甲子園だ。"}, {"t": 4.05, "x": "決勝は1対0で終わった。"}, {"t": 5.833333333333333, "x": "勝ったのは広島県立の広島商だ。"}, {"t": 8.383333333333333, "x": "同じ年の春も、愛媛県立の宇和島東が勝っている。"}, {"t": 12.15, "x": "昭和の最後は春も夏も公立の学校だったのね。"}, {"t": 15.433333333333334, "x": "ああ。昭和50年から63年まで、14年を数えてみた。"}, {"t": 19.45, "x": "春と夏の甲子園は合わせて28回。"}, {"t": 21.983333333333334, "x": "そのうち13回は公立校が優勝している。"}, {"t": 24.883333333333333, "x": "28回のうち13回？"}, {"t": 26.55, "x": "半分近いじゃない。"}, {"t": 27.983333333333334, "x": "ところが平成と令和の38年では74回のうち5回だけ。"}, {"t": 32.15, "x": "2009年の春を最後に、公立校の優勝は1度もない。"}, {"t": 35.916666666666664, "x": "昔と今で、こんなに違うのね。"}, {"t": 38.75, "x": "その13回はどこの学校が勝ったの？"}, {"t": 41.3, "x": "学校の数で言うと9校だ。"}, {"t": 43.13333333333333, "x": "千葉の習志野、和歌山の箕島、静岡の浜松商。"}, {"t": 46.78333333333333, "x": "高知の高知商、徳島の池田、茨城の取手二。"}, {"t": 50.15, "x": "高知の伊野商、愛媛の宇和島東、広島の広島商。"}, {"t": 54.11666666666667, "x": "四国の学校が多いのね。"}, {"t": 55.9, "x": "9校のうち4校が四国だ。"}, {"t": 57.63333333333333, "x": "高知だけで2校ある。"}, {"t": 59.05, "x": "9校とも県か市が建てた公立の学校だ。"}, {"t": 61.8, "x": "学校の公式サイトや、県の資料で確かめている。"}, {"t": 65.03333333333333, "x": "前に、平成と令和の公立校の優勝を\n数えた回があった。"}, {"t": 68.7, "x": "今回はその昭和の側を、1校ずつ見ていく。"}, {"t": 71.56666666666666, "x": "優勝した年に何があったか。\nそしていまどうしているか。"}, {"t": 75.11666666666666, "x": "優勝の年と、いまの姿を並べるのね。"}, {"t": 77.95, "x": "そうだ。最後まで見てもらえたらうれしい。"}, {"t": 80.3, "x": "本編の前に、チャンネル登録と\n高評価をお願いしたい。"}, {"t": 84.28333333333333, "x": "数え方を先に言っておく。"}, {"t": 86.0, "x": "始まりは1975年の春の選抜。昭和50年だ。"}, {"t": 90.1, "x": "終わりは1988年の夏の選手権。昭和63年だ。"}, {"t": 94.56666666666666, "x": "優勝校は阪神甲子園球場の「歴代優勝校」で\n1つずつ確かめた。"}, {"t": 99.43333333333334, "x": "決勝の点数は、日本高野連の記録で確かめている。"}, {"t": 103.13333333333334, "x": "13回のうち、春と夏はどう分かれるの？"}, {"t": 105.95, "x": "春が8回、夏が5回だ。"}, {"t": 107.91666666666667, "x": "残りの15回は私立の学校が勝っている。"}, {"t": 110.56666666666666, "x": "いちばん多いのは大阪のPL学園で、春と夏で7回だ。"}, {"t": 114.43333333333334, "x": "公立の9校と、PL学園が競い合っていた時代なのね。"}, {"t": 118.28333333333333, "x": "ああ。PLは1987年に、春と夏を続けて制している。"}, {"t": 122.76666666666667, "x": "その前、1984年の春には、\n東京の岩倉が初出場で初優勝した。"}, {"t": 128.33333333333334, "x": "日本高野連の記録には、PLの夏と\n春の連覇を止めたとある。"}, {"t": 132.5, "x": "私立にも初出場で勝った学校があったのね。"}, {"t": 135.55, "x": "そうだ。ただ春の選抜に初めて出て\n優勝した公立校も、この14年に2校ある。"}, {"t": 140.8, "x": "1985年の伊野商と、1988年の宇和島東だ。"}, {"t": 145.85, "x": "その2校の話もあとで出てくるのね。"}, {"t": 148.28333333333333, "x": "では、年の順に見ていく。"}, {"t": 150.66666666666666, "x": "最初は1975年の夏。千葉の習志野だ。"}, {"t": 154.13333333333333, "x": "学校の名前は習志野市立習志野高校。"}, {"t": 156.66666666666666, "x": "市が建てた学校だ。"}, {"t": 158.1, "x": "決勝の相手は愛媛の新居浜商。"}, {"t": 160.33333333333334, "x": "相手も商業高校なのね。"}, {"t": 162.18333333333334, "x": "ああ。この大会は台風が2つ来て、\n日程が合わせて5日延びた。"}, {"t": 166.26666666666668, "x": "決勝も台風6号のため2日続けて延びている。"}, {"t": 169.5, "x": "決勝が2日も延びたの？"}, {"t": 171.31666666666666, "x": "ああ。習志野のエースは右の肩に痛みを抱えていた。"}, {"t": 174.5, "x": "延びた2日間、キャッチボールもせずに\n肩を休ませたという。"}, {"t": 177.96666666666667, "x": "試合は新居浜商が2回に1点、\n4回に2点を取って先に進んだ。"}, {"t": 182.23333333333332, "x": "習志野は5回に4点を返して、前に出る。"}, {"t": 185.03333333333333, "x": "7回に1点を返されて、4対4で9回を迎えた。"}, {"t": 188.56666666666666, "x": "9回裏、ツーアウト一塁・三塁。"}, {"t": 190.93333333333334, "x": "打球はライトの前に落ちて、三塁の走者が帰ってきた。"}, {"t": 194.4, "x": "5対4。習志野のサヨナラ勝ちだ。"}, {"t": 196.53333333333333, "x": "試合時間は2時間46分だった。"}, {"t": 199.06666666666666, "x": "習志野の夏の優勝は、1967年に続いて2度目だった。"}, {"t": 203.51666666666668, "x": "監督は、1967年に優勝したときのエースだった人だ。"}, {"t": 208.1, "x": "じゃあ、いまの習志野は？"}, {"t": 209.75, "x": "2019年の春の選抜で、決勝まで進んでいる。"}, {"t": 213.23333333333332, "x": "準決勝で大分の明豊に6対4。"}, {"t": 215.48333333333332, "x": "春の決勝は学校で初めてだった。"}, {"t": 217.88333333333333, "x": "決勝は東邦に0対6で敗れて、準優勝だった。"}, {"t": 221.33333333333334, "x": "同じ年の夏にも甲子園に出て、\n2回戦で鶴岡東に5対9で敗れた。"}, {"t": 226.15, "x": "千葉大会では、2026年の夏は準決勝まで進んだ。"}, {"t": 230.13333333333333, "x": "2026年の秋の千葉大会は準優勝。"}, {"t": 232.9, "x": "関東大会に進んでいる。"}, {"t": 234.81666666666666, "x": "いまも甲子園の近くにいる学校なのね。"}, {"t": 237.91666666666666, "x": "次は和歌山の箕島。県立の学校だ。"}, {"t": 240.68333333333334, "x": "この14年で3回優勝している。"}, {"t": 242.73333333333332, "x": "池田と並んで、9校の中でいちばん多い。"}, {"t": 245.48333333333332, "x": "1回目は1977年の春。"}, {"t": 247.93333333333334, "x": "決勝は高知の中村に3対0だった。"}, {"t": 250.63333333333333, "x": "箕島のエースは4日続けての登板で、\n3安打に抑えて完封した。"}, {"t": 255.05, "x": "中村ってどんな学校だったの？"}, {"t": 257.1666666666667, "x": "部員が12人しかいなかった。"}, {"t": 259.1, "x": "「二十四の瞳」と呼ばれて、\n決勝まで勝ち進んだ学校だ。"}, {"t": 263.0, "x": "2回目と3回目は1979年。"}, {"t": 265.6333333333333, "x": "春と夏を続けて制した。"}, {"t": 267.51666666666665, "x": "春の決勝は大阪の浪商に8対7。"}, {"t": 270.1166666666667, "x": "点を取り合う試合だった。"}, {"t": 271.6666666666667, "x": "夏は3回戦で、石川の星稜と延長18回を戦っている。"}, {"t": 275.85, "x": "この試合は星稜の回でくわしく話した。"}, {"t": 278.3833333333333, "x": "そして夏の決勝は、徳島の池田に4対3で勝った。"}, {"t": 282.03333333333336, "x": "監督は尾藤公。"}, {"t": 283.45, "x": "日本高野連の記録には、選抜で\n監督として最も多い3回目の優勝とある。"}, {"t": 288.68333333333334, "x": "夏の決勝の相手が、池田だったのね。"}, {"t": 291.4, "x": "ああ。この池田もあとで出てくる。"}, {"t": 293.3, "x": "では、いまの箕島はどうか。"}, {"t": 295.1666666666667, "x": "最後に甲子園に出たのは2013年の夏だ。"}, {"t": 298.18333333333334, "x": "Numberの2025年の記事によると、"}, {"t": 300.6166666666667, "x": "100人近くいた部員が、一時は12人まで減ったという。"}, {"t": 304.23333333333335, "x": "1977年の決勝の相手と、同じ人数ね。"}, {"t": 308.0833333333333, "x": "ただ2026年の春の和歌山大会では4強に入っている。"}, {"t": 312.15, "x": "まだ、終わった学校じゃないのね。"}, {"t": 314.78333333333336, "x": "1978年の春は静岡県立の浜松商だ。"}, {"t": 318.6666666666667, "x": "地元では「浜商」と呼ばれている。"}, {"t": 320.98333333333335, "x": "決勝の相手は福井商。"}, {"t": 322.43333333333334, "x": "商業高校どうしの決勝だった。"}, {"t": 324.6, "x": "1回裏、浜松商は一死三塁の場面で、\n相手のスクイズを見破った。"}, {"t": 329.1166666666667, "x": "3回に1点、8回に1点を取って2対0で勝った。"}, {"t": 332.7, "x": "守りで流れをつかんだのね。"}, {"t": 334.5833333333333, "x": "エースは2年生。1回戦では完封もしている。"}, {"t": 337.51666666666665, "x": "2回戦では東京の早実に、1対4から逆転して勝った。"}, {"t": 341.46666666666664, "x": "準々決勝は宮城の東北に3対0。"}, {"t": 344.0, "x": "準決勝は群馬の桐生に3対2。"}, {"t": 346.3333333333333, "x": "5試合のうち3試合で、相手を0点に抑えている。"}, {"t": 349.55, "x": "いまの浜松商は？"}, {"t": 351.0, "x": "最後の甲子園は2000年の夏だ。"}, {"t": 353.2, "x": "その夏の初戦の相手はまた福井商だった。"}, {"t": 356.05, "x": "1978年の決勝と同じ相手ね。"}, {"t": 359.2, "x": "ああ。今度も2対1で勝っている。"}, {"t": 361.1166666666667, "x": "次の試合で樟南に0対3で敗れた。"}, {"t": 363.71666666666664, "x": "甲子園には春と夏で17回出ている。"}, {"t": 366.26666666666665, "x": "1988年の夏には2回戦で池田と当たった。"}, {"t": 370.03333333333336, "x": "延長14回、3対2で浜松商が勝っている。"}, {"t": 373.3666666666667, "x": "日本一になった公立校どうしが、\n甲子園で当たったのね。"}, {"t": 377.1, "x": "そして2026年の春。"}, {"t": 378.9166666666667, "x": "静岡大会で7年ぶりに決勝へ進んだ。"}, {"t": 381.81666666666666, "x": "静岡新聞は、勝ち上がりの3試合が\nすべて1点差だったと伝えている。"}, {"t": 386.31666666666666, "x": "1点差を3つ続けて勝ったのね。"}, {"t": 388.6, "x": "決勝は知徳に0対6で敗れた。\nそれでも東海大会に進んでいる。"}, {"t": 393.65, "x": "1980年の春は高知の高知商だ。"}, {"t": 396.46666666666664, "x": "高知市が建てた学校だ。"}, {"t": 398.2, "x": "その2年前、1978年の夏。"}, {"t": 401.1166666666667, "x": "高知商は決勝でPL学園に2対3で敗れていた。"}, {"t": 404.6166666666667, "x": "あと1点で、日本一を逃していたのね。"}, {"t": 407.43333333333334, "x": "そして1980年の春。"}, {"t": 409.48333333333335, "x": "決勝の相手は東京の帝京。"}, {"t": 411.5, "x": "日本高野連の記録には、\n延長10回のサヨナラで初優勝とある。"}, {"t": 415.68333333333334, "x": "点数は1対0だ。"}, {"t": 417.23333333333335, "x": "1点だけの決勝だったのね。"}, {"t": 419.28333333333336, "x": "ああ。この帝京は、5年後の春の決勝でも\n高知の学校に敗れる。"}, {"t": 423.5833333333333, "x": "また高知なの？"}, {"t": 424.76666666666665, "x": "それは伊野商のところで話す。"}, {"t": 426.65, "x": "いまの高知商は、最後の夏の甲子園が2018年。"}, {"t": 430.06666666666666, "x": "第100回の記念大会だ。"}, {"t": 431.93333333333334, "x": "2026年の夏は、第1シードで高知大会に臨んだ。"}, {"t": 435.81666666666666, "x": "ただ準々決勝で高知に2対4で敗れている。"}, {"t": 438.71666666666664, "x": "この夏、明徳義塾が24回目の夏の甲子園を決めた。"}, {"t": 442.6666666666667, "x": "それまで高知商と23回で並んでいた\n数を、1つ抜いたことになる。"}, {"t": 447.1166666666667, "x": "県でいちばん多かった数を、\n明徳義塾に抜かれたのね。"}, {"t": 451.21666666666664, "x": "箕島と並んで、9校の中でいちばん\n多く勝ったのが徳島県立の池田だ。"}, {"t": 455.98333333333335, "x": "この14年で3回。監督は蔦文也。"}, {"t": 458.71666666666664, "x": "1979年の夏は、箕島に4対3で敗れて準優勝だった。"}, {"t": 463.5833333333333, "x": "3年後の1982年の夏。"}, {"t": 466.05, "x": "決勝で広島商を12対2で破った。"}, {"t": 468.76666666666665, "x": "12点も取ったの？"}, {"t": 47 const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
