<script>
const D={"name": "大宮工の4度の逆転", "file": "058_編集用", "dur": 557.7333125, "segs": [], "subs": [{"t": 0.0, "x": "1968年の春、甲子園。"}, {"t": 2.5, "x": "センバツの決勝は1回から点が動いた。"}, {"t": 5.116666666666666, "x": "広島の尾道商が1回に2点。"}, {"t": 7.2, "x": "埼玉の大宮工は0対2から始まった。"}, {"t": 10.083333333333334, "x": "決勝でいきなり2点も取られたの？"}, {"t": 12.316666666666666, "x": "ああ。だが4回に大宮工が\n3点を入れてひっくり返した。"}, {"t": 15.85, "x": "そこから9回まで、どちらにも点は入らなかった。"}, {"t": 18.85, "x": "3対2で大宮工の優勝だ。"}, {"t": 21.033333333333335, "x": "1点差を最後まで守り切ったわけね。"}, {"t": 23.483333333333334, "x": "そうだ。しかもこれは大宮工に\nとって初めての甲子園だった。"}, {"t": 27.25, "x": "5つの試合のうち3つで、先に点を\n取られてからひっくり返している。"}, {"t": 31.533333333333335, "x": "初めての甲子園で、そんな勝ち方を3回も？"}, {"t": 34.56666666666667, "x": "じゃあ、どんな学校が初めての甲子園を\nどう勝ち切ったのかしら。"}, {"t": 38.4, "x": "日本高野連の一覧と大会小史、\n記録のサイトの表、県の資料を開いていこう。"}, {"t": 43.5, "x": "その前にチャンネル登録と\n高評価をしてもらえるとうれしい。"}, {"t": 46.916666666666664, "x": "押してもらえたら私もがんばれるわ。"}, {"t": 49.65, "x": "大宮工って、どういう学校なの？"}, {"t": 51.916666666666664, "x": "埼玉県が建てた県立の工業高校だ。"}, {"t": 54.46666666666667, "x": "正しい名前は埼玉県立大宮工業高等学校。"}, {"t": 57.81666666666667, "x": "学校の資料には、大正14年の創立とある。"}, {"t": 60.766666666666666, "x": "1925年のことだ。"}, {"t": 62.916666666666664, "x": "大正って、昭和よりも前の時代でしょう？"}, {"t": 65.56666666666666, "x": "そうだ。2025年の資料では\n「100年の歴史と伝統」と書いている。"}, {"t": 70.15, "x": "場所は今のさいたま市北区の本郷町だ。"}, {"t": 72.86666666666666, "x": "その資料にはどんな学校だと書いてあるの？"}, {"t": 75.48333333333333, "x": "目指す学校の形は「日本を支え世界で\n活躍する人間性豊かなエンジニアの育成」。"}, {"t": 80.93333333333334, "x": "国が選ぶ情報の学びに力を入れる\n高校の1つにもなっている。"}, {"t": 85.0, "x": "ものを作る人を育てる学校ってことか。"}, {"t": 87.7, "x": "そうだ。その工業の学校が\n甲子園で優勝したことがある。"}, {"t": 91.28333333333333, "x": "ではその1968年の春の大会から見ていこう。"}, {"t": 95.56666666666666, "x": "1968年は第40回のセンバツで記念の大会だった。"}, {"t": 99.9, "x": "大会小史によると、出場した学校が\n都道府県の木を持ち寄ったそうだ。"}, {"t": 104.4, "x": "できあがる前の野球の会館に\n記念の木として植えたとある。"}, {"t": 107.93333333333334, "x": "全国の木が1つの場所に集まったんだ。"}, {"t": 110.66666666666667, "x": "出場は30校。埼玉からは大宮工の1校だけだった。"}, {"t": 114.5, "x": "記録のサイトでは、大宮工の甲子園は\nこの春が初めてだ。"}, {"t": 118.21666666666667, "x": "2年前の春に埼玉から出たのは大宮高校だ。"}, {"t": 121.11666666666666, "x": "名前は似ているが別の学校になる。"}, {"t": 123.5, "x": "まぎらわしいけど、大宮工は工業のほうね。"}, {"t": 126.15, "x": "関東の学校はそれまで春に勝ったことはあったの？"}, {"t": 129.25, "x": "記録の表を数えると、東京の早稲田実と\n神奈川の法政二、栃木の作新学院。"}, {"t": 134.46666666666667, "x": "関東の学校の春の優勝はそれまで3度だけだった。"}, {"t": 137.88333333333333, "x": "思ったより少ないわ。"}, {"t": 139.38333333333333, "x": "そうだ。そして大宮工の最初の試合はいきなり\n苦しい形になった。"}, {"t": 144.18333333333334, "x": "1回戦の相手は山口の防府商だ。"}, {"t": 146.65, "x": "防府商は2回に3点、3回に1点を入れた。"}, {"t": 149.55, "x": "大宮工は0対4になった。"}, {"t": 151.66666666666666, "x": "初めての甲子園の最初の試合で4点差なんて。"}, {"t": 154.8, "x": "ああ。だが5回に大宮工が2点を返して2対4。"}, {"t": 157.9, "x": "8回に1点を足して3対4。"}, {"t": 159.81666666666666, "x": "9回にも1点で4対4に追いついた。"}, {"t": 162.48333333333332, "x": "8回と9回に1点ずつ取ったの？"}, {"t": 164.9, "x": "そうだ。少しずつ追いかけて、9回で同じ点にした。"}, {"t": 168.4, "x": "試合は延長に入った。そして10回に\n大宮工がまた1点を入れた。"}, {"t": 172.68333333333334, "x": "8回、9回、10回と、3つの回で1点ずつね。"}, {"t": 176.41666666666666, "x": "5対4で勝った。4回から後は\n防府商に点は入っていない。"}, {"t": 180.35, "x": "初めての1勝が、4点差からの逆転だったんだ。"}, {"t": 183.73333333333332, "x": "記録のサイトではこの試合で\n大宮工の布施が本塁打を打っている。"}, {"t": 188.08333333333334, "x": "2回戦は静岡の浜松工だ。"}, {"t": 190.1, "x": "今度は大宮工が1回に1点を先に取った。"}, {"t": 193.01666666666668, "x": "3回と4回に1点ずつ、5回に2点、6回に4点を入れた。"}, {"t": 197.33333333333334, "x": "6回までに9点も取ったの？"}, {"t": 199.38333333333333, "x": "ああ。浜松工もあとから5点を\n返したが、9対5で勝った。"}, {"t": 203.21666666666667, "x": "準々決勝は京都の平安だ。"}, {"t": 205.13333333333333, "x": "大宮工は1回に2点、3回に3点。"}, {"t": 207.96666666666667, "x": "この試合も大宮工が先に点を取ったのね。"}, {"t": 210.76666666666668, "x": "そうだ。平安は6回に2点、9回に1点を返した。"}, {"t": 214.2, "x": "6対3で大宮工だ。"}, {"t": 215.88333333333333, "x": "布施はこの試合でも本塁打を打っている。"}, {"t": 218.28333333333333, "x": "同じ選手が2つの試合で本塁打を打ったんだ。"}, {"t": 221.28333333333333, "x": "ああ。そして準決勝でまた先に点を取られる。"}, {"t": 224.81666666666666, "x": "準決勝の相手は和歌山の箕島だった。"}, {"t": 227.45, "x": "箕島は1回に2点、2回に1点を入れた。"}, {"t": 230.18333333333334, "x": "大宮工は0対3だ。"}, {"t": 232.0, "x": "また3点も先に取られたの？"}, {"t": 234.01666666666668, "x": "そうだ。だが3回からは箕島に点は入らなかった。"}, {"t": 237.35, "x": "大宮工は4回に2点を返して2対3。"}, {"t": 239.83333333333334, "x": "7回に1点で3対3に追いついた。"}, {"t": 242.33333333333334, "x": "そして8回に2点を入れて、5対3でひっくり返した。"}, {"t": 245.93333333333334, "x": "追いついてそのまま前に出たのね。"}, {"t": 248.01666666666668, "x": "ああ。これで決勝の尾道商との試合になる。"}, {"t": 250.76666666666668, "x": "最初に話したとおり、決勝も\n0対2から4回の3点で勝った。"}, {"t": 254.9, "x": "記録のサイトの表では、\n決勝の9回の大宮工の欄にバツの印がある。"}, {"t": 259.48333333333335, "x": "バツの印って、どういう意味なの？"}, {"t": 261.73333333333335, "x": "あとから攻める側が勝っていて、\n9回の裏をやらずに終わったという印だ。"}, {"t": 266.0, "x": "大宮工は後攻めで、9回の表を0に\n抑えた時点で優勝が決まった。"}, {"t": 270.56666666666666, "x": "1回戦と準決勝と決勝、3つとも\n追いかける形だったんだ。"}, {"t": 275.3, "x": "あらためて1968年の春の5試合を並べるとどうなるの？"}, {"t": 279.5, "x": "5対4、9対5、6対3、5対3、そして3対2だ。"}, {"t": 283.55, "x": "取った点を足すと28点。"}, {"t": 285.26666666666665, "x": "取られた点は17点になる。"}, {"t": 287.3, "x": "取られた点もけっこう多いわ。"}, {"t": 289.1166666666667, "x": "ああ。先に点を取られたのは、\n1回戦と準決勝と決勝の3つだ。"}, {"t": 293.48333333333335, "x": "取られた差は、4点、3点、2点だった。"}, {"t": 296.53333333333336, "x": "その3つを全部ひっくり返したの？"}, {"t": 298.8333333333333, "x": "そうだ。しかも3つとも、逆転した\nあとは相手に点をあげていない。"}, {"t": 302.95, "x": "取られた点は、どこで入っていたの？"}, {"t": 305.28333333333336, "x": "その3試合で取られたのは、1回戦の4点、\n準決勝の3点、決勝の2点。合わせて9点だ。"}, {"t": 311.6, "x": "9点とも、1回から3回までに入っている。"}, {"t": 314.56666666666666, "x": "1回戦は4回から、準決勝は3回から、\n決勝は2回から、相手の点は0が続いた。"}, {"t": 320.55, "x": "最初に取られてもそのあとは止めていたんだ。"}, {"t": 323.18333333333334, "x": "ああ。そのあいだに少しずつ返して、前に出た。"}, {"t": 326.21666666666664, "x": "1点差で勝ったのは、1回戦と決勝の2試合だ。"}, {"t": 329.6, "x": "最初と最後がどちらも1点差だったのね。"}, {"t": 332.3, "x": "記録のサイトの表では、5試合とも\n大宮工の投手の欄には吉沢の名前だけが書いてある。"}, {"t": 337.76666666666665, "x": "5つの試合を同じ投手が投げたってことなの？"}, {"t": 340.65, "x": "表の上ではそう読める。"}, {"t": 341.8833333333333, "x": "投手の交代は書かれていない。"}, {"t": 344.4166666666667, "x": "日本高野連の大会小史は、この大会をこう書いている。"}, {"t": 347.93333333333334, "x": "「大宮工が初出場で優勝。出場30校。」"}, {"t": 351.28333333333336, "x": "初めて来てそのまま優勝って書いてあるのね。"}, {"t": 354.1, "x": "ああ。記録の表を見ると、埼玉の学校が\n春か夏に優勝したのはこれが初めてだ。"}, {"t": 359.28333333333336, "x": "埼玉の次の優勝は\n2013年の春の浦和学院。45年後だった。"}, {"t": 364.1, "x": "夏は2017年の花咲徳栄が初めてだ。"}, {"t": 367.45, "x": "埼玉の優勝は今までに3度なのね。"}, {"t": 369.98333333333335, "x": "そうだ。その1度目が、大正にできた\n県立の工業高校だった。"}, {"t": 374.8, "x": "その年の夏は、どうなったの？"}, {"t": 376.95, "x": "夏も大宮工が埼玉の代表になった。"}, {"t": 379.3666666666667, "x": "夏は第50回の記念大会だ。"}, {"t": 381.68333333333334, "x": "日本高野連の一覧では、参加は\n2485校、代表は48校だった。"}, {"t": 387.21666666666664, "x": "1回戦の相手はまた京都の平安だった。"}, {"t": 389.96666666666664, "x": "春の準々決勝で勝った相手ともう1度当たったの？"}, {"t": 393.21666666666664, "x": "そうだ。8回に平安が1点を\n入れて、大宮工は0対1になった。"}, {"t": 397.56666666666666, "x": "だが9回に大宮工が2点を入れた。"}, {"t": 399.73333333333335, "x": "2対1でひっくり返した。"}, {"t": 401.65, "x": "また先に取られて、また逆転したんだ。"}, {"t": 404.3666666666667, "x": "ああ。先に取られた試合の逆転は、\nこの年これで4つ目だ。"}, {"t": 408.15, "x": "2回戦は大分の津久見だった。"}, {"t": 409.98333333333335, "x": "津久見は前の年の春の優勝校だ。"}, {"t": 412.3333333333333, "x": "津久見は1回から点を入れて、8回にも3点。"}, {"t": 415.2, "x": "大宮工は3対7で負けた。"}, {"t": 417.35, "x": "春の優勝校どうしの試合だったんだ。"}, {"t": 419.75, "x": "布施はこの試合でも本塁打を打っている。"}, {"t": 422.15, "x": "春と夏の3つの試合で本塁打を打ったのね。"}, {"t": 425.05, "x": "記録のサイトの表では、そう数えられる。"}, {"t": 427.4, "x": "名前が書かれた試合は3つだ。"}, {"t": 430.03333333333336, "x": "そのあと大宮工はまた甲子園に来たの？"}, {"t": 432.5833333333333, "x": "記録のサイトでは、大宮工の甲子園は\n1968年の春と夏の2回だけだ。"}, {"t": 438.05, "x": "7つの試合で6勝1敗。"}, {"t": 439.71666666666664, "x": "春は5勝0敗で、負けたのは夏の津久見だけだ。"}, {"t": 443.0833333333333, "x": "来たのは1年だけなのに6つも勝ったのね。"}, {"t": 445.8833333333333, "x": "ああ。そして学校の名前にも大きな変わり目が来た。"}, {"t": 449.0, "x": "県の資料によると、大宮工は浦和工と\n1つの学校になることが決まった。"}, {"t": 453.65, "x": "新しい学校は大宮工があった場所に置くとある。"}, {"t": 456.51666666666665, "x": "名前は大宮科学技術高校。"}, {"t": 458.3833333333333, "x": "2026年の4月1日に始まった。"}, {"t": 461.45, "x": "創立100年の次の春に新しい学校になったの？"}, {"t": 464.8333333333333, "x": "そうだ。科は5つで、機械、電気、\n建築デザイン、ロボット、情報サイエンス。"}, {"t": 469.8833333333333, "x": "県の資料では、情報サイエンス科は\n県で初めての科だとある。"}, {"t": 473.6, "x": "夜に学ぶ定時制は、大宮工の分を\nそのまま新しい学校に置く。"}, {"t": 477.85, "x": "工業の学びは const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
