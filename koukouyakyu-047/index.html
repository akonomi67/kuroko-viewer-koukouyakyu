<title>桜美林</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}
*{box-sizing:border-box}

  min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;

  font-size:clamp(23px,5.4vw,42px);line-height:1.5;letter-spacing:.01em}
#nextline{margin:16px 0 0;text-align:center;white-space:pre-wrap;word-break:break-word;
  color:var(--dim);font-size:clamp(13px,2.8vw,17px);line-height:1.6}
.badge{position:absolute;left:12px;top:12px;background:rgba(127,127,127,.16);color:var(--dim);

button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:80px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}

.row b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;

.row span{white-space:pre-wrap;flex:1;font-size:16px;line-height:1.65}
.tip{color:var(--dim);font-size:12.5px;margin:10px 2px 0}

<script>
const D={"name": "桜美林", "file": "047_編集用", "dur": 703.06665625, "segs": [], "subs": [{"t": 0.0, "x": "今回は東京の学校の話よね。"}, {"t": 2.4166666666666665, "x": "ああ。1976年の夏の甲子園から始めよう。"}, {"t": 6.066666666666666, "x": "この夏、地方大会に出た学校は全国で2893校あった。"}, {"t": 10.8, "x": "そこから甲子園に来たのは41校だ。"}, {"t": 13.35, "x": "東京からは2校。東東京の代表と、\n西東京の代表だった。"}, {"t": 17.816666666666666, "x": "東京は2つに分かれていたのね。"}, {"t": 19.983333333333334, "x": "そうだ。西東京の代表は、\n町田市にある桜美林高校だった。"}, {"t": 24.016666666666666, "x": "桜美林は、この夏の大会で一度も負けずに優勝した。"}, {"t": 27.6, "x": "へえ。もともと強い学校だったの？"}, {"t": 29.966666666666665, "x": "夏の甲子園は、この年が初めてだった。"}, {"t": 32.68333333333333, "x": "でも春のセンバツには、それより前に2回来ている。"}, {"t": 35.9, "x": "じゃあ甲子園には慣れていたのね。"}, {"t": 37.88333333333333, "x": "そこで問題だ。"}, {"t": 39.0, "x": "この1976年の夏が始まる前に、桜美林は\n甲子園で何回勝っていたと思う？"}, {"t": 44.733333333333334, "x": "うーん。2回来ているなら、\n2つか3つは勝っていそうね。"}, {"t": 48.233333333333334, "x": "答えは最後に言う。"}, {"t": 49.416666666666664, "x": "今回は、戦争のあとにできた町田の学校が、\n甲子園の頂点に立つまでを追っていく。"}, {"t": 54.7, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 58.11666666666667, "x": "よろしくね。"}, {"t": 59.61666666666667, "x": "まず学校の話からだ。"}, {"t": 61.3, "x": "桜美林学園には、学園が作った100年史がある。"}, {"t": 64.48333333333333, "x": "その本によると、学園の始まりは東京ではない。"}, {"t": 67.71666666666667, "x": "じゃあどこなの？"}, {"t": 68.73333333333333, "x": "中国の北京だ。"}, {"t": 70.01666666666667, "x": "1921年、創立者の清水安三が、北京に学校を開いた。"}, {"t": 74.75, "x": "のちに崇貞学園と呼ばれる学校だ。"}, {"t": 77.23333333333333, "x": "日本の人が中国で学校を開いたのね。"}, {"t": 80.01666666666667, "x": "ああ。でもそのあと、その学校は\n中国の政府に引き取られた。"}, {"t": 83.83333333333333, "x": "1946年、清水安三と妻の郁子は\n日本に引き揚げてきた。"}, {"t": 88.46666666666667, "x": "100年史では、このとき安三は\n55歳だったと書いている。"}, {"t": 92.18333333333334, "x": "55歳から日本で一からやり直したのね。"}, {"t": 95.06666666666666, "x": "3月22日に東京駅に着いた。"}, {"t": 97.53333333333333, "x": "次の日、安三は賀川豊彦という人に会った。"}, {"t": 100.68333333333334, "x": "賀川は、働く人や農家の暮らしを良くする\n運動で知られたキリスト教の人だ。"}, {"t": 105.56666666666666, "x": "安三は、農村で学校をやりたいと話した。"}, {"t": 108.45, "x": "すると賀川は、ちょうどいい土地と\n建物があると教えてくれた。"}, {"t": 112.08333333333333, "x": "どんな建物だったの？"}, {"t": 113.68333333333334, "x": "陸軍の工場で働く人が\n寝起きしていた、5棟の寄宿舎だ。"}, {"t": 117.7, "x": "相模陸軍造兵廠という工場の寄宿舎だった。"}, {"t": 120.93333333333334, "x": "学校の建物じゃなかったのね。"}, {"t": 123.06666666666666, "x": "ああ。2人が見に行くと、荒れ\n放題の空き家だったと書いてある。"}, {"t": 127.31666666666666, "x": "そんな荒れた建物で学校を始めたの？"}, {"t": 129.86666666666667, "x": "始めた。日本に帰って1週間もしないうちに、\nここに学校を作ると決めた。"}, {"t": 134.68333333333334, "x": "丹沢の山並みの向こうに、富士山の\nてっぺんが少しだけ見えた。"}, {"t": 138.56666666666666, "x": "その景色に、ほかでは得られないものを\n感じた、と100年史にはある。"}, {"t": 142.66666666666666, "x": "場所はいまの町田市なのね。"}, {"t": 144.53333333333333, "x": "そうだ。当時の住所は、\n東京都南多摩郡の忠生村だった。"}, {"t": 148.6, "x": "桜美林という名前はどこから来たの？"}, {"t": 150.85, "x": "2人がともに学んだ、アメリカの大学からだ。"}, {"t": 153.8, "x": "オーバリン大学という。"}, {"t": 155.15, "x": "郁子がオービリンと呼び、安三が\n桜美林という漢字をあてた。"}, {"t": 158.73333333333332, "x": "外国の大学の名前に、漢字をあてたのね。"}, {"t": 161.71666666666667, "x": "学校は1946年5月5日に開校式をした。"}, {"t": 165.53333333333333, "x": "でも、そのときはまだ国の許しが下りていなかった。"}, {"t": 168.63333333333333, "x": "生徒は「申請中」と書き添えて集めたそうだ。"}, {"t": 171.86666666666667, "x": "それでも生徒は来たの？"}, {"t": 173.45, "x": "来た。開校式に集まった生徒は214人だった。"}, {"t": 176.95, "x": "窓ガラスは割れたままだったと書いてある。"}, {"t": 179.26666666666668, "x": "式のあと、親と生徒みんなで校舎を掃除した。"}, {"t": 182.38333333333333, "x": "みんなで学校を作っていったのね。"}, {"t": 184.53333333333333, "x": "5月29日に学園が認められた。"}, {"t": 186.9, "x": "理事長は賀川豊彦だ。"}, {"t": 188.7, "x": "1947年に中学校、1948年に高校ができた。"}, {"t": 193.63333333333333, "x": "1966年には大学もできている。"}, {"t": 196.65, "x": "高校は最初から大きな学校だったの？"}, {"t": 199.18333333333334, "x": "いや。100年史では、初めの10年は\n1学年100人に満たなかったとある。"}, {"t": 203.81666666666666, "x": "1960年代の半ばからは、\n1学年400人をこえる学校になった。"}, {"t": 208.98333333333332, "x": "町が大きくなって、生徒も増えたのね。"}, {"t": 212.13333333333333, "x": "野球部はいつから強くなったの？"}, {"t": 214.21666666666667, "x": "甲子園に初めて来たのは、1967年の春のセンバツだ。"}, {"t": 218.6, "x": "1回戦の相手は京都の平安。0対5で負けた。"}, {"t": 221.83333333333334, "x": "2回目は1973年の春。"}, {"t": 224.38333333333333, "x": "1回戦で福岡の小倉商に2対4で負けた。"}, {"t": 227.53333333333333, "x": "2回とも最初の試合で負けちゃったのね。"}, {"t": 230.08333333333334, "x": "そうだ。このころの東京には、\n夏の代表が1校しかなかった。"}, {"t": 234.06666666666666, "x": "日本高野連の表では、1969年から\n1973年の夏も、東京の代表は毎年1校だ。"}, {"t": 241.35, "x": "東と西の2つに分かれたのは、1974年の夏からだ。"}, {"t": 245.9, "x": "じゃあ、1976年は分かれて3年目なのね。"}, {"t": 249.5, "x": "そうだ。西東京の代表は、1974年が\n佼成学園、1975年が堀越だった。"}, {"t": 256.28333333333336, "x": "1974年は、金属のバットが\n初めて使われた夏でもある。"}, {"t": 260.73333333333335, "x": "大会小史に、金属製バット初登場、と書いてある。"}, {"t": 264.3833333333333, "x": "野球のやり方が変わり始めたころね。"}, {"t": 266.8666666666667, "x": "そして3年目の1976年。"}, {"t": 269.3666666666667, "x": "西東京を勝ち抜いたのが桜美林だった。"}, {"t": 271.8666666666667, "x": "2年後の1978年は60回目の記念の大会だった。"}, {"t": 276.2, "x": "全部の都道府県から1校ずつ、東京と\n北海道は2校ずつ出ることになった。"}, {"t": 281.06666666666666, "x": "記念の大会でも、東京は2校だったのね。"}, {"t": 284.51666666666665, "x": "桜美林の最初の試合は2回戦だった。"}, {"t": 286.9166666666667, "x": "相手は山形の日大山形だ。"}, {"t": 289.0833333333333, "x": "桜美林は1回に2点を先に取った。"}, {"t": 291.3833333333333, "x": "さらに3回に1点。5回に1点を足した。"}, {"t": 294.18333333333334, "x": "結果は4対0。相手に1点もやらなかった。"}, {"t": 297.26666666666665, "x": "これが甲子園での初めての勝ちなのね。"}, {"t": 299.8, "x": "そうだ。3回目の甲子園で、初めて勝った。"}, {"t": 302.96666666666664, "x": "最初の問題の答え、もう出ちゃったじゃない。"}, {"t": 305.7, "x": "まあ待て。答えは最後に確かめよう。"}, {"t": 308.0, "x": "3回戦は兵庫の市神港だった。"}, {"t": 310.26666666666665, "x": "2回に市神港が2点を先に取った。"}, {"t": 312.81666666666666, "x": "今度は先に取られたのね。"}, {"t": 314.6333333333333, "x": "でもその次の3回に、桜美林が\n2点を返して追いついた。"}, {"t": 318.23333333333335, "x": "7回に1点を取って勝ち越した。"}, {"t": 320.3666666666667, "x": "結果は3対2。1点差で逃げ切った。"}, {"t": 323.05, "x": "負けている所からひっくり返したのね。"}, {"t": 326.1166666666667, "x": "準々決勝の相手は千葉の銚子商だった。"}, {"t": 328.9166666666667, "x": "銚子商って強い学校なの？"}, {"t": 330.9, "x": "2年前、1974年の夏の優勝校だ。"}, {"t": 334.3333333333333, "x": "日本高野連の表では、1974年の決勝は\n銚子商が7対0で勝っている。"}, {"t": 339.93333333333334, "x": "そんな学校が相手だったのね。"}, {"t": 341.9166666666667, "x": "この試合も、3回に銚子商が1点を先に取った。"}, {"t": 345.26666666666665, "x": "桜美林は4回に2点を取って、すぐにひっくり返した。"}, {"t": 348.7, "x": "6回にも2点を取った。"}, {"t": 350.3, "x": "銚子商は7回に1点を返した。"}, {"t": 352.56666666666666, "x": "それでも4対2。桜美林が勝って4強に入った。"}, {"t": 355.81666666666666, "x": "2年前の優勝校に勝ったのね。"}, {"t": 358.03333333333336, "x": "準決勝は石川の星稜だ。"}, {"t": 360.0, "x": "星稜は2回戦で、東東京の日体荏原に\n1対0で勝っていた。"}, {"t": 364.45, "x": "東京のもう1校は、星稜に負けていたのね。"}, {"t": 367.4, "x": "桜美林は2回と3回に1点ずつ取った。"}, {"t": 370.0, "x": "星稜も3回に1点を返した。"}, {"t": 372.1333333333333, "x": "6回に桜美林が2点を足して、4対1で勝った。"}, {"t": 375.48333333333335, "x": "とうとう決勝まで来たのね！"}, {"t": 377.3, "x": "ああ。初めての夏で、4つ続けて勝った。"}, {"t": 380.8333333333333, "x": "決勝の相手はどこだったの？"}, {"t": 382.71666666666664, "x": "大阪のPL学園だ。"}, {"t": 384.3, "x": "PL学園の勝ち上がりも見ておこう。"}, {"t": 386.48333333333335, "x": "2回戦は長野の松商学園に1対0。"}, {"t": 389.1333333333333, "x": "3回戦は福岡の柳川商に1対0。"}, {"t": 392.0, "x": "準々決勝は愛知の中京に9対3。"}, {"t": 394.5833333333333, "x": "準決勝は長崎の海星に、\n延長11回、3対2で勝っていた。"}, {"t": 399.1333333333333, "x": "向こうも勢いがあったのね。"}, {"t": 400.8666666666667, "x": "決勝は、桜美林が後から攻める側だった。"}, {"t": 403.6, "x": "1回の裏、桜美林が1点を先に取った。"}, {"t": 406.3666666666667, "x": "ところが4回の表、PL学園が3点を取った。"}, {"t": 409.81666666666666, "x": "1対3。逆になっちゃったわ。"}, {"t": 411.95, "x": "そのまま6回まで、桜美林は点を取れなかった。"}, {"t": 414.9, "x": "でも7回の裏、桜美林が2点を\n返して3対3に追いついた。"}, {"t": 418.93333333333334, "x": "追いついた！"}, {"t": 419.8333333333333, "x": "8回も9回も、どちらも点が入らなかった。"}, {"t": 422.85, "x": "試合は延長に入った。"}, {"t": 424.3833333333333, "x": "10回も0対0だった。"}, {"t": 426.23333333333335, "x": "決勝で延長なんて、見ている\n人も手に汗をにぎるわね。"}, {"t": 429.73333333333335, "x": "そして11回の裏。桜美林が1点を取った。"}, {"t": 432.7, "x": "サヨナラ勝ちだ。4対3で桜美林が優勝した。"}, {"t": 435.9166666666667, "x": "最後はサヨナラで決めたのね！"}, {"t": 437.85, "x": "日本高野連の表でも、第58回の優勝は\n桜美林、準優勝はPL学園、4対3とある。"}, {"t": 443.98333333333335, "x": "ちなみにPL学園は、\n2年後の1978年の夏に優勝している。"}, {"t": 449.53333333333336, "x": "東京の学校の優勝は、久しぶりだったの？"}, {"t": 452.53333333333336, "x": "ものすごく久しぶりだ。"}, {"t": 454.06666666666666, "x": "日本高野連の大会小史は、この夏をこう書いている。"}, {"t": 457.43333333333334, "x": "初出場の桜美林が優勝。"}, {"t": 459.1666666666667, "x": "大正5年慶応普通以来60年ぶりに、\n東京へ深紅の優勝旗が舞い戻る。"}, {"t": 464.1333333333333, "x": "60 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
