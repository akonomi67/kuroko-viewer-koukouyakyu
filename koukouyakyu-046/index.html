<script>
const D={"name": "済美", "file": "046_編集用", "dur": 697.5833125, "segs": [], "subs": [{"t": 0.0, "x": "今回は愛媛の学校の話よね。"}, {"t": 2.3833333333333333, "x": "ああ。2004年の春のセンバツから始めよう。"}, {"t": 5.166666666666667, "x": "この大会に出たのは、全国から選ばれた32校だった。"}, {"t": 8.933333333333334, "x": "愛媛からは2校。そのうちの1校が、\n松山市の済美高校だ。"}, {"t": 12.983333333333333, "x": "日本高野連の出場校の表では、\nこの春の愛媛の欄に、済美ともう1校の名前がある。"}, {"t": 18.65, "x": "1つの県から2校も出ていたのね。"}, {"t": 20.883333333333333, "x": "済美ってそのころから強かったの？"}, {"t": 23.133333333333333, "x": "いや。甲子園に出るのはこの春が初めてだった。"}, {"t": 26.066666666666666, "x": "しかも済美は、少し前まで女子校だった学校なんだ。"}, {"t": 29.6, "x": "女子校だった学校が甲子園に来たの？"}, {"t": 32.11666666666667, "x": "そうだ。そして、この大会で一度も負けずに優勝した。"}, {"t": 35.81666666666667, "x": "初めての甲子園でいきなり優勝したのね。"}, {"t": 38.55, "x": "そこで問題だ。"}, {"t": 39.68333333333333, "x": "済美の野球部ができてから、\nこの春の優勝までに、何年かかったと思う？"}, {"t": 44.36666666666667, "x": "うーん。強くなるには時間がかかるから、10年くらい？"}, {"t": 47.7, "x": "答えは最後に言う。"}, {"t": 48.88333333333333, "x": "今回は、松山の女子校だった学校が、\n甲子園で勝ち続けるまでを追っていく。"}, {"t": 53.766666666666666, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 57.18333333333333, "x": "よろしくね。"}, {"t": 58.68333333333333, "x": "まず学校の話からだ。"}, {"t": 60.35, "x": "済美高校は愛媛県の松山市にある私立の高校だ。"}, {"t": 63.733333333333334, "x": "学校の住所は松山市の湊町というところにある。"}, {"t": 66.96666666666667, "x": "学校のホームページによると、始まりは1901年。"}, {"t": 70.45, "x": "高知県の出身の創立者が、松山の町に\n裁縫を教える学校を開いた。"}, {"t": 75.25, "x": "名前は、私立松山裁縫伝習所。"}, {"t": 77.65, "x": "和裁や洋裁、礼儀作法を教えていた。"}, {"t": 80.31666666666666, "x": "最初は野球とは関係のない学校だったのね。"}, {"t": 83.26666666666667, "x": "ああ。生徒100人を\n集めるところから始めた、と書いてある。"}, {"t": 86.9, "x": "1902年には、裁縫の女学校として新しく開校した。"}, {"t": 91.01666666666667, "x": "1908年には、ほかの学校と\n一緒になって愛媛実科女学校になった。"}, {"t": 95.88333333333334, "x": "そのあと済美高等女学校という\n名前の学校が生まれていく。"}, {"t": 99.55, "x": "名前は何度も変わったけど、\nずっと女の子の学校だったのね。"}, {"t": 103.45, "x": "そうだ。共学になるまでずっと女子校だった。"}, {"t": 106.2, "x": "学校の紹介のページにはこう書いてある。"}, {"t": 108.61666666666666, "x": "1901年に開校してからの女子校が、\n100周年の2002年をきっかけに男女共学になった。"}, {"t": 114.91666666666667, "x": "共学というのは、男子と女子が\n同じ学校で一緒に学ぶことだ。"}, {"t": 119.0, "x": "2002年に男の子も入れる学校になったのね。"}, {"t": 122.05, "x": "校訓は「やればできる」だ。"}, {"t": 124.06666666666666, "x": "わかりやすい言葉ね。"}, {"t": 125.55, "x": "学校のホームページにも、「やれば出来る」は\n魔法の合言葉、と大きく出ている。"}, {"t": 130.3, "x": "この言葉あとでまた出てきそうね。"}, {"t": 132.9, "x": "共学になって野球部もできたの？"}, {"t": 135.1, "x": "ああ。女子校だった済美に、新しく野球部ができた。"}, {"t": 138.45, "x": "その初代の監督に来たのが、\n愛媛の野球ではよく知られた人だった。"}, {"t": 142.86666666666667, "x": "どんな人なの？"}, {"t": 144.06666666666666, "x": "同じ愛媛の宇和島東という\n県立高校で、監督をしていた人だ。"}, {"t": 148.45, "x": "1988年の春のセンバツで、\n宇和島東を初出場で優勝させている。"}, {"t": 153.95, "x": "初めての甲子園で優勝させた監督なのね。"}, {"t": 156.93333333333334, "x": "高校野球ドットコムの記事では、宇和島東を春4度、\n夏6度の甲子園に導いた名将と書いている。"}, {"t": 163.41666666666666, "x": "その監督が、できたばかりの済美の野球部を\n引き受けた。"}, {"t": 167.05, "x": "最初は1年生しかいないのよね。"}, {"t": 169.3, "x": "そうだ。先輩のいない部から始めることになる。"}, {"t": 172.31666666666666, "x": "先輩がいないと、練習のやり方も\n自分たちで作っていくのね。"}, {"t": 176.36666666666667, "x": "そういうことになる。"}, {"t": 177.4, "x": "甲子園に出たことのある選手も、もちろんいない。"}, {"t": 180.33333333333334, "x": "野球部のページには、部の言葉が\n「夢叶うまで挑戦」とある。"}, {"t": 184.31666666666666, "x": "1期生から受け継いだ高い志で、\n甲子園の優勝を目指す、とも書いてある。"}, {"t": 189.28333333333333, "x": "最初から目標は甲子園の優勝だったのね。"}, {"t": 192.7, "x": "そして2004年の春。"}, {"t": 194.13333333333333, "x": "済美は初めての甲子園に立った。"}, {"t": 196.33333333333334, "x": "この大会からベンチに入れる選手は18人に\n増えた、と日本高野連の大会小史にある。"}, {"t": 201.86666666666667, "x": "その大会で済美はどう勝ったの？"}, {"t": 203.96666666666667, "x": "記録のサイトで5つの試合を順に見ていこう。"}, {"t": 206.61666666666667, "x": "1回戦は茨城の土浦湖北に9対0。"}, {"t": 209.65, "x": "初めての甲子園の最初の試合で、9点も取ったのね。"}, {"t": 213.21666666666667, "x": "2回戦は愛知の東邦に1対0。"}, {"t": 215.63333333333333, "x": "2つ目は1点を守りきったのね。"}, {"t": 217.93333333333334, "x": "準々決勝は宮城の東北に7対6。"}, {"t": 220.63333333333333, "x": "この大会では、東北のエースが\nノーヒットノーランをしている。"}, {"t": 224.06666666666666, "x": "大会小史には、\n12人目のノーヒットノーランと書いてある。"}, {"t": 227.71666666666667, "x": "そんな強いチームに勝ったのね。"}, {"t": 229.71666666666667, "x": "準決勝は高知の明徳義塾に7対6。"}, {"t": 232.7, "x": "準々決勝と準決勝は同じ7対6なのね。"}, {"t": 23 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
