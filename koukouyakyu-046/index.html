<style>

<script>
const D={"name": "済美", "file": "046_編集用", "dur": 700.8833125, "segs": [], "subs": [{"t": 0.0, "x": "2004年の春のセンバツ。"}, {"t": 1.6333333333333333, "x": "全国から選ばれた32校が、甲子園に集まった。"}, {"t": 5.166666666666667, "x": "その中に、愛媛県の松山市からやって来た、\n済美高校という学校がいた。"}, {"t": 10.15, "x": "さいび？　あんまり耳にしない名前ね。"}, {"t": 12.45, "x": "この春、愛媛からは2校が選ばれていて、\n日本高野連の出場校の表にも、"}, {"t": 17.133333333333333, "x": "済美ともう1校の名前が並んでいる。"}, {"t": 19.583333333333332, "x": "へえ、ひとつの県から2校も。\nこの年の愛媛はにぎやかじゃない。"}, {"t": 23.45, "x": "じゃあ済美も、むかしから甲子園でおなじみのところ？"}, {"t": 26.616666666666667, "x": "いや。甲子園に出るのはこの春が初めてだった。"}, {"t": 29.55, "x": "しかも済美は、少し前まで女子校だった学校なんだ。"}, {"t": 33.083333333333336, "x": "女子校だった学校が甲子園に来たの？"}, {"t": 35.6, "x": "そうだ。そして、この大会で一度も負けずに優勝した。"}, {"t": 39.3, "x": "初めての甲子園でいきなり優勝したのね。"}, {"t": 42.03333333333333, "x": "そこで問題だ。"}, {"t": 43.166666666666664, "x": "済美の野球部ができてから、\nこの春の優勝までに、何年かかったと思う？"}, {"t": 47.85, "x": "うーん。強くなるには時間がかかるから、10年くらい？"}, {"t": 51.18333333333333, "x": "答えは最後に言う。"}, {"t": 52.36666666666667, "x": "今回は、松山の女子校だった学校が、\n甲子園で勝ち続けるまでを追っていく。"}, {"t": 57.25, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 60.666666666666664, "x": "よろしくね。"}, {"t": 62.166666666666664, "x": "まず学校の話からだ。"}, {"t": 63.85, "x": "済美高校は愛媛県の松山市にある私立の高校だ。"}, {"t": 67.21666666666667, "x": "学校の住所は松山市の湊町というところにある。"}, {"t": 70.45, "x": "学校のホームページによると、始まりは1901年。"}, {"t": 73.93333333333334, "x": "高知県の出身の創立者が、松山の町に\n裁縫を教える学校を開いた。"}, {"t": 78.73333333333333, "x": "名前は、私立松山裁縫伝習所。"}, {"t": 81.13333333333334, "x": "和裁や洋裁、礼儀作法を教えていた。"}, {"t": 83.8, "x": "最初は野球とは関係のない学校だったのね。"}, {"t": 86.75, "x": "ああ。生徒100人を\n集めるところから始めた、と書いてある。"}, {"t": 90.38333333333334, "x": "1902年には、裁縫の女学校として新しく開校した。"}, {"t": 94.5, "x": "1908年には、ほかの学校と\n一緒になって愛媛実科女学校になった。"}, {"t": 99.36666666666666, "x": "そのあと済美高等女学校という\n名前の学校が生まれていく。"}, {"t": 103.03333333333333, "x": "名前は何度も変わったけど、\nずっと女の子の学校だったのね。"}, {"t": 106.93333333333334, "x": "そうだ。共学になるまでずっと女子校だった。"}, {"t": 109.68333333333334, "x": "学校の紹介のページにはこう書いてある。"}, {"t": 112.1, "x": "1901年に開校してからの女子校が、\n100周年の2002年をきっかけに男女共学になった。"}, {"t": 118.4, "x": "共学というのは、男子と女子が\n同じ学校で一緒に学ぶことだ。"}, {"t": 122.48333333333333, "x": "2002年に男の子も入れる学校になったのね。"}, {"t": 125.65, "x": "校訓は「やればできる」だ。"}, {"t": 127.68333333333334, "x": "わかりやすい言葉ね。"}, {"t": 129.16666666666666, "x": "学校のホームページにも、「やれば出来る」は\n魔法の合言葉、と大きく出ている。"}, {"t": 133.9, "x": "この言葉あとでまた出てきそうね。"}, {"t": 136.5, "x": "共学になって野球部もできたの？"}, {"t": 138.7, "x": "ああ。女子校だった済美に、新しく野球部ができた。"}, {"t": 142.06666666666666, "x": "その初代の監督に来たのが、\n愛媛の野球ではよく知られた人だった。"}, {"t": 146.46666666666667, "x": "どんな人なの？"}, {"t": 147.68333333333334, "x": "同じ愛媛の宇和島東という\n県立高校で、監督をしていた人だ。"}, {"t": 152.05, "x": "1988年の春のセンバツで、\n宇和島東を初出場で優勝させている。"}, {"t": 157.55, "x": "初めての甲子園で優勝させた監督なのね。"}, {"t": 160.53333333333333, "x": "高校野球ドットコムの記事では、宇和島東を春4度、\n夏6度の甲子園に導いた名将と書いている。"}, {"t": 167.01666666666668, "x": "その監督が、できたばかりの済美の野球部を\n引き受けた。"}, {"t": 170.66666666666666, "x": "最初は1年生しかいないのよね。"}, {"t": 172.9, "x": "そうだ。先輩のいない部から始めることになる。"}, {"t": 175.93333333333334, "x": "先輩がいないと、練習のやり方も\n自分たちで作っていくのね。"}, {"t": 179.96666666666667, "x": "そういうことになる。"}, {"t": 181.0, "x": "甲子園に出たことのある選手も、もちろんいない。"}, {"t": 183.95, "x": "野球部のページには、部の言葉が\n「夢叶うまで挑戦」とある。"}, {"t": 187.91666666666666, "x": "1期生から受け継いだ高い志で、\n甲子園の優勝を目指す、とも書いてある。"}, {"t": 192.88333333333333, "x": "最初から目標は甲子園の優勝だったのね。"}, {"t": 196.3, "x": "そして2004年の春。"}, {"t": 197.73333333333332, "x": "済美は初めての甲子園に立った。"}, {"t": 199.93333333333334, "x": "この大会からベンチに入れる選手は18人に\n増えた、と日本高野連の大会小史にある。"}, {"t": 205.38333333333333, "x": "その大会で済美はどう勝ったの？"}, {"t": 207.48333333333332, "x": "記録のサイトで5つの試合を順に見ていこう。"}, {"t": 210.13333333333333, "x": "1回戦は茨城の土浦湖北に9対0。"}, {"t": 213.16666666666666, "x": "初めての甲子園の最初の試合で、9点も取ったのね。"}, {"t": 216.75, "x": "2回戦は愛知の東邦に1対0。"}, {"t": 219.16666666666666, "x": "2つ目は1点を守りきったのね。"}, {"t": 221.45, "x": "準々決勝は宮城の東北に7対6。"}, {"t": 224.15, "x": "この大会では、東北のエースが\nノーヒットノーランをしている。"}, {"t": 227.58333333333334, "x": "大会小史には、\n12人目のノーヒットノーランと書いてある。"}, {"t": 231.25, "x": "そんな強いチームに勝ったのね。"}, {"t": 233.25, "x": "準決勝は高知の明徳義塾に7対6。"}, {"t": 236.23333333333332, "x": "準々決勝と準決勝は同じ7対6なのね。"}, {"t": 239.48333333333332, "x": "そして決勝は愛知の愛工大名電に6対5だった。"}, {"t": 242.88333333333333, "x": "最後の3つはどれも1点差ね。"}, {"t": 245.03333333333333, "x": "そうだ。投げたのは2年生のエースだった。"}, {"t": 247.6, "x": "日本高野連の表でも、第76回の優勝は\n済美、準優勝は愛工大名電、6対5とある。"}, {"t": 253.91666666666666, "x": "初めての甲子園で5つ勝って優勝したのね。"}, {"t": 256.8666666666667, "x": "大会小史はこの春をこう書いている。"}, {"t": 259.06666666666666, "x": "済美が最速の創部3年目で初出場初優勝。"}, {"t": 262.45, "x": "初出場初優勝というのは、初めて出た\n大会で、そのまま優勝することだ。"}, {"t": 267.56666666666666, "x": "3年目！ 最初の問題の答えが出ちゃったわ。"}, {"t": 270.6, "x": "ああ。答えは3年目だ。わたしが言う\n前に、大会小史が言ってしまった。"}, {"t": 275.1666666666667, "x": "わたしの10年はずいぶん外れたわね。"}, {"t": 277.5, "x": "それと、監督にとっては2回目の初出場初優勝だった。"}, {"t": 281.4166666666667, "x": "宇和島東と済美。ちがう2つの学校で、\n春の初出場初優勝をしたことになる。"}, {"t": 286.8833333333333, "x": "記事は、この記録は恐らく今後も\n破られることはないだろう、と書いている。"}, {"t": 291.8, "x": "春に優勝したあと夏はどうだったの？"}, {"t": 294.2, "x": "夏も愛媛の代表になって甲子園に戻ってきた。"}, {"t": 297.25, "x": "この夏、全国の参加校は4146校。"}, {"t": 300.5, "x": "代表は49校だった。"}, {"t": 302.5, "x": "4000校もある中からまた来たのね。"}, {"t": 304.93333333333334, "x": "2回戦は秋田の秋田商に11対8。"}, {"t": 307.6333333333333, "x": "3回戦は山口の岩国に6対0。"}, {"t": 310.26666666666665, "x": "準々決勝は愛知の中京大中京に2対1。"}, {"t": 313.35, "x": "準決勝は千葉の千葉経大付に5対2。"}, {"t": 316.0, "x": "夏も決勝まで来たのね！"}, {"t": 317.8333333333333, "x": "ああ。春と夏を続けて優勝すれば、春夏連覇になる。"}, {"t": 321.48333333333335, "x": "決勝の相手は南北海道の駒大苫小牧だった。"}, {"t": 324.8333333333333, "x": "結果は10対13。済美は準優勝だった。"}, {"t": 327.8666666666667, "x": "あと一歩で春夏連覇だったのね。"}, {"t": 330.1, "x": "大会小史にはこう書いてある。"}, {"t": 331.9, "x": "春夏連続優勝を目指した創部3年目の済美は準優勝。"}, {"t": 335.6666666666667, "x": "この決勝で、駒大苫小牧は\n北海道の学校として初めて優勝した。"}, {"t": 340.3, "x": "その試合の話は、前に駒大苫小牧の回で\nくわしくやったから、そちらも見てほしい。"}, {"t": 345.71666666666664, "x": "春は優勝、夏は準優勝。できて\n3年目の野球部とは思えないわね。"}, {"t": 350.8, "x": "そのあとも済美は甲子園に来たの？"}, {"t": 353.06666666666666, "x": "ああ。2005年の夏も愛媛の代表になった。"}, {"t": 356.0, "x": "1回戦は北北海道の旭川工に6対0で勝った。"}, {"t": 359.7, "x": "2回戦は長崎の清峰に4対9で負けた。"}, {"t": 362.6666666666667, "x": "この夏に優勝したのは、前の年と\n同じ駒大苫小牧だった。"}, {"t": 366.55, "x": "決勝は5対3だったと日本高野連の表にある。"}, {"t": 369.7, "x": "済美に勝った次の年も駒大苫小牧が勝ったのね。"}, {"t": 373.1166666666667, "x": "2008年の夏は、1回戦で\n和歌山の智弁和歌山に0対3だった。"}, {"t": 377.71666666666664, "x": "この夏の優勝は大阪桐蔭で、決勝は17対0だった。"}, {"t": 381.73333333333335, "x": "しばらく、春の優勝のときのようには\n勝てなかったのね。"}, {"t": 385.2, "x": "そうだ。次に大きく勝ち進んだのは、2013年の春だ。"}, {"t": 389.1666666666667, "x": "2回戦は広島の広陵に4対3。"}, {"t": 391.4166666666667, "x": "延長13回までもつれた。"}, {"t": 393.35, "x": "3回戦は熊本の済々黌に4対1。"}, {"t": 396.1166666666667, "x": "準々決勝は岐阜の県岐阜商に6対3。"}, {"t": 398.8666666666667, "x": "準決勝は高知の高知高校に3対2。"}, {"t": 401.6333333333333, "x": "また春の決勝まで来たのね。"}, {"t": 403.65, "x": "決勝の相手は埼玉の浦和学院だった。"}, {"t": 406.3833333333333, "x": "春の決勝は2004年の優勝のとき以来ね。"}, {"t": 409.35, "x": "結果は1対17。済美は春の準優勝になった。"}, {"t": 412.8666666666667, "x": "決勝で17点も取られちゃったの。"}, {"t": 415.21666666666664, "x": "ああ。大会小史には、浦和学院が春夏を\n通じて初めて優勝した、と書いてある。"}, {"t": 420.45, "x": "同じ年の夏も済美は甲子園に来ている。"}, {"t": 423.06666666666666, "x": "2回戦は三重の三重高校に9対7。"}, {"t": 425.51666666666665, "x": "3回戦は岩手の花巻東に6対7。"}, {"t": 428.3, "x": "延長10回の1点差だった。"}, {"t": 430.45, "x": "春も夏も甲子園の常連になってきたのね。"}, {"t": 433.81666666666666, "x": "次は2017年の夏だ。"}, {"t": 435.81666666666666, "x": "1回戦は福岡の東筑に10対4。"}, {"t": 438.1666666666667, "x": "2回戦は三重の津田学園に7対1。"}, {"t": 440.7, "x": "この夏は、大会全体のホームランが68本で、\nそれまでで最も多かった、と大会小史にある。"}, {"t": 447.06666666666666, "x": "ホームランがたくさん出た夏だったのね。"}, {"t": 449.46666666666664, "x": "3回戦は岩手の盛岡大付に、\n延長10回で7対12だった。"}, {"t": 453.81666666666666, "x": "また延長で負けちゃったのね。"}, {"t": 455.71666666666664, "x": "そして2018年は100回目の夏の大会だ。"}, {"t": 458.8333333333333, "x": "大会小史には、この大会で甲子園で\n初めての延長13回からのタイブレークが\n行われた、とある。"}, {"t": 465.0833333333333, "x": "タイブレークって何？"}, {"t": 466.45, "x": "延長が長くなったとき、ランナーを置いた\n形から回を始める決まりだ。"}, {"t": 470.68333333333334, "x": "この年は、13回はノーアウト1塁2塁から始まった。"}, {"t": 474.3833333333333, "x": "最初からランナーがいるのね。"}, {"t": 475.93333333333334, "x": "点が入りやすそう。"}, {"t": 477.3666666666667, "x": "済美は1回戦で、西千葉の中央学院に5対4で勝った。"}, {"t": 481.2, "x": "2回戦の相手は石川の星稜だった。"}, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
