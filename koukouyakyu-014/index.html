<script>
const D={"name": "春夏連覇の7校", "file": "014_編集用", "dur": 1007.9, "segs": [], "subs": [{"t": 0.0, "x": "2026年3月31日。"}, {"t": 2.3666666666666667, "x": "兵庫県の甲子園球場。"}, {"t": 4.133333333333334, "x": "春のセンバツの決勝で、大阪桐蔭が\n智弁学園に7対3で勝った。"}, {"t": 8.6, "x": "4年ぶり5度目の春の優勝。"}, {"t": 10.333333333333334, "x": "春と夏をあわせると、10度目の日本一だ。"}, {"t": 13.383333333333333, "x": "10度目！　それなら夏も優勝候補よね。"}, {"t": 16.1, "x": "ああ。ところがその夏だ。"}, {"t": 17.75, "x": "7月19日。夏の大阪大会の4回戦。"}, {"t": 20.983333333333334, "x": "相手は大阪立命館。試合は\n延長10回のタイブレークまでもつれた。"}, {"t": 25.15, "x": "結果は2対3。大阪桐蔭の負けだ。"}, {"t": 27.816666666666666, "x": "えっ。甲子園に出る前に負けちゃったの？"}, {"t": 30.35, "x": "そうだ。新聞は「春夏連覇は夢と消え」と書いた。"}, {"t": 33.9, "x": "春の日本一が、夏は甲子園にもたどり着けなかった。"}, {"t": 37.56666666666667, "x": "春にいちばん強かったのに、なぜなの？"}, {"t": 40.083333333333336, "x": "それが今日の話。春夏連覇だ。"}, {"t": 42.43333333333333, "x": "同じ年に、春のセンバツと\n夏の選手権の両方で優勝すること。"}, {"t": 46.666666666666664, "x": "これを成しとげたのは史上8回。"}, {"t": 48.5, "x": "学校の数でいうと、たった7校だ。"}, {"t": 51.083333333333336, "x": "8回で7校？　どこかが2回やってるのね。"}, {"t": 53.983333333333334, "x": "その通り。今日はこの7校が「連覇のあと」\nどうなったのかを見ていく。"}, {"t": 58.2, "x": "いまも強い学校もあれば、\n野球部そのものが止まった学校もある。"}, {"t": 62.733333333333334, "x": "先に、8回を年の順に並べておく。"}, {"t": 65.35, "x": "1962年、栃木の作新学院。"}, {"t": 68.31666666666666, "x": "1966年、愛知の中京商。いまの中京大中京だ。"}, {"t": 72.75, "x": "1979年、和歌山の箕島。"}, {"t": 75.65, "x": "1987年、大阪のPL学園。"}, {"t": 78.71666666666667, "x": "1998年、神奈川の横浜。"}, {"t": 81.61666666666666, "x": "2010年、沖縄の興南。"}, {"t": 83.58333333333333, "x": "そして2012年と2018年、大阪の大阪桐蔭。"}, {"t": 87.46666666666667, "x": "2回やったのは大阪桐蔭なのね。"}, {"t": 89.75, "x": "ああ。2回達成したのは大阪桐蔭だけだ。"}, {"t": 92.66666666666667, "x": "年と年のあいだが、ずいぶん\nあいているところもあるわね。"}, {"t": 95.9, "x": "1966年から1979年までは、\n13年のあいだ一度も出ていない。"}, {"t": 101.56666666666666, "x": "そして2018年のあと。"}, {"t": 103.31666666666666, "x": "2026年の夏まで、まだ一度も出ていない。"}, {"t": 106.63333333333334, "x": "最後が2018年なのね。"}, {"t": 108.71666666666667, "x": "では、1校ずつ見ていこう。まずは史上初の1962年だ。"}, {"t": 113.68333333333334, "x": "1962年の春。第34回のセンバツ。"}, {"t": 117.26666666666667, "x": "栃木の作新学院のエースは八木沢荘六だ。"}, {"t": 120.41666666666667, "x": "決勝の相手は東京の日大三。"}, {"t": 122.58333333333333, "x": "八木沢が投げきって1対0で勝った。"}, {"t": 125.08333333333333, "x": "1点を守りきったのね。"}, {"t": 126.81666666666666, "x": "そして同じ年の夏。作新学院はまた甲子園に来る。"}, {"t": 130.46666666666667, "x": "ところが大会の初日。"}, {"t": 131.88333333333333, "x": "開会式の行進のあとで、八木沢が\n赤痢にかかっていると分かった。"}, {"t": 136.16666666666666, "x": "そのまま病院に隔離されて、\n夏の甲子園では投げられなかった。"}, {"t": 140.21666666666667, "x": "春の優勝投手が、いきなりいなくなったの？"}, {"t": 143.05, "x": "ああ。かわりにマウンドに立ったのが、加藤斌だ。"}, {"t": 146.88333333333333, "x": "初戦は宮城の気仙沼。"}, {"t": 148.43333333333334, "x": "延長11回、2対1。"}, {"t": 150.31666666666666, "x": "次は慶応に7対0。準々決勝は県岐阜商に9対2。"}, {"t": 154.3, "x": "八木沢は、この県岐阜商戦から\n退院してベンチに戻っている。"}, {"t": 158.1, "x": "準決勝は愛知の中京に2対0。"}, {"t": 160.3, "x": "加藤は3安打で完封した。"}, {"t": 162.33333333333334, "x": "エースがいなくても、勝ち進んでいくのね。"}, {"t": 164.91666666666666, "x": "決勝の相手は福岡の久留米商。"}, {"t": 167.05, "x": "0対0のまま、7回裏。2アウト満塁。"}, {"t": 170.06666666666666, "x": "主将の中野が三遊間を抜いて、\n三塁にいた鈴木がかえった。"}, {"t": 173.93333333333334, "x": "9回には、捕手の田中が二塁へ\n走った走者を刺している。"}, {"t": 177.55, "x": "そのまま1対0。加藤は決勝でも完封だ。"}, {"t": 180.66666666666666, "x": "春も夏も決勝は1対0なのね。"}, {"t": 183.13333333333333, "x": "これが、史上初めての春夏連覇だ。"}, {"t": 185.7, "x": "春は八木沢、夏は加藤。"}, {"t": 187.4, "x": "2人のエースで取った連覇だった。"}, {"t": 190.11666666666667, "x": "夏に投げた加藤は、そのあとプロの中日に入った。"}, {"t": 193.41666666666666, "x": "だが1965年の冬、交通事故で亡くなっている。"}, {"t": 197.25, "x": "連覇から、たった3年後なのね。"}, {"t": 199.56666666666666, "x": "作新学院の名前が、次に大きく\n出るのは1973年の春だ。"}, {"t": 204.33333333333334, "x": "江川卓がいて、センバツの4強まで進んだ。"}, {"t": 207.56666666666666, "x": "江川の話はまた別の回でくわしくやる。"}, {"t": 210.15, "x": "そして2016年の夏。"}, {"t": 211.9, "x": "8月21日の決勝。"}, {"t": 213.91666666666666, "x": "相手は南北海道の北海。"}, {"t": 215.75, "x": "作新学院が7対1で勝つ。"}, {"t": 218.0, "x": "1962年以来、54年ぶりの夏の優勝だった。"}, {"t": 222.03333333333333, "x": "54年！　連覇の年から、夏は\nずっと勝てていなかったのね。"}, {"t": 226.01666666666668, "x": "エースの今井達也は、\n決勝までの5試合のうち4試合を完投した。"}, {"t": 230.21666666666667, "x": "投げた球は合わせて616球だ。"}, {"t": 232.65, "x": "率いたのは小針監督。"}, {"t": 234.3, "x": "作新学院は連覇から半世紀以上たって、\nもう一度夏を取った学校だ。"}, {"t": 239.5, "x": "2校目は4年後の1966年。愛知の中京商だ。"}, {"t": 243.43333333333334, "x": "春の決勝は4月3日。"}, {"t": 245.05, "x": "高知の土佐に1対0。"}, {"t": 246.71666666666667, "x": "夏の決勝は8月24日。"}, {"t": 248.76666666666668, "x": "愛媛の松山商に3対1。"}, {"t": 250.98333333333332, "x": "また1対0が出てきたわね。"}, {"t": 252.98333333333332, "x": "エースは加藤英夫。のちに近鉄に入る投手だ。"}, {"t": 256.25, "x": "監督の杉浦は、1959年の春に中京商が\n優勝したときの二塁手だった。"}, {"t": 261.8666666666667, "x": "大学を出て母校の監督になり、連覇の年は25歳。"}, {"t": 265.6, "x": "25歳で春夏連覇？　選手と\nあまり年が変わらないじゃない。"}, {"t": 269.48333333333335, "x": "ああ。これで史上2校目の春夏連覇だ。"}, {"t": 272.65, "x": "中京商は1923年に開校した学校だ。"}, {"t": 276.1333333333333, "x": "連覇の次の年、1967年に名前が中京高校に変わる。"}, {"t": 280.71666666666664, "x": "1995年にはいまの中京大中京になった。"}, {"t": 284.35, "x": "名前が2回変わっているのね。"}, {"t": 286.28333333333336, "x": "名前は変わっても強さは続いた。"}, {"t": 288.3666666666667, "x": "2009年の夏。決勝の相手は新潟の日本文理だ。"}, {"t": 291.95, "x": "8回が終わって10対4。"}, {"t": 293.6, "x": "ところが9回、エースの堂林翔太が\n打たれて、10対9の1点差まで迫られた。"}, {"t": 298.9166666666667, "x": "最後は何とか逃げ切った。"}, {"t": 300.73333333333335, "x": "6点差が、ひっくり返りそうになったのね。"}, {"t": 303.55, "x": "これで夏の優勝は7回目。"}, {"t": 305.31666666666666, "x": "夏の優勝の回数は歴代でいちばん多い。"}, {"t": 307.96666666666664, "x": "甲子園の勝ち星も多い。"}, {"t": 309.53333333333336, "x": "2022年8月の時点で、春と夏をあわせて136勝。"}, {"t": 313.8, "x": "全国でいちばんだ。"}, {"t": 315.2, "x": "2026年の春には、センバツの勝ち星でも\n単独の1位になった。"}, {"t": 319.6333333333333, "x": "この春は準決勝まで進んで、\n智弁学園に1対2で敗れている。"}, {"t": 323.75, "x": "ただその夏は愛知大会の5回戦で、\n享栄に1対4で負けた。"}, {"t": 327.93333333333334, "x": "それでも60年たってもずっと上のほうにいるのね。"}, {"t": 331.0, "x": "7校の中で、いちばん「昔のまま強い」と\n言えるのはここかもしれない。"}, {"t": 336.05, "x": "3校目は1979年。和歌山の箕島だ。"}, {"t": 339.6166666666667, "x": "箕島は公立の学校。7校の中で、公立はここだけだ。"}, {"t": 343.71666666666664, "x": "公立で春夏連覇なの？"}, {"t": 345.5833333333333, "x": "ああ。雑誌のNumberは\n「史上唯一の春夏連覇の公立高」と書いている。"}, {"t": 350.21666666666664, "x": "監督は尾藤公。エースは石井毅、捕手は嶋田宗彦。"}, {"t": 354.78333333333336, "x": "春の決勝の相手は大阪の浪商。"}, {"t": 357.1, "x": "浪商のエースは、のちにプロで活躍する牛島和彦だ。"}, {"t": 361.0, "x": "試合は8対7の打ち合い。"}, {"t": 362.56666666666666, "x": "箕島が1点差で勝った。"}, {"t": 364.4, "x": "夏は3回戦で、石川の星稜と当たる。"}, {"t": 367.2, "x": "延長に入って星稜が2度、勝ち越した。"}, {"t": 369.81666666666666, "x": "箕島はそのたびに、2アウト走者なしから\n本塁打で追いついた。"}, {"t": 373.76666666666665, "x": "あとアウト1つから、2回も？"}, {"t": 375.8833333333333, "x": "ああ。最後は延長18回、サヨナラで4対3。"}, {"t": 379.05, "x": "この試合は星稜の回でもくわしく話している。"}, {"t": 381.8333333333333, "x": "準々決勝は城西に4対1。"}, {"t": 383.8666666666667, "x": "準決勝は横浜商に3対2。"}, {"t": 386.15, "x": "決勝は徳島の池田。8回裏に逆転して、4対3。"}, {"t": 390.21666666666664, "x": "1点差の試合ばかりね。"}, {"t": 391.9166666666667, "x": "夏の最後の4試合のうち、3試合が1点差だ。"}, {"t": 395.06666666666666, "x": "これで史上3校目の春夏連覇になった。"}, {"t": 398.3333333333333, "x": "尾藤は春夏連覇を含めて、甲子園で4回優勝した。"}, {"t": 401.96666666666664, "x": "甲子園での成績は35勝10敗。"}, {"t": 404.3, "x": "最後に指揮をとったのは1991年のセンバツだ。"}, {"t": 407.96666666666664, "x": "2011年3月、68歳で亡くなった。"}, {"t": 411.23333333333335, "x": "2013年4月、長男の尾藤強が箕島の監督になる。"}, {"t": 415.6333333333333, "x": "その夏、箕島は29年ぶりに夏の甲子園へ戻ってきた。"}, {"t": 419.81666666666666, "x": "お父さんの学校を、息子さんが\n甲子園に連れて帰ったのね。"}, {"t": 423.56666666666666, "x": "ただ初戦で山梨の日川に敗れた。"}, {"t": 425.9166666666667, "x": "2016年の夏には、和歌山大会の決勝まで進んでいる。"}, {"t": 429.96666666666664, "x": "それでも2025年の夏の時点で、\n最後の甲子園は2013年のままだ。"}, {"t": 435.0833333333333, "x": "連覇した公立校が、いまは\n甲子園から遠ざかっているのね。"}, {"t": 438.8666666666667, "x": "和歌山からは、私立の智弁和歌山が\n何度も日本一になっている。"}, {"t": 442.96666666666664, "x": "2026年の夏に優勝したのも、智弁和歌山だった。"}, {"t": 447.4, "x": "4校目は1987年。"}, {"t": 449.53333333333336, "x": "大阪のPL学園だ。"}, {"t": 451.21666666666664, "x": "少し前まで、桑田真澄と清原和博がいた学校だな。"}, {"t": 455.45, "x": "ただその2人がいた時代には、\n春のセンバツでは優勝していない。"}, {"t": 459.4, "x": "あの2人でも春は取れなかったのね。"}, {"t": 461.7, "x": "1987年のチームの主将は立浪和義。"}, {"t": 465.3, "x": "投手は野村弘樹と橋本清。"}, {"t": 468.0833333333333, "x": "春の決勝は東京の関東一に7対1。"}, {"t": 470.8833333333333, "x": "夏の決勝は茨城の常総学院に5対2。"}, {"t": 473.85, "x": "常総学院ってこの番組の1回目の学校よね。"}, {"t": 477.1, "x": "ああ。創立4年の常総学院が、\n決勝で当たった相手がこのPLだ。"}, {"t": 481.5, "x": "作新学院、中京商、箕島に続く、\n史上4校目の春夏連覇だった。"}, {"t": 486.55, "x": "監督の中村順司はPLを18年率いた。"}, {"t": 489.9166666666667, "x": "甲子園は16回出て、58勝10敗。優勝は6回。"}, {"t": 493.8666666666667, "x": "58勝10敗って、ほとんど負けていないじゃない。"}, {"t": 497.06666666666666, "x": "そして1998年の春を最後に、監督を退いた。"}, {"t": 501.78333333333336, "x": "では、そのPL学園の野球部は、\nいまどうなっているか。"}, {"t": 505.23333333333335, "x": "2015年から、野球部は新しい\n部員の募集をやめていた。"}, {"t": 508.96666666666664, "x": "最後に残ったのは3年生の12人。"}, {"t": 511.4, "x": "2016年7月15日。"}, {"t": 513.4, "x": "夏の大阪大会の初戦。"}, {"t": 515.0833333333334, "x": "相手は東大阪大柏原だ。"}, {"t": 517.2666666666667, "x": "その前の日、練習で骨折と脱臼が出て、2人が抜けた。"}, {"t": 521.1833333333333, "x": "ちゃんと戦えるのは9人だけ、と報じられている。"}, {"t": 524.3166666666667, "x": "ぎりぎりの人数ね。"}, {"t": 525.7333333333333, "x": "試合は1点差で敗れた。"}, {"t": 527.3666666666667, "x": "60年以上の歴史を持つPL学園の野球部に\nとって、これが最後の試合になった。"}, {"t": 532.5, "x": "この夏を最後に、野球部は休部になった。"}, {"t": 535.3333333333334, "x": "春夏連覇した学校の野球部が、止まっちゃったの？"}, {"t": 538.6833333333333, "x": "ああ。2025年の記事でも、\n休部の状態が続いていると書かれている。"}, {"t": 543.1166666666667, "x": "7校の中で、いちばん大きく変わったのがここだ。"}, {"t": 546.2, "x": "そして次の連覇の話にもこのPLが出てくる。"}, {"t": 549.85, "x": "5校目は1998年。神奈川の横浜だ。"}, {"t": 553.3333333333334, "x": "エースは松坂大輔。監督は渡辺元智。"}, {"t": 556.9333333333333, "x": "春のセンバツは、決勝で\n大阪の関大一を破って優勝した。"}, {"t": 560.8166666666667, "x": "このチームは、公式戦で一度も\n負けずに44連勝している。"}, {"t": 564.85, "x": "一度も負けていないの？"}, {"t": 566.3833333333333, "x": "ああ。そして夏の準々決勝。8月20日。"}, {"t": 569.5833333333334, "x": "相手はさっきのPL学園だ。"}, {"t": 571.4666666666667, "x": "PLが2回に3点を先に取り、7回までリードする。"}, {"t": 574.9333333333333, "x": "横浜が8回に追いついて、延長に入った。"}, {"t": 577.8666666666667, "x": "17回。横浜の7番打者が2点本塁打。"}, {"t": 580.9333333333333, "x": "9対7で横浜が勝った。"}, {"t": 582.8833333333333, "x": "松坂はひとりで投げきった。250球だ。"}, {"t": 586.05, "x": "250球！"}, {"t": 587.3, "x": "前の連覇校のPLを倒して、次の連覇に進んだわけだ。"}, {"t": 591.6333333333333, "x": "準決勝の相手は高知の明徳義塾。"}, {"t": 594.1333333333333, "x": "横浜は、いちばん大きいときで6点の差をつけられた。"}, {"t": 597.4833333333333, "x": "それをひっくり返して、サヨナラで勝つ。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
