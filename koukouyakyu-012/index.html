<script>
const D={"name": "法政二", "file": "012_編集用", "dur": 959.71665625, "segs": [], "subs": [{"t": 0.0, "x": "1961年の夏。兵庫県の甲子園球場。"}, {"t": 3.65, "x": "全国高校野球選手権の準決勝で\n神奈川の法政二と大阪の浪商がぶつかった。"}, {"t": 9.033333333333333, "x": "法政二は1回と4回に1点ずつを取った。"}, {"t": 11.833333333333334, "x": "浪商は8回を終えてもまだ0点だった。"}, {"t": 14.466666666666667, "x": "じゃあ法政二の勝ちが見えてたのね。"}, {"t": 16.633333333333333, "x": "ところが9回だ。浪商は2アウト満塁まで攻め込んだ。"}, {"t": 20.133333333333333, "x": "打席に立ったのは浪商のエースの尾崎行雄だった。"}, {"t": 23.233333333333334, "x": "尾崎のタイムリーで試合は2対2の同点になった。"}, {"t": 26.233333333333334, "x": "ピッチャーが自分で追いついたの？"}, {"t": 28.133333333333333, "x": "そうだ。そして延長11回、浪商が2点を奪った。"}, {"t": 31.666666666666668, "x": "法政二は2対4で敗れた。"}, {"t": 33.666666666666664, "x": "惜しかったのね。"}, {"t": 34.85, "x": "実はこの2校がぶつかるのは3大会続けて3度目だった。"}, {"t": 38.53333333333333, "x": "1度目と2度目はどちらも法政二が勝っている。"}, {"t": 41.28333333333333, "x": "そして勝った法政二は2度とも\nその大会で優勝していた。"}, {"t": 44.9, "x": "え、優勝を2回続けてたってこと？"}, {"t": 47.333333333333336, "x": "ああ。前の年の夏と、この年の春だ。"}, {"t": 50.06666666666667, "x": "夏・春・夏と3大会続けての優勝まで、\nあと2勝だった。"}, {"t": 54.5, "x": "そこで、ずっと勝ってきた相手に止められたのね。"}, {"t": 57.983333333333334, "x": "法政二はどうやって全国の頂点まで駆け上がったの？"}, {"t": 61.25, "x": "今回は法政二高校の野球部を\n日付と数字をもとに辿っていく。"}, {"t": 65.21666666666667, "x": "学校の始まりから、夏春連覇の黄金時代、\nそして今の法政二までだ。"}, {"t": 69.98333333333333, "x": "気に入ってもらえたら、チャンネル登録と\n高評価をお願いします。"}, {"t": 73.76666666666667, "x": "お願いします！"}, {"t": 75.43333333333334, "x": "法政二の正式な名前は法政大学第二高等学校だ。"}, {"t": 79.15, "x": "場所は神奈川県川崎市中原区の木月大町にある。"}, {"t": 82.75, "x": "法政って、東京の法政大学のこと？"}, {"t": 85.58333333333333, "x": "そうだ。法政大学につながる付属の学校だな。"}, {"t": 88.78333333333333, "x": "始まりは1939年4月。"}, {"t": 91.21666666666667, "x": "法政大学第二中学校として設立された。"}, {"t": 94.5, "x": "最初は中学校だったのね。"}, {"t": 96.46666666666667, "x": "戦前の中学校だから今の中学とは仕組みが違う。"}, {"t": 99.81666666666666, "x": "戦後の学制改革で、1948年4月に\n第二高等学校の設置が認められた。"}, {"t": 105.75, "x": "ここから法政大学第二高等学校の歩みが始まる。"}, {"t": 109.33333333333333, "x": "野球部はいつごろから強くなったの？"}, {"t": 111.61666666666666, "x": "甲子園に初めて出たのは1950年代の前半だ。"}, {"t": 115.23333333333333, "x": "そして1950年代の後半に\n全国の強豪へと一気に育っていく。"}, {"t": 119.96666666666667, "x": "何かきっかけがあったの？"}, {"t": 121.66666666666667, "x": "1人の監督の存在が大きい。名前は田丸仁だ。"}, {"t": 125.73333333333333, "x": "田丸が作った野球は「田丸野球」と呼ばれた。"}, {"t": 128.78333333333333, "x": "神奈川新聞はその特徴をヒットエンドランに\n代表される野球と書いた。"}, {"t": 133.08333333333334, "x": "ヒットエンドランって、走者が\n走って打者が打つ作戦よね。"}, {"t": 136.78333333333333, "x": "そうだ。走者が先にスタートを切り、\n打者は必ずバットに当てる。"}, {"t": 140.75, "x": "足と打撃を組み合わせて相手の守りを崩していく。"}, {"t": 143.76666666666668, "x": "スピードとパワーを合わせた\n近代野球、と評する人もいる。"}, {"t": 147.33333333333334, "x": "練習も厳しかったの？"}, {"t": 149.0, "x": "当時の部員の回想が\nアメリカ野球学会の伝記に残っている。"}, {"t": 152.7, "x": "入部したころ、野球部には200人ほどの部員がいた。"}, {"t": 155.98333333333332, "x": "練習の最後は全力の走り込みと、グラウンド10周だ。"}, {"t": 159.51666666666668, "x": "そのあとにグラウンドの整備までやった。"}, {"t": 161.83333333333334, "x": "200人もいたら、試合に出るのも大変ね。"}, {"t": 164.73333333333332, "x": "3年生になるころには残っていたのは\n30人ほどだったという。"}, {"t": 168.6, "x": "その野球で、どこまで勝ったの？"}, {"t": 170.73333333333332, "x": "まず1957年の夏だ。"}, {"t": 172.86666666666667, "x": "法政二は甲子園の決勝まで勝ち進んだ。"}, {"t": 175.65, "x": "決勝の相手は広島商。ここで\n敗れて、準優勝に終わった。"}, {"t": 179.61666666666667, "x": "広島商にとっては戦後初めての優勝だった。"}, {"t": 182.61666666666667, "x": "戦争が終わって12年目の夏に、\n被爆地の学校が頂点に立った大会だ。"}, {"t": 187.48333333333332, "x": "決勝まで行ったのね。"}, {"t": 188.98333333333332, "x": "ここから法政二の夏が続く。"}, {"t": 191.01666666666668, "x": "1957年から1961年まで\n夏の神奈川大会を5年続けて制した。"}, {"t": 196.96666666666667, "x": "5年連続で神奈川の代表？"}, {"t": 199.05, "x": "ああ。5連覇を果たした\n1961年の主将は、外野の的場だった。"}, {"t": 203.8, "x": "そして1958年と1959年も夏の甲子園に出た。"}, {"t": 208.55, "x": "でも、まだ日本一にはなってないのね。"}, {"t": 211.15, "x": "その日本一の年に向けて1人の投手が入ってくる。"}, {"t": 214.53333333333333, "x": "のちに巨人で活躍する、柴田勲だ。"}, {"t": 217.83333333333334, "x": "1960年の夏。第42回の全国高校野球選手権大会だ。"}, {"t": 222.95, "x": "神奈川大会の決勝では、慶応を\n破って甲子園の切符をつかんだ。"}, {"t": 227.1, "x": "法政二のエースは2年生の柴田だった。"}, {"t": 229.61666666666667, "x": "柴田は速い球で押す投手として名を上げていた。"}, {"t": 232.48333333333332, "x": "2年生ながら球の威力も\n制球力も抜けていたと評されている。"}, {"t": 236.46666666666667, "x": "のちのイメージだと、足の速い外野手よね。"}, {"t": 239.26666666666668, "x": "そうだ。でも高校の時は投手が本職だった。"}, {"t": 242.28333333333333, "x": "初戦の相手は御所工だ。"}, {"t": 243.75, "x": "法政二は14対3で大勝した。"}, {"t": 246.26666666666668, "x": "いきなり14点も取ったの？"}, {"t": 248.18333333333334, "x": "ああ。終盤は3年生の加地に\nマウンドを譲る余裕もあった。"}, {"t": 251.7, "x": "そして2回戦で大阪の浪商と当たった。"}, {"t": 254.38333333333333, "x": "浪商のエースはまだ1年生の尾崎行雄だった。"}, {"t": 257.45, "x": "冒頭の尾崎ね。このときは1年生だったんだ。"}, {"t": 260.56666666666666, "x": "尾崎は剛速球の1年生としてすでに話題になっていた。"}, {"t": 264.0833333333333, "x": "1年生のときの練習試合では、\n16人続けて三振を奪ったという話も残る。"}, {"t": 269.46666666666664, "x": "16人連続って、ほとんど誰も打てないじゃない。"}, {"t": 272.6333333333333, "x": "試合は7回まで両チームとも0点が続いた。"}, {"t": 275.48333333333335, "x": "8回に法政二が集中打で4点を奪った。"}, {"t": 278.3333333333333, "x": "柴田は浪商を3安打に抑えて4対0で完封した。"}, {"t": 281.8666666666667, "x": "1年生の尾崎との、最初の対決は法政二の勝ちね。"}, {"t": 285.65, "x": "準々決勝の相手は東京の早稲田実だ。"}, {"t": 288.35, "x": "法政二は1回に、ダブルスチールで2点を先に取った。"}, {"t": 291.8833333333333, "x": "2人の走者が同時に走る作戦ね。"}, {"t": 294.43333333333334, "x": "そうだ。相手の反応が鈍いすきを突いた。"}, {"t": 297.03333333333336, "x": "5回に1点、8回に5点を加えて、8対0で破った。"}, {"t": 300.9166666666667, "x": "準決勝は佐賀の鹿島だ。"}, {"t": 302.7, "x": "先発は加地で、柴田がリリーフに回った。"}, {"t": 305.43333333333334, "x": "2人で相手を3安打に封じて、6対0で勝った。"}, {"t": 308.71666666666664, "x": "決勝は静岡県の静岡高校。"}, {"t": 310.78333333333336, "x": "相手のエースは石田だ。"}, {"t": 312.28333333333336, "x": "試合は中盤まで0対0で進んだ。"}, {"t": 314.6666666666667, "x": "法政二は5回に1点を先に取り、6回に2点を加えた。"}, {"t": 318.4, "x": "柴田は外角に切れのいい速球を\n決め、相手に三塁を踏ませなかった。"}, {"t": 322.65, "x": "3対0。法政二の完封勝ちだ。"}, {"t": 325.2, "x": "決勝まで、ずっと0点に抑えてるじゃない。"}, {"t": 327.93333333333334, "x": "そうだ。2回戦から決勝まで、4試合続けて完封だ。"}, {"t": 331.68333333333334, "x": "5試合で取った点は35点。"}, {"t": 333.53333333333336, "x": "取られた点はわずか3点だった。"}, {"t": 335.73333333333335, "x": "初戦の3点しか取られてないのね。"}, {"t": 338.05, "x": "これが法政二の甲子園での初優勝だ。"}, {"t": 340.5833333333333, "x": "神奈川県勢の夏の優勝は1949年の湘南以来だった。"}, {"t": 345.0, "x": "学校の沿革にも1960年8月の初優勝は\nはっきり刻まれている。"}, {"t": 350.0833333333333, "x": "メンバーも強かったんでしょ？"}, {"t": 351.8333333333333, "x": "のちにプロへ進んだ選手が何人もいた。"}, {"t": 354.3333333333333, "x": "主将の幡野は阪神へ。"}, {"t": 355.8333333333333, "x": "二塁の高井は近鉄へ進んだ。"}, {"t": 357.95, "x": "三塁の是久は東映へ。"}, {"t": 359.5, "x": "外野の的場は大洋へ入った。"}, {"t": 361.51666666666665, "x": "そしてエースの柴田は巨人へ行く。"}, {"t": 363.55, "x": "遊撃の幕田は社会人野球で活躍した。"}, {"t": 366.53333333333336, "x": "1つのチームから、そんなにプロに行ったのね。"}, {"t": 369.43333333333334, "x": "捕手の奈良はのちに日大藤沢の監督になった。"}, {"t": 372.56666666666666, "x": "控えだった五明は、\n法政大学の監督として江川卓らを育てた。"}, {"t": 377.1, "x": "プロにも指導者にも、人が育ってるのね。"}, {"t": 379.9166666666667, "x": "しかも、このチームは主将の幡野と\n捕手の奈良を除いて、全員が2年生だった。"}, {"t": 384.95, "x": "え、ほとんど2年生で日本一？"}, {"t": 387.21666666666664, "x": "そうだ。だから次の年も、ほぼ同じ顔ぶれで戦える。"}, {"t": 390.75, "x": "このチームを、高校野球の「史上最強」と\n呼ぶ声もある。"}, {"t": 395.01666666666665, "x": "次の春はセンバツにも出たのね。"}, {"t": 397.1666666666667, "x": "ああ。1961年の第33回選抜高校野球大会だ。"}, {"t": 401.8333333333333, "x": "法政二にとってはこれがセンバツの初出場だった。"}, {"t": 405.1, "x": "夏の王者が、初めての春に来たわけね。"}, {"t": 407.9166666666667, "x": "準々決勝でまた浪商と当たった。"}, {"t": 410.3666666666667, "x": "尾崎と2度目の対決ね！"}, {"t": 412.2, "x": "先に点を取ったのは浪商だ。"}, {"t": 414.03333333333336, "x": "2回に1点を先制した。"}, {"t": 415.85, "x": "法政二は5回に逆転した。"}, {"t": 417.78333333333336, "x": "そのまま3対1で法政二が再戦を制した。"}, {"t": 420.7, "x": "尾崎はこの試合で11個の三振を奪っている。"}, {"t": 423.6333333333333, "x": "11個も三振を取って負けたの？"}, {"t": 425.8833333333333, "x": "そうだ。それでも点を取り切ったのが法政二だった。"}, {"t": 428.96666666666664, "x": "このセンバツではある控えの投手が\nマウンドに上がっていた。"}, {"t": 432.15, "x": "名前は村上雅則。柴田より1学年下の投手だ。"}, {"t": 435.9, "x": "控えの投手まで覚えておくってことは、何かあるのね。"}, {"t": 439.3, "x": "その話はあとでする。まずは決勝だ。"}, {"t": 441.78333333333336, "x": "法政二は準決勝も勝ち、決勝で\n香川の高松商を完封で破った。"}, {"t": 446.28333333333336, "x": "センバツ初出場で、初優勝だ。"}, {"t": 448.85, "x": "夏に続いて、春も日本一ってこと？"}, {"t": 451.6166666666667, "x": "そうだ。前の年の夏に続く、夏春連覇だ。"}, {"t": 454.85, "x": "しかも神奈川県勢がセンバツで\n優勝したのはこれが初めてだった。"}, {"t": 458.93333333333334, "x": "神奈川って強い学校が多いのに、意外ね。"}, {"t": 461.78333333333336, "x": "夏春連覇を果たした学校は、\n2024年の時点で4校しかない。"}, {"t": 466.2, "x": "戦前の広島商と中京商。"}, {"t": 468.15, "x": "1982年夏と1983年春の池田。"}, {"t": 472.3, "x": "そして1960年夏と1961年春の法政二だ。"}, {"t": 476.96666666666664, "x": "戦後だと、池田と法政二だけなのね。"}, {"t": 479.6666666666667, "x": "そして2度目の対決も、尾崎に\n勝った法政二が大会を制した。"}, {"t": 483.8666666666667, "x": "次の夏も勝てば、3大会続けての優勝ね。"}, {"t": 487.68333333333334, "x": "そして1961年の夏が来る。"}, {"t": 490.4, "x": "法政二は神奈川大会を勝ち抜き\n5年連続で甲子園に出た。"}, {"t": 494.31666666666666, "x": "夏・春・夏の3連覇がかかってたのよね。"}, {"t": 497.48333333333335, "x": "ああ。前の夏の2年生たちが3年生になり、\nチームはさらに力をつけていた。"}, {"t": 502.43333333333334, "x": "一番強い時期に、最後の夏を迎えたのね。"}, {"t": 505.48333333333335, "x": "ああ。法政二は勝ち進んで、準決勝まで進んだ。"}, {"t": 508.85, "x": "そこに待っていたのが3度目の浪商だった。"}, {"t": 511.5833333333333, "x": "冒頭の試合ね。"}, {"t": 512.8666666666667, "x": "そうだ。法政二が2対0で迎えた\n9回、尾崎の同点打が出た。"}, {"t": 517.1, "x": "延長11回には、尾崎の犠牲フライなどで\n浪商が2点を挙げた。"}, {"t": 521.2, "x": "柴田は延長11回の末に、2対4で尾崎に屈した。"}, {"t": 524.95, "x": "2年がかりで、尾崎がやっと勝ったのね。"}, {"t": 527.5833333333334, "x": "浪商は決勝で和歌山の桐蔭を\n完封しこの夏に優勝した。"}, {"t": 531.5333333333333, "x": "じゃあ、3回とも勝ったほうが優勝してるの？"}, {"t": 534.3666666666667, "x": "その通りだ。1960年夏は\n法政二、1961年春も法政二。"}, {"t": 539.95, "x": "そして1961年夏は浪商だ。"}, {"t": 542.85, "x": "直接対決に勝ったチームが、その大会を制した。"}, {"t": 546.2666666666667, "x": "Number Webはこれを歴史に残る\nハイレベルな戦いと書いている。"}, {"t": 549.9, "x": "好敵手がいたから、どっちも強くなれたのかもね。"}, {"t": 553.6666666666666, "x": "柴田と尾崎はそのあとどうなったの？"}, {"t": 555.9333333333333, "x": "まず尾崎だ。尾崎は高校を中退して、\n17歳でプロ野球の東映に入った。"}, {"t": 560.9, "x": "のちに、球が速すぎて途中から\n消えると言われた投手だ。"}, {"t": 564.5, "x": "17歳でプロって、すごいわね。"}, {"t": 566.8, "x": "柴田は法政二から1962年に投手として巨人に入った。"}, {"t": 571.2833333333333, "x": "やっぱり最初は投手だったのね。"}, {"t": 573.3833333333333, "x": "ところがその年のオフから本格的に野手へ移った。"}, {"t": 576.5833333333334, "x": "足の速さを生かすため、左右どちらでも\n打つスイッチヒッターにも挑んだ。"}, {"t": 580.8666666666667, "x": "投手から、打って走る選手に変わったの？"}, {"t": 583.6333333333333, "x": "そうだ。巨人のV9時代には、1番・中堅を任された。"}, {"t": 587.6333333333333, "x": "赤い手袋が柴田のトレードマークになった。"}, {"t": 590.2333333333333, "x": "通算の盗塁は579個。"}, {"t": 592.3333333333334, "x": "盗塁王に6度輝いている。"}, {"t": 594.3333333333334, "x": "甲子園の優勝投手が、プロでは盗塁王なのね。"}, {"t": 597.4833333333333, "x": "そしてもう1人。センバツで\n投げた、控えの村上雅則だ。"}, {"t": 601.4666666666667, "x": "さっき、あとで話すって言ってた人ね。"}, {"t": 604.0666666666667, "x": "村上は1944年5月6日、山梨県の大月に生まれた。"}, {"t": 608.6666666666666, "x": "村上の力に目をつけ法政二に\n誘ったのは監督の田丸だった。"}, {"t": 612.8, "x": "田丸は奨学金を用意し、それで\n父親も入学を認めたという。"}, {"t": 616.7333333333333, "x": "1960年の夏は、まだスタンドから\nその戦いを見ていた。"}, {"t": 620.9166666666666, "x": "1961年の春には、リリーフで\nマウンドに上がることもあった。"}, {"t": 625.2, "x": "そのあいだ、柴田は外野を守っていたという。"}, {"t": 627.8666666666667, "x": "村上はその後プロ野球の南海に入った。"}, {"t": 630.55, "x": "南海の監督の鶴岡は、\n村上の家を訪ねてこう約束した。"}, {"t": 634.6833333333333, "x": "「南海に入れば、野球の勉強に\nアメリカへ行かせる」。"}, {"t": 637.95, "x": "アメリカに行けるから、入ることにしたの？"}, {"t": 640.5833333333334, "x": "そうだ。村上は映画やテレビを見て、\nアメリカに憧れていた。"}, {"t": 644.3, "x": "1964年、村上は野球留学としてアメリカに渡った。"}, {"t": 648.5333333333333, "x": "最初はジャイアンツの傘下のフレズノという\nチームだった。"}, {"t": 651.5166666666667, "x": "ここで49試合に投げて、\n11勝7敗、防御率1.78を残した。"}, {"t": 656.7166666666667, "x": "留学で、そんなに活躍したの？"}, {"t": 659.1, "x": "ああ。リーグの新人王にも選ばれている。"}, {"t": 661.4833333333333, "x": "ああ。そして1964年9月1日。"}, {"t": 664.5833333333334, "x": "サンフランシスコ・ジャイアンツの投手として、\n大リーグのマウンドに立った。"}, {"t": 668.7833333333333, "x": "場所はニューヨークのシェイ・\nスタジアム。相手はメッツだ。"}, {"t": 671.7166666666667, "x": "メッツが4対0でリードする\n場面で、場内に放送が流れた。"}, {"t": 675.5666666666667, "x": "「ナウ・ピッチング。"}, {"t": 676.5666666666667, "x": "ナンバー10、マサノリ・ムラカミ」。"}, {"t": 678.7166666666667, "x": "村上はこの回を0点に抑えた。"}, {"t": 681.0, "x": "それって、もしかして。"}, {"t": 682.6833333333333, "x": "そうだ。日本人として初めての大リーガーだ。"}, {"t": 685.6833333333333, "x": "法政二の控え投手が、\n日本人初の大リーガーになったのね！"}, {"t": 689.6833333333333, "x": "9月29日には、ヒューストン戦で初勝利も挙げた。"}, {"t": 693.1333333333333, "x": "翌年の1965年は45試合に\n投げて、4勝1敗、8セーブだった。"}, {"t": 698.65, "x": "2年間、ちゃんと大リーグで投げてたのね。"}, {"t": 701.2833333333333, "x": "1965年のシーズンを終えて村上は日本へ戻った。"}, {"t": 705.0, "x": "南海の監督との約束を果たすためだった。"}, {"t": 707.9, "x": "柴田の控えだった投手が、\n海の向こうで先頭を切ったわけだ。"}, {"t": 712.3166666666667, "x": "黄金時代のあとの法政二は、どうなったの？"}, {"t": 715.1333333333333, "x": "1961年夏のあと法政二は\nしばらく甲子園から遠ざかる。"}, {"t": 719.6166666666667, "x": "神奈川は強い学校がどんどん出てくるものね。"}, {"t": 722.45, "x": "それでも1980年代には3度、甲子園に戻ってきた。"}, {"t": 726.5333333333333, "x": "1982年の夏、1984年の春、そして1988年の夏だ。"}, {"t": 732.9166666666666, "x": "記録では、1984年春は2回戦で拓大紅陵に敗れた。"}, {"t": 737.4666666666667, "x": "1988年夏は1回戦で、福岡第一に4対7で敗れている。"}, {"t": 742.5666666666667, "x": "甲子園の出場は春と夏を合わせて11回。"}, {"t": 745.3166666666667, "x": "優勝は春と夏で1回ずつだ。"}, {"t": 747.6, "x": "1988年のあとは？"}, {"t": 749.9, "x": "1988年を最後に甲子園からは遠ざかっている。"}, {"t": 753.7666666666667, "x": "学校のほうは、変わったことはあったの？"}, {"t": 756.2666666666667, "x": "黄金時代のすぐあと、1963年12月に\n新しい校舎の第1期ができた。"}, {"t": 761.75, "x": "1966年1月には、第2期の校舎も完成している。"}, {"t": 766.0, "x": "1986年4月に法政大学第二中学校が新しく置かれた。"}, {"t": 770.8666666666667, "x": "2016年4月には共学化が始まった。"}, {"t": 773.9333333333333, "x": "それまでは男子校だったのね。"}, {"t": 775.9, "x": "そうだ。そして2017年4月、新しい\nグラウンドと新校舎が完成した。"}, {"t": 780.9666666666667, "x": "学校の姿が、大きく変わったのね。"}, {"t": 784.1166666666667, "x": "最近になって法政二の名前が再び聞こえ始めた。"}, {"t": 787.4666666666667, "x": "2025年の夏の神奈川大会だ。"}, {"t": 790.0666666666667, "x": "初戦で金沢総合に4対2、2回戦で\n湘南工大付に3対2で勝った。"}, {"t": 794.8666666666667, "x": "さらにシード校を破って勝ち進んだ。"}, {"t": 797.0833333333334, "x": "強豪の桐蔭学園にも勝ち\n11年ぶりにベスト16へ進んだ。"}, {"t": 801.2, "x": "古豪が目を覚ましてきたのね。"}, {"t": 803.1166666666667, "x": "そして2025年の秋だ。"}, {"t": 804.95, "x": "県大会の準決勝で、立花学園に3対2で勝った。"}, {"t": 808.7166666666667, "x": "これで関東大会への出場が決まった。"}, {"t": 811.0833333333334, "x": "実に33年ぶりのことだ。"}, {"t": 813.25, "x": "選手たちにとっては、ベスト4も初めての舞台だった。"}, {"t": 816.6833333333333, "x": "試合のあと、指揮官は「チャレンジャーとして\n戦いきれた」と笑顔を見せた。"}, {"t": 821.2166666666667, "x": "33年ぶり！ 選手はみんな生まれてないわね。"}, {"t": 824.3166666666667, "x": "県大会は準優勝で終えて、関東大会へ進んだ。"}, {"t": 827.6666666666666, "x": "初戦の相手は埼玉1位の花咲徳栄だった。"}, {"t": 830.7833333333333, "x": "法政二は5回までに、9対0とリードした。"}, {"t": 833.7833333333333, "x": "すごい！ そのまま勝ったの？"}, {"t": 835.6166666666667, "x": "いや、そこから追い上げられて、\n9対10で逆転負けした。"}, {"t": 839.2833333333333, "x": "うわあ、悔しいわね。"}, {"t": 840.7, "x": "それでも古豪の復活を感じさせる戦いだった。"}, {"t": 843.7333333333333, "x": "2026年の夏も秋の準優勝校として\n神奈川大会に挑んだ。"}, {"t": 848.1333333333333, "x": "初戦は7回コールド、7対0で勝って突破している。"}, {"t": 851.6833333333333, "x": "甲子園まで、あと少しのところまで来てるのね。"}, {"t": 855.2166666666667, "x": "結局、法政二はなんであんなに強かったの？"}, {"t": 858.2166666666667, "x": "はっきりした答えはないが\n3つのことが重なったのではないか。"}, {"t": 861.7833333333333, "x": "1つ目は、田丸の野球だ。"}, {"t": 863.7166666666667, "x": "ヒットエンドランで足と打撃を組み合わせる\n野球は、当時は新しかったのだろう。"}, {"t": 868.3166666666667, "x": "作戦で相手を崩してたのね。"}, {"t": 870.4, "x": "早稲田実との試合の1回に決めた\nダブルスチールもその1つだ。"}, {"t": 874.2333333333333, "x": "足を使って相手のすきを突く野球だった。"}, {"t": 876.7833333333333, "x": "2つ目は同じ時期に力のある選手がそろったことだ。"}, {"t": 880.15, "x": "1960年夏のチームから少なくとも5人がプロへ進んだ。"}, {"t": 884.3333333333334, "x": "控えの投手までが、のちに大リーグに立っている。"}, {"t": 887.4, "x": "控えまで強いって、すごいわね。"}, {"t": 889.6333333333333, "x": "しかも1960年夏の優勝メンバーは、\nほとんどが2年生だった。"}, {"t": 894.1666666666666, "x": "同じ顔ぶれで、2年続けて\n全国の頂点を狙えたわけだ。"}, {"t": 898.0333333333333, "x": "だから夏のあとの春も、強いままだったのね。"}, {"t": 901.0333333333333, "x": "3つ目は尾崎という好敵手がいたことだろう。"}, {"t": 903.7333333333333, "x": "3大会続けて、勝ったほうが\n日本一になるほどの相手だった。"}, {"t": 907.7, "x": "その相手と競い合ったことが\nチームを高めたのかもしれない。"}, {"t": 911.1833333333333, "x": "負けた最後の試合も、すごい試合だったものね。"}, {"t": 914.2, "x": "ああ。1957年から1961年までの5年で、\n甲子園の決勝に3度進み、2度優勝した。"}, {"t": 921.5166666666667, "x": "短いけれど、まぶしい5年間だったのね。"}, {"t": 924.8333333333334, "x": "最初の話に戻るけど、どうして\n頂点まで駆け上がれたの？"}, {"t": 928.5833333333334, "x": "ひと言でいえば、尾崎という壁がいたからだと思う。"}, {"t": 931.7, "x": "1度目も2度目も、尾崎に勝った\n大会で法政二は優勝した。"}, {"t": 935.7, "x": "尾崎に勝つことが、そのまま日本一への道だったのね。"}, {"t": 939.35, "x": "3度目に敗れた夏は、3連覇まで\nあと2勝のところだった。"}, {"t": 943.2, "x": "押し上げたのも止めたのも、同じ尾崎だったわけね。"}, {"t": 946.4, "x": "あの延長11回の続きは、まだ誰も書いていない。"}, {"t": 949.55, "x": "33年ぶりに関東へ出たチームが、\nまた甲子園を目指している。"}, {"t": 953.65, "x": "次にあの舞台へ立つ日を、一緒に待ちましょ。"}, {"t": 956.35, "x": "最後まで見てくれて、ありがとう。またね。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
