<title>日大三</title>
<style>

<script>
const D={"name": "日大三", "file": "018_編集用", "dur": 907.0, "segs": [], "subs": [{"t": 0.0, "x": "2001年の春。甲子園のセンバツ大会。"}, {"t": 2.816666666666667, "x": "東京の日大三は、3回戦で\n福岡の東福岡に3対8で敗れた。"}, {"t": 7.733333333333333, "x": "この試合、1人で3つもエラーをした選手がいた。"}, {"t": 10.883333333333333, "x": "それはつらい負け方ね。"}, {"t": 12.516666666666667, "x": "その夜宿舎でミーティングが開かれた。"}, {"t": 14.85, "x": "監督は選手たちに、こう言ったそうだ。"}, {"t": 17.3, "x": "「お前らなら、全国でトップになれる」。"}, {"t": 19.716666666666665, "x": "負けた日の夜に？　怒るんじゃなくて？"}, {"t": 22.083333333333332, "x": "ああ。当時のエースは2023年の取材で、今も\nその本当の意味は分からないと話している。"}, {"t": 27.75, "x": "ところがその5か月後。"}, {"t": 29.266666666666666, "x": "このチームは夏の甲子園で6試合を勝ち抜いた。"}, {"t": 32.11666666666667, "x": "チーム打率は4割2分7厘。"}, {"t": 33.86666666666667, "x": "当時の夏の最高と言われた数字だ。"}, {"t": 36.35, "x": "春に負けたチームが、夏には日本一？"}, {"t": 38.95, "x": "いったい何があったのかしら。"}, {"t": 41.25, "x": "今回は日大三。正式な名前は日本大学第三高校だ。"}, {"t": 45.28333333333333, "x": "ファンからは「三高」とも呼ばれている。"}, {"t": 47.65, "x": "できたのは1929年。"}, {"t": 49.61666666666667, "x": "1976年に、いまの東京都町田市へ移った。"}, {"t": 53.583333333333336, "x": "日本一は何回あるの？"}, {"t": 55.35, "x": "春が1回。夏が2回。合わせて3回だ。"}, {"t": 58.28333333333333, "x": "春の準優勝も3回ある。"}, {"t": 59.93333333333333, "x": "去年の夏も決勝まで進んだ。"}, {"t": 62.21666666666667, "x": "東京の、ずっと強い学校なのね。"}, {"t": 64.68333333333334, "x": "そして今回の主役はもう1人いる。"}, {"t": 66.91666666666667, "x": "夏の2回の日本一を、両方とも\n率いた監督。小倉全由だ。"}, {"t": 71.45, "x": "あの夜、「全国でトップになれる」と言った人ね。"}, {"t": 74.66666666666667, "x": "そうだ。まずは小倉が来る前の三高から見ていこう。"}, {"t": 78.35, "x": "まずは1962年の春だ。"}, {"t": 80.7, "x": "日大三はセンバツの決勝まで勝ち上がった。"}, {"t": 83.45, "x": "相手は栃木の作新学院。ここで敗れて準優勝だった。"}, {"t": 87.21666666666667, "x": "作新学院って強い学校よね。"}, {"t": 89.53333333333333, "x": "ああ。この年の作新学院は、そのまま夏も勝っている。"}, {"t": 93.13333333333334, "x": "史上初めての春夏連覇だった。"}, {"t": 95.48333333333333, "x": "相手が悪かったのね。"}, {"t": 97.0, "x": "9年後の1971年。"}, {"t": 99.1, "x": "日大三はまた春の甲子園に来た。"}, {"t": 101.53333333333333, "x": "鹿児島商、沖縄の普天間、埼玉の深谷商。"}, {"t": 104.81666666666666, "x": "香川の坂出商。そして決勝で大阪の大鉄。"}, {"t": 108.1, "x": "5つ勝って春の初優勝だ。"}, {"t": 110.2, "x": "やっと勝てたのね。"}, {"t": 111.5, "x": "このときエースが全試合を1人で投げた。"}, {"t": 113.95, "x": "しかも普天間戦のほかは全部完封だった。"}, {"t": 116.73333333333333, "x": "5試合で4つも完封？"}, {"t": 118.4, "x": "ああ。この春の優勝は、\nエースの投球で勝ち取ったものだった。"}, {"t": 122.18333333333334, "x": "翌年の1972年春も決勝まで進んだ。"}, {"t": 125.7, "x": "相手は同じ東京の日大桜丘だった。"}, {"t": 128.61666666666667, "x": "日大どうしの決勝ってこと？"}, {"t": 130.65, "x": "そうだ。ここは日大桜丘が\n勝ち、日大三は準優勝だった。"}, {"t": 134.96666666666667, "x": "ただここから先が長い。"}, {"t": 136.55, "x": "日大三が次に全国の頂点に立つのは、30年後になる。"}, {"t": 141.21666666666667, "x": "その間に、小倉さんが出てくるのね。"}, {"t": 143.65, "x": "ああ。小倉全由は1957年生まれ。千葉県の出身だ。"}, {"t": 147.93333333333334, "x": "高校は日大三。野球部では控えの内野手だった。"}, {"t": 151.36666666666667, "x": "レギュラーじゃなかったの？"}, {"t": 152.8, "x": "そうだ。3年の夏は、\n東東京大会の5回戦で負けている。"}, {"t": 157.0, "x": "甲子園には選手としては届かなかった。"}, {"t": 159.51666666666668, "x": "日大に進むと、大学に通いながら母校のコーチをした。"}, {"t": 163.13333333333333, "x": "当時の監督は小枝守。その下で選手を見ていた。"}, {"t": 166.7, "x": "じゃあ、そのまま母校で先生に？"}, {"t": 168.81666666666666, "x": "本人もそのつもりだった。"}, {"t": 170.5, "x": "社会科の先生と、野球部のコーチになる\n予定だったそうだ。"}, {"t": 174.1, "x": "ところが学校の事情で、小枝監督と\n一緒に日大三を離れることになる。"}, {"t": 178.85, "x": "えっ、母校を出ることになったのね。"}, {"t": 181.6, "x": "1981年。小倉は東京の関東一の監督になった。"}, {"t": 186.0, "x": "ずいぶん若い監督ね。"}, {"t": 187.63333333333333, "x": "ああ。初めて甲子園に出たのは1985年。"}, {"t": 190.85, "x": "監督5年目、28歳だった。"}, {"t": 193.26666666666668, "x": "関東一にとっても、春夏を通じて初めての甲子園だ。"}, {"t": 197.06666666666666, "x": "最初から順調だったの？"}, {"t": 198.85, "x": "そうでもない。この年の春の東京大会は、\n決勝で帝京に2対9で敗れた。"}, {"t": 203.76666666666668, "x": "試合のあと、小倉は校長から\n厳しい言葉をかけられたそうだ。"}, {"t": 207.46666666666667, "x": "すると主将の寺島が、こう言い返した。"}, {"t": 210.03333333333333, "x": "「監督が悪いんじゃない。"}, {"t": 211.3, "x": "悪いのは俺たちなんだ」。"}, {"t": 212.98333333333332, "x": "選手が、監督をかばったのね。"}, {"t": 215.23333333333332, "x": "小倉はその場では主将を注意した。でも\n内心はうれしかったと話している。"}, {"t": 219.55, "x": "6月には、宮城の東北と練習試合をして勝った。"}, {"t": 222.91666666666666, "x": "東北の監督だった竹田利秋は、\n試合のあとにこう言ったという。"}, {"t": 226.9, "x": "「このチームは甲子園に出たら、ベスト8に行ける」。"}, {"t": 229.98333333333332, "x": "相手の監督に、そう言われたのね。"}, {"t": 232.33333333333334, "x": "ああ。そしてその夏、本当にベスト8まで進んだ。"}, {"t": 235.91666666666666, "x": "言われたとおりになったのね。"}, {"t": 237.63333333333333, "x": "1987年の春には、センバツの決勝まで行った。"}, {"t": 241.55, "x": "相手はPL学園。この年に春夏連覇をするチームだ。"}, {"t": 245.01666666666668, "x": "ここで敗れて、準優勝だった。"}, {"t": 247.28333333333333, "x": "また春夏連覇のチームに当たったのね。"}, {"t": 249.76666666666668, "x": "ところが翌年の1988年。"}, {"t": 252.3, "x": "小倉は監督を辞めている。"}, {"t": 254.01666666666668, "x": "しばらく野球から離れた時期があった。"}, {"t": 256.43333333333334, "x": "準優勝した次の年に？"}, {"t": 258.3333333333333, "x": "ああ。ただここで終わらなかった。"}, {"t": 260.21666666666664, "x": "1992年の12月、関東一の監督に戻る。"}, {"t": 264.1666666666667, "x": "1994年の夏には、9年ぶりの甲子園に連れて行った。"}, {"t": 269.03333333333336, "x": "そして1997年。小倉は母校の日大三に移る。"}, {"t": 273.01666666666665, "x": "日大三の理事長から、チームを\n立て直してほしいと頼まれたそうだ。"}, {"t": 277.21666666666664, "x": "一度は離れた母校に、監督として戻ったのね。"}, {"t": 280.46666666666664, "x": "ああ。ここから26年、\n日大三の監督を続けることになる。"}, {"t": 284.5833333333333, "x": "小倉は選手の寮に寝泊まりした。"}, {"t": 286.65, "x": "選手と一緒に湯船につかって、話をしたという。"}, {"t": 289.9166666666667, "x": "監督と一緒にお風呂？"}, {"t": 291.53333333333336, "x": "そうだ。選手のほうも、\n「監督を男にする」と言って慕った。"}, {"t": 295.5833333333333, "x": "怖い監督、というより、近い監督なのね。"}, {"t": 298.6333333333333, "x": "のちにある選手はこう話している。"}, {"t": 300.6333333333333, "x": "「父親のような存在。"}, {"t": 301.93333333333334, "x": "グラウンドでは厳しいけれど、寮では優しい」。"}, {"t": 305.21666666666664, "x": "じゃあ、強打の三高はどうやって生まれたの？"}, {"t": 307.8333333333333, "x": "小倉の号令ははっきりしていた。"}, {"t": 309.75, "x": "「打たなきゃ面白くない。"}, {"t": 311.0, "x": "フルスイングで遠くへ飛ばせ」。"}, {"t": 312.8833333333333, "x": "ずいぶん思い切った言葉ね。"}, {"t": 314.71666666666664, "x": "ああ。選手たちは、その言葉の下で\nバットを振り込んだ。"}, {"t": 318.1666666666667, "x": "もう1つ、小倉の口ぐせがある。「泥臭く」だ。"}, {"t": 321.4, "x": "「練習は嘘をつかない」という言葉も好んでいた。"}, {"t": 324.31666666666666, "x": "結果が出なくても腐らずに練習を続ける\n選手を、小倉は好んだそうだ。"}, {"t": 328.8333333333333, "x": "派手に打つための、地味な練習を続けるのね。"}, {"t": 331.8, "x": "2001年のチームは、前の年の夏から約1\nか月半、全寮制の中で猛練習を重ねた。"}, {"t": 337.75, "x": "選手どうしが、お互いを刺激し合ったという。"}, {"t": 341.03333333333336, "x": "では、冒頭の2001年に戻ろう。"}, {"t": 343.3666666666667, "x": "前の年の秋。日大三は東京の大会で優勝した。"}, {"t": 346.93333333333334, "x": "決勝は桜美林に7対6。"}, {"t": 348.68333333333334, "x": "1点差の勝負を取った。"}, {"t": 350.35, "x": "秋の全国大会、明治神宮大会でもベスト4に入った。"}, {"t": 354.3333333333333, "x": "そこまでは順調だったのね。"}, {"t": 356.25, "x": "ああ。ただ近藤によると、\nこの代には危ないところもあった。"}, {"t": 359.75, "x": "大きくリードしていても、バント処理のミスから\n大量点を取られる試合が何度かあったそうだ。"}, {"t": 364.93333333333334, "x": "打って勝つけど、守りに穴があったのね。"}, {"t": 367.53333333333336, "x": "そして春のセンバツ。"}, {"t": 368.8, "x": "2回戦で兵庫の姫路工に6対5で勝つ。"}, {"t": 371.65, "x": "8回に2点を取っての1点差勝ちだった。"}, {"t": 374.1333333333333, "x": "原島と内田が本塁打を打っている。"}, {"t": 376.4166666666667, "x": "でも3回戦で、東福岡に3対8。ここが冒頭の試合だ。"}, {"t": 380.85, "x": "3つのエラーをした選手がいた試合ね。"}, {"t": 383.25, "x": "そうだ。そしてその夜、あの言葉が出た。"}, {"t": 385.96666666666664, "x": "「お前らなら全国でトップになれる」。"}, {"t": 388.1666666666667, "x": "励ましたかったのか、本当にそう思ったのか。"}, {"t": 391.23333333333335, "x": "エースの近藤一樹は、いつか\n本人に聞いてみたいと話している。"}, {"t": 395.03333333333336, "x": "春の東京大会では、決勝で帝京を18対10で破った。"}, {"t": 399.05, "x": "18点？　もう打線がすごいわね。"}, {"t": 401.3333333333333, "x": "ただ続く関東大会は、2回戦で\n神奈川の百合ヶ丘に7対10で敗れた。"}, {"t": 406.0833333333333, "x": "近藤は、優勝するまで本当に強いのか\n分からなかったと振り返っている。"}, {"t": 410.53333333333336, "x": "強いのに、どこか危なっかしいチームだったのね。"}, {"t": 414.01666666666665, "x": "夏の西東京大会。日大三は6試合を勝ち抜いた。"}, {"t": 417.6166666666667, "x": "3回戦から準決勝までの5試合は11対0、\n7対0、10対0、15対0、10対0。"}, {"t": 424.25, "x": "5試合続けて、相手を0点？"}, {"t": 426.3833333333333, "x": "ああ。この5試合、相手に1点も与えていない。"}, {"t": 429.1666666666667, "x": "決勝は東亜学園に9対6。"}, {"t": 431.1, "x": "2年ぶりの夏の甲子園だ。"}, {"t": 432.96666666666664, "x": "甲子園の1回戦は鹿児島の樟南。11対7で勝つ。"}, {"t": 436.7, "x": "4番の原島が本塁打を打った。"}, {"t": 438.78333333333336, "x": "2回戦は埼玉の花咲徳栄。"}, {"t": 441.1, "x": "この試合、エースの近藤は初回に\n打ち込まれて、マウンドを降りた。"}, {"t": 445.0, "x": "エースが初回でつまずいたのね。"}, {"t": 446.95, "x": "ああ。1回と2回で4点を取られた。"}, {"t": 449.31666666666666, "x": "でも2番手の投手が、そのあとを0点に抑えた。"}, {"t": 452.3666666666667, "x": "その間に打線が点を重ねて、11対4の逆転勝ちだ。"}, {"t": 456.31666666666666, "x": "打線が、エースを助けたのね。"}, {"t": 458.46666666666664, "x": "3回戦は山梨の日本航空に7対1。"}, {"t": 461.3333333333333, "x": "この試合では、原島、都築、\n内田の3人が本塁打を打った。"}, {"t": 465.5, "x": "準々決勝は大分の明豊に9対2。この試合は\n千葉が先に投げ、近藤につないだ。"}, {"t": 470.96666666666664, "x": "4試合で、もう38点も取っているわね。"}, {"t": 473.9166666666667, "x": "ああ。そして準決勝の相手が、神奈川の横浜だった。"}, {"t": 478.15, "x": "2001年8月20日。"}, {"t": 479.85, "x": "準決勝、日大三と横浜。"}, {"t": 482.21666666666664, "x": "日大三は1回にいきなり3点を取った。"}, {"t": 484.8666666666667, "x": "4回にも3点。4回を終えて6対1だ。"}, {"t": 487.85, "x": "これはもう決まりじゃない？"}, {"t": 489.3, "x": "そう見えた。でも横浜はしぶとかった。"}, {"t": 491.73333333333335, "x": "5回に1点、7回に2点。"}, {"t": 493.56666666666666, "x": "じわじわと追ってくる。"}, {"t": 494.95, "x": "そして9回表。横浜が2点を取って6対6の同点。"}, {"t": 498.9, "x": "5点差が、なくなっちゃったの？"}, {"t": 500.98333333333335, "x": "ああ。小さなミスと、横浜の粘りで追いつかれた。"}, {"t": 504.1666666666667, "x": "迎えた9回裏。日大三が1点を取る。"}, {"t": 507.0, "x": "7対6。サヨナラ勝ちだ。"}, {"t": 509.06666666666666, "x": "最後は自分たちで取り返したのね。"}, {"t": 511.35, "x": "この試合、日大三は16本のヒットを打っている。"}, {"t": 514.4833333333333, "x": "都築の本塁打も出た。"}, {"t": 516.1666666666666, "x": "16本も打ってそれでも1点差なのね。"}, {"t": 518.75, "x": "ああ。それだけ横浜も強かった。"}, {"t": 520.9666666666667, "x": "投げたのは近藤1人。"}, {"t": 522.3333333333334, "x": "最後まで投げ切った。"}, {"t": 524.3833333333333, "x": "決勝の相手は滋賀の近江だった。"}, {"t": 526.4166666666666, "x": "近江にとっても、滋賀県勢として初めての決勝だ。"}, {"t": 529.75, "x": "日大三は2回に2点を先に取った。"}, {"t": 532.25, "x": "近江は7回に1点を返す。"}, {"t": 534.1333333333333, "x": "でも日大三はその裏に2点、8回に1点を追加した。"}, {"t": 537.8333333333334, "x": "近江は3人の投手を、何度も\n入れかえながら投げさせた。"}, {"t": 541.2166666666667, "x": "投手が代わった回数は、この試合だけで4回だ。"}, {"t": 544.45, "x": "一度降りた投手が、また戻ってきたってこと？"}, {"t": 547.4, "x": "そうだ。それでも日大三は点を重ねていった。"}, {"t": 550.4, "x": "近江は9回に1点を返したが、そこまで。"}, {"t": 553.1666666666666, "x": "5対2。日大三、夏の初優勝だ。"}, {"t": 556.05, "x": "春に負けたあの夜から、5か月で本当に日本一に。"}, {"t": 559.6166666666667, "x": "決勝も近藤が1人で投げ切った。"}, {"t": 561.85, "x": "近藤が入学したとき、同じ学年の部員は\n約20人。その半分が投手だった。"}, {"t": 567.1, "x": "しかも入学してすぐに、肘を痛めている。"}, {"t": 569.8166666666667, "x": "本人は体が柔らかいのが長所で、それが\nけがの原因にもなったと振り返っている。"}, {"t": 574.8833333333333, "x": "最初は目立たなかった投手が、\n優勝投手になったのね。"}, {"t": 578.4833333333333, "x": "6試合で取った点は合わせて50点。"}, {"t": 580.7666666666667, "x": "チーム打率は4割2分7厘。"}, {"t": 582.5333333333333, "x": "当時の夏のチーム記録を塗り替えた数字だ。"}, {"t": 585.3333333333334, "x": "10回打てば、4本以上がヒット。\nそれもチーム全体で、ね。"}, {"t": 589.4166666666666, "x": "そういうことだ。"}, {"t": 590.4333333333333, "x": "そして小倉にとっても、これが\n監督として初めての日本一だった。"}, {"t": 594.65, "x": "関東一の監督になってから、20年がたっていた。"}, {"t": 598.6666666666666, "x": "あのチームはそのあとも試合があったの？"}, {"t": 600.9166666666666, "x": "秋の宮城国体にも出て、ベスト8まで進んだ。"}, {"t": 604.1666666666666, "x": "前の年の秋から数えると、公式戦は28勝4敗だ。"}, {"t": 608.2166666666667, "x": "1年で、4回しか負けなかったのね。"}, {"t": 610.75, "x": "選手たちはそのあとどうなったの？"}, {"t": 612.85, "x": "この年の選手からは、4人がプロ野球に進んだ。"}, {"t": 616.0833333333334, "x": "エースの近藤一樹。内田和也。"}, {"t": 618.15, "x": "投手の千葉英貴。そして都築克幸だ。"}, {"t": 620.9833333333333, "x": "近藤は近鉄に入り、のちに\nオリックス、ヤクルトでも投げた。"}, {"t": 624.9333333333333, "x": "4人もプロに！"}, {"t": 626.0833333333334, "x": "ただ4番の原島はプロに行かなかった。"}, {"t": 628.4666666666667, "x": "小倉が、大学に進むことを強く勧めたそうだ。"}, {"t": 631.8, "x": "打てる選手でも、先のことを考えて勧めたのね。"}, {"t": 635.1333333333333, "x": "ああ。それから日大三は\n「打の三高」と呼ばれるようになった。"}, {"t": 639.6333333333333, "x": "9年後の2010年春。"}, {"t": 641.25, "x": "日大三はまたセンバツの決勝に進んだ。"}, {"t": 644.0166666666667, "x": "打線には横尾俊建、山﨑福也、高山俊がいた。"}, {"t": 647.8333333333334, "x": "準決勝までの4試合で、41点を取っている。"}, {"t": 651.1666666666666, "x": "やっぱり打つのね。"}, {"t": 652.45, "x": "春の大会は、守りの強いチームが\n勝つことが多いと言われる。"}, {"t": 656.1, "x": "春は、いろいろな投手と戦う\n機会が少ない時期だからだ。"}, {"t": 659.7666666666667, "x": "それでも日大三の打線は、\n初球からどんどん振っていった。"}, {"t": 663.3333333333334, "x": "決勝の相手は沖縄の興南。"}, {"t": 665.1333333333333, "x": "エースは島袋という投手だった。"}, {"t": 667.2833333333333, "x": "5対5のまま延長に入った。"}, {"t": 669.1666666666666, "x": "そして延長12回の表。"}, {"t": 670.75, "x": "興南が一気に5点を取った。"}, {"t": 672.65, "x": "5対10。日大三は準優勝だった。"}, {"t": 675.3333333333334, "x": "延長12回まで戦って届かなかったのね。"}, {"t": 678.3333333333334, "x": "小倉にとって、これが3度目の甲子園の決勝だった。"}, {"t": 681.6333333333333, "x": "決勝の朝、小倉は選手と\n散歩しながら、こう声をかけたそうだ。"}, {"t": 685.7166666666667, "x": "「どんな気持ちか、よく覚えておけよ」。"}, {"t": 688.05, "x": "負けた悔しさも、覚えておけってことかしら。"}, {"t": 690.9333333333333, "x": "その答えは次の年の夏に出る。"}, {"t": 693.7166666666667, "x": "2011年の夏。日大三は1回戦から登場した。"}, {"t": 697.5333333333333, "x": "新潟の日本文理に14対3。"}, {"t": 699.55, "x": "島根の開星に11対8。"}, {"t": 701.6333333333333, "x": "智弁和歌山に6対4。"}, {"t": 703.1333333333333, "x": "千葉の習志野に5対0。"}, {"t": 704.85, "x": "岡山の関西に14対4。"}, {"t": 706.9333333333333, "x": "またすごい点数が並ぶわね。"}, {"t": 708.8833333333333, "x": "そして決勝。相手は青森の光星学院だった。"}, {"t": 711.9833333333333, "x": "この年は東日本大震災の年だ。"}, {"t": 714.5, "x": "電気の使い方に気をつけて、決勝は\n史上初めて午前中に始まった。"}, {"t": 719.0333333333333, "x": "プレーボールは午前9時31分。"}, {"t": 720.95, "x": "観衆は4万7千人。"}, {"t": 722.85, "x": "朝の決勝なんて、珍しいわね。"}, {"t": 725.2, "x": "3回、高山俊が3ランホームラン。"}, {"t": 727.5333333333333, "x": "2試合続けての一発だ。"}, {"t": 729.35, "x": "5回は内野ゴロの間に加点。"}, {"t": 731.1166666666667, "x": "7回には鈴木の2ランなどで5点を加えた。"}, {"t": 734.0166666666667, "x": "守っても、高山がライトから\n本塁へ好返球。走者を刺した。"}, {"t": 738.0833333333334, "x": "光星学院は四球で先頭打者を\n3度出したが、あと1本が出なかった。"}, {"t": 742.45, "x": "結果は11対0。10年ぶり、2度目の夏の日本一だ。"}, {"t": 746.5, "x": "大差の決勝ね。"}, {"t": 747.8333333333334, "x": "光星学院にとっては、東北の学校として\n初めての優勝がかかった試合だった。"}, {"t": 752.85, "x": "その夢はこの日は届かなかった。"}, {"t": 754.95, "x": "投げたのはエースの吉永健太朗。\nこれで3日続けてのマウンドだった。"}, {"t": 759.0833333333334, "x": "吉永は全6試合に投げて、5試合を完投している。"}, {"t": 762.4333333333333, "x": "完封は、準々決勝の習志野戦に続いて2度目だった。"}, {"t": 765.9833333333333, "x": "打線は6試合続けてヒット2桁。"}, {"t": 768.45, "x": "6試合で取った点は合わせて61点だ。"}, {"t": 771.2666666666667, "x": "2001年の50点より、さらに多いのね。"}, {"t": 774.1833333333333, "x": "ああ。前の年の春に、延長12回で\n負けた打線の答えだった。"}, {"t": 778.9333333333333, "x": "小倉は、2023年3月で日大三の監督を\n退いた。定年での勇退だ。"}, {"t": 784.3166666666667, "x": "甲子園での勝ち星は、関東一の時代と合わせて37勝。"}, {"t": 788.25, "x": "日本一が2回、準優勝が2回。"}, {"t": 790.7833333333333, "x": "準優勝の2回は関東一の1987年と、\n日大三の2010年ね。"}, {"t": 796.2833333333333, "x": "そうだ。後を継いだのは、長く部長として\n小倉を支えてきた三木監督だった。"}, {"t": 800.9666666666667, "x": "小倉はそのあと、2024年と2025年に\n高校日本代表の監督を務めた。"}, {"t": 806.4166666666666, "x": "そして2025年9月の大会を最後に、\n高校野球の指導の現場を離れている。"}, {"t": 811.6666666666666, "x": "最後まで、高校生と一緒だったのね。"}, {"t": 814.7666666666667, "x": "2025年の夏。三木監督の日大三は、\n20度目の夏の甲子園に来た。"}, {"t": 820.0166666666667, "x": "西東京大会の決勝では、それまで1点も\n取られていなかった東海大菅生から8点を取った。"}, {"t": 825.9666666666667, "x": "やっぱり打って勝つのね。"}, {"t": 827.5666666666667, "x": "準決勝は岐阜の県岐阜商。"}, {"t": 829.3, "x": "延長10回のタイブレークで4対2。"}, {"t": 831.6166666666667, "x": "2011年以来、14年ぶりの決勝だった。"}, {"t": 834.8333333333334, "x": "また決勝まで来たのね！"}, {"t": 836.5333333333333, "x": "8月23日の決勝。相手は沖縄尚学。"}, {"t": 839.85, "x": "結果は1対3。日大三は準優勝だった。"}, {"t": 843.0333333333333, "x": "あと一歩だったのね。"}, {"t": 844.4333333333333, "x": "ただこの試合のあとの場面が話題になった。"}, {"t": 846.9666666666667, "x": "日大三の選手たちが、球場のぐるり\n全体に向けて頭を下げたんだ。"}, {"t": 851.3833333333333, "x": "満員のスタンドから、大きな拍手が起きた。"}, {"t": 854.3166666666667, "x": "負けた直後に、それができるのはすごいわ。"}, {"t": 856.9833333333333, "x": "2001年の主将の杉山は、こう話している。"}, {"t": 860.05, "x": "三木監督と小倉監督の人柄が、そうさせたのだろうと。"}, {"t": 863.7666666666667, "x": "名門なのに、爽やかさがある。\nそれが日大三の歴史だと。"}, {"t": 868.2166666666667, "x": "冒頭の「全国でトップになれる」。"}, {"t": 870.2666666666667, "x": "あれは本当になったのね。"}, {"t": 872.0666666666667, "x": "ああ。春に3対8で負けたチームが、\n夏は4割2分7厘の打線で日本一だ。"}, {"t": 877.2333333333333, "x": "言ったのは、選手としては甲子園に\n届かなかった、控えの内野手だった人だ。"}, {"t": 882.1, "x": "ただ1つだけ答えが出ていないことがある。"}, {"t": 884.5833333333334, "x": "あの夜の言葉は励ましだったのか。\nそれとも本当に何かを見ていたのか。"}, {"t": 889.0166666666667, "x": "近藤は、まだ小倉本人に聞けていないそうだ。"}, {"t": 892.0166666666667, "x": "いつか、2人が答え合わせをする日が来るといいわね。"}, {"t": 895.2166666666667, "x": "そして三高の打線は去年の夏、\nあと1勝のところで止まった。"}, {"t": 899.1666666666666, "x": "3度目の夏の日本一に届くのは、どの代になるのか。"}, {"t": 902.8166666666667, "x": "次の夏の西東京大会から、目が離せないわね。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
