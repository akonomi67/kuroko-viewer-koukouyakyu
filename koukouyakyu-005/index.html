<script>
const D={"name": "延長25回", "file": "005_編集用", "dur": 977.0333125, "segs": [], "subs": [{"t": 0.0, "x": "1933年8月19日。"}, {"t": 2.533333333333333, "x": "兵庫県の甲子園球場。"}, {"t": 4.3, "x": "時刻は午後1時10分。"}, {"t": 5.9, "x": "全国中等学校優勝野球大会の準決勝が始まった。"}, {"t": 9.75, "x": "いまの夏の全国高校野球だ。"}, {"t": 11.866666666666667, "x": "先攻は兵庫の明石中。"}, {"t": 13.35, "x": "後攻は愛知の中京商。"}, {"t": 15.066666666666666, "x": "スタンドの客は2万を超えたと、当時の記事にある。"}, {"t": 18.266666666666666, "x": "準決勝なら、夕方には終わる試合よね。"}, {"t": 21.066666666666666, "x": "ふつうはな。でも、この日はちがった。"}, {"t": 23.416666666666668, "x": "9回が終わっても0対0。"}, {"t": 25.283333333333335, "x": "15回が終わっても0対0。"}, {"t": 27.233333333333334, "x": "20回が終わっても、まだ0対0だった。"}, {"t": 30.116666666666667, "x": "え、20回？"}, {"t": 31.266666666666666, "x": "点が入ったのは25回の裏だ。"}, {"t": 33.43333333333333, "x": "1対0。中京商のサヨナラ勝ち。"}, {"t": 35.86666666666667, "x": "試合の時間は4時間55分。"}, {"t": 37.86666666666667, "x": "回の数も時間も、いまも\n甲子園でいちばん長い記録だ。"}, {"t": 41.4, "x": "日本高野連の大会の歩みにも、この年の出来事として\n「延長25回大熱戦」と書かれている。"}, {"t": 47.766666666666666, "x": "90年以上たっても、まだ破られていないのね。"}, {"t": 50.733333333333334, "x": "25回のあいだ、どっちも点が取れなかったの？"}, {"t": 53.63333333333333, "x": "どうしてそこまで続いたの。\nそして、どうやって終わったの？"}, {"t": 57.166666666666664, "x": "今回は、その一日を当時の記事と記録で辿っていく。"}, {"t": 60.7, "x": "延長の決まりが、そのあと\nどう変わったかも見ていくぞ。"}, {"t": 63.86666666666667, "x": "役に立ったら、チャンネル登録と\n高評価をお願いします。"}, {"t": 67.93333333333334, "x": "まず、この日の中京商がどんなチームだったかだ。"}, {"t": 70.88333333333334, "x": "中京商は、いまの中京大中京高校。"}, {"t": 73.66666666666667, "x": "1931年の夏、中京商は初めて全国で優勝した。"}, {"t": 78.13333333333334, "x": "決勝の相手は台湾の嘉義農林だった。"}, {"t": 80.61666666666666, "x": "嘉義農林は初出場で、決勝まで勝ち上がっていた。"}, {"t": 83.91666666666667, "x": "中京商はその決勝に4対0で勝っている。"}, {"t": 86.85, "x": "台湾の学校も、甲子園に来ていたのね。"}, {"t": 89.63333333333334, "x": "ああ。そして翌年の1932年も、中京商が優勝した。"}, {"t": 94.06666666666666, "x": "このときの決勝の相手は松山商だ。"}, {"t": 96.63333333333334, "x": "2年続けて勝ったのね。"}, {"t": 98.4, "x": "そうだ。1933年は、\n3年続けての優勝がかかった夏だった。"}, {"t": 103.51666666666667, "x": "その3年間、投げていたのは誰なの？"}, {"t": 106.1, "x": "エースの吉田正男だ。"}, {"t": 107.51666666666667, "x": "1914年4月14日、愛知県の生まれ。"}, {"t": 110.81666666666666, "x": "野球殿堂博物館は、3連覇を\n達成した投手として紹介している。"}, {"t": 115.33333333333333, "x": "夏の大会だけで3年間に14勝を挙げた。"}, {"t": 118.28333333333333, "x": "春の大会も合わせると23勝になる。"}, {"t": 120.85, "x": "これは、春夏を通じていまも\n最多の勝ち星だと書かれている。"}, {"t": 124.68333333333334, "x": "23勝って、何年も出ていないと届かない数よね。"}, {"t": 128.25, "x": "吉田は春と夏に、6回続けて甲子園に出ていたんだ。"}, {"t": 131.86666666666667, "x": "1931年の夏には、こんな話も伝えられている。"}, {"t": 135.85, "x": "吉田の父は、そのとき病気で寝ていた。"}, {"t": 138.48333333333332, "x": "吉田は、父のために優勝をめざしていたという。"}, {"t": 141.38333333333333, "x": "父は優勝を伝えるラジオを\n聞き、ほどなく息を引き取った。"}, {"t": 145.05, "x": "優勝の知らせは、ちゃんと届いていたのね。"}, {"t": 147.75, "x": "ああ。そこから3年目の夏が1933年だ。"}, {"t": 151.98333333333332, "x": "相手の明石中はどんな学校だったの？"}, {"t": 154.45, "x": "明石中は、いまの兵庫県立明石高校だ。"}, {"t": 157.33333333333334, "x": "この試合で明石中のマウンドに\n立ったのは、左投げのエースだった。"}, {"t": 161.26666666666668, "x": "当時の記事はその球をこう書いている。"}, {"t": 163.46666666666667, "x": "「浮き気味の直球と、大きく破れるインドロップ」。"}, {"t": 166.45, "x": "インドロップって何？"}, {"t": 167.81666666666666, "x": "当時の記事にある、変化球の呼び名だ。"}, {"t": 170.28333333333333, "x": "記事は「不敵のピッチング」とも書いている。"}, {"t": 173.1, "x": "怖いもの知らずの投げ方、ってことね。"}, {"t": 175.58333333333334, "x": "そうだ。中京商の打線は、この左腕を打てなかった。"}, {"t": 178.91666666666666, "x": "13回を過ぎるまで、\n中京商のヒットはたった1本だった。"}, {"t": 182.81666666666666, "x": "13回で1本？"}, {"t": 184.2, "x": "ああ。そして中京商の吉田も、\n明石中を0点に抑え続けた。"}, {"t": 188.41666666666666, "x": "実は吉田は、前の日の試合でけがをしていた。"}, {"t": 191.33333333333334, "x": "相手は浪華商だ。その試合で\n負傷していたと記事にある。"}, {"t": 194.75, "x": "それでも吉田は、マウンドを降りなかった。"}, {"t": 197.23333333333332, "x": "けがをしたまま、準決勝を投げたのね。"}, {"t": 199.85, "x": "当時の記事は\n「最後までプレートを固守」と書いている。"}, {"t": 203.06666666666666, "x": "この試合では審判も4人いた。"}, {"t": 205.05, "x": "日本高野連の記録では、この大会から\n審判が4人制になっている。"}, {"t": 209.43333333333334, "x": "それまでは4人じゃなかったのね。"}, {"t": 211.45, "x": "ああ。その4人の前で、0が並んでいった。"}, {"t": 214.85, "x": "9回が終わり試合は延長に入った。"}, {"t": 217.13333333333333, "x": "10回、11回、12回。"}, {"t": 219.08333333333334, "x": "どちらも点が取れない。"}, {"t": 220.55, "x": "15回、16回と進んだところで、困ったことが起きた。"}, {"t": 224.46666666666667, "x": "何が起きたの？"}, {"t": 225.65, "x": "スコアボードの欄が足りなくなったんだ。"}, {"t": 227.85, "x": "当時のボードは16回までしか書けなかった。"}, {"t": 230.68333333333334, "x": "16回より先が書けないってこと？"}, {"t": 233.06666666666666, "x": "そうだ。そこで大工が呼ばれた。"}, {"t": 235.08333333333334, "x": "丸木を組んで、17回から先の欄を\n継ぎ足したと伝えられている。"}, {"t": 239.28333333333333, "x": "試合の途中で、ボードを作り足したのね。"}, {"t": 241.91666666666666, "x": "当時の記事は、その場面をこう書いている。"}, {"t": 244.41666666666666, "x": "「16回迄を記録出来るスコアボールドも、\n足りなくなって来た」。"}, {"t": 248.15, "x": "そして「大工が慌ててそれをつぎ足す」。"}, {"t": 250.71666666666667, "x": "試合より先に、ボードの方が足りなくなったのね。"}, {"t": 253.85, "x": "そのころには、スタンドの様子も変わっていた。"}, {"t": 256.5833333333333, "x": "記事は「満場は次第に不気味な\n静寂に沈んで行った」と書いている。"}, {"t": 260.8666666666667, "x": "2万人が静かになっていったのね。"}, {"t": 263.6666666666667, "x": "20回を超えるころ、大会本部が動き始めた。"}, {"t": 266.76666666666665, "x": "この試合を、再試合にするかどうかを考え始めたんだ。"}, {"t": 270.25, "x": "当時は、何回までっていう決まりはなかったの？"}, {"t": 273.1666666666667, "x": "なかった。決着がつくまで続けるのが当時のやり方だ。"}, {"t": 276.73333333333335, "x": "兵庫県教育委員会の資料に、こんな記述がある。"}, {"t": 279.9, "x": "25回が始まる前に、両方のベンチに知らせが届いた。"}, {"t": 283.53333333333336, "x": "「これ以上、新しい回には入らない」という知らせだ。"}, {"t": 286.78333333333336, "x": "つまり25回が最後ってこと？"}, {"t": 288.95, "x": "そうだ。25回でも0対0なら、\nその日はそこで終わりになる。"}, {"t": 293.1, "x": "それなら、引き分けになるかもしれなかったのね。"}, {"t": 296.06666666666666, "x": "25回の前の時点で、明石中の左腕はこう投げていた。"}, {"t": 299.7, "x": "向かった打者は91人。"}, {"t": 301.45, "x": "打たれたヒットは7本。三振は10個。"}, {"t": 304.0, "x": "四死球は8個。投げた球は249球だ。"}, {"t": 307.3833333333333, "x": "249球も投げてまだ0点なの？"}, {"t": 310.1666666666667, "x": "ああ。ここまで1点も取られていない。"}, {"t": 312.3, "x": "中京商の吉田も同じように0を並べていた。"}, {"t": 315.26666666666665, "x": "2人とも24回を投げて0点だったのね。"}, {"t": 318.75, "x": "25回の表。明石中は点が取れなかった。"}, {"t": 321.6666666666667, "x": "25回の裏。中京商の攻撃だ。"}, {"t": 324.25, "x": "先頭の前田が四球で塁に出た。"}, {"t": 326.35, "x": "そこから中京商はチャンスを広げる。"}, {"t": 328.6166666666667, "x": "ノーアウト満塁になった。"}, {"t": 330.26666666666665, "x": "ノーアウトで満塁？"}, {"t": 331.53333333333336, "x": "ああ。次の打者が打った球は、二塁へのゴロだった。"}, {"t": 334.6166666666667, "x": "明石中の二塁手が捕って本塁へ投げる。"}, {"t": 337.1166666666667, "x": "その送球がそれた。"}, {"t": 338.5, "x": "前田がホームに帰った。"}, {"t": 340.1333333333333, "x": "それで1対0？"}, {"t": 341.45, "x": "そうだ。25回の裏、中京商のサヨナラ勝ちだ。"}, {"t": 344.8333333333333, "x": "始まりは午後1時10分。"}, {"t": 346.35, "x": "4時間55分が過ぎていた。"}, {"t": 348.5, "x": "最後の1点は、守りの送球からだったのね。"}, {"t": 351.56666666666666, "x": "ああ。24回半、両方とも0点だった\n試合の、最後の1球だ。"}, {"t": 356.0, "x": "吉田は25回を1人で投げ切った。"}, {"t": 358.23333333333335, "x": "投げた球は336球だ。"}, {"t": 360.56666666666666, "x": "明石中の左腕も最後まで1人で投げた。"}, {"t": 363.1666666666667, "x": "野球殿堂博物館はこう書いている。"}, {"t": 365.5, "x": "明石中の投手と見事な投手戦を\n演じ、ともに延長25回を完投した。"}, {"t": 370.3833333333333, "x": "2人とも最後まで代わらなかったのね。"}, {"t": 372.81666666666666, "x": "当時の記事は、両方の投手をこう褒めている。"}, {"t": 375.5833333333333, "x": "「両軍投手の鉄腕には唯々驚嘆の外なく」。"}, {"t": 378.7, "x": "「その技倆は、まさに神技というべき」。"}, {"t": 381.18333333333334, "x": "勝った方だけじゃなくて、両方を褒めているのね。"}, {"t": 384.15, "x": "ああ。記事はこの試合を\n「世界新記録」とまで書いている。"}, {"t": 387.68333333333334, "x": "アメリカの26回の試合は引き分けだった。"}, {"t": 390.4, "x": "0対0のまま25回まで続いた例は、\nほかに無いという書き方だ。"}, {"t": 395.28333333333336, "x": "この試合のスコアブックはいまも残っている。"}, {"t": 397.73333333333335, "x": "東京ドームにある野球の博物館に、\n展示されているという。"}, {"t": 401.4166666666667, "x": "90年以上前のスコアブックが？"}, {"t": 403.6666666666667, "x": "ああ。ただ、そのスコアブックには空白がある。"}, {"t": 406.45, "x": "試合を決めた1点が書かれていないんだ。"}, {"t": 408.9166666666667, "x": "え、いちばん大事な1点なのに？"}, {"t": 411.05, "x": "つけていたのは大会の公式記録員だった。"}, {"t": 413.81666666666666, "x": "その記録員でさえ、ペンを\n動かすのを忘れたと伝えられている。"}, {"t": 417.56666666666666, "x": "記録する人まで見入ってしまったのね。"}, {"t": 420.0, "x": "兵庫県の資料は、その空白にナインの汗と\n涙の物語がある、と書いている。"}, {"t": 425.53333333333336, "x": "準決勝で25回も投げたら、決勝は無理よね。"}, {"t": 428.8333333333333, "x": "ところが、決勝は次の日だった。"}, {"t": 431.05, "x": "相手は京都の平安中だ。"}, {"t": 432.81666666666666, "x": "吉田は、この決勝でもマウンドに上がった。"}, {"t": 435.55, "x": "336球の次の日に？"}, {"t": 437.8333333333333, "x": "ああ。そして平安中を1点に抑えて優勝した。"}, {"t": 440.93333333333334, "x": "吉田はこの夏の全部の試合に投げていた。"}, {"t": 443.6666666666667, "x": "前の日にけがをして、\n25回投げて、決勝も投げたのね。"}, {"t": 447.56666666666666, "x": "これで中京商は、夏の大会に3年続けて勝った。"}, {"t": 451.1, "x": "日本高野連の記録には「3連勝の偉業」とある。"}, {"t": 454.5, "x": "1931年、1932年、1933年の3回ね。"}, {"t": 460.0, "x": "そうだ。その3回ともエースは吉田だった。"}, {"t": 463.35, "x": "負けた明石中の選手たちは、そのあとどうなったの？"}, {"t": 466.65, "x": "最後の送球をした二塁手のことは、\n兵庫県の資料にくわしい。"}, {"t": 470.45, "x": "兵庫県の小学校の道徳の副読本に、\nその人の話が載っているんだ。"}, {"t": 475.15, "x": "題は「忘れない夏」だ。"}, {"t": 477.1666666666667, "x": "教科書みたいな本に、この試合が出てくるのね。"}, {"t": 480.1666666666667, "x": "ああ。二塁手は当時15歳だった。"}, {"t": 482.4, "x": "身長は160センチを少し超えるくらい。"}, {"t": 485.06666666666666, "x": "小柄だったが、同じ学年の仲間を\nおさえてレギュラーをつかんだ。"}, {"t": 488.8, "x": "もちろんチームでいちばん年下だった。"}, {"t": 491.1666666666667, "x": "15歳で、甲子園の準決勝の二塁を守っていたのね。"}, {"t": 494.8, "x": "試合のあと、その人は何度も自分に問いかけたという。"}, {"t": 498.1, "x": "「なぜ、私のところに\n最後のボールが飛んできたのか」。"}, {"t": 501.4, "x": "そう思ってしまうのは分かる気がする。"}, {"t": 503.6166666666667, "x": "それでも、その人はグラウンドに戻った。"}, {"t": 506.1666666666667, "x": "もう一度仕切り直して、\n努力するしかない。そう考えたという。"}, {"t": 509.98333333333335, "x": "笑って振り返れるようになったのは、\nずっと後のことだった。"}, {"t": 513.45, "x": "明石中には竹山という野球部の部長がいた。"}, {"t": 516.25, "x": "竹山部長は、2年後の1935年に\n転勤で明石中を離れた。"}, {"t": 521.0333333333333, "x": "でも部員たちとの付き合いは続いた。"}, {"t": 523.1666666666666, "x": "同窓会のたびに、竹山部長は\nその人の顔をのぞき込んだ。"}, {"t": 526.9666666666667, "x": "そして「8月19日のこと、まだ\n気にしとるんとちゃうか」と言った。"}, {"t": 531.3333333333334, "x": "「気にしたらあかんぞ」とも。"}, {"t": 533.1333333333333, "x": "何十年たっても、声をかけてくれたのね。"}, {"t": 535.9166666666666, "x": "その人が50歳になっても、\n60歳になっても変わらなかったそうだ。"}, {"t": 540.2333333333333, "x": "家族の話では、その人はいつも自分に厳しかった。"}, {"t": 543.7, "x": "弱音を吐いたことはまったく無かったという。"}, {"t": 546.1166666666667, "x": "講演を頼まれることも多かった。"}, {"t": 548.1333333333333, "x": "1時間を超える話の原稿を、\nすべて覚えて本番に臨んだ。"}, {"t": 551.9666666666667, "x": "2003年、兵庫大会の開幕試合で始球式を務めた。"}, {"t": 555.8, "x": "その前には、家の近くの公園で\n何度も投げる練習をしたそうだ。"}, {"t": 559.9166666666666, "x": "始球式の1球まできちんと準備したのね。"}, {"t": 562.7666666666667, "x": "ああ。資料の題が\n「忘れない夏」なのは、そういうことだ。"}, {"t": 566.6666666666666, "x": "最後の1球を、ずっと背負って生きた人の話なのね。"}, {"t": 570.7166666666667, "x": "勝った吉田はそのあとどうしたの？"}, {"t": 572.8, "x": "吉田は明治大学に進んだ。"}, {"t": 574.8, "x": "明大では、投手ではなく外野手になった。"}, {"t": 577.55, "x": "投手をやめたの？"}, {"t": 578.7833333333333, "x": "ああ。それでも、六大学で\n初めての4連覇に力を貸している。"}, {"t": 582.8666666666667, "x": "卒業後は藤倉電線という会社のチームに入った。"}, {"t": 586.0833333333334, "x": "そこで、もう一度投手に戻った。"}, {"t": 588.2833333333333, "x": "1939年、都市対抗野球で優勝している。"}, {"t": 591.85, "x": "その大会の橋戸賞も受けている。"}, {"t": 594.0833333333334, "x": "外野手から、また投手に戻って優勝したのね。"}, {"t": 597.25, "x": "1964年からは中日スポーツの記者になった。"}, {"t": 600.8333333333334, "x": "野球の評論を書く側に回ったんだ。"}, {"t": 603.1333333333333, "x": "1992年、吉田は野球殿堂に入った。"}, {"t": 606.5, "x": "そして1996年5月23日に亡くなっている。"}, {"t": 610.4166666666666, "x": "吉田の名前は、思わぬところでもう一度注目された。"}, {"t": 613.8, "x": "2014年2月、台湾で映画\n『KANO』が公開されたんだ。"}, {"t": 618.2166666666667, "x": "KANOってもしかして嘉義農林のこと？"}, {"t": 620.9, "x": "そうだ。1931年の嘉義農林の甲子園を描いた映画だ。"}, {"t": 625.15, "x": "その決勝で中京商が4対0で勝った相手だな。"}, {"t": 628.3, "x": "この映画をきっかけに、\n両方の学校の交流がまた始まった。"}, {"t": 632.0833333333334, "x": "85年以上たってから、\n野球の交流試合も開かれている。"}, {"t": 636.0166666666667, "x": "決勝の相手とそんなに後になって会えたのね。"}, {"t": 639.35, "x": "いまの甲子園で、25回の試合ってありえるの？"}, {"t": 642.4, "x": "ありえない。そこからは、延長の決まりの話になる。"}, {"t": 645.6666666666666, "x": "1933年のあとも、しばらくは回の制限が無かった。"}, {"t": 649.7333333333333, "x": "変わったきっかけは1958年の春だ。"}, {"t": 652.75, "x": "徳島商の板東英二が春の四国大会で投げた。"}, {"t": 655.9833333333333, "x": "ある試合で延長16回を完投した。"}, {"t": 658.3666666666667, "x": "その2日後には延長25回を完投した。"}, {"t": 661.3, "x": "16回と25回を2日あけただけで？"}, {"t": 664.0166666666667, "x": "ああ。日本高野連は投げすぎを心配した。"}, {"t": 666.65, "x": "そして、延長は18回で打ち切り、\n再試合にすると決めた。"}, {"t": 670.5333333333333, "x": "その夏、甲子園でさっそくこの決まりが使われた。"}, {"t": 673.6833333333333, "x": "準々決勝の徳島商と魚津が、18回で引き分けたんだ。"}, {"t": 677.8, "x": "決まりを作った夏にもう引き分けが出たのね。"}, {"t": 680.5833333333334, "x": "春の選抜も、1959年から18回で打ち切りになった。"}, {"t": 685.0, "x": "日本高野連の記録には\n「選手の健康管理の上から」とある。"}, {"t": 689.0, "x": "18回の決まりは決勝でも使われた。"}, {"t": 691.5333333333333, "x": "1969年の夏、松山商と\n三沢の決勝が引き分けになった。"}, {"t": 696.3666666666667, "x": "決勝の引き分け再試合は大会で初めてだった。"}, {"t": 699.5333333333333, "x": "決勝でも決着がつかないことがあるのね。"}, {"t": 702.25, "x": "ああ。それでも、18回までは投げ続けることができた。"}, {"t": 706.4, "x": "次に変わったのは1998年の夏がきっかけだ。"}, {"t": 710.0833333333334, "x": "PL学園と横浜の試合が延長17回までもつれた。"}, {"t": 713.6833333333333, "x": "この試合を受けて、延長はさらに短くなった。"}, {"t": 716.6333333333333, "x": "2001年の夏の大会から、18回が15回になったんだ。"}, {"t": 720.8333333333334, "x": "3回短くなったのね。"}, {"t": 722.6666666666666, "x": "2003年の春には15回でも引き分けが出た。"}, {"t": 725.6666666666666, "x": "花咲徳栄と東洋大姫路の準々決勝だ。"}, {"t": 728.85, "x": "15回になって初めての引き分け再試合だった。"}, {"t": 731.8833333333333, "x": "そして2017年の春。"}, {"t": 733.7666666666667, "x": "延長15回の引き分けが2試合続けて起きた。"}, {"t": 736.7166666666667, "x": "春と夏を通じて初めてのことだった。"}, {"t": 739.3166666666667, "x": "2試合続けてやり直しになったのね。"}, {"t": 741.7166666666667, "x": "ああ。軟式の全国大会では、\n延長50回の試合もあった。"}, {"t": 745.7, "x": "これらが新しい決まりを後押しした。"}, {"t": 747.9833333333333, "x": "新しい決まりって？"}, {"t": 749.3666666666667, "x": "タイブレークだ。"}, {"t": 750.3333333333334, "x": "延長のある回から、\nノーアウト一塁二塁で攻撃を始める。"}, {"t": 753.9333333333333, "x": "早く決着をつけるための仕組みだ。"}, {"t": 756.2333333333333, "x": "2018年、選抜は90回、夏は\n100回の大会から取り入れた。"}, {"t": 760.8333333333334, "x": "始めるのは延長13回からだった。"}, {"t": 763.2333333333333, "x": "日本高野連の理事はいちばんの目的を書いている。"}, {"t": 766.1166666666667, "x": "投手の故障を防ぐことだ。"}, {"t": 768.0166666666667, "x": "やっぱり投げすぎを止めるためなのね。"}, {"t": 770.2666666666667, "x": "2023年の春からはさらに早くなった。"}, {"t": 773.15, "x": "タイブレークは延長10回から始まる。"}, {"t": 775.4666666666667, "x": "2024年の夏には、決勝で初めて\n10回のタイブレークがあった。"}, {"t": 779.7666666666667, "x": "2025年の夏は、タイブレークになった試合が8つ。"}, {"t": 783.2333333333333, "x": "これはこれまでで最も多い数だ。"}, {"t": 785.3833333333333, "x": "いまは10回から決着をつけにいくのね。"}, {"t": 788.0, "x": "そうだ。だから、0対0のまま\n25回まで行くことは、もう起こらないだろう。"}, {"t": 793.3166666666667, "x": "ここで延長の決まりを年で並べてみる。"}, {"t": 795.6833333333333, "x": "1933年。回の制限は無し。"}, {"t": 798.35, "x": "中京商と明石中が25回。"}, {"t": 800.5833333333334, "x": "1958年。夏の大会から : 927.1833333333333, "x": "そうだったのではないかとおれは思う。"}, {"t": 929.1666666666666, "x": "いまなら、どこかで交代していたかもしれない。"}, {"t": 931.8833333333333, "x": "10回からタイブレークで、早く\n決着がついていたかもしれない。"}, {"t": 935.7666666666667, "x": "それはいい変化なの？"}, {"t": 937.1833333333333, "x": "投手の体を守るためには大事な変化だ。"}, {"t": 939.8833333333333, "x": "ただ、その分だけ、25回の記録は\n動かないものになった。"}, {"t": 943.9, "x": "だれにも抜かれない記録ってことね。"}, {"t": 946.15, "x": "ああ。スコアブックの空白もそのまま残っている。"}, {"t": 949.7, "x": "1933年8月19日。"}, {"t": 952.2333333333333, "x": "午後1時10分に始まった\n試合は、25回の裏に終わった。"}, {"t": 956.1166666666667, "x": "336球を投げた吉田は、次の日の決勝にも勝った。"}, {"t": 960.1333333333333, "x": "最後の送球をした15歳の二塁手は、\nその1球と向き合って生きた。"}, {"t": 964.4833333333333, "x": "勝った方にも、負けた方にも続きがあったのね。"}, {"t": 967.6333333333333, "x": "延長25回の話はここまでだ。"}, {"t": 969.9666666666667, "x": "役に立ったと思ってもらえたら、\n登録して次の回を待っていてほしい。"}, {"t": 974.1666666666666, "x": "見てくれて、ありがとう。またね。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
