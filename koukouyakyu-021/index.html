<script>
const D={"name": "慶應義塾", "file": "021_編集用", "dur": 945.11665625, "segs": [], "subs": [{"t": 0.0, "x": "1916年の夏。大阪府の豊中グラウンド。"}, {"t": 3.566666666666667, "x": "全国の中学校が集まる野球の大会は、\nこの年がまだ2回目だった。"}, {"t": 8.066666666666666, "x": "決勝に残ったのは東京の慶應普通部と、\n地元大阪の市岡中だ。"}, {"t": 12.516666666666667, "x": "結果は6対2。慶應普通部が勝って優勝した。"}, {"t": 15.766666666666667, "x": "普通部って今でいう中学校のこと？"}, {"t": 18.116666666666667, "x": "そうだ。慶應義塾の中で旧制の中学にあたる学校だ。"}, {"t": 21.8, "x": "このチームの指揮を執っていた\n監督が少し変わっていた。"}, {"t": 25.033333333333335, "x": "名前は腰本寿。"}, {"t": 26.516666666666666, "x": "当時はまだ慶應の大学部に通う現役の選手だった。"}, {"t": 30.033333333333335, "x": "えっ、大学生が監督だったの？"}, {"t": 32.416666666666664, "x": "ああ。そしてこの優勝のあと、\n慶應の夏の日本一はぱったり途絶える。"}, {"t": 36.7, "x": "次に優勝旗が戻ってきたのは2023年の夏。"}, {"t": 40.13333333333333, "x": "107年後のことだ。"}, {"t": 41.766666666666666, "x": "107年って100年以上も勝てなかったってこと？"}, {"t": 44.766666666666666, "x": "どうしてそんなに時間がかかったの？"}, {"t": 46.9, "x": "それにどうやって戻ってこられたのかしら。"}, {"t": 49.85, "x": "今回は神奈川の慶應義塾高校。"}, {"t": 52.15, "x": "107年の空白を、日付と数字で順番に辿っていく。"}, {"t": 55.86666666666667, "x": "もう1つの主役は言葉だ。"}, {"t": 57.55, "x": "「エンジョイ・ベースボール」。"}, {"t": 58.96666666666667, "x": "この言葉がどこから来て、誰の手で\n高校に根づいたのかも見ていく。"}, {"t": 62.95, "x": "面白いと思ったら、チャンネル登録と\n高評価をお願いします。"}, {"t": 66.78333333333333, "x": "まずは107年前の豊中からね。"}, {"t": 69.73333333333333, "x": "第2回大会に出たのは全部で12校だ。"}, {"t": 72.36666666666666, "x": "会場の豊中グラウンドは、\nいまの豊中市玉井町にあった。"}, {"t": 76.11666666666666, "x": "前の年の第1回大会も同じ場所で開かれている。"}, {"t": 79.45, "x": "甲子園じゃなかったのね。"}, {"t": 81.08333333333333, "x": "ああ。この頃の大会には、今では\n考えられない決まりもあった。"}, {"t": 84.9, "x": "1回戦で負けた学校が、もう\n一度戦えることがあったんだ。"}, {"t": 88.8, "x": "負けても続きがあるの？"}, {"t": 90.38333333333334, "x": "敗者復活戦だ。"}, {"t": 91.76666666666667, "x": "この年は1回戦で負けた鳥取中が、\nそこから準決勝まで勝ち上がった。"}, {"t": 96.56666666666666, "x": "一度負けた学校がベスト4に？"}, {"t": 98.46666666666667, "x": "不思議な大会ね。"}, {"t": 99.91666666666667, "x": "慶應普通部のほうは、負けずに4試合を勝ち抜いた。"}, {"t": 103.03333333333333, "x": "1回戦は愛知四中に6対2。"}, {"t": 105.21666666666667, "x": "準々決勝は香川商に9対3。"}, {"t": 107.55, "x": "準決勝は和歌山中に7対3だ。"}, {"t": 110.1, "x": "どの試合もけっこう点を取って勝ってるのね。"}, {"t": 112.73333333333333, "x": "4試合で取った点は28点。"}, {"t": 114.65, "x": "取られたのは10点だった。"}, {"t": 116.35, "x": "そして決勝で市岡中を6対2で下した。"}, {"t": 119.2, "x": "のちに主将の山口昇が、この優勝をふり返っている。"}, {"t": 122.68333333333334, "x": "普通部には投げられる投手が何人もいた。"}, {"t": 125.2, "x": "それを上手に使った\n腰本監督の統率を忘れてはならない、と。"}, {"t": 129.38333333333333, "x": "投手を何人も使い分けたのね。"}, {"t": 131.43333333333334, "x": "大学生の監督なのに、ちゃんと作戦があったんだ。"}, {"t": 134.83333333333334, "x": "腰本と慶應の縁は、ハワイで始まった。"}, {"t": 137.53333333333333, "x": "1908年、慶應の野球部が初めてハワイへ遠征した。"}, {"t": 141.36666666666667, "x": "そのつながりで、遠征のあと普通部に\n入学したと伝えられている。"}, {"t": 145.3, "x": "普通部では二塁手として選手の時代を過ごした。"}, {"t": 148.35, "x": "自分が通った学校で、今度は監督をしたのね。"}, {"t": 152.11666666666667, "x": "慶應普通部は1916年から1921年まで、\n6年続けて全国大会に出た。"}, {"t": 158.36666666666667, "x": "翌1917年はベスト8。"}, {"t": 160.8, "x": "この年から大会は豊中を離れ、\n兵庫県の鳴尾球場へ移った。"}, {"t": 165.13333333333333, "x": "どうして場所を変えたの？"}, {"t": 166.66666666666666, "x": "人気が出すぎて、豊中では\n観客が入りきらなくなったんだ。"}, {"t": 170.45, "x": "1918年は米騒動の影響で、\n大会そのものが中止になった。"}, {"t": 175.21666666666667, "x": "野球と関係ない理由で、大会ごと無くなったの？"}, {"t": 178.43333333333334, "x": "そうだ。その年の普通部は出場が\n決まっていたが、試合はできなかった。"}, {"t": 182.9, "x": "1919年はまたベスト8だった。"}, {"t": 185.75, "x": "出るたびに勝ち進んでいるのね。"}, {"t": 187.76666666666668, "x": "そして1920年。普通部は\n2度目の決勝まで勝ち上がる。"}, {"t": 191.7, "x": "新潟の長岡中、愛媛の松山商を破っての決勝だった。"}, {"t": 195.61666666666667, "x": "ただ決勝では兵庫の関西学院中に\n敗れ、準優勝に終わっている。"}, {"t": 199.96666666666667, "x": "あと1勝で2度目の日本一だったのね。"}, {"t": 202.55, "x": "1921年は2回戦まで。"}, {"t": 204.8, "x": "6年続いた出場はここで止まった。"}, {"t": 207.43333333333334, "x": "それでも6年で優勝1回と準優勝1回ね。"}, {"t": 210.48333333333332, "x": "最初のころの慶應は、本当に強かったんだ。"}, {"t": 214.01666666666668, "x": "普通部のあと、甲子園に慶應の名前を\n運んだのは別の学校だった。"}, {"t": 218.2, "x": "慶應商工という学校だ。"}, {"t": 219.91666666666666, "x": "1929年に春と夏の両方に出ている。"}, {"t": 223.11666666666667, "x": "1933年と1937年の夏にも、\n慶應商工が甲子園に来た。"}, {"t": 228.85, "x": "同じ慶應でもいろんな学校があったのね。"}, {"t": 231.41666666666666, "x": "戦争が終わった1947年の春には、\n珍しいことが起きた。"}, {"t": 235.85, "x": "慶應普通部と慶應商工が、\n同じセンバツに一緒に出たんだ。"}, {"t": 239.68333333333334, "x": "慶應どうしで2校も？"}, {"t": 241.18333333333334, "x": "ああ。そのため春の出場回数は、\n数え方で10回とも11回ともいわれる。"}, {"t": 246.05, "x": "1948年。学校の制度が変わり、\n新しく慶應義塾高校ができた。"}, {"t": 251.28333333333333, "x": "その年の夏、さっそく甲子園に\n出て2回戦まで進んでいる。"}, {"t": 255.11666666666667, "x": "1949年、校舎が横浜の日吉に移った。"}, {"t": 258.8, "x": "1950年には神奈川県の高野連に入った。"}, {"t": 262.21666666666664, "x": "東京の学校が、ここで神奈川の学校になったのね。"}, {"t": 265.68333333333334, "x": "そうだ。1953年の夏、慶應は初めて\n神奈川の代表として甲子園に出た。"}, {"t": 271.26666666666665, "x": "1956年の夏も出場し、\n1960年の春はベスト8まで進んだ。"}, {"t": 276.98333333333335, "x": "そして1962年の夏。2回戦で敗れた。"}, {"t": 280.6666666666667, "x": "まあ2回戦ならよくある負け方よね。"}, {"t": 283.01666666666665, "x": "ところがこの1962年が、長い長い空白の始まりだった。"}, {"t": 288.1, "x": "次に慶應が春の甲子園に来たのは\n2005年。45年ぶりだ。"}, {"t": 292.23333333333335, "x": "夏はもっと長い。次は2008年で、46年ぶりだった。"}, {"t": 296.43333333333334, "x": "半世紀近く、甲子園に行けなかったのね。"}, {"t": 299.31666666666666, "x": "その間も高校の野球部は日吉で続いていた。"}, {"t": 302.1666666666667, "x": "1970年には日吉台球場ができている。"}, {"t": 305.3833333333333, "x": "1982年にはOBの会が本格的に動き始めた。"}, {"t": 309.48333333333335, "x": "1994年にはウエイトトレーニングの部屋もできた。"}, {"t": 312.98333333333335, "x": "2007年には室内練習場も完成している。"}, {"t": 316.1666666666667, "x": "練習の場所は少しずつ整っていったのね。"}, {"t": 318.9, "x": "でもその間の甲子園は0回なんでしょう？"}, {"t": 321.46666666666664, "x": "そうだ。空白の理由を1つに\n決められる資料は見つからなかった。"}, {"t": 325.35, "x": "だからここでは、理由は言い切らないでおく。"}, {"t": 327.8, "x": "かわりにこの空白の時代、慶應の大学で\n起きていたことを見ていこう。"}, {"t": 331.95, "x": "高校の話から大学の話に？"}, {"t": 334.35, "x": "ああ。107年の謎を解くカギは、大学のほうにある。"}, {"t": 338.3833333333333, "x": "まず普通部を優勝させた腰本寿のその後だ。"}, {"t": 341.43333333333334, "x": "腰本はのちに慶應の大学野球部の監督になった。"}, {"t": 344.8333333333333, "x": "在任は10年16シーズン。その間に7回優勝している。"}, {"t": 348.56666666666666, "x": "1928年には全勝での優勝も果たした。"}, {"t": 352.05, "x": "高校でも大学でも、勝たせる監督だったのね。"}, {"t": 355.23333333333335, "x": "ただ1935年、40歳の若さで急に亡くなった。"}, {"t": 359.31666666666666, "x": "40歳……早すぎるわね。"}, {"t": 361.28333333333336, "x": "そして1960年。29歳で\n大学野球部の監督になった男がいる。"}, {"t": 366.4, "x": "前田祐吉。1930年に高知市で生まれた人だ。"}, {"t": 370.18333333333334, "x": "前田は二度にわたって監督を務め、合わせて18年。"}, {"t": 373.65, "x": "その間にリーグ優勝を8回果たした。"}, {"t": 376.03333333333336, "x": "この前田が、慶應の野球を1つの言葉で言い表した。"}, {"t": 379.5, "x": "それが「エンジョイ・ベースボール」だ。"}, {"t": 381.8333333333333, "x": "ただ楽しく野球をしようっていう意味？"}, {"t": 384.06666666666666, "x": "いや、そうではないと前田は言っている。"}, {"t": 386.25, "x": "楽しむ前に、守る条件が3つある。"}, {"t": 388.76666666666665, "x": "1つ目は、チームの全員がベストを尽くすこと。"}, {"t": 391.7, "x": "2つ目は、仲間への気配りを忘れないこと。"}, {"t": 394.53333333333336, "x": "3つ目は、自分で工夫して自分から努力すること。"}, {"t": 397.76666666666665, "x": "この3つをそろえたうえで楽しむから\n上手くなる、という考えだ。"}, {"t": 401.51666666666665, "x": "楽しむって、思ったより厳しいのね。"}, {"t": 404.05, "x": "それと前田はこの言葉を、自分で\n考えたとは書いていない。"}, {"t": 407.56666666666666, "x": "野球部の大先輩から\n伝わったものだ、と書き残している。"}, {"t": 411.31666666666666, "x": "大先輩って、誰なの？"}, {"t": 413.18333333333334, "x": "それは資料に名前が出てこない。"}, {"t": 415.05, "x": "ただ前田には、\n伝統の守り方についての考えがあった。"}, {"t": 418.5833333333333, "x": "伝統は、そこに新しいものを\n付け加えることで守られる、というものだ。"}, {"t": 423.0, "x": "古いものをそのまま飾っておくだけじゃないのね。"}, {"t": 425.8, "x": "ちなみに慶應の野球部には、もっと古い記録もある。"}, {"t": 428.96666666666664, "x": "1910年、アメリカの大リーガー2人を神戸に招いた。"}, {"t": 432.6333333333333, "x": "そして1か月の特訓の合宿をした。"}, {"t": 435.1666666666667, "x": "日本人が野球の作戦を、理屈立てて\n学んだ最初の例とされている。"}, {"t": 439.56666666666666, "x": "100年以上前から考える野球をしていたのね。"}, {"t": 443.05, "x": "その言葉を高校に根づかせたのが、上田誠だ。"}, {"t": 446.2, "x": "上田は1991年から2015年まで、\n慶應義塾高校の監督を務めた。"}, {"t": 451.85, "x": "24年ってすごく長いわね。"}, {"t": 453.9, "x": "上田は1998年から2年間、\nアメリカのUCLAにコーチとして留学した。"}, {"t": 459.3833333333333, "x": "そこで持ち帰ったのが、選手に\n自分で考えさせる指導だった。"}, {"t": 463.26666666666665, "x": "上から教えこむ指導がふつうだった時代のことだ。"}, {"t": 466.25, "x": "具体的には、どんなことを変えたの？"}, {"t": 468.6333333333333, "x": "たとえば冬の練習の服だ。"}, {"t": 470.46666666666664, "x": "ユニフォームではなく、\nトレーニング用の服で練習させた。"}, {"t": 473.75, "x": "着替える時間が短くなり、寒さも\n防げて、体も動かしやすい。"}, {"t": 478.0833333333333, "x": "理由を聞くとなるほどって思うわね。"}, {"t": 480.28333333333336, "x": "全員で同じことをする練習より、\n1人1人の練習を大事にした。"}, {"t": 484.46666666666664, "x": "そして2005年の春。"}, {"t": 485.9, "x": "慶應は45年ぶりにセンバツに出る。"}, {"t": 488.31666666666666, "x": "初戦で岡山の関西を破り、2回戦で福井商にも勝った。"}, {"t": 492.1166666666667, "x": "結果はベスト8。空白の時代がようやく終わった。"}, {"t": 495.45, "x": "45年ぶりで、いきなりベスト8なのね。"}, {"t": 498.4, "x": "2008年は、野球部ができて120年の年だった。"}, {"t": 501.98333333333335, "x": "この年の慶應は、春と夏の両方の甲子園に出ている。"}, {"t": 505.5, "x": "夏の出場は1962年以来、46年ぶりだ。"}, {"t": 509.48333333333335, "x": "長野の松商学園、富山の高岡商、\nそして青森山田を破った。"}, {"t": 513.95, "x": "準々決勝で沖縄の浦添商に敗れたが、ベスト8だった。"}, {"t": 518.0833333333334, "x": "夏もちゃんと勝てるようになってきたのね。"}, {"t": 520.5666666666667, "x": "その秋には明治神宮大会で優勝している。"}, {"t": 523.5, "x": "秋の全国大会で日本一になったのね。"}, {"t": 526.35, "x": "そうだ。翌2009年の春もセンバツに出た。"}, {"t": 529.3333333333334, "x": "上田が監督の間に出た甲子園は、\n夏が1回、春が3回だった。"}, {"t": 534.4333333333333, "x": "2015年8月。上田のあとを\n継いで、新しい監督が就いた。"}, {"t": 538.65, "x": "森林貴彦。1973年、東京の生まれだ。"}, {"t": 542.6, "x": "慶應の高校で、上田のもとで1年間プレーしている。"}, {"t": 545.8833333333333, "x": "大学に進むと、今度は母校の学生コーチになった。"}, {"t": 549.4166666666666, "x": "あれ？　学生のうちから母校の指導って……。"}, {"t": 552.0, "x": "ああ。107年前の腰本と少し似ているだろう。"}, {"t": 555.15, "x": "1996年に大学を出たあとは、NTTに3年間勤めた。"}, {"t": 559.85, "x": "その後、会社を辞めて\n筑波大学の大学院でコーチングを学んだ。"}, {"t": 563.9833333333333, "x": "会社員から野球の指導の勉強に？"}, {"t": 566.3666666666667, "x": "そうだ。そして2002年、\n慶應の幼稚舎の先生になった。"}, {"t": 570.1166666666667, "x": "幼稚舎は、慶應の小学校にあたる学校だ。"}, {"t": 573.0833333333334, "x": "小学校の先生が高校野球の監督をしているの？"}, {"t": 576.4166666666666, "x": "ああ。小学校で教えながら、\n高校のコーチ、助監督と進んだ。"}, {"t": 580.6, "x": "助監督になったのは2012年。\nその3年後に監督になった。"}, {"t": 584.8833333333333, "x": "コーチから数えると長い下積みね。"}, {"t": 587.1833333333333, "x": "2018年は野球部ができて130年の年だった。"}, {"t": 590.8, "x": "その春、慶應は9年ぶりにセンバツに出た。"}, {"t": 593.6166666666667, "x": "夏も10年ぶりに甲子園に来ている。"}, {"t": 596.0, "x": "上田監督のときと同じで、また春も夏も出たのね。"}, {"t": 599.5, "x": "ただどちらも2回戦までだった。"}, {"t": 601.5, "x": "本当の山場はその5年後に来る。"}, {"t": 604.2333333333333, "x": "2023年3月21日。"}, {"t": 606.5, "x": "慶應は5年ぶりのセンバツで初戦を迎えた。"}, {"t": 609.2, "x": "相手は宮城の仙台育英。"}, {"t": 610.7666666666667, "x": "前の年の夏の優勝校だ。"}, {"t": 612.7333333333333, "x": "5回の裏に1点を先に取られた。"}, {"t": 614.9166666666666, "x": "慶應は9回の表、代打の選手の当たりで追いついた。"}, {"t": 618.4166666666666, "x": "土壇場で同点！"}, {"t": 619.6333333333333, "x": "試合はこの大会で初めての、\n延長のタイブレークに入った。"}, {"t": 623.3166666666667, "x": "10回の裏。慶應は一度は本塁でアウトを取った。"}, {"t": 626.3666666666667, "x": "だがその後にサヨナラの当たりを\n打たれ、1対2で敗れた。"}, {"t": 629.8833333333333, "x": "延長でしかもサヨナラ負けなんて悔しいわね。"}, {"t": 632.6333333333333, "x": "この仙台育英という名前は覚えておいてほしい。"}, {"t": 635.4833333333333, "x": "え、また出てくるの？"}, {"t": 637.4333333333333, "x": "2023年7月26日。横浜スタジアム。"}, {"t": 641.1166666666667, "x": "神奈川大会の決勝で、慶應は横浜高校と戦った。"}, {"t": 644.9, "x": "3回に慶應が2点を先に取った。"}, {"t": 647.1833333333333, "x": "5回に横浜が1点を返す。"}, {"t": 649.0666666666667, "x": "6回の表に慶應が1点を足して3対1。"}, {"t": 652.05, "x": "ところがその裏、横浜が3点を取って逆転した。"}, {"t": 655.4333333333333, "x": "7回にも1点を取られて、3対5になった。"}, {"t": 658.5, "x": "2点差で終盤……苦しいわね。"}, {"t": 660.5666666666667, "x": "そして9回の表。慶應の選手が\n3ランホームランを打った。"}, {"t": 664.3666666666667, "x": "6対5。最後の回にひっくり返した。"}, {"t": 667.0833333333334, "x": "最後の最後で逆転！"}, {"t": 668.6166666666667, "x": "5年ぶり19回目の夏の甲子園だ。"}, {"t": 671.1, "x": "神奈川の代表が1校だけの年に\n出るのは、1962年以来61年ぶりだった。"}, {"t": 676.9666666666667, "x": "じゃあ2008年は？"}, {"t": 678.4333333333333, "x": "あの年は記念の大会で、神奈川が南と\n北に分かれて2校が出ていたんだ。"}, {"t": 683.1833333333333, "x": "なるほど。だから61年ぶりなのね。"}, {"t": 686.3833333333333, "x": "8月11日。甲子園の初戦は\n福井の北陸に9対4で勝った。"}, {"t": 690.8666666666667, "x": "8月16日の3回戦は、広島の広陵とぶつかった。"}, {"t": 694.8333333333334, "x": "この試合も延長のタイブレークになった。"}, {"t": 697.2833333333333, "x": "春と同じ延長戦ね……。"}, {"t": 698.9833333333333, "x": "今度は10回の表に3点を取り、6対3で勝った。"}, {"t": 702.4666666666667, "x": "これで2008年以来、15年ぶりのベスト8だ。"}, {"t": 705.8666666666667, "x": "春のときとは逆の結果になったのね。"}, {"t": 708.3666666666667, "x": "8月19日の準々決勝は、沖縄尚学に7対2。"}, {"t": 712.2833333333333, "x": "15年前の準々決勝で負けたのも、\n沖縄の浦添商だった。"}, {"t": 716.5333333333333, "x": "15年前と同じ甲子園で今度は勝ったのね。"}, {"t": 719.5, "x": "8月21日の準決勝は、茨城の土浦日大。"}, {"t": 723.2833333333333, "x": "投手が最後まで投げきり、2対0の完封で勝った。"}, {"t": 726.5166666666667, "x": "慶應が夏の決勝に進むのは、\n1920年の普通部以来103年ぶりだ。"}, {"t": 731.7666666666667, "x": "103年ぶりの決勝……！"}, {"t": 733.35, "x": "相手はどこなの？"}, {"t": 734.5666666666667, "x": "仙台育英だ。"}, {"t": 735.8, "x": "春に延長で負けた、あの仙台育英？"}, {"t": 738.4, "x": "そうだ。しかも仙台育英は、夏の2連覇をかけていた。"}, {"t": 742.6333333333333, "x": "2023年8月23日。甲子園での決勝。"}, {"t": 746.3, "x": "1回の表。慶應の1番打者が、いきなり\n本塁打を打った。"}, {"t": 750.3, "x": "試合が始まってすぐに？"}, {"t": 751.9666666666667, "x": "ああ。この回に2点を取った。"}, {"t": 753.8333333333334, "x": "2回にも1点を足して3対0だ。"}, {"t": 756.2333333333333, "x": "出だしから慶應のペースね。"}, {"t": 758.0666666666667, "x": "仙台育英も2回と3回に1点ずつ返してくる。"}, {"t": 761.3833333333333, "x": "3対2。まだ分からないわね。"}, {"t": 763.45, "x": "試合が動いたのは5回の表だった。"}, {"t": 765.6833333333333, "x": "慶應はこの回だけで5点を取った。"}, {"t": 767.8333333333334, "x": "8対2。そのあとはお互いに点が入らなかった。"}, {"t": 771.0666666666667, "x": "6点差のまま最後の回まで進んだのね。"}, {"t": 773.8166666666667, "x": "最後のアウトを取って、慶應の優勝が決まった。"}, {"t": 776.8333333333334, "x": "春に負けた相手に、夏の決勝で勝ったのね！"}, {"t": 779.8666666666667, "x": "1916年の第2回大会以来、2度目の夏の優勝。"}, {"t": 783.8833333333333, "x": "深紅の大優勝旗が、107年ぶりに慶應へ戻った。"}, {"t": 787.4833333333333, "x": "100年以上かけてやっと戻ってきたのね。"}, {"t": 790.6333333333333, "x": "優勝の2日後の8月25日。"}, {"t": 792.9, "x": "選手たちは日吉台球場で写真に収まった。"}, {"t": 795.8833333333333, "x": "9月2日には日吉で優勝の報告会が開かれた。"}, {"t": 799.2166666666667, "x": "高校の校舎には優勝を知らせる垂れ幕も掛かった。"}, {"t": 802.3, "x": "日吉の商店街からも祝福が寄せられた。"}, {"t": 805.0666666666667, "x": "主将から校長へ、優勝旗が手渡された。"}, {"t": 807.8166666666667, "x": "横浜市の市役所の建物も、\n慶應の三色の明かりで照らされた。"}, {"t": 812.1333333333333, "x": "街全体でお祝いしたのね。"}, {"t": 814.0333333333333, "x": "9月27日には三田演説館で、\n優勝を祝う会が開かれた。"}, {"t": 818.2666666666667, "x": "招かれたのは選手と3年生の部員全員。"}, {"t": 821.0, "x": "応援指導部、吹奏楽部、\n女子高校のバトン部の部員もだ。"}, {"t": 824.9166666666666, "x": "応援した人たちも一緒にお祝いしたのね。"}, {"t": 827.5833333333334, "x": "この日に見られたものの中に、古い道具が2つあった。"}, {"t": 830.95, "x": "1つは前田祐吉が書いたノートだ。"}, {"t": 833.2166666666667, "x": "もう1つは、腰本寿が使っていた\nストップウォッチだっ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
