<title>2度目の春夏連覇</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;-webkit-text-size-adjust:100%;
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}

#nextline{margin:16px 0 0;text-align:center;white-space:pre-wrap;word-break:break-word;
  color:var(--dim);font-size:clamp(13px,2.8vw,17px);line-height:1.6}
.badge{position:absolute;left:12px;top:12px;background:rgba(127,127,127,.16);color:var(--dim);

button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:80px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}

.tabs{display:flex;gap:6px;margin:18px 0 10px;border-bottom:1px solid var(--line)}

  color:var(--ink);padding:7px 12px;font-weight:600}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);

.row b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;

.row span{white-space:pre-wrap;flex:1;font-size:16px;line-height:1.65}
.tip{color:var(--dim);font-size:12.5px;margin:10px 2px 0}
@media(max-width:620px){.wrap{padding:10px}.time{font-size:12px}

<script>
const D={"name": "2度目の春夏連覇", "file": "044_編集用", "dur": 862.7333125, "segs": [], "subs": [{"t": 0.0, "x": "春の選抜と夏の選手権。"}, {"t": 2.0, "x": "同じ年にこの2つを続けて\n勝つことを、春夏連覇と呼ぶ。"}, {"t": 5.833333333333333, "x": "春夏連覇をした学校は、いままでに7校ある。"}, {"t": 9.033333333333333, "x": "7校も？ 思ったより多いのね。"}, {"t": 11.2, "x": "では、それを2度やった学校は、\nいつ初めて出たと思う？"}, {"t": 14.75, "x": "うーん、昔の強い学校かしら。昭和のころ？"}, {"t": 17.783333333333335, "x": "答えは2018年。夏の大会の第100回だ。"}, {"t": 21.1, "x": "日本高野連の大会小史は、\n第100回のところにこう書いている。"}, {"t": 25.083333333333332, "x": "大阪桐蔭が「史上初めてとなる\n2度目の春夏連覇を遂げて幕を閉じた」。"}, {"t": 29.833333333333332, "x": "100回目の大会で、やっと初めてなのね。"}, {"t": 32.68333333333333, "x": "今回はこの「2度目」という一句だけを追いかける。"}, {"t": 35.733333333333334, "x": "2度目に挑戦できた年は、じつはとても少ない。"}, {"t": 38.833333333333336, "x": "その年を1つずつ数えていく。"}, {"t": 40.88333333333333, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 44.3, "x": "よろしくね。"}, {"t": 45.8, "x": "まず春と夏の大会のちがいを確かめておく。"}, {"t": 48.6, "x": "春の選抜は、前の年の秋の大会の成績などで\n選ばれた学校が出る。"}, {"t": 53.21666666666667, "x": "夏の選手権は、それぞれの地方の大会を\n勝ち抜いた学校が出る。"}, {"t": 57.416666666666664, "x": "春に勝っても、夏はまた地方の大会から始まるのね。"}, {"t": 61.05, "x": "そうだ。春の日本一でも、夏の地方大会で\n負ければ甲子園には来られない。"}, {"t": 65.85, "x": "最初の春夏連覇は1962年の作新学院だ。"}, {"t": 69.71666666666667, "x": "公式はこの年を\n「ついに史上初の春夏連続優勝」と書いている。"}, {"t": 74.21666666666667, "x": "「ついに」って書いてあるのね。"}, {"t": 75.96666666666667, "x": "1962年は、春の大会の第34回で、\n夏の大会の第44回だった。"}, {"t": 82.15, "x": "春も夏も、30回以上は1度も連覇が出なかったのね。"}, {"t": 85.96666666666667, "x": "そうだ。1度目の時点で、もうそれだけ難しかった。"}, {"t": 89.36666666666666, "x": "ああ。そこから2026年までに、\n春の大会は64回開かれた。"}, {"t": 94.13333333333334, "x": "2020年は大会が中止だったので、\nその年は数えていない。"}, {"t": 98.06666666666666, "x": "64回の春の王者のうち、夏も勝ったのは8回だ。"}, {"t": 101.8, "x": "8回に1回しか、夏まで続かないのね。"}, {"t": 104.75, "x": "1966年の中京商、1979年の箕島、\n1987年のPL学園。"}, {"t": 111.8, "x": "1998年の横浜、2010年の興南。\nそして2012年と2018年の大阪桐蔭だ。"}, {"t": 118.88333333333334, "x": "8回で7校。大阪桐蔭だけが2回なのね。"}, {"t": 122.1, "x": "7校それぞれの話は、前に\n春夏連覇の回でくわしく話した。"}, {"t": 126.28333333333333, "x": "今回はその8回目だけを見る。"}, {"t": 128.91666666666666, "x": "公式の書き方を並べると、おもしろいことに気づく。"}, {"t": 132.18333333333334, "x": "1998年の横浜は\n「史上5校目の春夏連覇」と書かれている。"}, {"t": 137.25, "x": "2010年の興南は「史上6校目となる春夏連覇」だ。"}, {"t": 141.15, "x": "ここでは学校の数を数えている。"}, {"t": 143.18333333333334, "x": "ところが2018年は\n「2度目の春夏連覇」と書かれている。"}, {"t": 147.23333333333332, "x": "こちらは1つの学校が何回やったかを数えている。"}, {"t": 150.46666666666667, "x": "「何校目」と「何度目」で、\n数えているものが違うのね。"}, {"t": 154.26666666666668, "x": "ああ。7校目まではどの学校も1度ずつだった。"}, {"t": 157.25, "x": "同じ学校の2度目は、2018年まで1回も出ていない。"}, {"t": 161.08333333333334, "x": "高校は3年で選手が入れ替わるものね。"}, {"t": 163.68333333333334, "x": "そうだ。2度目は、まったく\n別の顔ぶれでもう一度やることになる。"}, {"t": 168.18333333333334, "x": "では、なぜ2度目はこんなに出なかったのか。"}, {"t": 170.75, "x": "2度目を狙うには、まず春の選抜で\nもう一度勝たないといけない。"}, {"t": 174.68333333333334, "x": "春に負けたら、その年の連覇はもう無いものね。"}, {"t": 177.76666666666668, "x": "そこで数えてみた。春夏連覇をした\n学校が、そのあと春にまた勝った年だ。"}, {"t": 182.68333333333334, "x": "使ったのは、選抜の歴代優勝校の一覧だ。"}, {"t": 185.88333333333333, "x": "作新学院と中京商と興南は、\n連覇のあと春に優勝していない。"}, {"t": 190.23333333333332, "x": "箕島は1970年と1977年にも春を勝っている。"}, {"t": 194.8, "x": "PL学園も1981年と1982年に春を勝っている。"}, {"t": 199.63333333333333, "x": "ただ、どちらも連覇より前の優勝だ。"}, {"t": 201.9, "x": "連覇のあとは春を勝っていない。"}, {"t": 203.91666666666666, "x": "じゃあ、連覇のあとに春をまた勝った学校は？"}, {"t": 206.73333333333332, "x": "横浜と大阪桐蔭の2校だけだ。"}, {"t": 209.03333333333333, "x": "2018年より前で数えると、\n挑戦できた年は2回しかない。"}, {"t": 213.16666666666666, "x": "2006年の横浜と2017年の大阪桐蔭だ。"}, {"t": 216.66666666666666, "x": "横浜は1度目の8年後、大阪桐蔭は\n1度目の5年後に、春をまた勝った。"}, {"t": 221.8, "x": "100回近い歴史で、たった2回なの？"}, {"t": 224.4, "x": "そうだ。2度目が出なかったのは、挑戦できる\n年がそもそも少なかったからでもある。"}, {"t": 230.0, "x": "最初の挑戦は2006年だ。"}, {"t": 232.05, "x": "その前に、横浜の1度目を見ておく。"}, {"t": 234.55, "x": "1998年の夏、横浜は18年ぶり2度目の夏の優勝で、\n5校目の春夏連覇をした。"}, {"t": 241.2, "x": "決勝では横浜の投手が、安打も\n点も許さない試合をしている。"}, {"t": 245.15, "x": "公式によると、決勝でこれをやったのは\n59年ぶり2人目だった。"}, {"t": 249.45, "x": "決勝で1本の安打も打たれなかったのね。"}, {"t": 252.1, "x": "そうだ。そして、その8年後の2006年。"}, {"t": 254.95, "x": "春の選抜で横浜はまた優勝した。"}, {"t": 257.5, "x": "決勝の相手は長崎の清峰。"}, {"t": 259.4, "x": "点数は21対0だった。"}, {"t": 261.55, "x": "21対0？ 決勝でそんなに差がつくの？"}, {"t": 264.5, "x": "公式はこれを「決勝戦最多得点差」と書いている。"}, {"t": 267.98333333333335, "x": "清峰は長崎の学校として初めて決勝まで進んでいた。"}, {"t": 271.68333333333334, "x": "横浜にとって、春の優勝はこれが3回目だった。"}, {"t": 275.15, "x": "じゃあ夏に勝てば2度目の連覇ね。"}, {"t": 277.28333333333336, "x": "ああ。でも夏について、\n公式の大会小史は1行だけ書いている。"}, {"t": 281.35, "x": "「春夏連覇を狙った横浜は初戦で敗退」。"}, {"t": 284.28333333333336, "x": "1つも勝てずに終わったのね。"}, {"t": 286.21666666666664, "x": "この夏は早稲田実業が決勝の引き分け\n再試合を制して、初めて優勝した。"}, {"t": 291.06666666666666, "x": "公式によると、決勝の引き分け\n再試合は37年ぶりだった。"}, {"t": 295.23333333333335, "x": "再試合の相手は駒大苫小牧。"}, {"t": 297.18333333333334, "x": "前の年まで、夏を2年続けて勝っていた学校だ。"}, {"t": 300.7, "x": "同じ夏に、別の記録を狙う学校もいたのね。"}, {"t": 303.9, "x": "ああ。そちらも決勝の再試合で3対4。"}, {"t": 306.4, "x": "あと1点で届かなかった。"}, {"t": 308.2, "x": "横浜の最初の挑戦は、夏の1試合目で終わっている。"}, {"t": 312.31666666666666, "x": "次の挑戦の前に、大阪桐蔭の1度目を見ておく。"}, {"t": 315.6333333333333, "x": "2012年の春、大阪桐蔭は選抜で初めて優勝した。"}, {"t": 319.6, "x": "夏も勝ち進み、決勝で光星学院を破った。"}, {"t": 322.71666666666664, "x": "公式は「3度目の優勝を春夏連覇で\n飾った」と書いている。"}, {"t": 326.85, "x": "3度目って、夏の優勝の数？"}, {"t": 329.15, "x": "そうだ。1991年と2008年に夏をもう勝っていた。"}, {"t": 333.35, "x": "これで大阪桐蔭は7校目の春夏連覇の学校になった。"}, {"t": 337.1, "x": "ここから2度目まで、何年かかったの？"}, {"t": 339.68333333333334, "x": "6年だ。その間に挑戦できた年が1回あった。"}, {"t": 343.6333333333333, "x": "2017年の春の選抜だ。"}, {"t": 345.78333333333336, "x": "決勝は大阪桐蔭と履正社。"}, {"t": 347.65, "x": "どちらも大阪の学校だった。"}, {"t": 349.6, "x": "公式は「史上初の大阪対決となった\n決勝」と書いている。"}, {"t": 353.73333333333335, "x": "同じ府の学校どうしで春の日本一を決めたのね。"}, {"t": 356.98333333333335, "x": "試合は4月1日。大阪桐蔭は\n6回までに3対0とリードした。"}, {"t": 361.28333333333336, "x": "ところが8回裏、履正社が3点を返して追いついた。"}, {"t": 364.8333333333333, "x": "3点差が、あっという間に無くなったのね。"}, {"t": 367.53333333333336, "x": "9回表、大阪桐蔭は\n代打の選手の2点本塁打で勝ち越した。"}, {"t": 371.85, "x": "報道によると、決勝での代打の本塁打は\n大会で初めてだった。"}, {"t": 375.8833333333333, "x": "この回に5点を取って、8対3。"}, {"t": 378.05, "x": "大阪桐蔭が勝った。"}, {"t": 379.56666666666666, "x": "公式によると5年ぶり2回目の頂点だった。"}, {"t": 382.4, "x": "これで夏も勝てば、\n史上初めての2度目の春夏連覇になる。"}, {"t": 386.23333333333335, "x": "横浜の2006年から11年。"}, {"t": 388.3833333333333, "x": "2回目の挑戦の年が来た。"}, {"t": 390.48333333333335, "x": "今度は大阪桐蔭の番なのね。"}, {"t": 393.1333333333333, "x": "2017年の夏。大阪桐蔭は甲子園で\n勝ち上がり、3回戦に進んだ。"}, {"t": 398.1166666666667, "x": "8月19日の3回戦。"}, {"t": 399.9, "x": "相手は宮城の仙台育英だ。"}, {"t": 401.85, "x": "大阪桐蔭は1対0とリードして9回裏の守りに入った。"}, {"t": 405.6, "x": "2死まで来た。あとアウト1つだった。"}, {"t": 407.98333333333335, "x": "そこから走者がたまって2死満塁になった。"}, {"t": 410.6333333333333, "x": "最後は2点を返されて、1対2の逆転サヨナラ負けだ。"}, {"t": 414.35, "x": "あと1つのアウトが遠かったのね。"}, {"t": 416.55, "x": "報道は「史上初となる2度目の甲子園春夏連覇」が\nここで消えた、と伝えた。"}, {"t": 421.71666666666664, "x": "この夏に優勝したのは埼玉の花咲徳栄だった。"}, {"t": 425.1166666666667, "x": "2回目の挑戦も夏の途中で止まった。"}, {"t": 427.76666666666665, "x": "1点差で終わるのは、くやしいわね。"}, {"t": 430.53333333333336, "x": "そして2018年の春。"}, {"t": 432.28333333333336, "x": "大阪桐蔭はまた選抜の決勝に進んだ。"}, {"t": 435.15, "x": "相手は和歌山の智弁和歌山。"}, {"t": 436.9, "x": "公式は「近畿勢対決となった決勝」と書く。"}, {"t": 440.23333333333335, "x": "4回表、大阪桐蔭は先に2点を取られた。"}, {"t": 443.4166666666667, "x": "その裏、内野ゴロと併殺打の間に\n1点ずつ返して、2対2に追いついた。"}, {"t": 448.18333333333334, "x": "7回に1点を勝ち越し、8回に2点を足した。"}, {"t": 451.35, "x": "5対2。最後の9回は0点に抑えた。"}, {"t": 454.15, "x": "先に取られても、ひっくり返したのね。"}, {"t": 456.75, "x": "公式は「2年連続3回目の優勝」と書いている。"}, {"t": 460.18333333333334, "x": "春を2年続けて勝つ選抜連覇は史上3校目だった。"}, {"t": 463.6666666666667, "x": "前の2校は兵庫の第一神港商と大阪のPL学園だ。"}, {"t": 467.3, "x": "第一神港商は1929年と1930年。"}, {"t": 471.05, "x": "PL学園は1981年と1982年だ。"}, {"t": 475.3, "x": "PL学園は、春夏連覇の前に春を\n2年続けて勝っていたのね。"}, {"t": 479.6666666666667, "x": "そうだ。PL学園の春夏連覇は、\nその5年後の1987年だ。"}, {"t": 484.81666666666666, "x": "春だけで見ても、めったに無い記録なのね。"}, {"t": 487.6, "x": "これで3回目の挑戦の年が来た。"}, {"t": 489.9, "x": "2年続けて挑戦できたのは大阪桐蔭が初めてだ。"}, {"t": 493.3833333333333, "x": "前の年は夏の3回戦で止まったのよね。"}, {"t": 496.21666666666664, "x": "ああ。まずは甲子園に出るところからだ。"}, {"t": 499.2, "x": "2018年の夏、大阪桐蔭は北大阪の代表を争った。"}, {"t": 503.43333333333334, "x": "7月27日の準決勝。"}, {"t": 505.46666666666664, "x": "相手は前の年の春の決勝で戦った履正社だ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
