<style>

<script>
const D={"name": "湘南", "file": "044_編集用", "dur": 722.15, "segs": [], "subs": [{"t": 0.0, "x": "2026年の11月に神奈川で\n野球のニュースがあったんでしょ？"}, {"t": 4.15, "x": "ああ。11月13日に神奈川県の高野連が発表をした。"}, {"t": 8.116666666666667, "x": "来年の春のセンバツの21世紀枠に推す学校だ。"}, {"t": 11.5, "x": "選ばれたのは、県立の湘南高校だ。"}, {"t": 14.166666666666666, "x": "湘南って、海のほうの？"}, {"t": 16.0, "x": "そうだ。学校は藤沢市の鵠沼にある。"}, {"t": 18.65, "x": "日本高野連の推薦校の一覧でも\n神奈川の欄に県立湘南とある。"}, {"t": 23.016666666666666, "x": "秋の県大会の成績はベスト16だ。"}, {"t": 25.766666666666666, "x": "ベスト16で推されるのね。"}, {"t": 27.633333333333333, "x": "21世紀枠は、2001年の大会から始まった仕組みだ。"}, {"t": 31.6, "x": "2020年のSPAIAの記事に、\n選ぶときの目安が書いてある。"}, {"t": 35.766666666666666, "x": "まず秋の県大会でベスト16より上に入っていること。"}, {"t": 39.21666666666667, "x": "そのうえで推す理由の例が並んでいる。"}, {"t": 41.31666666666667, "x": "部員が少ないなど苦しい中でがんばっていること。"}, {"t": 44.233333333333334, "x": "それに、勉強と部活動を両立していること、などだ。"}, {"t": 47.8, "x": "試合の勝ち負けだけで決める枠じゃないのね。"}, {"t": 50.45, "x": "湘南を推した理由は、勉強と野球を\n高いレベルで両立していること。"}, {"t": 54.6, "x": "スポニチはそう書いている。"}, {"t": 56.11666666666667, "x": "湘南が神奈川の推薦校に\n選ばれたのはこれが初めてだ。"}, {"t": 59.666666666666664, "x": "この日の発表で、全国の推薦校は\n45校になった、と野球の記事は書いている。"}, {"t": 64.93333333333334, "x": "1年前の神奈川の推薦校は川崎市立橘だった。"}, {"t": 68.7, "x": "そして同じ記事に、こうもある。"}, {"t": 70.65, "x": "選ばれれば、73年ぶりの甲子園になる。"}, {"t": 73.66666666666667, "x": "73年！ずいぶん前に出ていたのね。"}, {"t": 76.35, "x": "ああ。しかもこの学校は、\n初めての甲子園で全国優勝している。"}, {"t": 80.51666666666667, "x": "1949年の夏のことだ。"}, {"t": 83.13333333333334, "x": "えっ、初めて出て優勝したの？"}, {"t": 85.33333333333333, "x": "そうだ。そこで問題だ。"}, {"t": 87.03333333333333, "x": "1958年の2月、この学校で大きな火事があった。"}, {"t": 91.01666666666667, "x": "そのとき先生たちが何よりも先に\n持ち出そうとした物がある。"}, {"t": 94.75, "x": "それは何だと思う？"}, {"t": 96.11666666666666, "x": "火事のときに、真っ先に？"}, {"t": 97.7, "x": "大事な書類とか？"}, {"t": 99.11666666666666, "x": "答えは最後に言う。"}, {"t": 100.31666666666666, "x": "今回は、藤沢の県立高校が1949年に\n全国の頂点に立つまでと、そのあとを追っていく。"}, {"t": 107.06666666666666, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 110.5, "x": "よろしくね。"}, {"t": 112.0, "x": "まず学校の話からだ。"}, {"t": 113.65, "x": "学校の沿革によると、設立が\n許されたのは1920年の8月9日。"}, {"t": 118.91666666666667, "x": "学校が開いたのは1921年だ。"}, {"t": 121.75, "x": "そのころの名前は、神奈川県立湘南中学校。"}, {"t": 124.96666666666667, "x": "県の中で6番目にできた\n中学校だった、と地元の資料にある。"}, {"t": 129.18333333333334, "x": "100年以上前にできた学校なのね。"}, {"t": 131.61666666666667, "x": "その資料によるとこのあたりには\n海軍の偉い人の子どもが多かった。"}, {"t": 135.53333333333333, "x": "だから早くから、県立の中学校がほしいと\n言われていたそうだ。"}, {"t": 139.51666666666668, "x": "海の近くの町らしい話ね。"}, {"t": 141.65, "x": "沿革を見ると運動の場所も早くからそろえていった。"}, {"t": 144.73333333333332, "x": "1930年の7月にプールを\n造り始めて、11月にできあがった。"}, {"t": 149.61666666666667, "x": "1936年には、創立15周年の記念で\n体育館ができている。"}, {"t": 154.48333333333332, "x": "校風は文武両道。勉強も\n運動も、両方がんばる学校だ。"}, {"t": 158.36666666666667, "x": "戦争の前は海軍兵学校などに受かる\n生徒を多く出した、と同じ資料にある。"}, {"t": 163.18333333333334, "x": "その町らしい学校の歩みね。"}, {"t": 165.25, "x": "戦争が終わってすぐ、先に全国の頂点に\n立ったのはサッカー部だった。"}, {"t": 169.7, "x": "野球より先にサッカーなの？"}, {"t": 171.6, "x": "沿革には1946年に「蹴球部が全国制覇」とある。"}, {"t": 176.03333333333333, "x": "蹴球というのはサッカーのことだ。"}, {"t": 178.03333333333333, "x": "戦後で初めての全国大会、\n第1回の国体で優勝したんだ。"}, {"t": 182.2, "x": "日付は1946年の11月3日。"}, {"t": 185.2, "x": "場所は西宮球場と書いてある。"}, {"t": 187.5, "x": "野球場でサッカーの日本一になったのね。"}, {"t": 190.23333333333332, "x": "ああ。野球部より3年早い全国優勝だった。"}, {"t": 193.38333333333333, "x": "運動も強い学校だったのね。"}, {"t": 195.43333333333334, "x": "そして1948年の4月1日。"}, {"t": 198.4, "x": "学校の仕組みが変わって、名前が\n神奈川県立湘南高校になった。"}, {"t": 202.7, "x": "そして中学校から高校になった、その次の夏。"}, {"t": 206.0, "x": "それが1949年の夏だ。"}, {"t": 209.08333333333334, "x": "神奈川の代表になるのは大変そうね。"}, {"t": 211.63333333333333, "x": "実はその少し前に夏の大会の形が変わっている。"}, {"t": 215.03333333333333, "x": "日本高野連の大会小史を見てみよう。"}, {"t": 217.46666666666667, "x": "1948年の第30回大会のところにこうある。"}, {"t": 221.3, "x": "「神奈川、愛知、福岡を独立」。"}, {"t": 223.78333333333333, "x": "独立って、どういうこと？"}, {"t": 225.63333333333333, "x": "神奈川だけで、夏の代表を\n1校出せるようになったんだ。"}, {"t": 229.08333333333334, "x": "この年の夏の代表は全部で23校になった。"}, {"t": 232.21666666666667, "x": "日本高野連の表では、\n1948年の神奈川の代表は浅野学園だ。"}, {"t": 237.31666666666666, "x": "この年の大会小史には、もう\n1つ大事なことが書いてある。"}, {"t": 241.03333333333333, "x": "「公募で新大会歌を制定」。"}, {"t": 242.91666666666666, "x": "新しい大会の歌？"}, {"t": 244.48333333333332, "x": "「栄冠は君に輝く」という歌だ。"}, {"t": 246.76666666666668, "x": "Sportivaの記事によるとこの歌は1948年に作られた。"}, {"t": 250.91666666666666, "x": "朝日新聞がまず歌の言葉を広く集めて、\n選んだ言葉にメロディーを付けた。"}, {"t": 255.63333333333333, "x": "甲子園で聞くあの歌が、この年にできたのね。"}, {"t": 258.65, "x": "ちなみにこの1948年の優勝は、福岡の小倉だ。"}, {"t": 262.78333333333336, "x": "大会小史には、小倉の投手が\n5試合を全部0点に抑えたとある。"}, {"t": 266.8666666666667, "x": "前の年に続けての優勝だった。"}, {"t": 269.15, "x": "西の学校が強かった時代なのね。"}, {"t": 271.55, "x": "では神奈川の話に戻ろう。"}, {"t": 273.53333333333336, "x": "1948年の代表が浅野学園で、1949年が湘南なのね。"}, {"t": 279.1333333333333, "x": "そうだ。1949年の神奈川の欄には湘南の名前がある。"}, {"t": 283.4, "x": "神奈川が1つの県で\n代表を出すようになって、2年目の夏だった。"}, {"t": 287.7, "x": "まだ新しい仕組みのころだったのね。"}, {"t": 290.46666666666664, "x": "では1949年の夏の大会だ。"}, {"t": 293.15, "x": "第31回大会になる。"}, {"t": 295.1166666666667, "x": "日本高野連の表では、全国から参加したのは1365校。"}, {"t": 299.56666666666666, "x": "甲子園に来られたのは、そのうちの23校だけだ。"}, {"t": 302.93333333333334, "x": "1365校から23校！"}, {"t": 305.21666666666664, "x": "すごく少ないのね。"}, {"t": 306.7, "x": "この大会はいろいろ新しいことがあった年でもある。"}, {"t": 309.6333333333333, "x": "大会小史によると甲子園に\nラッキーゾーンができたのがこの年だ。"}, {"t": 313.53333333333336, "x": "ラッキーゾーンって何？"}, {"t": 314.98333333333335, "x": "外野のフェンスの手前にもう1つ作った柵のことだ。"}, {"t": 318.18333333333334, "x": "そこを越えればホームランになる。"}, {"t": 319.9166666666667, "x": "ボールも良くなって、この大会のホームランは\n合わせて9本だった。"}, {"t": 323.68333333333334, "x": "入場行進で、女子高校生が先頭を\n歩くことも、この年に始まった。"}, {"t": 328.4, "x": "いまにつながることが、この年に始まったのね。"}, {"t": 331.43333333333334, "x": "では湘南の試合を順に見ていこう。"}, {"t": 333.5, "x": "代表は23校だから、全部の学校が\n1回戦から戦うわけではない。"}, {"t": 338.0833333333333, "x": "記録のサイトでは湘南の最初の試合は\n2回戦になっている。"}, {"t": 341.6666666666667, "x": "その2回戦で、徳島の城東に9対3で勝った。"}, {"t": 345.1666666666667, "x": "初めての甲子園で9点も取ったのね。"}, {"t": 347.75, "x": "準々決勝は、長野の松本市立。2対1で勝った。"}, {"t": 351.53333333333336, "x": "準決勝は香川の高松一。これが\nいちばん苦しい試合だった。"}, {"t": 355.45, "x": "2対2のまま延長に入って、10回の裏だ。"}, {"t": 358.3666666666667, "x": "湘南が1点を取って、3対2のサヨナラ勝ちになった。"}, {"t": 361.96666666666664, "x": "1点差が2つも続いたのね。"}, {"t": 364.1, "x": "そして決勝の相手は岐阜だ。"}, {"t": 365.95, "x": "湘南は5対3で勝った。"}, {"t": 367.76666666666665, "x": "本当に初めての甲子園で優勝しちゃったのね！"}, {"t": 370.8, "x": "学校の沿革には、1949年8月20日に\n甲子園で全国優勝と書いてある。"}, {"t": 376.6, "x": "SPAIAの記事はこのときの湘南を\n「創部4年目」と紹介している。"}, {"t": 381.25, "x": "野球部ができてすぐの優勝なのね。"}, {"t": 384.06666666666666, "x": "この優勝には、もう1つ意味がある。"}, {"t": 386.31666666666666, "x": "大会小史にはこう書いてある。"}, {"t": 388.1333333333333, "x": "湘南が勝って、優勝旗は21年ぶりに\n東日本の学校へ渡った。"}, {"t": 392.8, "x": "21年も西の学校ばかりが勝っていたの？"}, {"t": 395.73333333333335, "x": "その前に東日本の学校が\n勝ったのは、1928年の松本商だ。"}, {"t": 400.8, "x": "長野の松本商のことは前に松商学園の回で話した。"}, {"t": 404.7, "x": "それ以来の東の優勝だったのね。"}, {"t": 407.06666666666666, "x": "1929年から1948年までの夏の優勝は、\nずっと西の学校だったわけだ。"}, {"t": 413.28333333333336, "x": "ああ。それに、神奈川の学校が夏に\n全国優勝したのも、これが最初だ。"}, {"t": 418.0, "x": "2026年の野球の記事でも\n神奈川の夏の優勝は8回とまとめている。"}, {"t": 422.68333333333334, "x": "1949年の湘南から始まって、法政二、\n東海大相模、桐蔭学園、横浜、慶応と続く。"}, {"t": 430.01666666666665, "x": "神奈川の8回の優勝の、いちばん最初が湘南なのね。"}, {"t": 433.7, "x": "そうだ。強い私立が並ぶ前に、\n県立の学校が最初の旗を持ち帰ったんだ。"}, {"t": 438.73333333333335, "x": "優勝したあと、学校は何か変わったの？"}, {"t": 441.48333333333335, "x": "沿革では、1950年3月22日に男女共学になっている。"}, {"t": 446.15, "x": "1957年には、埼玉県立浦和高校と\n1回目の定期戦を開いた。"}, {"t": 451.31666666666666, "x": "定期戦というのは、決まった相手と\n毎年のように戦う試合のことだ。"}, {"t": 455.6333333333333, "x": "勉強の強い学校どうしの試合ね。"}, {"t": 458.46666666666664, "x": "どんな選手がいたチームなの？"}, {"t": 460.3333333333333, "x": "今回は名前ではなく、その後の肩書きで紹介しよう。"}, {"t": 463.6666666666667, "x": "デイリースポーツの記事によると、三塁を\n守っていたのは、のちの日本高野連の会長だ。"}, {"t": 469.01666666666665, "x": "第5代の会長になった人だ。"}, {"t": 471.18333333333334, "x": "高校野球をまとめる側の、いちばん上の人ね。"}, {"t": 474.28333333333336, "x": "ああ。甲子園で優勝した選手が、のちに\n大会を開く側の長になったわけだ。"}, {"t": 479.0833333333333, "x": "左翼を守っていたのは、のちに\nプロ野球の選手になった人だ。"}, {"t": 482.9166666666667, "x": "SPAIAはプロ野球の中継の番組でも\n知られた人と紹介している。"}, {"t": 487.4166666666667, "x": "同じチームから、いろいろな道に進んだ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
