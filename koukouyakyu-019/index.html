<title>怪物と呼ばれた投手たち</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}

<script>
const D={"name": "怪物と呼ばれた投手たち", "file": "019_編集用", "dur": 852.8, "segs": [], "subs": [{"t": 0.0, "x": "1998年8月22日。"}, {"t": 2.683333333333333, "x": "夏の甲子園の決勝だ。"}, {"t": 4.45, "x": "マウンドにいたのは、横浜高校のエース、松坂大輔。"}, {"t": 8.133333333333333, "x": "9回、最後の打者をスライダーで空振り三振。"}, {"t": 11.033333333333333, "x": "相手の京都成章に、ヒットを1本も打たせなかった。"}, {"t": 14.416666666666666, "x": "決勝でノーヒットノーラン？"}, {"t": 16.1, "x": "ああ。しかもこの投手は2日前に250球を投げている。"}, {"t": 19.883333333333333, "x": "250球？　1試合で？"}, {"t": 21.916666666666668, "x": "1試合でだ。延長17回を、ひとりで投げきった。"}, {"t": 25.3, "x": "そして前の日には、6点差を\nひっくり返す試合があった。"}, {"t": 28.933333333333334, "x": "3日続けて、そんな試合をしていたのね。"}, {"t": 31.683333333333334, "x": "そうだ。この投手は「平成の怪物」と呼ばれた。"}, {"t": 35.1, "x": "怪物……。高校生につける呼び名じゃないわね。"}, {"t": 37.93333333333333, "x": "ところが甲子園には、そう呼ばれた投手が何人もいる。"}, {"t": 41.18333333333333, "x": "今日出てくるのは4人。"}, {"t": 42.36666666666667, "x": "1958年の板東英二、1961年の尾崎行雄。"}, {"t": 47.083333333333336, "x": "1973年の江川卓。そして1998年の松坂大輔だ。"}, {"t": 52.78333333333333, "x": "昭和から平成まで、40年にまたがっているのね。"}, {"t": 56.1, "x": "そして彼らの数字の中には、今も\n破られていないものがある。"}, {"t": 60.38333333333333, "x": "どんな数字なの？"}, {"t": 61.65, "x": "まず夏の大会で1人が取った\n三振の数。最多は83個だ。"}, {"t": 65.93333333333334, "x": "次に春の選抜で1人が取った三振の数。最多は60個。"}, {"t": 70.05, "x": "そして夏の決勝でのノーヒットノーラン。"}, {"t": 72.55, "x": "ノーヒットノーランって、ヒットも\n点も許さずに勝つことよね。"}, {"t": 76.21666666666667, "x": "そうだ。夏の決勝でこれをやった\n例は、松坂の前は1939年。"}, {"t": 81.1, "x": "そこから59年、だれも並ばなかった。"}, {"t": 83.9, "x": "83個と60個は、いつの記録なの？"}, {"t": 86.88333333333334, "x": "83個は1958年。"}, {"t": 89.13333333333334, "x": "60個は1973年だ。"}, {"t": 91.76666666666667, "x": "どっちも、50年以上前じゃない。"}, {"t": 94.01666666666667, "x": "ああ。なぜ、こんなに長く破られないのか。"}, {"t": 96.65, "x": "今日は、怪物と呼ばれた投手たちを年の順に追う。"}, {"t": 99.75, "x": "そして最後に、その「なぜ」に答えを出す。"}, {"t": 102.81666666666666, "x": "答えまで見せてくれるのね。"}, {"t": 104.6, "x": "数字は、大会の記録と新聞・\n雑誌の記事で確かめたものだけを使う。"}, {"t": 109.76666666666667, "x": "1人目は1958年の夏。"}, {"t": 112.15, "x": "徳島商のエース、板東英二だ。"}, {"t": 114.56666666666666, "x": "のちにテレビでもよく見た人よね。"}, {"t": 116.75, "x": "そうだ。プロの中日でも投げた。"}, {"t": 118.86666666666666, "x": "ただ今日の話は1958年の夏だけにしぼる。"}, {"t": 122.43333333333334, "x": "この夏、徳島商は準々決勝まで勝ち進んだ。"}, {"t": 125.76666666666667, "x": "板東はそこまでで、もう32個の三振を取っていた。"}, {"t": 129.28333333333333, "x": "まだ準々決勝の前なのに？"}, {"t": 131.3, "x": "ああ。本当にすごいのは、ここからだ。"}, {"t": 133.66666666666666, "x": "この夏の徳島商は、8月16日から\n3日続けて試合をすることになる。"}, {"t": 138.76666666666668, "x": "3日続けて？　その全部を板東が投げたの？"}, {"t": 141.7, "x": "投げた。そのあとに決勝もある。"}, {"t": 143.61666666666667, "x": "順番に見ていこう。"}, {"t": 145.56666666666666, "x": "準々決勝の相手は、富山の魚津。"}, {"t": 148.0, "x": "魚津のエースは村椿。この人も最後まで投げ続けた。"}, {"t": 151.51666666666668, "x": "試合は0対0のまま、9回を終える。"}, {"t": 153.98333333333332, "x": "10回も0点。11回も0点。"}, {"t": 156.36666666666667, "x": "どっちも点が入らないのね。"}, {"t": 158.21666666666667, "x": "結局18回を終えても0対0のままだった。"}, {"t": 161.2, "x": "この試合は引き分け。"}, {"t": 162.41666666666666, "x": "翌日に再試合となった。"}, {"t": 164.4, "x": "18回で打ち切りになったのね。"}, {"t": 166.56666666666666, "x": "ああ。この夏から、延長は18回で\n打ち切る決まりができていた。"}, {"t": 170.56666666666666, "x": "その決まりのきっかけも板東なんだが、\nそこは別の回で話した。"}, {"t": 174.51666666666668, "x": "この試合で板東が取った三振は、25個だ。"}, {"t": 177.6, "x": "1試合で25個も？"}, {"t": 179.2, "x": "延長をふくめた1試合の三振として、\n記事では「史上最多」と書かれている。"}, {"t": 184.16666666666666, "x": "延長をふくめた、っていうのは？"}, {"t": 186.1, "x": "9回までの記録とは分けて、\n「参考記録」として数えるんだ。"}, {"t": 190.05, "x": "18回を投げて、打たれたヒットは6本だけだった。"}, {"t": 193.43333333333334, "x": "それを高校生がひとりで投げたのね。"}, {"t": 195.78333333333333, "x": "魚津の村椿も18回を投げて、打たれたヒットは7本。"}, {"t": 199.33333333333334, "x": "三振は9個だった。"}, {"t": 200.98333333333332, "x": "相手のエースも、一歩も引かなかったのね。"}, {"t": 203.68333333333334, "x": "ああ。0対0のまま18回。"}, {"t": 205.65, "x": "2人とも、点を1点も与えなかった。"}, {"t": 208.85, "x": "翌日の8月17日。魚津との再試合だ。"}, {"t": 212.08333333333334, "x": "記事によると、板東は肩の痛みをかかえていた。"}, {"t": 215.05, "x": "それでもこの日も最後まで投げた。"}, {"t": 217.06666666666666, "x": "結果は3対1。徳島商の勝ちだ。"}, {"t": 219.63333333333333, "x": "この試合でも9個の三振を取った。"}, {"t": 221.85, "x": "ここまでの合計で66個。"}, {"t": 223.63333333333333, "x": "大会の記録を塗りかえた。"}, {"t": 225.53333333333333, "x": "まだ準決勝と決勝が残っているのに？"}, {"t": 228.15, "x": "そうだ。次の日、8月18日が準決勝。"}, {"t": 231.45, "x": "相手は栃木の作新学院だった。"}, {"t": 233.8, "x": "作新学院……どこかで聞いた名前ね。"}, {"t": 236.35, "x": "あとで出てくる。覚えておいてくれ。"}, {"t": 238.33333333333334, "x": "板東はこの日も投げて、4対1で勝った。三振は14個。"}, {"t": 242.43333333333334, "x": "3日続けて投げて、まだ14個も取るの？"}, {"t": 245.31666666666666, "x": "ああ。そして決勝。相手は山口の柳井だった。"}, {"t": 248.38333333333333, "x": "ここで徳島商は0対7で敗れた。"}, {"t": 250.98333333333332, "x": "最後は力が残っていなかったのかしら。"}, {"t": 253.6, "x": "記事の中にはそう書くものもある。結果は準優勝だ。"}, {"t": 256.8833333333333, "x": "それでも6試合で取った三振は、合わせて83個。"}, {"t": 260.31666666666666, "x": "これが今も、\n夏の大会の1人の最多記録として残っている。"}, {"t": 264.4, "x": "1958年から、ずっと？"}, {"t": 266.96666666666664, "x": "ずっとだ。2019年の記事でも\n「未だに破られていない」と書かれている。"}, {"t": 271.6, "x": "板東は、今年2026年の7月22日に86歳で亡くなった。"}, {"t": 276.6666666666667, "x": "訃報を伝える記事も、まず\n83奪三振のことを書いていた。"}, {"t": 281.28333333333336, "x": "2人目は短く紹介する。"}, {"t": 283.0, "x": "1961年の夏、大阪の浪商だ。"}, {"t": 286.3666666666667, "x": "エースは2年生の尾崎行雄。"}, {"t": 288.03333333333336, "x": "「怪童」と呼ばれた投手だ。"}, {"t": 289.96666666666664, "x": "怪物じゃなくて、怪童なのね。"}, {"t": 292.1666666666667, "x": "ああ。この夏、準決勝で法政二と\n延長11回を戦って勝った。"}, {"t": 296.55, "x": "決勝の相手は和歌山の桐蔭。"}, {"t": 298.31666666666666, "x": "1対0で勝って優勝した。"}, {"t": 300.4, "x": "2年生で日本一ね。"}, {"t": 302.1166666666667, "x": "そして尾崎は、高校2年の秋に学校を\nやめて、プロの東映に入った。"}, {"t": 306.68333333333334, "x": "3年生の夏を待たずに？"}, {"t": 308.51666666666665, "x": "そうだ。浪商と尾崎の話は、くわしくは別の回でやる。"}, {"t": 312.21666666666664, "x": "今日は先へ進もう。次が、元祖の「怪物」だ。"}, {"t": 316.28333333333336, "x": "3人目は栃木の作新学院。"}, {"t": 318.23333333333335, "x": "エースは江川卓だ。"}, {"t": 319.8, "x": "あ、さっきの作新学院！"}, {"t": 321.6666666666667, "x": "そうだ。板東に準決勝で負けた学校だ。"}, {"t": 324.45, "x": "その作新学院に、15年ほどあと、怪物があらわれた。"}, {"t": 328.2, "x": "記事では「元祖怪物」と呼ばれている。"}, {"t": 330.8666666666667, "x": "元祖ってことは、この人がいちばん最初の怪物なのね。"}, {"t": 334.51666666666665, "x": "そう言われることが多い。"}, {"t": 335.7, "x": "数字を見れば、理由がわかる。"}, {"t": 337.65, "x": "まず1年生の秋。関東大会の前橋工との試合だ。"}, {"t": 341.26666666666665, "x": "江川は1回の3つ目のアウトから、\n10人続けて三振を取った。"}, {"t": 345.4, "x": "10人続けて？"}, {"t": 346.68333333333334, "x": "本人もこの時の球を、\nいちばんよかった球にあげている。"}, {"t": 350.15, "x": "それから高校の公式戦で打たれたホームランは0本だ。"}, {"t": 353.6166666666667, "x": "1本も？"}, {"t": 354.51666666666665, "x": "本人がインタビューで、そう答えている。"}, {"t": 356.81666666666666, "x": "ちなみにすごいのは野球だけではない。"}, {"t": 358.95, "x": "入学してすぐの試験で、\n学年1番だったと本人が話している。"}, {"t": 363.26666666666665, "x": "勉強もできたの？"}, {"t": 364.6333333333333, "x": "そうらしい。話を野球に戻そう。"}, {"t": 366.8, "x": "次に高校2年の夏の栃木大会を見てみよう。"}, {"t": 369.78333333333336, "x": "江川は3試合続けてノーヒットノーランをした。"}, {"t": 372.65, "x": "3試合続けて？"}, {"t": 374.01666666666665, "x": "ああ。3試合続けて、ヒットも点も許さなかった。"}, {"t": 377.3333333333333, "x": "4試合目は小山高校。ここでも10回の2\nアウトまでヒットを打たれなかった。"}, {"t": 381.9166666666667, "x": "じゃあ4試合続けて……？"}, {"t": 383.45, "x": "いや。延長11回、スクイズで1点を取られて負けた。"}, {"t": 386.9, "x": "この夏は、甲子園に行けなかったんだ。"}, {"t": 389.43333333333334, "x": "ヒットをほとんど打たれないのに、\n負けることがあるのね。"}, {"t": 393.1, "x": "そして高校3年の春。"}, {"t": 394.6666666666667, "x": "1973年の選抜大会だ。"}, {"t": 397.5, "x": "ここで江川の名前は、全国に広まった。"}, {"t": 400.21666666666664, "x": "1回戦は大阪の北陽。"}, {"t": 401.85, "x": "2対0で勝った。三振は19個。"}, {"t": 404.51666666666665, "x": "初戦から19個……。"}, {"t": 405.98333333333335, "x": "2回戦は福岡の小倉南。"}, {"t": 407.8833333333333, "x": "8対0で勝った。三振は10個。"}, {"t": 410.3833333333333, "x": "準々決勝は愛媛の今治西。"}, {"t": 412.4166666666667, "x": "3対0で勝った。三振は20個。"}, {"t": 415.1166666666667, "x": "3試合とも0点に抑えているのね。"}, {"t": 417.46666666666664, "x": "ああ。そして準決勝は広島商。"}, {"t": 419.75, "x": "広島商はボールをよく見て、なかなか\n手を出さない作戦をとった。"}, {"t": 423.65, "x": "ここで作新学院は1対2で負けた。"}, {"t": 425.96666666666664, "x": "三振は11個だった。"}, {"t": 427.73333333333335, "x": "負けた試合でも11個取っているのね。"}, {"t": 430.1333333333333, "x": "4試合の三振を足すと、19と10と20と11。"}, {"t": 433.75, "x": "えっと……60個？"}, {"t": 435.23333333333335, "x": "そうだ。これが今も、春の選抜の1人の最多記録だ。"}, {"t": 438.95, "x": "2023年の記事でも\n「現在も大会記録」と書かれている。"}, {"t": 443.25, "x": "優勝していないのに、記録はいちばんなのね。"}, {"t": 446.0833333333333, "x": "ああ。それも4試合だけでの数字だ。 function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
