<script>
const D={"name": "智弁対決の夏", "file": "038_編集用", "dur": 708.36665625, "segs": [], "subs": [{"t": 0.0, "x": "夏の甲子園の決勝で、名前のよく\n似た2校が向かい合った年がある。"}, {"t": 4.283333333333333, "x": "名前が似てるって、どのくらい？"}, {"t": 6.333333333333333, "x": "2校とも、頭に同じ「智弁」の2文字がつく。"}, {"t": 9.533333333333333, "x": "和歌山の智弁和歌山と、奈良の智弁学園だ。"}, {"t": 12.7, "x": "ほとんど同じ名前じゃない。それっていつの話？"}, {"t": 15.666666666666666, "x": "2021年8月29日。"}, {"t": 17.883333333333333, "x": "阪神甲子園球場で行われた決勝だ。"}, {"t": 20.65, "x": "ああ。日本高等学校野球連盟は、\n大会ごとの出来事を「大会小史」にまとめている。"}, {"t": 26.333333333333332, "x": "その2021年の欄には、こう書いてある。"}, {"t": 29.166666666666668, "x": "決勝では、智弁和歌山と\n智弁学園の「智弁」対決となった。"}, {"t": 33.38333333333333, "x": "そして9対2で智弁和歌山が\n21年ぶり3度目の優勝を果たした、と。"}, {"t": 38.13333333333333, "x": "公式の記録にも「智弁」対決って\nかぎかっこで書いてあるのね。"}, {"t": 42.25, "x": "そうだ。わざわざ名前をくくって書いている。"}, {"t": 44.86666666666667, "x": "でも名前の似た2校が、どうして\n同じ年の決勝で会えたの？"}, {"t": 48.5, "x": "たまたまにしては、できすぎている気がするわ。"}, {"t": 51.3, "x": "その答えは、決勝の1試合だけを見ても分からない。"}, {"t": 54.45, "x": "この夏に勝ち残った学校を、順に並べると見えてくる。"}, {"t": 57.916666666666664, "x": "今回はこの「智弁」\n対決ができるまでを、日付と点数で辿る。"}, {"t": 62.15, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 65.56666666666666, "x": "よろしくね。"}, {"t": 67.06666666666666, "x": "まず名前の書き方から見ておこう。"}, {"t": 69.1, "x": "大会小史では、2校とも「智弁」と書かれている。"}, {"t": 72.35, "x": "ところが日本高野連の2021年の大会のページは、\n少しちがう。"}, {"t": 76.86666666666666, "x": "そこでは「智辯和歌山」と「智辯学園」と書いてある。"}, {"t": 80.53333333333333, "x": "「べん」の字が、むずかしいほうになっているのね。"}, {"t": 83.38333333333334, "x": "ああ。学校の正式な名前には、\nこのむずかしいほうの字が使われている。"}, {"t": 87.63333333333334, "x": "2校を作ったのは同じ1つの学校法人だ。"}, {"t": 90.55, "x": "奈良の智弁学園が先にできて、\n和歌山の智弁和歌山があとからできた。"}, {"t": 95.1, "x": "じゃあ兄弟みたいな学校なのね。"}, {"t": 97.2, "x": "そういうことだ。ただし2校の歩みは、\n前の回でくわしく話した。"}, {"t": 101.21666666666667, "x": "今回は2021年の夏、\nこの1大会の記録だけを見ていく。"}, {"t": 105.6, "x": "同じ公式でもページによって字が\nちがうのはおもしろいわね。"}, {"t": 109.05, "x": "読みはどちらも「ちべん」だ。"}, {"t": 110.86666666666666, "x": "この回の中では、大会小史に\n合わせて「智弁」と呼ぶことにする。"}, {"t": 115.15, "x": "分かったわ。"}, {"t": 116.58333333333333, "x": "次に、2021年の夏が\nどんな大会だったかを確かめておく。"}, {"t": 120.8, "x": "この年は第103回大会だ。"}, {"t": 122.95, "x": "その前の2020年は、新型コロナウイルスの広がりで\n大会が中止になった。"}, {"t": 128.01666666666668, "x": "じゃあ2年ぶりの夏の甲子園だったのね。"}, {"t": 130.56666666666666, "x": "ああ。ただし大会小史には、いつもと\nちがう点がいくつも書いてある。"}, {"t": 134.53333333333333, "x": "観客席に入れたのは学校の関係者だけだった。"}, {"t": 137.63333333333333, "x": "一般のお客さんの入場は見送られた。"}, {"t": 140.16666666666666, "x": "スタンドにふつうのお客さんがいなかったのね。"}, {"t": 142.88333333333333, "x": "そうだ。選手や関係者は、\n大会の前から検査を受けていた。"}, {"t": 146.78333333333333, "x": "さらに雨が続き、試合ののびた\n回数は過去最多の7度になった。"}, {"t": 151.0, "x": "7度も！　それで決勝が8月29日になったのね。"}, {"t": 154.65, "x": "ああ。予定から4日遅れた。ここは\nショートでもくわしく話している。"}, {"t": 158.56666666666666, "x": "休養日も準々決勝のあとの1日しか\nとれなかった、と書いてある。"}, {"t": 162.81666666666666, "x": "選手にとってはきびしい日程ね。"}, {"t": 164.98333333333332, "x": "そんな夏に、49の代表校が甲子園で日本一を争った。"}, {"t": 169.18333333333334, "x": "ここから勝ち残った学校を見ていこう。"}, {"t": 171.43333333333334, "x": "注目するのは近畿の学校だ。"}, {"t": 174.11666666666667, "x": "近畿ってどの府県のこと？"}, {"t": 175.93333333333334, "x": "京都、大阪、兵庫、奈良、和歌山、滋賀の2府4県だ。"}, {"t": 180.05, "x": "この夏はそれぞれから1校ずつが出ている。"}, {"t": 182.51666666666668, "x": "京都は京都国際。大阪は大阪桐蔭。"}, {"t": 185.08333333333334, "x": "兵庫は神戸国際大付。"}, {"t": 186.81666666666666, "x": "奈良は智弁学園。和歌山は\n智弁和歌山。滋賀は近江だ。"}, {"t": 190.55, "x": "全部で6校ね。"}, {"t": 191.85, "x": "ああ。49校のうちの6校だ。"}, {"t": 194.11666666666667, "x": "京都国際はこの夏が初めての出場だった。"}, {"t": 197.25, "x": "初めて出た学校もいたのね。"}, {"t": 199.21666666666667, "x": "この6校の勝ち負けを、\n試合の結果の一覧で追ってみる。"}, {"t": 202.68333333333334, "x": "まず奈良の智弁学園。"}, {"t": 203.96666666666667, "x": "1回戦で岡山の倉敷商に10対3で勝った。"}, {"t": 207.26666666666668, "x": "2回戦は神奈川の横浜に5対0。"}, {"t": 209.6, "x": "3回戦は山梨の日本航空に7対1だ。"}, {"t": 212.78333333333333, "x": "3つとも、はっきり勝っているのね。"}, {"t": 215.08333333333334, "x": "次に京都国際。最初の試合は2回戦だった。"}, {"t": 218.28333333333333, "x": "その2回戦で、群馬の前橋育英に1対0で勝った。"}, {"t": 221.88333333333333, "x": "3回戦は東京の二松学舎大付に6対4だ。"}, {"t": 225.21666666666667, "x": "初めての夏で2つも勝ったのね。"}, {"t": 227.55, "x": "兵庫の神戸国際大付は、\n1回戦で北海道の北海に2対1。"}, {"t": 231.81666666666666, "x": "2回戦は山口の高川学園に4対3。"}, {"t": 234.53333333333333, "x": "3回戦は長崎商に6対5だ。"}, {"t": 237.1, "x": "3試合とも1点差じゃない。"}, {"t": 238.95, "x": "ああ。接戦を3つ続けて勝ち抜いた。"}, {"t": 242.03333333333333, "x": "残る3校のうち、2校は2回戦でぶつかった。"}, {"t": 245.06666666666666, "x": "滋賀の近江と大阪の大阪桐蔭だ。"}, {"t": 247.41666666666666, "x": "近畿の学校どうしがもう当たっちゃったの？"}, {"t": 249.91666666666666, "x": "そうだ。近江は1回戦で、\n福島の日大東北に8対2で勝っていた。"}, {"t": 254.61666666666667, "x": "大阪桐蔭は1回戦で、\n東京の東海大菅生に7対4で勝っていた。"}, {"t": 259.18333333333334, "x": "そして8月23日の2回戦。"}, {"t": 261.45, "x": "近江が6対4で大阪桐蔭に勝った。"}, {"t": 264.06666666666666, "x": "近畿の6校のうち、ここで1校がいなくなったのね。"}, {"t": 267.3833333333333, "x": "ああ。ただし負けた相手も近畿の学校だ。"}, {"t": 270.1, "x": "あ、そういうことね。"}, {"t": 271.5, "x": "近江は3回戦でも、岩手の盛岡大付に7対4で勝った。"}, {"t": 275.5, "x": "じゃあ和歌山の智弁和歌山は？"}, {"t": 277.4166666666667, "x": "智弁和歌山の最初の相手は、宮崎商のはずだった。"}, {"t": 280.81666666666666, "x": "ところが宮崎商は、初戦を戦わずに出場を取りやめた。"}, {"t": 284.56666666666666, "x": "大会小史は選手の感染によるものと書いている。"}, {"t": 287.5833333333333, "x": "そのため2回戦は試合をせずに、\n智弁和歌山の不戦勝になった。"}, {"t": 291.68333333333334, "x": "試合をしないまま次に進んだのね。"}, {"t": 293.98333333333335, "x": "ああ。最初の試合は8月24日の3回戦だ。"}, {"t": 297.31666666666666, "x": "相手は香川の高松商。"}, {"t": 298.8666666666667, "x": "智弁和歌山が5対3で勝った。"}, {"t": 301.1, "x": "初めての試合がもう3回戦だったのね。"}, {"t": 303.76666666666665, "x": "そうだ。8月10日の開幕から、2週間がたっていた。"}, {"t": 308.1333333333333, "x": "3回戦が終わると、勝ち残りは8校になった。"}, {"t": 311.18333333333334, "x": "その8校のうち、近畿の学校はいくつあったと思う？"}, {"t": 314.51666666666665, "x": "近畿は6校出ていて、1校は2回戦で負けたのよね。"}, {"t": 317.8833333333333, "x": "ということは……5校全部が残ったの？"}, {"t": 320.3333333333333, "x": "そうだ。京都国際、神戸国際大付、\n近江、智弁学園、智弁和歌山。"}, {"t": 325.23333333333335, "x": "8強のうち5校が近畿の学校だった。"}, {"t": 327.78333333333336, "x": "報道は同じ地方から5校が準々決勝に\n進んだのは史上初めて、と伝えている。"}, {"t": 332.98333333333335, "x": "史上初めて！　8校の半分より多いじゃない。"}, {"t": 335.9166666666667, "x": "ああ。残る3校は福井の敦賀気比、\n島根の石見智翠館、高知の明徳義塾だ。"}, {"t": 341.3, "x": "近畿の6校で負けたのは、近畿の相手に\n負けた大阪桐蔭だけなのね。"}, {"t": 345.78333333333336, "x": "そういうことだ。近畿の外の学校には、\nここまで1つも負けていない。"}, {"t": 350.1666666666667, "x": "すごい勝ちっぷりね。"}, {"t": 351.56666666666666, "x": "そして準々決勝の組み合わせでは、\n近畿どうしの対戦は1つだけだった。"}, {"t": 356.1166666666667, "x": "神戸国際大付と近江の試合だ。"}, {"t": 358.35, "x": "じゃあほかの3試合で近畿が全部勝てば……。"}, {"t": 360.9, "x": "4強が全部近畿の学校になる。"}, {"t": 363.1, "x": "報道は準々決勝の前から、その見込みを書いていた。"}, {"t": 366.6, "x": "準々決勝の日は、近畿の人たちは\nどきどきしていたでしょうね。"}, {"t": 370.6333333333333, "x": "それは記録には書いていない。\nここは点数だけを見ていこう。"}, {"t": 374.6, "x": "準々決勝は8月26日に、4試合が行われた。"}, {"t": 378.45, "x": "第1試合は京都国際と敦賀気比だ。"}, {"t": 381.0, "x": "京都国際は8回に先に点を\n取られたが、すぐに追いついた。"}, {"t": 384.8333333333333, "x": "そして9回にサヨナラ勝ち。3対2だった。"}, {"t": 387.85, "x": "初めての夏でベスト4まで来ちゃったのね。"}, {"t": 390.5833333333333, "x": "ああ。第2試合は智弁和歌山と石見智翠館だ。"}, {"t": 393.5833333333333, "x": "智弁和歌山が9対1で勝った。"}, {"t": 395.81666666666666, "x": "こっちは大差ね。"}, {"t": 397.06666666666666, "x": "第3試合は智弁学園と明徳義塾だ。"}, {"t": 399.76666666666665, "x": "智弁学園は1点を追う9回の裏に\n逆転して、3対2のサヨナラ勝ち。"}, {"t": 404.4166666666667, "x": "またサヨナラなの？"}, {"t": 405.73333333333335, "x": "ああ。この試合のくわしい\n流れは、前の回で話している。"}, {"t": 409.1333333333333, "x": "最後の第4試合が、\n近畿どうしの神戸国際大付と近江だ。"}, {"t": 412.9166666666667, "x": "この試合も近江のサヨナラ勝ちで、7対6だった。"}, {"t": 416.18333333333334, "x": "4試合のうち3試合がサヨナラ？"}, {"t": 418.3666666666667, "x": "そうだ。点差は順に1点、8点、1点、1点だ。"}, {"t": 422.0833333333333, "x": "そして勝ったのは全部近畿の学校ね。"}, {"t": 424.6333333333333, "x": "ああ。4強は京都国際、\n智弁和歌山、智弁学園、近江。"}, {"t": 428.65, "x": "4校とも近畿の学校になった。"}, {"t": 430.9166666666667, "x": "本当に近畿だけの準決勝になったのね。"}, {"t": 433.73333333333335, "x": "2026年の夏の報道にも、この2021年が出てくる。"}, {"t": 437.95, "x": "4強を近畿勢で独占した21年という書き方だ。"}, {"t": 441.5833333333333, "x": "あとから振り返っても、そう書かれる年なのね。"}, {"t": 444.53333333333336, "x": "そして準々決勝の次の日が、\nこの夏ただ1日の休養日だった。"}, {"t": 448.8833333333333, "x": "8月27日に休んで、8月28日が準決勝だ。"}, {"t": 453.81666666666666, "x": "準決勝の組み合わせは近江と智弁和歌山。\nそして智弁学園と京都国際だ。"}, {"t": 458.81666666666666, "x": "「智弁」どうしは別の山に分かれていたのね。"}, {"t": 461.56666666666666, "x": "ああ。2校とも勝てば決勝で会うことになる。"}, {"t": 464.2, "x": "第1試合は、智弁和歌山が近江に5対1で勝った。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
