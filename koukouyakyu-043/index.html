<script>
const D={"name": "下関商", "file": "043_編集用", "dur": 720.11665625, "segs": [], "subs": [{"t": 0.0, "x": "センバツの優勝旗ってずっと同じ旗なの？"}, {"t": 2.6666666666666665, "x": "いや。1963年に新しく作り直されている。"}, {"t": 6.383333333333334, "x": "日本高野連の大会小史には\n「新調の二代目優勝旗」と書いてある。"}, {"t": 10.983333333333333, "x": "その二代目の旗を最初に受け取ったのはどこ？"}, {"t": 13.85, "x": "山口県の下関商だ。下関市にある市立の商業高校だ。"}, {"t": 18.366666666666667, "x": "公立の商業高校が新しい旗の最初の持ち主なのね。"}, {"t": 22.116666666666667, "x": "ああ。古い旗は傷みがひどくて、日本高野連が\n永久保存にした、とも書いてある。"}, {"t": 27.416666666666668, "x": "古い旗はしまわれて、新しい旗が下関に行ったのね。"}, {"t": 31.2, "x": "そしてこの1963年、下関商は\n春だけで終わらなかった。"}, {"t": 35.78333333333333, "x": "そこで問題だ。この年、下関商は\n全国の大会でいくつの結果を残したと思う？"}, {"t": 41.38333333333333, "x": "春に優勝したならそれだけでもすごいわよね。"}, {"t": 44.166666666666664, "x": "答えは最後に言う。"}, {"t": 45.35, "x": "今回は、港町の商業学校が\n1963年にたどり着くまでを、\n学校の新聞と公式の表で追っていく。"}, {"t": 52.7, "x": "学校の新聞？"}, {"t": 53.93333333333333, "x": "下関商の公式サイトに、学校の歴史を\n書いた連載が載っているんだ。"}, {"t": 58.483333333333334, "x": "「下商物語」という。"}, {"t": 60.0, "x": "卒業生でもある先生が書いた記事だ。"}, {"t": 62.61666666666667, "x": "学校が自分で残した記録なのね。"}, {"t": 65.06666666666666, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 68.48333333333333, "x": "よろしくね。"}, {"t": 69.98333333333333, "x": "まず学校の話からだ。"}, {"t": 71.66666666666667, "x": "下関は本州のいちばん西のはしにある港町だ。"}, {"t": 75.05, "x": "海をはさんだ向こう側は九州だ。"}, {"t": 77.21666666666667, "x": "関門海峡のある町ね。"}, {"t": 79.03333333333333, "x": "そうだ。下関商は、学校のサイトで\n「創立142周年」とうたっている。"}, {"t": 84.35, "x": "校章の図柄には「since 1884」と入っている。"}, {"t": 88.33333333333333, "x": "明治の半ばにできた学校だ。"}, {"t": 90.46666666666667, "x": "野球より前に商業の学校として長い歴史があるのね。"}, {"t": 93.98333333333333, "x": "ああ。学校のサイトには、明治と大正に\n学校へ来た人の名前が並んでいる。"}, {"t": 98.68333333333334, "x": "いちばん古いのは明治20年。"}, {"t": 100.4, "x": "初代の文部大臣の森有礼だ。"}, {"t": 102.65, "x": "明治40年には伊藤博文。"}, {"t": 104.5, "x": "明治44年には北里柴三郎。"}, {"t": 107.03333333333333, "x": "大正2年には大隈重信が来た、と書いてある。"}, {"t": 110.23333333333333, "x": "教科書に出てくる人ばかりじゃない。"}, {"t": 112.41666666666667, "x": "大正3年の6月には渋沢栄一が来て、\n講堂で生徒に話をした。"}, {"t": 117.01666666666667, "x": "中国を見て回った帰り道だった、と校誌に\n残っているそうだ。"}, {"t": 120.83333333333333, "x": "校長室には渋沢栄一が書いた\n額がいまも掛かっている。"}, {"t": 124.43333333333334, "x": "お札の人が生徒の前で話をした学校なのね。"}, {"t": 127.66666666666667, "x": "商業の町の、商業の学校だったからだろうな。"}, {"t": 130.75, "x": "では野球部の話に入ろう。"}, {"t": 133.16666666666666, "x": "下商物語によると野球部ができたのは\n明治31年の秋だ。"}, {"t": 137.46666666666667, "x": "明治！ずいぶん古いのね。"}, {"t": 139.26666666666668, "x": "ただ、そのころの校舎には\n野球の練習をするグラウンドが無かった。"}, {"t": 143.16666666666666, "x": "思うように練習ができなかったようだ、と\n記事は書いている。"}, {"t": 146.6, "x": "グラウンドが無いのに野球部があったのね。"}, {"t": 149.01666666666668, "x": "野球のルールもまだ全部そろっていない時代だった。"}, {"t": 151.88333333333333, "x": "おもしろいのはユニホームだ。"}, {"t": 153.3, "x": "番号が背中ではなく、胸に入っていた。"}, {"t": 156.16666666666666, "x": "胸に番号？いまとは逆ね。"}, {"t": 158.18333333333334, "x": "大正になると、近くの小学校の広い\n練習場を借りて練習した。"}, {"t": 162.43333333333334, "x": "そのおかげで、地方の大会に出て力をつけていった。"}, {"t": 165.73333333333332, "x": "昭和の初めには明治神宮の大会に初めて出ている。"}, {"t": 169.03333333333333, "x": "記事は、これが\n初めての全国大会だった、と書いている。"}, {"t": 172.76666666666668, "x": "いまの国体みたいな大会ね。"}, {"t": 174.8, "x": "記事にも「現在の国体に相当」とある。"}, {"t": 177.61666666666667, "x": "そして昭和3年の春、センバツに初めて出た。"}, {"t": 180.73333333333332, "x": "日本高野連の表でも、昭和3年の第5回大会に\n下関商の名前がある。"}, {"t": 185.85, "x": "野球部ができてからどれくらいかかったの？"}, {"t": 188.35, "x": "記事には「創部以来約三十年を経て」とある。"}, {"t": 191.55, "x": "30年かけてやっと全国の舞台に立ったのね。"}, {"t": 194.7, "x": "そのあとのセンバツも日本高野連の表で並べてみよう。"}, {"t": 197.93333333333334, "x": "昭和3年の第5回。昭和10年の第12回。"}, {"t": 200.91666666666666, "x": "昭和12年の第14回。"}, {"t": 202.98333333333332, "x": "数年おきに春の甲子園に名前が出てくるのね。"}, {"t": 206.01666666666668, "x": "ああ。そして昭和14年からは、\n毎年のように名前が続く。"}, {"t": 209.95, "x": "どんどん強くなっていったのね。"}, {"t": 212.41666666666666, "x": "そこから下関商は強くなっていく。"}, {"t": 214.9, "x": "夏の甲子園に初めて出たのは昭和13年だ。"}, {"t": 218.05, "x": "春のほうが先だったのね。"}, {"t": 219.86666666666667, "x": "ああ。そして次の年、昭和14年の夏。"}, {"t": 222.63333333333333, "x": "下関商は決勝まで勝ち進んだ。"}, {"t": 225.15, "x": "日本高野連の表では、この年の全参加校は\n608校。代表は22校だ。"}, {"t": 230.53333333333333, "x": "その決勝の相手は？"}, {"t": 232.05, "x": "和歌山の海草中だ。0対5で敗れて、準優勝だった。"}, {"t": 235.91666666666666, "x": "海草中のことは、前に海草中の回で\n話したから、今回は点数だけにしておく。"}, {"t": 241.35, "x": "初めて夏に出た次の夏で、もう準優勝なのね。"}, {"t": 244.75, "x": "しかもこの昭和14年は春のセンバツにも出ている。"}, {"t": 247.8, "x": "日本高野連の表では、\n昭和14年の第16回の山口の欄に下関商の名前がある。"}, {"t": 253.65, "x": "春も夏も甲子園に出て、夏は\n決勝まで行った年なのね。"}, {"t": 257.46666666666664, "x": "ここから昭和16年の春まで、下関商は\n春と夏の甲子園に6度続けて出ている。"}, {"t": 263.01666666666665, "x": "下商物語はこのころを\n「第一期の黄金時代」と呼んでいる。"}, {"t": 267.03333333333336, "x": "6度続けて、ってどういう並びなの？"}, {"t": 269.4166666666667, "x": "昭和13年の夏、14年の春と夏、\n15年の春と夏、16年の春だ。"}, {"t": 274.96666666666664, "x": "日本高野連の表でも、センバツは昭和14年から\n16年まで3年続けて下関商の名前がある。"}, {"t": 281.43333333333334, "x": "春も夏も、山口の代表といえば下関商だったのね。"}, {"t": 285.3333333333333, "x": "ところがそのあと大会そのものが止まってしまう。"}, {"t": 288.26666666666665, "x": "戦争ね。"}, {"t": 289.73333333333335, "x": "戦争のあいだ野球部は活動を休むしかなかった。"}, {"t": 292.73333333333335, "x": "学校のグラウンドは食べ物を\n作るための芋畑になっていた。"}, {"t": 296.5, "x": "野球をする場所が畑になっちゃったのね。"}, {"t": 299.1166666666667, "x": "戦争が終わった昭和20年の9月、\n野球部は活動を始め直した。"}, {"t": 303.48333333333335, "x": "まず芋畑をならしてグラウンドに戻したそうだ。"}, {"t": 306.3333333333333, "x": "学校の部活動の中で、いちばん\n早く始め直したようだ、と記事にある。"}, {"t": 310.96666666666664, "x": "戦争が終わってすぐに動いたのね。"}, {"t": 313.21666666666664, "x": "そして昭和21年の夏から昭和23年の春まで、\nまた春と夏に4回続けて甲子園に出た。"}, {"t": 319.68333333333334, "x": "下商物語はこれを「戦後の黄金期」と書いている。"}, {"t": 323.25, "x": "戦争の前に6度、戦争のあとに4回なのね。"}, {"t": 326.51666666666665, "x": "2018年の記事では、甲子園の出場は\n「連続十回」とも書いている。"}, {"t": 331.4166666666667, "x": "ただし「戦争による中断あり」と、\nちゃんと書き添えてある。"}, {"t": 335.1333333333333, "x": "止まった時期をはさんで、10回続けて出たってことね。"}, {"t": 338.55, "x": "このころの卒業生には「塀ぎわの魔術師」と\n呼ばれた外野手もいる。"}, {"t": 342.8, "x": "昭和11年に卒業して、プロ野球に\n進んだ、と学校の新聞にある。"}, {"t": 347.55, "x": "塀ぎわって外野のフェンスのところね。"}, {"t": 349.8666666666667, "x": "そうだ。そこでの守りがうまかったんだろうな。"}, {"t": 353.1666666666667, "x": "新しい学校の仕組みになって、\n下関商は高校になった。"}, {"t": 357.05, "x": "そして昭和38年、1963年がやってくる。"}, {"t": 361.1, "x": "最初に話した二代目の優勝旗の年ね。"}, {"t": 363.9, "x": "その前に1つ。日本高野連の表では、下関商は\n2年前の1961年の春にもセンバツに出ている。"}, {"t": 371.25, "x": "いきなり出てきたわけじゃないのね。"}, {"t": 373.26666666666665, "x": "そうだ。この年のセンバツに出たのは28校だ。"}, {"t": 376.3833333333333, "x": "下関商は勝ち進んで、決勝に出た。"}, {"t": 378.98333333333335, "x": "相手は北海道の北海だ。"}, {"t": 381.0, "x": "本州の西のはしと北海道の学校の決勝なのね。"}, {"t": 384.45, "x": "決勝は10対0。下関商の勝ちだ。"}, {"t": 387.4166666666667, "x": "10対0！決勝でそんなに差がついたのね。"}, {"t": 390.3333333333333, "x": "日本高野連の表に、そう書いてある。"}, {"t": 392.7, "x": "大会小史にはこの大会のことがこう書いてある。"}, {"t": 395.55, "x": "新しく作った二代目の優勝旗は、\n剛腕のエースがいる下関商へ。"}, {"t": 400.01666666666665, "x": "エースのことも書いてあるのね。"}, {"t": 401.8666666666667, "x": "ああ。この年のエースは2年生だった。"}, {"t": 404.21666666666664, "x": "下商物語の野球部の回には、優勝旗が\n地元に帰ってきた日の写真が載っている。"}, {"t": 409.53333333333336, "x": "見出しは「大優勝旗郷土に」だ。"}, {"t": 411.8333333333333, "x": "写真の場所は、山口県庁の前、\n下関の唐戸、赤間町と書いてある。"}, {"t": 416.8833333333333, "x": "県庁の前でも、下関の町でも、\n人が集まって迎えたのね。"}, {"t": 421.25, "x": "どの写真にも大勢の人が写っている。"}, {"t": 423.73333333333335, "x": "新しい旗が初めて港町に帰ってきた日なのね。"}, {"t": 427.71666666666664, "x": "下関商の1963年はここで終わらない。"}, {"t": 431.1, "x": "この年の夏は第45回の大会だ。"}, {"t": 433.71666666666664, "x": "大会小史には「2回目の記念大会」とある。"}, {"t": 436.8, "x": "参加した学校の数も、\n2000校の大台をこえた、とある。"}, {"t": 440.53333333333336, "x": "記念の大会だったのね。"}, {"t": 442.3333333333333, "x": "日本高野連の表では、全参加は\n2107校。代表は48校だ。"}, {"t": 447.1666666666667, "x": "台風の影響で、開会式は雨だったとも書いてある。"}, {"t": 450.4, "x": "この夏も下関商は山口の代表として甲子園に出た。"}, {"t": 454.25, "x": "春の優勝校が夏も出てきたのね。"}, {"t": 456.65, "x": "そして夏も決勝まで勝ち進んだ。"}, {"t": 459.06666666666666, "x": "春と夏の両方で決勝！"}, {"t": 460.93333333333334, "x": "決勝の相手は大阪の明星だ。点数は1対2。"}, {"t": 464.2, "x": "1点差で敗れて、夏は準優勝だった。"}, {"t": 467.01666666666665, "x": "あと1点で、春と夏の両方を取るところだったのね。"}, {"t": 470.43333333333334, "x": "そして秋には、山口で国体が開かれた。"}, {"t": 473.35, "x": "下商物語によると下関商は\n地元の山口国体で優勝している。"}, {"t": 478.1166666666667, "x": "秋は地元で日本一なのね。"}, {"t": 480.1666666666667, "x": "記事は、この年に全国へ「S」のマークを\n大きく広めた、と書いている。"}, {"t": 484.8833333333333, "x": "Sって？"}, {"t": 485.73333333333335, "x": "下関商の印だ。校章の図柄にも大きなSが入って const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
