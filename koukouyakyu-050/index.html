<style>

<script>
const D={"name": "桐生第一", "file": "050_編集用", "dur": 723.15, "segs": [], "subs": [{"t": 0.0, "x": "今回は群馬の学校の話よね。"}, {"t": 2.35, "x": "ああ。1999年の夏の甲子園から始めよう。"}, {"t": 6.0, "x": "日本高野連の大会小史には、\nこの夏のことがこう書いてある。"}, {"t": 9.833333333333334, "x": "桐生第一が群馬県勢として初優勝。"}, {"t": 12.466666666666667, "x": "決勝まで6試合の防御率は1.00。"}, {"t": 15.35, "x": "群馬の学校が、夏に優勝したのは\nこれが初めてなのね。"}, {"t": 19.15, "x": "そうだ。でも群馬の学校が\n夏の大会に来たのは、もっとずっと前からだ。"}, {"t": 23.716666666666665, "x": "そこで問題だ。"}, {"t": 24.85, "x": "1999年の夏は、群馬の学校が\n夏の全国大会に来て何回目だったと思う？"}, {"t": 30.85, "x": "うーん。毎年来ているなら、70回くらいかしら。"}, {"t": 34.11666666666667, "x": "答えは最後に言う。"}, {"t": 35.3, "x": "今回は日本高野連の出場校の表を、\n群馬の欄だけ数えていく。"}, {"t": 39.55, "x": "始める前にチャンネル登録と高評価をお願いしたい。"}, {"t": 42.78333333333333, "x": "よろしくね。"}, {"t": 44.266666666666666, "x": "桐生第一って、どこにある学校なの？"}, {"t": 46.833333333333336, "x": "群馬県の桐生市にある私立の学校だ。"}, {"t": 49.35, "x": "群馬県の資料では、学校ができたのは\n明治34年。1901年だ。"}, {"t": 54.35, "x": "120年以上前からある学校なのね。"}, {"t": 56.96666666666667, "x": "桐生市は群馬県の東の端にある。となりは栃木県だ。"}, {"t": 60.6, "x": "市の資料には、古くから西の西陣、\n東の桐生と言われた織物の町とある。"}, {"t": 65.63333333333334, "x": "西陣って、京都の織物よね。"}, {"t": 67.91666666666667, "x": "そうだ。その京都と一緒に呼ばれるほど、\n布を織る仕事が盛んだった。"}, {"t": 72.15, "x": "屋根がギザギザのノコギリ屋根の工場は、\nいまも市内に200棟以上残っている。"}, {"t": 76.86666666666666, "x": "ギザギザの屋根なんて、めずらしいわね。"}, {"t": 79.3, "x": "市内のあちこちには、\n機織りの神様をまつる神社もある。"}, {"t": 82.8, "x": "町の中を流れるのは渡良瀬川と、\nその支流の桐生川だ。"}, {"t": 86.53333333333333, "x": "昭和3年には、川のそばに新川運動場ができた。"}, {"t": 89.95, "x": "野球場とテニスコートとプールがある運動場だった。"}, {"t": 93.0, "x": "90年以上前から、町に野球場があったのね。"}, {"t": 96.25, "x": "この町の名前は、出場校の表に何度も出てくる。"}, {"t": 100.15, "x": "群馬の学校が初めて夏の大会に来たのはいつなの？"}, {"t": 103.61666666666666, "x": "表を見ると、1925年の第11回だ。"}, {"t": 106.66666666666667, "x": "来たのは前橋中だった。"}, {"t": 108.38333333333334, "x": "この夏の代表は21校。"}, {"t": 110.15, "x": "地方大会に出た学校は302校だった。"}, {"t": 112.98333333333333, "x": "それより前の10回は、群馬の欄が空いている。"}, {"t": 115.9, "x": "最初の10回は、群馬の学校は来ていないのね。"}, {"t": 119.05, "x": "次の1926年も前橋中が来た。"}, {"t": 122.06666666666666, "x": "大会小史には、準々決勝の静岡中と\n前橋中が19回までの延長戦、とある。"}, {"t": 127.75, "x": "19回も戦ったの！"}, {"t": 129.53333333333333, "x": "ああ。この夏に優勝したのは静岡中だった。"}, {"t": 132.45, "x": "静岡中は決勝でも大連商に2対1で勝っている。"}, {"t": 135.73333333333332, "x": "1927年には、桐生中の名前が初めて出てくる。"}, {"t": 139.63333333333333, "x": "1930年と1931年は2年続けて桐生中だ。"}, {"t": 144.11666666666667, "x": "1934年から1936年までは\n3年続けて桐生中が来ている。"}, {"t": 149.46666666666667, "x": "戦争の前は、前橋中と桐生中と\n高崎商が代わる代わる来ていた。"}, {"t": 154.0, "x": "前橋と桐生と高崎、3つの町の学校ね。"}, {"t": 157.28333333333333, "x": "戦争で大会が止まったあと、\n1946年の夏に大会が戻った。"}, {"t": 162.15, "x": "この夏の群馬の代表は桐生工だった。"}, {"t": 164.65, "x": "1925年から1948年までに、\n群馬の学校は18回来ている。"}, {"t": 170.11666666666667, "x": "桐生中は8回。群馬の学校でいちばん多かった。"}, {"t": 173.91666666666666, "x": "じゃあ、そのあとも毎年来ていたの？"}, {"t": 176.25, "x": "それが違う。\n日本高野連の地方大会の区切りの表を見てほしい。"}, {"t": 180.18333333333334, "x": "群馬は第12回から第59回まで、\n北関東の大会に入っていた。"}, {"t": 184.81666666666666, "x": "1つの枠を、隣の県と争っていたんだ。"}, {"t": 187.8, "x": "勝たないと、群馬の学校は1校も来られないのね。"}, {"t": 191.01666666666668, "x": "1949年からの5年間で、群馬の欄に\n名前があるのは1951年だけだ。"}, {"t": 196.91666666666666, "x": "1949年から1976年までの28回で、\n群馬の学校が来たのは11回しかない。"}, {"t": 203.88333333333333, "x": "半分も来られなかったのね。"}, {"t": 205.75, "x": "ただ、記念の大会のときは少し違う。"}, {"t": 208.38333333333333, "x": "1958年と1963年と1968年と1973年は、\n代表が47校や48校に増えた。"}, {"t": 217.48333333333332, "x": "この4回は、群馬の学校も来ている。"}, {"t": 220.06666666666666, "x": "記念の大会では、群馬から1校来られたのね。"}, {"t": 223.21666666666667, "x": "その11回のうち、6回は名前に桐生と付く学校だった。"}, {"t": 226.98333333333332, "x": "群馬が1つの県で\n1校を出せるようになったのは、第60回からだ。"}, {"t": 231.3, "x": "1978年の夏だな。この年の群馬の代表も桐生だった。"}, {"t": 236.01666666666668, "x": "やっと毎年来られるようになったのね。"}, {"t": 238.35, "x": "この年から、甲子園に来る学校は49校になった。"}, {"t": 241.91666666666666, "x": "そこからは毎年、群馬の欄に名前が入る。"}, {"t": 244.76666666666668, "x": "1979年から1981年までは、3年続けて前橋工だ。"}, {"t": 250.2, "x": "東農大二は1982年から4回来ている。"}, {"t": 253.56666666666666, "x": "1991年と1992年は樹徳。"}, {"t": 256.96666666666664, "x": "1993年に桐生第一が初めて夏に来た。"}, {"t": 260.8, "x": "いろいろな学校が、代わる代わる来ているのね。"}, {"t": 264.066666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
