<script>
const D={"name": "松商学園", "file": "015_編集用", "dur": 1036.8333125, "segs": [], "subs": [{"t": 0.0, "x": "1928年8月22日。"}, {"t": 2.6, "x": "兵庫県の甲子園球場。"}, {"t": 4.35, "x": "第14回全国中等学校優勝野球大会は\n決勝の日を迎えていた。"}, {"t": 8.95, "x": "戦うのは長野の松本商と京都の平安中だ。"}, {"t": 12.3, "x": "長野の学校が決勝にいたの？"}, {"t": 14.4, "x": "ああ。松本商のマウンドには、\nエースの中島治康が立っていた。"}, {"t": 18.483333333333334, "x": "スコアは3対1。松本商が勝った。"}, {"t": 21.083333333333332, "x": "長野県の学校が、夏の全国大会で\n初めて頂点に立った日だ。"}, {"t": 25.616666666666667, "x": "長野から日本一が出てたのね。"}, {"t": 27.833333333333332, "x": "野球部ができてから15年がたっていた。"}, {"t": 30.283333333333335, "x": "学校の記録には\n「15年来の念願の全国制覇」と書かれている。"}, {"t": 34.733333333333334, "x": "そして4日後の8月26日、\n松本駅前で凱旋式が開かれた。"}, {"t": 39.666666666666664, "x": "町じゅうで迎えたってことね。"}, {"t": 41.55, "x": "この松本商が今の松商学園だ。"}, {"t": 44.11666666666667, "x": "でも、そのあとは優勝してないの？"}, {"t": 46.4, "x": "2025年までの記録で、夏の優勝はこの1回だけだ。"}, {"t": 50.36666666666667, "x": "100年近く前の優勝が、まだ1回きりなのね。"}, {"t": 54.18333333333333, "x": "松商学園はどうやって、長野の伝統校になったの？"}, {"t": 57.666666666666664, "x": "今回は松商学園の野球部を\n日付と数字をもとに辿っていく。"}, {"t": 61.6, "x": "明治の学校の始まりから、\n1928年の優勝、そして今の夏までだ。"}, {"t": 66.85, "x": "気に入ってもらえたら、チャンネル登録と\n高評価をお願いします。"}, {"t": 71.11666666666666, "x": "学校の始まりは1898年。明治31年だ。"}, {"t": 75.21666666666667, "x": "木澤鶴人という人が松本の町に\n「戊戌学会」を作った。"}, {"t": 79.45, "x": "ぼじゅつ？　変わった名前ね。"}, {"t": 81.28333333333333, "x": "1898年は干支では戊戌の年にあたる。"}, {"t": 84.66666666666667, "x": "木澤さんって、どんな人なの？"}, {"t": 86.8, "x": "慶應義塾で学んだ、明治の実業家で教育家だ。"}, {"t": 90.11666666666666, "x": "故郷の松本で商売の役に立つ教育をしようとした。"}, {"t": 93.48333333333333, "x": "そのとき掲げた言葉が「自主独立」だ。"}, {"t": 96.58333333333333, "x": "自分で考えて、自分で立つってこと？"}, {"t": 99.2, "x": "学園はそう説明している。"}, {"t": 100.81666666666666, "x": "今もこれが建学の精神だ。"}, {"t": 102.81666666666666, "x": "1902年には松本戊戌商業学校として認められた。"}, {"t": 106.76666666666667, "x": "1911年に名前を松本商業学校に改めている。"}, {"t": 110.78333333333333, "x": "ここで「松本商」になったのね。"}, {"t": 113.28333333333333, "x": "野球部ができたのは、その2年後の1913年4月だ。"}, {"t": 117.28333333333333, "x": "言い出したのは4年生の野口だった。"}, {"t": 119.5, "x": "仲間を集め、野球を知らない\n体操の先生を部長に担ぎ出した。"}, {"t": 123.7, "x": "先生が野球を知らなかったの？"}, {"t": 125.75, "x": "そうだ。しかも校長は反対していた。"}, {"t": 128.21666666666667, "x": "それを押し切って作った部だと、学校の記録にある。"}, {"t": 131.48333333333332, "x": "最初から、自主独立って感じね。"}, {"t": 134.01666666666668, "x": "最初の試合は1913年10月、長野中との対戦だった。"}, {"t": 138.4, "x": "結果は3対6の負けだ。"}, {"t": 140.15, "x": "公式戦の初勝利は1919年まで待つことになる。"}, {"t": 143.95, "x": "相手はまた長野中で2対1だった。"}, {"t": 146.36666666666667, "x": "6年かけて、やっと1勝なのね。"}, {"t": 148.8, "x": "同じ1919年には学校の運営も変わった。"}, {"t": 152.08333333333334, "x": "片倉同族が設立者となった\n財団が学校を引き継いでいる。"}, {"t": 156.01666666666668, "x": "学校を支える人たちが代わったのね。"}, {"t": 159.05, "x": "1920年、松本商は県の大会で初めて優勝した。"}, {"t": 163.18333333333334, "x": "決勝の相手は長野師範で、7対0だった。"}, {"t": 166.21666666666667, "x": "この年には野球部の後援会もできた。"}, {"t": 168.76666666666668, "x": "町の人が応援する仕組みができたのね。"}, {"t": 171.38333333333333, "x": "そして同じ年の8月、全国大会に初めて出た。"}, {"t": 175.13333333333333, "x": "まだ甲子園はないのよね？"}, {"t": 176.85, "x": "ああ。会場は兵庫県の鳴尾球場だ。"}, {"t": 179.13333333333333, "x": "第6回大会だった。"}, {"t": 180.75, "x": "初戦で関西学院中に0対6で敗れている。"}, {"t": 183.91666666666666, "x": "初めての全国は、1試合で終わったのね。"}, {"t": 186.8, "x": "2回目の出場は1922年だ。"}, {"t": 189.5, "x": "竜ヶ崎中に14対3で勝ち、北海中も破った。"}, {"t": 193.06666666666666, "x": "準決勝で和歌山中に1対2で敗れ、ベスト4になった。"}, {"t": 196.95, "x": "2回目でもう4強なの？"}, {"t": 198.63333333333333, "x": "そうだ。そして1924年の夏が来る。"}, {"t": 201.68333333333334, "x": "この年、甲子園球場が完成した。"}, {"t": 204.28333333333333, "x": "甲子園ができたのって、1924年なのね。"}, {"t": 207.66666666666666, "x": "第10回大会が新しい甲子園で開かれた。"}, {"t": 210.6, "x": "松本商は2年ぶり3回目の出場だった。"}, {"t": 213.5, "x": "台北商、松山商、鳥取中と勝ち進んだ。"}, {"t": 216.93333333333334, "x": "決勝まで行ったの？"}, {"t": 218.31666666666666, "x": "行った。甲子園で行われた、最初の夏の決勝だ。"}, {"t": 221.76666666666668, "x": "相手は広島商。0対3で敗れて準優勝になった。"}, {"t": 225.43333333333334, "x": "甲子園最初の決勝に、長野の学校が立ってたのね。"}, {"t": 229.51666666666668, "x": "1926年春、松本商は選抜大会に\n初めて出た。第3回大会だ。"}, {"t": 235.18333333333334, "x": "神港商、高松商、熊本商と破って決勝へ進んだ。"}, {"t": 239.08333333333334, "x": "この大会で矢島粂安が大きな記録を残している。"}, {"t": 242.43333333333334, "x": "どんな記録？"}, {"t": 243.5, "x": "選抜大会で史上初めての、サヨナラ本塁打だ。"}, {"t": 246.93333333333334, "x": "史上初って、すごいわね。"}, {"t": 248.85, "x": "ただ決勝は4月5日、広陵中に0対7で敗れた。"}, {"t": 252.48333333333332, "x": "夏に続いて、春も準優勝だ。"}, {"t": 254.85, "x": "決勝まで行って負けるのが2回目なのね。"}, {"t": 257.43333333333334, "x": "1927年は、春も夏もベスト4だった。"}, {"t": 260.93333333333334, "x": "春は準決勝で広陵中に0対7。"}, {"t": 263.48333333333335, "x": "夏も準決勝で広陵中に3対4で敗れた。"}, {"t": 266.6333333333333, "x": "また同じ相手なの？"}, {"t": 268.06666666666666, "x": "ああ。この年は春と夏の両方で、\n同じ学校に止められた。"}, {"t": 271.8666666666667, "x": "秋の明治神宮大会でも準決勝で敗れてベスト4だった。"}, {"t": 275.6, "x": "相手は愛知商で2対7だった。"}, {"t": 277.75, "x": "いつも、あと少しのところまで来てるのね。"}, {"t": 280.46666666666664, "x": "1924年から1927年の間に、\n甲子園の決勝が2回、4強が2回だ。"}, {"t": 286.6666666666667, "x": "長野の学校は、もう全国の常連になっていた。"}, {"t": 290.3833333333333, "x": "1928年の春は、選抜で高松中に\n勝ったあと和歌山中に0対9で敗れた。"}, {"t": 296.43333333333334, "x": "それで、夏が冒頭の大会ね。"}, {"t": 298.68333333333334, "x": "そうだ。開会は8月12日。"}, {"t": 300.8, "x": "松本商は2年連続5回目の出場だった。"}, {"t": 303.9, "x": "前の年の大会からラジオの実況放送も始まっていた。"}, {"t": 307.53333333333336, "x": "ラジオで試合を聞けるようになってたのね。"}, {"t": 309.95, "x": "1回戦の相手は、前の年に敗れた広陵中だった。"}, {"t": 313.5, "x": "いきなり因縁の相手じゃない。"}, {"t": 315.26666666666665, "x": "学校の記録は、この相手を「宿敵」と書いている。"}, {"t": 318.71666666666664, "x": "松本商は3対2でその広陵中を破った。"}, {"t": 321.73333333333335, "x": "やっと勝てたのね。"}, {"t": 323.06666666666666, "x": "2回戦は鹿児島商に3対2。"}, {"t": 325.2, "x": "3回戦は愛知商に5対0。"}, {"t": 327.21666666666664, "x": "準決勝は高松中に3対0だ。"}, {"t": 329.81666666666666, "x": "接戦と完封が、交互に来てる感じね。"}, {"t": 332.6, "x": "失点は5試合で合わせて5点だった。"}, {"t": 334.8666666666667, "x": "そして8月22日、決勝で平安中を3対1で下した。"}, {"t": 339.18333333333334, "x": "中島さんが投げて、優勝したのよね。"}, {"t": 341.8833333333333, "x": "人名事典には「昭和3年松本商のエースとして\n甲子園で優勝」とある。"}, {"t": 346.8, "x": "1924年の準優勝から、4年での日本一ね。"}, {"t": 350.76666666666665, "x": "日本高野連の記録にもこの優勝は\n大事な目印として残っている。"}, {"t": 355.06666666666666, "x": "目印って？"}, {"t": 356.15, "x": "1949年に湘南が優勝したときの書き方だ。"}, {"t": 359.96666666666664, "x": "「優勝旗は14回大会の\n松本商以来21年ぶり東日本チームへ」とある。"}, {"t": 365.21666666666664, "x": "21年も、東日本に旗が来なかったのね。"}, {"t": 368.56666666666666, "x": "それだけ1928年の松本商の優勝は重いということだ。"}, {"t": 373.46666666666664, "x": "優勝投手の中島治康は、1909年に長野で生まれた。"}, {"t": 377.71666666666664, "x": "松本商のあと早稲田大学へ進んでいる。"}, {"t": 380.43333333333334, "x": "大学でもピッチャーだったの？"}, {"t": 382.3, "x": "いや。早稲田では一塁と外野を守って活躍した。"}, {"t": 385.46666666666664, "x": "1934年12月、中島は\nプロ野球の新しい球団に加わった。"}, {"t": 390.43333333333334, "x": "大日本東京野球倶楽部。"}, {"t": 392.1333333333333, "x": "今の巨人の前身だ。"}, {"t": 393.73333333333335, "x": "このとき、同じ松本商OBの矢島粂安も\n創立に参加している。"}, {"t": 398.25, "x": "選抜で初めてサヨナラ本塁打を打った人ね。"}, {"t": 401.26666666666665, "x": "そうだ。巨人の出発に、\n松本商のOBが2人いたわけだ。"}, {"t": 405.3833333333333, "x": "長野の学校から、巨人の始まりに2人も。"}, {"t": 408.45, "x": "1938年の秋、中島は大きな記録を作る。"}, {"t": 412.35, "x": "日本のプロ野球で、史上初の三冠王になった。"}, {"t": 415.65, "x": "三冠王って、打率とホームランと打点の全部が1位？"}, {"t": 419.06666666666666, "x": "そうだ。秋のリーグでは最高殊勲選手にも選ばれた。"}, {"t": 422.5, "x": "甲子園の優勝投手が、プロで最初の三冠王なのね。"}, {"t": 426.06666666666666, "x": "中島は1963年に野球殿堂入りしている。"}, {"t": 429.56666666666666, "x": "殿堂の記録には、松本の中山小から\n松商学園へ進んだとある。"}, {"t": 434.7, "x": "優勝のあとも松本商は全国に出続けた。"}, {"t": 437.6166666666667, "x": "1929年から1931年まで、春の選抜に続けて出ている。"}, {"t": 443.05, "x": "3年続けて春の甲子園なのね。"}, {"t": 445.43333333333334, "x": "ただ1931年2月4日に悲しい知らせがあった。"}, {"t": 449.21666666666664, "x": "初代の野球部長が肺炎で急に亡くなったのだ。"}, {"t": 452.26666666666665, "x": "初代の部長って、野球を知らなかった体操の先生？"}, {"t": 455.71666666666664, "x": "そうだ。創部から18年、部を見守ってきた人だった。"}, {"t": 459.3333333333333, "x": "この年の夏は県の大会で優勝した。"}, {"t": 461.9, "x": "だが信越大会の決勝で長野商に敗れた。"}, {"t": 464.81666666666666, "x": "延長12回で3対4だった。"}, {"t": 467.05, "x": "あと1勝で甲子園だったのね。"}, {"t": 469.06666666666666, "x": "1933年は春と夏の両方に出た。"}, {"t": 472.18333333333334, "x": "春は享栄商に1対2で敗れた。"}, {"t": 474.4166666666667, "x": "夏は大正中に0対4で敗れている。"}, {"t": 476.93333333333334, "x": "1936年11月には松本市県町の川の\nほとりに新しい校舎が完成した。"}, {"t": 482.8833333333333, "x": "学校の記録はこの校舎を「東洋一」と書いている。"}, {"t": 486.31666666666666, "x": "自分たちで東洋一って書くくらい立派だったのね。"}, {"t": 489.46666666666664, "x": "1938年の夏は岐阜商に0対5で敗れた。"}, {"t": 493.1666666666667, "x": "同じ年の秋に中島が三冠王になっている。"}, {"t": 496.06666666666666, "x": "1940年の春は徳島商に4対3で勝った。"}, {"t": 499.7, "x": "次の東邦商には1対4で敗れている。"}, {"t": 502.9166666666667, "x": "1940年の夏、松本商はまたベスト4に入った。"}, {"t": 506.98333333333335, "x": "準決勝で海草中に1対3で敗れている。"}, {"t": 509.8666666666667, "x": "秋の明治神宮国民体育大会でも\n海草中に0対4で敗れた。"}, {"t": 514.3666666666667, "x": "1940年は2回も海草中に止められたのね。"}, {"t": 517.9166666666666, "x": "だが、野球を続けられる時代は\n終わりに近づいていた。"}, {"t": 521.1833333333333, "x": "1941年7月、夏の全国大会が突然中止になった。"}, {"t": 526.1333333333333, "x": "戦争のせいね。"}, {"t": 527.3833333333333, "x": "そうだ。ユニフォームの胸の文字も変わった。"}, {"t": 529.95, "x": "ローマ字の「MATSUMOTO」から、\n漢字の「松本商業」になった。"}, {"t": 535.1333333333333, "x": "野球部という名前も野球班に改められている。"}, {"t": 538.0833333333334, "x": "名前まで変えられたのね。"}, {"t": 539.7166666666667, "x": "1942年8月には甲信静大会で優勝した。"}, {"t": 543.6333333333333, "x": "その先の全国の大会では、一宮中に2対7で敗れた。"}, {"t": 547.8833333333333, "x": "学校の記録はこれを「幻の甲子園」と呼んでいる。"}, {"t": 551.25, "x": "1943年、野球部は休止になった。"}, {"t": 554.3666666666667, "x": "1944年には学校そのものが工業学校に変わっている。"}, {"t": 558.4666666666667, "x": "グラウンドはロケット戦闘機\n「秋水」の実験場になった。"}, {"t": 562.3, "x": "野球をしていた場所がね。"}, {"t": 564.0, "x": "戦争で亡くなったOBもいる。"}, {"t": 565.85, "x": "学校の記録は、鎮魂の碑と戦没野球人モニュメントに\n名前のある人たちを載せている。"}, {"t": 571.1833333333333, "x": "その中には、巨人の創立に\n加わった矢島粂安の名前もある。"}, {"t": 575.3833333333333, "x": "選抜で初めてサヨナラ本塁打を打った人まで。"}, {"t": 578.4666666666667, "x": "ああ。学校は、その名前を今も記録に残している。"}, {"t": 582.3833333333333, "x": "戦争が終わったのは1945年8月15日だ。"}, {"t": 586.1166666666667, "x": "翌年の3月には朝日新聞の松本支局で\n集まりが開かれた。"}, {"t": 590.35, "x": "中等学校の野球連盟を作るための準備の会だ。"}, {"t": 593.6833333333333, "x": "戦争のあと半年ちょっとで動き出してたのね。"}, {"t": 596.6333333333333, "x": "1946年4月、野球部は活動を再開した。"}, {"t": 600.5, "x": "1947年3月には7年ぶりに選抜大会へ出ている。"}, {"t": 604.8166666666667, "x": "1948年4月、新しい学制に合わせて名前が変わった。"}, {"t": 609.3, "x": "ここから「松商学園」になる。"}, {"t": 611.5333333333333, "x": "1950年8月13日、第32回選手権大会の開会式。"}, {"t": 616.75, "x": "選手宣誓をしたのは松商学園の高根主将だった const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
