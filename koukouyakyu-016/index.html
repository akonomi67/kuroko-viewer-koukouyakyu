<title>浪商</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}

<script>
const D={"name": "浪商", "file": "016_編集用", "dur": 966.76665625, "segs": [], "subs": [{"t": 0.0, "x": "大阪の高校野球って、夏の甲子園で\nたくさん優勝してるわよね。"}, {"t": 4.283333333333333, "x": "ああ。PL学園も大阪桐蔭も、\n何度も日本一になっている。"}, {"t": 8.416666666666666, "x": "じゃあ、大阪で最初に夏を制した学校はどこ？"}, {"t": 11.516666666666667, "x": "答えは1946年の浪華商。いまの大体大浪商だ。"}, {"t": 15.9, "x": "なみしょう？　初めて聞くかも。"}, {"t": 17.85, "x": "甲子園には通算32回出ている。"}, {"t": 20.216666666666665, "x": "春に2回、夏に2回。"}, {"t": 21.816666666666666, "x": "あわせて4回、日本一になった。"}, {"t": 24.3, "x": "4回も！　すごい名門じゃない。"}, {"t": 26.366666666666667, "x": "ところが夏の甲子園に最後に出たのは1979年だ。"}, {"t": 30.35, "x": "春も2002年を最後に出ていない。"}, {"t": 32.35, "x": "2025年の記事の時点でな。"}, {"t": 34.71666666666667, "x": "夏はもう40年以上、出ていないのね。"}, {"t": 37.333333333333336, "x": "そしてこの学校には「怪童」と呼ばれた投手がいた。"}, {"t": 40.68333333333333, "x": "尾崎行雄。2年生の夏に日本一になり、\nその秋に17歳でプロに入った。"}, {"t": 45.8, "x": "のちに巨人で活躍した高田繁さんは、こう話している。"}, {"t": 49.483333333333334, "x": "「真っすぐだけで言えば、絶対に尾崎さん」。"}, {"t": 52.05, "x": "プロの選手がそこまで言う球だったのね。"}, {"t": 55.11666666666667, "x": "4回も日本一になった学校が、\nどんな道を歩いてきたの？"}, {"t": 59.03333333333333, "x": "今回は浪商の野球部を、日付と\n数字をもとに辿っていく。"}, {"t": 62.8, "x": "戦争が終わった次の夏から、\n怪童の時代、そして今までだ。"}, {"t": 66.76666666666667, "x": "気に入ってもらえたら、チャンネル登録と\n高評価をお願いします。"}, {"t": 71.05, "x": "学校の始まりは1921年だ。"}, {"t": 73.8, "x": "1926年から1963年までは、\n大阪市東淀川区の淡路に校舎があった。"}, {"t": 80.21666666666667, "x": "いまは別の場所にあるの？"}, {"t": 81.86666666666666, "x": "いまの校舎は大阪府の南のほう、\n泉南郡熊取町にある。"}, {"t": 85.68333333333334, "x": "当時の名前は浪華商業学校。略して浪華商だ。"}, {"t": 89.1, "x": "1937年の春、その浪華商が選抜で優勝している。"}, {"t": 93.56666666666666, "x": "最初の日本一は春だったのね。"}, {"t": 95.85, "x": "ああ。決勝の相手は愛知の中京商だった。"}, {"t": 98.55, "x": "当時の部員だった島田雄三さんは、\nこう振り返っている。"}, {"t": 101.85, "x": "「当時大阪では野球といえば浪商」。"}, {"t": 104.16666666666667, "x": "昔から野球の学校だったのね。"}, {"t": 106.95, "x": "ところが戦争が野球を止めてしまう。"}, {"t": 109.16666666666667, "x": "1942年の後半。島田さんたちは2年生だった。"}, {"t": 113.06666666666666, "x": "学校に、野球をやめるようにという知らせが来た。"}, {"t": 116.1, "x": "部活ができなくなったの？"}, {"t": 117.86666666666666, "x": "ああ。生徒はクラスごとに、\n軍の工場へ働きに出ることになった。"}, {"t": 121.91666666666667, "x": "島田さんは桜島の造船所、マネージャーになる\n山本英夫さんは尼崎の工場だ。"}, {"t": 127.23333333333333, "x": "野球の道具はどうしてたの？"}, {"t": 129.01666666666668, "x": "工場に持っていって、\nキャッチボールくらいはしていたそうだ。"}, {"t": 132.25, "x": "1945年3月13日の大阪大空襲では、\n山本さんの家も焼けた。"}, {"t": 137.75, "x": "大変な時代だったのね。"}, {"t": 139.53333333333333, "x": "淡路にあった浪商の校舎も焼けてしまった。"}, {"t": 142.2, "x": "戦争のあとは、近くの東淡路小学校の校舎を\n借りて授業をした。"}, {"t": 146.63333333333333, "x": "校舎がないところから、またやり直したのね。"}, {"t": 150.0, "x": "野球部は、1945年の後半ごろに再び動き出した。"}, {"t": 154.2, "x": "疎開先から仲間が戻ってきて、\n部員は30人ほどになった。"}, {"t": 158.3, "x": "グラウンドはあったの？"}, {"t": 159.66666666666666, "x": "都島にあった鐘紡のグラウンドを\n借りて練習したそうだ。"}, {"t": 163.1, "x": "プロで活躍する先輩が、練習の道具を\n持ってきてくれたこともあった。"}, {"t": 167.55, "x": "OBが後輩を支えてくれたのね。"}, {"t": 169.78333333333333, "x": "山本さんは5年生になってから、\n自分から頼んで野球部に入った。"}, {"t": 174.01666666666668, "x": "そしてマネージャーとして、\n試合のスコアを付ける役になった。"}, {"t": 178.1, "x": "そして1946年。"}, {"t": 180.08333333333334, "x": "戦争で止まっていた夏の全国大会が、\nまた開かれることになった。"}, {"t": 184.51666666666668, "x": "やっと再開したのね。"}, {"t": 186.1, "x": "ただし会場は甲子園ではない。"}, {"t": 187.81666666666666, "x": "兵庫県の阪急西宮球場だ。"}, {"t": 190.3, "x": "どうして甲子園じゃないの？"}, {"t": 191.95, "x": "甲子園球場は進駐軍に使われていたからだ。"}, {"t": 194.93333333333334, "x": "日本高野連の記録では、全国から745校が参加した。"}, {"t": 199.25, "x": "そのうち全国大会に出られたのは19校だけだ。"}, {"t": 202.5, "x": "745校で19校。狭い入口ね。"}, {"t": 205.63333333333333, "x": "浪華商は大阪の予選を勝ち抜いた。"}, {"t": 207.78333333333333, "x": "決勝の相手は日新商だ。"}, {"t": 209.63333333333333, "x": "点数は3対2。やっと勝ったと\n山本さんは振り返っている。"}, {"t": 213.33333333333334, "x": "大阪府の54校の代表として、西宮球場に乗り込んだ。"}, {"t": 217.53333333333333, "x": "ここからが本番ね。"}, {"t": 219.51666666666668, "x": "このときの浪華商のエースが、平古場昭二だ。"}, {"t": 222.46666666666667, "x": "左投げの速球派で、ドロップと\n呼ばれたカーブが得意だった。"}, {"t": 226.31666666666666, "x": "ドロップって落ちるカーブのこと？"}, {"t": 228.25, "x": "ああ。山本さんは「負け知らず」だったと話している。"}, {"t": 231.66666666666666, "x": "島田さんによると、1試合に\n平均10以上も三振を取っていたそうだ。"}, {"t": 236.05, "x": "10個以上！　毎試合それなの？"}, {"t": 238.15, "x": "日本野球機構の名簿によると、\nこの大会の4試合すべてで2桁の三振を取った。"}, {"t": 243.4, "x": "最初の試合の相手は和歌山中。"}, {"t": 245.28333333333333, "x": "優勝候補とみられていた学校だ。"}, {"t": 247.48333333333332, "x": "結果は11対2。浪華商の大勝だった。"}, {"t": 250.41666666666666, "x": "山本さんはスコアを付けていたので、\n今もはっきり覚えているという。"}, {"t": 254.28333333333333, "x": "1回、2アウトから\n3番の広瀬のランニングホームランが出た。"}, {"t": 257.98333333333335, "x": "4番の島田さんが三塁打、平古場が二塁打と続いた。"}, {"t": 261.6333333333333, "x": "いきなり打線がつながったのね。"}, {"t": 264.15, "x": "次の函館中には6対0で勝った。"}, {"t": 266.6666666666667, "x": "準決勝の相手は東京高等師範の付属中学だ。"}, {"t": 270.15, "x": "今でいうとどこの学校？"}, {"t": 271.78333333333336, "x": "いまの筑波大付属だ。"}, {"t": 273.3333333333333, "x": "この試合で、平古場は19個の三振を奪った。"}, {"t": 276.55, "x": "19個！　1試合でそんなに？"}, {"t": 278.7, "x": "ああ。当時の大会記録に並ぶ数字だった。"}, {"t": 281.46666666666664, "x": "そして決勝。相手は京都二中だ。"}, {"t": 283.8, "x": "京都二中は第1回大会で優勝した学校だ。"}, {"t": 286.98333333333335, "x": "最初の優勝校と、決勝で戦うのね。"}, {"t": 289.81666666666666, "x": "試合は投手戦になった。結果は2対0。"}, {"t": 292.56666666666666, "x": "浪華商が初めて、夏の深紅の優勝旗を手にした。"}, {"t": 296.05, "x": "これが、大阪の最初の夏の日本一なのね。"}, {"t": 299.71666666666664, "x": "島田さんと山本さんは、\nそのときの球場の様子も語っている。"}, {"t": 303.6666666666667, "x": "客席は連日、超満員だった。"}, {"t": 306.0, "x": "白いシャツの観客で、スタンドが\n真っ白に見えたそうだ。"}, {"t": 309.48333333333335, "x": "戦争が終わって1年で、みんな野球を見たかったのね。"}, {"t": 312.93333333333334, "x": "島田さんは、また野球ができることが\nとにかくうれしかったと話している。"}, {"t": 317.1333333333333, "x": "相手の学校の選手とも、「よかったな、\n一生懸命やろう」と声をかけ合った。"}, {"t": 322.0, "x": "敵も味方も同じ気持ちだったのね。"}, {"t": 324.4166666666667, "x": "もう一つ、山本さんの話がある。"}, {"t": 326.8333333333333, "x": "負けて帰るチームが、持ってきていた米を差し出した。"}, {"t": 330.0, "x": "勝ち残ったチームに、その米を渡してくれたそうだ。"}, {"t": 333.28333333333336, "x": "食べ物が足りない時代に、お米を？"}, {"t": 335.6166666666667, "x": "ああ。合宿で食べるための米だった。"}, {"t": 338.06666666666666, "x": "戦った相手に、自分たちの食べ物を託したのね。"}, {"t": 341.96666666666664, "x": "優勝のあとの思い出も山本さんは話している。"}, {"t": 344.8333333333333, "x": "阪急が、お祝いに電車を貸し切りにしてくれた。"}, {"t": 347.8, "x": "その電車で、西宮球場から\n箕面の合宿所まで帰ったそうだ。"}, {"t": 352.01666666666665, "x": "電車ごと！　お祝いにしては豪華ね。"}, {"t": 354.35, "x": "山本さんはのちに阪急へお礼に行ったそうだ。"}, {"t": 357.0833333333333, "x": "ただ阪急にはその記録が残っていなかったという。"}, {"t": 360.15, "x": "記録になくても、本人は覚えてるのね。"}, {"t": 362.8666666666667, "x": "島田さんは、トラックに乗ったことも覚えていた。"}, {"t": 365.71666666666664, "x": "優勝旗を持って、大阪市役所へ\nあいさつに行ったんだ。"}, {"t": 368.98333333333335, "x": "そのとき進駐軍に、優勝旗を\n赤い旗と間違えられたそうだ。"}, {"t": 373.0, "x": "深紅の旗だものね。そう見えたのかも。"}, {"t": 376.1166666666667, "x": "エースの平古場さんはそのあとどうなったの？"}, {"t": 378.65, "x": "慶応大学に進んで、通算29勝を挙げた。"}, {"t": 381.8333333333333, "x": "リーグ優勝にも2度、力を貸している。"}, {"t": 384.3, "x": "4番の島田さんは早稲田大学へ進んだ。"}, {"t": 386.8833333333333, "x": "平古場はそのあと社会人の鐘紡で\n10年ほどプレーした。"}, {"t": 390.35, "x": "1963年からは、プロ野球パ・リーグの審判を\n5年間務めている。"}, {"t": 395.51666666666665, "x": "投げる側から、判定する側になったのね。"}, {"t": 398.3333333333333, "x": "島田さんはプロの大映で6年間、二塁を守った。"}, {"t": 401.55, "x": "そして「幸せな野球人生でした」と話している。"}, {"t": 405.53333333333336, "x": "浪華商の日本一はまだ続く。"}, {"t": 407.6666666666667, "x": "1955年の春の選抜で、浪華商は\n2度目の優勝を果たした。"}, {"t": 412.23333333333335, "x": "決勝の相手は群馬の桐生だ。"}, {"t": 414.3, "x": "春に2回、夏に1回。これで3回目の日本一ね。"}, {"t": 418.01666666666665, "x": "ああ。そして次の日本一が、あの怪童の時代だ。"}, {"t": 421.31666666666666, "x": "甲子園の記録では、1961年の夏には\n校名が「浪商」になっている。"}, {"t": 426.8666666666667, "x": "浪華商から浪商へ。呼び名が変わっていたのね。"}, {"t": 430.48333333333335, "x": "1960年の春。浪商に1年生の投手が入ってきた。"}, {"t": 434.76666666666665, "x": "それが尾崎行雄だ。"}, {"t": 436.1333333333333, "x": "岡山の琴浦高校との練習試合で、\n尾崎は4回の途中から投げた。"}, {"t": 440.6166666666667, "x": "そこから9回の2アウトまで、16人連続で三振を取った。"}, {"t": 444.76666666666665, "x": "16人連続！？　1年生でしょ？"}, {"t": 447.18333333333334, "x": "しかも同じ日の午後、\n岡山東商との試合では先発した。"}, {"t": 451.1, "x": "18個の三振を奪って完封している。"}, {"t": 453.71666666666664, "x": "1日で30個以上も三振を取ったの？"}, {"t": 456.4166666666667, "x": "この話は『甲子園怪物剛球伝説』という\n本に残っている。"}, {"t": 460.56666666666666, "x": "その年の夏、尾崎は1年生で\nエースとして甲子園に出た。"}, {"t": 464.46666666666664, "x": "いきなり甲子園のマウンドね。"}, {"t": 466.8666666666667, "x": "1960年夏の2回戦。"}, {"t": 469.01666666666665, "x": "浪商の相手は神奈川の法政二だった。"}, {"t": 471.6, "x": "7回までは0対0。ところが8回に4点を取られた。"}, {"t": 475.23333333333335, "x": "0対4。尾崎の1年生の夏はここで終わった。"}, {"t": 478.4, "x": "法政二はその夏に優勝した。"}, {"t": 480.31666666666666, "x": "法政二の話は、このチャンネルの別の回でしている。"}, {"t": 483.68333333333334, "x": "翌1961年の春、尾崎は\n2年生になってまた選抜に出た。"}, {"t": 488.43333333333334, "x": "準々決勝で、また法政二と当たった。"}, {"t": 491.2, "x": "また法政二なの？"}, {"t": 492.55, "x": "浪商が2回に先に1点を\n取った。だが5回に逆転された。"}, {"t": 496.45, "x": "尾崎は11個の三振を奪ったが、1対3で負けた。"}, {"t": 499.93333333333334, "x": "法政二はそのまま、春も優勝した。"}, {"t": 502.55, "x": "2回とも尾崎に勝った法政二が優勝したのね。"}, {"t": 506.15, "x": "1961年の夏。尾崎は2年生のエースだ。"}, {"t": 509.8, "x": "大阪の予選を、50イニング\n1点も取られずに勝ち抜いた。"}, {"t": 513.4166666666666, "x": "50イニング無失点！"}, {"t": 514.6666666666666, "x": "予選の間、ずっとゼロだったのね。"}, {"t": 517.1333333333333, "x": "この年のチームには、1年生で\n1人だけベンチに入った選手がいた。"}, {"t": 521.4, "x": "それが、のちに巨人で活躍する高田繁さんだ。"}, {"t": 524.65, "x": "甲子園の2試合目から、左翼手として試合に出ている。"}, {"t": 528.1, "x": "冒頭で尾崎のことを話していた人ね。"}, {"t": 530.6833333333333, "x": "甲子園の最初の試合は浜松商。1対0で勝った。"}, {"t": 534.15, "x": "次の銚子商には2対1。"}, {"t": 536.0666666666667, "x": "どっちも1点差。きわどいわね。"}, {"t": 538.2, "x": "ところがその次の中京商には、14対0で大勝した。"}, {"t": 542.0833333333334, "x": "急に打線が爆発したのね。"}, {"t": 544.1666666666666, "x": "そして準決勝。相手はまた法政二だった。"}, {"t": 547.65, "x": "3回連続で同じ相手なの？"}, {"t": 549.7333333333333, "x": "ああ。前の年の夏、この年の春、そしてこの夏。"}, {"t": 553.1333333333333, "x": "3大会続けての対戦だ。"}, {"t": 555.1666666666666, "x": "試合は法政二が1回と4回に1点ずつ取った。"}, {"t": 558.2833333333333, "x": "浪商は8回が終わっても、まだ0点だった。"}, {"t": 561.3, "x": "また負けちゃうの？"}, {"t": 562.4833333333333, "x": "9回。浪商は2アウトから満塁まで攻めた。"}, {"t": 565.4166666666666, "x": "打席に入ったのはエースの尾崎自身だった。"}, {"t": 568.1, "x": "尾崎の打球はタイムリーヒット。2対2の同点だ。"}, {"t": 571.35, "x": "投げるだけじゃなくて、打つほうでも！"}, {"t": 573.5666666666667, "x": "試合は延長に入った。"}, {"t": 575.0833333333334, "x": "11回、尾崎のライトへの犠牲フライなどで、\n浪商が2点を奪った。"}, {"t": 579.4, "x": "4対2。3度目の対戦で、尾崎がついに勝った。"}, {"t": 582.8333333333334, "x": "やっと壁を越えたのね。"}, {"t": 584.4166666666666, "x": "3大会ともこの対決に勝った\n学校が、その大会で優勝している。"}, {"t": 589.3833333333333, "x": "決勝の相手は和歌山の桐蔭だった。"}, {"t": 591.8333333333334, "x": "和歌山の桐蔭ってどこかで聞いた気がする。"}, {"t": 594.4833333333333, "x": "1946年の最初の試合で、浪華商が\n勝った和歌山中。それが今の桐蔭だ。"}, {"t": 600.2166666666667, "x": "15年たってまた同じ学校と当たったのね！"}, {"t": 603.0833333333334, "x": "試合は1対0。浪商が逃げ切った。"}, {"t": 605.6166666666667, "x": "浪商の夏の優勝は、1946年から15年ぶり、2回目だ。"}, {"t": 610.4166666666666, "x": "1946年が2対0、1961年が1対0。"}, {"t": 614.8833333333333, "x": "夏の決勝はどちらも完封だ。"}, {"t": 617.1166666666667, "x": "4回目の日本一。名門の頂点の時代ね。"}, {"t": 620.8333333333334, "x": "優勝した年の11月。"}, {"t": 622.5333333333333, "x": "尾崎は浪商をやめて、プロ野球の東映に入った。"}, {"t": 625.75, "x": "17歳だった。東映は\nいまの日本ハムにつながる球団だ。"}, {"t": 629.6333333333333, "x": "高校2年生で、もうプロに？"}, {"t": 631.7, "x": "ああ。翌年の開幕2戦目、\n4月8日の大毎戦で初めてマウンドに立った。"}, {"t": 636.6333333333333, "x": "延長10回。尾崎は相手の3人を打ち取った。"}, {"t": 639.6, "x": "投げたのは15球。全部まっすぐだったという。"}, {"t": 642.5, "x": "変化球なしで、プロの打者を？"}, {"t": 644.6, "x": "相手の大毎には強打者の山内一弘がいた。"}, {"t": 647.5333333333333, "x": "山内は尾崎の球について、\nこう話したと伝えられている。"}, {"t": 651.1, "x": "「球が速すぎて途中から消える」。"}, {"t": 653.2, "x": "プロの打者が、消えるって言うなんて。"}, {"t": 655.45, "x": "尾崎は1年目に20勝を挙げて、新人王になった。"}, {"t": 658.8, "x": "最初の5年間で、20勝以上を4度も記録している。"}, {"t": 662.85, "x": "ただ尾崎はそのあと、けがに苦しんだ。"}, {"t": 665.2666666666667, "x": "1973年、29歳で引退している。"}, {"t": 668.7666666666667, "x": "29歳。ずいぶん早いわね。"}, {"t": 670.9333333333333, "x": "プロの12年間で、107勝83敗だった。"}, {"t": 674.3333333333334, "x": "そして2013年6月、68歳で亡くなった。"}, {"t": 678.0833333333334, "x": "それでも今も語り継がれてるのね。"}, {"t": 680.3, "x": "一緒に優勝した高田さんの記事の見出しには、「\n速いとか、そんな次元じゃない」という言葉もある。"}, {"t": 686.1833333333333, "x": "同じチームで、すぐそばで見ていた人の言葉なのね。"}, {"t": 689.5166666666667, "x": "高田さんは浪商から明治大学に進み、巨人に入った。"}, {"t": 693.9, "x": "1960年代の大阪には、強い\n私立校が7つそろっていた。"}, {"t": 698.3166666666667, "x": "興国、明星、PL学園、浪商、北陽、近大付、大鉄。"}, {"t": 702.9833333333333, "x": "「私学7強」と呼ばれた時代だ。"}, {"t": 705.2666666666667, "x": "浪商はその中の一つだったのね。"}, {"t": 707.6833333333333, "x": "ああ。この強い学校たちを倒さないと、\n甲子園には出られなかった。"}, {"t": 711.8, "x": "日本一になるより、大阪で勝つほうが大変そう。"}, {"t": 715.0666666666667, "x": "そして1979年。浪商はまた、\n全国から注目を集めることになる。"}, {"t": 721.0, "x": "1979年の浪商には、全国から\n注目されたバッテリーがいた。"}, {"t": 725.8333333333334, "x": "エースの牛島和彦と、キャッチャーの香川伸行だ。"}, {"t": 729.1, "x": "香川は「ドカベン」と呼ばれていた。"}, {"t": 731.4166666666666, "x": "漫画の主人公と同じあだ名ね。"}, {"t": 733.5833333333334, "x": "牛島によると、香川は中学生の\nころからスーパースターだったそうだ。"}, {"t": 737.7333333333333, "x": "この年の春の選抜で、浪商は決勝まで勝ち進んだ。"}, {"t": 741.4333333333333, "x": "牛島は5試合、48イニングを1人で投げた。"}, {"t": 744.6166666666667, "x": "準々決勝から決勝までの3日間で、\n500球以上を投げたという。"}, {"t": 748.9333333333333, "x": "3日で500球！？"}, {"t": 750.2166666666667, "x": "決勝の相手は和歌山の箕島だった。"}, {"t": 752.65, "x": "箕島が5回までに4対1とリードした。"}, {"t": 755.25, "x": "浪商は6回と7回に点を重ねて、一度は逆転した。"}, {"t": 759.1666666666666, "x": "追いついて、追い越したのね！"}, {"t": 761.0, "x": "だが箕島が7回の裏にまた逆転した。"}, {"t": 763.6166666666667, "x": "両校のヒットが飛び交う打撃戦だった。"}, {"t": 766.1666666666666, "x": "浪商は準優勝。牛島はこの決勝で4連投だった。"}, {"t": 769.8666666666667, "x": "あと少しで5回目の日本一だったのね。"}, {"t": 773.0833333333334, "x": "選抜の決勝の2日後。"}, {"t": 774.7166666666667, "x": "牛島は大阪の北野高校との定期戦に出た。"}, {"t": 777.8333333333334, "x": "1イニングだけという約束での登板だった。"}, {"t": 780.4833333333333, "x": "ところがこの試合で腰を痛めてしまった。"}, {"t": 783.0833333333334, "x": "夏の前に、エースがけが？"}, {"t": 784.95, "x": "記事の見出しには、痛み止めの注射を\n6カ所に打ち、さらしを巻いたとある。"}, {"t": 789.3166666666667, "x": "そして大阪大会の決勝で、PL学園に勝った。"}, {"t": 792.8, "x": "春の準優勝校が、夏も大阪を勝ち抜いたのね。"}, {"t": 796.15, "x": "牛島は「投手は自分だけだから」と投げ続けたそうだ。"}, {"t": 800.35, "x": "1979年夏の甲子園。"}, {"t": 802.6666666666666, "x": "浪商の最初の相手は埼玉の上尾だった。"}, {"t": 805.4333333333333, "x": "上尾のエースは仁村徹だ。"}, {"t": 807.1333333333333, "x": "浪商はなかなか打てず、0対2のまま9回を迎えた。"}, {"t": 810.75, "x": "また9回まで追いかける展開ね。"}, {"t": 812.9666666666667, "x": "9回、打席に立ったのはエースの牛島だった。"}, {"t": 815.95, "x": "牛島は一塁へ走りながら、\nファウルになるかもと思ったそうだ。"}, {"t": 819.6666666666666, "x": "でも審判が手を回すのが見えて、\nホームランだとわかった。"}, {"t": 823.15, "x": "同点ホームラン！"}, {"t": 824.35, "x": "牛島は「高校時代、公式戦で打った\nホームランはこれだけ」と話している。"}, {"t": 829.1666666666666, "x": "ただ1本のホームランが、この場面だったのね。"}, {"t": 832.1166666666667, "x": "試合は延長に入り、11回の表に\n浪商が1点を取って勝った。"}, {"t": 836.45, "x": "1961年の尾崎の同点打と、そっくりね。"}, {"t": 840.1666666666666, "x": "エースが9回に自分のバットで\n追いついたところまで同じだ。"}, {"t": 843.5166666666667, "x": "次の倉敷商には、牛島が4対0で完投勝ちした。"}, {"t": 847.9, "x": "浪商は準決勝まで進んだ。"}, {"t": 849.9166666666666, "x": "相手は徳島の池田だった。"}, {"t": 851.75, "x": "この試合で浪商は敗れて、ベスト4で夏を終えた。"}, {"t": 855.05, "x": "春は準優勝、夏はベスト4。それでも強かったのね。"}, {"t": 858.7833333333333, "x": "牛島はのちに、こう話している。"}, {"t": 860.9166666666666, "x": "「責任は果たしたぞという誇らしい気持ちでしたね」。"}, {"t": 863.9833333333333, "x": "注目された分、背負っていたものも大きかったのね。"}, {"t": 867.2333333333333, "x": "負けたあと、牛島は箕島を励ましに行った。"}, {"t": 870.1166666666667, "x": "香川は池田の宿舎を訪ねて\n「頑張れよ」と声をかけたそうだ。"}, {"t": 874.2166666666667, "x": "負けた相手を応援しに行ったの？"}, {"t": 876.1666666666666, "x": "ああ。1946年の米の話と、どこか重なるな。"}, {"t": 880.35, "x": "戦った相手に思いを託すのは、昔から同じなのね。"}, {"t": 884.5, "x": "その年の秋のドラフト会議。"}, {"t": 886.4, "x": "牛島は中日から1位で指名された。"}, {"t": 888.8166666666667, "x": "香川は南海から2位で指名された。"}, {"t": 891.1, "x": "バッテリーそろってプロに入ったのね。"}, {"t": 893.35, "x": "そしてこの1979年の夏が、浪商が\n出た最後の夏の甲子園になった。"}, {"t": 899.3333333333334, "x": "1979年のあとは、ずっと甲子園に出てないの？"}, {"t": 903.1666666666666, "x": "春は2002年に出ている。"}, {"t": 904.7166666666667, "x": "2025年2月の記事の時点では、\nそれが最後の甲子園だ。"}, {"t": 908.8833333333333, "x": "2026年の夏も、大阪大会で\n敗れて甲子園には届かなかった。"}, {"t": 913.65, "x": "大阪で勝ち抜くのは今も大変なのね。"}, {"t": 916.25, "x": "それでも野球部は続いている。"}, {"t": 918.0333333333333, "x": "2024年11月、大阪市内で\n野球部の創部100周年の式典が開かれた。"}, {"t": 923.45, "x": "OBの張本勲さんもメッセージを寄せている。"}, {"t": 926.3, "x": "100年続いた野球部なのね。"}, {"t": 928.8, "x": "校舎も焼けた学校が、どうして\n大阪で最初に夏を取れたのかしら。"}, {"t": 933.0166666666667, "x": "工場へ働きに出ても、道具を\n持っていってキャッチボールを続けた。"}, {"t": 936.8833333333333, "x": "野球をやめなかった30人ほどが、\n焼け跡から最初の旗を運んだんだ。"}, {"t": 941.4666666666667, "x": "その15年後には、怪童の尾崎が\n2本目を持ち帰ったのね。"}, {"t": 945.3166666666667, "x": "ただ夏の甲子園は1979年が最後。"}, {"t": 948.3833333333333, "x": "2026年の夏も大阪大会で敗れた。"}, {"t": 951.5666666666667, "x": "100年続いた野球部に、\n3本目の夏の旗はまだ来ていないのね。"}, {"t": 955.7833333333333, "x": "大阪で最初に旗を持ち帰った学校が、\nもう一度あの舞台に立てるか。"}, {"t": 960.2333333333333, "x": "その夏が来たら、この続きを一緒に見届けましょ。"}, {"t": 963.4, "x": "最後まで見てくれて、ありがとう。またね。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
