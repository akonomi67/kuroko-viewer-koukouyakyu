<script>
const D={"name": "金足農", "file": "053_編集用", "dur": 600.4, "segs": [], "subs": [{"t": 0.0, "x": "2018年の夏。甲子園の決勝は2対13で終わった。"}, {"t": 3.95, "x": "優勝したのは大阪桐蔭。"}, {"t": 5.533333333333333, "x": "準優勝は秋田の金足農だ。"}, {"t": 7.766666666666667, "x": "11点差ってずいぶん大きいわね。"}, {"t": 9.933333333333334, "x": "ああ。それでも日本高野連の大会小史は、\n負けた側のことも書いている。"}, {"t": 14.333333333333334, "x": "準優勝は金足農。"}, {"t": 15.85, "x": "秋田勢としては\n第1回大会の秋田中以来の準優勝だった。"}, {"t": 19.9, "x": "第1回っていつの話なの？"}, {"t": 21.933333333333334, "x": "1915年だ。2018年まで数えると、103年になる。"}, {"t": 26.6, "x": "103年も秋田の学校は決勝に来ていなかったのね。"}, {"t": 30.1, "x": "そうなる。しかも金足農は県立の農業高校だ。"}, {"t": 33.36666666666667, "x": "そして34年前の1984年にも\n初めての夏で4強まで来ている。"}, {"t": 38.516666666666666, "x": "どんな学校で、どうやって103年の壁まで来たの？"}, {"t": 41.88333333333333, "x": "今回は日本高野連の表と、\n試合の記録と、学校の資料で辿っていく。"}, {"t": 46.516666666666666, "x": "始める前にチャンネル登録と高評価をお願いしたい。"}, {"t": 49.75, "x": "よろしくね。"}, {"t": 51.233333333333334, "x": "金足農ってどこにある学校なの？"}, {"t": 53.5, "x": "秋田市の金足追分という\n所にある、県立の農業高校だ。"}, {"t": 57.45, "x": "学校の資料には校長の言葉でこう書いてある。"}, {"t": 60.233333333333334, "x": "昭和3年に秋田県の中央地区の産業教育を\n担う学校として作られた。"}, {"t": 65.0, "x": "1928年のことだ。"}, {"t": 66.96666666666667, "x": "主に農業の学校だな。"}, {"t": 68.8, "x": "90年以上前からある学校なのね。"}, {"t": 71.3, "x": "ああ。卒業生は2万人を超えると、同じ資料にある。"}, {"t": 74.7, "x": "秋田の農業高校の中心の学校だ、とも書いている。"}, {"t": 78.2, "x": "野球の強い私立の学校とはずいぶん違うのね。"}, {"t": 81.25, "x": "そうだな。だがこの学校の話の前に、\nまず103年前の秋田を見ておこう。"}, {"t": 86.65, "x": "1915年の第1回大会。"}, {"t": 88.88333333333334, "x": "日本高野連の表では、参加は73校だった。"}, {"t": 92.21666666666667, "x": "全国大会に来たのは10校だけだ。"}, {"t": 94.73333333333333, "x": "10校しかいなかったの？"}, {"t": 96.4, "x": "ああ。東北の代表が秋田中だった。"}, {"t": 98.8, "x": "記録のサイトで秋田中の試合を見てみよう。"}, {"t": 101.36666666666666, "x": "準々決勝は三重四中に9対1。"}, {"t": 103.78333333333333, "x": "準決勝は東京の早稲田実に3対1で勝った。"}, {"t": 107.0, "x": "東北の学校がいきなり決勝まで行ったのね。"}, {"t": 109.88333333333334, "x": "決勝の相手は京都二中だ。"}, {"t": 111.75, "x": "7回に秋田中が1点を先に入れた。"}, {"t": 114.25, "x": "8回に京都二中が追いついて、\n1対1のまま延長に入った。"}, {"t": 118.35, "x": "延長は何回まで続いたの？"}, {"t": 120.3, "x": "13回だ。京都二中が1点を入れて、1対2で終わった。"}, {"t": 124.26666666666667, "x": "あと少しで第1回の優勝校だったのね。"}, {"t": 127.01666666666667, "x": "そうだ。そして秋田の学校が次に\n決勝に来るまで、ここから103年かかる。"}, {"t": 132.56666666666666, "x": "金足農はいつから甲子園をめざしていたの？"}, {"t": 135.31666666666666, "x": "秋田の新聞社の記録に秋田大会の決勝の一覧がある。"}, {"t": 139.0, "x": "その一覧で、いちばん古い金足農の決勝は1960年だ。"}, {"t": 143.33333333333334, "x": "このときは秋田商に0対6で負けている。"}, {"t": 146.06666666666666, "x": "この決勝は点が入らなかったのね。"}, {"t": 148.43333333333334, "x": "1971年も決勝で負けた。"}, {"t": 150.95, "x": "1981年は1対2。"}, {"t": 153.2, "x": "1983年は0対3だ。"}, {"t": 155.91666666666666, "x": "決勝で4回も負けたの？"}, {"t": 157.76666666666668, "x": "ああ。あと1つ勝てば\n甲子園、という所で4度止まった。"}, {"t": 161.3, "x": "一覧で5つ目の決勝が、1984年の夏だ。"}, {"t": 165.13333333333333, "x": "相手は能代。点数は6対5だった。"}, {"t": 167.7, "x": "1点差でやっと勝ったのね。"}, {"t": 169.51666666666668, "x": "これが金足農の初めての夏の甲子園になった。"}, {"t": 172.58333333333334, "x": "この年は春のセンバツの表にも金足農の名前がある。"}, {"t": 176.01666666666668, "x": "1984年は春も夏も甲子園に行ったのね。"}, {"t": 180.1, "x": "1984年の夏。日本高野連の表では、\n代表は49校だった。"}, {"t": 185.25, "x": "金足農の1回戦の相手は広島商だ。"}, {"t": 188.1, "x": "広島商って夏に何度も優勝している学校よね。"}, {"t": 191.43333333333334, "x": "そうだ。その広島商に、6対3で勝った。"}, {"t": 194.53333333333333, "x": "1回に2点、2回に1点。"}, {"t": 196.3, "x": "最初から点を重ねている。"}, {"t": 198.23333333333332, "x": "初めての甲子園で強い学校に勝ったのね。"}, {"t": 201.08333333333334, "x": "2回戦は別府商に5対3。"}, {"t": 202.86666666666667, "x": "3回戦は唐津商に6対4だ。"}, {"t": 205.25, "x": "唐津商との試合は9回に3点を入れて勝ち越している。"}, {"t": 208.75, "x": "最後の回にひっくり返したのね。"}, {"t": 210.96666666666667, "x": "準々決勝は新潟南に6対0。"}, {"t": 213.4, "x": "相手に1点も与えなかった。"}, {"t": 215.41666666666666, "x": "初めての夏で4強まで来たのね。"}, {"t": 217.8, "x": "準決勝の相手は大阪のPL学園だった。"}, {"t": 220.65, "x": "1回に金足農が1点。"}, {"t": 222.23333333333332, "x": "6回にPL学園が追いついた。"}, {"t": 224.38333333333333, "x": "7回に金足農がまた1点を入れて、2対1になった。"}, {"t": 228.05, "x": "勝ってるじゃない。"}, {"t": 229.13333333333333, "x": "だが8回に、PL学園が2点を入れた。"}, {"t": 231.85, "x": "2対3。決勝まで、あと1勝だった。"}, {"t": 234.58333333333334, "x": "初めての夏でそこまで行ったのね。"}, .3666666666667, "x": "日本高野連の表では、参加は\n3781校。代表は56校だ。"}, {"t": 359.6166666666667, "x": "いつもの夏より代表が多いのね。"}, {"t": 361.76666666666665, "x": "記念の大会だからな。"}, {"t": 363.35, "x": "その前の4年の秋田の代表は、角館、\n秋田商、大曲工、明桜だった。"}, {"t": 368.71666666666664, "x": "ここでも毎年、ちがう学校なのね。"}, {"t": 371.2, "x": "ああ。そして2018年の秋田大会の決勝の相手は、\n2017年と同じ明桜だ。"}, {"t": 376.8333333333333, "x": "今度は金足農が2対0で勝った。"}, {"t": 379.26666666666665, "x": "1年前に負けた相手に、今度は勝ったのね。"}, {"t": 382.2, "x": "甲子園の1回戦は、鹿児島実に5対1。"}, {"t": 385.15, "x": "2回戦の相手が、大垣日大だった。"}, {"t": 387.8833333333333, "x": "11年前に、1点差で負けた学校ね。"}, {"t": 390.8, "x": "そうだ。この試合は6対3で金足農が勝った。"}, {"t": 393.9166666666667, "x": "3回戦は、神奈川の横浜だ。"}, {"t": 396.21666666666664, "x": "7回まで、横浜が4対2で前を走っていた。"}, {"t": 399.51666666666665, "x": "2点も負けてたのね。"}, {"t": 401.06666666666666, "x": "8回に、金足農が3点を入れた。5対4で逆転だ。"}, {"t": 404.93333333333334, "x": "また終わりのほうで、ひっくり返したのね。"}, {"t": 407.51666666666665, "x": "準々決勝は滋賀の近江。"}, {"t": 409.06666666666666, "x": "8回まで1対2で負けていた。"}, {"t": 411.15, "x": "9回に2点を入れて、3対2のサヨナラ勝ちだ。"}, {"t": 414.35, "x": "最後の最後で、決めたのね。"}, {"t": 416.3666666666667, "x": "準決勝は西東京の日大三に2対1。"}, {"t": 419.23333333333335, "x": "1回と5回に1点ずつ。"}, {"t": 420.8333333333333, "x": "8回に1点を返されたが、逃げ切った。"}, {"t": 423.65, "x": "これで決勝ね。"}, {"t": 424.8666666666667, "x": "ああ。秋田の学校が決勝に来るのは、\n1915年の秋田中以来だ。"}, {"t": 430.21666666666664, "x": "決勝の相手は、北大阪の大阪桐蔭だ。"}, {"t": 433.06666666666666, "x": "1回に3点を入れられた。4回にも3点。"}, {"t": 435.9166666666667, "x": "5回には6点を入れられた。"}, {"t": 437.78333333333336, "x": "5回だけで6点なの？"}, {"t": 439.46666666666664, "x": "ああ。金足農は3回と7回に1点ずつ\n入れたが、2対13で終わった。"}, {"t": 444.21666666666664, "x": "最後は大差だったのね。"}, {"t": 445.9, "x": "それでも大会小史は、この夏の準優勝を\n秋田中と並べて書いた。"}, {"t": 450.28333333333336, "x": "1915年と2018年じゃ、大会の大きさもちがうわよね。"}, {"t": 454.75, "x": "参加した学校の数で比べると、73校と3781校だ。"}, {"t": 459.8333333333333, "x": "50倍くらいになってるのね。"}, {"t": 461.73333333333335, "x": "ああ。その中で、秋田の学校が2度目の決勝に立った。"}, {"t": 465.31666666666666, "x": "この夏の投手だった吉田輝星は、\nその年の秋のドラフトで1位に選ばれた。"}, {"t": 470.06666666666666, "x": "野球 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
