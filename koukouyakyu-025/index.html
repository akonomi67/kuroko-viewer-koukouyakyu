<title>浜松商</title>
<style>

<script>
const D={"name": "浜松商", "file": "025_編集用", "dur": 967.01665625, "segs": [], "subs": [{"t": 0.0, "x": "2007年の春。甲子園のセンバツ大会の決勝。"}, {"t": 3.3666666666666667, "x": "静岡の常葉菊川が、岐阜の大垣日大を6対5で破った。"}, {"t": 7.6, "x": "1点差の決勝ね。"}, {"t": 9.116666666666667, "x": "静岡の学校が春の優勝旗を\n持ち帰るのは29年ぶりだった。"}, {"t": 13.166666666666666, "x": "ベンチで指揮を執っていたのは、\n森下知幸という監督だ。"}, {"t": 16.95, "x": "29年ぶりってことは、その前にも\n静岡の優勝があったのね。"}, {"t": 21.1, "x": "ああ。1978年の春だ。"}, {"t": 23.5, "x": "勝ったのは県立の浜松商。"}, {"t": 25.516666666666666, "x": "そしてその1978年のチームで、\n主将を務めていたのが森下だった。"}, {"t": 30.733333333333334, "x": "えっ、同じ人なの？"}, {"t": 32.35, "x": "そうだ。選手として1回。監督として1回。"}, {"t": 35.5, "x": "静岡に春の優勝旗が来た最近の2回は、\nどちらも同じ人がその場にいた。"}, {"t": 40.43333333333333, "x": "じゃあ、その最初の1回はどんなチームだったの？"}, {"t": 43.233333333333334, "x": "公立の商業高校が、どうやって\n日本一まで行ったのかしら。"}, {"t": 47.63333333333333, "x": "今回は浜松商の歩みを、\n甲子園の点数と人の名前で追っていく。"}, {"t": 51.95, "x": "始まりの夏から、1978年の5試合、\nそして優勝のあとの人たちまでだ。"}, {"t": 57.53333333333333, "x": "見てくれる人は、チャンネル登録と\n高評価をしてもらえると助かる。"}, {"t": 61.61666666666667, "x": "よろしくね。それで、浜松商ってどんな学校なの？"}, {"t": 65.63333333333334, "x": "正式な名前は、静岡県立浜松商業高校。"}, {"t": 69.05, "x": "場所は浜松市中央区の文丘町だ。"}, {"t": 71.51666666666667, "x": "地元では短く「浜商」と呼ばれている。"}, {"t": 74.43333333333334, "x": "浜松の商業高校だから浜商ね。"}, {"t": 76.96666666666667, "x": "学校の始まりは1899年。明治32年だ。"}, {"t": 80.95, "x": "町立の商業学校として始まったと伝えられている。"}, {"t": 84.35, "x": "120年以上も前なのね。"}, {"t": 86.35, "x": "いまは商業科と情報処理科がある。"}, {"t": 88.43333333333334, "x": "校訓は「誠実・勤勉・敬愛」の3つだ。"}, {"t": 91.8, "x": "野球部も古いの？"}, {"t": 93.13333333333334, "x": "2025年の記事では、前の年に\n創部100年の節目を越えたと書かれている。"}, {"t": 97.93333333333334, "x": "甲子園には春に8回、夏に9回。"}, {"t": 100.35, "x": "合わせて17回出ている。"}, {"t": 102.18333333333334, "x": "17回のうち、日本一が1回なのね。"}, {"t": 105.11666666666666, "x": "ああ。ただ最初から強かったわけではない。"}, {"t": 107.6, "x": "まずは初めて甲子園に立った夏から見ていこう。"}, {"t": 111.05, "x": "浜松商が初めて甲子園に出たのは1950年の夏だ。"}, {"t": 115.08333333333333, "x": "初戦の相手は大分の別府一。"}, {"t": 116.93333333333334, "x": "点の取り合いになった。"}, {"t": 118.38333333333334, "x": "11対10。1点差で甲子園の初勝利をつかんだ。"}, {"t": 121.9, "x": "最初から打ち合いなのね。"}, {"t": 123.53333333333333, "x": "ところが2回戦で福井の若狭と当たる。"}, {"t": 125.98333333333333, "x": "試合は延長14回までもつれた。"}, {"t": 128.18333333333334, "x": "最後は2対3。1点差で敗れている。"}, {"t": 130.78333333333333, "x": "14回まで戦って1点差か……。"}, {"t": 133.13333333333333, "x": "春の甲子園に初めて出たのは、\nその4年後の1954年だ。"}, {"t": 137.43333333333334, "x": "このときは初戦で大阪の泉陽に1対5で敗れた。"}, {"t": 140.63333333333333, "x": "1956年の春には、香川の高松商に5対2で勝った。"}, {"t": 145.11666666666667, "x": "それが春の初勝利ね。"}, {"t": 146.85, "x": "そうだ。だが次の県尼崎には1対5で敗れている。"}, {"t": 150.3, "x": "そこから先がなかなか届かない。"}, {"t": 152.38333333333333, "x": "1961年の夏は、大阪の浪商に0対1。"}, {"t": 156.43333333333334, "x": "また1点差。"}, {"t": 157.55, "x": "1964年の春は、高知の土佐に延長10回で3対7。"}, {"t": 161.98333333333332, "x": "1967年の夏も、また土佐と当たった。"}, {"t": 165.36666666666667, "x": "今度は延長11回。3対6で敗れている。"}, {"t": 168.46666666666667, "x": "同じ相手に、2回とも延長で負けたの？"}, {"t": 171.2, "x": "ああ。1950年から1967年までの甲子園は6回。"}, {"t": 175.76666666666668, "x": "そのうち3回が、延長戦での負けだった。"}, {"t": 178.68333333333334, "x": "あと少しのところで止まっていたのね。"}, {"t": 181.0, "x": "勝ちは春と夏で2つ。"}, {"t": 182.5, "x": "どちらも初戦の勝ちだった。"}, {"t": 184.93333333333334, "x": "流れが変わり始めるのは1970年代だ。"}, {"t": 188.11666666666667, "x": "OB会の名簿では、1973年の欄に\n監督として磯部の名がある。"}, {"t": 193.01666666666668, "x": "この磯部が、のちに1978年の優勝を率いた監督だ。"}, {"t": 197.6, "x": "その人が来てから強くなったの？"}, {"t": 199.85, "x": "はっきり言えるのは、結果の数字だけだ。"}, {"t": 202.28333333333333, "x": "1975年の夏、浜松商は\n8年ぶりに甲子園に戻ってきた。"}, {"t": 207.16666666666666, "x": "1950年の初出場から数えて、\n夏の甲子園はこれが4回目だった。"}, {"t": 212.23333333333332, "x": "初戦は茨城の竜ヶ崎一に8対4で勝った。"}, {"t": 215.31666666666666, "x": "2回戦の相手は石川高校。ここで大きな場面が来る。"}, {"t": 218.78333333333333, "x": "負けて迎えた最後の攻撃で、\n高林が2点本塁打を打った。"}, {"t": 222.73333333333332, "x": "逆転サヨナラの2点本塁打は、\n甲子園で史上初と伝えられている。"}, {"t": 227.11666666666667, "x": "最後の1振りでひっくり返したのね！"}, {"t": 229.56666666666666, "x": "6対5。浜松商は夏の甲子園で\n初めて2回戦を勝ち抜いた。"}, {"t": 233.81666666666666, "x": "3回戦は奈良の天理に2対9で敗れている。"}, {"t": 236.78333333333333, "x": "それでも、初めての3回戦ね。"}, {"t": 239.16666666666666, "x": "ああ。そしてこの3年後の春に、\nあの大会がやってくる。"}, {"t": 243.31666666666666, "x": "1978年の春のセンバツは、\n第50回の記念大会だった。"}, {"t": 248.05, "x": "開幕は3月27日。出場したのは30校だ。"}, {"t": 251.91666666666666, "x": "記念の大会って、何か特別なことがあったの？"}, {"t": 255.18333333333334, "x": "この大会では、前橋の松本稔が\n完全試合を達成している。"}, {"t": 259.3333333333333, "x": "春と夏の甲子園を通じて、初めての完全試合だった。"}, {"t": 263.1333333333333, "x": "同じ大会にそんな記録があったのね。"}, {"t": 265.5833333333333, "x": "大会通算で150本目の本塁打も、この春に出ている。"}, {"t": 269.3666666666667, "x": "日本高野連は、この2つの記録が\n記念大会を飾ったと書いている。"}, {"t": 273.6, "x": "そして同じ文の最後に、こう続く。"}, {"t": 275.81666666666666, "x": "「浜松商が初優勝」。"}, {"t": 277.6166666666667, "x": "記録の大会の主役の1つが、浜松商だったのね。"}, {"t": 281.3333333333333, "x": "静岡からは浜松商が出ていた。"}, {"t": 283.53333333333336, "x": "静岡の学校の春の優勝は、\n1952年の静岡商が最後だった。"}, {"t": 288.45, "x": "その前は1950年の韮山。"}, {"t": 290.75, "x": "静岡は2回、春に勝っていた。"}, {"t": 293.1, "x": "浜松商の春は、それまでどうだったの？"}, {"t": 295.8, "x": "ああ。春の甲子園で2つ勝ったことすらなかった。"}, {"t": 299.51666666666665, "x": "1回戦の相手は島根の益田だ。"}, {"t": 301.73333333333335, "x": "浜松商は6回に2点。"}, {"t": 303.35, "x": "7回に1点を加えた。"}, {"t": 305.0833333333333, "x": "マウンドには2年生のエース、樽井がいた。"}, {"t": 307.5833333333333, "x": "樽井は益田を0点に抑えた。3対0の完封だ。"}, {"t": 311.06666666666666, "x": "2年生でいきなり完封なの？"}, {"t": 313.05, "x": "そうだ。続く2回戦は、東京の早実だった。"}, {"t": 316.35, "x": "東京の名門ね。"}, {"t": 317.7, "x": "この試合は苦しかった。"}, {"t": 319.0833333333333, "x": "6回を終えて1対4だ。"}, {"t": 320.96666666666664, "x": "3点も負けてるじゃない。"}, {"t": 322.5833333333333, "x": "だが7回に1点を返す。"}, {"t": 324.3833333333333, "x": "8回にさらに2点。4対4に追いついた。"}, {"t": 327.1666666666667, "x": "そして9回。青野の打球で勝ち越した。"}, {"t": 329.76666666666665, "x": "5対4。3点差をひっくり返して勝ったんだ。"}, {"t": 332.76666666666665, "x": "ここで初めて、春に2つ勝ったのね。"}, {"t": 335.45, "x": "ああ。ここから先は、浜松商に\nとって初めての景色だった。"}, {"t": 340.05, "x": "準々決勝の相手は、宮城の東北だ。"}, {"t": 342.76666666666665, "x": "浜松商は3回に足を使って攻めた。"}, {"t": 345.3833333333333, "x": "走って2点を先に取り、8回にも1点を足した。"}, {"t": 348.65, "x": "樽井は東北打線を5安打に抑えた。"}, {"t": 351.0833333333333, "x": "また0点？"}, {"t": 352.03333333333336, "x": "そうだ。3対0。この大会2つ目の完封だ。"}, {"t": 355.35, "x": "準決勝は群馬の桐生。ここで思わぬことが起きる。"}, {"t": 358.5, "x": "5回、好投していた青野が死球を受けて退場した。"}, {"t": 361.81666666666666, "x": "えっ、試合の途中で？"}, {"t": 363.45, "x": "ああ。それでも試合は2対2のまま7回へ進む。"}, {"t": 366.45, "x": "ここで小沢が打った。"}, {"t": 367.6, "x": "勝ち越しの適時打だ。"}, {"t": 369.1166666666667, "x": "3対2。浜松商は決勝に進んだ。"}, {"t": 371.93333333333334, "x": "1点差を守りきったのね。"}, {"t": 373.76666666666665, "x": "ここまでの4試合で取られた点は、合わせて6点だ。"}, {"t": 376.98333333333335, "x": "そのうち4点は、早実戦の6回までに\n取られたものだった。"}, {"t": 381.4166666666667, "x": "決勝の相手は福井商。"}, {"t": 382.85, "x": "決勝は商業高校どうしになった。"}, {"t": 385.2, "x": "どっちが勝っても、商業高校の日本一ね。"}, {"t": 388.25, "x": "最初の山場は1回裏、守りの場面だった。"}, {"t": 391.1666666666667, "x": "福井商が一死三塁から仕掛けた\nスクイズを、浜松商は外して防いだ。"}, {"t": 395.81666666666666, "x": "先に点を取られずにすんだのね。"}, {"t": 397.9, "x": "点が動いたのは3回だ。"}, {"t": 399.56666666666666, "x": "二死三塁。小沢が三遊間を破った。"}, {"t": 402.0833333333333, "x": "準決勝で勝ち越しを打った小沢が、\n決勝でも先に点を入れた。"}, {"t": 406.0833333333333, "x": "頼れる人ね！"}, {"t": 407.28333333333336, "x": "そして8回。二死一・三塁で山下が打席に入った。"}, {"t": 410.81666666666666, "x": "内角のシュートを、右前に運んだ。これで2対0だ。"}, {"t": 414.26666666666665, "x": "あと1回守ればいいのね。"}, {"t": 415.98333333333335, "x": "9回、最後の打者はゴロを打った。"}, {"t": 418.1333333333333, "x": "捕ったのは一塁手の小沢。\nそのまま自分で一塁を踏んだ。"}, {"t": 421.6333333333333, "x": "2対0。浜松商は初めて日本一になった。"}, {"t": 425.0, "x": "最後のアウトも小沢さんだったのね。"}, {"t": 427.21666666666664, "x": "紫紺の大優勝旗が、初めて浜松へ運ばれた。"}, {"t": 430.46666666666664, "x": "5試合で取った点は16点。"}, {"t": 432.2, "x": "取られた点は6点だ。"}, {"t": 433.76666666666665, "x": "完封は3試合。0点で終えた試合が5試合中3つあった。"}, {"t": 437.56666666666666, "x": "春に2つ勝ったことがなかった\n学校が、5つ続けて勝ったのね。"}, {"t": 441.81666666666666, "x": "ああ。静岡の学校の春の優勝は、\n1952年の静岡商から数えて26年ぶりだった。"}, {"t": 448.18333333333334, "x": "そしてこのあと、静岡に春の優勝旗が来るまで、\nまた29年かかることになる。"}, {"t": 453.95, "x": "選手たちは、あとで何か話しているの？"}, {"t": 456.6333333333333, "x": "2004年に中日新聞が、当時の選手に話を聞いている。"}, {"t": 460.5, "x": "2年生でベンチに入っていた\n山田忠は、決勝の歓声をこう言った。"}, {"t": 464.73333333333335, "x": "「地面からわき出るような歓声だった」。"}, {"t": 467.05, "x": "甲子園の決勝だものね。"}, {"t": 468.85, "x": "青野は、結果を出すには練習しかないと話した。"}, {"t": 471.93333333333334, "x": "それが浜商の野球だと。"}, {"t": 473.6166666666667, "x": "小沢は、野球部での毎日を\n修行僧のようだったと振り返っている。"}, {"t": 477.6666666666667, "x": "修行僧……。相当きつかったのね。"}, {"t": 479.95, "x": "記事は、伝統の猛練習の先に\n優勝旗があったと書いている。"}, {"t": 483.6666666666667, "x": "そしてこの優勝のメンバーには、\nのちの監督が2人いた。"}, {"t": 487.3, "x": "主将の森下さんと？"}, {"t": 488.93333333333334, "x": "控えの2年生だった山田だ。\nこの2人の話はあとでする。"}, {"t": 493.28333333333336, "x": "優勝のあとも、浜松商は甲子園に出続けた。"}, {"t": 496.45, "x": "1980年の夏は、岡山理大付に4対3、大分商に5対3。"}, {"t": 501.3333333333333, "x": "3回戦では、1978年の春にも\n当たった宮城の東北に6対4で勝った。"}, {"t": 507.0833333333333, "x": "ベスト8まで来たのね。"}, {"t": 508.81666666666666, "x": "ああ。準々決勝で滋賀の瀬田工に敗れた。"}, {"t": 511.6166666666667, "x": "1984年の夏は、奈良の智弁学園と\n9対8の打ち合いを制した。"}, {"t": 516.5833333333334, "x": "次は愛媛の松山商に0対4で敗れている。"}, {"t": 519.7, "x": "名門と次々に当たるのね。"}, {"t": 521.6833333333333, "x": "中でも目を引くのが、1985年と1986年の春だ。"}, {"t": 526.6333333333333, "x": "1985年の春。初戦の相手は大阪のPL学園だった。"}, {"t": 531.0833333333334, "x": "結果は1対11。大差で敗れた。"}, {"t": 533.65, "x": "PL学園って、あの強い学校よね。"}, {"t": 536.3, "x": "そうだ。そして次の年、1986年の春。"}, {"t": 540.0666666666667, "x": "浜松商は2年続けて春に選ばれた。"}, {"t": 542.6833333333333, "x": "初戦の相手は、またPL学園だった。"}, {"t": 545.4, "x": "えっ、2年続けて同じ相手？"}, {"t": 547.5833333333334, "x": "ああ。今度は8対1で浜松商が勝った。"}, {"t": 550.4833333333333, "x": "前の年の10点差を、1年で逆にしたのね。"}, {"t": 553.6, "x": "次の広島工には1対2で敗れた。\nそれでも大きな1勝だった。"}, {"t": 558.35, "x": "1988年の夏には、夏で2度目のベスト8に入っている。"}, {"t": 562.9333333333333, "x": "2回戦の徳島の池田戦は、延長14回の末に3対2。"}, {"t": 567.0166666666667, "x": "3回戦は千葉の拓大紅陵に4対3。"}, {"t": 569.55, "x": "どちらも1点差だ。"}, {"t": 571.0666666666667, "x": "延長で泣いていた学校が、\n延長で勝つようになったのね。"}, {"t": 574.6166666666667, "x": "準々決勝は沖縄水産に1対2。ここも1点差だった。"}, {"t": 578.5166666666667, "x": "1990年は春と夏の両方に出た。"}, {"t": 581.45, "x": "春は熊本の鎮西に10対7。"}, {"t": 583.55, "x": "夏は岡山城東に12対6。"}, {"t": 585.7666666666667, "x": "どちらも初戦で2桁の点を取って勝っている。"}, {"t": 588.6833333333333, "x": "打つチームになっていたのね。"}, {"t": 590.4166666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
