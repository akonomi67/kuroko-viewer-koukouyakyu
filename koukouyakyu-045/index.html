<script>
const D={"name": "四日市", "file": "045_編集用", "dur": 708.15, "segs": [], "subs": [{"t": 0.0, "x": "2026年の1月30日は、\n春のセンバツの出場校が決まった日よね。"}, {"t": 5.233333333333333, "x": "ああ。この日の選考委員会で、\n出場する学校が決まった。"}, {"t": 9.016666666666667, "x": "その中に21世紀枠で選ばれる2校がある。"}, {"t": 11.883333333333333, "x": "候補は、9つの地区から1校ずつ推された9校だった。"}, {"t": 15.566666666666666, "x": "その9校の中に、三重の学校があったの？"}, {"t": 18.4, "x": "あった。東海地区から推されたのは、\n三重県立の四日市高校だ。"}, {"t": 22.466666666666665, "x": "この年の9校の中には、三重と\n埼玉と奈良の学校が入っていた。"}, {"t": 26.683333333333334, "x": "3校とも公立で、秋の県大会で4強に\n入ったことが評価された、と記事にある。"}, {"t": 31.933333333333334, "x": "記事の見出しは、三重、埼玉、奈良から\n初の21世紀枠の出場校が出るか、だった。"}, {"t": 37.81666666666667, "x": "三重の学校は、まだ21世紀枠で出たことがないのね。"}, {"t": 41.416666666666664, "x": "高校野球ドットコムは四日市をこう紹介している。"}, {"t": 44.483333333333334, "x": "1955年に、三重県勢でただ\n1校、夏の甲子園を制した古豪。"}, {"t": 49.36666666666667, "x": "夏の甲子園で優勝した学校なのね。"}, {"t": 51.96666666666667, "x": "そうだ。三重県勢の夏の優勝は、\nいまもこの1回だけだ。"}, {"t": 55.833333333333336, "x": "それで四日市は選ばれたの？"}, {"t": 57.75, "x": "選ばれたのは、長崎の長崎西と高知の高知農だった。"}, {"t": 61.53333333333333, "x": "四日市の名前は、出場校の一覧には無かった。"}, {"t": 64.93333333333334, "x": "あら残念だったのね。"}, {"t": 66.45, "x": "そこで問題だ。"}, {"t": 67.6, "x": "1955年の四日市のあと、三重の学校は\nしばらく夏の決勝に進めなかった。"}, {"t": 73.03333333333333, "x": "次に三重の学校が夏の決勝に\n立ったのは、何年ぶりだったと思う？"}, {"t": 77.35, "x": "うーん20年ぶりくらい？"}, {"t": 78.88333333333334, "x": "答えは最後に言う。"}, {"t": 80.06666666666666, "x": "今回は、富田の県立高校が1955年の夏に\n頂点に立つまでと、そのあとを追っていく。"}, {"t": 86.31666666666666, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 89.75, "x": "よろしくね。"}, {"t": 91.25, "x": "まず学校の話からだ。"}, {"t": 92.91666666666667, "x": "四日市高校は、三重県の北のほうにある\n四日市市の県立高校だ。"}, {"t": 97.28333333333333, "x": "学校は、近鉄の富田駅からすぐのところにある。"}, {"t": 100.48333333333333, "x": "三重県のバスと電車の案内では、\n近鉄富田駅から歩いてすぐ、と書いてある。"}, {"t": 105.38333333333334, "x": "駅の目の前の学校なのね。"}, {"t": 107.33333333333333, "x": "2026年の記事によると、前身は\n1899年にできた三重県第二中学校だ。"}, {"t": 113.45, "x": "1899年って、120年以上も前ね。"}, {"t": 117.1, "x": "校是は「遍く険しく、光輝く八稜星のごとく」。"}, {"t": 120.86666666666666, "x": "校是というのは、その学校が大切にする考えのことだ。"}, {"t": 124.48333333333333, "x": "八稜星は、8つのとがった先をもつ星のことだ。"}, {"t": 127.9, "x": "むずかしい言葉ね。"}, {"t": 129.28333333333333, "x": "いまはスーパーサイエンスハイスクールにも\n選ばれている。"}, {"t": 132.11666666666667, "x": "文部科学省が選んだ学校で、「探究」という\n授業で、自分で決めた課題を調べている。"}, {"t": 137.6, "x": "勉強の強い学校なのね。"}, {"t": 139.55, "x": "そうだ。県の中でも指折りの進学校、と\n記事は書いている。"}, {"t": 143.26666666666668, "x": "野球部から東大や京大に進んだ人もいるそうだ。"}, {"t": 146.51666666666668, "x": "そんな学校が夏の甲子園で優勝したのね。"}, {"t": 149.41666666666666, "x": "ただ、校名は昔から四日市だったわけではない。"}, {"t": 152.5, "x": "記録のサイトの戦績表には、\n前の名前が富田中と書いてある。"}, {"t": 156.6, "x": "駅の名前と同じ富田ね。"}, {"t": 159.0, "x": "三重の学校は、昔から甲子園に出ていたの？"}, {"t": 162.0, "x": "最初は、1915年の第1回の全国大会だ。"}, {"t": 165.71666666666667, "x": "SPAIAの記事によると、出たのは\n三重四中という学校だ。"}, {"t": 169.13333333333333, "x": "最初の試合で秋田中に1対9で負けている。"}, {"t": 172.0, "x": "戦争の前に三重の学校が\n出たのは、この1回だけだった。"}, {"t": 175.71666666666667, "x": "たった1回だけなの？"}, {"t": 177.25, "x": "ああ。次に三重の学校が\n甲子園に来たのは、戦争のあとだ。"}, {"t": 181.0, "x": "1947年の春のセンバツに富田中が出ている。"}, {"t": 184.75, "x": "富田中っていまの四日市高校ね。"}, {"t": 187.18333333333334, "x": "そうだ。日本高野連の出場校の表にも、\nこの年の三重の欄に富田中とある。"}, {"t": 192.2, "x": "ところがこの試合は、\n和歌山の田辺中に2対22で大敗した。"}, {"t": 196.46666666666667, "x": "22点も取られちゃったの！"}, {"t": 198.33333333333334, "x": "ああ。この大会で優勝したのは、\n徳島の徳島商だった。"}, {"t": 202.13333333333333, "x": "決勝は3対1だった、と日本高野連の表にある。"}, {"t": 205.6, "x": "同じ大会で、勝った学校と\n大敗した学校があったのね。"}, {"t": 209.38333333333333, "x": "これが、この学校の初めての甲子園だった。"}, {"t": 212.23333333333332, "x": "そのあと名前が四日市に変わってから、\n夏の甲子園に初めて出ることになる。"}, {"t": 217.05, "x": "春に大敗した学校が、夏はどうなるのかしら。"}, {"t": 220.75, "x": "では1955年の夏の大会だ。"}, {"t": 223.25, "x": "第37回大会になる。"}, {"t": 225.28333333333333, "x": "日本高野連の表では、全国から参加したのは1721校。"}, {"t": 229.71666666666667, "x": "甲子園に来られたのは、そのうちの23校だけだ。"}, {"t": 233.1, "x": "1721校から23校！"}, {"t": 235.36666666666667, "x": "ほんのひとにぎりね。"}, {"t": 236.86666666666667, "x": "その23校の中に三重の四日市の名前がある。"}, {"t": 239.95, "x": "四日市にとっては、夏は初めての甲子園だった。"}, {"t": 243.18333333333334, "x": "同じ表でこの大会の顔ぶれを見てみよう。"}, {"t": 245.66666666666666, "x": "大阪の浪華商、東京の日大三、福岡の小倉。"}, {"t": 249.25, "x": "そして愛知の中京商だ。"}, {"t": 251.1, "x": "中京商って強い学校よね。"}, {"t": 253.18333333333334, "x": "ああ。中京商は前の夏、1954年の夏の優勝校だ。"}, {"t": 257.51666666666665, "x": "決勝で静岡商に3対0で勝っている。"}, {"t": 260.1333333333333, "x": "参加した学校の数も表で見比べてみよう。"}, {"t": 262.85, "x": "1954年は1705校。"}, {"t": 265.2, "x": "1955年は1721校。"}, {"t": 268.1, "x": "1956年は1739校、1957年は1769校と書いてある。"}, {"t": 274.93333333333334, "x": "毎年少しずつ増えていたのね。"}, {"t": 277.06666666666666, "x": "そうだ。野球をする学校がどんどん増えていた時代だ。"}, {"t": 280.3833333333333, "x": "前の夏に優勝した学校も出ていたのね。"}, {"t": 283.1, "x": "強い学校がならぶ中で四日市の夏が始まった。"}, {"t": 286.93333333333334, "x": "では四日市の試合を順に見ていこう。"}, {"t": 289.1, "x": "代表は23校だから、全部の学校が\n1回戦から戦うわけではない。"}, {"t": 293.7, "x": "記録のサイトでは、四日市の最初の試合は2回戦だ。"}, {"t": 297.18333333333334, "x": "相手は北海道の芦別。3対1で勝った。"}, {"t": 300.1333333333333, "x": "デイリースポーツの記事は、これが\n三重県勢の初めての勝ちだと書いている。"}, {"t": 304.4, "x": "えっ、三重の学校はそれまで\n1回も勝っていなかったの？"}, {"t": 307.8, "x": "そうだ。1915年も1947年も、\n最初の試合で負けていたからな。"}, {"t": 313.4, "x": "初めての1勝から始まったのね。"}, {"t": 315.71666666666664, "x": "準々決勝は高知の城東。これは1対0の勝ちだった。"}, {"t": 319.5, "x": "1点だけを守り切ったのね。"}, {"t": 321.45, "x": "準決勝の相手は、前の夏の優勝校の中京商だ。"}, {"t": 325.1, "x": "いきなり強い相手ね。"}, {"t": 326.5833333333333, "x": "ところが四日市は、この試合を6対1で勝った。"}, {"t": 329.78333333333336, "x": "前の夏の優勝校に5点差！"}, {"t": 331.9, "x": "そして決勝の相手は香川の坂出商だ。"}, {"t": 334.55, "x": "四日市は1回に点を取って3回にも点を取った。"}, {"t": 337.71666666666664, "x": "坂出商は6回に1点を返した。"}, {"t": 340.03333333333336, "x": "四日市は8回にまた点を取って、4対1で勝った。"}, {"t": 343.48333333333335, "x": "日本高野連の表でも、第37回の優勝校の欄は\n四日市、準優勝の欄は坂出商だ。"}, {"t": 349.76666666666665, "x": "本当に優勝しちゃったのね！"}, {"t": 351.68333333333334, "x": "デイリースポーツは、エースの投手を中心に\n頂点まで勝ち進んだ、と書いている。"}, {"t": 356.3666666666667, "x": "ああ。それに、この大会で出た\nホームランは全部で1本だけだった。"}, {"t": 360.3666666666667, "x": "点の取り合いより守り合いの大会だったのね。"}, {"t": 363.1333333333333, "x": "日本高野連の大会小史には、\nこの年のことがもう1つ書いてある。"}, {"t": 367.31666666666666, "x": "大会のあと、選び抜いた選手のチームが\n初めてハワイへ遠征した。"}, {"t": 371.45, "x": "海の向こうまで試合をしに行ったのね。"}, {"t": 374.2, "x": "1947年の春は2対22で負けていたのよね。"}, {"t": 378.1166666666667, "x": "そうだ。同じ学校が名前を\n変えて、夏は4つ続けて勝った。"}, {"t": 382.06666666666666, "x": "記録のサイトの戦績表で、\nこの学校の甲子園をまとめてみよう。"}, {"t": 386.03333333333336, "x": "1947年の春は富田中の名前で1回戦負け。"}, {"t": 389.96666666666664, "x": "1955年の夏は四日市の名前で優勝。"}, {"t": 393.23333333333335, "x": "1967年の夏は、1回戦で\n青森の東奥義塾に1対3で負けた。"}, {"t": 398.45, "x": "この1967年の大会に出られたのは\n30校だった、と記録のサイトにある。"}, {"t": 403.9166666666667, "x": "甲子園は3回だけなのね。"}, {"t": 405.8666666666667, "x": "ああ。春は1回で0勝1敗。"}, {"t": 407.8, "x": "夏は2回で4勝1敗。"}, {"t": 409.6, "x": "合わせると4勝2敗になる。"}, {"t": 411.48333333333335, "x": "その4勝が全部1955年の夏なのね。"}, {"t": 414.8, "x": "そうだ。そして1967年の夏を\n最後に、甲子園から遠ざかっている。"}, {"t": 419.98333333333335, "x": "1967年からずいぶんたつわね。"}, {"t": 422.8833333333333, "x": "2018年のデイリースポーツの記事には、\n三重の学校の夏の記録がならんでいる。"}, {"t": 427.78333333333336, "x": "夏の甲子園で勝った数のランキングでは、\n四日市の4勝が3位だ。"}, {"t": 432.01666666666665, "x": "そして最高の成績の欄には、優勝、\n四日市、1955年とだけある。"}, {"t": 437.4166666666667, "x": "三重のいちばんの記録はいまも四日市なのね。"}, {"t": 440.68333333333334, "x": "四日市のあと三重のほかの学校はどうだったの？"}, {"t": 443.5833333333333, "x": "春のセンバツでは、1969年に\n三重高校が優勝している。"}, {"t": 447.9, "x": "SPAIAの記事によると、\n三重県勢の春の優勝はこれだけだ。"}, {"t": 451.7, "x": "春も夏も優勝は1回ずつなのね。"}, {"t": 454.1666666666667, "x": "ああ。ただ夏は、長いあいだ準決勝に進めなかった。"}, {"t": 457.5833333333333, "x": "デイリースポーツの記事にこうある。"}, {"t": 459.4166666666667, "x": "三重県勢は1955年の四日市の\nあと、準決勝に進めていなかった。"}, {"t": 464.53333333333336, "x": "それから長いあいだ、準決勝に届かなかったの？"}, {"t": 467.75, "x": "記事が書いているのは、2014年の夏までのことだ。"}, {"t": 471.0833333333333, "x": "さらに1997年から2013年までは、\n3回戦にも進めなかった。"}, {"t": 476.4, "x": "その間の代表校の勝ちは、\n合わせて2勝だけだったそうだ。"}, {"t": 480.1666666666667, "x": "そんなに勝てない時期があったの。"}, {"t": 482.1666666666667, "x": "ほかにも、1991年には四日市工が\n初めて夏の甲子園に出ている。"}, {"t": 487.45, "x": "3回戦で松商学園に、延長16回のサヨナラで負けた。"}, {"t": 491.55, "x": "四日市の学校はほかにもがんばっていたのね。"}, {"t": 494.93333333333334, "x": "いまの四日市の野球部はどうなの？"}, {"t": 497.1333333333333, "x": "2025年の秋の三重大会で、4強に入った。"}, {"t": 500.51666666666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
