<script>
const D={"name": "佐賀北の73回", "file": "055_編集用", "dur": 620.56665625, "segs": [], "subs": [{"t": 0.0, "x": "今日は何を数えるの？"}, {"t": 1.5, "x": "ある学校が1つの夏に戦った回の数だ。"}, {"t": 4.3, "x": "2007年の夏の話だ。"}, {"t": 6.316666666666666, "x": "9回の試合が5つ。15回と\n13回の試合が1つずつあった。"}, {"t": 10.683333333333334, "x": "15回とか13回とか、長い試合がまじっているわ。"}, {"t": 14.216666666666667, "x": "ああ。7つの試合を足すと73回になる。"}, {"t": 17.233333333333334, "x": "1試合が9回だから8試合ぶんより多いわ。"}, {"t": 20.033333333333335, "x": "そうだ。そして7試合目が決勝だった。"}, {"t": 22.666666666666668, "x": "その決勝は7回を終えて0対4。"}, {"t": 24.783333333333335, "x": "負けている側がこの学校だ。"}, {"t": 26.816666666666666, "x": "4点も負けていたの？"}, {"t": 28.366666666666667, "x": "ところが8回の裏に5点を入れて、5対4で勝った。"}, {"t": 31.65, "x": "佐賀の県立高校、佐賀北の初めての優勝だ。"}, {"t": 35.0, "x": "初めてで、いきなり優勝しちゃったの？"}, {"t": 37.5, "x": "甲子園は2度目だった。"}, {"t": 38.85, "x": "1度目は1つも勝てずに帰っている。"}, {"t": 41.3, "x": "じゃあ、どんな学校が、どうやって73回も戦ったの？"}, {"t": 45.13333333333333, "x": "日本高野連の一覧と試合の記録、それに\n学校のあゆみを1つずつ開いていこう。"}, {"t": 50.15, "x": "その前にチャンネル登録と\n高評価をしてもらえるとうれしい。"}, {"t": 53.583333333333336, "x": "押してもらえたら、私も助かるわ。"}, {"t": 56.55, "x": "佐賀北って、どこにある学校なの？"}, {"t": 58.96666666666667, "x": "佐賀市の天祐という所にある、県立の高校だ。"}, {"t": 62.1, "x": "学校のあゆみを読むと始まりが少し変わっている。"}, {"t": 65.03333333333333, "x": "1949年に佐賀の3つの学校が1つにまとまった。"}, {"t": 69.08333333333333, "x": "できたのは県立の佐賀高校だ。"}, {"t": 71.28333333333333, "x": "その時は、まだ佐賀北という名前じゃなかったの？"}, {"t": 74.41666666666667, "x": "まだだ。その佐賀高校を、\n1962年に県が2つに分けた。"}, {"t": 78.91666666666667, "x": "分かれてできたのが、佐賀北と佐賀西だ。"}, {"t": 81.73333333333333, "x": "1つの学校が、北と西に分かれたってこと？"}, {"t": 84.86666666666666, "x": "そうだ。佐賀北の最初の入学式は1963年。"}, {"t": 88.8, "x": "12組で645人の1年生が入った。"}, {"t": 92.08333333333333, "x": "最初の年から600人以上なんて、大きな学校だわ。"}, {"t": 95.71666666666667, "x": "1988年には普通の科に芸術の組が1つ足された。"}, {"t": 100.0, "x": "今は芸術科になっていて音楽と美術と書道を学べる。"}, {"t": 103.53333333333333, "x": "野球の学校、という感じはしないわ。"}, {"t": 106.0, "x": "ああ。学校のあゆみで野球が\n出てくるのは2007年の1行だけだ。"}, {"t": 110.03333333333333, "x": "「第89回全国高等学校野球選手権大会初優勝」。"}, {"t": 114.36666666666666, "x": "60年以上のあゆみの中で、たった1行なのね。"}, {"t": 117.68333333333334, "x": "その1行の前にまず1度目の甲子園を見ておこう。"}, {"t": 121.31666666666666, "x": "日本高野連の出場校の一覧で佐賀北が\n初めて出てくるのは2000年だ。"}, {"t": 125.96666666666667, "x": "第82回大会の佐賀の代表が佐賀北だった。"}, {"t": 129.4, "x": "初めての甲子園は、どうだったの？"}, {"t": 131.73333333333332, "x": "最初の試合は2回戦。"}, {"t": 133.11666666666667, "x": "相手は神奈川の横浜だ。"}, {"t": 134.93333333333334, "x": "記録のサイトでは、1回の表に\n佐賀北が1点を先に入れている。"}, {"t": 139.11666666666667, "x": "先に点を取ったんだ。"}, {"t": 140.66666666666666, "x": "だがその裏に横浜が2点。そのあと\n5回に6点と7回と8回に2点ずつだ。"}, {"t": 145.8, "x": "1対12で負けた。"}, {"t": 147.35, "x": "11点差って、かなり大きな差よ。"}, {"t": 149.76666666666668, "x": "ああ。1度目の甲子園は1つも勝てずに終わった。"}, {"t": 152.78333333333333, "x": "そのあとの4年は、佐賀の代表は\n毎年ちがう学校だった。"}, {"t": 156.45, "x": "2005年と2006年は2年続けて佐賀商だった。"}, {"t": 159.91666666666666, "x": "佐賀北の名前は、しばらく出てこないわけか。"}, {"t": 162.83333333333334, "x": "そうだ。次に出てくるのは\n7年後の2007年。第89回大会だ。"}, {"t": 167.58333333333334, "x": "この年、全国で参加した学校は4081校。"}, {"t": 171.03333333333333, "x": "甲子園に来たのは49校だった。"}, {"t": 173.56666666666666, "x": "4081校の中の、佐賀の1校ってわけよ。"}, {"t": 176.96666666666667, "x": "ちなみに佐賀大会の準々決勝の相手は佐賀西だった。"}, {"t": 180.56666666666666, "x": "えっ、分かれたもう1つの学校？"}, {"t": 182.83333333333334, "x": "そうだ。スポーツ雑誌の記事では、\n当時の選手がこの試合を山場に挙げている。"}, {"t": 187.4, "x": "満塁のピンチを、3人続けて\n三振にとって切り抜けたそうだ。"}, {"t": 191.9, "x": "甲子園での1試合目は、どこが相手だったの？"}, {"t": 194.8, "x": "福井の福井商だ。しかも大会で\nいちばん最初の試合だった。"}, {"t": 198.55, "x": "野球の専門サイトの記事にも「開幕戦」と書いてある。"}, {"t": 202.2, "x": "大会の最初の試合を、佐賀北がやったんだ。"}, {"t": 205.16666666666666, "x": "ああ。3回に1点を入れて8回にもう1点。"}, {"t": 207.98333333333332, "x": "福井商は9回まで0点。"}, {"t": 209.6, "x": "2対0で佐賀北が勝った。"}, {"t": 211.6, "x": "これが、甲子園での初めての1勝になるの？"}, {"t": 214.5, "x": "そうなる。2000年に勝てなかった\n学校が7年後の最初の試合で勝った。"}, {"t": 219.01666666666668, "x": "ここから、あと6試合も続くわけね。"}, {"t": 221.58333333333334, "x": "そうだ。そして次の試合がいちばん長くなる。"}, {"t": 225.03333333333333, "x": "2回戦の相手は三重の宇治山田商だ。"}, {"t": 227.4, "x": "1回に佐賀北が2点を入れた。"}, {"t": 229.53333333333333, "x": "また先に点を取ったわ。"}, {"t": 231.2, "x": "だが5回に、宇治山田商が4点を入れて逆に2対4。"}, {"t": 234.6, "x": "佐賀北は6回と7回に1点ずつ\n返して4対4に追いついた。"}, {"t": 238.73333333333332, "x": "そこからは、どっちが勝ったの？"}, {"t": 240.78333333333333, "x": "8回からはどちらにも点が入らない。"}, {"t": 243.06666666666666, "x": "9回が終わっても4対4。延長に入った。"}, {"t": 245.93333333333334, "x": "延長に入っても0が並び、15回まで来た。"}, {"t": 249.08333333333334, "x": "15回でも決まらなかったら、どうなるの？"}, {"t": 251.75, "x": "引き分けになった。\n記録のサイトの表にも、そう書いてある。"}, {"t": 255.31666666666666, "x": "野球の専門サイトの記事では\n「延長15回の引き分け再試合」だ。"}, {"t": 259.75, "x": "15回も戦ったのに、勝ちも負けもつかないなんて。"}, {"t": 263.18333333333334, "x": "ああ。そしてやり直しの試合をすることになった。"}, {"t": 266.01666666666665, "x": "やり直しの試合は4回に佐賀北が1点を入れて動いた。"}, {"t": 269.4166666666667, "x": "そして6回から8回までに8点を足した。"}, {"t": 272.31666666666666, "x": "今度は、点がたくさん入ったわ。"}, {"t": 274.53333333333336, "x": "宇治山田商は3回の1点だけ。"}, {"t": 276.56666666666666, "x": "9対1で佐賀北が勝った。"}, {"t": 278.6, "x": "この2回戦だけで、何回ぶん戦ったことになるの？"}, {"t": 282.0833333333333, "x": "15回と9回で24回だ。"}, {"t": 284.1, "x": "普通の試合の2試合半を超える。"}, {"t": 286.28333333333336, "x": "1つ勝つまでに、24回もかかったのね。"}, {"t": 289.81666666666666, "x": "3回戦の相手は群馬の前橋商だ。"}, {"t": 292.28333333333336, "x": "2回に両方が2点ずつ入れた。"}, {"t": 294.25, "x": "そのあと佐賀北が3回と4回と7回に1点ずつを足した。"}, {"t": 298.21666666666664, "x": "じわじわと、差を広げていったんだ。"}, {"t": 300.53333333333336, "x": "ああ。前橋商は2回の2点だけ。"}, {"t": 302.6666666666667, "x": "5対2で佐賀北が勝った。"}, {"t": 304.43333333333334, "x": "これで8強だ。準々決勝の相手は東東京の帝京だった。"}, {"t": 308.68333333333334, "x": "帝京って、強い学校で有名よね。"}, {"t": 311.2, "x": "記事でも強豪と書かれている。"}, {"t": 312.85, "x": "佐賀北は1回から3回まで1点ずつ入れた。"}, {"t": 315.8, "x": "帝京は2回に1点を返し4回に2点を入れて3対3になる。"}, {"t": 319.85, "x": "また追いつかれちゃったの？"}, {"t": 321.4166666666667, "x": "ああ。そしてここからまた0が並ぶ。"}, {"t": 323.7, "x": "5回から12回まで、両方とも点が入らない。"}, {"t": 326.8833333333333, "x": "8つの回も、どっちも点を取れなかったなんて。"}, {"t": 329.9166666666667, "x": "13回の裏、佐賀北が1点を入れた。"}, {"t": 332.43333333333334, "x": "4対3のサヨナラだ。"}, {"t": 334.18333333333334, "x": "また延長だったの？これで2試合目よ。"}, {"t": 336.6666666666667, "x": "そうだ。15回と13回。"}, {"t": 338.48333333333335, "x": "延長の試合を2つ越えて4強に入った。"}, {"t": 341.2, "x": "日本高野連の大会小史にはこの夏の九州のこともある。"}, {"t": 344.8833333333333, "x": "8強に九州の学校が3校残った、と書いてある。"}, {"t": 348.93333333333334, "x": "準決勝の相手は、どこだったの？"}, {"t": 351.25, "x": "となりの県、長崎の長崎日大だ。"}, {"t": 354.0, "x": "九州の学校どうしで、決勝をかけた試合だわ。"}, {"t": 357.1333333333333, "x": "ああ。佐賀北は2回と4回に1点ずつ入れた。"}, {"t": 360.1, "x": "7回にも1点。長崎日大には1点も入らなかった。"}, {"t": 363.8333333333333, "x": "3対0で佐賀北が勝った。"}, {"t": 365.8666666666667, "x": "0点に抑えた試合は、これで2つ目かしら？"}, {"t": 368.8, "x": "そうだ。開幕試合の福井商と、\nこの長崎日大の2つになる。"}, {"t": 373.18333333333334, "x": "点を取られなかった試合が、2つもあったんだ。"}, {"t": 376.1333333333333, "x": "ここまでの6試合で佐賀北が戦ったのは64回だ。"}, {"t": 379.73333333333335, "x": "残るは決勝の1試合。"}, {"t": 381.1333333333333, "x": "相手は広島の広陵だった。"}, {"t": 383.68333333333334, "x": "決勝は広陵が先に点を入れた。"}, {"t": 385.65, "x": "2回の表に2点だ。"}, {"t": 387.4, "x": "佐賀北は、すぐ返したの？"}, {"t": 389.3833333333333, "x": "いや、返せない。3回から\n7回まで、佐賀北の列は0のままだ。"}, {"t": 393.76666666666665, "x": "そして7回の表に広陵がまた2点を足した。"}, {"t": 396.8666666666667, "x": "これで0対4になったのね。"}, {"t": 398.81666666666666, "x": "そうだ。残りは8回と9回の2つしかない。"}, {"t": 401.96666666666664, "x": "4点差で、あと2回しかないなんて。"}, {"t": 404.43333333333334, "x": "8回の裏、佐賀北の打つ番になる。"}, {"t": 406.9, "x": "塁が埋まって、満塁から四球で\n1点が入った。押し出しだ。"}, {"t": 410.81666666666666, "x": "やっと1点。でも、まだ1対4よ。"}, {"t": 413.3833333333333, "x": "満塁のまま、チームの主力の打者、\n副島浩史が打席に入った。"}, {"t": 417.68333333333334, "x": "打った球は、そのまま本塁打になった。"}, {"t": 420.3, "x": "満塁で本塁打なら、一気に4点よ。"}, {"t": 422.9166666666667, "x": "ああ。1対4から5対4。"}, {"t": 424.6166666666667, "x": "佐賀北が前に出た。"}, {"t": 426.06666666666666, "x": "9回の表、広陵は点を取れなかった。"}, {"t": 428.55, "x": "5対4で試合が終わった。"}, {"t": 430.3666666666667, "x": "最後の最後で、ひっくり返したのね。"}, {"t": 432.9, "x": "日本高野連の大会小史は、この打球を決勝で\n史上初の逆転満塁本塁打と書いている。"}, {"t": 438.6166666666667, "x": "そして公立校として11年ぶりの優勝とも書いている。"}, {"t": 442.18333333333334, "x": "佐賀の学校が優勝するのは、初めてだったの？"}, {"t": 445.3, "x": "いや、1994年に佐賀商が優勝している。"}, {"t": 448.5, "x": "佐賀北は佐賀の2校目だ。"}, {"t": 450.3, "x": "佐賀北にとっては学校で初めての優勝になった。"}, {"t": 454.03333333333336, "x": "あ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
