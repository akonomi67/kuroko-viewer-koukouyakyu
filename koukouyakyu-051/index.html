<script>
const D={"name": "徳島商の2つの優勝", "file": "051_編集用", "dur": 667.76665625, "segs": [], "subs": [{"t": 0.0, "x": "1947年の春。兵庫県の甲子園球場。"}, {"t": 3.6166666666666667, "x": "春のセンバツの決勝は、9回を終えて1対1だった。"}, {"t": 7.016666666666667, "x": "戦っていたのは、徳島の徳島商と福岡の小倉中だ。"}, {"t": 11.05, "x": "同点のまま延長に入ったのね。"}, {"t": 13.25, "x": "ああ。13回に徳島商が2点を取った。"}, {"t": 16.05, "x": "3対1。徳島商の初めての優勝だ。"}, {"t": 18.9, "x": "日本高野連の大会小史には、この春がこう書いてある。"}, {"t": 22.3, "x": "徳島商が昭和10年の初出場以来、\n五度目の正直で初優勝。"}, {"t": 26.816666666666666, "x": "5回目の甲子園でやっと勝ったのね。"}, {"t": 29.166666666666668, "x": "そうだ。表に残る徳島商の優勝は、この1つだけだ。"}, {"t": 32.93333333333333, "x": "でも学校には、もう1つ優勝を\n証明する賞状と盾がある。"}, {"t": 36.833333333333336, "x": "えっ、優勝が2つあるのに、表には1つしかないの？"}, {"t": 40.266666666666666, "x": "それってどうしてなの？"}, {"t": 41.7, "x": "今回は日本高野連の出場校の表と、\n当時の大会の記録で辿っていく。"}, {"t": 46.45, "x": "始める前にチャンネル登録と高評価をお願いしたい。"}, {"t": 49.68333333333333, "x": "よろしくね。"}, {"t": 51.166666666666664, "x": "徳島商ってどんな学校なの？"}, {"t": 53.28333333333333, "x": "徳島県立の商業高校だ。"}, {"t": 55.36666666666667, "x": "学校の案内には、\n1909年の創立とある。明治42年だな。"}, {"t": 60.28333333333333, "x": "100年以上前からある学校なのね。"}, {"t": 62.6, "x": "学校の案内では、116年を超える歴史と書いている。"}, {"t": 66.2, "x": "春の甲子園の表で徳島の欄を見てみよう。"}, {"t": 68.9, "x": "1924年の第1回から1934年の第11回まで、\n徳島の欄は空いている。"}, {"t": 75.1, "x": "最初の11回は、徳島の学校は来ていないのね。"}, {"t": 78.51666666666667, "x": "初めて名前が入るのは、1935年の第12回だ。"}, {"t": 82.6, "x": "そこに書いてあるのが徳島商だった。"}, {"t": 84.88333333333334, "x": "この春の代表は、20校。"}, {"t": 86.71666666666667, "x": "四国からは愛媛の松山商も来ていた。"}, {"t": 89.98333333333333, "x": "初めての春はどうだったの？"}, {"t": 91.83333333333333, "x": "記録のサイトでは、2回戦で\n岐阜の岐阜商に2対11で負けている。"}, {"t": 96.1, "x": "11点も取られちゃったのね。"}, {"t": 98.03333333333333, "x": "この岐阜商は、その春に優勝した学校だ。"}, {"t": 100.88333333333334, "x": "決勝で広陵中に5対4で勝っている。"}, {"t": 103.45, "x": "最初の相手が、その年の\nいちばん強い学校だったのね。"}, {"t": 107.06666666666666, "x": "2度目は2年後の1937年の春だ。"}, {"t": 110.16666666666667, "x": "2回戦は福岡の福岡工に2対1。"}, {"t": 112.76666666666667, "x": "準々決勝は、熊本の熊本商に5対1で勝った。"}, {"t": 116.45, "x": "今度は2つも勝ったのね！"}, {"t": 118.28333333333333, "x": "準決勝で大阪の浪華商に1対6で負けた。"}, {"t": 121.36666666666666, "x": "浪華商は決勝で中京商に2対0で\n勝って、この春に優勝している。"}, {"t": 125.95, "x": "また優勝する学校に止められたのね。"}, {"t": 128.4, "x": "この年は、夏の大会にも徳島商の名前がある。"}, {"t": 131.66666666666666, "x": "ただ夏は最初の試合で負けている。"}, {"t": 133.8, "x": "1938年の春は、徳島の欄に撫養中の名前がある。"}, {"t": 138.16666666666666, "x": "徳島から来るのは、徳島商だけじゃないのね。"}, {"t": 141.26666666666668, "x": "3度目は、1939年の春。"}, {"t": 143.86666666666667, "x": "1回戦は栃木の栃木商に5対2で勝った。"}, {"t": 146.81666666666666, "x": "2回戦で愛知の中京商に3対6で負けた。"}, {"t": 149.83333333333334, "x": "4度目は1940年の春だ。"}, {"t": 152.26666666666668, "x": "1回戦の相手は、長野の松本商。"}, {"t": 154.7, "x": "3対4の1点差で負けた。"}, {"t": 156.81666666666666, "x": "4回来て優勝には届かなかったのね。"}, {"t": 159.43333333333334, "x": "4度の春で勝ったのは、3つ。"}, {"t": 161.36666666666667, "x": "負けたのは4つだ。"}, {"t": 162.73333333333332, "x": "そのうち2度は、その春に優勝した学校に負けている。"}, {"t": 166.75, "x": "そのあとも春の甲子園は続いたの？"}, {"t": 169.1, "x": "1941年の春は、第18回が開かれている。"}, {"t": 172.93333333333334, "x": "この春は、代表が16校で徳島の欄は空いている。"}, {"t": 176.26666666666668, "x": "ここで表は大きく飛ぶ。"}, {"t": 177.73333333333332, "x": "次の第19回は1947年だ。"}, {"t": 180.71666666666667, "x": "表の欄外には、昭和17年から21年は\n戦争のため中断、と書いてある。"}, {"t": 185.88333333333333, "x": "5年も春の大会が無かったのね。"}, {"t": 188.21666666666667, "x": "夏の大会も、1941年から\n1945年までは開かれていない。"}, {"t": 193.66666666666666, "x": "じゃあ、その間は、甲子園で試合は無かったの？"}, {"t": 196.66666666666666, "x": "それが1つだけある。"}, {"t": 197.9, "x": "1942年の夏だ。"}, {"t": 200.05, "x": "スポーツ雑誌の記事によると、\nこの年に全国の大会が開かれた。"}, {"t": 204.2, "x": "名前は大日本学徒体育振興大会。"}, {"t": 206.86666666666667, "x": "開いたのは当時の文部省と、\n大日本学徒体育振興会だ。"}, {"t": 210.91666666666666, "x": "大会は奈良の橿原神宮の運動場が\n中心で、野球の会場は甲子園だった。"}, {"t": 216.0, "x": "いつもの夏の大会とは、開いた所が違うのね。"}, {"t": 219.41666666666666, "x": "そうだ。記事では、参加したのは16チームとある。"}, {"t": 222.56666666666666, "x": "そして決勝で、京都の平安中を\n破って優勝したのが徳島商だ。"}, {"t": 227.0, "x": "徳島商が勝っていたのね！"}, {"t": 228.9, "x": "ただ、夏の大会を開いてきた\n朝日新聞社の資料では扱いが違う。"}, {"t": 233.25, "x": "この年の大会は、\n公式大会とはなっていない、とされている。"}, {"t": 237.21666666666667, "x": "優勝したのに数に入らないのね。"}, {"t": 239.48333333333332, "x": "だから大会の回数にも入っていない。"}, {"t": 241.81666666666666, "x": "この大会は、幻の甲子園と呼ばれている。"}, {"t": 244.66666666666666, "x": "1942年の徳島商の名前は、\n日本高野連の出場校の表には無い。"}, {"t": 249.95, "x": "それって、学校の人はくやしかったでしょうね。"}, {"t": 252.88333333333333, "x": "記事にはそのあとの話も書いてある。"}, {"t": 255.1, "x": "昭和52年。1977年に、\n当時の文部大臣が徳島をたずねた。"}, {"t": 260.35, "x": "そのとき、1942年の大会と優勝を\n証明する賞状と盾を学校に贈った。"}, {"t": 265.8666666666667, "x": "記事はこれを番外の証明書だったと書いている。"}, {"t": 268.71666666666664, "x": "35年たってから優勝の証明が届いたのね。"}, {"t": 271.8833333333333, "x": "ああ。これが2つ目の優勝の正体だ。"}, {"t": 274.96666666666664, "x": "じゃあ表に残るほうの優勝の話を聞かせて。"}, {"t": 277.8, "x": "1947年の春。大会小史の最初の言葉は、\n5年の中断を経て、だ。"}, {"t": 283.35, "x": "俳人の句を引いて、甲子園に\n春が戻ったことを書いている。"}, {"t": 286.8666666666667, "x": "この春の代表は26校。"}, {"t": 288.6166666666667, "x": "徳島の欄には、徳島商の名前がある。"}, {"t": 291.5, "x": "5度目の春ね。"}, {"t": 292.7, "x": "1回戦は兵庫の明石中だ。"}, {"t": 294.6333333333333, "x": "徳島商は1回に4点、2回に5点を取った。"}, {"t": 297.8, "x": "3回にも2点を足して11対6で勝った。"}, {"t": 300.75, "x": "最初の2回で9点も取ったのね！"}, {"t": 303.05, "x": "2回戦は、熊本の熊本商。こちらは8対0だ。"}, {"t": 306.71666666666664, "x": "2回に3点、3回に2点、5回に2点。"}, {"t": 309.46666666666664, "x": "9回にも1点を取った。"}, {"t": 311.28333333333336, "x": "今度は相手を0点に抑えたのね。"}, {"t": 313.46666666666664, "x": "熊本商は、1937年の春にも勝った相手だな。"}, {"t": 317.48333333333335, "x": "準々決勝は愛知の享栄商だ。"}, {"t": 319.68333333333334, "x": "4回に2点、5回に3点。"}, {"t": 321.55, "x": "9回に2点を返されたが、5対2で勝った。"}, {"t": 324.55, "x": "これで4強まで来たのね。"}, {"t": 326.31666666666666, "x": "準決勝は群馬の桐生中だ。"}, {"t": 328.31666666666666, "x": "1回に桐生中が2点を取った。"}, {"t": 330.5, "x": "また先に取られちゃったのね。"}, {"t": 332.3666666666667, "x": "でも徳島商は1回に1点、3回に\n1点を取って追いついた。"}, {"t": 336.26666666666665, "x": "5回に2点を取って4対2と前に出た。"}, {"t": 338.8, "x": "6回に1点を返されたが4対3で逃げ切った。"}, {"t": 341.96666666666664, "x": "1点差で決勝に進んだのね。"}, {"t": 344.1333333333333, "x": "初めての決勝だ。1937年の準決勝を、\nここで越えたことになる。"}, {"t": 349.85, "x": "決勝の相手は、最初に出てきた小倉中ね。"}, {"t": 352.8833333333333, "x": "そうだ。福岡の小倉中だ。"}, {"t": 354.93333333333334, "x": "4回に徳島商が1点を先に取った。"}, {"t": 357.5833333333333, "x": "5回に小倉中が1点を返した。"}, {"t": 359.9166666666667, "x": "1対1になったのね。"}, {"t": 361.56666666666666, "x": "そのあとは6回から12回まで、どちらも点が入らない。"}, {"t": 365.06666666666666, "x": "7つの回でどちらも0点だった。"}, {"t": 367.3333333333333, "x": "ずっと0点のまま13回まで行ったのね。"}, {"t": 370.03333333333336, "x": "13回。徳島商が2点を取った。"}, {"t": 372.53333333333336, "x": "小倉中を0点に抑えて3対1で勝った。"}, {"t": 375.3833333333333, "x": "やったわね！"}, {"t": 376.31666666666666, "x": "5試合で取った点は、31点。"}, {"t": 378.45, "x": "取られた点は12点だ。"}, {"t": 380.0833333333333, "x": "ここで春の表の優勝の欄を見てほしい。"}, {"t": 382.46666666666664, "x": "1924年から1941年までの18回。"}, {"t": 386.26666666666665, "x": "徳島の学校の名前は、1度も無い。"}, {"t": 388.8333333333333, "x": "夏の表の優勝の欄も、1946年まで\n徳島の学校の名前は無い。"}, {"t": 394.01666666666665, "x": "じゃあ、これが\n徳島の学校の初めての全国優勝なのね。"}, {"t": 397.8333333333333, "x": "そうなるな。表に残る徳島の最初の優勝旗だ。"}, {"t": 401.06666666666666, "x": "初めて春に来た1935年から\n数えて、13年目の春だった。"}, {"t": 406.5, "x": "決勝で負けた小倉中は、そのあとどうなったの？"}, {"t": 409.6, "x": "同じ1947年の夏に優勝したのは、小倉中だった。"}, {"t": 414.03333333333336, "x": "春の決勝で戦った2校が春と夏を分け合ったのね。"}, {"t": 417.55, "x": "ああ。小倉中の夏の話は、前の回でもしたな。"}, {"t": 420.8333333333333, "x": "徳島商は、次の1948年の春も来ている。"}, {"t": 424.6166666666667, "x": "この春の代表は、16校。"}, {"t": 426.5, "x": "徳島商は1回戦で負けた。"}, {"t": 428.6, "x": "相手は愛知の享栄商。"}, {"t": 429.96666666666664, "x": "3対4の1点差だった。"}, {"t": 431.95, "x": "前の年の春に準々決勝で勝った相手ね。"}, {"t": 434.8666666666667, "x": "ああ。今度は、逆に1点差で負けている。"}, {"t": 437.46666666666664, "x": "1949年の春も徳島商が来た。"}, {"t": 440.56666666666666, "x": "1回戦の相手は京都の平安だ。"}, {"t": 442.8833333333333, "x": "平安って1942年の決勝の相手よね。"}, {"t": 446.23333333333335, "x": "そうだ。記録のサイトでは、\nこのときの名前は平安と書いてある。"}, {"t": 450.03333333333336, "x": "徳島商は5対3で勝った。"}, {"t": 451.98333333333335, "x": "準々決勝で岐阜の岐阜商に\n2対7で負けて、8強で止まった。"}, {"t": 456.26666666666665, "x": "岐阜商って最初の春に負けた相手ね。"}, {"t": 458.76666666666665, "x": "ところがこの年の夏の表を見ると様子が違う。"}, {"t": 461.6, "x": "徳島の欄に書いてあるのは、城東という名前だ。"}, {"t": 464.8, "x": "城東って別の学校なの？"}, {"t": 466.68333333333334, "x": "記録のサイトでは、 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
