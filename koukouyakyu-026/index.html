<script>
const D={"name": "甲子園に出られなかった名選手", "file": "026_編集用", "dur": 992.51665625, "segs": [], "subs": [{"t": 0.0, "x": "1983年7月27日。横浜スタジアム。"}, {"t": 4.183333333333334, "x": "夏の神奈川大会は、準々決勝を迎えていた。"}, {"t": 7.416666666666667, "x": "日大藤沢と法政二の試合だ。"}, {"t": 9.683333333333334, "x": "日大藤沢のマウンドには、\n3年生の左投手が立っていた。"}, {"t": 13.683333333333334, "x": "4回、2死三塁。打ち取ったはずの当たりが、\nふらふらと落ちた。"}, {"t": 17.766666666666666, "x": "ポテンヒットってやつね。"}, {"t": 19.366666666666667, "x": "そうだ。この1点が最後まで返らなかった。"}, {"t": 22.116666666666667, "x": "0対1。日大藤沢はここで敗れた。"}, {"t": 25.033333333333335, "x": "3年生なら、それで最後の夏が終わりね。"}, {"t": 27.916666666666668, "x": "ああ。この投手は高校で一度も甲子園に出ていない。"}, {"t": 30.966666666666665, "x": "ところが31年後の2014年9月5日。"}, {"t": 34.11666666666667, "x": "この投手は、49歳25日で勝ち投手になる。"}, {"t": 37.583333333333336, "x": "プロ野球の最年長勝利の記録だ。"}, {"t": 40.016666666666666, "x": "49歳？　その左投手って、もしかして。"}, {"t": 43.3, "x": "中日の山本昌だ。"}, {"t": 45.05, "x": "甲子園を知らない人が、そんな記録を作ったの？"}, {"t": 48.25, "x": "山本昌だけではない。"}, {"t": 49.78333333333333, "x": "甲子園の土を踏まずに、プロで\n大記録を残した選手は何人もいる。"}, {"t": 54.6, "x": "甲子園に出られなかった選手が、\nなぜプロで歴代1位まで届いたの？"}, {"t": 58.833333333333336, "x": "その答えを探すために、\n6人の「高校最後の夏」を見ていく。"}, {"t": 63.083333333333336, "x": "何回戦でどこに敗れたのか。そのあと\nどんな道でプロに入ったのか。"}, {"t": 67.26666666666667, "x": "数字は日本野球機構の記録と、新聞や\n雑誌の記事で確かめたものだけを使う。"}, {"t": 72.25, "x": "気に入ったらチャンネル登録と高評価で応援してくれ。"}, {"t": 75.45, "x": "6人って、だれが出てくるの？"}, {"t": 77.55, "x": "年の順に、野村克也、稲尾和久、古田敦也。"}, {"t": 81.13333333333334, "x": "そして山本昌、野茂英雄、岩瀬仁紀だ。"}, {"t": 84.35, "x": "名前を聞いただけで、球場が満員になりそうね。"}, {"t": 87.4, "x": "学校は京都の峰山、\n大分の別府緑丘、兵庫の川西明峰。"}, {"t": 91.96666666666667, "x": "神奈川の日大藤沢、大阪の成城工、愛知の西尾東だ。"}, {"t": 96.36666666666666, "x": "北から南まで、ばらばらね。"}, {"t": 98.5, "x": "この6人が高校にいた夏、6校は\nどれも甲子園に届いていない。"}, {"t": 102.53333333333333, "x": "ただ今日の主役はプロの成績ではない。"}, {"t": 104.73333333333333, "x": "高校3年の夏の方だ。"}, {"t": 106.73333333333333, "x": "プロの話は、おまけってこと？"}, {"t": 108.88333333333334, "x": "おまけと言うには、大きすぎる数字が並ぶがな。"}, {"t": 112.35, "x": "1人目は京都府の北にある峰山高校。野村克也だ。"}, {"t": 115.95, "x": "当時の峰山は、甲子園を狙える\nチームではなかったと伝えられている。"}, {"t": 120.03333333333333, "x": "本人もまったくの無名だった。"}, {"t": 122.1, "x": "のちの大打者が無名？"}, {"t": 123.63333333333334, "x": "ああ。ただ、高校での数字は伝記に残っている。"}, {"t": 126.61666666666666, "x": "2年の夏から3年の春までで、12試合に出た。"}, {"t": 129.93333333333334, "x": "47打数20安打。打率は4割2分6厘だ。"}, {"t": 133.46666666666667, "x": "本塁打は3本。盗塁は19。"}, {"t": 135.75, "x": "打つだけじゃなくて、走ってもいたのね。"}, {"t": 138.25, "x": "1953年、3年の夏。"}, {"t": 140.63333333333333, "x": "京都大会で、峰山は勝ち抜けなかった。"}, {"t": 143.43333333333334, "x": "在学中にいちばん勝ち進んだのは、\n3年の夏の3回戦だったと伝えられている。"}, {"t": 148.56666666666666, "x": "この年の京都大会を制したのは、西舞鶴だ。"}, {"t": 151.85, "x": "じゃあ、プロからは誘いが来なかったの？"}, {"t": 154.25, "x": "来なかった。そこで動いたのが、\n野球部の部長の先生だ。"}, {"t": 157.93333333333334, "x": "先生は、たくさんの球団に手紙を出した。"}, {"t": 160.7, "x": "本人によれば、来てくれたのは南海だけだった。"}, {"t": 163.7, "x": "それが入団テストにつながった。"}, {"t": 165.85, "x": "先生の手紙が、道を開いたのね。"}, {"t": 168.38333333333333, "x": "1954年。野村は、南海に\nテスト生として入った。契約金は無い。"}, {"t": 173.53333333333333, "x": "1年目は9試合に出た。"}, {"t": 175.06666666666666, "x": "11打数でヒットは0本だった。"}, {"t": 177.48333333333332, "x": "最初は、ぜんぜん打てなかったんだ。"}, {"t": 179.76666666666668, "x": "それが1965年には、打率3割2分。"}, {"t": 182.93333333333334, "x": "42本塁打で110打点。"}, {"t": 185.0, "x": "戦後初めての三冠王になった。"}, {"t": 187.13333333333333, "x": "通算では3017試合に出ている。"}, {"t": 189.51666666666668, "x": "安打は2901本。本塁打は657本。"}, {"t": 192.88333333333333, "x": "打点は1988だ。"}, {"t": 195.05, "x": "本塁打王は9回。1961年から\n1968年までは、8年続けて取っている。"}, {"t": 201.55, "x": "打点王は7回。リーグの最優秀選手にも5回選ばれた。"}, {"t": 205.36666666666667, "x": "タイトルの数まで、けた違いね。"}, {"t": 207.46666666666667, "x": "テスト生から三冠王……。"}, {"t": 209.15, "x": "本人は、高校の先生の教えをこう話している。"}, {"t": 212.16666666666666, "x": "「野球の技術を磨く前に、まず人間を磨け」。"}, {"t": 215.16666666666666, "x": "2019年6月には「やっぱり\n甲子園に行きたいよね」と語ったと伝えられている。"}, {"t": 220.51666666666668, "x": "プロで何でも手にした人が、\n甲子園の名前を出すのね。"}, {"t": 224.56666666666666, "x": "2人目は1955年の大分県。"}, {"t": 227.0, "x": "別府緑丘の稲尾和久だ。"}, {"t": 229.2, "x": "別府緑丘は、学校として一度も甲子園に出ていない。"}, {"t": 232.93333333333334, "x": "学校ごと、一度も？"}, {"t": 234.6, "x": "ああ。夏の予選に最後に出たのは\n1967年だと記事にある。"}, {"t": 239.1, "x": "野球部ごと、歴史の中にある学校なのね。"}, {"t": 242.05, "x": "1955年、3年の夏の大分大会。"}, {"t": 245.06666666666666, "x": "稲尾は準決勝まで勝ち上がった。"}, {"t": 247.21666666666667, "x": "そこで、佐伯鶴城に敗れた。"}, {"t": 249.35, "x": "相手の佐伯鶴城には阿南準郎がいた。\nのちに広島の監督になる人だ。"}, {"t": 254.18333333333334, "x": "相手のチームにも、のちのプロがいたのね。"}, {"t": 256.8, "x": "卒業の前に、稲尾をめぐって2つの球団が動いた。"}, {"t": 260.23333333333335, "x": "先に声をかけたのは南海だ。"}, {"t": 262.23333333333335, "x": "家に毎月5000円を送っていたという。"}, {"t": 264.6666666666667, "x": "また南海が出てきたわね。"}, {"t": 266.48333333333335, "x": "そこへ、地元の西鉄が巻き返した。"}, {"t": 269.05, "x": "西鉄に推したのは、高校の先輩の河村久文だ。"}, {"t": 272.5833333333333, "x": "1956年。稲尾は西鉄に入った。"}, {"t": 275.7, "x": "契約金は50万円。月給は3万5000円だった。"}, {"t": 279.23333333333335, "x": "最後は、地元の球団を選んだのね。"}, {"t": 281.81666666666666, "x": "1年目の稲尾は21勝6敗。"}, {"t": 283.8666666666667, "x": "防御率は1.06だ。"}, {"t": 285.7, "x": "そして1961年。1シーズンで42勝を挙げた。"}, {"t": 289.7, "x": "42勝？　1年で？"}, {"t": 291.5, "x": "1年でだ。日本のプロ野球で、今も\n1シーズンの最多タイの数字だ。"}, {"t": 295.8666666666667, "x": "1957年は35勝。"}, {"t": 298.06666666666666, "x": "1958年は33勝。"}, {"t": 300.46666666666664, "x": "1959年は30勝。"}, {"t": 302.8, "x": "30勝以上の年が、4回ある。"}, {"t": 305.1333333333333, "x": "通算では276勝。奪三振は2574個だ。"}, {"t": 309.48333333333335, "x": "1957年には20連続勝利もある。"}, {"t": 312.3666666666667, "x": "7月18日から10月1日までの白星だ。"}, {"t": 315.76666666666665, "x": "1961年は78試合に投げた。"}, {"t": 318.76666666666665, "x": "42勝は、その中で挙げた数字だ。"}, {"t": 321.4166666666667, "x": "20勝以上の年は、1年目の1956年から8年続いた。"}, {"t": 326.21666666666664, "x": "毎年20勝が、当たり前だったのね。"}, {"t": 328.8833333333333, "x": "のちに出た本人の自伝の題は\n『神様、仏様、稲尾様』だ。"}, {"t": 333.51666666666665, "x": "神様と仏様の次に、名前が並んでいるのね。"}, {"t": 336.8, "x": "準決勝で終わった夏から、そこまで行ったのね。"}, {"t": 339.9, "x": "ここまでの2人には、共通点がひとつある。"}, {"t": 342.65, "x": "どちらも最初に声をかけたのが南海だった。"}, {"t": 345.5, "x": "野村は南海に入って、稲尾は西鉄に入ったのね。"}, {"t": 349.01666666666665, "x": "そうだ。同じ球団が見ていても、行き先は分かれた。"}, {"t": 353.0, "x": "ねえ。400勝の金田正一は入らないの？"}, {"t": 355.96666666666664, "x": "いい質問だ。金田は愛知の享栄商にいた。"}, {"t": 358.76666666666665, "x": "3年の夏は1950年。"}, {"t": 360.8, "x": "愛知大会の準決勝で一宮に敗れた。"}, {"t": 363.6166666666667, "x": "その年の8月に国鉄に入り、プロで\n400勝を挙げた。今も歴代1位だ。"}, {"t": 368.65, "x": "入団は1950年8月10日。"}, {"t": 371.1333333333333, "x": "中退して、17歳でプロに入った。"}, {"t": 373.73333333333335, "x": "奪三振も4490個で歴代1位だ。"}, {"t": 377.06666666666666, "x": "じゃあ、ぴったりじゃない。"}, {"t": 378.5, "x": "ところが1年の夏の1948年。"}, {"t": 381.26666666666665, "x": "享栄商は甲子園に出ている。"}, {"t": 383.1333333333333, "x": "金田は控えとしてベンチに入っていた。"}, {"t": 385.4, "x": "試合では投げていない。"}, {"t": 386.8666666666667, "x": "ベンチには入っていたのね。"}, {"t": 388.6333333333333, "x": "そうだ。だから今日は\n「一度も出ていない」の中には入れなかった。"}, {"t": 392.51666666666665, "x": "甲子園で1球も投げていない\n400勝投手、という言い方が正しい。"}, {"t": 396.71666666666664, "x": "数え方ひとつで、入る人が変わるのね。"}, {"t": 400.03333333333336, "x": "ここから少し時代が飛ぶ。"}, {"t": 401.76666666666665, "x": "1983年の夏に最後の夏を迎えた\n3年生に、2人の名選手がいた。"}, {"t": 407.25, "x": "神奈川の山本昌。そして兵庫の古田敦也だ。"}, {"t": 410.5833333333333, "x": "同じ夏に、どっちも3年生だったの？"}, {"t": 413.26666666666665, "x": "そうだ。先に古田を見る。"}, {"t": 415.05, "x": "古田がいたのは、兵庫県の川西明峰だ。"}, {"t": 417.9166666666667, "x": "この夏の兵庫大会で、\n古田の高校野球は3回戦で終わった。"}, {"t": 422.0, "x": "本人は、高校の3年間をこう振り返っている。"}, {"t": 425.0, "x": "「県大会で3回戦に進出したのが\nベスト記録でしたね」。"}, {"t": 428.71666666666664, "x": "「甲子園なんて夢のまた夢です」。"}, {"t": 430.8833333333333, "x": "ずいぶん、あっさり言うのね。"}, {"t": 432.55, "x": "古田は、立命館大学にふつうの受験で入った。"}, {"t": 435.8333333333333, "x": "大学4年の1987年。"}, {"t": 438.2, "x": "ドラフトで、名前は呼ばれなかった。"}, {"t": 440.43333333333334, "x": "本人は「どこからも\n声をかけてもらえなかった」と話している。"}, {"t": 444.3666666666667, "x": "大学でも、すぐにはプロに届かなかったのね。"}, {"t": 447.43333333333334, "x": "そこで、社会人のトヨタ自動車に入った。"}, {"t": 450.2, "x": "1988年には、ソウル五輪で銀メダルを取っている。"}, {"t": 454.1, "x": "そして1989年のドラフト2位で、ヤクルトに入った。"}, {"t": 458.2, "x": "古田の数字でまず挙がるのが、盗塁阻止率だ。"}, {"t": 461.23333333333335, "x": "とうるいそしりつ？"}, {"t": 462.45, "x": "走者が盗塁をしたときに、捕手が刺した割合だ。"}, {"t": 465.56666666666666, "x": "古田の通算は4割6分2厘。"}, {"t": 467.56666666666666, "x": "歴代1位とされる。"}, {"t": 468.98333333333335, "x": "1993年には、1シーズンで6割4分4厘を記録した。"}, {"t": 473.6333333333333, "x": "半分以上、刺していたってことね。"}, {"t": 475.96666666666664, "x": "打撃でも、1991年に首位打者になっている。"}, {"t": 479.6166666666667, "x": "1993年と1997年には、\nリーグの最優秀選手に選ばれた。"}, {"t": 485.15, "x": "守りのゴールデングラブ賞は10回だ。"}, {"t": 487.48333333333335, "x": "守って打てる捕手だったのね。"}, {"t": 489.4, "x": "そして2005年4月24日。"}, {"t": 491.48333333333335, "x": "松山の坊っちゃんスタジアムでの広島戦。"}, {"t": 494.15, "x": "古田は大竹寛から打って、通算2000本安打に届いた。"}, {"t": 497.8, "x": "史上32人目だ。"}, {"t": 499.28333333333336, "x": "大学と社会人を経てプロに入った\n選手では、初めての達成だった。"}, {"t": 503.7, "x": "捕手としては2人目。"}, {"t": 504.98333333333335, "x": "1人目は野村克也だ。"}, {"t": 506.8, "x": "1人目の人と、ここでつながるのね。"}, {"t": 509.3333333333333, "x": "どちらも高校の最後の夏は3回戦までだった。"}, {"t": 512.5166666666667, "x": "3回戦どうしの2人が、捕手の2000本で並んだのね。"}, {"t": 516.1666666666666, "x": "最後は2097安打。"}, {"t": 517.8666666666667, "x": "打率は2割9分4厘だった。"}, {"t": 520.65, "x": "4人目は、最初の場面の主。"}, {"t": 522.65, "x": "日大藤沢の山本昌だ。"}, {"t": 524.7833333333333, "x": "実はその1年前。2年の夏も準々決勝で敗れている。"}, {"t": 528.6333333333333, "x": "1982年7月29日。"}, {"t": 531.2333333333333, "x": "横浜商に2対3だった。"}, {"t": 533.1833333333333, "x": "神奈川新聞は、この試合を\n「人生で一番泣いた日」という見出しで取り上げた。"}, {"t": 538.1666666666666, "x": "2年続けて、準々決勝で止まったのね。"}, {"t": 541.1333333333333, "x": "3年の夏は、その壁を越えようとした夏だった。"}, {"t": 544.3166666666667, "x": "7月18日の追浜球場で、\n2試合続けての完封を決めている。"}, {"t": 548.8, "x": "それでも、7月27日の法政二戦は0対1。"}, {"t": 552.5666666666667, "x": "最後は、たった1点だったのね。"}, {"t": 554.7833333333333, "x": "この年の秋。1983年のドラフトで\n中日が5位で指名した。"}, {"t": 559.4666666666667, "x": "高校から、そのままプロへ進んだ。"}, {"t": 561.7833333333333, "x": "本人は、これを「ラッキーだった」と話している。"}, {"t": 565.0166666666667, "x": "ラッキー？　どういうこと？"}, {"t": 566.55, "x": "神奈川の選抜チームで、エースだった投手が抜けた。"}, {"t": 569.7666666666667, "x": "そこで繰り上がってエースになり、\nプロの目に留まったと語っている。"}, {"t": 573.5166666666667, "x": "巡り合わせって、あるのね。"}, {"t": 575.3666666666667, "x": "山本昌は中日で投げ続けた。"}, {"t": 577.5333333333333, "x": "581試合で通算219勝だ。"}, {"t": 580.5666666666667, "x": "最多勝は1993年と1994年と1997年の3回。"}, {"t": 586.1333333333333, "x": "1994年には沢村賞も取った。"}, {"t": 589.15, "x": "2006年には、41歳1か月で\nノーヒットノーランを達成した。"}, {"t": 593.3833333333333, "x": "これも史上最年長の達成だった。"}, {"t": 595.6666666666666, "x": "そして2014年9月5日の阪神戦。"}, {"t": 598.4, "x": "5回を投げて5安打。"}, {"t": 599.65, "x": "点を許さずに勝ち投手になった。"}, {"t": 601.7833333333333, "x": "49歳25日の勝利だ。"}, {"t": 603.9666666666667, "x": "それまでの最年長は1950年の記録。"}, {"t": 606.85, "x": "阪急の浜崎真二の48歳4か月だった。"}, {"t": 610.2, "x": "64年ぶりに、記録を書きかえた。"}, {"t": 612.7833333333333, "x": "2年の夏に泣いた日から数えると、32年ね。"}, {"t": 616.1666666666666, "x": "最後の登板は2015年。"}, {"t": 617.9, "x": "50歳1か月で、マウンドに立った。"}, {"t": 620.35, "x": "50代で投げたのは、プロ野球で初めてのことだった。"}, {"t": 624.3, "x": "5人目は大阪。成城工の野茂英雄だ。"}, {"t": 627.0166666666667, "x": "野茂の名前が高校で知られたのは、2年の夏だった。"}, {"t": 630.3, "x": "1985年7月19日、住之江球場。"}, {"t": 633.75, "x": "大阪大会の2回戦だ。"}, {"t": 635.6166666666667, "x": "生野を相手に、野茂は完全試合を達成した。"}, {"t": 638.6166666666667, "x": "ひとりもランナーを出さなかったってこと？"}, {"t": 640.9833333333333, "x": "そうだ。104球で、三振は10個だった。"}, {"t": 643.9166666666666, "x": "試合のあとの野茂の言葉を、雑誌が伝えている。"}, {"t": 646.8, "x": "「完全試合はみんなのおかげ。\nなんだか夢を見ているようです」。"}, {"t": 650.2166666666667, "x": "「次は、とにかく勝ち進んでPLと対戦してみたい」。"}, {"t": 653.6, "x": "PLって、PL学園のこと？"}, {"t": 655.8333333333334, "x": "そうだ。同じ大阪の学校だ。"}, {"t": 657.95, "x": "1986年、3年の夏。"}, {"t": 660.4666666666667, "x": "成城工は大阪大会の5回戦まで進んだ。"}, {"t": 663.4833333333333, "x": "相手は興国。8回の2死二塁から\n打たれた1点が決勝点になった。"}, {"t": 667.85, "x": "0対1。ここで、野茂の夏は終わった。"}, {"t": 670.65, "x": "また0対1……。山本昌の最後の夏と、同じ点数ね。"}, {"t": 674.6666666666666, "x": "卒業後の野茂は、社会人の新日鉄堺に入った。"}, {"t": 678.25, "x": "初任給は、月9万円だったという。"}, {"t": 680.7333333333333, "x": "そして1989年11月26日のドラフト。"}, {"t": 684.6833333333333, "x": "野茂を、史上最多の8球団が1位で指名した。"}, {"t": 687.9166666666666, "x": "8球団も！"}, {"t": 689.0833333333334, "x": "くじを引き当てたのは近鉄だ。"}, {"t": 690.85, "x": "契約金は1億2000万円だった。"}, {"t": 693.25, "x": "1990年は1年目で18勝。"}, {"t": 695.8, "x": "奪三振は287個だ。"}, {"t": 698.1, "x": "防御率は2.91。近鉄では5年で78勝を挙げた。"}, {"t": 702.1, "x": "1年目は最多勝に加えて、新人王と\n最優秀選手と沢村賞を取った。"}, {"t": 706.8666666666667, "x": "最多勝と最多奪三振は、\n1990年から4年続けて取っている。"}, {"t": 711.6166666666667, "x": "1990年4月29日には、1試合で17個の三振を奪った。"}, {"t": 716.6833333333333, "x": "1年目から、タイトルを総なめね。"}, {"t": 719.05, "x": "1995年からは大リーグに渡り、\nその年の新人王に選ばれた。"}, {"t": 723.7, "x": "この年は13勝6敗。"}, {"t": 725.3, "x": "防御率は2.54だった。"}, {"t": 727.2666666666667, "x": "1996年9月17日。"}, {"t": 729.8, "x": "ドジャースでロッキーズを相手にノーヒットノーラン。"}, {"t": 732.3333333333334, "x": "点数は9対0だった。"}, {"t": 734.0166666666667, "x": "ロッキーズの本拠地で、これを\n達成した初めての投手だった。"}, {"t": 737.7333333333333, "x": "2001年4月4日。"}, {"t": 739.25, "x": "レッドソックスに移って\n最初の試合で、2度目を記録した。"}, {"t": 742.9, "x": "相手はオリオールズ。3対0だった。"}, {"t": 745.1666666666666, "x": "日本で78勝。大リーグで123勝。"}, {"t": 748.0833333333334, "x": "合わせて201勝だ。"}, {"t": 749.65, "x": "200勝目は2005年6月15日。"}, {"t": 752.0666666666667, "x": "日本とアメリカを合わせた数字だ。"}, {"t": 754.2833333333333, "x": "0対1で終わった夏から、海の向こうで\n2回もノーヒットノーラン……。"}, {"t": 758.8, "x": "6人目は1992年の愛知。"}, {"t": 761.2333333333333, "x": "西尾東の岩瀬仁紀だ。"}, {"t": 763.1166666666667, "x": "この夏の愛知大会の2回戦。"}, {"t": 765.05, "x": "岩瀬は三好を相手にノーヒットノーランを記録した。"}, {"t": 768.1666666666666, "x": "野茂と同じで、高校でも大きな記録があったのね。"}, {"t": 771.35, "x": "本人は2年の秋の県大会で、東邦に\nサヨナラ負けしたことを振り返っている。"}, {"t": 776.1, "x": "「東邦を倒したい気持ちが強かった」と話している。"}, {"t": 779.2666666666667, "x": "だが3年の夏。西尾東は4回戦で名城大附に敗れた。"}, {"t": 783.3833333333333, "x": "本人はのちにこう語っている。"}, {"t": 785.2333333333333, "x": "「甲子園は目指しながらも遠い存在でした」。"}, {"t": 787.9333333333333, "x": "古田の「夢のまた夢」と、少し似た言い方ね。"}, {"t": 791.4333333333333, "x": "岩瀬は愛知大学に進んだ。"}, {"t": 793.1666666666666, "x": "初めは外野手だったと伝えられている。"}, {"t": 795.5833333333334, "x": "そのあと社会人のNTT東海を経て、\n1998年のドラフト2位で中日に入った。"}, {"t": 801.7166666666667, "x": "山本昌と、同じ中日ね。"}, {"t": 804.05, "x": "そうだ。岩瀬は、試合の最後を締める\n投手として数字を積み上げた。"}, {"t": 808.1166666666667, "x": "2014年7月26日。"}, {"t": 810.2333333333333, "x": "巨人戦で400セーブ。"}, {"t": 811.7333333333333, "x": "プロ野球で初めてだ。"}, {"t": 813.25, "x": "2018年9月28日。"}, {"t": 815.4166666666666, "x": "阪神戦で1000試合登板。これも\nプロ野球で初めてだった。"}, {"t": 819.1333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
