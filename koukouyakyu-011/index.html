<script>
const D={"name": "ルールの盲点", "file": "011_編集用", "dur": 834.8333125, "segs": [], "subs": [{"t": 0.0, "x": "2012年8月13日。"}, {"t": 2.0166666666666666, "x": "兵庫県の甲子園球場。"}, {"t": 3.7666666666666666, "x": "夏の全国高校野球の2回戦だ。"}, {"t": 6.166666666666667, "x": "戦ったのは熊本の済々黌と、徳島の鳴門。"}, {"t": 9.566666666666666, "x": "7回裏。済々黌が2対1でリードしていた。"}, {"t": 12.6, "x": "1アウトで一塁と三塁に走者がいる。"}, {"t": 14.933333333333334, "x": "打者の打球はショートへのライナー。"}, {"t": 16.816666666666666, "x": "遊撃手がしっかり捕って、2アウト。"}, {"t": 19.166666666666668, "x": "そのまま一塁へ投げて、飛び出していた走者もアウト。"}, {"t": 22.466666666666665, "x": "アウトが3つ。チェンジね。"}, {"t": 24.266666666666666, "x": "鳴門の選手たちもベンチへ戻っていった。"}, {"t": 26.733333333333334, "x": "ところが球審は、済々黌に1点を認めた。"}, {"t": 29.866666666666667, "x": "え？ アウトを3つ取ったのに、1点？"}, {"t": 32.233333333333334, "x": "ああ。スコアボードにはちゃんと1点が入った。"}, {"t": 34.86666666666667, "x": "この1点は今では\n「ルールブックの盲点の1点」と呼ばれている。"}, {"t": 39.3, "x": "どうしてそんなことが起きるの？"}, {"t": 41.18333333333333, "x": "今回は高校野球で本当に起きた\n「ルールの盲点」を見ていく。"}, {"t": 45.083333333333336, "x": "アウトなのに1点が入った試合。"}, {"t": 47.05, "x": "三振のあとに3人が帰ってきた試合。"}, {"t": 49.516666666666666, "x": "そして、ファウルを打ち続けた小さな2番打者の話だ。"}, {"t": 53.083333333333336, "x": "3つとも決まりを知っているかどうかの話なのね。"}, {"t": 56.11666666666667, "x": "そうだ。どの場面も新聞や記録に\n残っている話だけでいく。"}, {"t": 59.916666666666664, "x": "守った側が悪かったという話ではない。"}, {"t": 62.38333333333333, "x": "決まりのどこに落とし穴があったのか。\nそこを見ていこう。"}, {"t": 65.53333333333333, "x": "本編の前にチャンネル登録と高評価をお願いしたい。"}, {"t": 68.85, "x": "お願いします！"}, {"t": 70.5, "x": "もう一度7回裏の場面を見てみよう。"}, {"t": 72.76666666666667, "x": "済々黌は1アウト、一塁と三塁。"}, {"t": 75.18333333333334, "x": "打席には西という選手が入っていた。"}, {"t": 77.56666666666666, "x": "このとき一塁走者も三塁走者も、\n早めに走り出していた。"}, {"t": 81.43333333333334, "x": "一塁はヒットエンドランのサイン。"}, {"t": 83.26666666666667, "x": "三塁はギャンブルスタートのサインだったと\n伝えられている。"}, {"t": 86.5, "x": "打った瞬間にはもう走っていたのね。"}, {"t": 88.85, "x": "ああ。そこへ打球がショートに\n飛んで、ライナーで捕られた。"}, {"t": 92.16666666666667, "x": "ライナーを捕られたら、走者は\n元の塁に戻らないといけないのよね。"}, {"t": 96.11666666666666, "x": "その通り。戻る前にボールを送られたらアウトになる。"}, {"t": 99.15, "x": "一塁走者は戻れず、一塁への送球で\nアウト。これが3つ目だ。"}, {"t": 103.16666666666667, "x": "ところが三塁走者の中村は三塁へ戻らなかった。"}, {"t": 106.4, "x": "そのまま本塁まで走り切っていた。"}, {"t": 108.7, "x": "戻らずにホームを踏んじゃったの？"}, {"t": 110.6, "x": "そうだ。しかも一塁でアウトになるより\n少し早く踏んでいた。"}, {"t": 114.18333333333334, "x": "球審は試合のあと、こう説明している。"}, {"t": 116.7, "x": "一塁でのアウトより本塁に入るほうが早かった。"}, {"t": 119.6, "x": "鳴門からアピールがなかったので得点を認めた。"}, {"t": 122.56666666666666, "x": "アピール？ それがあったら1点は入らなかったの？"}, {"t": 125.5, "x": "入らなかった。そこがこの話の\nいちばん大事なところだ。"}, {"t": 129.66666666666666, "x": "そもそも3アウト目の前にホームを踏めば点になるの？"}, {"t": 132.91666666666666, "x": "なる場合と、ならない場合がある。"}, {"t": 134.88333333333333, "x": "3つ目のアウトが「フォースアウト」なら\nその回の点は入らない。"}, {"t": 138.71666666666667, "x": "フォースアウトって何だったかしら。"}, {"t": 140.73333333333332, "x": "打者が走り出したせいで、前の走者が\n次の塁へ進むしかなくなる。"}, {"t": 144.88333333333333, "x": "そういう走者を、塁を踏んだり\nタッチしたりしてアウトにすることだ。"}, {"t": 148.56666666666666, "x": "たとえば内野ゴロで、二塁でアウトになる一塁走者。"}, {"t": 151.55, "x": "あれがフォースアウトだ。"}, {"t": 153.01666666666668, "x": "じゃあもし内野ゴロだったら？"}, {"t": 154.71666666666667, "x": "一塁走者は押し出されて走る。"}, {"t": 156.71666666666667, "x": "二塁でその走者をアウトにすればフォースアウトだ。"}, {"t": 159.4, "x": "その場合は三塁走者が先に本塁を\n踏んでいても、1点にはならない。"}, {"t": 163.7, "x": "じゃあこの試合はフォースアウトじゃなかったの？"}, {"t": 166.08333333333334, "x": "違う。打球はライナーで、打者は\nその時点でアウトになっている。"}, {"t": 169.71666666666667, "x": "打者が走者にならないから、\n一塁走者が押し出されることもない。"}, {"t": 173.55, "x": "一塁走者は「戻りそこねてアウト」になっただけだ。"}, {"t": 177.0, "x": "だからフォースアウトの決まりは使えないのね。"}, {"t": 179.58333333333334, "x": "ああ。そうなると普通の得点の決まりが使われる。"}, {"t": 182.6, "x": "3つ目のアウトより前に本塁を踏んだ走者は、1点。"}, {"t": 185.95, "x": "つまり中村選手の1点はそのまま残る。"}, {"t": 188.78333333333333, "x": "そういうことだ。ここまでは決まりの本どおりだ。"}, {"t": 192.11666666666667, "x": "でも三塁走者は戻らないといけなかったのよね？"}, {"t": 195.1, "x": "そう。ライナーが捕られたら、\n三塁走者も三塁に戻るのが決まりだ。"}, {"t": 199.23333333333332, "x": "戻らずに走ったことを、守る側は\n審判に申し出ることができる。"}, {"t": 203.2, "x": "これを「アピール」という。"}, {"t": 204.85, "x": "具体的には何をすればいいの？"}, {"t": 206.85, "x": "ボールを三塁へ送って三塁を踏み、審判に申し出る。"}, {"t": 210.13333333333333, "x": "「三塁走者が戻らないまま走った」と\nはっきり分かるようにするんだ。"}, {"t": 214.25, "x": "アピールしたらどうなるの？"}, {"t": 215.8, "x": "三塁へボールを送って\n「三塁走者が戻っていない」と申し出る。"}, {"t": 219.68333333333334, "x": "認められれば三塁走者もアウトになる。"}, {"t": 222.13333333333333, "x": "でも、もうアウトは3つあるのに？"}, {"t": 224.21666666666667, "x": "そこが面白いところだ。"}, {"t": 225.78333333333333, "x": "あとから取ったアウトを\n3つ目のアウトと入れかえられる。"}, {"t": 228.6, "x": "「第3アウトの置きかえ」と呼ばれている。"}, {"t": 230.98333333333332, "x": "3つ目のアウトが三塁走者になればその1点は消える。"}, {"t": 234.33333333333334, "x": "アウトを入れかえられるなんて知らなかったわ。"}, {"t": 236.73333333333332, "x": "ただしこの申し出には締め切りがある。"}, {"t": 238.86666666666667, "x": "守る側の投手と内野手がみんな\nフェアグラウンドを出るまでだ。"}, {"t": 242.23333333333332, "x": "鳴門の選手はそのままベンチへ引き上げていた。"}, {"t": 244.98333333333332, "x": "報道では鳴門の選手がファウルラインを越えた瞬間に、"}, {"t": 248.1, "x": "済々黌の得点が認められたと書かれている。"}, {"t": 251.05, "x": "引き上げた時点でもう申し出はできなかったのね。"}, {"t": 253.95, "x": "ああ。アウト3つを取ってベンチへ\n帰るのは、いつもならあたりまえの動きだ。"}, {"t": 258.1333333333333, "x": "そのあたりまえの動きのすき間に、\n1点が入ったことになる。"}, {"t": 262.35, "x": "中村選手はこのルールを知っていて走ったの？"}, {"t": 265.21666666666664, "x": "知っていた。試合のあと本人がそう話している。"}, {"t": 268.15, "x": "小学生のころに読んだ野球漫画\n『ドカベン』でこのルールを知った。"}, {"t": 272.1, "x": "そして「狙っていた」とも語っている。"}, {"t": 274.75, "x": "漫画で覚えたルールが甲子園で本当に使われたのね。"}, {"t": 278.03333333333336, "x": "『ドカベン』は水島新司の高校野球漫画だ。"}, {"t": 280.93333333333334, "x": "作中にはよく似た場面が出てくる。"}, {"t": 283.1166666666667, "x": "スクイズが投手への小さなフライになる。"}, {"t": 285.43333333333334, "x": "三塁走者は戻らずに、そのまま本塁へ。"}, {"t": 288.1166666666667, "x": "投手は一塁へ送って、併殺でチェンジ。"}, {"t": 290.73333333333335, "x": "ところが三塁走者はその前に本塁を踏んでいた。"}, {"t": 293.7, "x": "守る側はアピールしないまま\n引き上げ、1点が認められる。"}, {"t": 297.28333333333336, "x": "済々黌の場面とほとんど同じじゃない。"}, {"t": 299.75, "x": "ああ。だから当時「ドカベンの場面が\n甲子園で起きた」と話題になった。"}, {"t": 304.0, "x": "この試合がそのまま「ルールブックの盲点の1点」の\n代表例になったわけだ。"}, {"t": 309.21666666666664, "x": "それで試合はどうなったの？"}, {"t": 310.8666666666667, "x": "この1点で、済々黌は3対1とした。"}, {"t": 313.65, "x": "そしてそのまま3対1で勝っている。"}, {"t": 316.03333333333336, "x": "じゃああの1点は大きかったのね。"}, {"t": 318.05, "x": "報道でも「貴重な追加点」と書かれた。"}, {"t": 320.73333333333335, "x": "このあと2017年にはプロ野球のキャンプでも、"}, {"t": 323.71666666666664, "x": "阪神の選手が「何年か前の高校野球であったことを\n覚えていた」と話している。"}, {"t": 328.8666666666667, "x": "プロの人も覚えていたのね。"}, {"t": 330.6, "x": "知っていれば1点、知らなければ\n1点を取られる。こわい決まりね。"}, {"t": 334.5, "x": "ああ。次は守る側が「終わった」と\n思ったあとに3点が入った試合だ。"}, {"t": 339.55, "x": "2007年の夏。こちらは甲子園をかけた神奈川大会だ。"}, {"t": 343.3666666666667, "x": "準決勝。東海大相模と横浜。"}, {"t": 346.73333333333335, "x": "場所は横浜スタジアム。"}, {"t": 347.53333333333336, "x": "神奈川の強い学校どうしね。"}, {"t": 349.56666666666666, "x": "ああ。東スポは\n満員の球場での「黄金カード」と書いている。"}, {"t": 353.3, "x": "4回表。東海大相模は2アウト、一塁と三塁。"}, {"t": 356.93333333333334, "x": "打席は9番の菅野智之。"}, {"t": 359.1, "x": "菅野って、のちにプロでエースになる、あの菅野選手？"}, {"t": 362.6, "x": "そうだ。このときは東海大相模の選手で、\n打順は9番だった。"}, {"t": 366.73333333333335, "x": "菅野は追い込まれてから\nワンバウンドのスライダーにバットを出した。"}, {"t": 370.15, "x": "球審は一塁の塁審に確かめて、\n「スイング」。空振りの三振だ。"}, {"t": 374.4166666666667, "x": "2アウトだからこれでチェンジね。"}, {"t": 376.3833333333333, "x": "横浜の守りもそう考えた。"}, {"t": 378.3666666666667, "x": "捕手はボールを三塁へ送って、ベンチへ戻り始めた。"}, {"t": 381.55, "x": "その三塁手はのちにプロで活躍する筒香嘉智だ。"}, {"t": 385.1, "x": "すごい顔ぶれの試合だったのね。"}, {"t": 387.6166666666667, "x": "そのとき三塁側のベンチから声が飛んだ。"}, {"t": 390.2, "x": "東海大相模の監督、門馬敬治だ。"}, {"t": 392.8833333333333, "x": "「走れ！ 走れ！」。"}, {"t": 393.9, "x": "塁にいた走者にも「回れ、回れ！」と手を振った。"}, {"t": 397.25, "x": "三振したのに走るの？"}, {"t": 398.98333333333335, "x": "ああ。ワンバウンドの球を捕っても、"}, {"t": 401.01666666666665, "x": "それは「ちゃんと捕った」ことにならない。"}, {"t": 403.4, "x": "だから捕手は打者にタッチするか、\n一塁へ送らないといけない。"}, {"t": 407.01666666666665, "x": "それをしないかぎり3つ目のアウトは成り立たない。"}, {"t": 409.81666666666666, "x": "それが振り逃げね。"}, {"t": 411.1333333333333, "x": "そうだ。菅野はベンチに戻りかけていたが、\n声に気づいて走り出した。"}, {"t": 415.4, "x": "三塁走者、一塁走者、そして菅野。"}, {"t": 418.15, "x": "3人が次々に本塁へ帰ってきた。"}, {"t": 420.8, "x": "三振で、3点？"}, {"t": 422.3, "x": "ああ。判定は変わらなかった。"}, {"t": 424.1666666666667, "x": "のちに「振り逃げ3ラン」と呼ばれる場面だ。"}, {"t": 426.95, "x": "菅野は後に、こう振り返っている。"}, {"t": 429.15, "x": "ふつうなら打者はベンチに帰ってしまう。"}, {"t": 431.35, "x": "たまたま打席を出るか出ないかの\nところで声が聞こえた、と。"}, {"t": 434.78333333333336, "x": "そしてこのルールを知っていたのは\n門馬監督だけだった、とも話している。"}, {"t": 439.03333333333336, "x": "門馬監督は以前、同じプレーで\n負けたことがあったと聞いた、とも。"}, {"t": 443.1666666666667, "x": "自分が負けた経験から決まりを覚えていたのかしら。"}, {"t": 446.31666666666666, "x": "そこまでは本人の言葉が残っていない。"}, {"t": 448.73333333333335, "x": "ただその一声で3点が入ったのは確かだ。"}, {"t": 452.2, "x": "でも一塁に走者がいたら\n振り逃げはできないって聞いたことがあるわ。"}, {"t": 456.01666666666665, "x": "半分は正しい。"}, {"t": 457.15, "x": "0アウトか1アウトで一塁に\n走者がいるときは、振り逃げはできない。"}, {"t": 461.01666666666665, "x": "ところが2アウトなら、一塁に\n走者がいても振り逃げができる。"}, {"t": 464.75, "x": "この場面は2アウトだったから走れたのね。"}, {"t": 467.43333333333334, "x": "そういうことだ。"}, {"t": 468.45, "x": "「一塁に走者がいるから大丈夫」と\n思いやすい場面だったとも言える。"}, {"t": 472.3666666666667, "x": "試合は東海大相模が6対4で勝ち、決勝に進んだ。"}, {"t": 476.05, "x": "ただ東海大相模は決勝で\n桐光学園に8対10で敗れている。"}, {"t": 480.05, "x": "この年は甲子園には届かなかった。"}, {"t": 482.45, "x": "守った横浜の選手は、つらかったでしょうね。"}, {"t": 485.4166666666667, "x": "当時の捕手はのちの取材で\n「ルールは頭に入っていた」と話している。"}, {"t": 489.7, "x": "知っていても、終わったと思った一瞬に起きる。"}, {"t": 492.56666666666666, "x": "満員の球場でチェンジだと\n思って戻るのは自然な動きよね。"}, {"t": 496.26666666666665, "x": "そこがこの決まりのこわさだ。"}, {"t": 498.05, "x": "横浜の部長は「起用した自分が悪かった」と、\nその捕手をかばったという。"}, {"t": 502.68333333333334, "x": "監督も「誰だってミスはある」と\n声をかけたと伝えられている。"}, {"t": 507.15, "x": "3つ目は、点が入った話ではない。"}, {"t": 509.55, "x": "2013年の夏の甲子園。"}, {"t": 511.43333333333334, "x": "岩手の花巻東に、千葉翔太という選手がいた。"}, {"t": 514.75, "x": "背の高さは156センチ。その大会に\n出た選手で、いちばん低かった。"}, {"t": 519.6666666666666, "x": "156センチって、かなり小さいわね。"}, {"t": 522.4333333333333, "x": "ああ。左投げ左打ちで、打順は\n2番、守りはセンターだ。"}, {"t": 526.2166666666667, "x": "千葉が得意にしていたのは、\nファウルで粘る打ち方だった。"}, {"t": 529.5, "x": "2ストライクまではバントの構えで揺さぶる。"}, {"t": 532.0166666666667, "x": "追い込まれると構えを変えて、\nきわどい球をファウルにしていく。"}, {"t": 535.4833333333333, "x": "打ち取られないように、ずっと粘るのね。"}, {"t": 537.9166666666666, "x": "2回戦の彦根東戦では、1つの打席で\n13球粘って四球を選んだ。"}, {"t": 542.8, "x": "この試合の5つの打席で、\n相手に投げさせたのは34球。"}, {"t": 546.7833333333333, "x": "1人で34球も？"}, {"t": 548.5, "x": "準々決勝の鳴門戦では、\n5つの打席で41球を投げさせている。"}, {"t": 553.15, "x": "鳴門って、前の年に済々黌と戦った学校よね。"}, {"t": 556.7833333333333, "x": "そうだ。めぐり合わせで、また名前が出てくる。"}, {"t": 559.5333333333333, "x": "千葉本人は、出塁することが\n自分の仕事だと話していた。"}, {"t": 563.3666666666667, "x": "投手に多く投げさせれば、相手を\n疲れさせることができる、とも。"}, {"t": 567.3833333333333, "x": "小さい体で、できることを考えたのね。"}, {"t": 570.65, "x": "ところが、準々決勝の鳴門戦のあとだ。"}, {"t": 573.4833333333333, "x": "審判団が、花巻東の野球部長と監督を呼んだ。"}, {"t": 577.1333333333333, "x": "確かめたのは、「高校野球特別規則」の17項。"}, {"t": 580.6, "x": "バントの決まりだ。"}, {"t": 581.9166666666666, "x": "高校野球だけの決まりがあるの？"}, {"t": 584.0166666666667, "x": "ある。ふつうの野球の規則とは別に、\n高校野球のために決めてあるものだ。"}, {"t": 588.55, "x": "その中に、どんな打ち方を\n「バント」とみなすかが書いてある。"}, {"t": 592.4333333333333, "x": "ファウルを打つのと、バントに関係があるの？"}, {"t": 595.0166666666667, "x": "ここが分かれ目だ。"}, {"t": 596.1666666666666, "x": "2ストライクのあとにバントをして\nファウルになると、三振になる。"}, {"t": 599.9333333333333, "x": "スリーバント失敗、ね。"}, {"t": 601.6333333333333, "x": "そう。審判団は、球数を\n投げさせるためのカットを続けた場合、"}, {"t": 605.6666666666666, "x": "審判の判断でバントとみなされ、\n三振になることもある、と伝えた。"}, {"t": 610.1166666666667, "x": "じゃあ、もうあの打ち方はできないってこと？"}, {"t": 612.65, "x": "報道では、事実上の「封印」と書かれた。"}, {"t": 615.6166666666667, "x": "一方で日本高野連は、\n禁止はしていないと説明している。"}, {"t": 619.1666666666666, "x": "決まりを知っているか確かめ、紛らわしい\n打ち方に注意しただけだ、と。"}, {"t": 624.05, "x": "花巻東は準決勝で、宮崎の延岡学園と戦った。"}, {"t": 628.1666666666666, "x": "結果は0対2。決勝には届かなかった。"}, {"t": 630.9333333333333, "x": "千葉は試合のあと涙を流し、\n「野球人生の中で一番悔しい」と話した。"}, {"t": 635.8166666666667, "x": "自分の打ち方ができないまま、終わってしまったのね。"}, {"t": 639.05, "x": "この件は、大会のあとも大きな話題になった。"}, {"t": 641.9333333333333, "x": "日本高野連には、50件を超える\n抗議や問い合わせが寄せられた。"}, {"t": 645.75, "x": "ほとんどは、千葉を応援する声だったという。"}, {"t": 648.4, "x": "みんな、あの粘りが好きだったのね。"}, {"t": 650.75, "x": "ああ。準決勝の直前に伝えるのは\n遅い、という声もあった。"}, {"t": 654.55, "x": "高野連は「圧力などない」と答えている。"}, {"t": 657.2333333333333, "x": "ただ、ここで言いたいのは、\nどちらが正しいかではない。"}, {"t": 660.3166666666667, "x": "同じ1本のファウルでも、バントと\nみなされれば三振になる。"}, {"t": 663.7666666666667, "x": "どこからがバントか。その線を\n決めるのは、決まりと審判の判断だ。"}, {"t": 667.9833333333333, "x": "千葉は、その線のぎりぎりで\n戦っていた打者だった、ということだ。"}, {"t": 672.1, "x": "決まりの「境目」の話だったのね。"}, {"t": 674.85, "x": "千葉はその後、日本大学へ進んだ。"}, {"t": 677.25, "x": "大学でも打ち方を\n変えるつもりはなかったと話している。"}, {"t": 681.15, "x": "細かい決まりは、新しくできた決まりの中にもある。"}, {"t": 684.3833333333333, "x": "2018年に始まった、延長のタイブレークだ。"}, {"t": 687.6166666666667, "x": "甲子園で初めて使われたのは、2018年8月6日。"}, {"t": 691.5666666666667, "x": "夏の1回戦、長野の佐久長聖と、\n北北海道の旭川大高。"}, {"t": 696.0833333333334, "x": "延長13回は、両チームとも0点。"}, {"t": 698.6, "x": "14回表に佐久長聖が1点を取り、5対4で決着した。"}, {"t": 702.8, "x": "最初のタイブレークから、14回までいったのね。"}, {"t": 705.9, "x": "タイブレークは、0アウトで一塁と\n二塁に走者を置いて始める。"}, {"t": 709.4833333333333, "x": "打順は、前の回の続きからだ。"}, {"t": 711.8166666666667, "x": "その置かれた走者が帰ってきたら、\n投手の失点になるの？"}, {"t": 715.4666666666667, "x": "失点にはなる。ただ、投手の自責点にはしない。"}, {"t": 718.7666666666667, "x": "自責点って、投手の責任で取られた点のことよね。"}, {"t": 722.3, "x": "そうだ。始まったときの決まりでは、\nもう1つ細かい点がある。"}, {"t": 726.1333333333333, "x": "タイブレークに入った試合では、\n完全試合は認められない。"}, {"t": 729.6666666666666, "x": "最初から走者がいるんだものね。"}, {"t": 731.7333333333333, "x": "ただし、ヒットも点も許さない\nノーヒットノーランは認められる。"}, {"t": 735.3333333333334, "x": "打者の記録でも、置かれた\n走者は出塁の数に入らない。"}, {"t": 738.8833333333333, "x": "それでも、盗塁や得点はちゃんと記録される。"}, {"t": 741.8333333333334, "x": "同じ走者なのに、数えるものと\n数えないものがあるのね。"}, {"t": 745.3166666666667, "x": "ああ。決まりを1つ足すと、こういう\n細かい線引きも一緒に増える。"}, {"t": 749.8166666666667, "x": "高校野球の決まりって、昔からずっと同じなの？"}, {"t": 753.1166666666667, "x": "いや。今も少しずつ変わっている。"}, {"t": 755.25, "x": "延長戦は、2018年から\n延長13回のタイブレークが始まった。"}, {"t": 759.7833333333333, "x": "2023年からは、延長10回からに早まっている。"}, {"t": 763.35, "x": "このあたりは、前の回でくわしく話した。"}, {"t": 766.0833333333334, "x": "ランナーを置いて始めるやつね。"}, {"t": 767.9666666666667, "x": "投げる球の数にも決まりができた。"}, {"t": 770.1166666666667, "x": "1人の投手が投げられるのは、1週間で500球まで。"}, {"t": 773.55, "x": "2020年から2024年までは、試しに行う形だった。"}, {"t": 777.7666666666667, "x": "そして2025年1月。日本高野連は、"}, {"t": 780.8, "x": "これを「高校野球特別規則」に正式に入れた。"}, {"t": 784.3, "x": "さっきのバントの決まりと、同じところに入ったのね。"}, {"t": 787.6166666666667, "x": "ああ。決まりが変われば、新しい\n「盲点」も生まれるかもしれない。"}, {"t": 791.5333333333333, "x": "それを最初に見つけるのは、\nいつも決まりをよく読んだ人だ。"}, {"t": 795.6166666666667, "x": "結局、アウトを3つ取ったのに、\nどうして1点が入ったの？"}, {"t": 799.4333333333333, "x": "答えは、守る側より先に、決まりの数行を\n読んでいた人がいたからだ。"}, {"t": 803.7833333333333, "x": "中村は、小学生のころに漫画で\n読んだ1行を覚えていた。"}, {"t": 807.5, "x": "門馬監督の「走れ！」も、その数行を\n知っていたから出た声だった。"}, {"t": 811.95, "x": "守った側がうっかりしたというより、\n攻めた側が一歩早かったのね。"}, {"t": 816.0666666666667, "x": "ああ。そして2025年には、\n球数の決まりも正式に本に加わった。"}, {"t": 820.7166666666667, "x": "新しい1行が増えれば、まだ誰も\n気づいていない使い道も生まれる。"}, {"t": 824.8166666666667, "x": "次にスコアボードがざわつくのは、\nどの1行からかしらね。"}, {"t": 828.3666666666667, "x": "その1行に次に気づくのは、どこの高校の誰だろうな。"}, {"t": 831.9666666666667, "x": "見てくれて、ありがとう。またね。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
