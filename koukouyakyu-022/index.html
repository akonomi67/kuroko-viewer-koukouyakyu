<style>

<script>
const D={"name": "東邦", "file": "022_編集用", "dur": 952.31665625, "segs": [], "subs": [{"t": 0.0, "x": "2019年4月3日。甲子園球場。"}, {"t": 2.85, "x": "春のセンバツの決勝は、\n愛知の東邦と千葉の習志野だった。"}, {"t": 6.6, "x": "東邦は1回に3点を取った。"}, {"t": 8.45, "x": "エースが自分で2点本塁打を打っている。"}, {"t": 10.966666666666667, "x": "投げる人が、自分で打ったの？"}, {"t": 13.083333333333334, "x": "ああ。5回にもまた本塁打を打った。"}, {"t": 15.3, "x": "投げては9回を97球。"}, {"t": 17.1, "x": "打たれたヒットは3本だけだ。"}, {"t": 19.016666666666666, "x": "6対0。東邦の完封勝ちだった。"}, {"t": 21.633333333333333, "x": "ひとりで試合を決めちゃったのね。"}, {"t": 23.616666666666667, "x": "この大会は平成で最後のセンバツだった。"}, {"t": 26.233333333333334, "x": "そして30年前の1989年4月5日。"}, {"t": 29.883333333333333, "x": "平成で最初の甲子園の決勝に\n立っていたのも、東邦だった。"}, {"t": 33.85, "x": "えっ、最初と最後が同じ学校？"}, {"t": 36.18333333333333, "x": "そうだ。しかもこの優勝で、\n東邦のセンバツ優勝は5回目になった。"}, {"t": 40.4, "x": "これは大会の歴史でほかのどの学校よりも多い。"}, {"t": 43.88333333333333, "x": "どうして1つの学校が、平成の最初と\n最後の春を両方とれたの？"}, {"t": 48.13333333333333, "x": "それに5回の優勝って、いつ取ったのかしら。"}, {"t": 51.03333333333333, "x": "今回は東邦の歩みを、創立の年から順に辿る。"}, {"t": 54.4, "x": "1923年に名古屋で生まれた学校が、\n5本の紫紺の旗をどう集めたか。"}, {"t": 59.46666666666667, "x": "日付と点数をもとに見ていこう。"}, {"t": 61.46666666666667, "x": "本編の前に、よければ\nチャンネル登録と高評価で応援を頼む。"}, {"t": 65.98333333333333, "x": "東邦のはじまりは、1923年。大正12年だ。"}, {"t": 69.9, "x": "この年、東邦商業学校の設立が認められた。"}, {"t": 73.21666666666667, "x": "つくったのは下出民義。"}, {"t": 74.75, "x": "中部の財界の重鎮で、\n政治家としても活躍した人物だ。"}, {"t": 78.91666666666667, "x": "最初は商業の学校だったのね。"}, {"t": 81.15, "x": "ああ。5年制の甲種実業学校だった。"}, {"t": 83.8, "x": "最初の年は入学試験と入学式を\n同じ日に行ったと伝えられている。"}, {"t": 88.03333333333333, "x": "校舎もまだ無く、ほかの学校の教室を\n借りての出発だったという。"}, {"t": 92.31666666666666, "x": "ずいぶん急いだスタートね。"}, {"t": 94.01666666666667, "x": "学校がかかげた言葉は、「真に\n信頼して事を任せうる人格の育成」。"}, {"t": 98.51666666666667, "x": "今も学校の公式の案内にこの言葉が載っている。"}, {"t": 101.8, "x": "任せられる人を育てる、ってことね。"}, {"t": 104.25, "x": "1926年には、初代理事長の下出義雄が欧米を回った。"}, {"t": 108.61666666666666, "x": "イギリスの名門校を見て歩き。\nそれが学風のもとになったという。"}, {"t": 112.45, "x": "野球部ができたのは1930年とされている。"}, {"t": 115.7, "x": "まだ創立から7年くらいね。"}, {"t": 117.8, "x": "そうだ。そしてそこから\n4年で、いきなり全国の頂点に立つ。"}, {"t": 122.4, "x": "1934年の春。\n昭和9年の第11回選抜中等学校野球大会だ。"}, {"t": 127.95, "x": "当時の東邦は東邦商という名前で出ている。"}, {"t": 130.6, "x": "この大会が東邦商にとって\n初めての甲子園だったとされる。"}, {"t": 134.43333333333334, "x": "初めての甲子園で、どこまで行ったの？"}, {"t": 136.98333333333332, "x": "最初の試合は京都一商に3対0。"}, {"t": 139.46666666666667, "x": "準々決勝で兵庫の明石中に6対3。"}, {"t": 142.18333333333334, "x": "準決勝で和歌山の海南中に5対2。"}, {"t": 144.88333333333333, "x": "けっこう順調に勝ってるわね。"}, {"t": 146.78333333333333, "x": "決勝の相手は大阪の浪華商だった。"}, {"t": 149.21666666666667, "x": "点の取り合いにはならず、2対1。"}, {"t": 151.38333333333333, "x": "1点差で逃げ切って東邦商が優勝した。"}, {"t": 154.13333333333333, "x": "1点差の決勝で勝ったのね！"}, {"t": 156.15, "x": "これが愛知県勢として春の初めての優勝だった。"}, {"t": 159.3, "x": "創部から数えてまだ4年ほどの野球部だ。"}, {"t": 161.98333333333332, "x": "そんなに早く日本一になるなんて。"}, {"t": 164.4, "x": "4試合で取った点は、合わせて16点。"}, {"t": 166.85, "x": "取られた点は、6点だった。"}, {"t": 168.85, "x": "大差で勝った試合は無い。それでも、\n最後まで1度も負けなかった。"}, {"t": 172.98333333333332, "x": "派手じゃないけど、負けないチームだったのね。"}, {"t": 176.11666666666667, "x": "3年後の1937年。"}, {"t": 178.25, "x": "八事に学校の野球場ができた。"}, {"t": 180.48333333333332, "x": "運動部の活動がここから\n盛んになったと学校は記している。"}, {"t": 184.15, "x": "そして1938年の春。"}, {"t": 186.4, "x": "東邦商はまた甲子園に来た。"}, {"t": 188.4, "x": "ところが1回戦の京阪商との試合は、\n0対0のまま5回で日が暮れた。"}, {"t": 193.15, "x": "暗くなって、試合が続けられなかったの？"}, {"t": 195.91666666666666, "x": "そうだ。引き分けで、もう一度やり直しになった。"}, {"t": 198.95, "x": "その再試合は11対5で勝った。"}, {"t": 201.13333333333333, "x": "2回戦は京都の平安中に13対5だ。"}, {"t": 203.9, "x": "準々決勝では、あの浪華商に5対3で勝った。"}, {"t": 207.11666666666667, "x": "準決勝は岐阜商に6対2。\nこうして2度目の決勝に進んだ。"}, {"t": 211.2, "x": "2回目の優勝？"}, {"t": 212.48333333333332, "x": "いや。相手は同じ愛知の中京商だった。"}, {"t": 215.1, "x": "結果は0対1。今度は1点差で負けた。"}, {"t": 218.01666666666668, "x": "4年前とは逆の1点差ね。"}, {"t": 220.05, "x": "ところが翌年の1939年。ここで\n東邦商の打線が爆発する。"}, {"t": 224.9, "x": "1回戦の相手は、5年前の決勝で戦った浪華商だった。"}, {"t": 228.85, "x": "この試合が20対1。"}, {"t": 230.51666666666668, "x": "20点？　決勝の相手だった学校から？"}, {"t": 233.23333333333332, "x": "ああ。続く海南中には13対0。"}, {"t": 235.58333333333334, "x": "兵庫の北神商にも13対1。"}, {"t": 237.9, "x": "準決勝は静岡の島田商に6対1だ。"}, {"t": 240.68333333333334, "x": "決勝の相手は岐阜商。"}, {"t": 242.05, "x": "5回と7回に3点ずつ入れて7対2で勝った。"}, {"t": 245.33333333333334, "x": "前の年に1点差で負けて、次の年は大勝ちね。"}, {"t": 248.61666666666667, "x": "5試合で取った点は59点。"}, {"t": 250.45, "x": "取られた点は5点だけだった。"}, {"t": 252.36666666666667, "x": "ヒットは73本。どちらも当時の大会で\n一番多い数字だったと伝えられている。"}, {"t": 257.5, "x": "1試合に10点以上取ってた計算ね。"}, {"t": 260.03333333333336, "x": "これで東邦商は、春の優勝が2回になった。"}, {"t": 263.01666666666665, "x": "1934年から1939年までの6年で、\n春の決勝に3回も進んだことになる。"}, {"t": 269.6666666666667, "x": "毎年のように、決勝にいたのね。"}, {"t": 272.48333333333335, "x": "2年後の1941年3月。"}, {"t": 274.95, "x": "第18回の大会だ。"}, {"t": 276.6666666666667, "x": "東邦商は初戦で和歌山の海草中に2対1で勝った。"}, {"t": 280.28333333333336, "x": "また1点差なのね。"}, {"t": 281.75, "x": "準々決勝で海南中に5対2。"}, {"t": 283.8666666666667, "x": "準決勝で熊本工に5対4。"}, {"t": 286.05, "x": "ここも1点差だ。"}, {"t": 287.4, "x": "ひやひやする勝ち方ばかりね。"}, {"t": 289.4, "x": "決勝の相手は一宮中。"}, {"t": 291.06666666666666, "x": "同じ愛知の学校だった。"}, {"t": 292.93333333333334, "x": "愛知の学校どうしの決勝？"}, {"t": 294.81666666666666, "x": "そうだ。春の決勝に、愛知の学校が2つ並んだ。"}, {"t": 298.28333333333336, "x": "東邦商は1回に4点を取った。"}, {"t": 300.45, "x": "そのまま5対2で逃げ切り、3回目の優勝を決めた。"}, {"t": 303.71666666666664, "x": "この大会が戦争の前の最後のセンバツになった。"}, {"t": 306.8, "x": "同じ年の夏の大会は\n軍の輸送の都合で中止になっている。"}, {"t": 310.6333333333333, "x": "その後、しばらく野球ができなかったのね。"}, {"t": 313.35, "x": "ああ。春の大会がまた開かれたのは\n戦争が終わってからだ。"}, {"t": 316.96666666666664, "x": "4試合で取った点は17点、取られた点は9点だった。"}, {"t": 320.5833333333333, "x": "2年前の59点とは、まるでちがう勝ち方だ。"}, {"t": 323.75, "x": "つまり東邦商は8年で3回も春を制した。"}, {"t": 326.71666666666664, "x": "ただ、4回目の旗までは長い道のりになる。"}, {"t": 330.26666666666665, "x": "1948年。新しい学校の制度ができて、\n名前が東邦高等学校に変わった。"}, {"t": 336.1333333333333, "x": "ここで「商」がとれたのね。"}, {"t": 338.1666666666667, "x": "そうだ。ただし商業科はこのあとも長く残っている。"}, {"t": 341.31666666666666, "x": "そして1967年。1人の若い\n先生が母校の東邦に戻ってきた。"}, {"t": 346.31666666666666, "x": "のちに長く監督を務める阪口慶三だ。"}, {"t": 349.1666666666667, "x": "阪口は東邦の選手だったころ、投手と\n一塁手として甲子園に出ている。"}, {"t": 353.73333333333335, "x": "そのときは中京に敗れていた。"}, {"t": 355.8333333333333, "x": "選手のときに負けた相手なのね。"}, {"t": 358.0, "x": "先生として戻った阪口は、自分の役目を\n野球部のコーチだと思っていた。"}, {"t": 362.6166666666667, "x": "ところが4月1日に学校へ行くと\n校長にこう言われたという。"}, {"t": 366.2, "x": "「今日から監督をやってくれ。"}, {"t": 367.75, "x": "今のままでは中京を破ることはできん」。"}, {"t": 370.23333333333335, "x": "いきなり監督なの？"}, {"t": 371.71666666666664, "x": "ああ。しかも就任して\nすぐの春の県大会は、1回戦で負けている。"}, {"t": 376.1666666666667, "x": "最初からうまくいったわけじゃないのね。"}, {"t": 378.43333333333334, "x": "厳しい練習で知られ、「鬼の阪口」と\n呼ばれた時代だった。"}, {"t": 382.2, "x": "1971年、学校は赤萩町から\n今の名東区平和が丘へ移った。"}, {"t": 387.2, "x": "同じ年には、東郷町に\n2つ目の校地として野球場もつくられた。"}, {"t": 391.51666666666665, "x": "練習の場所が広くなったのね。"}, {"t": 393.6666666666667, "x": "実はこの平和が丘には、1958年に\nもう総合グラウンドができていた。"}, {"t": 398.6, "x": "学校はそのグラウンドのある\n土地へ、まるごと引っ越した形だ。"}, {"t": 402.31666666666666, "x": "1985年には男女共学が始まった。"}, {"t": 405.4, "x": "商業の男子校から、学校の形も少しずつ変わっていく。"}, {"t": 409.9166666666667, "x": "1977年の夏。東邦は夏の甲子園で決勝まで進んだ。"}, {"t": 414.56666666666666, "x": "マウンドにいたのは細い体の1年生投手だった。"}, {"t": 417.68333333333334, "x": "その姿から「バンビ」と呼ばれて人気を集めた。"}, {"t": 420.95, "x": "1年生で決勝のマウンドなの？"}, {"t": 423.1, "x": "ああ。決勝の相手は兵庫の東洋大姫路だ。"}, {"t": 425.9, "x": "東邦が2回に1点を取り、4回に追いつかれた。"}, {"t": 429.01666666666665, "x": "1対1のまま延長に入った。"}, {"t": 431.06666666666666, "x": "10回の裏。東洋大姫路の4番が、\nサヨナラの3点本塁打を打った。"}, {"t": 435.73333333333335, "x": "決勝でサヨナラ本塁打？"}, {"t": 437.5, "x": "甲子園の決勝でサヨナラ本塁打が\n出たのは、これが初めてだったとされる。"}, {"t": 441.9, "x": "東邦は1対4で準優勝。"}, {"t": 443.65, "x": "夏の最高の成績は、今もこのときの準優勝だ。"}, {"t": 447.23333333333335, "x": "春に強くて、夏はあと一歩だったのね。"}, {"t": 450.48333333333335, "x": "1988年の春。東邦はセンバツの決勝に進んだ。"}, {"t": 454.7, "x": "4つ勝って、決勝の相手は愛媛の宇和島東だった。"}, {"t": 458.1666666666667, "x": "結果は0対6。2回に2点、5回に4点を取られた。"}, {"t": 461.98333333333335, "x": "決勝で完封されちゃったのね。"}, {"t": 464.03333333333336, "x": "宇和島東にとっても、愛媛に\nとっても大きな初優勝だった。"}, {"t": 467.95, "x": "東邦の旗は1941年から数えて\nもう47年も届いていなかった。"}, {"t": 473.01666666666665, "x": "そして翌年の1989年。"}, {"t": 475.43333333333334, "x": "年が明けてすぐ、元号が平成に変わった。"}, {"t": 478.35, "x": "最初に話してくれた、平成最初の春ね。"}, {"t": 481.3666666666667, "x": "そうだ。東邦は前の年の準優勝校として、\nまたこの春に戻ってきた。"}, {"t": 485.98333333333335, "x": "1回戦は大分の別府羽室台に6対0。"}, {"t": 488.8666666666667, "x": "2回戦は兵庫の報徳学園に3対0。"}, {"t": 491.6166666666667, "x": "準々決勝は大阪の近大付に3対2。"}, {"t": 494.21666666666664, "x": "延長10回のサヨナラ勝ちだ。"}, {"t": 496.21666666666664, "x": "準決勝は京都西に4対2だった。"}, {"t": 498.76666666666665, "x": "2年続けて決勝ね。"}, {"t": 500.45, "x": "ここまでの4試合で、取られた点は4点だけだった。"}, {"t": 503.65, "x": "完封が2つ、ほかの2つも2点に抑えている。"}, {"t": 506.8833333333333, "x": "守りで勝ち上がったのね。"}, {"t": 508.55, "x": "4月5日の決勝。相手は大阪の上宮だった。"}, {"t": 511.8, "x": "東邦が勝てば4度目の優勝。"}, {"t": 513.5666666666667, "x": "上宮が勝てば初めての優勝だ。"}, {"t": 515.85, "x": "この大会は平成になって初めての甲子園で、\nこれがその最後の試合だった。"}, {"t": 520.4833333333333, "x": "先発は東邦の左腕エースと、上宮の2年生エース。"}, {"t": 523.9666666666667, "x": "5回に1点ずつ取り合い、1対1のまま延長に入った。"}, {"t": 528.1666666666666, "x": "10回の表。上宮が2アウト一、二塁から\nタイムリーで1点を勝ち越した。"}, {"t": 533.0666666666667, "x": "あと1回守られたら終わりね。"}, {"t": 535.0166666666667, "x": "10回の裏、東邦は先頭が出た。"}, {"t": 537.3333333333334, "x": "ところが次の攻めが併殺になり、2\nアウトでランナーがいなくなった。"}, {"t": 541.4, "x": "もう、ほとんど負けじゃない。"}, {"t": 543.1, "x": "上宮は初めての優勝まであと1人だった。"}, {"t": 545.9, "x": "ここから東邦は四球で1人出た。"}, {"t": 547.9, "x": "三遊間の内野安打で一、二塁になった。"}, {"t": 550.6833333333333, "x": "次の打者がセンター前に打ち、\n二塁の走者がかえって2対2の同点だ。"}, {"t": 555.05, "x": "追いついた！"}, {"t": 555.95, "x": "そのあと、ボールが2度3度それる\n間に、もう1人が本塁へかえった。"}, {"t": 560.1166666666667, "x": "3対2。東邦の逆転サヨナラ勝ちだ。"}, {"t": 562.75, "x": "あと1人の場面から決着までわずか\n27秒だったと書かれている。"}, {"t": 566.9833333333333, "x": "27秒で、全部ひっくり返ったのね。"}, {"t": 569.7666666666667, "x": "これが東邦の4回目の春の優勝だった。"}, {"t": 572.4166666666666, "x": "1941年から48年ぶり。"}, {"t": 575.1166666666667, "x": "阪口が監督になってから、22年後の春だ。"}, {"t": 578.6, "x": "校長に「今日から監督」と\n言われた人が、ここで日本一ね。"}, {"t": 582.8166666666667, "x": "前の年に0対6で負けた決勝から、1年後の春だった。"}, {"t": 587.35, "x": "この頃阪口のそばにはもう1人の指導者がいた。"}, {"t": 590.4333333333333, "x": "1983年にコーチになった、森田泰弘だ。"}, {"t": 594.1333333333333, "x": "2004年。森田は阪口から監督の役目を引き継いだ。"}, {"t": 597.9166666666666, "x": "21年もコーチをやってからの監督ね。"}, {"t": 600.6666666666666, "x": "阪口はそのあと、岐阜の大垣日大で監督を続けた。"}, {"t": 604.35, "x": "大垣日大では就任3年目に、\nセンバツで準優勝まで進んでいる。"}, {"t": 608.6666666666666, "x": "東邦の時代の厳しさから、叱るより褒める\n指導に変えたと本人が語っている。"}, {"t": 613.5833333333334, "x": "「鬼の阪口」が変わったのね。"}, {"t": 615.75, "x": "2つの学校で甲子園に出たのは35回。"}, {"t": 618.4333333333333, "x": "勝ち星は40になった。"}, {"t": 620.1333333333333, "x": "そして2023年のシーズン限りで、\n監督の仕事を退いた。"}, {"t": 624.3, "x": "一方で東邦の学校にも大きな変化があった。"}, {"t": 627.1333333333333, "x": "2017年3月。東邦の商業科がなくなった。"}, {"t": 630.6833333333333, "x": "東邦商として旗を3本とった\n学校から、商業科が消えたの？"}, {"t": 634.8166666666667, "x": "そうだ。1923年に商業学校として\n生まれてから、94年後のことだった。"}, {"t": 641.0333333333333, "x": "その2年後の2019年春。"}, {"t": 643.0166666666667, "x": "平成最後のセンバツだ。"}, {"t": 644.7, "x": "東邦は1回戦で、徳島の富岡西に3対1。"}, {"t": 648.15, "x": "2回戦は広島の広陵に12対2。"}, {"t": 650.4666666666667, "x": "準々決勝は福岡の筑陽学園に7対2。"}, {"t": 653.6333333333333, "x": "準決勝は兵庫の明石商に4対2で勝った。"}, {"t": 656.5, "x": "この試合は2年生の3点本塁打で勝ち越している。"}, {"t": 659.7666666666667, "x": "30年ぶりの決勝ね。"}, {"t": 661.55, "x": "ここまでの4試合で、取った点は\n26点、取られた点は7点だ。"}, {"t": 665.7833333333333, "x": "決勝の相手の習志野は、千葉県勢で\n初めての春の優勝をねらっていた。"}, {"t": 670.35, "x": "どっちが勝っても、記録に残る決勝だったのね。"}, {"t": 673.5166666666667, "x": "そして冒頭の4月3日。"}, {"t": 675.15, "x": "習志野に6対0だ。"}, {"t": 676.8, "x": "1回に3点、5回に2点、8回に1点。"}, {"t": 679.6333333333333, "x": "相手には1点も与えなかった。"}, {"t": 681.65, "x": "エースは4打数3安打、本塁打2本で4打点だった。"}, {"t": 685.2666666666667, "x": "投げても打っても、エースが主役ね。"}, {"t": 687.5666666666667, "x": "この優勝で東邦の春の優勝は5回になった。"}, {"t": 690.4833333333333, "x": "それまで並んでいた中京大中京の4回を抜いて、\nひとりだけの最多だ。"}, {"t": 694.9333333333333, "x": "センバツでの勝ち星もこのとき\n56勝目で大会の一番になった。"}, {"t": 699.2, "x": "平成の最初と最後に、同じ学校が\n旗を持って帰ったのね。"}, {"t": 703.1666666666666, "x": "学校の公式の年表にも、\nこの優勝は1行で記されている。"}, {"t": 707.1, "x": "2019年4月、硬式野球部が\n5度目の優勝、とだけ書かれているんだ。"}, {"t": 711.9666666666667, "x": "短いけど、重たい1行ね。"}, {"t": 714.1, "x": "ああ。1989年と2019年。"}, {"t": 716.9666666666667, "x": "間は、ちょうど30年だった。"}, {"t": 719.7166666666667, "x": "2020年4月。東邦の監督は若いOBに代わった。"}, {"t": 723.4333333333333, "x": "当時29歳。2008年の夏に\n捕手として甲子園に出た人だ。"}, {"t": 727.95, "x": "自分も東邦で甲子園に出た人なのね。"}, {"t": 730.6166666666667, "x": "2016年にコーチとして母校に\n戻り、森田のもとで学んでいた。"}, {"t": 734.7666666666667, "x": "その前の年の秋。東邦は東海大会の決勝で、\n静岡の常葉大菊川に7対2で勝った。"}, {"t": 740.8666666666667, "x": "東海大会の優勝は4年ぶり12回目だった。"}, {"t": 743.8666666666667, "x": "2023年。学校は創立100周年を迎えた。"}, {"t": 747.3, "x": "同じ年の春、東邦は\n4年ぶり31度目のセンバツに選ばれている。"}, {"t": 751.6166666666667, "x": "1回戦は鳥取城北に6対3。これが若い監督に\nとって、甲子園での初めての勝ち星だった。"}, {"t": 757.9333333333333, "x": "続いて香川の高松商にも勝ち、ベスト16まで進んだ。"}, {"t": 761.9, "x": "100周年の春に、新しい監督が初勝利ね。"}, {"t": 765.1, "x": "31回も春に出てるの？"}, {"t": 767.1, "x": "ああ。夏の甲子園は17回だから春の方がずっと多い。"}, {"t": 770.6, "x": "2026年春の大会の前の時点で\nセンバツの勝ち星は58勝。"}, {"t": 775.1, "x": "同じ愛知の中京大中京と並んで\n大会の歴史の最多だった。"}, {"t": 779.2166666666667, "x": "優勝の数も勝ち星も、春は\n東邦がずっと上の方にいるのね。"}, {"t": 783.2666666666667, "x": "ただ2026年の夏は、愛知大会の準々決勝で\n星城に2対5で敗れた。"}, {"t": 788.4333333333333, "x": "2021年には人工芝のグラウンドもできた。"}, {"t": 791.5, "x": "学校のほうは2025年に世界探究科ができた。"}, {"t": 794.7, "x": "商業学校の時代とは、もう別の顔だ。"}, {"t": 797.5833333333334, "x": "野球部も学校も、いつも同じではいられないのね。"}, {"t": 801.2166666666667, "x": "最初の問いに戻るわ。"}, {"t": 802.5, "x": "どうして平成の最初と最後を両方とれたの？"}, {"t": 805.3833333333333, "x": "はっきりした答えは記録には残っていない。\nただ並べると見えることがある。"}, {"t": 809.5833333333334, "x": "5回の優勝の年は、1934年、1939年、\n1941年、1989年、2019年だ。"}, {"t": 818.5833333333334, "x": "間は5年、2年、48年、30年。"}, {"t": 821.8, "x": "前の3回は近いのに、\nあとの2回はすごく離れてるわね。"}, {"t": 825.5166666666667, "x": "そうだ。もう1つ、気になる並びがある。"}, {"t": 828.1, "x": "1939年の優勝の前の年。"}, {"t": 830.7333333333333, "x": "1938年の決勝で、東邦商は0対1で負けていた。"}, {"t": 835.1666666666666, "x": "1989年の優勝の前の年。"}, {"t": 837.85, "x": "1988年の決勝では、0対6で負けていた。"}, {"t": 841.9666666666667, "x": "どっちも、決勝で負けた次の年に勝ってるのね。"}, {"t": 845.1833333333333, "x": "ああ。負けた決勝の悔しさが、\n次の春の力になったのではないか。"}, {"t": 849.4333333333333, "x": "ただそれを選手たちがどう感じていたかは、\n記録だけでは分からない。"}, {"t": 853.3, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
