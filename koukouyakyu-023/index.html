<script>
const D={"name": "岡山東商", "file": "023_編集用", "dur": 993.9, "segs": [], "subs": [{"t": 0.0, "x": "1965年4月4日。"}, {"t": 2.1333333333333333, "x": "兵庫県の甲子園球場。"}, {"t": 3.8833333333333333, "x": "春のセンバツ大会の決勝は\n延長13回の裏に入っていた。"}, {"t": 7.75, "x": "点は1対1。守るのは和歌山の市和歌山商だ。"}, {"t": 11.033333333333333, "x": "攻めるのは岡山の岡山東商だった。"}, {"t": 13.733333333333333, "x": "13回まで1対1って、ずっと投手戦だったのね。"}, {"t": 17.266666666666666, "x": "記録によると、この回の先頭の宮崎がヒットで出た。"}, {"t": 20.7, "x": "次の青井が送りバントで、宮崎を2塁へ進めた。"}, {"t": 23.916666666666668, "x": "そして中島の打球がセンターの前に落ちた。"}, {"t": 26.666666666666668, "x": "2塁から宮崎が本塁へ走り込む。"}, {"t": 28.966666666666665, "x": "サヨナラ勝ちだった。"}, {"t": 30.383333333333333, "x": "岡山東商の優勝ね！"}, {"t": 32.31666666666667, "x": "ああ。そしてこの1勝である数字が残った。"}, {"t": 34.983333333333334, "x": "5試合、49回を投げて、取られた点はたった1点だ。"}, {"t": 38.733333333333334, "x": "投げたのは全部同じ1人の投手だった。"}, {"t": 41.36666666666667, "x": "49回で1点だけ？"}, {"t": 43.13333333333333, "x": "いったいどうしたらそんな数字になるの？"}, {"t": 45.916666666666664, "x": "今回は岡山東商。正式な名前は、\n岡山県立岡山東商業高校だ。"}, {"t": 51.38333333333333, "x": "地元では「東商」とも呼ばれている。"}, {"t": 54.06666666666667, "x": "公立の商業の学校なのね。"}, {"t": 56.15, "x": "そうだ。そして岡山県の学校が甲子園で\n優勝したのは、春と夏を合わせてもこの1回しかない。"}, {"t": 62.266666666666666, "x": "2026年の夏の大会まで数えても\nそれは変わっていない。"}, {"t": 66.18333333333334, "x": "60年以上もたった1回なの？"}, {"t": 68.4, "x": "今回は、その1回を5つの試合に\n分けて、点数と記録で辿っていく。"}, {"t": 72.95, "x": "本編の前にチャンネル登録と\n高評価をしてもらえるとうれしい。"}, {"t": 76.5, "x": "では学校が生まれたところから始めよう。"}, {"t": 79.51666666666667, "x": "始まりは1898年。明治31年だ。"}, {"t": 83.13333333333334, "x": "岡山県商業学校として作られ、\n10月18日に開校式が開かれた。"}, {"t": 88.2, "x": "最初の校舎は岡山市の岡山寺。\nお寺を仮の校舎にしていた。"}, {"t": 92.4, "x": "お寺で授業をしていたのね。"}, {"t": 94.2, "x": "名前はそのあと何度も変わった。"}, {"t": 96.15, "x": "1901年には岡山県立商業学校。"}, {"t": 99.18333333333334, "x": "1922年には今の場所にあたる門田の校舎へ移った。"}, {"t": 103.06666666666666, "x": "1928年には第一岡山商業学校になり、\n第二岡山商業学校も並べて置かれた。"}, {"t": 109.35, "x": "第一と第二があったの？"}, {"t": 111.03333333333333, "x": "ああ。ちなみに1926年と1927年には、\nバレーボールの全国大会で2年続けて優勝している。"}, {"t": 118.36666666666666, "x": "野球より先にバレーで日本一だったのね。"}, {"t": 121.11666666666666, "x": "そして1945年6月29日。"}, {"t": 123.96666666666667, "x": "岡山空襲で校舎がすべて焼けた。"}, {"t": 126.4, "x": "学校が丸ごと燃えてしまったの？"}, {"t": 128.56666666666666, "x": "そうだ。翌年にはバラックの校舎を\n建てて、学校を続けている。"}, {"t": 132.53333333333333, "x": "1948年の学制改革で、第一と\n第二は別々の高校になった。"}, {"t": 137.73333333333332, "x": "そして1949年に1つにまとまり、\n岡山県立岡山東高校になる。"}, {"t": 143.31666666666666, "x": "「商業」が名前から消えたのね。"}, {"t": 145.48333333333332, "x": "そうだ。今の「岡山東商業」になったのは\n1953年のことだ。"}, {"t": 150.56666666666666, "x": "その間の1951年の夏、この学校は\n「岡山東」として初めて甲子園に出た。"}, {"t": 156.76666666666668, "x": "1回戦の相手は香川の高松一。"}, {"t": 159.0, "x": "3対12で敗れている。"}, {"t": 160.66666666666666, "x": "この年の10月27日には、今の校歌と校旗が決まった。"}, {"t": 164.68333333333334, "x": "1953年に今の名前になると、\n翌年の春にはセンバツに初めて出た。"}, {"t": 169.8, "x": "大阪の泉陽に1対6。ここも初戦で敗れている。"}, {"t": 173.1, "x": "同じ1954年の11月には、\n倉敷商との定期戦が始まった。"}, {"t": 178.16666666666666, "x": "倉敷商とはそのころからのライバルなのね。"}, {"t": 180.9, "x": "1959年には校舎がすべて鉄筋に建て替えられた。"}, {"t": 184.7, "x": "空襲で焼けてから14年後のことだ。"}, {"t": 187.63333333333333, "x": "この「岡山東」の時代に、1組のバッテリーがいた。"}, {"t": 191.31666666666666, "x": "投手の秋山登と捕手の土井淳だ。"}, {"t": 193.96666666666667, "x": "名前を聞いたことがあるわ。"}, {"t": 195.63333333333333, "x": "2人は高校から一緒にバッテリーを\n組み、そろって明治大学へ進んだ。"}, {"t": 199.86666666666667, "x": "そしてプロ野球でも、そろって\n大洋ホエールズに入った。"}, {"t": 203.31666666666666, "x": "高校からプロまでずっと同じ組なの？"}, {"t": 205.73333333333332, "x": "ああ。土井はプロの1年目から正捕手になった。"}, {"t": 208.56666666666666, "x": "1960年には、選手とコーチを兼ねて投手陣をまとめた。"}, {"t": 212.75, "x": "その年、大洋は初めてリーグで\n優勝し、日本一にもなった。"}, {"t": 216.78333333333333, "x": "秋山はプロで通算193勝。\nのちに野球殿堂に入っている。"}, {"t": 221.18333333333334, "x": "岡山の公立校からプロの大投手が出ていたのね。"}, {"t": 224.43333333333334, "x": "そうだ。そしてこの「岡山東商から大洋へ」という\n道は、ここで終わらない。"}, {"t": 229.41666666666666, "x": "それはもう少しあとで話そう。"}, {"t": 231.88333333333333, "x": "1963年。岡山東商は、春と夏の甲子園に続けて出た。"}, {"t": 236.93333333333334, "x": "春は1回戦で、東京の早稲田実に3対5で敗れた。"}, {"t": 240.51666666666668, "x": "夏は茨城の水戸工に2対1、\n秋田の能代に5対1で勝った。"}, {"t": 244.6, "x": "3回戦で熊本の九州学院に0対1。ここで止まっている。"}, {"t": 248.81666666666666, "x": "1点差で負けたのね。"}, {"t": 250.36666666666667, "x": "この1963年の4月に、1人の1年生が入ってきた。"}, {"t": 254.83333333333334, "x": "岡山県の高梁町。今の高梁市で\n生まれた、平松政次だ。"}, {"t": 259.35, "x": "その人が49回で1点の投手？"}, {"t": 262.01666666666665, "x": "そうだ。1947年の9月生まれ。"}, {"t": 264.81666666666666, "x": "地元の高梁中学校を出て、岡山の町の東商へ来た。"}, {"t": 268.9166666666667, "x": "同じ学年の岡山の高校には、\nほかにもいい投手がそろっていた。"}, {"t": 272.9166666666667, "x": "倉敷商の松岡弘。そしてもう1人、森安敏明。"}, {"t": 276.85, "x": "平松と合わせた3人は「岡山三羽がらす」と呼ばれた。"}, {"t": 280.6, "x": "倉敷商には同じ学年の星野仙一もいた。"}, {"t": 283.75, "x": "同じ県の同じ学年にそんなにいたの？"}, {"t": 286.31666666666666, "x": "ああ。2人とも、のちにプロで\n長く投げる投手になった。"}, {"t": 289.78333333333336, "x": "監督は向井。のちに春と夏で12回、\nチームを甲子園へ連れていった人だ。"}, {"t": 294.56666666666666, "x": "優勝の前の年の1964年6月には、\n学校に翠光寮ができた。"}, {"t": 299.6, "x": "食堂と合宿所をかねた建物だった。"}, {"t": 302.8, "x": "1965年の春。第37回のセンバツ大会が始まった。"}, {"t": 307.5, "x": "平松は3年生になっていた。"}, {"t": 309.55, "x": "1回戦の相手は、沖縄のコザ高校だ。"}, {"t": 312.4, "x": "沖縄から来た学校ね。"}, {"t": 314.15, "x": "このころの沖縄は、まだ日本に戻る前だった。"}, {"t": 317.1333333333333, "x": "コザの選手たちは船で沖縄を出て、鹿児島から\n兵庫まで列車で来たと伝えられている。"}, {"t": 322.3833333333333, "x": "それは長い旅ね。"}, {"t": 323.76666666666665, "x": "試合は7対0。平松はコザを3安打に抑えた。"}, {"t": 327.0833333333333, "x": "まず1つ目の完封だ。"}, {"t": 328.8, "x": "まずは9回、0点ね。"}, {"t": 331.1, "x": "2回戦の相手は東京の明治高校だった。"}, {"t": 333.81666666666666, "x": "明治の投手は今井。こちらも点をやらない。"}, {"t": 336.4, "x": "0対0のまま、試合は9回の裏に入った。"}, {"t": 339.4166666666667, "x": "最後は9回の裏、岡山東商が\n1点を取ってサヨナラ勝ち。"}, {"t": 343.56666666666666, "x": "また最後の1点で勝ったのね。"}, {"t": 345.6, "x": "この試合にはもう1つ記録がある。"}, {"t": 347.71666666666664, "x": "両チームとも、四球を1つも出さなかった。"}, {"t": 350.5, "x": "平松と今井の2人で、無四球の試合になったんだ。"}, {"t": 353.9, "x": "フォアボールなしの1対0なんてすごく締まった試合ね。"}, {"t": 357.0833333333333, "x": "これで18回、0点だ。"}, {"t": 359.55, "x": "準々決勝は静岡県の静岡高校。"}, {"t": 362.2, "x": "平松は3安打、9奪三振で投げ切った。"}, {"t": 365.21666666666664, "x": "3対0。3つ目の完封だ。"}, {"t": 367.48333333333335, "x": "27回、0点ね。"}, {"t": 369.3, "x": "準決勝は徳島の徳島商だった。"}, {"t": 371.8, "x": "この試合も、取った点は1点だけだ。"}, {"t": 374.21666666666664, "x": "平松は5安打8奪三振。"}, {"t": 376.0833333333333, "x": "1対0で4つ目の完封になった。"}, {"t": 378.5833333333333, "x": "1点しか取ってないのにまた勝ったの？"}, {"t": 380.96666666666664, "x": "ああ。4試合で岡山東商が取った点は、全部で12点。"}, {"t": 384.8666666666667, "x": "そのうち2試合は1対0の勝ちだった。"}, {"t": 387.28333333333336, "x": "点を取るより、まず点をやらない。\nそういう勝ち方だった。"}, {"t": 390.76666666666665, "x": "これで36回、0点のまま決勝なのね。"}, {"t": 393.81666666666666, "x": "同じ大会では、高知が1試合32安打という\n大会の記録を作っている。"}, {"t": 398.53333333333336, "x": "よく打つチームもいた大会で、\n岡山東商は守って勝ち上がった。"}, {"t": 403.21666666666664, "x": "決勝の相手は和歌山の市和歌山商だった。"}, {"t": 405.98333333333335, "x": "この大会で目立っていた打者がいた。3番の藤田平だ。"}, {"t": 409.73333333333335, "x": "のちに阪神に入った人よね？"}, {"t": 411.8666666666667, "x": "そうだ。藤田は2回戦の中京商戦で、\n1試合に2本のホームランを打った。"}, {"t": 416.7, "x": "センバツで1人が1試合2本打ったのは、\nこれが初めてだったと記録されている。"}, {"t": 421.3666666666667, "x": "この大会の通算20塁打も当時の新しい記録だった。"}, {"t": 425.05, "x": "0点の投手と打ちまくる打者の対決ね。"}, {"t": 427.8, "x": "先に点を取ったのは岡山東商だ。"}, {"t": 430.15, "x": "3回の裏に1点を入れた。"}, {"t": 431.98333333333335, "x": "ところが4回の表。市和歌山商に\n3本の連打が出て、1対1に追いつかれた。"}, {"t": 437.26666666666665, "x": "ついに点を取られたのね。"}, {"t": 438.93333333333334, "x": "ああ。平松の連続無失点は、ここで39回で止まった。"}, {"t": 442.93333333333334, "x": "それでも試合はそこから9回が過ぎても動かなかった。"}, {"t": 446.2, "x": "10回、11回、12回と0が続いた。"}, {"t": 449.1666666666667, "x": "そして13回の裏が冒頭の場面だ。"}, {"t": 451.75, "x": "宮崎が走ってサヨナラね。"}, {"t": 453.7, "x": "そうだ。2対1。岡山東商に\nとって、初めての日本一だった。"}, {"t": 458.3333333333333, "x": "藤田は、この決勝で平松から\n2本のヒットを打ったと伝えられている。"}, {"t": 462.6, "x": "2人はのちに、阪神と大洋でもう\n一度向かい合うことになる。"}, {"t": 466.9166666666667, "x": "ねえ、49回で1点って、どう数えたの？"}, {"t": 470.03333333333336, "x": "1回戦から準決勝までの4試合が、9回ずつで36回。"}, {"t": 474.15, "x": "決勝が13回。足して49回だ。"}, {"t": 476.8666666666667, "x": "取られた点は決勝の4回の1点だけ。"}, {"t": 479.4166666666667, "x": "5試合とも平松が最後まで1人で投げている。"}, {"t": 482.4166666666667, "x": "39回はどこから来るの？"}, {"t": 484.45, "x": "36回に、決勝の1回から3回までを足すと39回だ。"}, {"t": 488.75, "x": "この39回の連続無失点は大会の記録になった。"}, {"t": 492.3833333333333, "x": "平松の故郷の高梁市は、今も\n破られていない記録だと紹介している。"}, {"t": 497.01666666666665, "x": "取った点のほうは？"}, {"t": 498.3333333333333, "x": "7点、1点、3点、1点、2点。"}, {"t": 500.93333333333334, "x": "5試合で14点だ。"}, {"t": 502.4, "x": "5試合のうち3試合は1点差の勝ちだった。"}, {"t": 505.2, "x": "打って勝つチームとはまるで逆の数字ね。"}, {"t": 508.15, "x": "ここでこのころのセンバツの優勝校を並べてみよう。"}, {"t": 511.0833333333333, "x": "1963年は山口の下関商。"}, {"t": 514.1666666666666, "x": "1964年は徳島の徳島海南。"}, {"t": 517.2166666666667, "x": "そして1965年が岡山東商だ。"}, {"t": 520.4666666666667, "x": "3年続けて、中国と四国の学校なのね。"}, {"t": 523.6666666666666, "x": "ああ。3校とも公立の学校だ。"}, {"t": 525.9, "x": "そのあとも1967年は大分の津久見、\n1968年は埼玉の大宮工が勝っている。"}, {"t": 532.4666666666667, "x": "公立の学校が春に次々と勝っていた時代なのね。"}, {"t": 535.9166666666666, "x": "そうだ。その中でも岡山東商の優勝は、\n岡山県にとって特別な1回になった。"}, {"t": 541.5166666666667, "x": "2022年には、\nNHKの朝の連続テレビ小説の中のニュースとして、\nこの優勝が流れている。"}, {"t": 547.95, "x": "ドラマの中に出てくるくらいの出来事なのね。"}, {"t": 551.2333333333333, "x": "1965年の夏。岡山東商は、また甲子園に来た。"}, {"t": 555.7333333333333, "x": "狙うのは春と夏の連覇だ。"}, {"t": 557.7, "x": "春の優勝校がまた来たなら期待されたでしょうね。"}, {"t": 560.7833333333333, "x": "1回戦の相手は東京の日大二。"}, {"t": 563.0666666666667, "x": "岡山東商は5回の途中までリードしていた。"}, {"t": 565.9833333333333, "x": "ところがそこで雨が強くなり、\n試合はノーゲームになった。"}, {"t": 569.45, "x": "リードしてたのに、なかったことになるの？"}, {"t": 572.0166666666667, "x": "そうだ。翌日にもう一度、最初から試合をした。"}, {"t": 575.2666666666667, "x": "その再試合で、岡山東商は0対4で敗れた。"}, {"t": 578.8166666666667, "x": "春は49回で1点だったのに。"}, {"t": 581.25, "x": "野球は、同じ投手でも、\n同じ結果になるとは限らない。"}, {"t": 584.85, "x": "岡山東商の夏の甲子園は、ここで終わった。"}, {"t": 588.6166666666667, "x": "その年の秋、平松はプロのドラフト会議で\n中日から4位で指名された。"}, {"t": 593.2, "x": "だが、プロには入らなかった。"}, {"t": 595.1, "x": "1966年の春に卒業して、\n社会人の日本石油に入っている。"}, {"t": 600.2166666666667, "x": "すぐにはプロに行かなかったのね。"}, {"t": 602.25, "x": "ああ。1967年の夏には、\n都市対抗野球で日本石油を優勝させた。"}, {"t": 607.4833333333333, "x": "大会でいちばん活躍した選手に\n贈られる橋戸賞も受けている。"}, {"t": 611.3166666666667, "x": "そしてその8月、平松は大洋ホエールズに入った。"}, {"t": 614.75, "x": "プロの初登板は1967年8月16日。"}, {"t": 618.4, "x": "川崎球場の広島戦だった。"}, {"t": 620.7666666666667, "x": "大洋って、秋山と土井がいたチームね！"}, {"t": 623.3833333333333, "x": "そうだ。岡山東から大洋へ。\nその道を、平松も通ったことになる。"}, {"t": 628.15, "x": "1970年には25勝を挙げ、最多勝と沢村賞を取った。"}, {"t": 632.5166666666667, "x": "武器は「カミソリシュート」と\n呼ばれた、内側へ鋭く曲がる球だった。"}, {"t": 636.8, "x": "巨人からは通算51勝。"}, {"t": 638.55, "x": "12年続けて2桁の勝ち星を挙げた。"}, {"t": 641.2833333333333, "x": "1979年には最優秀防御率のタイトルも取っている。"}, {"t": 645.3333333333334, "x": "1983年に通算200勝。"}, {"t": 647.9166666666666, "x": "1984年に引退するまでに201勝を積み上げた。"}, {"t": 651.95, "x": "高校で49回1点の人が、プロでも200勝なのね。"}, {"t": 655.8666666666667, "x": "岡山東商から日本石油を通って大洋に\n入った投手は、平松だけではない。"}, {"t": 660.95, "x": "奥江英幸も同じ道をたどり、大洋と\nロッテで通算53勝を挙げている。"}, {"t": 665.5333333333333, "x": "秋山、土井、平松、奥江。"}, {"t": 667.6333333333333, "x": "4人が同じ大洋のユニフォームを着た。"}, {"t": 670.1333333333333, "x": "1つの公立校から、1つの球団へ、\nそんなに続いたのね。"}, {"t": 674.3, "x": "2017年、平松は野球殿堂に入った。"}, {"t": 677.3833333333333, "x": "同じ年に殿堂に入ったのが、高校時代に\n岡山で競った星野仙一だった。"}, {"t": 682.4666666666667, "x": "同じ学年の2人が、同じ年に殿堂入りなの？"}, {"t": 685.7166666666667, "x": "ああ。2人とも岡山の高校から出た投手だった。"}, {"t": 689.45, "x": "平松が卒業したあとも岡山東商は甲子園に来た。"}, {"t": 693.0833333333334, "x": "1966年の夏は長崎の海星に8対5で勝った。"}, {"t": 697.2666666666667, "x": "2回戦で愛知の中京商に4対5。"}, {"t": 699.55, "x": "1点差で敗れている。"}, {"t": 701.0166666666667, "x": "中京商はこの年の春のセンバツの優勝校だった。"}, {"t": 704.3833333333333, "x": "春の王者に1点差なら惜しかったわね。"}, {"t": 706.8333333333334, "x": "1970年の夏は新潟の長岡商に8対1。"}, {"t": 710.45, "x": "2回戦で兵庫の滝川に1対2だった。"}, {"t": 713.1333333333333, "x": "1971年の夏は、宮崎の都城農に3対1、\n兵庫の報徳学園に5対3で勝った。"}, {"t": 719.9, "x": "準々決勝では岐阜の県岐阜商に1対0。"}, {"t": 722.8666666666667, "x": "また1対0なのね！"}, {"t": 724.4, "x": "準決勝で神奈川の桐蔭学園に\n2対5で敗れ、ベスト4だった。"}, {"t": 728.55, "x": "この年の10月には国体の硬式野球でも優勝している。"}, {"t": 732.1666666666666, "x": "ところがここから先は、1点差の負けが続く。"}, {"t": 735.1666666666666, "x": "1973年の春は愛媛の今治西に1対2。"}, {"t": 738.8666666666667, "x": "その夏は千葉の銚子商に、延長12回の0対1で敗れた。"}, {"t": 742.8666666666667, "x": "次の1974年の春も相手はまた銚子商だった。"}, {"t": 746.6333333333333, "x": "結果はまた0対1だ。"}, {"t": 748.3833333333333, "x": "同じ相手に2回続けて0対1なの？"}, {"t": 751.0333333333333, "x": "ああ。1975年の夏は宮崎の日南に4対5。"}, {"t": 755.0, "x": "1976年の春は青森の弘前工に3対2で\n勝ったが、2回戦で栃木の小山に2対3。"}, {"t": 761.4333333333333, "x": "その夏は兵庫の市神港に0対1だった。"}, {"t": 764.2666666666667, "x": "1978年の春は高知の高知高校に、\n延長13回の4対5で敗れた。"}, {"t": 769.9166666666666, "x": "延長13回って、1965年の決勝と同じ長さね。"}, {"t": 774.35, "x": "そうだ。今度は1点差で負ける側だった。"}, {"t": 776.9666666666667, "x": "1973年の春から1978年の春まで、\n甲子園での負けは7つある。"}, {"t": 782.8833333333333, "x": "その7つが、すべて1点差だった。"}, {"t": 785.3833333333333, "x": "勝つときも負けるときも1点差なのね。"}, {"t": 787.9, "x": "そして1978年の夏、岡山東商は\nまたベスト4まで進んだ。"}, {"t": 793.0333333333333, "x": "1回戦は茨城の取手二に3対1。"}, {"t": 795.55, "x": "2回戦は福井の福井商に3対2。"}, {"t": 797.7833333333333, "x": "3回戦は北海道の旭川竜谷に4対2。"}, {"t": 801.0166666666667, "x": "準々決勝は沖縄の豊見城に\n延長10回の6対5で競り勝った。"}, {"t": 805.4666666666667, "x": "沖縄の学校と、また甲子園で当たったのね。"}, {"t": 808.5, "x": "準決勝では高知の高知商に0対4。ここで止まった。"}, {"t": 812.05, "x": "そしてこの1978年の夏が、岡山東商が\n甲子園で最後に勝った大会になっている。"}, {"t": 818.9833333333333, "x": "1991年の夏、岡山東商は\n長野の松商学園に2対6で敗れた。"}, {"t": 824.6333333333333, "x": "これが今のところ最後の夏の甲子園だ。"}, {"t": 827.1666666666666, "x": "2006年の春にも出たが、\n長崎の清峰に2対11で敗れている。"}, {"t": 831.75, "x": "それからもう20年ね。"}, {"t": 833.3666666666667, "x": "甲子園に出たのは、春が8回、夏が11回。"}, {"t": 836.45, "x": "合わせて19回だ。"}, {"t": 837.9, "x": "勝ちは17、負けは18。"}, {"t": 839.9, "x": "夏の11回は、岡山県の学校で最も\n多い回数で、倉敷商と並んでいる。"}, {"t": 845.25, "x": "今でも夏の出場回数は県でいちばん上なのね。"}, {"t": 848.4666666666667, "x": "ああ。2025年の地元のテレビ局は、"}, {"t": 851.05, "x": "部員たちが「甲子園で校歌を歌う」ことを\n目標にしていると伝えた。"}, {"t": 855.4, "x": "1951年に決まったあの校歌だ。"}, {"t": 858.1333333333333, "x": "古い名門という意味の「古豪」ではなく、強い\n学校として戻りたいという言葉も紹介されている。"}, {"t": 864.05, "x": "甲子園で校歌を、もう一度ってことね。"}, {"t": 866.6166666666667, "x": "そうだ。学校の沿革には、今も\n1965年4月4日の優勝が書かれている。"}, {"t": 872.15, "x": "2018年には創立120周年の式も開かれた。"}, {"t": 875.95, "x": "平松の故郷の高梁市には、2018年から\n「平松政次球場」という名前の球場もある。"}, {"t": 882.2666666666667, "x": "市の野球場に、平松の名前が\n愛称として付けられたんだ。"}, {"t": 885.95, "x": "高梁市では1994年から、平松の名前がついた\n少年野球の大会も毎年開かれている。"}, {"t": 892.55, "x": "49回で1点の投手の名前が、\nふるさとの子どもたちの大会に残っているのね。"}, {"t": 898.4, "x": "最初の問いに戻るけど、なんで\n49回で1点なんてことができたの？"}, {"t": 902.85, "x": "はっきりした答えは、記録からは出ない。"}, {"t": 905.2666666666667, "x": "ただ数字を並べると見えてくるものはある。"}, {"t": 907.5833333333334, "x": "5試合のうち4試合が完封。そのうち2試合が1対0だ。"}, {"t": 911.2833333333333, "x": "岡山東商の打線は、5試合で14点しか取っていない。"}, {"t": 915.0166666666667, "x": "ふつうなら、1点しか取れない\n日は負けてもおかしくない。"}, {"t": 918.2833333333333, "x": "それでも勝てたのは、1人の投手が\n最後まで点をやらなかったからだろう。"}, {"t": 922.6166666666667, "x": "1点を取ったら、その1点を最後まで守り切ったのね。"}, {"t": 926.1333333333333, "x": "もう1つは守りの側の数字だ。"}, {"t": 928.2166666666667, "x": "2回戦の明治戦は四球が1つもなかった。"}, {"t": 931.0833333333334, "x": "無駄な走者を出さない野球だったのではないか。"}, {"t": 933.7333333333333, "x": "そして決勝の13回の裏は、ヒット、送り\nバント、ヒットの3つで1点を取った。"}, {"t": 939.0166666666667, "x": "点を取るときも確実な1点だった。"}, {"t": 941.5333333333333, "x": "派手じゃないけど、こういう勝ち方もあるのね。"}, {"t": 944.2, "x": "岡山県の優勝が、そのあと61年出ていない\n理由も、記録だけでは言えない。"}, {"t": 949.1666666666666, "x": "ただ1つ言えるのは、1965年の春には\nそれだけの条件がそろっていたということだ。"}, {"t": 954.8833333333333, "x": "1898年からの商業学校の伝統。"}, {"t": 957.9666666666667, "x": "秋山と土井から続く投手と捕手の系譜。"}, {"t": 960.7, "x": "そして高梁から来た1人の投手だ。"}, {"t": 963.7833333333333, "x": "大会の記録には、\n「岡山東商2対1市和歌山商」とだけ残っている。"}, {"t": 968.6166666666667, "x": "5試合の相手の点を1回ずつ\n並べると、49回のうち48回が0だ。"}, {"t": 973.7, "x": "1つだけ1が入って、あとは全部0なのね。"}, {"t": 976.7833333333333, "x": "ああ。そして岡山の甲子園の歴史で、\n優勝の欄に名前があるのは今もこの学校だけだ。"}, {"t": 982.35, "x": "数字で見るとあの春のすごさがよく分かったわ。"}, {"t": 985.15, "x": "最後まで見てくれて、ありがとう。"}, {"t": 987.1333333333333, "x": "面白かったと思ってもらえたら、チャンネル登録と\n高評価で応援してもらえると助かる。"}, {"t": 992.35, "x": "またね！"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
