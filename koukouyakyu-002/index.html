<script>
const D={"name": "平成令和の公立優勝校", "file": "002_編集用", "dur": 1008.76665625, "segs": [], "subs": [{"t": 0.0, "x": "2026年8月22日、兵庫県西宮市の阪神甲子園球場。"}, {"t": 5.033333333333333, "x": "第108回全国高校野球選手権大会の決勝が行われた。"}, {"t": 9.366666666666667, "x": "和歌山の智辯和歌山が\n群馬の健大高崎を4対3で破った。"}, {"t": 13.433333333333334, "x": "智辯和歌山にとって5年ぶり4度目の優勝だ。"}, {"t": 16.433333333333334, "x": "ついこの間の夏の甲子園の決勝ね。"}, {"t": 19.033333333333335, "x": "ああ。この夏の甲子園には49校が出ていた。"}, {"t": 22.116666666666667, "x": "そのうち県立や市立の、公立の学校は9校だった。"}, {"t": 25.666666666666668, "x": "その9校は3回戦を前に、すべて敗れている。"}, {"t": 28.833333333333332, "x": "公立は1校も3回戦まで残れなかったの？"}, {"t": 31.816666666666666, "x": "そうだ。高校野球の専門サイトがそう伝えている。"}, {"t": 34.96666666666667, "x": "その5か月前、2026年3月31日。"}, {"t": 38.6, "x": "春の選抜の決勝では、大阪桐蔭が\n奈良の智弁学園を7対3で破った。"}, {"t": 43.516666666666666, "x": "2026年は春も夏も、優勝したのは私立の学校だった。"}, {"t": 47.85, "x": "最近は私立が勝つのが\n当たり前、という感じがするわね。"}, {"t": 51.416666666666664, "x": "では、その「当たり前」はどのくらい続いているのか。"}, {"t": 54.71666666666667, "x": "平成が始まった1989年の春から、2026年の夏まで。"}, {"t": 59.8, "x": "38年分の甲子園で公立校は何回優勝しているのか？"}, {"t": 63.86666666666667, "x": "10回くらいはありそうだけど？"}, {"t": 65.71666666666667, "x": "答えは、それよりずっと少ない。"}, {"t": 67.75, "x": "今回は、平成と令和に甲子園を制した\n公立校を、1校も残さず並べる。"}, {"t": 72.6, "x": "1校ずつ、優勝までの道と、その後と\n今を、日付と数字でたどっていく。"}, {"t": 77.58333333333333, "x": "最後まで見てもらえるとうれしい。"}, {"t": 79.36666666666666, "x": "本編の前にチャンネル登録と高評価をよろしく頼む。"}, {"t": 83.3, "x": "まず数える範囲をはっきりさせておく。"}, {"t": 85.48333333333333, "x": "元号が平成に変わったのは1989年1月8日だ。"}, {"t": 89.58333333333333, "x": "だからこの年の春の選抜から数え始める。"}, {"t": 92.46666666666667, "x": "終わりは2026年8月の夏の選手権だ。"}, {"t": 95.83333333333333, "x": "春の選抜と夏の選手権、両方とも数えるのね。"}, {"t": 99.36666666666666, "x": "ああ。ただし2020年は春も夏も開かれていない。"}, {"t": 102.65, "x": "新型コロナウイルスの広がりで、\nどちらも中止になった。"}, {"t": 106.21666666666667, "x": "春は開くと決めたあとで中止になったのよね？"}, {"t": 109.11666666666666, "x": "そうだ。日本高野連の記録では、\n中止を決めたのは2020年3月11日。"}, {"t": 114.28333333333333, "x": "開くと決めたあとの中止は春の選抜で初めてだった。"}, {"t": 117.68333333333334, "x": "この2回を引くと、春が37回で夏が37回になる。"}, {"t": 121.81666666666666, "x": "合わせて74回の大会が開かれた。"}, {"t": 124.56666666666666, "x": "74回。優勝した学校ものべ74校ね。"}, {"t": 128.1, "x": "ああ。優勝校は、\n阪神甲子園球場の「歴代優勝校」のページで\n1つずつ確かめた。"}, {"t": 133.95, "x": "2026年の夏だけは、\n日本高野連の大会ページで確かめている。"}, {"t": 138.48333333333332, "x": "そのうえで、学校の公式サイトや\n県の資料で、県立かどうかを調べた。"}, {"t": 143.11666666666667, "x": "そこから公立の学校を拾い出すのね。"}, {"t": 146.2, "x": "では答えを言う。"}, {"t": 147.21666666666667, "x": "74回のうち公立校が優勝したのは5回だけだ。"}, {"t": 150.76666666666668, "x": "5回？ 74回のうちで？"}, {"t": 152.86666666666667, "x": "ああ。割合にすると7パーセントに届かない。"}, {"t": 155.63333333333333, "x": "春が2回で夏が3回。"}, {"t": 157.2, "x": "年の順に並べるとこうなる。"}, {"t": 159.06666666666666, "x": "1994年の夏、佐賀県の佐賀商。"}, {"t": 162.2, "x": "1995年の春、香川県の観音寺中央。"}, {"t": 165.73333333333332, "x": "1996年の夏、愛媛県の松山商。"}, {"t": 169.26666666666668, "x": "2007年の夏、佐賀県の佐賀北。"}, {"t": 171.91666666666666, "x": "そして2009年の春、長崎県の清峰。"}, {"t": 175.05, "x": "九州と四国の学校ばかりね。"}, {"t": 177.25, "x": "ああ。佐賀が2校、長崎が\n1校、香川と愛媛が1校ずつだ。"}, {"t": 181.33333333333334, "x": "5校とも県が建てた県立高校だった。"}, {"t": 184.01666666666668, "x": "残りの69回は全部私立ということね。"}, {"t": 186.96666666666667, "x": "そうなる。"}, {"t": 187.66666666666666, "x": "同じ38年で大阪桐蔭は1校だけで10回優勝している。"}, {"t": 191.71666666666667, "x": "春が5回、夏が5回だ。"}, {"t": 193.66666666666666, "x": "公立の5校を全部足しても、その半分なのね。"}, {"t": 196.88333333333333, "x": "そして、2009年春の清峰を最後に、\n公立校の優勝は1度もない。"}, {"t": 201.48333333333332, "x": "そのあとに開かれた大会は春と夏で33回。"}, {"t": 204.75, "x": "33回続けて私立の学校が優勝している。"}, {"t": 208.53333333333333, "x": "昔は公立がもっと勝っていたのかしら？"}, {"t": 211.13333333333333, "x": "比べるために昭和の最後の10年も同じように数えた。"}, {"t": 214.41666666666666, "x": "1979年から1988年までの春と夏の20回だ。"}, {"t": 219.41666666666666, "x": "このうち公立校の優勝は10回あった。"}, {"t": 222.05, "x": "20回のうち10回？ 半分じゃない。"}, {"t": 224.51666666666668, "x": "ああ。春は和歌山の箕島、\n高知の高知商、徳島の池田。"}, {"t": 228.56666666666666, "x": "それに高知の伊野商と、愛媛の宇和島東だ。"}, {"t": 231.61666666666667, "x": "池田は春に2回勝っているから、春だけで6回になる。"}, {"t": 235.08333333333334, "x": "夏は箕島、池田、茨城の取手二、\n広島の広島商の4回だ。"}, {"t": 239.96666666666667, "x": "箕島は春と夏の両方に名前があるのね。"}, {"t": 242.81666666666666, "x": "1979年に春と夏を続けて制している。"}, {"t": 246.31666666666666, "x": "そして昭和の最後の年、1988年。"}, {"t": 249.65, "x": "春は宇和島東、夏は広島商が優勝した。"}, {"t": 253.01666666666668, "x": "昭和の最後は春も夏も公立だったのね。"}, {"t": 255.81666666666666, "x": "そうだ。昭和の最後の10年は20回中10回。"}, {"t": 259.0, "x": "平成と令和の38年は74回中5回。"}, {"t": 262.26666666666665, "x": "同じ数え方で並べるとこの差になる。"}, {"t": 264.6166666666667, "x": "では、その5回を1校ずつ見ていく。"}, {"t": 267.55, "x": "1校目は1994年の夏、第76回大会の佐賀商だ。"}, {"t": 272.23333333333335, "x": "佐賀商は佐賀市にある県立の商業高校だ。"}, {"t": 274.98333333333335, "x": "決勝は8月21日。相手は鹿児島の樟南だった。"}, {"t": 278.85, "x": "九州の学校どうしの決勝ね。"}, {"t": 281.05, "x": "日本高野連の大会小史は、これを\n「史上初の九州勢対決」と書いている。"}, {"t": 286.06666666666666, "x": "この大会では、準優勝の樟南と、\n大分の柳ケ浦も勝ち進んでいた。"}, {"t": 290.76666666666665, "x": "ベスト4のうち3校が九州の学校だった。"}, {"t": 293.68333333333334, "x": "九州の学校が強い夏だったのね。"}, {"t": 296.15, "x": "決勝は9回に動いた。"}, {"t": 297.81666666666666, "x": "佐賀商の西原主将が満塁本塁打を打った。"}, {"t": 300.7, "x": "8対4で佐賀商が勝った。"}, {"t": 302.65, "x": "それが佐賀県で初めての優勝だったの？"}, {"t": 305.26666666666665, "x": "ああ。日本高野連の記録に\n「佐賀県勢初優勝」とある。"}, {"t": 309.1, "x": "夏の大会の第1回は1915年だ。"}, {"t": 312.05, "x": "佐賀の学校が夏に勝つまで79年かかったことになる。"}, {"t": 315.85, "x": "79年。長い道のりね。"}, {"t": 318.06666666666666, "x": "この大会からは、ベンチに入れる\n選手が16人になっている。"}, {"t": 321.73333333333335, "x": "日本高野連の記録には、\n「複数投手制の推進」のためとある。"}, {"t": 325.93333333333334, "x": "投手を何人も使えるように人数を増やしたのね。"}, {"t": 329.0, "x": "そうだ。この人数の決まりは、\nあとの章でもう1度出てくる。"}, {"t": 332.55, "x": "では佐賀商の今だ。"}, {"t": 333.8833333333333, "x": "2026年の夏、佐賀商は\n8年ぶり17回目の甲子園に出ている。"}, {"t": 338.73333333333335, "x": "さっきの公立9校の中にいたのね。"}, {"t": 341.21666666666664, "x": "ああ。32年前の優勝校がいまも甲子園に出てくる。"}, {"t": 344.71666666666664, "x": "佐賀は公立が強い県として知られている。"}, {"t": 347.23333333333335, "x": "Numberの記事では、\n2025年までの10大会の夏の佐賀大会で、"}, {"t": 351.56666666666666, "x": "優勝した10校のうち8校が公立だった。"}, {"t": 354.98333333333335, "x": "2校目は1995年の春、第67回選抜の観音寺中央だ。"}, {"t": 360.0, "x": "この年の1月17日に阪神・淡路大震災が起きている。"}, {"t": 363.85, "x": "選抜は震災からおよそ2か月後に開かれた。"}, {"t": 366.93333333333334, "x": "甲子園のある西宮市も大きな被害を受けた町よね。"}, {"t": 370.3333333333333, "x": "ああ。日本高野連の記録によると地元への気配りから、"}, {"t": 373.73333333333335, "x": "ブラスバンドなどの鳴り物の応援は禁止された。"}, {"t": 376.51666666666665, "x": "1日に4試合を行う日を減らし、会期は\n10日間から11日間に延ばしている。"}, {"t": 381.71666666666664, "x": "静かな甲子園だったのね。"}, {"t": 383.56666666666666, "x": "観音寺中央は香川県観音寺市にあった県立高校だ。"}, {"t": 387.15, "x": "前の名前は観音寺商といった。"}, {"t": 389.1666666666667, "x": "1992年、丸亀商を20年率いた\n橋野純監督が、その観音寺商にやってきた。"}, {"t": 395.51666666666665, "x": "経験のある監督がやってきたのね。"}, {"t": 397.9, "x": "ああ。丸亀商では、春と夏を\n合わせて7度、甲子園に出ている。"}, {"t": 402.15, "x": "それまでに甲子園に出たことはあったのかしら？"}, {"t": 404.9, "x": "ない。春も夏もこの大会が初めての甲子園だった。"}, {"t": 408.26666666666665, "x": "この選抜には、PL学園の福留孝介など、\nのちにプロで活躍する選手が出ていた。"}, {"t": 414.0, "x": "強い学校がそろっていた大会なのね。"}, {"t": 416.53333333333336, "x": "神戸新聞の記事によると、観音寺中央は\n2回戦で東海大相模を破っている。"}, {"t": 421.43333333333334, "x": "準々決勝では石川の星稜にも勝った。"}, {"t": 424.1, "x": "決勝は4月5日。相手は千葉の銚子商だった。"}, {"t": 427.25, "x": "観音寺中央はこの決勝に4対0で\n勝ち、出場32校の頂点に立った。"}, {"t": 432.43333333333334, "x": "初めての甲子園でいきなり優勝なのね。"}, {"t": 435.03333333333336, "x": "ああ。初出場で初優勝だ。"}, {"t": 437.1666666666667, "x": "ユニホームは、アンダーシャツやストッキングまで\n白一色だったと、同じ記事にある。"}, {"t": 441.85, "x": "では観音寺中央の今だ。"}, {"t": 443.55, "x": "観音寺中央という学校はもうない。"}, {"t": 445.81666666666666, "x": "なくなったの？"}, {"t": 446.8666666666667, "x": "香川県の高校をまとめ直す計画で、\n近くの三豊工と1つになった。"}, {"t": 451.45, "x": "2017年4月に、観音寺総合高校として\n新しく始まっている。"}, {"t": 456.1333333333333, "x": "名前が変わって2つの学校が1つになったのね。"}, {"t": 459.3333333333333, "x": "ああ。2010年の神戸新聞の記事では、\n優勝した年の夏を最後に、"}, {"t": 463.8, "x": "観音寺中央は甲子園から\n遠ざかっていると書かれている。"}, {"t": 467.75, "x": "3校目は1996年の夏、第78回大会の松山商だ。"}, {"t": 472.81666666666666, "x": "松山商は愛媛県松山市にある県立の商業高校だ。"}, {"t": 476.5, "x": "決勝は8月21日。相手は熊本工だった。"}, {"t": 479.96666666666664, "x": "日本高野連はこの決勝を「古豪対決」と書いている。"}, {"t": 483.53333333333336, "x": "古豪って昔から強い学校のことよね？"}, {"t": 486.23333333333335, "x": "そうだ。熊本工にとっては3度目の決勝だった。"}, {"t": 489.4166666666667, "x": "試合は3対3のまま延長に入った。"}, {"t": 491.85, "x": "10回の裏、松山商は1アウト満塁で、\n相手の攻撃を守っていた。"}, {"t": 496.3333333333333, "x": "外野からの返球で三塁の走者を本塁でアウトにした。"}, {"t": 499.6666666666667, "x": "この守りは、のちに\n「奇跡のバックホーム」と呼ばれている。"}, {"t": 503.3833333333333, "x": "その名前は聞いたことがあるわ。"}, {"t": 505.31666666666666, "x": "松山商は11回の表に3点を取り、6対3で勝った。"}, {"t": 509.18333333333334, "x": "27年ぶり5度目の夏の優勝だった。"}, {"t": 511.93333333333334, "x": "27年ぶりということは前は1969年？"}, {"t": 515.45, "x": "ああ。この大会ではほかにも記録が残っている。"}, {"t": 518.3, "x": "地方大会に出た学校は4,089校。"}, {"t": 521.1833333333333, "x": "日本高野連は、戦後で初めて\n参加校が減った年だと記録している。"}, {"t": 525.6166666666667, "x": "出る学校の数が減り始めた年でもあったのね。"}, {"t": 528.6666666666666, "x": "では松山商の今だ。"}, {"t": 530.1833333333333, "x": "ベースボールチャンネルの記事によると、\n松山商の甲子園は春夏合わせて42回。"}, {"t": 535.1666666666666, "x": "全国での優勝は春2回と夏5回の、合わせて7回だ。"}, {"t": 538.95, "x": "ただし、甲子園に出たのは\n2001年の夏が最後になっている。"}, {"t": 542.8833333333333, "x": "2001年からだともう25年たつのね。"}, {"t": 545.6833333333333, "x": "2025年の夏は愛媛大会の決勝まで勝ち進んだ。"}, {"t": 549.3666666666667, "x": "決勝に出たのは24年ぶりで、\n済美に3対4で敗れている。"}, {"t": 553.2666666666667, "x": "2026年の夏は愛媛大会の準々決勝で敗れた。"}, {"t": 557.7166666666667, "x": "4校目は2007年の夏、第89回大会の佐賀北だ。"}, {"t": 561.95, "x": "佐賀北も佐賀市にある県立高校だ。"}, {"t": 564.35, "x": "松山商の優勝から11年がたっていた。"}, {"t": 567.1, "x": "決勝は8月22日。相手は広島の広陵だった。"}, {"t": 570.8833333333333, "x": "佐賀北はそれまでに優勝したことはあったの？"}, {"t": 573.6666666666666, "x": "いや。この夏が佐賀北にとって初めての優勝だ。"}, {"t": 576.8333333333334, "x": "決勝の8回の裏、佐賀北は\n1対4から満塁本塁打を打った。"}, {"t": 581.0, "x": "日本高野連は、「決勝では\n史上初の逆転満塁本塁打」と記録している。"}, {"t": 585.7833333333333, "x": "5対4で佐賀北が勝った。"}, {"t": 587.5666666666667, "x": "この大会ではベスト8に九州の学校が3校残っていた。"}, {"t": 591.45, "x": "13年前の佐賀商と同じ佐賀県なのね。"}, {"t": 594.35, "x": "ああ。日本高野連の大会小史にはこの1行もある。"}, {"t": 597.5666666666667, "x": "「公立校としては11年ぶりの頂点に立った」。"}, {"t": 600.65, "x": "そのあと夏に優勝した公立校は？"}, {"t": 603.0833333333334, "x": "いない。夏の公立校の優勝は、\nこの佐賀北が今のところ最後だ。"}, {"t": 607.3166666666667, "x": "2008年から2026年まで、夏の大会は18回開かれた。"}, {"t": 612.0, "x": "18回とも優勝したのは私立の学校だ。"}, {"t": 614.9833333333333, "x": "18回続けて私立なのね。"}, {"t": 617.1333333333333, "x": "では佐賀北 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
