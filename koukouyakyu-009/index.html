<title>三沢</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}}

<script>
const D={"name": "三沢", "file": "009_編集用", "dur": 939.2, "segs": [], "subs": [{"t": 0.0, "x": "1969年8月。兵庫県の甲子園球場。"}, {"t": 3.8, "x": "夏の決勝は0対0のまま延長に入っていた。"}, {"t": 6.883333333333334, "x": "青森の三沢と愛媛の松山商だ。"}, {"t": 9.233333333333333, "x": "延長15回の裏。三沢の攻撃で、\n1アウト満塁になった。"}, {"t": 13.366666666666667, "x": "1点入れば三沢の優勝なの？"}, {"t": 15.516666666666667, "x": "そうだ。サヨナラ勝ちで日本一になる。"}, {"t": 17.966666666666665, "x": "打席には9番の立花。"}, {"t": 19.65, "x": "投げるのは松山商のエースの井上だ。"}, {"t": 22.05, "x": "カウントは3ボール1ストライクまで進んだ。"}, {"t": 24.716666666666665, "x": "あと1球外れれば、押し出しで試合が終わる。"}, {"t": 27.516666666666666, "x": "うわ、すごい場面。"}, {"t": 28.883333333333333, "x": "そこから井上はストライクを取り、\nカウントは3ボール2ストライクになった。"}, {"t": 33.2, "x": "6球目の打球はピッチャーの前に転がった。"}, {"t": 35.833333333333336, "x": "ボールは本塁に送られる。"}, {"t": 37.233333333333334, "x": "三塁から頭から滑り込んだ菊池は、アウトになった。"}, {"t": 40.68333333333333, "x": "次の打者の八重沢は右中間へ強い当たりを打った。"}, {"t": 43.6, "x": "これもセンターが捕った。"}, {"t": 44.86666666666667, "x": "三沢は点を取れなかった。"}, {"t": 46.7, "x": "あと少しだったのね。"}, {"t": 48.21666666666667, "x": "試合は18回まで続いても0対0のままだった。"}, {"t": 51.4, "x": "決勝の引き分け再試合は大会の歴史で初めてだった。"}, {"t": 55.016666666666666, "x": "その三沢って、もともと強い学校だったの？"}, {"t": 57.983333333333334, "x": "いや、そこが面白いところだ。"}, {"t": 59.96666666666667, "x": "始まりは別の高校の定時制の分校だった。"}, {"t": 62.95, "x": "分校から始まった学校が、\nどうして決勝で18回も戦えたの？"}, {"t": 67.38333333333334, "x": "今回は、三沢高校の野球部の歴史を、\n年と数字をもとに辿っていく。"}, {"t": 71.91666666666667, "x": "役に立ったと思ったら、チャンネル登録と\n高評価をお願いしたい。"}, {"t": 75.88333333333334, "x": "お願いします。じゃあ、最初から教えて。"}, {"t": 79.08333333333333, "x": "三沢高校は青森県三沢市にある県立の高校だ。"}, {"t": 82.35, "x": "学校の資料によると、始まりは1952年6月1日。"}, {"t": 86.66666666666667, "x": "青森県立三本木高校の分校として置かれた。"}, {"t": 89.76666666666667, "x": "それも定時制の課程だった。"}, {"t": 91.75, "x": "本当に分校からだったのね。"}, {"t": 93.76666666666667, "x": "1954年4月には新しい高校として開校している。"}, {"t": 97.7, "x": "1957年3月には県立の高校になった。"}, {"t": 101.28333333333333, "x": "そして1968年4月、\n今の三沢高校という名前に変わった。"}, {"t": 106.16666666666667, "x": "1968年って、甲子園の話の少し前よね。"}, {"t": 110.23333333333333, "x": "そうだ。名前が変わった\nその年の夏に初めて甲子園に出る。"}, {"t": 114.11666666666666, "x": "名前が変わってすぐに出たの？"}, {"t": 116.03333333333333, "x": "ああ。その話は、エースの太田幸司から始めよう。"}, {"t": 119.18333333333334, "x": "太田は、三沢の町で育った。"}, {"t": 121.25, "x": "週刊ベースボールの取材で子どものころを話している。"}, {"t": 124.3, "x": "父は戦後、米軍の三沢基地で働いていたそうだ。"}, {"t": 127.56666666666666, "x": "ときどき基地の中に連れて行ってもらったという。"}, {"t": 130.36666666666667, "x": "基地がある町なのね。"}, {"t": 131.86666666666667, "x": "そうだ。野球をちゃんとした\nチームで始めたのは、小学4年のとき。"}, {"t": 136.0, "x": "ただ、本人いわく、そのころは下手だったそうだ。"}, {"t": 139.05, "x": "ピッチャーもしていなかった。"}, {"t": 140.73333333333332, "x": "えっ、エースなのに？"}, {"t": 142.13333333333333, "x": "投手になったのは三沢一中の2年のときだ。"}, {"t": 144.93333333333334, "x": "先輩たちが肘や肩を痛めて、投げる人がいなくなった。"}, {"t": 148.6, "x": "それで「お前、投げてみろ」と\n言われたのが始まりだという。"}, {"t": 152.21666666666667, "x": "たまたまだったのね。"}, {"t": 153.63333333333333, "x": "球は速かった。中学3年では、\n近くの学校には負けなしになった。"}, {"t": 158.15, "x": "三沢一中と三沢高は道路1本を\nはさんだ近さだったそうだ。"}, {"t": 161.9, "x": "太田によると、中学校の野球部のほうが\n遅くまで練習していたそうだ。"}, {"t": 166.21666666666667, "x": "高校より中学のほうが練習してたの？"}, {"t": 168.8, "x": "本人の話ではそうだ。\nその仲間たちとの野球が、次の進路を決める。"}, {"t": 173.96666666666667, "x": "じゃあ、そのまま三沢高に入ったの？"}, {"t": 176.36666666666667, "x": "いや最初は別の学校を考えていた。"}, {"t": 178.68333333333334, "x": "甲子園に出られそうな、電車で\n30分の八戸高に行きたかったそうだ。"}, {"t": 183.25, "x": "三沢高はそのころまだ甲子園に出ていなかったのね。"}, {"t": 186.43333333333334, "x": "そうだ。それでも太田は地元の三沢高を選んだ。"}, {"t": 189.36666666666667, "x": "中学で一緒にやった仲間たちが三沢高に決めていた。"}, {"t": 192.71666666666667, "x": "それに両親が病気がちで、よく入院していたという。"}, {"t": 196.0, "x": "家の近くを選んだのね。"}, {"t": 197.7, "x": "ああ。だから入学のときは\n「甲子園を目指すぞ」ではなかった。"}, {"t": 201.53333333333333, "x": "仲間と楽しく野球をする、というつもりだったそうだ。"}, {"t": 204.85, "x": "それが決勝まで行くんだから、わからないものね。"}, {"t": 208.36666666666667, "x": "1968年の夏は、第50回の記念大会だった。"}, {"t": 212.6, "x": "三沢はこの大会で初めて甲子園の土を踏んだ。"}, {"t": 215.63333333333333, "x": "日本高野連の記録では、\nこの記念大会には48の代表が出ている。"}, {"t": 220.15, "x": "太田は2年生だった。"}, {"t": 221.73333333333332, "x": "名前が三沢高校になって、最初の夏よね。"}, {"t": 224.78333333333333, "x": "そうだ。太田は2018年にこう話している。"}, {"t": 227.78333333333333, "x": "「僕が2年生で初めて甲子園に\n出たのが第50回大会」。"}, {"t": 231.43333333333334, "x": "別の取材では、この初出場を\n決めたときのほうが感激したとも話している。"}, {"t": 236.35, "x": "準優勝した夏よりも？"}, {"t": 238.1, "x": "ああ。3年夏の準優勝より、\n2年夏の初出場のほうが感激したそうだ。"}, {"t": 243.23333333333332, "x": "初めてって、やっぱり特別なのね。"}, {"t": 245.75, "x": "この夏の甲子園は2回戦で敗れた。"}, {"t": 248.15, "x": "次の1969年春、三沢はセンバツにも初めて選ばれた。"}, {"t": 252.58333333333334, "x": "ここでも2回戦で大阪の浪商に敗れている。"}, {"t": 255.56666666666666, "x": "2回続けて、2回戦で止まったのね。"}, {"t": 258.23333333333335, "x": "そうだ。ただ太田は、浪商に惜しくも\n負けたことで自信がついたという。"}, {"t": 262.4166666666667, "x": "全国でも通用する、と感じたそうだ。"}, {"t": 265.6, "x": "センバツのあと三沢は春の青森県大会で優勝した。"}, {"t": 268.96666666666664, "x": "太田は「東北では敵なし」と思っていたそうだ。"}, {"t": 272.15, "x": "なんだか、嫌な予感がするわね。"}, {"t": 274.3666666666667, "x": "その通りだ。春の東北大会の初戦で、\n宮城3位の仙台工に敗れた。"}, {"t": 279.1333333333333, "x": "それも点を1点も取れない、完封負けだった。"}, {"t": 282.1, "x": "ええっ、いきなり？"}, {"t": 283.26666666666665, "x": "ああ。でも太田はこれが\n逆に良かったと振り返っている。"}, {"t": 286.35, "x": "夏に向けて気持ちを入れ直せたからだ。"}, {"t": 288.8, "x": "負けて、目が覚めたのね。"}, {"t": 290.6166666666667, "x": "もう1つ、この年に変えたことがある。"}, {"t": 293.01666666666665, "x": "太田は3年春のセンバツまで\nまっすぐしか投げていなかった。"}, {"t": 296.6166666666667, "x": "えっ、変化球なしで甲子園に出てたの？"}, {"t": 299.3, "x": "そうだ。全国と戦うにはカーブもあったほうがいい。"}, {"t": 302.3666666666667, "x": "そう考えて、3年の夏の前に初めて覚えたという。"}, {"t": 306.4166666666667, "x": "1969年の夏。青森の学校には、もう1つ壁があった。"}, {"t": 311.2, "x": "壁って何？"}, {"t": 312.23333333333335, "x": "当時の青森には県だけの代表の枠が無かった。"}, {"t": 315.25, "x": "青森と岩手の上位2校ずつが\n集まる、北奥羽大会があった。"}, {"t": 319.03333333333336, "x": "そこで勝った1校だけが甲子園に行けた。"}, {"t": 321.65, "x": "2つの県で1校だけなの？それは大変ね。"}, {"t": 324.68333333333334, "x": "この年の北奥羽大会の決勝は\n同じ青森の弘前実とだった。"}, {"t": 328.8333333333333, "x": "場所は岩手の盛岡市営球場だ。"}, {"t": 331.0, "x": "三沢は先に点を取られたが、逆転で勝った。"}, {"t": 333.93333333333334, "x": "太田は、うれしいよりもホッとした、と話している。"}, {"t": 336.9166666666667, "x": "1年前は、甲子園に出るだけで大喜びだった。"}, {"t": 340.01666666666665, "x": "それがこの夏は「さあ、ここからだ」という\n気持ちに変わっていたそうだ。"}, {"t": 344.31666666666666, "x": "3回続けての甲子園ね。"}, {"t": 346.28333333333336, "x": "そうだ。1968年夏、1969年春、1969年夏。"}, {"t": 352.3666666666667, "x": "3季続けての出場になった。"}, {"t": 354.53333333333336, "x": "目標は2回戦の壁を破ることだった。"}, {"t": 357.2, "x": "前の2回とも、2回戦で負けてるものね。"}, {"t": 360.05, "x": "優勝候補ではなかったが、そこそこ\n強いとは思われていたという。"}, {"t": 363.8666666666667, "x": "太田は大会の前から名前が知られていた。"}, {"t": 366.4, "x": "「東の太田、西の西井」と言われていたそうだ。"}, {"t": 369.4, "x": "西井は宮崎商のエースで、\nのちにプロに進んだ投手だ。"}, {"t": 373.03333333333336, "x": "東と西のエース。かっこいい呼び方ね。"}, {"t": 375.73333333333335, "x": "この1969年は、地方大会に出た\n学校が初めて2,500校を超えた年だ。"}, {"t": 381.4, "x": "日本高野連の大会の記録にそう書かれている。"}, {"t": 384.3666666666667, "x": "その中の、北奥羽の1校だったのね。"}, {"t": 387.5, "x": "甲子園の1回戦の相手は大分商だった。"}, {"t": 390.18333333333334, "x": "大分商は8回に2点差を追いついた。"}, {"t": 392.53333333333336, "x": "試合は延長に入り、10回に三沢がサヨナラ勝ちした。"}, {"t": 396.1166666666667, "x": "初戦からいきなり延長なのね。"}, {"t": 398.18333333333334, "x": "そうだ。そして三沢は、目標だった2回戦も勝った。"}, {"t": 401.7, "x": "さらに勝ち進んで、準決勝まで来た。"}, {"t": 404.28333333333336, "x": "準決勝の相手は岡山の玉島商だ。"}, {"t": 406.8833333333333, "x": "岡山県の教育委員会の記事は、こう書いている。"}, {"t": 409.9166666666667, "x": "玉島商が三沢を準決勝で追い詰めた熱戦だった、と。"}, {"t": 413.65, "x": "準決勝も楽じゃなかったのね。"}, {"t": 415.76666666666665, "x": "ああ。その試合にも勝って三沢は決勝に進んだ。"}, {"t": 418.93333333333334, "x": "青森の学校が、夏の決勝に出たのね。"}, {"t": 421.81666666666666, "x": "そうだ。この夏、三沢の\nまわりでは別のことも起きていた。"}, {"t": 425.4166666666667, "x": "試合に勝つたびに女の子のファンが\n増えていったという。"}, {"t": 428.35, "x": "球場から宿舎に帰るバスを女の子の列が囲んだ。"}, {"t": 431.65, "x": "その列は2重、3重になったそうだ。"}, {"t": 434.1, "x": "宿舎に帰っても、同じように人が集まっていたという。"}, {"t": 437.46666666666664, "x": "花や手作りの看板を持った女子学生が、\n窓に向かって呼びかけた。"}, {"t": 441.78333333333336, "x": "すごい人気ね。"}, {"t": 442.96666666666664, "x": "日刊ゲンダイはこれを、\n全国の女子中高生のコーちゃんフィーバーと\n書いている。"}, {"t": 447.45, "x": "コーちゃんって、太田さんのことね。"}, {"t": 449.51666666666665, "x": "アイドルみたいじゃない！"}, {"t": 450.8333333333333, "x": "実際に太田は、のちに\n元祖甲子園のアイドルと呼ばれる。"}, {"t": 454.21666666666664, "x": "ただ本人はテレビや新聞を見ていなかったそうだ。"}, {"t": 457.1, "x": "自分がどう報じられているかは、\nわからなかったという。"}, {"t": 460.1666666666667, "x": "まわりの様子が変わったことで、気がついたそうだ。"}, {"t": 463.1666666666667, "x": "本人は野球に集中してたのね。"}, {"t": 465.96666666666664, "x": "そして決勝。相手は愛媛の松山商だ。"}, {"t": 468.75, "x": "松山商は夏の甲子園で何度も優勝してきた名門だ。"}, {"t": 472.45, "x": "公立の三沢と、名門の松山商ね。"}, {"t": 475.26666666666665, "x": "投げたのは、三沢の太田と、松山商の井上。"}, {"t": 478.3833333333333, "x": "2人とも先発して最後まで投げ続けた。"}, {"t": 481.0833333333333, "x": "9回が終わっても0対0だった。"}, {"t": 483.4, "x": "それで延長に入ったのね。"}, {"t": 485.2, "x": "そうだ。最初に話した15回裏の満塁は、ここで起きた。"}, {"t": 488.98333333333335, "x": "あの場面で3塁から本塁に滑り込んだのが菊池だ。"}, {"t": 492.21666666666664, "x": "15回裏は、ノーアウトで先頭の菊池が\n三遊間を破って始まった。"}, {"t": 496.55, "x": "そのあとバントなどで進んで、\n1アウト二、三塁になった。"}, {"t": 500.1333333333333, "x": "松山商は8番を歩かせて満塁にして守った。"}, {"t": 503.4166666666667, "x": "わざと満塁にしたの？"}, {"t": 504.98333333333335, "x": "ああ。どの塁でもアウトを取りやすくするためだ。"}, {"t": 507.6166666666667, "x": "そして9番の立花との勝負になった。"}, {"t": 510.1666666666667, "x": "立花はのちにこう振り返っている。"}, {"t": 512.25, "x": "「胸がドキドキしてね。"}, {"t": 513.5333333333333, "x": "何にも言えん気持ちだったですよ」。"}, {"t": 515.6666666666666, "x": "あと1球で勝てるかもしれなかったんだもの。"}, {"t": 518.3333333333334, "x": "太田も後に、15回裏の打球をこう振り返った。"}, {"t": 521.45, "x": "何センチかずれていれば、\nヒットになって終わっていた。"}, {"t": 524.4666666666667, "x": "勝負事で負けるときは、そんなものかもしれない、と。"}, {"t": 527.8166666666667, "x": "本当に紙一重だったのね。"}, {"t": 529.8, "x": "試合は18回まで進んだ。"}, {"t": 531.7, "x": "18回の裏、1塁にいた太田が\n二塁へ走って、アウトになった。"}, {"t": 535.8, "x": "これで試合が終わった。"}, {"t": 537.2833333333333, "x": "最後は太田さんが走者だったのね。"}, {"t": 539.5166666666667, "x": "そうだ。試合時間は4時間16分だった。"}, {"t": 542.3166666666667, "x": "太田がこの日に投げた球は262球だ。"}, {"t": 545.3666666666667, "x": "262球！1日で？"}, {"t": 547.55, "x": "太田は、決勝の延長18回も引き分け\n再試合も史上初だったと書いている。"}, {"t": 552.3333333333334, "x": "日本高野連の記録にも、\n大会史上初の決勝引き分け再試合とある。"}, {"t": 557.4333333333333, "x": "次の日にもう1回やったのよね。"}, {"t": 559.3333333333334, "x": "体は大丈夫だったの？"}, {"t": 561.0833333333334, "x": "太田は、日刊ゲンダイの連載で、\nその夜のことを書いている。"}, {"t": 564.8, "x": "宿舎の夕食で右腕がしびれた。"}, {"t": 566.9833333333333, "x": "はしが重くて持ち上がらなかったそうだ。"}, {"t": 569.3, "x": "腕は焼けたように熱くなった。"}, {"t": 571.1, "x": "風呂場で水をかけてもほてりは治まらなかった。"}, {"t": 573.9333333333333, "x": "それで次の日も投げたの？"}, {"t": 575.7166666666667, "x": "そうだ。朝は、はうように起きた。"}, {"t": 577.8666666666667, "x": "洗面所では歯ブラシが口に届かなかったという。"}, {"t": 580.8833333333333, "x": "そんな体で、決勝のマウンドに立ったのね。"}, {"t": 583.7833333333333, "x": "再試合も太田が最後まで投げた。"}, {"t": 585.8166666666667, "x": "結果は4対2で松山商の勝ち。"}, {"t": 587.9166666666666, "x": "太田は9回を投げて4点を取られた。"}, {"t": 590.3, "x": "2日で投げた球は27回で384球になった。"}, {"t": 594.2833333333333, "x": "384球。数字だけでも重いわね。"}, {"t": 597.35, "x": "三沢は準優勝だった。"}, {"t": 599.05, "x": "負けて、悔しかったでしょうね。"}, {"t": 601.0833333333334, "x": "太田の話は少し違う。"}, {"t": 602.8166666666667, "x": "悔しさはなく、やり切ったという、\nさわやかな気持ちだったそうだ。"}, {"t": 606.75, "x": "やり切った、か。2日で27回だものね。"}, {"t": 610.3833333333333, "x": "太田には大学からも声がかかったという。"}, {"t": 612.8166666666667, "x": "でも、早く両親に恩返しをしたいと考えた。"}, {"t": 615.8333333333334, "x": "そしてプロに進むことを決めた。"}, {"t": 617.8333333333334, "x": "1969年のドラフトで近鉄が1位で指名した。"}, {"t": 621.7166666666667, "x": "いきなり1位なのね。"}, {"t": 623.1, "x": "プロ初登板は1970年4月14日のロッテ戦だ。"}, {"t": 627.0666666666667, "x": "リリーフで投げて、そのまま初勝利になった。"}, {"t": 629.95, "x": "最初の試合で勝ったの？"}, {"t": 631.5833333333334, "x": "そうだ。ただ、1年目の勝ち星はその1勝だけだった。"}, {"t": 635.1666666666666, "x": "1年目は25試合に投げている。"}, {"t": 637.3, "x": "それでもオールスターのファン投票では1位になった。"}, {"t": 640.0666666666667, "x": "ファン投票の1位は、2年目も続いた。"}, {"t": 642.6666666666666, "x": "甲子園の人気が、そのまま続いたのね。"}, {"t": 645.4166666666666, "x": "ああ。本人は実力と期待の差に\n戸惑ったと話している。"}, {"t": 648.9833333333333, "x": "カーブを覚えたのは、プロに入る前の年の夏の前だ。"}, {"t": 652.2666666666667, "x": "本当は、まず3年ほど2軍で\n鍛えたいと考えていたそうだ。"}, {"t": 656.2, "x": "それでも、まわりが放っておかなかったのね。"}, {"t": 658.9333333333333, "x": "そうだな。それでも太田はプロで投げ続けた。"}, {"t": 661.6166666666667, "x": "通算の成績は58勝85敗だ。"}, {"t": 664.4833333333333, "x": "甲子園のあとも長く投げたのね。"}, {"t": 666.6833333333333, "x": "ああ。そして三沢の町にも、あの夏は残った。"}, {"t": 669.75, "x": "三沢市では準優勝を記念した\n少年野球大会が毎年開かれてきた。"}, {"t": 674.1833333333333, "x": "名前は、三沢高校甲子園準優勝記念、\n三沢市少年野球大会だ。"}, {"t": 678.95, "x": "大会の名前に、準優勝が入ってるのね。"}, {"t": 681.8666666666667, "x": "2012年には46回目、2014年には48回目が開かれた。"}, {"t": 686.75, "x": "2014年は小学生の部が7月19日から3日間開かれた。"}, {"t": 691.0833333333334, "x": "三沢市とその周りの地域から、21チームが集まった。"}, {"t": 694.8166666666667, "x": "小学生の大会なのね。"}, {"t": 696.6666666666666, "x": "開会式には太田も来賓として出た。"}, {"t": 699.0666666666667, "x": "子どもたちにこう話している。"}, {"t": 700.8166666666667, "x": "「勝つことよりもチームで力を\n合わせて戦うことが大事」。"}, {"t": 704.1333333333333, "x": "「皆に愛され尊敬される人間に育ってほしい」。"}, {"t": 707.1, "x": "準優勝の投手から言われたら、うれしいでしょうね。"}, {"t": 710.15, "x": "2012年の大会は、天気が悪くて日程が延びた。"}, {"t": 713.6666666666666, "x": "7月14日に始まって、終わったのは22日だった。"}, {"t": 717.3166666666667, "x": "この年も、太田は開会式であいさつしている。"}, {"t": 720.2333333333333, "x": "「結果を恐れず思い切ってプレーをすることを\n約束してほしい」と話している。"}, {"t": 724.7, "x": "負けを知ってる人の言葉ね。"}, {"t": 726.65, "x": "今の太田は、中学生に野球を教えている。"}, {"t": 729.3666666666667, "x": "2025年の日刊ゲンダイの記事では、\n毎日放送のラジオの解説者としても紹介されている。"}, {"t": 735.9666666666667, "x": "決勝の引き分け再試合はそのあと長く起きなかった。"}, {"t": 739.1666666666666, "x": "次は2006年。早稲田実業と駒大苫小牧の決勝だ。"}, {"t": 743.0833333333334, "x": "前の日の決勝は、延長15回の1対1で引き分けていた。"}, {"t": 746.9, "x": "次の日の再試合は、早稲田実業が4対3で勝っている。"}, {"t": 750.6666666666666, "x": "あの年も、2日続けての決勝だったのね。"}, {"t": 753.7, "x": "日本高野連の記録には\n37年ぶりの決勝引き分け再試合とある。"}, {"t": 758.15, "x": "37年前が、三沢と松山商だったのね。"}, {"t": 761.5, "x": "そうだ。そして2018年、\n第100回の記念大会があった。"}, {"t": 765.55, "x": "この大会では、毎日レジェンドが\n始球式をすることになった。"}, {"t": 769.2833333333333, "x": "決勝の始球式には太田と井上の2人が選ばれた。"}, {"t": 772.65, "x": "あの決勝の2人が、また並ぶのね！"}, {"t": 775.1833333333333, "x": "ああ。1人1球ずつ投げることになっていた。"}, {"t": 777.8833333333333, "x": "太田はこう話している。"}, {"t": 779.3166666666667, "x": "「毎年甲子園を見るとワクワク、ドキドキします」。"}, {"t": 782.3, "x": "「49年たって、また決勝のマウンドに\n立てることは非常に楽しみ」。"}, {"t": 786.6, "x": "100回大会がまた新しい\nスタートの大会になってほしい、とも話していた。"}, {"t": 791.2333333333333, "x": "49年たっても、あの決勝はつながってるのね。"}, {"t": 794.6, "x": "井上はのちに、朝日新聞の記者になった。"}, {"t": 797.5, "x": "投げ合った相手が、記者になったのね。"}, {"t": 799.9, "x": "あの決勝には、もう1つ続きがある。"}, {"t": 802.35, "x": "準決勝で三沢と戦った、\n岡山の玉島商を覚えているだろうか。"}, {"t": 806.7666666666667, " const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
