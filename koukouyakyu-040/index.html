<title>松山商1969年の決勝</title>
<style>

<script>
const D={"name": "松山商1969年の決勝", "file": "040_編集用", "dur": 814.25, "segs": [], "subs": [{"t": 0.0, "x": "夏の決勝って、その日のうちに優勝が決まるものよね。"}, {"t": 3.6, "x": "ふつうはそうだ。でも決まらなかった日がある。"}, {"t": 6.166666666666667, "x": "1969年8月18日。"}, {"t": 8.833333333333334, "x": "スコアは18回まで0対0だった。"}, {"t": 11.433333333333334, "x": "18回も戦って、どっちも1点も取れなかったの？"}, {"t": 14.966666666666667, "x": "ああ。そして試合は、\n大会の決まりで引き分けになった。"}, {"t": 18.366666666666667, "x": "日本高野連の大会小史には、こう書いてある。"}, {"t": 21.3, "x": "「松山商―三沢が大会史上初の，\n決勝引き分け再試合の熱戦」。"}, {"t": 25.916666666666668, "x": "決勝の再試合は、そのときが初めてだったのね。"}, {"t": 29.2, "x": "三沢の学校の歴史は前に別の回で話した。"}, {"t": 32.18333333333333, "x": "今回は、勝った松山商の守りと、\n審判と、記録の表から見ていく。"}, {"t": 36.96666666666667, "x": "同じ試合でも見る所を変えるのね。"}, {"t": 39.25, "x": "そうだ。見ていくのは4つ。"}, {"t": 41.03333333333333, "x": "18回で止まる決まり。"}, {"t": 42.46666666666667, "x": "15回と16回の満塁。"}, {"t": 44.266666666666666, "x": "翌日の再試合。そして表への残り方だ。"}, {"t": 47.35, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 50.766666666666666, "x": "よろしくね。"}, {"t": 52.28333333333333, "x": "まず大会の大きさだ。"}, {"t": 53.6, "x": "1969年の夏は第51回の大会だった。"}, {"t": 57.416666666666664, "x": "大会小史には「地方大会参加2,500校突破」とある。"}, {"t": 61.43333333333333, "x": "出場校の一覧を見ると、全参加校数は2523校。"}, {"t": 65.81666666666666, "x": "2500校をこえたのは、この年が初めてなのね。"}, {"t": 69.16666666666667, "x": "ああ。そのうち甲子園に来た代表は30校だった。"}, {"t": 72.53333333333333, "x": "2523校から30校。そこから\n決勝まで勝ち上がったのが2校ね。"}, {"t": 77.55, "x": "その2校が愛媛の松山商と青森の三沢だ。"}, {"t": 80.53333333333333, "x": "当時の新聞では、松山商は北四国、\n三沢は北奥羽の代表と書かれている。"}, {"t": 85.65, "x": "県の名前じゃなくて地方の名前なのね。"}, {"t": 88.15, "x": "このころは、2つの県で代表を1校出す地区があった。"}, {"t": 91.55, "x": "球審をした郷司さんも、三沢は岩手も\n含めた北奥羽の代表だった、と話している。"}, {"t": 96.91666666666667, "x": "じゃあ岩手の人も三沢を応援してたのね。"}, {"t": 99.46666666666667, "x": "決勝は8月18日の午後1時から、\n甲子園球場で始まった。"}, {"t": 104.5, "x": "先発は松山商が井上明三沢が太田幸司だ。"}, {"t": 107.78333333333333, "x": "日刊スポーツの復刻記事には\n「両投手の投げ合い」とある。"}, {"t": 111.46666666666667, "x": "9回が終わっても0対0のままだった。"}, {"t": 114.1, "x": "それで延長に入ったのね。"}, {"t": 115.63333333333334, "x": "何回まで続けられたの？"}, {"t": 117.45, "x": "当時の決まりでは延長は18回まで。"}, {"t": 119.85, "x": "18回で決まらなければ、\n引き分けにして別の日にやり直す。"}, {"t": 123.83333333333333, "x": "選手たちはその決まりを知ってたの？"}, {"t": 126.1, "x": "太田は試合のあとにこう話している。"}, {"t": 128.2, "x": "18回で引き分けになることは、初めから知っていた。"}, {"t": 131.56666666666666, "x": "でも「それまでにはケリがつくと思った」。"}, {"t": 134.13333333333333, "x": "まさか本当に18回まで行くとは、思わなかったのね。"}, {"t": 137.71666666666667, "x": "そして、延長に入ってから大きな山が2回来た。"}, {"t": 140.76666666666668, "x": "15回と16回だ。"}, {"t": 143.03333333333333, "x": "18回で引き分けになったのは、この試合が初めて？"}, {"t": 146.5, "x": "いや違う。大会小史の1958年、\n第40回の所を見てほしい。"}, {"t": 151.46666666666667, "x": "準々決勝で、徳島商と魚津が延長18回で\n引き分けて再試合になった、とある。"}, {"t": 157.01666666666668, "x": "11年前にも、18回の引き分けがあったのね。"}, {"t": 160.4, "x": "この年の徳島商の板東投手は、6試合で\n三振を83個取った、と小史にある。"}, {"t": 165.96666666666667, "x": "そうだ。決まりのくわしい移り変わりは、\n延長25回の回で話した。"}, {"t": 170.26666666666668, "x": "ここで大事なのは、1958年は準々決勝だったことだ。"}, {"t": 174.6, "x": "1969年はそれが決勝で起きた。"}, {"t": 177.61666666666667, "x": "だから「決勝で史上初」なのね。"}, {"t": 180.18333333333334, "x": "ああ。決勝の次の日に、もう\n一度決勝をすることになった。"}, {"t": 184.46666666666667, "x": "では15回の裏だ。今回は守る\n松山商の目で追ってみる。"}, {"t": 188.21666666666667, "x": "三沢は先頭の菊池が、三遊間を破るヒットで出た。"}, {"t": 191.68333333333334, "x": "次の打者はバントをした。"}, {"t": 193.1, "x": "打球は小さなフライになった。"}, {"t": 195.0, "x": "サードの谷岡が一度グラブに\n入れたが、落としてしまった。"}, {"t": 198.5, "x": "アウトにできなかったのね。"}, {"t": 200.16666666666666, "x": "これでノーアウト一、二塁。"}, {"t": 201.66666666666666, "x": "次のバントで1アウト二、三塁になった。"}, {"t": 204.45, "x": "1点取られたらその場で負けよね。"}, {"t": 206.65, "x": "そうだ。ここで松山商は次の打者を歩かせた。"}, {"t": 209.8, "x": "わざと満塁にしたの？"}, {"t": 211.36666666666667, "x": "ああ。満塁にすると、どの塁でもアウトが取れる。"}, {"t": 214.26666666666668, "x": "そして9番の立花との勝負を選んだ。"}, {"t": 216.81666666666666, "x": "井上はスクイズを警戒した。\nその結果3ボールになった。"}, {"t": 220.53333333333333, "x": "あと1つボールなら押し出しで負け？"}, {"t": 222.73333333333332, "x": "そうだ。三沢の田辺監督は、このとき\n「これで勝った」と思ったそうだ。"}, {"t": 227.33333333333334, "x": "打席の立花も、あと1球で勝つんだ、という\n思いが頭をよぎったと話している。"}, {"t": 232.28333333333333, "x": "でも井上は、真ん中にストレートを\n投げて3ボール1ストライク。"}, {"t": 236.08333333333334, "x": "立花はここで、三塁側のベンチを見た。"}, {"t": 238.6, "x": "スクイズのサインが出ていないかを見るためだ。"}, {"t": 241.16666666666666, "x": "三沢の監督はスクイズも考えたそうだ。"}, {"t": 243.73333333333332, "x": "でも、松山商のファーストとサードは、\nスクイズに備えて前に出ていた。"}, {"t": 247.98333333333332, "x": "これは難しいと見て、もう\n1球待たせることにした、と話している。"}, {"t": 252.1, "x": "立花もスクイズかと思ったが、\nサインは「待て」だったので待った。"}, {"t": 256.35, "x": "松山商の守りの形が、スクイズを止めたのね。"}, {"t": 259.68333333333334, "x": "5球目は真ん中やや低めに来た。"}, {"t": 261.7, "x": "判定はストライク。"}, {"t": 263.06666666666666, "x": "6球目の打球は、井上のグラブを\nはじいてショートの前に転がった。"}, {"t": 267.05, "x": "立花は、打った瞬間に「抜けた」と思ったそうだ。"}, {"t": 270.51666666666665, "x": "ショートの樋野がうまく拾って、本塁に投げた。"}, {"t": 273.3666666666667, "x": "三塁から走った菊池は、本塁で\nフォースアウトになった。"}, {"t": 276.95, "x": "はじいた打球をショートが助けたのね。"}, {"t": 279.26666666666665, "x": "次の打者の当たりも捕られて、\n15回の裏は0点で終わった。"}, {"t": 283.6, "x": "その5球目、ボールだったら三沢の優勝だったのよね。"}, {"t": 286.98333333333335, "x": "そうだ。だからこの1球はあとで話題になった。"}, {"t": 289.8, "x": "球審は郷司さん。のちに、この1球のことを\n記者の二宮清純に話している。"}, {"t": 294.65, "x": "新聞記者に「低かったのでは」と聞かれたのは、\n試合のあと球場を出てからだった。"}, {"t": 299.68333333333334, "x": "郷司さんは、それまで全く気にしていなかったそうだ。"}, {"t": 303.06666666666666, "x": "言われて初めて気づいたのね。"}, {"t": 304.95, "x": "郷司さんは、井上はかなり\n疲れていた、とも話している。"}, {"t": 308.51666666666665, "x": "ストレートといっても山なりの球だった。"}, {"t": 310.9, "x": "それでも、その1球はひざ元の高さで、\nストライクの所に入っていた。"}, {"t": 315.46666666666664, "x": "その夜はスポーツニュースを全部見たが、\nその1球だけは映っていなかった。"}, {"t": 319.76666666666665, "x": "ビデオで見られたのは、何年もたってからだ。"}, {"t": 322.43333333333334, "x": "見てもやはりストライクだった、と話している。"}, {"t": 325.28333333333336, "x": "審判の人もずっと気にしてたのね。"}, {"t": 327.68333333333334, "x": "郷司さんは、審判は人にほめられることが\nまず無い仕事だ、とも話している。"}, {"t": 332.4, "x": "悪口を言われるのが嫌な人には\n向かない。だからこそやりがいもあると。"}, {"t": 336.4166666666667, "x": "高野連には、この判定に文句を言う\n電話や電報がたくさん来たそうだ。"}, {"t": 340.56666666666666, "x": "再試合の2日後、郷司さんは岩手へ講習に出かけた。"}, {"t": 343.98333333333335, "x": "そこでも会うなり「あれは本当に\nストライクですか？」と聞かれたそうだ。"}, {"t": 348.1, "x": "岩手は北奥羽だから、三沢を応援してた所よね。"}, {"t": 351.43333333333334, "x": "郷司さんは、夏の決勝の球審を13回つとめた。"}, {"t": 354.9166666666667, "x": "2006年に亡くなり、2017年に野球殿堂に入っている。"}, {"t": 359.06666666666666, "x": "決勝をたくさん任された審判さんだったのね。"}, {"t": 362.56666666666666, "x": "16回の裏にも、三沢は1アウト満塁を作った。"}, {"t": 366.0, "x": "また満塁？松山商は2回続けて、\nあと1点の所まで来たのね。"}, {"t": 370.56666666666666, "x": "ああ。今度は三沢がスクイズを仕かけた。"}, {"t": 372.95, "x": "でも松山商はそれを見破った。"}, {"t": 374.98333333333335, "x": "打者の高田は三振。"}, {"t": 376.45, "x": "三塁から走り出していた走者は、\n三塁と本塁の間でアウトになった。"}, {"t": 380.93333333333334, "x": "2つのアウトが一度に取れたのね。"}, {"t": 383.1666666666667, "x": "三沢の田辺監督は、試合のあとにこう話している。"}, {"t": 386.43333333333334, "x": "「15、16回の逸機は私の作戦の失敗です」。"}, {"t": 390.0, "x": "監督さん悔しかったでしょうね。"}, {"t": 392.1, "x": "そして田辺監督は松山商の守りをほめた。"}, {"t": 395.0833333333333, "x": "「松山は本当にうまいチームだ」。"}, {"t": 397.05, "x": "日刊スポーツの紙面は、松山商が土俵ぎわで\n2度、離れ業を見せた、と書いた。"}, {"t": 402.85, "x": "試合は0対0のまま、18回の裏まで進んだ。"}, {"t": 406.18333333333334, "x": "三沢は2アウトで一塁に走者。"}, {"t": 408.06666666666666, "x": "走者は投手の太田だ。"}, {"t": 409.6333333333333, "x": "打席には5番の菊池がいた。"}, {"t": 411.56666666666666, "x": "太田は二塁へ走った。"}, {"t": 413.0, "x": "松山商のキャッチャーの大森が、いい\n球を二塁に投げた。"}, {"t": 416.35, "x": "タッチアウト。ここで試合が終わった。"}, {"t": 418.65, "x": "最後は、キャッチャーの送球で終わったのね。"}, {"t": 421.28333333333336, "x": "日刊スポーツの写真の説明には\n「4時間16分の死闘」とある。"}, {"t": 425.6166666666667, "x": "三沢の太田は、この1日で262球を投げた。"}, {"t": 429.18333333333334, "x": "4時間16分戦って、松山商は\n1点も取られなかったのね。"}, {"t": 433.51666666666665, "x": "ああ。15回と16回の満塁を、どちらも0点で終えた。"}, {"t": 437.18333333333334, "x": "この0対0は守りの0点でもあった。"}, {"t": 440.28333333333336, "x": "試合が終わったあと、選手たちはどうしてたの？"}, {"t": 443.15, "x": "三沢の田辺監督は「いやいや、\nひどい試合でした」と、疲れ切った顔だった。"}, {"t": 448.1, "x": "記事は、優勝旗を九分九厘、手に\nしかけて逃した、と書いている。"}, {"t": 452.0833333333333, "x": "一方の太田はまだ余裕を見せていた。"}, {"t": 454.21666666666664, "x": "「疲れはいまのところ感じていません。でも\n勝ちたかったですね」。"}, {"t": 457.8833333333333, "x": "262球も投げたのに？"}, {"t": 460.0, "x": "ああ。どっちが勝つと思ったかと聞かれて\n「力は互角ですから」と笑ったそうだ。"}, {"t": 464.8833333333333, "x": "三沢の選手は、通路に立ちつくしていたそうだ。"}, {"t": 467.8333333333333, "x": "満塁で打席にいた2人は、こうつぶやいた。"}, {"t" function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;

  const t=el.children[i]; if(!t) return; t.classList.add('on');
