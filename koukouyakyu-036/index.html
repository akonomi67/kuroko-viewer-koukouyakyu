<script>
const D={"name": "1918年の中止", "file": "036_編集用", "dur": 866.5833125, "segs": [], "subs": [{"t": 0.0, "x": "夏の全国大会が開かれなかった\n年って、2020年だけだと思ってたわ。"}, {"t": 5.05, "x": "そう思っている人は多いだろうな。"}, {"t": 6.966666666666667, "x": "でも、日本高野連の「大会小史」には、\n1918年の夏のことがこう書いてある。"}, {"t": 12.816666666666666, "x": "「代表決定後に米騒動で全国大会中止」。"}, {"t": 15.966666666666667, "x": "代表が決まったあとに中止？"}, {"t": 17.9, "x": "ああ。地方の大会は終わっていた。"}, {"t": 19.8, "x": "全国に出る14校も決まっていた。"}, {"t": 22.166666666666668, "x": "それなのに、全国大会だけが開かれなかった。"}, {"t": 25.416666666666668, "x": "14校の選手は、どこまで来ていたの？"}, {"t": 28.066666666666666, "x": "当時の新聞を調べた記事によると、\n14校はもう大阪に入っていた。"}, {"t": 32.4, "x": "練習のようすも新聞に載っていたそうだ。"}, {"t": 34.88333333333333, "x": "雑誌のNumberは、組み合わせの抽選まで\n済んでいたと書いている。"}, {"t": 38.63333333333333, "x": "試合の相手まで決まっていたのね。"}, {"t": 40.733333333333334, "x": "今回は、この1918年の夏を\n記録の言葉と数字で追っていく。"}, {"t": 45.31666666666667, "x": "理由のところは、公式の「米騒動」という\n一言にとどめる。"}, {"t": 49.36666666666667, "x": "見ていくのは4つだ。"}, {"t": 50.68333333333333, "x": "地方の大会と代表の14校。"}, {"t": 52.7, "x": "中止までの日付。そして、記録の表への残り方だ。"}, {"t": 56.333333333333336, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 59.75, "x": "よろしくね。"}, {"t": 61.25, "x": "まず数え方だ。1918年の大会は第4回にあたる。"}, {"t": 65.38333333333334, "x": "第1回は1915年だから、始まって4年目の大会だった。"}, {"t": 69.85, "x": "まだ4回目だったのね。"}, {"t": 71.5, "x": "当時の名前は「全国中等学校優勝野球大会」。"}, {"t": 74.96666666666667, "x": "出ていたのは、旧制の中学校などだ。"}, {"t": 77.5, "x": "日本高野連の出場校一覧には、\n回ごとに「全参加校数」が載っている。"}, {"t": 82.46666666666667, "x": "地方の大会に出た学校の数のことだ。"}, {"t": 85.0, "x": "第1回は73校。第2回は115校。"}, {"t": 87.96666666666667, "x": "第3回は118校。"}, {"t": 89.78333333333333, "x": "そして第4回の1918年は137校だった。"}, {"t": 93.88333333333334, "x": "4年で、ほぼ2倍に増えてるわね。"}, {"t": 96.15, "x": "ああ。73校から137校だから、64校も増えている。"}, {"t": 100.65, "x": "全国に出る代表の数も増えていった。"}, {"t": 103.05, "x": "第1回は10校。第2回と第3回は12校。"}, {"t": 106.25, "x": "そして第4回で14校になった。"}, {"t": 108.66666666666667, "x": "1918年に2つ増えたのはどうして？"}, {"t": 111.68333333333334, "x": "大会小史にはこうある。"}, {"t": 113.16666666666667, "x": "「関東から京浜を分離、甲信大会を\n新設し代表は14校に」。"}, {"t": 117.43333333333334, "x": "関東の大会から、東京と横浜の\nあたりを「京浜大会」として分けた。"}, {"t": 122.23333333333333, "x": "それと、山梨と長野の「甲信大会」を新しく作った。"}, {"t": 126.28333333333333, "x": "地方の大会が2つ増えて、代表も2校増えたわけだ。"}, {"t": 129.85, "x": "大会がどんどん大きくなっていく途中の年だったのね。"}, {"t": 133.18333333333334, "x": "そのあとも代表は増えていく。\nこれも大会小史に書いてある。"}, {"t": 136.73333333333332, "x": "1920年は北海道大会ができて15校。"}, {"t": 140.03333333333333, "x": "1921年は満州と朝鮮の大会ができて17校。"}, {"t": 144.1, "x": "1923年は台湾が加わり、京浜から\n東京を分けて19校になった。"}, {"t": 149.31666666666666, "x": "1918年の14校は、増えていく途中の数だったのね。"}, {"t": 153.63333333333333, "x": "そうだ。代表が14校だったのは、\n1918年と1919年の2回だけだ。"}, {"t": 159.48333333333332, "x": "会場も、前の年に変わったばかりだった。"}, {"t": 162.15, "x": "大会小史によると、1917年の第3回で\n会場を西宮市の鳴尾に移している。"}, {"t": 167.9, "x": "甲子園の球場ができるのは、\n1924年の第10回のときだ。"}, {"t": 172.45, "x": "じゃあ1918年は、まだ甲子園じゃなかったのね。"}, {"t": 176.03333333333333, "x": "ああ。現代ビジネスの記事によると、\n8月14日から鳴尾で5日間の予定だった。"}, {"t": 181.36666666666667, "x": "場所も日にちも決まっていたのね。"}, {"t": 183.96666666666667, "x": "では、代表の14校を見ていく。"}, {"t": 186.15, "x": "日本高野連の出場校一覧には、\n第4回の欄にも14校の名前がある。"}, {"t": 191.1, "x": "中止になった大会でも、名前は残ってるのね。"}, {"t": 194.21666666666667, "x": "そうだ。表の順に、府県と学校の名前を読み上げる。"}, {"t": 197.61666666666667, "x": "岩手の一関中。茨城の竜ヶ崎中。"}, {"t": 200.28333333333333, "x": "東京の慶応普通。新潟の長岡中。"}, {"t": 203.03333333333333, "x": "長野の長野師範。愛知の愛知一中。京都の京都二中。"}, {"t": 206.76666666666668, "x": "大阪の市岡中。兵庫の関西学院中。"}, {"t": 209.5, "x": "和歌山の和歌山中。"}, {"t": 211.03333333333333, "x": "広島の広島商。鳥取の鳥取中。"}, {"t": 213.65, "x": "愛媛の今治中。福岡の中学明善。"}, {"t": 216.61666666666667, "x": "14校とも、違う府県から出てるわね。"}, {"t": 219.36666666666667, "x": "ああ。当時の代表は、府県ではなく\n地区の大会から1校ずつ出ていた。"}, {"t": 223.68333333333334, "x": "現代ビジネスの記事は、\n1918年8月11日の大阪朝日新聞の紙面を写している。"}, {"t": 230.03333333333333, "x": "それによると、東北大会は一関中。"}, {"t": 232.63333333333333, "x": "九州大会は中学明善だ。"}, {"t": 234.76666666666668, "x": "四国大会は今治中。山陰大会は鳥取中だった。"}, {"t": 238.43333333333334, "x": "新しくできた京浜大会は慶応普通。"}, {"t": 240.9, "x": "甲信大会は長野師範が勝った。"}, {"t": 243.3, "x": "新しい2つの大会からも、ちゃんと代表が出てるのね。"}, {"t": 246.9, "x": "残りの8つも同じ記事に並んでいる。"}, {"t": 249.18333333333334, "x": "関東大会は竜ヶ崎中。"}, {"t": 250.86666666666667, "x": "北陸大会は長岡中。東海大会は愛知一中。"}, {"t": 254.31666666666666, "x": "京津大会は京都二中。"}, {"t": 255.93333333333334, "x": "大阪大会は市岡中。兵庫大会は関西学院中。"}, {"t": 259.6166666666667, "x": "山陽大会は広島商。紀和大会は和歌山中だ。"}, {"t": 263.1, "x": "京津とか紀和とかは、いまは聞かない名前ね。"}, {"t": 266.05, "x": "当時は、いくつかの府県を合わせた\n地区で大会を開いていたからだ。"}, {"t": 270.0, "x": "こうして14の地区から14校がそろっていた。"}, {"t": 273.48333333333335, "x": "この14校を、それまでの3回の代表と見比べてみる。"}, {"t": 277.01666666666665, "x": "日本高野連の出場校一覧には、第1回から\n回ごとに代表の名前が並んでいる。"}, {"t": 282.3, "x": "14校のうち11校は、1915年から\n1917年のどこかで代表になっていた。"}, {"t": 288.45, "x": "残りの3校は？"}, {"t": 289.76666666666665, "x": "竜ヶ崎中と長岡中と今治中の3校だ。"}, {"t": 292.8, "x": "この3校は、1918年が初めての代表だった。"}, {"t": 296.75, "x": "初めて全国に出られるはずだった\n年に、中止になったのね。"}, {"t": 300.56666666666666, "x": "竜ヶ崎中は、京浜を分けた\nあとの関東大会を勝っている。"}, {"t": 304.28333333333336, "x": "長岡中は北陸大会、今治中は四国大会の代表だ。"}, {"t": 308.4, "x": "その3校は、そのあと全国に出られたの？"}, {"t": 311.23333333333335, "x": "次の年の1919年の一覧には、\n竜ヶ崎中と長岡中の名前がある。"}, {"t": 316.43333333333334, "x": "2校は1年待って、全国の舞台に立ったことになる。"}, {"t": 319.85, "x": "1919年の愛媛の欄は、今治中ではなく松山商だった。"}, {"t": 324.43333333333334, "x": "1年違いで、出られた学校と\n出られなかった学校に分かれたのね。"}, {"t": 328.56666666666666, "x": "反対に、ずっと代表を続けていた学校もある。"}, {"t": 331.5833333333333, "x": "和歌山中は、第1回の1915年から\n1919年まで5年続けて名前がある。"}, {"t": 337.46666666666664, "x": "その5年の真ん中が1918年だ。"}, {"t": 340.4166666666667, "x": "5年続けて出たのに、1回分は\n試合ができなかったのね。"}, {"t": 344.15, "x": "ああ。記録の上では5年続けての代表だ。でも\n全国で戦えたのは4回になる。"}, {"t": 349.21666666666664, "x": "慶応普通と長野師範も、1916年から\n1919年まで4年続けて代表に入っている。"}, {"t": 355.8, "x": "この2校も4年のうち1年は全国で試合をしていない。"}, {"t": 359.18333333333334, "x": "続けて強かった学校ほど、\n1918年の分が抜けて見えるのね。"}, {"t": 364.43333333333334, "x": "ねえ、14校の中にどこかで\n聞いた名前がまじってない？"}, {"t": 367.9166666666667, "x": "よく気づいたな。\n阪神甲子園球場の「歴代優勝校」と見比べてみよう。"}, {"t": 372.71666666666664, "x": "第1回の優勝は京都二中。"}, {"t": 374.53333333333336, "x": "第2回は慶応普通。第3回は愛知一中だ。"}, {"t": 377.68333333333334, "x": "それまでの優勝校3校が、\n3校とも1918年の代表に入っていた。"}, {"t": 382.9, "x": "それまでの優勝校が、全部そろっていたのね。"}, {"t": 385.85, "x": "負けた側も見てみる。"}, {"t": 387.05, "x": "日本高野連の一覧には、準優勝校も載っている。"}, {"t": 390.46666666666664, "x": "1916年の準優勝は市岡中。"}, {"t": 393.1166666666667, "x": "1917年の準優勝は関西学院中だ。"}, {"t": 396.53333333333336, "x": "この2校も1918年の代表に入っている。"}, {"t": 399.9, "x": "決勝まで行ったことのある学校が5校もいたのね。"}, {"t": 402.96666666666664, "x": "そうだ。それまでの3回の決勝に出た\n6校のうち、5校が1918年にそろっていた。"}, {"t": 408.75, "x": "いなかったのは、1915年の準優勝の秋田中だけだ。"}, {"t": 412.8333333333333, "x": "前の年の決勝の2校も両方いるのね。"}, {"t": 415.5, "x": "ああ。1917年の決勝は、愛知一中が\n関西学院中に1対0で勝った。"}, {"t": 420.93333333333334, "x": "前の年に勝った愛知一中にとっては、\n2連覇がかかる大会でもあった。"}, {"t": 425.23333333333335, "x": "ただ、どの学校が勝ちそうだったかは\n記録からは分からない。"}, {"t": 428.73333333333335, "x": "試合が1つも行われていないからだ。"}, {"t": 431.18333333333334, "x": "そうよね。勝ち負けは、やってみないと\n分からないもの。"}, {"t": 434.95, "x": "ここからは、中止までの日付を追う。"}, {"t": 437.15, "x": "ただし、この日付は公式の小史には書かれていない。"}, {"t": 440.3333333333333, "x": "あとの時代の記事が、\n当時の新聞をもとに書いたものだ。"}, {"t": 443.8333333333333, "x": "公式に載っているのは、「代表決定後に\n米騒動で全国大会中止」だけなのね。"}, {"t": 449.2, "x": "ああ。それを頭に置いて聞いてほしい。"}, {"t": 451.3666666666667, "x": "2020年の和樂webの記事によると、\n8月13日には組み合わせの抽選があった。"}, {"t": 456.73333333333335, "x": "開会の前の日には、練習も行われていた。"}, {"t": 459.76666666666665, "x": "前の日まで、大会をやるつもりで動いていたのね。"}, {"t": 462.85, "x": "そうだ。ところが開会の予定だった\n14日に、方針が「延期」に変わった。"}, {"t": 467.8666666666667, "x": "まずは延期だったの？"}, {"t": 469.3, "x": "ああ。2018年の現代ビジネスの記事も、\n14日は「とりあえず延期」と書いている。"}, {"t": 474.8666666666667, "x": "そして8月16日に、中止が決まった。"}, {"t": 477.78333333333336, "x": "Numberの記事も、中止が決まったのは\n大会直前の8月16日としている。"}, {"t": 482.6666666666667, "x": "選手の安全を保証できないからだと、\n同じ記事にある。"}, {"t": 485.98333333333335, "x": "次の日の8月17日の紙面に、\n「全国野球大会中止」の知らせが出た。"}, {"t": 491.26666666666665, "x": "13日に抽選、14日に延期、\n16日に中止、17日に知らせ。"}, {"t": 496.3333333333333, "x": "たった4日で、話がどんどん変わっていったのね。"}, {"t": 499.45, "x": "そうだ。大会を開いていたのは朝日新聞社だ。"}, {"t": 502.46666666666664, "x": "延期も中止も、朝日新聞社が紙面で知らせた。"}, {"t": 505.6333333333333, "x": "14校 の4年続けての代表の1校だ。"}, {"t": 765.3166666666667, "x": "試合ができなかった次の年に、決勝まで行ったのね。"}, {"t": 768.7333333333333, "x": "ああ。優勝にはあと1歩届かなかった。"}, {"t": 771.8, "x": "最後に、1918年の14校を\nそのあとの優勝校の表と見比べる。"}, {"t": 776.6166666666667, "x": "1920年の第6回は、関西学院中が優勝した。"}, {"t": 780.6666666666666, "x": "1921年と1922年は、和歌山中が2年続けて勝った。"}, {"t": 785.7833333333333, "x": "そして1924年の第10回は、広島商が勝っている。"}, {"t": 789.9666666666667, "x": "甲子園の球場ができた年ね。"}, {"t": 792.1, "x": "そうだ。1918年に鳴尾で戦うはずだった\n学校が、新しい球場で勝った。"}, {"t": 797.7166666666667, "x": "1918年の代表から、あとの優勝校が\nこんなに出てるのね。"}, {"t": 802.1666666666666, "x": "ああ。前に勝っていた3校と、あとで勝った3校だ。"}, {"t": 805.4333333333333, "x": "1918年の14校のうち6校が、\n1924年までの優勝校の表に名前がある。"}, {"t": 811.7166666666667, "x": "14校のうち6校って、強い学校が\nたくさん集まってたのね。"}, {"t": 815.7833333333333, "x": "ただ、1918年の優勝校の欄は\nいまも「米騒動で中止」のままだ。"}, {"t": 820.95, "x": "あの年にどこが勝ったかは、誰にも分からない。"}, {"t": 824.3666666666667, "x": "最初の話に戻るわね。"}, {"t": 825.9333333333333, "x": "開かれなかった夏は、2020年だけじゃなかった。"}, {"t": 829.4333333333333, "x": "ああ。公式の表には、番号があって\n優勝校の名前の無い年が3つある。"}, {"t": 833.9, "x": "いちばん古い1918年は、代表の14校が\n決まってから止まった年だ。"}, {"t": 839.05, "x": "137校が地方の大会を戦って、14校まで\n決まった。それでも開かれなかった。"}, {"t": 844.95, "x": "表の数字は、そこまで残している。"}, {"t": 847.2166666666667, "x": "全参加校数は137。"}, {"t": 849.1666666666666, "x": "代表校数は14。優勝校の欄は、空いたままだ。"}, {"t": 852.5833333333334, "x": "次に歴代優勝校の表を見るときは、\n名前の無い3つの年も見てほしい。"}, {"t": 857.05, "x": "最後まで見てくれて、ありがとう。"}, {"t": 859.0333333333333, "x": "面白かったら、チャンネル登録と\n高評価をよろしく頼む。"}, {"t": 862.65, "x": "第4回の14校、覚えていってね。ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
