<style>

<script>
const D={"name": "平安", "file": "010_編集用", "dur": 942.26665625, "segs": [], "subs": [{"t": 0.0, "x": "1938年の夏。兵庫県の甲子園球場。"}, {"t": 3.7, "x": "第24回の全国中等学校優勝野球大会は、\n決勝を迎えていた。"}, {"t": 8.5, "x": "京都の平安中と、岐阜の岐阜商の対戦だ。"}, {"t": 11.45, "x": "9回の表、平安中は1点を先に奪われた。"}, {"t": 14.833333333333334, "x": "最終回に先に取られたの？"}, {"t": 16.833333333333332, "x": "ああ。だがその裏、平安中は2点を返した。"}, {"t": 19.8, "x": "2対1の逆転サヨナラ勝ちだ。"}, {"t": 21.966666666666665, "x": "決勝でサヨナラって、すごい終わり方ね。"}, {"t": 24.666666666666668, "x": "平安中にとって、これが10回目の出場だった。"}, {"t": 27.85, "x": "それまでに決勝で3回負けていた。"}, {"t": 30.233333333333334, "x": "3回も準優勝してたの？"}, {"t": 32.166666666666664, "x": "そうだ。4度目の決勝で、やっと日本一に届いた。"}, {"t": 35.65, "x": "そしてこの学校は、いま\n春夏の甲子園に76回出ている。"}, {"t": 39.63333333333333, "x": "全国で一番多い数字だ。"}, {"t": 41.583333333333336, "x": "76回って、ちょっと想像がつかないわね。"}, {"t": 45.11666666666667, "x": "でも、そんなに出てる学校でも\n苦しい時代はあったんでしょ？"}, {"t": 48.5, "x": "平安はどうやって、名門であり続けたの？"}, {"t": 51.25, "x": "今回は平安、\nいまの龍谷大平安の野球部の歴史を辿る。"}, {"t": 55.1, "x": "日付と数字をもとに、彦根の学校から\n甲子園の100勝までを見ていくぞ。"}, {"t": 59.6, "x": "チャンネル登録と高評価をお願いします。"}, {"t": 62.18333333333333, "x": "お願いします。"}, {"t": 63.81666666666667, "x": "学校の始まりは1876年だ。"}, {"t": 66.71666666666667, "x": "滋賀県の彦根市で仏教の学校として開かれた。"}, {"t": 69.98333333333333, "x": "京都じゃなくて滋賀から始まったの？"}, {"t": 72.26666666666667, "x": "そうだ。1902年には\n第三仏教中学校という名前になった。"}, {"t": 76.6, "x": "1909年に、京都市のいまの場所へ移っている。"}, {"t": 79.9, "x": "そして1910年に、私立平安中学校が発足した。"}, {"t": 84.06666666666666, "x": "ここで平安の名前が出てくるのね。"}, {"t": 86.3, "x": "校章には本願寺が使った\n紋の形が取り入れられている。"}, {"t": 89.76666666666667, "x": "野球部ができたのはその少し前の1908年だ。"}, {"t": 93.2, "x": "全国大会に初めて出たのは\n1927年の第13回大会になる。"}, {"t": 98.3, "x": "創部から20年近くかかってるのね。"}, {"t": 100.83333333333333, "x": "夏の大会は1915年に\n大阪の豊中グラウンドで始まった。"}, {"t": 105.18333333333334, "x": "甲子園球場に移ったのは、\n1924年の第10回大会からだ。"}, {"t": 109.98333333333333, "x": "じゃあ平安は、最初から甲子園で戦えたのね。"}, {"t": 113.13333333333334, "x": "そうだ。平安の全国大会の歴史は、\n最初から甲子園とともにある。"}, {"t": 117.58333333333333, "x": "ああ。この1927年は大会にとっても節目の年だった。"}, {"t": 121.78333333333333, "x": "大阪の放送局が初めて\n大会の実況をラジオで流したんだ。"}, {"t": 125.81666666666666, "x": "平安の初めての甲子園が、\nラジオで流れた最初の年なのね。"}, {"t": 129.88333333333333, "x": "そういうことだ。そしてここからが速かった。"}, {"t": 133.23333333333332, "x": "初出場の翌年、1928年の第14回大会。"}, {"t": 137.43333333333334, "x": "この年から、出場選手は補欠も\n含めて14人までに決められた。"}, {"t": 141.75, "x": "平安中は決勝まで勝ち上がった。"}, {"t": 143.9, "x": "だが松本商に敗れて準優勝だった。"}, {"t": 146.58333333333334, "x": "2回目の出場でもう決勝なの？"}, {"t": 148.83333333333334, "x": "そうだ。次は1933年の第19回大会だ。"}, {"t": 152.7, "x": "ここでも決勝に進み、中京商に敗れた。"}, {"t": 155.55, "x": "中京商はこの年で夏の3連覇を果たしている。"}, {"t": 158.6, "x": "同じ大会の準決勝では中京商と\n明石中が延長25回を戦った。"}, {"t": 163.43333333333334, "x": "あの延長25回と同じ大会だったの？"}, {"t": 166.15, "x": "そうだ。平安中はその中京商と決勝で当たったわけだ。"}, {"t": 169.91666666666666, "x": "相手が強すぎる年だったのね。"}, {"t": 172.03333333333333, "x": "3回目は1936年の第22回大会。"}, {"t": 175.53333333333333, "x": "この年の甲子園は外野スタンドが\n作り直され、すり鉢の形になった。"}, {"t": 180.03333333333333, "x": "決勝の相手は岐阜商で、また準優勝に終わった。"}, {"t": 183.26666666666668, "x": "3回ともあと1勝で止まってたのね。"}, {"t": 185.7, "x": "そうだ。そして2年後の1938年に、話は冒頭へ戻る。"}, {"t": 190.31666666666666, "x": "この年の大会は戦争の色が\n日ごとに濃くなる中で開かれた。"}, {"t": 194.16666666666666, "x": "高野連の大会の記録には\n武士道精神の宣誓があったと残っている。"}, {"t": 198.43333333333334, "x": "そんな時代の大会だったのね。"}, {"t": 200.53333333333333, "x": "平安中は海草中、大分商、浅野中、高崎商を破った。"}, {"t": 204.8, "x": "決勝で待っていたのは2年前に敗れた岐阜商だ。"}, {"t": 207.9, "x": "前に負けた相手とまた決勝で当たったの？"}, {"t": 210.51666666666668, "x": "ああ。そして9回裏の逆転で、2対1のサヨナラ勝ちだ。"}, {"t": 214.28333333333333, "x": "3回の準優勝のあとにようやく掴んだ初優勝だった。"}, {"t": 217.88333333333333, "x": "負けた相手に勝って日本一って、気持ちいいわね。"}, {"t": 221.0, "x": "京都の学校が夏を制したのは\n1915年の第1回の京都二中以来だった。"}, {"t": 226.2, "x": "第1回以来って、23年ぶりなの？"}, {"t": 228.91666666666666, "x": "そうだ。京都にとっても久しぶりの優勝旗だった。"}, {"t": 232.03333333333333, "x": "だがこのあと大会そのものが止まる。"}, {"t": 234.23333333333332, "x": "1941年から1945年まで夏の大会は開かれなかった。"}, {"t": 239.93333333333334, "x": "戦後、学校は新しい制度で建て直された。"}, {"t": 242.8, "x": "1948年に新制の平安高等学校ができている。"}, {"t": 246.76666666666668, "x": "そして1951年の第33回大会だ。"}, {"t": 250.26666666666668, "x": "この大会の甲子園には\nアルミニウムの大屋根が戻ってきた。"}, {"t": 253.78333333333333, "x": "屋根が戻ってきたの？"}, {"t": 255.31666666666666, "x": "ああ。高野連の記録に、大屋根が復活したとある。"}, {"t": 258.51666666666665, "x": "その屋根の下で、平安は勝ち進んだ。"}, {"t": 261.0833333333333, "x": "希望ヶ丘、松商学園、都島工を破った。"}, {"t": 264.3833333333333, "x": "準決勝の相手は、香川の高松一だ。"}, {"t": 267.1333333333333, "x": "高松一にはのちに怪童と呼ばれる中西太がいた。"}, {"t": 270.71666666666664, "x": "中西太って、どんな選手なの？"}, {"t": 273.23333333333335, "x": "その名の通りの強打者で、のちに\nプロで244本の本塁打を打っている。"}, {"t": 277.9, "x": "平安はその高松一との接戦を制した。"}, {"t": 280.6333333333333, "x": "決勝は埼玉の熊谷を7対4で破った。"}, {"t": 283.53333333333336, "x": "平安にとって戦後初の全国制覇だ。"}, {"t": 286.0833333333333, "x": "この時のエースと捕手は卒業後に\nどちらもプロ入りしている。"}, {"t": 289.6166666666667, "x": "戦前の初優勝から、どれくらいぶり？"}, {"t": 292.21666666666664, "x": "1938年から数えて13年ぶりの日本一だ。"}, {"t": 296.15, "x": "そして5年後、1956年の第38回大会。"}, {"t": 300.15, "x": "この年は、ヘリコプターから\n始球式のボールが落とされた。"}, {"t": 303.6, "x": "5月に夜間照明の塔ができて\n大会初日にはナイターも行われた。"}, {"t": 307.8333333333333, "x": "甲子園がどんどん今の形に近づいてるのね。"}, {"t": 310.76666666666665, "x": "平安は徳島商、滑川、浪華商、西条を破った。"}, {"t": 314.6333333333333, "x": "決勝の相手は、また岐阜商だ。"}, {"t": 316.8666666666667, "x": "また岐阜商なの？"}, {"t": 318.1333333333333, "x": "ああ。決勝で当たるのは、これで3度目になる。"}, {"t": 320.9, "x": "平安は3対2で勝ち、夏の3度目の優勝を果たした。"}, {"t": 324.45, "x": "この時の監督は富樫だ。"}, {"t": 326.28333333333336, "x": "京都の学校の夏の優勝は、これが4度目になる。"}, {"t": 329.45, "x": "そのうち3度が、平安のものだった。"}, {"t": 331.95, "x": "岐阜商とは決勝で、これで2勝1敗なの？"}, {"t": 334.85, "x": "そうだ。だが平安の夏の優勝は\nこの1956年が最後になる。"}, {"t": 340.01666666666665, "x": "1964年、平安は春と夏の甲子園に続けて出た。"}, {"t": 344.15, "x": "その時の捕手が衣笠祥雄だ。"}, {"t": 346.4166666666667, "x": "衣笠って、あのプロ野球の衣笠？"}, {"t": 349.03333333333336, "x": "ああ。のちにプロの広島で活躍した選手だ。"}, {"t": 352.0, "x": "高校3年の衣笠は、その年の甲子園で\n3勝を挙げてベスト8に入っている。"}, {"t": 357.15, "x": "高校の頃から甲子園で勝ってたのね。"}, {"t": 359.6333333333333, "x": "この年の夏の大会は、出場した選手が\nすべて戦後生まれになった年でもある。"}, {"t": 364.68333333333334, "x": "衣笠も戦後生まれってことね。"}, {"t": 366.8, "x": "平安はその後も甲子園に出続けた。"}, {"t": 369.15, "x": "1969年の夏には2年続けて甲子園に出ている。"}, {"t": 373.05, "x": "この年に平安と戦った秋田の横手の地元紙は、\nのちの記事でこう紹介している。"}, {"t": 378.1666666666667, "x": "当時の平安は、23回の出場と\n3回の優勝を誇る京都の名門だった、と。"}, {"t": 383.6166666666667, "x": "その頃から名門って呼ばれてたのね。"}, {"t": 386.0, "x": "だが1990年代の前半には苦しい時代が来ていた。"}, {"t": 389.8333333333333, "x": "のちの監督は当時の平安をこう書いている。"}, {"t": 392.45, "x": "「1990年代前半までの平安は\n『古豪』と言われていました」。"}, {"t": 396.8333333333333, "x": "「甲子園出場もままならず、\n野球部もまとまりに欠け」。"}, {"t": 400.31666666666666, "x": "名門なのに古豪って呼ばれてたの？"}, {"t": 402.53333333333336, "x": "そうだ。昔は強かった学校、という呼ばれ方だな。"}, {"t": 405.9, "x": "この流れを変えたのが1993年に監督になった男だ。"}, {"t": 410.75, "x": "原田英彦。平安のOBだ。"}, {"t": 412.9166666666667, "x": "子どもの頃から平安のファンで、\n中学の頃から平安に憧れていた。"}, {"t": 417.28333333333336, "x": "好きな学校に入ったのね。"}, {"t": 419.18333333333334, "x": "ああ。だが平安での3年間、\n甲子園には一度も出られなかった。"}, {"t": 423.1333333333333, "x": "3年の夏は優勝候補と言われながら、\n京都大会の3回戦で京都商に敗れた。"}, {"t": 428.28333333333336, "x": "負けたあと、平安のファンからは\n厳しい言葉を浴びた。"}, {"t": 431.4166666666667, "x": "原田はのちにこう振り返っている。"}, {"t": 433.4, "x": "「ショックだったですね。"}, {"t": 434.53333333333336, "x": "平安はそういう学校であることは\n感じてはいましたけど」。"}, {"t": 437.93333333333334, "x": "それだけ期待されてる学校ってことね。"}, {"t": 440.45, "x": "卒業後は社会人野球の日本新薬で野球を続けた。"}, {"t": 443.96666666666664, "x": "そして1993年、母校の監督になった。"}, {"t": 447.56666666666666, "x": "好きな学校の監督になれたのね。"}, {"t": 449.93333333333334, "x": "原田は古豪と伝統校の違いをこう書いている。"}, {"t": 452.6666666666667, "x": "「いい伝統は受け継ぎ、悪しき伝統を\n排除し、改善できたかどうか」に尽きる。"}, {"t": 457.4, "x": "古いだけじゃだめってことね。"}, {"t": 459.23333333333335, "x": "そうだ。原田は選手の意識を変えるところから始めた。"}, {"t": 462.6333333333333, "x": "そこから、およそ30年にわたって\n平安を率いることになる。"}, {"t": 466.3833333333333, "x": "甲子園での監督としての勝ち星は、\n2022年までに30を数えた。"}, {"t": 471.0833333333333, "x": "原田はのちに、平安の監督は\n仕事ではなく使命だと語っている。"}, {"t": 475.31666666666666, "x": "仕事じゃなくて使命ってすごい言い方ね。"}, {"t": 477.78333333333336, "x": "それだけ平安という名前が重いということだろう。"}, {"t": 481.18333333333334, "x": "1997年、第79回大会。"}, {"t": 484.4, "x": "平安のエースで4番は、川口知哉だった。"}, {"t": 487.15, "x": "川口は準決勝までの5試合で47個の三振を奪った。"}, {"t": 491.0833333333333, "x": "5試合で47個って、1試合に9個以上ね。"}, {"t": 494.3833333333333, "x": "ああ。平安は41年ぶりに夏の決勝へ進んだ。"}, {"t": 497.75, "x": "川口は強気な言葉でも注目を集めた。"}, {"t": 500.5, "x": "だが決勝は4日続けての登板になっていた。"}, {"t": 503.48333333333335, "x": "4日連続で投げてたの？"}, {"t": 505.26666666666665, "x": "そうだ。決勝の相手は智弁和歌山だった。"}, {"t": 507.95, "x": "智弁和歌山はこの大会で\nチーム打率4割6厘の大会新記録を作っている。"}, {"t": 512.75, "x": "平安は敗れ、準優勝に終わった。"}, {"t": 515.05, "x": "高野連の記録には準優勝は\n4度目の古豪・平安と残っている。"}, {"t": 519.2166666666667, "x": "日本一には届かなかったのね。"}, {"t": 521.4166666666666, "x": "だが原田はこの代をこう書いている。"}, {"t": 523.45, "x": "「川口知哉たちの世代の活躍もあって、平安が\n再び伝統校と呼ばれるようになりました」。"}, {"t": 529.2, "x": "負けた夏が名門に戻るきっかけだったのね。"}, {"t": 532.0833333333334, "x": "川口はその後プロのオリックスに入った。"}, {"t": 535.1833333333333, "x": "2003年、平安は男女共学の学校になった。"}, {"t": 538.45, "x": "2008年には龍谷大学の付属校になり、\n名前が変わった。"}, {"t": 542.4166666666666, "x": "ここから龍谷大平安と呼ばれるようになる。"}, {"t": 545.1666666666666, "x": "名前が長くなったのね。"}, {"t": 546.8833333333333, "x": "2012年の秋には、京都の伏見区に\n野球部の専用グラウンドができた。"}, {"t": 551.4166666666666, "x": "龍谷大平安ボールパークという名前だ。"}, {"t": 554.0, "x": "自分たちだけのグラウンドができたのね。"}, {"t": 556.4333333333333, "x": "ああ。だが翌年の春、悔しい試合があった。"}, {"t": 559.2333333333333, "x": "2013年のセンバツ初戦で、\n早稲田実業に2対4の逆転負けを喫した。"}, {"t": 564.2, "x": "引き揚げる原田にスタンドからヤジが飛んだ。"}, {"t": 566.75, "x": "「原田、お前じゃ勝てんからやめろ」。"}, {"t": 568.9166666666666, "x": "監督に向かってそれはきついわね。"}, {"t": 571.1333333333333, "x": "だが原田はその声を力に変えた。"}, {"t": 573.3666666666667, "x": "「平安には、こうやって一生懸命、\n応援してくれるOBやファンが一杯いる」。"}, {"t": 577.7666666666667, "x": "「そういう人たちのためにも、日本一を目指します」。"}, {"t": 581.05, "x": "怒るんじゃなくて決意したのね。"}, {"t": 583.0666666666667, "x": "そして2014年、第86回のセンバツだ。"}, {"t": 586.3, "x": "平安にとってこれが春夏通算70回目の甲子園だった。"}, {"t": 590.1333333333333, "x": "大島、八戸学院光星を破り、準々決勝は\n桐生第一に延長10回のサヨナラ勝ち。"}, {"t": 595.9, "x": "決勝は大阪の履正社との近畿決戦だ。"}, {"t": 598.6, "x": "京都と大阪の学校が決勝で\n当たるのはセンバツで初めてだった。"}, {"t": 602.5166666666667, "x": "平安は履正社を破り、春の甲子園で\n初めて頂点に立った。"}, {"t": 606.5166666666667, "x": "春は初優勝だったの？"}, {"t": 608.2333333333333, "x": "そうだ。1908年の創部から\n春の優勝はこれが初めてだ。"}, {"t": 612.4166666666666, "x": "夏を含めた全国制覇は1956年から\n数えて58年ぶりになる。"}, {"t": 617.4166666666666, "x": "原田はこう話した。"}, {"t": 618.7666666666667, "x": "「監督という立場を超えて、\n平安ファンとしてホントにうれしい」。"}, {"t": 622.4333333333333, "x": "ファンのまま監督になってファンとして喜んだのね。"}, {"t": 625.5, "x": "この年の夏が近づくと、原田の口からは\n春夏連覇という言葉も出るようになった。"}, {"t": 630.8333333333334, "x": "春に勝ったら、次は夏も狙いたくなるわよね。"}, {"t": 634.4166666666666, "x": "2018年の春、平安に悲しい知らせが届いた。"}, {"t": 637.9166666666666, "x": "OBの衣笠祥雄が4月23日に71歳で亡くなった。"}, {"t": 642.05, "x": "原田はこう話している。"}, {"t": 643.5666666666667, "x": "「優しくて、野球が大好きな方でした」。"}, {"t": 646.2166666666667, "x": "「心のパズルの1つが欠けた感じがある」。"}, {"t": 648.7333333333333, "x": "衣笠は「夏の100回大会を\n楽しみにしている」と言っていたという。"}, {"t": 653.0833333333334, "x": "その夏が、ちょうど100回目の大会だったのね。"}, {"t": 656.1333333333333, "x": "ああ。原田は100回大会で\n甲子園100勝という目標を掲げていた。"}, {"t": 660.2833333333333, "x": "京都大会の準々決勝では乙訓に\n11対0の5回コールドで勝った。"}, {"t": 664.7666666666667, "x": "この頃の原田は選手との向き合い方について\nこう話している。"}, {"t": 668.4, "x": "「時代が時代ですしね。"}, {"t": 669.7333333333333, "x": "昔の感覚では付いてきませんから」。"}, {"t": 672.15, "x": "「選手たちと1日でも長く野球をしたい」。"}, {"t": 674.8666666666667, "x": "長く一緒に野球をしたいって、いい言葉ね。"}, {"t": 677.7, "x": "この100回大会は節目の大会で、開会式には\n皇太子さまと雅子さまが来られた。"}, {"t": 682.95, "x": "甲子園で初めて\n延長13回からのタイブレークも行われている。"}, {"t": 686.9333333333333, "x": "記念の大会に、記念の勝利を重ねたかったのね。"}, {"t": 690.2833333333333, "x": "平安は京都大会の6試合で\n70点を取り、失点は3だった。"}, {"t": 694.5, "x": "4年ぶり34度目の、夏の甲子園だ。"}, {"t": 697.3, "x": "この時、平安は甲子園の春夏通算で99勝していた。"}, {"t": 701.5166666666667, "x": "あと1つで、100勝なのね。"}, {"t": 703.5833333333334, "x": "原田は試合の前からこう言い切っていた。"}, {"t": 705.9, "x": "「100勝は絶対にやらなあきません」。"}, {"t": 707.9333333333333, "x": "2018年8月11日、1回戦の相手は鳥取城北だ。"}, {"t": 712.3666666666667, "x": "平安は先にリードしたが、8回に\n鳥取城北に追いつかれた。"}, {"t": 716.4166666666666, "x": "同点にされちゃったの？"}, {"t": 717.9833333333333, "x": "そうだ。だが9回裏、2アウト3塁から\nレフト前へのサヨナラ打が出た。"}, {"t": 722.35, "x": "3対2。春夏通算の100勝目だ。"}, {"t": 724.9333333333333, "x": "甲子園で初戦を突破したのは、2012年以来だった。"}, {"t": 728.65, "x": "最後の1点で、100勝を決めたのね。"}, {"t": 731.2, "x": "甲子園の春夏通算100勝は、全国で2校目の記録だ。"}, {"t": 735.0833333333334, "x": "原田は涙を流してこう話した。"}, {"t": 737.3, "x": "「センバツで優勝したが、\nこの100勝目を挙げるのが一番しんどかった」。"}, {"t": 741.35, "x": "試合のあとには\n「校歌が歌えなかった」とも話している。"}, {"t": 744.9, "x": "それだけ重い1勝だったのね。"}, {"t": 746.8666666666667, "x": "衣笠のこともこう話している。"}, {"t": 748.8833333333333, "x": "「『よかった。よかったな』と、\nいつもの笑顔で言ってくれると思います」。"}, {"t": 752.9833333333333, "x": "100回目の夏の100勝目、できすぎなくらいね。"}, {"t": 756.6166666666667, "x": "その後も平安は甲子園で戦い続けた。"}, {"t": 759.2666666666667, "x": "2016年の春はベスト4、\n2019年の春はベスト8に進んだ。"}, {"t": 764.05, "x": "春夏の甲子園の出場は、合わせて\n76回。全国で一番多い。"}, {"t": 768.75, "x": "やっぱり、その数字はすごいわね。"}, {"t": 770.95, "x": "2014年のセンバツが70回目だったから、\nそこから6回を積み上げたことになる。"}, {"t": 776.1, "x": "プロに進んだOBも多い。"}, {"t": 777.7, "x": "金田正泰、桧山進次郎、\n炭谷銀仁朗も、平安からプロへ進んだ。"}, {"t": 782.7166666666667, "x": "衣笠に川口に、いろんな時代の選手がいるのね。"}, {"t": 786.1166666666667, "x": "いま監督を務めるのは、\n1997年のエースだった川口知哉だ。"}, {"t": 791.0666666666667, "x": "あの47個の三振の人？"}, {"t": 793.2166666666667, "x": "ああ。準優勝したエースが、\n母校の監督になっている。"}, {"t": 796.6333333333333, "x": "夏の甲子園は2018年の100回大会が\n最後の出場になっている。"}, {"t": 801.1333333333333, "x": "2026年の夏も京都大会の準々決勝で敗れた。"}, {"t": 805.0833333333334, "x": "最多出場の学校でも、甲子園は簡単じゃないのね。"}, {"t": 808.6, "x": "そして2026年、学校は創立150周年を迎えた。"}, {"t": 812.7, "x": "2016年の創立140周年には、甲子園の優勝と\n出場の記念碑も建てられている。"}, {"t": 818.7, "x": "1876年って、明治のはじめごろ？"}, {"t": 821.9333333333333, "x": "明治9年だ。150年の歴史の中で、\n甲子園に76回出てきた学校だ。"}, {"t": 827.8, "x": "結局、平安が名門であり続けたのはなんでなの？"}, {"t": 831.15, "x": "断定はできないが、3つのことが言えるのではないか。"}, {"t": 834.2666666666667, "x": "1つは勝つまで挑み続けてきたことだろう。"}, {"t": 836.9166666666666, "x": "戦前は3回の準優勝のあとに、初めての優勝を掴んだ。"}, {"t": 840.8, "x": "春の優勝も、1908年の創部から\n100年以上かかっている。"}, {"t": 845.1666666666666, "x": "あきらめずに出続けた結果が76回なのね。"}, {"t": 848.3166666666667, "x": "もう1つは応援する人の多さだろう。"}, {"t": 850.5666666666667, "x": "原田も高校の頃は平安を見て育ったファンだった。"}, {"t": 853.6833333333333, "x": "ヤジを飛ばしたのも勝ってほしいと願うファンだ。"}, {"t": 856.3, "x": "その声を受け止めて、日本一を\n目指すと決めたのも原田だった。"}, {"t": 860.3166666666667, "x": "厳しいファンと、ファンだった監督がいたのね。"}, {"t": 863.1666666666666, "x": "見ている人が多い学校ほど\n負けたときの声も大きくなる。"}, {"t": 866.5166666666667, "x": "その重さを知っている人が\n監督をしてきたのは大きいはずだ。"}, {"t": 870.0666666666667, "x": "原田は自分で、監督は\n仕事ではなく使命だと言っていた。"}, {"t": 873.6166666666667, "x": "100回大会の100勝も、\nその言葉の通りの1勝だったのだろう。"}, {"t": 877.7166666666667, "x": "言われる側から、背負う側になったってことね。"}, {"t": 880.5833333333334, "x": "そしてもう1つ、平安は負けた\n試合を次につなげてきた。"}, {"t": 884.2, "x": "1997年の準優勝は、古豪から\n伝統校へ戻るきっかけになった。"}, {"t": 889.1666666666666, "x": "2013年の逆転負けとヤジは、\n翌年の春の初優勝につながった。"}, {"t": 893.95, "x": "悔しい負けを、ちゃんと次の勝ちに変えてきたのね。"}, {"t": 897.0666666666667, "x": "1876年から150年。"}, {"t": 899.5166666666667, "x": "甲子園の76回は、その積み重ねの数なのだろう。"}, {"t": 903.1166666666667, "x": "原田の言葉で言えば、いい伝統を\n受け継いで悪い伝統を変えたことだ。"}, {"t": 907.7166666666667, "x": "最初の問いに戻るわね。"}, {"t": 909.1333333333333, "x": "平安はどうやって、名門であり続けたの？"}, {"t": 911.9333333333333, "x": "答えは、負けた試合を\n負けたままで終わらせなかったことだと思う。"}, {"t": 915.6666666666666, "x": "決勝で3回負けて、4度目で日本一。"}, {"t": 918.3333333333334, "x": "2013年に逆転で負けて、翌年の春に初優勝だ。"}, {"t": 922.4833333333333, "x": "1997年に決勝で負けたエースも、\nいまは監督として戻ってきてるのね。"}, {"t": 927.8666666666667, "x": "ただ、夏の甲子園は2018年の100勝目の\nあと、まだ出られていない。"}, {"t": 932.4166666666666, "x": "76回の次の1回は、今度は\n川口の手に預けられている。"}, {"t": 936.5833333333334, "x": "準優勝のエースが、監督として甲子園に\n帰ってくる夏。その日を待ってるわ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
