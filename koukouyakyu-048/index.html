<style>

<script>
const D={"name": "柳井", "file": "048_編集用", "dur": 715.3333125, "segs": [], "subs": [{"t": 0.0, "x": "今回は山口の学校の話よね。"}, {"t": 2.5, "x": "ああ。1958年の夏の甲子園から始めよう。"}, {"t": 6.066666666666666, "x": "この夏は40回目の記念の大会だった。"}, {"t": 8.833333333333334, "x": "地方大会に出た学校は全国で1807校あった。"}, {"t": 12.4, "x": "甲子園に来たのは47校。"}, {"t": 14.266666666666667, "x": "都道府県から1校ずつと沖縄の代表だ。"}, {"t": 17.166666666666668, "x": "記念の大会だからいつもより多かったのね。"}, {"t": 19.916666666666668, "x": "そうだ。山口の代表は県立の柳井高校だった。"}, {"t": 23.25, "x": "柳井はこの夏、6つ続けて勝って優勝した。"}, {"t": 26.433333333333334, "x": "6試合も勝ったのね。"}, {"t": 28.0, "x": "それだけでは終わらない。"}, {"t": 29.216666666666665, "x": "14年後の1972年の夏にも、柳井は決勝まで来ている。"}, {"t": 33.9, "x": "へえ。同じ学校がまた決勝に来たの？"}, {"t": 36.56666666666667, "x": "そこで問題だ。"}, {"t": 37.7, "x": "柳井は夏の甲子園でいちばん\n多いときで何試合続けて勝ったと思う？"}, {"t": 41.86666666666667, "x": "うーん。優勝した夏の6試合じゃないの？"}, {"t": 44.46666666666667, "x": "答えは最後に言う。"}, {"t": 45.65, "x": "今回は白壁の町の県立高校が、夏の甲子園で\n積み上げた勝ちを、点の表で数えていく。"}, {"t": 51.483333333333334, "x": "始める前にチャンネル登録と高評価をお願いしたい。"}, {"t": 54.71666666666667, "x": "よろしくね。"}, {"t": 56.21666666666667, "x": "柳井が甲子園に初めて来たのはいつなの？"}, {"t": 58.916666666666664, "x": "1925年の夏だ。そのころの名前は柳井中だった。"}, {"t": 62.85, "x": "この夏の代表は全部で21校だった。"}, {"t": 65.48333333333333, "x": "大会小史によると、この夏は大阪の放送局が\n試合の様子を初めてラジオで伝えた。"}, {"t": 70.98333333333333, "x": "ラジオで野球を聞けるようになった年なのね。"}, {"t": 73.66666666666667, "x": "最初の試合の相手は朝鮮の代表の釜山中だった。"}, {"t": 77.03333333333333, "x": "朝鮮からも代表が来ていたのね。"}, {"t": 79.28333333333333, "x": "ああ。日本高野連の表にも\n朝鮮の欄に釜山中が載っている。"}, {"t": 83.11666666666666, "x": "柳井中はこの試合に、4対3で勝った。"}, {"t": 85.83333333333333, "x": "次の準々決勝は兵庫の第一神港商に、1対5で負けた。"}, {"t": 89.86666666666666, "x": "この夏に優勝したのは香川の高松商だ。"}, {"t": 92.7, "x": "大会小史は初めて四国へ優勝旗、と書いている。"}, {"t": 96.01666666666667, "x": "最初の甲子園でもう1つ勝ったのね。"}, {"t": 98.51666666666667, "x": "1926年には、春のセンバツにも来た。"}, {"t": 101.76666666666667, "x": "このころのセンバツは、16校の大会だった。"}, {"t": 104.7, "x": "1回戦は神奈川の横浜商に8対0。"}, {"t": 107.55, "x": "準々決勝は東京の早稲田実に3対1で勝った。"}, {"t": 110.98333333333333, "x": "4強まで来たのね！"}, {"t": 112.48333333333333, "x": "準決勝は広島の広陵中だ。"}, {"t": 114.53333333333333, "x": "延長10回、4対5で負けた。"}, {"t": 116.75, "x": "広陵中はこの春に優勝している。"}, {"t": 119.08333333333333, "x": "あと少しで決勝だったのね。"}, {"t": 121.06666666666666, "x": "その年の夏も甲子園に来たが、\n1回戦で早稲田実に0対3で負けた。"}, {"t": 125.8, "x": "1928年の春は、1回戦で\n和歌山中に2対7で負けている。"}, {"t": 131.21666666666667, "x": "そのあとはしばらく来ていないの？"}, {"t": 133.18333333333334, "x": "次は戦争のあとだ。"}, {"t": 134.61666666666667, "x": "1948年、学校の決まりが変わって\n大会の名前も高校の大会になった。"}, {"t": 140.0, "x": "柳井中も柳井高校として甲子園に来た。"}, {"t": 142.66666666666666, "x": "この夏は2回戦で高知の高知商に4対8で負けた。"}, {"t": 146.26666666666668, "x": "高知商ね。覚えておくわ。"}, {"t": 148.15, "x": "ああ。この学校とはこのあと2回当たる。"}, {"t": 150.55, "x": "1949年の夏は、2回戦で京都の平安に5対4で勝った。"}, {"t": 155.3, "x": "準々決勝は岐阜の岐阜だ。"}, {"t": 156.98333333333332, "x": "延長10回、4対8で負けた。"}, {"t": 159.36666666666667, "x": "この岐阜は決勝まで進んで準優勝した。"}, {"t": 162.0, "x": "優勝は神奈川の湘南だ。"}, {"t": 163.65, "x": "前に1校の回でやった学校だ。"}, {"t": 165.91666666666666, "x": "負けた相手が決勝まで行っていたのね。"}, {"t": 168.3, "x": "1953年の春は、兵庫の育英に2対1で勝った。"}, {"t": 172.3, "x": "準々決勝は京都の伏見に延長11回、1対2で負けた。"}, {"t": 176.33333333333334, "x": "1957年の春は、宮城の東北に4対0で勝った。"}, {"t": 180.51666666666668, "x": "準々決勝はまた早稲田実だ。0対4で負けた。"}, {"t": 183.98333333333332, "x": "早稲田実とはこれで3回目ね。"}, {"t": 186.13333333333333, "x": "そうだ。この春の優勝は早稲田実だった。"}, {"t": 188.93333333333334, "x": "柳井はいいところまで行くけど、届かないのね。"}, {"t": 191.76666666666668, "x": "ここまで延長の試合は3回あって、3回とも負けている。"}, {"t": 195.3, "x": "2018年のデイリースポーツの記事は、\nこのころをこう書いている。"}, {"t": 199.11666666666667, "x": "山口県勢は1950年代ごろまでは、\n柳井と下関商が中心だった。"}, {"t": 204.46666666666667, "x": "下関商って前に1校の回でやった学校ね。"}, {"t": 207.65, "x": "そうだ。その2校が山口を引っぱっていた時代だ。"}, {"t": 211.41666666666666, "x": "そして1958年の夏だ。"}, {"t": 213.88333333333333, "x": "大会小史によると、この夏は\n甲子園と西宮の2つの球場を使った。"}, {"t": 218.6, "x": "沖縄の首里も代表として来ている。"}, {"t": 220.96666666666667, "x": "47校もいると、球場が1つでは足りないのね。"}, {"t": 224.41666666666666, "x": "柳井の1回戦は北海道の札幌商だ。"}, {"t": 227.13333333333333, "x": "3回に1点、5回に1点。2対0で勝った。"}, {"t": 230.283333333333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
