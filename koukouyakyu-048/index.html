<style>

<script>
const D={"name": "柳井", "file": "048_編集用", "dur": 715.0333125, "segs": [], "subs": [{"t": 0.0, "x": "今回は山口の学校の話よね。"}, {"t": 2.5, "x": "ああ。1958年の夏の甲子園から始めよう。"}, {"t": 6.066666666666666, "x": "この夏は40回目の記念の大会だった。"}, {"t": 8.833333333333334, "x": "地方大会に出た学校は全国で1807校あった。"}, {"t": 12.4, "x": "甲子園に来たのは47校。"}, {"t": 14.266666666666667, "x": "都道府県から1校ずつと沖縄の代表だ。"}, {"t": 17.166666666666668, "x": "記念の大会だからいつもより多かったのね。"}, {"t": 19.916666666666668, "x": "そうだ。山口の代表は県立の柳井高校だった。"}, {"t": 23.25, "x": "柳井はこの夏、6つ続けて勝って優勝した。"}, {"t": 26.433333333333334, "x": "6試合も勝ったのね。"}, {"t": 28.0, "x": "それだけでは終わらない。"}, {"t": 29.216666666666665, "x": "14年後の1972年の夏にも、柳井は決勝まで来ている。"}, {"t": 33.9, "x": "へえ。同じ学校がまた決勝に来たの？"}, {"t": 36.56666666666667, "x": "そこで問題だ。"}, {"t": 37.7, "x": "柳井は夏の甲子園でいちばん\n多いときで何試合続けて勝ったと思う？"}, {"t": 41.86666666666667, "x": "うーん。優勝した夏の6試合じゃないの？"}, {"t": 44.46666666666667, "x": "答えは最後に言う。"}, {"t": 45.65, "x": "今回は白壁の町の県立高校が、夏の甲子園で\n積み上げた勝ちを、点の表で数えていく。"}, {"t": 51.483333333333334, "x": "始める前にチャンネル登録と高評価をお願いしたい。"}, {"t": 54.71666666666667, "x": "よろしくね。"}, {"t": 56.21666666666667, "x": "柳井が甲子園に初めて来たのはいつなの？"}, {"t": 58.916666666666664, "x": "1925年の夏だ。そのころの名前は柳井中だった。"}, {"t": 62.85, "x": "この夏の代表は全部で21校だった。"}, {"t": 65.48333333333333, "x": "大会小史によると、この夏は大阪の放送局が\n試合の様子を初めてラジオで伝えた。"}, {"t": 70.98333333333333, "x": "ラジオで野球を聞けるようになった年なのね。"}, {"t": 73.66666666666667, "x": "最初の試合の相手は朝鮮の代表の釜山中だった。"}, {"t": 77.03333333333333, "x": "朝鮮からも代表が来ていたのね。"}, {"t": 79.28333333333333, "x": "ああ。日本高野連の表にも\n朝鮮の欄に釜山中が載っている。"}, {"t": 83.05, "x": "柳井中はこの試合に、4対3で勝った。"}, {"t": 85.76666666666667, "x": "次の準々決勝は兵庫の第一神港商に、1対5で負けた。"}, {"t": 89.8, "x": "この夏に優勝したのは香川の高松商だ。"}, {"t": 92.63333333333334, "x": "大会小史は初めて四国へ優勝旗、と書いている。"}, {"t": 95.95, "x": "最初の甲子園でもう1つ勝ったのね。"}, {"t": 98.45, "x": "1926年には、春のセンバツにも来た。"}, {"t": 101.7, "x": "このころのセンバツは、16校の大会だった。"}, {"t": 104.63333333333334, "x": "1回戦は神奈川の横浜商に8対0。"}, {"t": 107.48333333333333, "x": "準々決勝は東京の早稲田実に3対1で勝った。"}, {"t": 110.91666666666667, "x": "4強まで来たのね！"}, {"t": 112.41666666666667, "x": "準決勝は広島の広陵中だ。"}, {"t": 114.45, "x": "延長10回、4対5で負けた。"}, {"t": 116.68333333333334, "x": "広陵中はこの春に優勝している。"}, {"t": 119.01666666666667, "x": "あと少しで決勝だったのね。"}, {"t": 121.0, "x": "その年の夏も甲子園に来たが、\n1回戦で早稲田実に0対3で負けた。"}, {"t": 125.73333333333333, "x": "1928年の春は、1回戦で\n和歌山中に2対7で負けている。"}, {"t": 131.15, "x": "そのあとはしばらく来ていないの？"}, {"t": 133.11666666666667, "x": "次は戦争のあとだ。"}, {"t": 134.55, "x": "1948年、学校の決まりが変わって\n大会の名前も高校の大会になった。"}, {"t": 139.93333333333334, "x": "柳井中も柳井高校として甲子園に来た。"}, {"t": 142.6, "x": "この夏は2回戦で高知の高知商に4対8で負けた。"}, {"t": 146.2, "x": "高知商ね。覚えておくわ。"}, {"t": 148.08333333333334, "x": "ああ。この学校とはこのあと2回当たる。"}, {"t": 150.48333333333332, "x": "1949年の夏は、2回戦で京都の平安に5対4で勝った。"}, {"t": 155.23333333333332, "x": "準々決勝は岐阜の岐阜だ。"}, {"t": 156.93333333333334, "x": "延長10回、4対8で負けた。"}, {"t": 159.3, "x": "この岐阜は決勝まで進んで準優勝した。"}, {"t": 161.93333333333334, "x": "優勝は神奈川の湘南だ。"}, {"t": 163.56666666666666, "x": "前に1校の回でやった学校だ。"}, {"t": 165.85, "x": "負けた相手が決勝まで行っていたのね。"}, {"t": 168.25, "x": "1953年の春は、兵庫の育英に2対1で勝った。"}, {"t": 172.23333333333332, "x": "準々決勝は京都の伏見に延長11回、1対2で負けた。"}, {"t": 176.26666666666668, "x": "1957年の春は、宮城の東北に4対0で勝った。"}, {"t": 180.45, "x": "準々決勝はまた早稲田実だ。0対4で負けた。"}, {"t": 183.91666666666666, "x": "早稲田実とはこれで3回目ね。"}, {"t": 186.06666666666666, "x": "そうだ。この春の優勝は早稲田実だった。"}, {"t": 188.86666666666667, "x": "柳井はいいところまで行くけど、届かないのね。"}, {"t": 191.7, "x": "ここまで延長の試合は3回あって、3回とも負けている。"}, {"t": 195.23333333333332, "x": "2018年のデイリースポーツの記事は、\nこのころをこう書いている。"}, {"t": 199.05, "x": "山口県勢は1950年代ごろまでは、\n柳井と下関商が中心だった。"}, {"t": 204.4, "x": "下関商って前に1校の回でやった学校ね。"}, {"t": 207.58333333333334, "x": "そうだ。その2校が山口を引っぱっていた時代だ。"}, {"t": 211.35, "x": "そして1958年の夏だ。"}, {"t": 213.81666666666666, "x": "大会小史によると、この夏は\n甲子園と西宮の2つの球場を使った。"}, {"t": 218.53333333333333, "x": "沖縄の首里も代表として来ている。"}, {"t": 220.9, "x": "47校もいると、球場が1つでは足りないのね。"}, {"t": 224.35, "x": "柳井の1回戦は北海道の札幌商だ。"}, {"t": 227.06666666666666, "x": "3回に1点、5回に1点。2対0で勝った。"}, {"t": 230.21666666666667, "x": "2回戦は鳥取の鳥取西。"}, {"t": 232.25, "x": "3回に取った1点を、最後まで守った。1対0だ。"}, {"t": 236.01666666666668, "x": "2試合とも、相手に1点もあげていないのね。"}, {"t": 238.86666666666667, "x": "3回戦は宮崎の大淀だった。"}, {"t": 241.05, "x": "柳井は1回に1点、6回に1点、7回に2点を取った。"}, {"t": 244.93333333333334, "x": "大淀は4回に1点、8回に2点を返した。"}, {"t": 247.96666666666667, "x": "4対3。1点差で逃げ切った。"}, {"t": 250.26666666666668, "x": "最後はひやひやね。"}, {"t": 252.18333333333334, "x": "準々決勝は和歌山の海南だった。"}, {"t": 254.58333333333334, "x": "海南は1回に2点、3回に1点を取った。"}, {"t": 257.6666666666667, "x": "いきなり3点も取られたのね。"}, {"t": 259.6333333333333, "x": "でも柳井は3回、4回、5回と1点ずつ返した。"}, {"t": 263.1166666666667, "x": "5回で3対3。追いついた。"}, {"t": 265.05, "x": "そして7回に1点を取って、4対3で勝ち越した。"}, {"t": 268.6166666666667, "x": "負けている所からひっくり返したのね。"}, {"t": 271.1666666666667, "x": "準決勝の相手は高知の高知商だ。"}, {"t": 273.6333333333333, "x": "あっ、10年前に負けた学校ね。"}, {"t": 276.0, "x": "そうだ。この試合は7回までどちらも0点だった。"}, {"t": 279.1166666666667, "x": "8回に柳井が1点を取った。"}, {"t": 281.06666666666666, "x": "その1点を守って、1対0で勝った。"}, {"t": 283.8333333333333, "x": "1点だけで勝っちゃったのね。"}, {"t": 285.7, "x": "これで決勝だ。ここまで5試合で、\n1点差の勝ちが4つある。"}, {"t": 290.1, "x": "決勝の相手はどこだったの？"}, {"t": 291.96666666666664, "x": "徳島の徳島商だ。"}, {"t": 293.5833333333333, "x": "徳島商は準々決勝で富山の魚津と\n延長18回を引き分けた。"}, {"t": 297.8333333333333, "x": "次の日の再試合で、3対1で勝っている。"}, {"t": 300.75, "x": "18回！ その話、前にも聞いた気がするわ。"}, {"t": 304.0, "x": "怪物と呼ばれた投手の回でやった。"}, {"t": 306.21666666666664, "x": "大会小史は、徳島商のエースが6試合で\n三振を83個取ったと書いている。"}, {"t": 311.3833333333333, "x": "そんな投手が相手だったのね。"}, {"t": 313.31666666666666, "x": "徳島商の勝ち上がりも見ておこう。"}, {"t": 315.43333333333334, "x": "2回戦は秋田の秋田商に3対0。"}, {"t": 317.76666666666665, "x": "3回戦は福岡の八女に3対1。"}, {"t": 320.25, "x": "準決勝は栃木の作新学院に4対1で勝っていた。"}, {"t": 323.8833333333333, "x": "向こうもほとんど点を取られていないのね。"}, {"t": 326.25, "x": "ところが決勝は思わぬ点差になった。"}, {"t": 328.6, "x": "柳井は2回に3点を取った。"}, {"t": 330.53333333333336, "x": "4回にも1点を足した。"}, {"t": 332.23333333333335, "x": "8回には、もう3点を取った。"}, {"t": 334.31666666666666, "x": "徳島商は最後まで1点も取れなかった。"}, {"t": 336.95, "x": "7対0。柳井の優勝だ。"}, {"t": 339.0833333333333, "x": "それまで1点差ばかりだったのに、\n決勝は大差だったのね！"}, {"t": 342.75, "x": "7点は、この夏の柳井の6試合でいちばん多い点だ。"}, {"t": 346.1666666666667, "x": "日本高野連の表でも第40回の優勝は\n柳井、準優勝は徳島商、7対0とある。"}, {"t": 352.46666666666664, "x": "優勝旗にも何か話があるの？"}, {"t": 354.65, "x": "ある。大会小史にはこう書いてある。"}, {"t": 356.81666666666666, "x": "傷みがひどいため新調された大優勝旗は柳井に。"}, {"t": 360.0, "x": "新しく作った旗を最初に受け取ったのが柳井なのね。"}, {"t": 363.48333333333335, "x": "そうだ。6試合の点をまとめると、\n取った点が19点、取られた点が6点だ。"}, {"t": 368.5, "x": "6試合のうち4試合は、相手を0点に抑えた。"}, {"t": 371.65, "x": "守りの強いチームだったのね。"}, {"t": 373.6166666666667, "x": "2018年のデイリースポーツの記事は、\nこの優勝をこう書いている。"}, {"t": 377.55, "x": "県勢初、現在でも唯一となる夏の優勝。"}, {"t": 380.73333333333335, "x": "山口の学校の夏の優勝はこれだけなの？"}, {"t": 383.6333333333333, "x": "日本高野連の大会小史で、\n2019年から2026年の優勝校も見た。"}, {"t": 388.85, "x": "その中に山口の学校はない。"}, {"t": 390.9, "x": "2022年は山口の下関国際が決勝まで\n進んだが、宮城の仙台育英に1対8で負けた。"}, {"t": 397.6166666666667, "x": "じゃあいまも柳井の1回だけなのね。"}, {"t": 400.3333333333333, "x": "そのあと柳井はすぐに甲子園に戻ってきたの？"}, {"t": 403.21666666666664, "x": "次の夏の甲子園は、14年後の1972年だ。"}, {"t": 407.21666666666664, "x": "14年も来なかったの？"}, {"t": 408.9166666666667, "x": "1958年の47校は、記念の大会だけの数だった。"}, {"t": 413.4, "x": "大会小史では次の1959年の代表は29校に減っている。"}, {"t": 418.0, "x": "日本高野連の表を見ると、山口の欄に\n学校の名前が載っていない夏が何度もある。"}, {"t": 423.21666666666664, "x": "ふだんの年は甲子園に来るのも大変だったのね。"}, {"t": 426.3, "x": "この夏の代表は30校。"}, {"t": 428.01666666666665, "x": "地方大会には2614校が出ていた。"}, {"t": 431.01666666666665, "x": "1回戦は山梨の峡南。"}, {"t": 432.6666666666667, "x": "1回に3点を取って、3対0で勝った。"}, {"t": 435.56666666666666, "x": "2回戦は石川の星稜だ。"}, {"t": 437.46666666666664, "x": "6回まで0対0だったが、7回に4点を取った。"}, {"t": 440.8833333333333, "x": "5対1で勝った。"}, {"t": 442.21666666666664, "x": "7回にまとめて取ったのね。"}, {"t": 444.18333333333334, "x": "準々決勝は香川の高松一だった。"}, {"t": 446.76666666666665, "x": "4回まで1対2で負けていた。"}, {"t": 448.8, "x": "7回に3点を取って逆転した。"}, {"t": 451.05, "x": "高松一も7回に1点を返したが、4対3で勝った。"}, {"t": 454.96666666666664, "x": "またひっくり返したのね！"}, {"t": 456.7, "x": "準決勝の相手はまた高知商だ。"}, {"t": 459.0, "x": "3回目の高知商ね！"}, {"t": 460.65, "x": "柳井は1回に1点、3回に2点、7回に4点を取った。"}, {"t": 464 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
