<script>
const D={"name": "駒大苫小牧", "file": "004_編集用", "dur": 952.8833125, "segs": [], "subs": [{"t": 0.0, "x": "2004年8月22日。"}, {"t": 1.85, "x": "兵庫県の甲子園球場。"}, {"t": 3.6333333333333333, "x": "夏の全国高校野球は、決勝の9回表を迎えていた。"}, {"t": 7.35, "x": "スコアは13対10。"}, {"t": 8.633333333333333, "x": "守っているのは、北海道の駒大苫小牧だ。"}, {"t": 11.683333333333334, "x": "打席には、愛媛の済美の4番、鵜久森が入った。"}, {"t": 15.166666666666666, "x": "最後に一番怖い打者が回ってきたのね。"}, {"t": 17.866666666666667, "x": "ああ。駒大苫小牧の投手は、\nその鵜久森を打ち取った。"}, {"t": 21.4, "x": "試合が終わったのは午後3時55分だ。"}, {"t": 23.833333333333332, "x": "試合時間は2時間54分。"}, {"t": 25.683333333333334, "x": "13対10で駒大苫小牧の優勝だった。"}, {"t": 28.733333333333334, "x": "北海道の学校が、夏の甲子園で勝ったのね。"}, {"t": 31.966666666666665, "x": "そうだ。北海道の学校が全国の頂点に\n立つのは、春夏を通じて初めてだった。"}, {"t": 37.333333333333336, "x": "札幌地区では、テレビの瞬間最高視聴率が\n46.2％を記録している。"}, {"t": 42.6, "x": "北海道新聞は、東北より北の学校が春夏を\n通じて初めて甲子園を制したと書いた。"}, {"t": 48.266666666666666, "x": "次の日の北海道新聞は、1面にこう書いた。"}, {"t": 51.38333333333333, "x": "「駒苫優勝　大旗初の海峡越え」。"}, {"t": 53.983333333333334, "x": "海峡って津軽海峡のこと？"}, {"t": 56.03333333333333, "x": "そうだ。深紅の大優勝旗が、\n初めて津軽海峡を渡ったんだ。"}, {"t": 60.75, "x": "でも、北海道って冬は雪で練習できないわよね。"}, {"t": 63.93333333333333, "x": "どうして、そんな北国の学校が勝てたのかしら？"}, {"t": 67.13333333333334, "x": "今回はそこを追う。"}, {"t": 68.31666666666666, "x": "駒大苫小牧は、夏の甲子園で\n優勝、優勝、準優勝を続けた。"}, {"t": 72.98333333333333, "x": "北海道では、この3年間を「2.9連覇」と呼んでいる。"}, {"t": 76.98333333333333, "x": "2.9ってほとんど3連覇じゃない。"}, {"t": 79.26666666666667, "x": "ああ。あと1歩で3連覇だった。"}, {"t": 81.28333333333333, "x": "その3年間がどうやって生まれ、どう終わったのか。"}, {"t": 84.23333333333333, "x": "日付と点数をもとに順番に見ていく。"}, {"t": 86.68333333333334, "x": "最後まで見てもらえたらうれしい。"}, {"t": 88.48333333333333, "x": "本編の前に、チャンネル登録と\n高評価をお願いしたい。"}, {"t": 92.48333333333333, "x": "まず2004年より前の話をしておく。"}, {"t": 94.9, "x": "高校野球には、昔からこんな言い方がある。"}, {"t": 97.75, "x": "「優勝旗は白河の関を越えない」。"}, {"t": 99.93333333333334, "x": "白河の関ってどこにあるの？"}, {"t": 101.93333333333334, "x": "福島県の白河だ。東北の入口にあたる。"}, {"t": 105.01666666666667, "x": "つまり、東北より北の学校は\n優勝できないという意味だ。"}, {"t": 108.5, "x": "日本高野連の「大会の歩み」にも、\nこの言葉が出てくる。"}, {"t": 112.33333333333333, "x": "2003年の夏、宮城の東北が\n決勝で常総学院に敗れた。"}, {"t": 116.53333333333333, "x": "高野連はその年をこう書いている。"}, {"t": 118.55, "x": "「またも、大優勝旗は白河越えを果たせず」。"}, {"t": 121.38333333333334, "x": "東北でも越えられなかったのね。"}, {"t": 123.45, "x": "北海道はさらにその先だ。"}, {"t": 125.33333333333333, "x": "それまでの北海道の最高成績は、\n北海高校が持っていた。"}, {"t": 129.28333333333333, "x": "1928年夏のベスト4と、1963年春の準優勝だ。"}, {"t": 134.66666666666666, "x": "夏のベスト4は、1928年が最後だったの？"}, {"t": 138.46666666666667, "x": "ああ。2004年に駒大苫小牧が\n勝ち進むまで、76年あいていた。"}, {"t": 143.13333333333333, "x": "ところが2004年の高野連の記録には、こうある。"}, {"t": 146.16666666666666, "x": "「大優勝旗が一気に津軽海峡を\n越え、北の大地に渡った」。"}, {"t": 150.1, "x": "白河の関を飛び越えて、いきなり\n北海道まで行ったのね。"}, {"t": 154.28333333333333, "x": "駒大苫小牧の正式な名前は、\n駒澤大学附属苫小牧高等学校。"}, {"t": 159.06666666666666, "x": "場所は北海道苫小牧市の美園町だ。"}, {"t": 161.63333333333333, "x": "学校の沿革では、1964年4月に\n開校式と最初の入学式を行っている。"}, {"t": 167.46666666666667, "x": "野球部は、1966年の夏に甲子園へ初めて出た。"}, {"t": 171.55, "x": "このときは初戦で敗れている。"}, {"t": 173.48333333333332, "x": "開校して3年目に甲子園に出たのね。"}, {"t": 176.11666666666667, "x": "ああ。ただ、その後は夏の甲子園から遠ざかった。"}, {"t": 179.26666666666668, "x": "流れが変わるのは1995年だ。"}, {"t": 181.9, "x": "佐賀県から、1人の若い指導者がやってきた。"}, {"t": 184.85, "x": "香田誉士史だ。"}, {"t": 186.1, "x": "佐賀の人が北海道に来たの？"}, {"t": 188.25, "x": "そうだ。香田は佐賀商から駒澤大学に進んだ。"}, {"t": 191.43333333333334, "x": "大学では2度の日本一を経験している。"}, {"t": 194.0, "x": "卒業後、母校の佐賀商で臨時コーチをした。"}, {"t": 196.85, "x": "そして1995年に駒大苫小牧へ入った。"}, {"t": 200.45, "x": "九州から北海道ってずいぶん遠いわね。"}, {"t": 203.05, "x": "ああ。雪の量も寒さも、佐賀とはまるで違う。"}, {"t": 206.63333333333333, "x": "香田は、北海道の常識にしばられなかった。"}, {"t": 209.55, "x": "一番よく知られているのが、雪の上の練習だ。"}, {"t": 212.53333333333333, "x": "グラウンドに雪が積もっても外に出る。"}, {"t": 214.81666666666666, "x": "打撃練習もノックも雪の上でやった。"}, {"t": 217.25, "x": "紅白戦まで雪の上で行っている。"}, {"t": 219.46666666666667, "x": "雪の上で試合までしたの？"}, {"t": 221.3, "x": "ああ。寒さへの決まりもあった。"}, {"t": 223.18333333333334, "x": "手に息を吹きかけて温めるのは禁止。"}, {"t": 225.56666666666666, "x": "上着の袖で手をおおうのも禁止だ。"}, {"t": 227.71666666666667, "x": "寒いのにどうしてそこまでするの？"}, {"t": 229.83333333333334, "x": "寒さを言い訳にしないためだ。"}, {"t": 231.66666666666666, "x": "雪や寒さを、負けた理由にしない場所を作る。"}, {"t": 234.55, "x": "取材した記者は、それが本当の\nねらいだったと書いている。"}, {"t": 238.08333333333334, "x": "雪があるから弱い、とは言わせないってことね。"}, {"t": 240.9, "x": "そういうことだ。"}, {"t": 241.9, "x": "香田のもとで、駒大苫小牧は夏の甲子園に6回出た。"}, {"t": 245.63333333333333, "x": "春のセンバツにも2回出ている。"}, {"t": 247.53333333333333, "x": "ただ、最初からうまくいったわけではない。"}, {"t": 250.6, "x": "2003年の夏。駒大苫小牧は\n甲子園の1回戦で、岡山の倉敷工と当たった。"}, {"t": 256.25, "x": "先発は白石。4回まで1安打で、点を与えなかった。"}, {"t": 260.01666666666665, "x": "打線は3回裏までに8点を取る。"}, {"t": 262.4, "x": "8対0？　もう勝ったようなものじゃない。"}, {"t": 264.9, "x": "ところが4回に雨が急に強くなった。"}, {"t": 267.3833333333333, "x": "この日は台風10号が近づいていた。"}, {"t": 269.6333333333333, "x": "大会は予定の4試合を、2試合に減らしていた。"}, {"t": 272.6666666666667, "x": "それでも台風は予想より速く来た。"}, {"t": 274.9166666666667, "x": "4回の途中で試合は打ち切りになった。"}, {"t": 277.31666666666666, "x": "まだ試合が成立していなかったので、ノーゲームだ。"}, {"t": 280.4166666666667, "x": "じゃあ、8点は全部なかったことになるの？"}, {"t": 283.1166666666667, "x": "ああ。次の日、0対0から試合をやり直した。"}, {"t": 286.18333333333334, "x": "倉敷工は、前の日の試合をよく調べて臨んでいた。"}, {"t": 289.5, "x": "結果は2対5。駒大苫小牧の負けだった。"}, {"t": 292.55, "x": "8点も取っていたのにくやしいわね。"}, {"t": 294.8, "x": "Number Webの記事は、この負けのあとに\n翌年からの夏連覇が来たと書いている。"}, {"t": 299.4166666666667, "x": "8点を取りながら、雨で消えた試合だった。"}, {"t": 302.75, "x": "1年後の2004年。"}, {"t": 304.05, "x": "駒大苫小牧は南北海道の代表として甲子園に戻った。"}, {"t": 308.0833333333333, "x": "エースは岩田。捕手は糸屋。主将は佐々木だ。"}, {"t": 311.03333333333336, "x": "初戦の相手は、長崎の佐世保実。7対3で勝った。"}, {"t": 314.78333333333336, "x": "次の3回戦では、西東京の日大三を破った。"}, {"t": 318.21666666666664, "x": "これでベスト8に入った。"}, {"t": 319.93333333333334, "x": "準々決勝は8月19日。"}, {"t": 321.93333333333334, "x": "相手は神奈川の横浜だ。"}, {"t": 323.8833333333333, "x": "横浜って強いところよね？"}, {"t": 325.81666666666666, "x": "ああ。それでも駒大苫小牧は、18本の安打を打った。"}, {"t": 329.43333333333334, "x": "結果は6対1。岩田と鈴木の継投で、\n横浜を1点に抑えた。"}, {"t": 333.85, "x": "この試合で、林がサイクル安打を記録している。"}, {"t": 336.95, "x": "サイクル安打って？"}, {"t": 338.25, "x": "1試合で単打、二塁打、三塁打、\n本塁打を全部打つことだ。"}, {"t": 342.3333333333333, "x": "林は2回の本塁打に続いて、\n二塁打、三塁打、単打を打った。"}, {"t": 346.68333333333334, "x": "北海道の学校のベスト4は、1928年の北海中以来。"}, {"t": 351.21666666666664, "x": "76年ぶり2度目のことだった。"}, {"t": 353.6, "x": "ここで北海道の最高記録に並んだのね。"}, {"t": 356.45, "x": "準決勝は8月21日。"}, {"t": 358.45, "x": "山梨の東海大甲府と当たった。"}, {"t": 360.75, "x": "2回に2点、3回に2点、4回と5回に3点ずつ取る。"}, {"t": 364.65, "x": "東海大甲府も追い上げたが、10対8で逃げ切った。"}, {"t": 367.93333333333334, "x": "北海道の学校が夏の決勝に進むのは、初めてだった。"}, {"t": 371.9, "x": "とうとう、北海道の最高記録を越えたのね。"}, {"t": 375.31666666666666, "x": "決勝の相手は愛媛の済美だ。"}, {"t": 377.26666666666665, "x": "この年の春のセンバツで優勝した学校だった。"}, {"t": 380.23333333333335, "x": "しかも野球部ができてまだ3年目。"}, {"t": 382.6, "x": "3年目で春の日本一？"}, {"t": 384.45, "x": "ああ。春と夏の連続優勝をねらっていた。"}, {"t": 387.1333333333333, "x": "監督は上甲。4番は鵜久森だ。"}, {"t": 389.48333333333335, "x": "鵜久森は、この夏の甲子園で本塁打を3本打っている。"}, {"t": 393.03333333333336, "x": "強い相手ね。駒大苫小牧の投手は大丈夫だったの？"}, {"t": 396.6333333333333, "x": "そこに問題があった。"}, {"t": 398.06666666666666, "x": "エースの岩田は、左手の中指のマメが破れていた。"}, {"t": 401.3666666666667, "x": "破れたのは3日前の準々決勝の横浜戦だ。"}, {"t": 404.51666666666665, "x": "準決勝は、液状のばんそうこうでしのいで投げた。"}, {"t": 407.56666666666666, "x": "ところが決勝の前の練習で、それがはがれてしまう。"}, {"t": 410.8, "x": "岩田は、監督にも捕手の糸屋にも伝えていなかった。"}, {"t": 414.28333333333336, "x": "痛いのに隠して投げたのね。"}, {"t": 416.73333333333335, "x": "試合は済美が1回に2点を取った。"}, {"t": 418.96666666666664, "x": "2回にも3点。岩田は2回の途中で、鈴木と交代した。"}, {"t": 422.8833333333333, "x": "2回を終えて1対5。"}, {"t": 424.1333333333333, "x": "駒大苫小牧は4点を追う形になる。"}, {"t": 426.8666666666667, "x": "いきなり4点差はきついわね。"}, {"t": 428.81666666666666, "x": "3回裏。駒大苫小牧にランナーが出た。"}, {"t": 431.6, "x": "打席には準々決勝でサイクル安打の林。"}, {"t": 434.4, "x": "香田はここで林にバントを命じた。"}, {"t": 436.73333333333335, "x": "4点負けているのにバント？"}, {"t": 438.55, "x": "テレビのアナウンサーも、驚きの声を上げたそうだ。"}, {"t": 441.46666666666664, "x": "香田は、1点を取れば相手の投手を崩せると見ていた。"}, {"t": 444.76666666666665, "x": "この回、駒大苫小牧は2点を返す。3対5だ。"}, {"t": 448.21666666666664, "x": "4回裏には3点を取って、6対5と逆転した。"}, {"t": 451.71666666666664, "x": "追いついて追い越したのね。"}, {"t": 453.31666666666666, "x": "ところが5回表。済美が1点を返して、6対6になる。"}, {"t": 457.1, "x": "この場面で、捕手の糸屋は本塁を守り抜いている。"}, {"t": 460.1666666666667, "x": "6回表には済美が3点を取った。"}, {"t": 462.43333333333334, "x": "その裏に駒大苫小牧も3点を取り返す。"}, {"t": 465.4, "x": "9対9？　点の取り合いね。"}, {"t": 467.8666666666667, "x": "試合が動いたのは7回裏だ。"}, {"t": 469.81666666666666, "x": "ノーアウト一塁で、4番の原田が打席に立つ。"}, {"t": 472.85, "x": "原田は、済美のバッテリーが\n真っ先に名前を挙げた打者だった。"}, {"t": 476.51666666666665, "x": "その4番に送りバントのサインが出た。"}, {"t": 478.93333333333334, "x": "4番がバント？"}, {"t": 480.15, "x": "ああ。原田はきっちり送った。"}, {"t": 482.01666666666665, "x": "続く主将の佐々木が、勝ち越しの二塁打を打つ。"}, {"t": 485.0, "x": "佐々木は高く拳を突き上げた。"}, {"t": 487.06666666666666, "x": "この回、駒大苫小牧は3点。12対9とした。"}, {"t": 490.6, "x": "8回は両チームが1点ずつ取った。"}, {"t": 492.96666666666664, "x": "それで13対10になったのね。"}, {"t": 495.1, "x": "そうだ。そして9回表、最初の場面に戻る。"}, {"t": 498.23333333333335, "x": "済美の上甲監督は、円陣で\nこう言ったと伝えられている。"}, {"t": 501.8, "x": "「鵜久森へ回せ。それでだめなら仕方ない」。"}, {"t": 504.3666666666667, "x": "打順は鵜久森まで回った。"}, {"t": 506.1, "x": "鈴木と糸屋のバッテリーが、鵜久森を打ち取る。"}, {"t": 508.8833333333333, "x": "13対10。駒大苫小牧の優勝だ。"}, {"t": 511.6, "x": "両チームの安打は、あわせて39本。"}, {"t": 514.0, "x": "決勝で最も多い記録になった。"}, {"t": 516.85, "x": "それにしてもよく打ったチームね。"}, {"t": 518.8166666666667, "x": "この大会の駒大苫小牧のチーム打率は、4割4分8厘。"}, {"t": 522.8, "x": "Number Webは、それまでで\n最高の数字だったと書いている。"}, {"t": 526.1333333333333, "x": "捕手の糸屋は、20打数14安打。打率は7割だ。"}, {"t": 529.9, "x": "7割って、10回のうち7回打ったってこと？"}, {"t": 533.0, "x": "そういうことだ。"}, {"t": 534.0333333333333, "x": "もう1つ大事な数字がある。"}, {"t": 535.8, "x": "この年のメンバーは、全員が北海道の出身だった。"}, {"t": 539.1833333333333, "x": "北海高校の平川監督は、そこが\n大きかったと話している。"}, {"t": 543.1666666666666, "x": "「初めて本気で北海道からも日本一を\n目指せると思わせてくれた」。"}, {"t": 547.2833333333333, "x": "北海道の子だけで日本一になったのね。"}, {"t": 550.4666666666667, "x": "そして次の年の夏。2005年だ。"}, {"t": 553.0, "x": "駒大苫小牧は、また\n南北海道の代表として甲子園に来た。"}, {"t": 557.25, "x": "主将は、前の年にサイクル安打を打った林だ。"}, {"t": 560.2833333333333, "x": "エースは松橋。そして2年生に、田中将大がいた。"}, {"t": 564.0, "x": "あの田中将大？"}, {"t": 565.4166666666666, "x": "ああ。田中は兵庫県の出身で、\n2004年に入学している。"}, {"t": 569.2666666666667, "x": "1年生の夏は、先輩たちを支える側にいた。"}, {"t": 572.4166666666666, "x": "本人はのちにこう振り返っている。"}, {"t": 574.45, "x": "入学して半年たたない間に、全国優勝を経験できた。"}, {"t": 578.4833333333333, "x": "入ってすぐに優勝を見たのね。"}, {"t": 580.4833333333333, "x": "2005年8月20日。"}, {"t": 582.1, "x": "決勝の相手は、京都の京都外大西だ。"}, {"t": 584.9, "x": "駒大苫小牧は5対3で勝った。"}, {"t": 587.15, "x": "夏の大会で2年続けて優勝したのは、\n大会の歴史で6校目だ。"}, {"t": 591.6166666666667, "x": "北海道の学校がいきなり連覇なのね。"}, {"t": 594.2166666666667, "x": "北海道新聞はこの日に号外を出した。"}, {"t": 596.75, "x": "道内7か所で配った号外は、14万1700枚。"}, {"t": 600.4166666666666, "x": "地元の苫小牧だけで、3万3千枚が配られている。"}, {"t": 604.0, "x": "札幌の本社前には優勝が決まった\n直後から、号外を待つ人の行列ができた。"}, {"t": 609.15, "x": "それだけの人が待っていたのね。"}, {"t": 611.7333333333333, "x": "そして2006年の夏。"}, {"t": 613.45, "x": "駒大苫小牧は、3年続けて決勝まで勝ち上がった。"}, {"t": 617.0666666666667, "x": "主将で4番は本間。エースは3年生になった田中だ。"}, {"t": 620.7, "x": "勝てば3連覇よね？"}, {"t": 622.1666666666666, "x": "ああ。夏の3連覇は、それまで1校しかない。"}, {"t": 625.1166666666667, "x": "1933年に3連覇を果たした、愛知の中京商だ。"}, {"t": 629.25, "x": "決勝の相手は西東京の早稲田実。"}, {"t": 631.6666666666666, "x": "マウンドにはエースの斎藤佑樹がいた。"}, {"t": 633.85, "x": "2006年8月20日。決勝が始まった。"}, {"t": 637.0833333333334, "x": "どっちが勝ったの？"}, {"t": 638.35, "x": "どちらも勝たなかった。"}, {"t": 639.8, "x": "1対1のまま延長15回で引き分けだ。"}, {"t": 642.5833333333334, "x": "決勝で引き分け？"}, {"t": 643.9333333333333, "x": "決勝の引き分け再試合は、37年ぶりだった。"}, {"t": 647.3, "x": "前は1969年。愛媛の松山商と、青森の三沢だ。"}, {"t": 651.85, "x": "そのときも北の学校が戦っていたのね。"}, {"t": 654.65, "x": "テレビの「熱闘甲子園」も、放送を1日のばした。"}, {"t": 658.2, "x": "キャスターの長島三奈は、田中から\n聞いた話を明かしている。"}, {"t": 661.8333333333334, "x": "疲れよりも、「もう1試合できる、\nよしって思った」と言っていたそうだ。"}, {"t": 666.15, "x": "疲れているはずなのに前向きね。"}, {"t": 668.7833333333333, "x": "2006年8月21日。"}, {"t": 670.8166666666667, "x": "決勝の再試合が行われた。"}, {"t": 672.8166666666667, "x": "早稲田実は1回裏に先に点を取った。"}, {"t": 675.3833333333333, "x": "その後も点を重ねて3点のリードを作る。"}, {"t": 678.1, "x": "駒大苫小牧は追いつけなかったの？"}, {"t": 680.4666666666667, "x": "9回表、駒大苫小牧が2ランホームランを打った。"}, {"t": 683.7333333333333, "x": "4対3。1点差に迫る。"}, {"t": 685.6833333333333, "x": "そして2アウト。打席に入ったのは、田中だった。"}, {"t": 689.0166666666667, "x": "最後の打者が田中だったの？"}, {"t": 690.9833333333333, "x": "そうだ。斎藤は、田中を空振りの三振に取った。"}, {"t": 694.2833333333333, "x": "4対3で早稲田実の初優勝だ。"}, {"t": 696.65, "x": "斎藤は2試合の決勝で、15回と\n9回の24回を1人で投げた。"}, {"t": 701.3, "x": "駒大苫小牧の3連覇は、1点差で届かなかったのね。"}, {"t": 705.1333333333333, "x": "ああ。高野連の記録には、こう残っている。"}, {"t": 707.7833333333333, "x": "「史上2校目の3連覇を目指した\n駒大苫小牧は準優勝に終わった」。"}, {"t": 711.95, "x": "優勝、優勝、準優勝。これが「2.9連覇」の中身だ。"}, {"t": 716.25, "x": "田中はこの年の秋のドラフトで、楽天に入っている。"}, {"t": 719.6833333333333, "x": "斎藤ものちに日本ハムでプレーした。"}, {"t": 721.9333333333333, "x": "2025年9月には両校のOBが、\n北海道の長沼町で試合をした。"}, {"t": 726.6833333333333, "x": "投げたのは斎藤。結果は\n早稲田実のOBが12対4で勝っている。"}, {"t": 730.7333333333333, "x": "2026年2月には、本間と斎藤が\n苫小牧のスケートまつりでトークをした。"}, {"t": 735.8833333333333, "x": "今でもつながりが続いているのね。"}, {"t": 738.55, "x": "その後の駒大苫小牧はどうなったの？"}, {"t": 741.0333333333333, "x": "2007年の夏も甲子園に出たが、初戦で敗れた。"}, {"t": 744.45, "x": "香田は2008年に学校を離れている。"}, {"t": 746.9833333333333, "x": "その後は鶴見大学で4年間指導をした。"}, {"t": 749.6, "x": "2012年からは、福岡の西部ガスで\nコーチと監督を務めた。"}, {"t": 753.7833333333333, "x": "そして2024年4月、母校の駒澤大学の監督になった。"}, {"t": 758.0833333333334, "x": "コーチには、2004年と2005年の主力だった林がいる。"}, {"t": 761.9333333333333, "x": "あのサイクル安打の林が、一緒にいるのね。"}, {"t": 764.7333333333333, "x": "ああ。北海道新聞は、師弟コンビの復活と書いた。"}, {"t": 768.2, "x": "一方、2004年の主将だった\n佐々木は、母校の監督になった。"}, {"t": 772.3, "x": "駒大苫小牧は、2014年と\n2018年の春のセンバツに出ている。"}, {"t": 776.9666666666667, "x": "2018年には、冬の間に鹿児島の種子島で、\n約10日間の合宿をした。"}, {"t": 782.45, "x": "雪のない所へ練習しに行ったのね。"}, {"t": 784.8666666666667, "x": "ただ、夏の甲子園は2007年が最後になっている。"}, {"t": 788.2333333333333, "x": "2026年の夏、駒大苫小牧は\n南北海道大会の決勝まで進んだ。"}, {"t": 793.5, "x": "相手は札幌日大。0対3で敗れ、\n19年ぶりの夏の甲子園はならなかった。"}, {"t": 798.9, "x": "あと1勝だったのね。"}, {"t": 800.9, "x": "Number Webは、駒大苫小牧の優勝が\nほかの北海道の学校も変えたと書いている。"}, {"t": 805.95, "x": "2015年の春には、東海大四が決勝まで進んだ。"}, {"t": 809.6166666666667, "x": "2016年の夏には、北海が決勝まで進んでいる。"}, {"t": 813.3333333333334, "x": "どっちも北海道の学校ね。"}, {"t": 815.35 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
