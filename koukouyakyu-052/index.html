<script>
const D={"name": "三池工の1度きりの甲子園", "file": "052_編集用", "dur": 653.65, "segs": [], "subs": [{"t": 0.0, "x": "記録の表では、両方の学校に0が6つずつ並んでいる。"}, {"t": 3.6333333333333333, "x": "1965年の夏。甲子園球場で\n開かれた夏の大会の決勝だ。"}, {"t": 8.7, "x": "6回まで、どっちも点が入らなかったってこと？"}, {"t": 11.816666666666666, "x": "そうなる。千葉の銚子商と福岡の三池工の試合だった。"}, {"t": 15.316666666666666, "x": "7回、三池工が2点を入れて0の列が止まった。"}, {"t": 18.616666666666667, "x": "銚子商は、そこから追いついたの？"}, {"t": 20.883333333333333, "x": "いや、9回まで0のまま。"}, {"t": 22.55, "x": "2対0で三池工が優勝した。"}, {"t": 24.683333333333334, "x": "日本高野連の大会小史には、この夏がこう書いてある。"}, {"t": 28.1, "x": "三池工が工業校初の優勝。"}, {"t": 30.266666666666666, "x": "工業高校が勝ったのは、これが初めてだったのね。"}, {"t": 33.55, "x": "それだけじゃない。三池工は\nこの夏が初めての甲子園だった。"}, {"t": 37.233333333333334, "x": "そして記録のサイトで数えると、\n甲子園に来たのは今もこの1度だけだ。"}, {"t": 41.733333333333334, "x": "えっ、1回来て優勝して、それっきりなの？"}, {"t": 44.71666666666667, "x": "そうだ。5試合で5勝。"}, {"t": 46.13333333333333, "x": "負けは1つも無い。"}, {"t": 47.583333333333336, "x": "どんな学校なの？　そのあとはどうなったの？"}, {"t": 50.21666666666667, "x": "今回は日本高野連の表と、\n試合の記録と、町の資料で辿っていく。"}, {"t": 54.733333333333334, "x": "始める前にチャンネル登録と高評価をお願いしたい。"}, {"t": 57.96666666666667, "x": "よろしくね。"}, {"t": 59.46666666666667, "x": "三池工って、どこにある学校なの？"}, {"t": 61.86666666666667, "x": "福岡県の大牟田市にある県立の工業高校だ。"}, {"t": 64.96666666666667, "x": "大牟田は福岡県のいちばん南の町だな。"}, {"t": 67.7, "x": "明治のころから、三池炭鉱とともに大きくなった町だ。"}, {"t": 71.28333333333333, "x": "炭鉱って、石炭を掘る所よね。"}, {"t": 73.8, "x": "ああ。学校の案内には、始まりがこう書いてある。"}, {"t": 76.83333333333333, "x": "明治41年に、三井家が三井工業学校として作った。"}, {"t": 80.85, "x": "1908年のことだ。"}, {"t": 82.8, "x": "三井って、あの大きな会社の三井なの？"}, {"t": 85.43333333333334, "x": "学校の案内には、三井家とだけ書いてある。\nここではその言葉のまま言おう。"}, {"t": 90.05, "x": "最初は県の学校じゃなかったのね。"}, {"t": 92.35, "x": "そうだ。県の学校になったのは昭和25年。1950年だ。"}, {"t": 96.73333333333333, "x": "2025年度の学校の案内では、\n創立117周年と書いている。"}, {"t": 101.46666666666667, "x": "100年以上前からある学校なのね。"}, {"t": 103.78333333333333, "x": "ただ甲子園の表では、長いあいだ\n福岡の欄に名前が無い。"}, {"t": 107.36666666666666, "x": "1964年の夏、福岡の代表は小倉工だった。"}, {"t": 111.35, "x": "この夏に優勝したのは、高知の高知だ。"}, {"t": 114.15, "x": "福岡からも、工業高校が来ていたのね。"}, {"t": 116.98333333333333, "x": "ああ。そして次の1965年の夏。"}, {"t": 119.98333333333333, "x": "福岡の欄に、初めて三池工の名前が入る。"}, {"t": 123.65, "x": "その夏は、どんな大会だったの？"}, {"t": 125.98333333333333, "x": "日本高野連の表では、全国から\n2363校が参加している。"}, {"t": 130.63333333333333, "x": "甲子園に来た代表は30校だ。"}, {"t": 132.85, "x": "大会小史には、もう1つこの夏のことが書いてある。"}, {"t": 136.16666666666666, "x": "NHKがカラーテレビで初めて中継した夏だった。"}, {"t": 139.61666666666667, "x": "テレビが色つきになった年に、初めて来たのね。"}, {"t": 142.76666666666668, "x": "1回戦の相手は、香川の高松商だ。"}, {"t": 145.46666666666667, "x": "高松商は、第1回の春のセンバツで\n優勝した学校だな。"}, {"t": 149.5, "x": "最初の相手から、古い強い学校なのね。"}, {"t": 152.36666666666667, "x": "3回に高松商が1点を先に取った。"}, {"t": 155.18333333333334, "x": "いきなり先に取られちゃったのね。"}, {"t": 157.23333333333332, "x": "三池工は6回までずっと0点だった。"}, {"t": 159.61666666666667, "x": "7回にやっと1点を返して1対1だ。"}, {"t": 162.26666666666668, "x": "そのあとは9回でも決まらず、延長に入った。"}, {"t": 165.31666666666666, "x": "初めての甲子園で、いきなり延長なのね。"}, {"t": 168.18333333333334, "x": "10回、11回、12回と、どちらも0点が続いた。"}, {"t": 171.96666666666667, "x": "13回。三池工が1点を取って2対1。サヨナラ勝ちだ。"}, {"t": 175.95, "x": "13回までがんばって、やっと勝ったのね！"}, {"t": 178.73333333333332, "x": "これが三池工の甲子園の初めての1勝だ。"}, {"t": 181.46666666666667, "x": "2回戦は、静岡の東海大一だ。"}, {"t": 183.93333333333334, "x": "こちらは1回にいきなり3点を取った。"}, {"t": 186.31666666666666, "x": "2回に1点。4回に4点。"}, {"t": 188.2, "x": "6回に2点。8回にも1点だ。"}, {"t": 190.61666666666667, "x": "東海大一は3回の1点だけ。"}, {"t": 192.66666666666666, "x": "11対1で勝った。"}, {"t": 194.33333333333334, "x": "今度はたくさん点を取ったのね。"}, {"t": 196.4, "x": "1回戦の13回とは、まるで逆の試合だな。"}, {"t": 200.1, "x": "準々決勝の相手はどこなの？"}, {"t": 202.2, "x": "兵庫の報徳学園だ。"}, {"t": 203.78333333333333, "x": "三池工が4回に1点を先に取った。"}, {"t": 206.21666666666667, "x": "でも報徳学園は5回に1点、6回にも1点を取った。"}, {"t": 210.0, "x": "1対2で逆に前に出られたのね。"}, {"t": 212.25, "x": "そのまま8回まで進んだ。"}, {"t": 214.06666666666666, "x": "9回に三池工が1点を返して、2対2になった。"}, {"t": 217.48333333333332, "x": "最後の回で追いついたのね！"}, {"t": 219.28333333333333, "x": "これで2試合目の延長だ。"}, {"t": 220.93333333333334, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
