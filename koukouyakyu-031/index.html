<script>
const D={"name": "仙台育英3度目の決勝", "file": "031_編集用", "dur": 955.8, "segs": [], "subs": [{"t": 0.0, "x": "2022年8月22日、阪神甲子園球場。"}, {"t": 3.55, "x": "夏の大会の決勝だ。"}, {"t": 5.266666666666667, "x": "宮城の仙台育英と山口の下関国際がぶつかった。"}, {"t": 9.016666666666667, "x": "7回の裏。仙台育英は4対1とリードしていた。"}, {"t": 12.366666666666667, "x": "1死満塁で5番打者が打席に入る。"}, {"t": 14.766666666666667, "x": "打球は左のスタンドに飛び込んだ。満塁本塁打だ。"}, {"t": 18.133333333333333, "x": "これで8対1。試合はそのまま終わった。"}, {"t": 20.866666666666667, "x": "最後は大差だったのね。"}, {"t": 22.55, "x": "ああ。この優勝で、東北の学校が\n初めて夏の全国の頂点に立った。"}, {"t": 27.283333333333335, "x": "初めて？ 2022年まで1度も勝っていなかったの？"}, {"t": 30.866666666666667, "x": "そうだ。春の選抜も合わせて、\n東北の学校の優勝は1度もなかった。"}, {"t": 35.583333333333336, "x": "仙台育英にとっては何度目の決勝だったの？"}, {"t": 38.53333333333333, "x": "夏の決勝は3度目だ。"}, {"t": 40.03333333333333, "x": "日本高野連の公式の頁がそう書いている。"}, {"t": 43.016666666666666, "x": "3度目でやっと勝ったのね。"}, {"t": 44.53333333333333, "x": "前の2回はどうだったの？"}, {"t": 46.266666666666666, "x": "今回はその3つの決勝を、点数と\n日付で1つずつ並べていく。"}, {"t": 50.46666666666667, "x": "あわせて東北の学校が決勝で\n積み重ねてきた記録も見る。"}, {"t": 54.18333333333333, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 57.6, "x": "よろしくね。"}, {"t": 59.1, "x": "まず公式の記録から見ておく。"}, {"t": 61.083333333333336, "x": "2022年の夏は\n第104回全国高等学校野球選手権大会だった。"}, {"t": 66.15, "x": "大会は8月6日に始まり、8月22日の決勝で終わった。"}, {"t": 70.5, "x": "日本高野連の頁にはこう書いてある。"}, {"t": 72.86666666666666, "x": "仙台育英が下関国際を8対1で破った。"}, {"t": 76.15, "x": "そして3度目の決勝進出で、\n東北勢初となる全国制覇を遂げた。"}, {"t": 80.88333333333334, "x": "東北勢って、東北の6つの県の学校のこと？"}, {"t": 84.26666666666667, "x": "そうだ。青森と岩手と秋田、宮城と\n山形と福島の学校をまとめてそう呼ぶ。"}, {"t": 89.3, "x": "日本高野連の大会小史にも同じことが書いてある。"}, {"t": 92.48333333333333, "x": "決勝で仙台育英が下関国際に8対1で\n勝ち、東北勢で初の優勝を果たした。"}, {"t": 98.33333333333333, "x": "同じ年の記録で、ほかに書いてあることはある？"}, {"t": 101.31666666666666, "x": "2022年の大会は、3年ぶりに\n一般のお客さんが球場に入れた。"}, {"t": 105.83333333333333, "x": "入場者の数に制限をかけずに\n大会を開いたと小史は書いている。"}, {"t": 109.88333333333334, "x": "お客さんの前での初優勝だったのね。"}, {"t": 112.43333333333334, "x": "では東北の学校が決勝で負けてきた記録を見ていこう。"}, {"t": 116.45, "x": "夏の大会の歴代の優勝校と\n準優勝校を1行ずつ確かめた。"}, {"t": 120.65, "x": "東北の学校が準優勝した夏は、\n2022年より前に9回ある。"}, {"t": 125.28333333333333, "x": "9回も決勝に出て、全部負けていたの？"}, {"t": 128.08333333333334, "x": "そうだ。年の順に読み上げる。"}, {"t": 130.01666666666668, "x": "最初は1915年の第1回大会だ。"}, {"t": 132.95, "x": "会場は甲子園ではなく大阪の豊中グラウンド。"}, {"t": 135.76666666666668, "x": "出た学校は10校だった。"}, {"t": 137.65, "x": "まだ甲子園球場が無かったころなのね。"}, {"t": 140.18333333333334, "x": "この10校の中に秋田の秋田中がいた。"}, {"t": 142.78333333333333, "x": "準々決勝で三重四中に9対1、\n準決勝で早稲田実に3対1で勝った。"}, {"t": 147.75, "x": "決勝の相手は京都二中。"}, {"t": 149.33333333333334, "x": "点数は1対2だった。"}, {"t": 151.08333333333334, "x": "第1回から東北の学校が\n決勝にいたのね。しかも1点差。"}, {"t": 155.2, "x": "ああ。東北の学校の決勝は、\n大会の最初の年から始まっている。"}, {"t": 159.51666666666668, "x": "次は1969年の青森の三沢だ。"}, {"t": 162.36666666666667, "x": "相手は愛媛の松山商。"}, {"t": 164.11666666666667, "x": "決勝は0対0で引き分けて、再試合で2対4だった。"}, {"t": 167.75, "x": "1971年は福島の磐城。"}, {"t": 170.25, "x": "桐蔭学園に0対1で敗れた。"}, {"t": 172.58333333333334, "x": "どっちも点が少ない試合ね。"}, {"t": 174.55, "x": "そして1989年が仙台育英の1度目の決勝になる。"}, {"t": 178.73333333333332, "x": "大会小史は、仙台育英が\n東北勢4校目の決勝進出と書いている。"}, {"t": 183.55, "x": "秋田中と三沢と磐城、\nそして仙台育英で4校ってことね。"}, {"t": 187.6, "x": "そのとおりだ。この先は平成に入る。"}, {"t": 190.68333333333334, "x": "2003年は宮城の東北。"}, {"t": 192.45, "x": "茨城の常総学院に2対4で敗れた。"}, {"t": 195.16666666666666, "x": "小史は、この決勝を東日本対決と書いている。"}, {"t": 198.36666666666667, "x": "この年の小史の1行はこうだ。"}, {"t": 200.36666666666667, "x": "東北は準優勝に終わり、またも\n大優勝旗は白河越えを果たせず。"}, {"t": 204.6, "x": "白河越えって何のこと？"}, {"t": 206.35, "x": "福島にあった昔の関所、白河の関のことだ。"}, {"t": 209.81666666666666, "x": "優勝旗がその関所を越えて東北に\n入るかどうか、という言い方だ。"}, {"t": 213.93333333333334, "x": "公式の記録にも、その言い方が出てくるのね。"}, {"t": 217.03333333333333, "x": "2011年と2012年は、青森の光星学院が\n2年続けて準優勝した。"}, {"t": 222.3, "x": "2011年は日大三に0対11、\n2012年は大阪桐蔭に0対3だった。"}, {"t": 227.85, "x": "光星学院の話は前の回でくわしく\n話したので、点数だけにしておく。"}, {"t": 232.45, "x": "2015年が仙台育英の2度目の決勝だ。"}, {"t": 235.36666666666667, "x": "そして2018年は秋田の金足農。"}, {"t": 237.85, "x": "大阪桐蔭に2対13で敗れた。"}, {"t": 240.21666666666667, "x": "小史は、秋田勢の準優勝は\n第1回の秋田中以来だと書いている。"}, {"t": 244.55, "x": "秋田は103年たってまた決勝に来たのね。"}, {"t": 247.48333333333332, "x": "ここまでで9回。2022年は\n東北の学校の夏の決勝の10度目になる。"}, {"t": 252.5, "x": "県ごとに分けると、どうなるの？"}, {"t": 254.58333333333334, "x": "表を数えると、夏の10回のうち\n宮城が4回で、いちばん多い。"}, {"t": 258.55, "x": "1989年と2015年と2022年の仙台育英、\nそれに2003年の東北だ。"}, {"t": 264.8833333333333, "x": "青森が3回。1969年の三沢と、\n2011年と2012年の光星学院だ。"}, {"t": 271.1666666666667, "x": "秋田が2回で、1915年の秋田中と2018年の金足農。"}, {"t": 275.9166666666667, "x": "福島は1回で、1971年の磐城だ。"}, {"t": 279.5, "x": "岩手と山形は、2022年までの夏の決勝には\n出ていないのね。"}, {"t": 283.9, "x": "夏の表で数えると、そうなる。"}, {"t": 285.76666666666665, "x": "岩手は2009年の春に、花巻東が決勝に出ている。"}, {"t": 289.65, "x": "宮城の4回のうち、3回が仙台育英だ。"}, {"t": 292.68333333333334, "x": "春の選抜の決勝はどうなの？"}, {"t": 294.81666666666666, "x": "春は3回ある。2001年の仙台育英、\n2009年の岩手の花巻東、2012年の光星学院だ。"}, {"t": 301.95, "x": "2001年は常総学院、2009年は\n長崎の清峰、2012年は大阪桐蔭に敗れた。"}, {"t": 308.1166666666667, "x": "夏の9回と春の3回で、12回負けていたのね。"}, {"t": 311.7, "x": "そうだ。新聞は2022年の優勝を春夏合わせて\n13度目の決勝での初優勝と書いた。"}, {"t": 317.56666666666666, "x": "13回のうち4回が仙台育英の決勝だ。"}, {"t": 320.65, "x": "4回？ 夏が3回で、春が1回ってことね。"}, {"t": 323.93333333333334, "x": "ああ。では仙台育英の1度目の決勝から見ていく。"}, {"t": 327.7, "x": "1989年の夏。平成に入って\n最初の夏の大会、第71回だ。"}, {"t": 333.3, "x": "仙台育英は1回戦から登場した。"}, {"t": 335.75, "x": "1回戦は鹿児島の鹿児島商工に7対4。"}, {"t": 338.55, "x": "2回戦は京都の京都西に4対0。"}, {"t": 341.1666666666667, "x": "3回戦は青森の弘前工だった。点数は2対1だ。"}, {"t": 344.93333333333334, "x": "3回戦で東北の学校どうしが当たったのね。"}, {"t": 347.93333333333334, "x": "そうだ。準々決勝は大阪の上宮に10対2で勝った。"}, {"t": 351.5, "x": "準決勝は香川の尽誠学園。\nこれも3対2の1点差だった。"}, {"t": 355.65, "x": "1点差を2つも勝ち抜いて、決勝まで来たのね。"}, {"t": 358.8833333333333, "x": "決勝の相手は東京の帝京だった。"}, {"t": 361.1666666666667, "x": "帝京は決勝までの4試合で、\n取られた点が1点だけだった。"}, {"t": 364.98333333333335, "x": "2回戦から3対0、10対1、11対0、\n4対0と勝ち上がっている。"}, {"t": 370.18333333333334, "x": "取られたのは10対1の1点だけってこと？"}, {"t": 372.6333333333333, "x": "すごく守りの固い学校ね。"}, {"t": 375.18333333333334, "x": "決勝は8月22日だった。"}, {"t": 377.5, "x": "8月22日って、2022年の決勝と同じ日付じゃない？"}, {"t": 381.8666666666667, "x": "そうだ。33年をはさんで、\n同じ8月22日に決勝を戦っている。"}, {"t": 386.96666666666664, "x": "偶然だけど、ちょっと驚くわね。"}, {"t": 389.2, "x": "試合は9回まで、どちらにも点が入らなかった。"}, {"t": 392.26666666666665, "x": "0対0のまま延長に入った。"}, {"t": 394.3666666666667, "x": "延長10回、帝京が2点を取った。"}, {"t": 396.76666666666665, "x": "仙台育英は返せず、0対2で敗れた。"}, {"t": 399.6166666666667, "x": "9回までは、まったくの互角だったのね。"}, {"t": 402.3666666666667, "x": "小史は、帝京が5試合を1失点で\n初優勝したと書いている。"}, {"t": 406.23333333333335, "x": "東京にとっては13年ぶりの優勝だった。"}, {"t": 409.05, "x": "決勝の0点を入れても、帝京が\n取られた点は1点のままなのね。"}, {"t": 413.1666666666667, "x": "そういうことだ。延長10回で0対2。\nこれが1度目の決勝の点数だ。"}, {"t": 417.85, "x": "0対2。あと2点の差ね。"}, {"t": 420.3666666666667, "x": "夏の2度目の前に、春の決勝が1つある。"}, {"t": 423.26666666666665, "x": "2001年の春の選抜だ。"}, {"t": 425.0833333333333, "x": "仙台育英は決勝まで勝ち上がった。"}, {"t": 427.48333333333335, "x": "相手は茨城の常総学院。"}, {"t": 429.15, "x": "点数は6対7だった。"}, {"t": 431.01666666666665, "x": "今度は1点差なのね。"}, {"t": 432.6666666666667, "x": "ああ。常総学院の側の話は\n前の回でくわしく話している。"}, {"t": 436.5, "x": "ここでは点数だけにしておく。"}, {"t": 438.2, "x": "春の決勝も1点が届かなかった。"}, {"t": 440.75, "x": "夏は2点、春は1点。"}, {"t": 442.3, "x": "少しずつ近づいている感じがするわね。"}, {"t": 445.43333333333334, "x": "2015年の夏。第97回大会だ。"}, {"t": 448.56666666666666, "x": "1915年の第1回から、ちょうど100年がたっていた。"}, {"t": 452.35, "x": "小史は選手権大会誕生100年の大会と書いている。"}, {"t": 455.93333333333334, "x": "100年の節目の夏に、仙台育英が\nまた勝ち上がったのね。"}, {"t": 459.78333333333336, "x": "そうだ。この年も1回戦から6試合を戦った。"}, {"t": 463.05, "x": "1回戦は大分の明豊に12対1。"}, {"t": 465.4, "x": "2回戦は兵庫の滝川二に7対1。"}, {"t": 468.0, "x": "3回戦は岩手の花巻東に4対3。"}, {"t": 470.6666666666667, "x": "準々決勝は秋田の秋田商に6対3。"}, {"t": 473.6, "x": "また東北の学校と2回も当たっているわね。"}, {"t": 476.43333333333334, "x": "ああ。準決勝は西東京の早稲田実に7対0で勝った。"}, {"t": 480.15, "x": "決勝までの5試合で、取った点は36点。"}, {"t": 482.95, "x": "取られた点は8点だ。"}, {"t": 484.65, "x": "1989年のときより、ずいぶん点を取っているのね。"}, {"t": 489.1166666666667, "x": "8月20日の決勝。相手は神奈川の東海大相模だった。"}, {"t": 493.1333333333333, "x": "東海大相模は、どんな勝ち上がり方だったの？"}, {"t": 496.21666666666664, "x": "2回戦から登場して、最初の相手は\n福島の聖光学院だった。"}, {"t": 500.28333333333336, "x": "6対1で勝っている。"}, {"t": 501.81666666666666, "x": "そのあと石川の遊学館に11対2、\n準々決勝で埼玉の花咲徳栄に4対3。"}, {"t": 507.53333333333336, "x": "準決勝は東東京の関東第一に10対3だった。"}, {"t": 511.2, "x": "東海大相模も、東北の学校に勝って上がってきたのね。"}, {"t": 514.9833333333333, "x": "そうだ。決勝は1回、東海大相模が先に2点を取った。"}, {"t": 518.9666666666667, "x": "いきなり2点を追いかける形ね。"}, {"t": 521.1333333333333, "x": "仙台育英はそこから追い上げた。"}, {"t": 523.1333333333333, "x": "8回を終わって6対6。"}, {"t": 524.7, "x": "試合は同点のまま9回に入った。"}, {"t": 527.15, "x": "100年の節目の決勝で、同点の9回なのね。"}, {"t": 530.4333333333333, "x": "9回の表。東海大相模の先頭打者は\nエースの投手だった。"}, {"t": 534.4333333333333, "x": "その投手が初球を右のスタンドに運んだ。"}, {"t": 537.0666666666667, "x": "東海大相模はこの回に4点を取った。"}, {"t": 539.65, "x": "最後は10対6。仙台育英はまた準優勝だった。"}, {"t": 543.1833333333333, "x": "8回まで並んでいたのに、最後の1回で離されたのね。"}, {"t": 546.8333333333334, "x": "東海大相模は45年ぶり2度目の優勝だった。"}, {"t": 550.05, "x": "仙台育英の2度目の決勝は6対10で終わった。"}, {"t": 553.0833333333334, "x": "この年の小史の1行はこうだ。"}, {"t": 555.1166666666667, "x": "仙台育英は東北勢8度目となる\n決勝進出で、またも厚い壁に阻まれた。"}, {"t": 560.3166666666667, "x": "8度目って、さっきの表の順番と合っているの？"}, {"t": 563.4, "x": "合っている。1915年から\n2012年までの7回の次、8回目が2015年だ。"}, {"t": 569.35, "x": "公式も、東北の決勝を数えながら書いているのね。"}, {"t": 572.6333333333333, "x": "1度目は点が取れなかった。"}, {"t": 574.2333333333333, "x": "今度は6点取ったけど、10点取られたのね。"}, {"t": 577.3166666666667, "x": "そうだ。2度の決勝で負け方がまるで違う。"}, {"t": 580.7333333333333, "x": "それから7年。2022年の夏だ。"}, {"t": 583.45, "x": "仙台育英の最初の試合は8月11日の2回戦だった。"}, {"t": 587.35, "x": "相手は鳥取の鳥取商。"}, {"t": 588.9333333333333, "x": "10対0で勝った。"}, {"t": 590.35, "x": "8月15日の3回戦は茨城の明秀日立。"}, {"t": 593.5, "x": "5対4の1点差だった。"}, {"t": 595.3833333333333, "x": "2試合目はぎりぎりだったのね。"}, {"t": 597.3166666666667, "x": "8月17日は休養日。"}, {"t": 599.1166666666667, "x": "次の日の8月18日が準々決勝だ。"}, {"t": 602.1666666666666, "x": "相手は愛知の愛工大名電。6対2で勝った。"}, {"t": 605.1833333333333, "x": "8月20日の準決勝は福島の聖光学院だった。"}, {"t": 608.8333333333334, "x": "準決勝で東北の学校どうしが当たったの？"}, {"t": 611.6833333333333, "x": "そうだ。東北の2校が決勝の1枠をかけて戦った。"}, {"t": 615.35, "x": "1回の裏、先に1点を取ったのは聖光学院だった。"}, {"t": 618.85, "x": "ところが2回の表、仙台育英は\nこの回だけで11点を取った。"}, {"t": 623.1, "x": "1回で11点？ 準決勝でそんなに入るのね。"}, {"t": 626.3, "x": "ああ。そのあとも点を重ね、\n仙台育英は19本の安打を打った。"}, {"t": 630.45, "x": "最後は18対4。仙台育英が大差で勝った。"}, {"t": 633.6333333333333, "x": "これで7年ぶり、3度目の夏の決勝が決まった。"}, {"t": 636.9833333333333, "x": "4試合で、ずいぶん点を取ったのね。"}, {"t": 639.3833333333333, "x": "4試合を足すと、取った点は39点。"}, {"t": 641.95, "x": "取られた点は10点だ。"}, {"t": 643.5, "x": "反対の山から勝ち上がったのは\n山口の下関国際だった。"}, {"t": 647.4166666666666, "x": "準々決勝で大阪桐蔭に5対4、\n準決勝で滋賀の近江に8対2で勝った。"}, {"t": 652.4666666666667, "x": "下関国際も初めての決勝だったの？"}, {"t": 655.3833333333333, "x": "そうだ。勝てば下関国際の初優勝で、\n山口県勢には64年ぶりの夏の優勝だった。"}, {"t": 661.6833333333333, "x": "どっちが勝っても初めての優勝だったのね。"}, {"t": 664.9333333333333, "x": "8月22日の決勝。3回までは、\nどちらにも点が入らなかった。"}, {"t": 669.5333333333333, "x": "4回の裏、仙台育英は\n2番打者の二塁打から1死三塁にした。"}, {"t": 673.8, "x": "4番打者がライト前に打ち返して、1点を先に取った。"}, {"t": 677.4166666666666, "x": "先に点を取ったのは仙台育英なのね。"}, {"t": 680.0166666666667, "x": "5回の表、下関国際は無死満塁にした。"}, {"t": 683.2666666666667, "x": "ところが犠打が失敗し、\n併殺にもなって点は入らなかった。"}, {"t": 687.1833333333333, "x": "大きなチャンスだったのに、もったいないわね。"}, {"t": 689.85, "x": "その裏、仙台育英は2死三塁から\n1番打者がセンター前に適時打を打った。"}, {"t": 694.6, "x": "盗塁のあと、2番打者もセンター前に\n打ち返した。これで3対0だ。"}, {"t": 698.9, "x": "6回の表、下関国際の先頭打者が\n右中間に三塁打を打った。"}, {"t": 703.4833333333333, "x": "3番打者の一塁ゴロの間に1点を返した。"}, {"t": 706.5, "x": "3対1。まだ分からないわね。"}, {"t": 708.65, "x": "そして7回の裏だ。無死一塁から\n1番打者が右中間を破る三塁打を打った。"}, {"t": 713.5, "x": "これで4対1。そのあと1死満塁になった。"}, {"t": 716.3833333333333, "x": "5番打者が左のスタンドに満塁本塁打を打った。"}, {"t": 719.4666666666667, "x": "この回に5点。8対1になった。"}, {"t": 721.9166666666666, "x": "冒頭の場面は、ここだったのね。"}, {"t": 724.15, "x": "仙台育英の先発の投手は7回を\n100球で投げ、3安打1失点だった。"}, {"t": 729.0333333333333, "x": "8回からは2人目の投手が\n登板し、2回を2安打に抑えた。"}, {"t": 732.95, "x": "下関国際の安打は全部で5本だった。"}, {"t": 735.8333333333334, "x": "2人の投手で1点に抑えたのね。"}, {"t": 738.1833333333333, "x": "ああ。8対1で試合が終わった。"}, {"t": 740.2666666666667, "x": "東北の学校の夏の決勝は、\n10度目でついに勝ちになった。"}, {"t": 744.0833333333334, "x": "仙台育英の3度目の決勝は8対1だった。"}, {"t": 747.75, "x": "仙台育英の夏の決勝を、\n日付の順にもう一度読み上げる。"}, {"t": 751.5333333333333, "x": "1989年8月22日、帝京に0対2。"}, {"t": 755.4, "x": "延長10回だった。"}, {"t": 756.85, "x": "2015年8月20日、東海大相模に6対10。"}, {"t": 760.3666666666667, "x": "8回までは6対6。"}, {"t": 762.0166666666667, "x": "2022年8月22日、下関国際に8対1。"}, {"t": 766.3833333333333, "x": "0点、6点、8点。取った点が回ごとに増えているわね。"}, {"t": 770.2666666666667, "x": "取られた点は2点、10点、1点だ。"}, {"t": 772.9, "x": "取られた点は、2度目だけ多いのね。"}, {"t": 775.2166666666667, "x": "決勝の前までの試合も、足して比べておく。"}, {"t": 778.0333333333333, "x": "1989年は5試合で、取った点が\n26点、取られた点が9点だった。"}, {"t": 783.4166666666666, "x": "2015年は5試合で、取った\n点が36点、取られた点が8点。"}, {"t": 787.8333333333334, "x": "2022年は4試合で、取った点が\n39点、取られた点が10点だ。"}, {"t": 792.7333333333333, "x": "2022年は試合が1つ少ないのに、\n取った点はいちばん多いのね。"}, {"t": 797.15, "x": "1回戦が無かった分、試合は4つで済んでいる。"}, {"t": 800.1166666666667, "x": "それでも、準決勝の18点が大きく効いている。"}, {"t": 803.2833333333333, "x": "もう1つ、春の2001年の6対7も\n入れて、4つの決勝の点を足してみる。"}, {"t": 808.4166666666666, "x": "取った点は0と6と6と8で20点。"}, {"t": 810.9, "x": "取られた点は2と7と10と1で、これも20点だ。"}, {"t": 814.3333333333334, "x": "ぴったり同じなの？"}, {"t": 815.7, "x": "そうだ。4つの決勝を足すと20対20。\nそのうち勝ったのは1つだけだ。"}, {"t": 820.55, "x": "点の合計は同じなのに、\n勝ったのは最後の1つだけなのね。"}, {"t": 824.3833333333333, "x": "ここから先は、記録を見たうえでの考えだ。"}, {"t": 826.9833333333333, "x": "決めつけではない。"}, {"t": 828.1666666666666, "x": "1度目は点が取れずに延長で負けた。"}, {"t": 830.4833333333333, "x": "2度目は点は取れたが、\n最後の1回で守り切れなかった。"}, {"t": 833.9833333333333, "x": "3度目は先に点を取り、取られた点は1点だけだった。"}, {"t": 837.4166666666666, "x": "3つの点数を並べると、足りなかった所が\n1つずつ埋まっていったようにも見える。"}, {"t": 842.3333333333334, "x": "点を取ることと最後まで守ること。\nその両方がそろったのが3度目ってことね。"}, {"t": 847.1333333333333, "x": "そういう読み方もできる、ということだ。"}, {"t": 849.4333333333333, "x": "公式の小史の書き方も、並べると流れが見える。"}, {"t": 852.6666666666666, "x": "1989年は、仙台育英が東北勢4校目の決勝進出。"}, {"t": 857.55, "x": "2003年は、またも大優勝旗は白河越えを果たせず。"}, {"t": 861.0833333333334, "x": "2015年は、東北勢8度目の決勝進出で、\nまたも厚い壁に阻まれた。"}, {"t": 866.2333333333333, "x": "そして2022年は、東北勢で初の優勝を果たした。"}, {"t": 870.15, "x": "「またも」が2回続いて、最後に\nやっと「初の優勝」になったのね。"}, {"t": 874.7166666666667, "x": "そうだ。4つの1行のうち、3つに\n仙台育英の名前が入っている。"}, {"t": 879.1666666666666, "x": "仙台育英の決勝は、\n東北の決勝の数え方そのものに入っているのね。"}, {"t": 883.9666666666667, "x": "もう1つ数字がある。"}, {"t": 885.2, "x": "2022年は第1回の1915年から数えて108年目だった。"}, {"t": 890.1166666666667, "x": "第1回の決勝にいた秋田中から、\n108年目の優勝なのね。"}, {"t": 894.3666666666667, "x": "そうだ。東北の学校の決勝は第1回から始まっていた。"}, {"t": 898.1166666666667, "x": "そして仙台育英は次の年も夏の決勝に出ている。"}, {"t": 901.45, "x": "2023年は2年続けての決勝だった。"}, {"t": 904.2666666666667, "x": "慶応に2対8で敗れた。"}, {"t": 906.2333333333333, "x": "4度目の決勝も、もうあったのね。"}, {"t": 908.5833333333334, "x": "ああ。2023年の決勝の話は\n慶応の回でくわしく話している。"}, {"t": 913.65, "x": "最初の問いに戻るわ。"}, {"t": 914.9333333333333, "x": "仙台育英の優勝は何度目の決勝だったの？"}, {"t": 918.0, "x": "夏の決勝の3度目だ。"}, {"t": 919.5, "x": "公式がそう書いている。"}, {"t": 921.0, "x": "東北の学校で数えると、夏は10度目で\n春夏合わせると13度目だった。"}, {"t": 925.7833333333333, "x": "1度目と3度目は同じ8月22日だったのよね。"}, {"t": 929.3, "x": "そうだ。1989年8月22日の0対2から、\n2022年8月22日の8対1まで33年。"}, {"t": 937.45, "x": "同じ日付の決勝で、2点の差が7点の勝ちに変わった。"}, {"t": 941.3, "x": "夏が来て8月22日になったら、\nこの2つの点数を思い出しそうね。"}, {"t": 946.05, "x": "最後まで見てくれて、ありがとう。"}, {"t": 948.0333333333333, "x": "面白かったら、チャンネル登録と\n高評価をよろしく頼む。"}, {"t": 951.65, "x": "東北の決勝の話、また聞かせてね。ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
