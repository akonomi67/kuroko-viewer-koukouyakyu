<script>
const D={"name": "旧制中学の今", "file": "008_編集用", "dur": 983.0333125, "segs": [], "subs": [{"t": 0.0, "x": "1948年8月20日。"}, {"t": 2.433333333333333, "x": "兵庫県の甲子園球場。"}, {"t": 4.2, "x": "夏の大会の決勝が行われていた。"}, {"t": 6.616666666666666, "x": "福岡の小倉と和歌山の桐蔭の試合だ。"}, {"t": 9.233333333333333, "x": "スコアは1対0。小倉が勝った。"}, {"t": 11.633333333333333, "x": "1対0ならすごく締まった試合ね。"}, {"t": 13.983333333333333, "x": "小倉のエースは福嶋一雄という投手だ。"}, {"t": 16.483333333333334, "x": "この大会の5試合を全部完封して勝った。"}, {"t": 19.25, "x": "5試合で1点も取られてないの？"}, {"t": 21.316666666666666, "x": "そうだ。小倉は前の年に続いて、\n2年連続の優勝だった。"}, {"t": 25.283333333333335, "x": "ただし前の年の優勝は、小倉中という名前だった。"}, {"t": 28.7, "x": "小倉中？中学校が甲子園で勝ったの？"}, {"t": 31.483333333333334, "x": "今の中学校とは違う。"}, {"t": 32.983333333333334, "x": "旧制中学という学校だ。"}, {"t": 34.88333333333333, "x": "この年の4月に小倉中は小倉高校になった。"}, {"t": 37.95, "x": "負けた桐蔭も、少し前まで和歌山中という名前だった。"}, {"t": 41.5, "x": "和歌山中は大正のころに、夏を2回続けて制している。"}, {"t": 45.28333333333333, "x": "決勝の2校とも元は中学だったのね。"}, {"t": 47.86666666666667, "x": "じゃあ昔の優勝校の中学って、今はどうなってるの？"}, {"t": 51.333333333333336, "x": "今回は、夏の大会を制した\n旧制中学の「その後」を辿る。"}, {"t": 55.65, "x": "優勝した年と今の学校の姿を、\n日付と数字をもとに見ていく。"}, {"t": 60.016666666666666, "x": "面白かったら、チャンネル登録と高評価をお願いね。"}, {"t": 63.9, "x": "まず旧制中学がどんな学校かを見ておこう。"}, {"t": 66.63333333333334, "x": "明治32年の中学校令で、\n男子のための学校と決められた。"}, {"t": 70.8, "x": "通うのは5年間だった。"}, {"t": 72.51666666666667, "x": "5年もあるのね。今の中学より長い。"}, {"t": 75.16666666666667, "x": "ああ。しかも男子だけの学校だった。"}, {"t": 77.51666666666667, "x": "夏の大会は、この中等学校の大会として始まった。"}, {"t": 81.18333333333334, "x": "第1回は1915年だ。"}, {"t": 83.31666666666666, "x": "戦争が終わると、学校の仕組みが大きく変わった。"}, {"t": 86.43333333333334, "x": "新しい高校は1948年度に始まった。"}, {"t": 89.81666666666666, "x": "文部科学省の学制百年史はこう書いている。"}, {"t": 92.7, "x": "旧制の中等学校がほとんど\nそのまま、新制高校に移った、と。"}, {"t": 97.11666666666666, "x": "だから1948年に、小倉中が小倉高校になったのね。"}, {"t": 101.56666666666666, "x": "そうだ。大会の名前も、この年に\n高校の大会に改められた。"}, {"t": 105.81666666666666, "x": "それまでの優勝校はどんな学校だったの？"}, {"t": 108.46666666666667, "x": "1915年から1948年までが、\n第1回から第30回にあたる。"}, {"t": 113.91666666666667, "x": "米騒動の1918年は、代表が\n決まったあとで中止になった。"}, {"t": 118.38333333333334, "x": "1941年は、地方大会の途中で中止になった。"}, {"t": 122.31666666666666, "x": "1942年から1945年は、戦争で開かれていない。"}, {"t": 127.0, "x": "優勝校の名前を見ると、「商」が付く学校が多い。"}, {"t": 130.25, "x": "広島商や高松商、中京商や松山商などだ。"}, {"t": 133.75, "x": "1925年には、高松商が初めて\n四国に優勝旗を持ち帰った。"}, {"t": 138.51666666666668, "x": "中京商は1931年から、3年続けて夏を制した。"}, {"t": 143.05, "x": "商業学校が強かったのね。"}, {"t": 145.08333333333334, "x": "ああ。一方で、名前が\n中学の「中」で終わる学校もある。"}, {"t": 148.5, "x": "その優勝は全部で13回だ。"}, {"t": 150.68333333333334, "x": "13回もあるんだ。"}, {"t": 152.13333333333333, "x": "今回はそのうち公立の6校を順に見ていく。"}, {"t": 154.95, "x": "京都二中と愛知一中と神戸一中。"}, {"t": 157.31666666666666, "x": "和歌山中と静岡中。そして小倉中だ。"}, {"t": 160.31666666666666, "x": "最初はやっぱり京都二中から？"}, {"t": 162.4, "x": "ああ。初めての優勝校だからな。"}, {"t": 165.2, "x": "京都二中は1900年にできた学校だ。"}, {"t": 167.95, "x": "正しい名前は京都府立第二中学校という。"}, {"t": 170.75, "x": "1915年。第1回の大会は、\n大阪の豊中球場で開かれた。"}, {"t": 175.61666666666667, "x": "参加したのは73校。"}, {"t": 177.26666666666668, "x": "全国大会に出たのは、10校だ。"}, {"t": 179.85, "x": "まだ甲子園は無かったのね。"}, {"t": 181.71666666666667, "x": "そうだ。甲子園球場ができるのは、1924年だ。"}, {"t": 185.5, "x": "このころはまだ、野球の決まりもそろっていなかった。"}, {"t": 188.58333333333334, "x": "そこで大会のために、11か条の決まりが作られた。"}, {"t": 192.0, "x": "試合の前と後のあいさつも、この大会で始まった。"}, {"t": 195.36666666666667, "x": "今もやってる整列してのあいさつね。"}, {"t": 197.71666666666667, "x": "優勝校には優勝旗が贈られることになった。"}, {"t": 200.45, "x": "出た選手全員には参加章が贈られた。"}, {"t": 202.96666666666667, "x": "選手の旅費は朝日新聞社が出した。"}, {"t": 205.31666666666666, "x": "決勝は京都二中と秋田中の試合になった。"}, {"t": 208.13333333333333, "x": "京都二中が2対1で勝った。"}, {"t": 210.2, "x": "じゃあ京都二中が最初の日本一なのね。"}, {"t": 212.88333333333333, "x": "ああ。初代の王者だ。"}, {"t": 214.3, "x": "負けた秋田中のほうにも、続きの話がある。"}, {"t": 217.21666666666667, "x": "2018年の第100回大会で、\n秋田の金足農が準優勝した。"}, {"t": 221.71666666666667, "x": "秋田の学校の準優勝は、第1回の秋田中以来だった。"}, {"t": 225.6, "x": "103年ぶりの準優勝ってことね。"}, {"t": 228.01666666666668, "x": "京都二中は、戦後の大会でも名前を残している。"}, {"t": 231.23333333333332, "x": "1946年に大会は、阪急西宮球場で再び開かれた。"}, {"t": 236.15, "x": "参加は745校で代表は19校だった。"}, {"t": 239.36666666666667, "x": "満州や朝鮮、台湾の大会は、\nこの年にはもう無くなっていた。"}, {"t": 243.51666666666668, "x": "戦争が終わってすぐに、大会が戻ってきたのね。"}, {"t": 246.71666666666667, "x": "その決勝に京都二中が勝ち上がった。"}, {"t": 249.13333333333333, "x": "相手は大阪の浪華商で0対2で敗れた。"}, {"t": 251.96666666666667, "x": "最初の大会で勝って、戦後すぐの大会で準優勝。"}, {"t": 255.38333333333333, "x": "それで京都二中は今はどうなってるの？"}, {"t": 257.76666666666665, "x": "ここが少しややこしい。"}, {"t": 259.2, "x": "今、京都二中の流れをくむ\n学校は、京都府立鳥羽高校だ。"}, {"t": 263.18333333333334, "x": "ただ鳥羽高校が開校したのは1984年だ。"}, {"t": 266.75, "x": "え、1984年？京都二中と、つながってないの？"}, {"t": 270.71666666666664, "x": "途切れずに続いた学校ではない。"}, {"t": 272.6166666666667, "x": "京都二中があった場所に、新しくできた学校だ。"}, {"t": 275.8, "x": "それでも鳥羽高校は、京二中の伝統を\n受け継ぐと書いている。"}, {"t": 279.3666666666667, "x": "文武両道と質実剛健の校風も、\n京都二中から受け継いだものだ。"}, {"t": 283.81666666666666, "x": "名前は変わっても、気持ちは受け継いでるのね。"}, {"t": 286.6, "x": "鳥羽高校は甲子園にも出ている。"}, {"t": 288.5833333333333, "x": "2000年は春と夏の両方に出た。"}, {"t": 290.81666666666666, "x": "春は2001年と2012年にも、出場している。"}, {"t": 294.3, "x": "そして夏は2015年にも出た。"}, {"t": 296.65, "x": "2015年って何か特別な年だった？"}, {"t": 299.53333333333336, "x": "夏の大会が始まって100年の年だった。"}, {"t": 302.28333333333336, "x": "鳥羽は15年ぶりに夏の京都を勝ち抜いた。"}, {"t": 304.9, "x": "開会式では、第1回に出た\n10校のユニホームが復刻された。"}, {"t": 308.9166666666667, "x": "それを着て行進が行われた。"}, {"t": 310.8333333333333, "x": "各校の代表が歩く予定だったが、\n鳥羽は選手全員で歩いた。"}, {"t": 314.8333333333333, "x": "100年前の優勝校のユニホームで、\n甲子園を歩いたのね。"}, {"t": 318.48333333333335, "x": "ああ。その大会で鳥羽は、ベスト16まで勝ち進んだ。"}, {"t": 322.01666666666665, "x": "今の鳥羽高校には、グローバル科や\nスポーツ総合専攻がある。"}, {"t": 325.6333333333333, "x": "2020年度からは、\n文部科学省のワールドワイドラーニングの拠点校だ。"}, {"t": 330.18333333333334, "x": "野球だけじゃなく、勉強のほうでも\n新しいことをしてるのね。"}, {"t": 333.8666666666667, "x": "冷泉流の和歌を詠む授業もあるそうだ。"}, {"t": 336.26666666666665, "x": "和歌の授業って京都らしいわね。"}, {"t": 338.8, "x": "次は名古屋の愛知一中だ。"}, {"t": 340.5833333333333, "x": "始まりは、1870年の名古屋藩立洋学校にさかのぼる。"}, {"t": 344.98333333333335, "x": "1870年って明治のはじめよね。"}, {"t": 347.81666666666666, "x": "ああ。1901年に、\n愛知県立第一中学校という名前になった。"}, {"t": 352.4166666666667, "x": "1917年。第3回の大会は、\n兵庫県西宮市の鳴尾に会場を移した。"}, {"t": 357.98333333333335, "x": "初めて入場式が行われた大会でもある。"}, {"t": 360.76666666666665, "x": "参加した学校は118校に増えていた。"}, {"t": 363.45, "x": "この大会で優勝したのが愛知一中だ。"}, {"t": 365.93333333333334, "x": "決勝の相手は関西学院中。"}, {"t": 367.85, "x": "スコアは1対0だった。"}, {"t": 369.6666666666667, "x": "決勝で1対0ってさっきの小倉と同じね。"}, {"t": 372.6333333333333, "x": "そうだな。このころは、\n敗者復活戦という制度もあった。"}, {"t": 376.35, "x": "負けてももう1回チャンスがあったの？"}, {"t": 378.5833333333333, "x": "そうだ。第2回で始まり、第5回でなくなった。"}, {"t": 381.75, "x": "愛知一中はその名前で、夏の大会に8回出ている。"}, {"t": 385.2, "x": "最後は1929年だった。"}, {"t": 387.51666666666665, "x": "甲子園にアルプススタンドができた年だ。"}, {"t": 390.1166666666667, "x": "あの大きなスタンドができた\n年が、最後の出場なのね。"}, {"t": 393.5833333333333, "x": "それで今はどうなってるの？"}, {"t": 395.26666666666665, "x": "1948年4月に、愛知県立第一高等学校になった。"}, {"t": 399.8833333333333, "x": "同じ年の10月に、\n名古屋市立の高等女学校と一緒になった。"}, {"t": 403.93333333333334, "x": "こうして生まれたのが愛知県立旭丘高校だ。"}, {"t": 407.1, "x": "男子校と女学校がひとつになったのね。"}, {"t": 409.75, "x": "旭丘高校には、洋学校のころからの本が残っている。"}, {"t": 413.53333333333336, "x": "およそ6千冊が、今も学校の書庫にあるそうだ。"}, {"t": 416.85, "x": "6千冊も！150年分の歴史ね。"}, {"t": 419.71666666666664, "x": "坪内逍遥や二葉亭四迷も、\nこの学校で学んだとされる。"}, {"t": 423.5, "x": "愛知県から出た初めての総理大臣、加藤高明もそうだ。"}, {"t": 427.28333333333336, "x": "教科書に出てくる人ばかりね。"}, {"t": 429.3333333333333, "x": "ただ、旭丘高校の名前では、\n甲子園に出た記録は無い。"}, {"t": 433.31666666666666, "x": "日本一になった学校なのに意外ね。"}, {"t": 436.31666666666666, "x": "3校目は兵庫の神戸一中だ。"}, {"t": 438.3333333333333, "x": "1896年に、兵庫県神戸尋常中学校として開校した。"}, {"t": 443.03333333333336, "x": "1907年に、兵庫県立第一神戸中学校という\n名前になった。"}, {"t": 447.73333333333335, "x": "それで略して神戸一中なのね。"}, {"t": 449.9166666666667, "x": "1918年の大会は米騒動で中止になった。"}, {"t": 453.45, "x": "次の1919年の第5回で、勝ったのが神戸一中だ。"}, {"t": 457.43333333333334, "x": "決勝の相手は長野師範。7対4で勝った。"}, {"t": 460.3833333333333, "x": "この年に参加したのは134校だ。"}, {"t": 463.2, "x": "師範って先生になる人の学校よね。"}, {"t": 465.78333333333336, "x": "そうだ。この大会から、敗者復活戦がなくなった。"}, {"t": 469.28333333333336, "x": "負けたら終わりの、勝ち抜き戦になったんだ。"}, {"t": 471.9, "x": "その最初の大会を制したのが、\n神戸一中というわけだ。"}, {"t": 475.53333333333336, "x": "今と同じ形の最初の優勝校なのね。"}, {"t": 478.28333333333336, "x": "神戸一中は夏の大会に4回出ている。"}, {"t": 480.8833333333333, "x": "1919年と1921年と1934年。そして、1947年だ。"}, {"t": 487.51666666666665, "x": "1934年は、20回の記念に\n甲子園の前に野球塔が建った年だ。"}, {"t": 492.68333333333334, "x": "1947年って戦争のあとね。"}, {"t": 495.53333333333336, "x": "ああ。まだ旧制中学の名前のままで、出ている。"}, {"t": 498.5833333333333, "x": "次の1948年4月に、兵庫県立第一神戸高校となった。"}, {"t": 503.4166666666667, "x": "9月には、女学校から変わった高校と一緒になった。"}, {"t": 506.76666666666665, "x": "これが今の兵庫県立神戸高校だ。"}, {"t": 509.23333333333335, "x": "愛知一中と同じような流れね。"}, {"t": 511.35, "x": "そうだな。神戸高校の名前でも、\n甲子園に出た記録は無い。"}, {"t": 515.0666666666667, "x": "それでも、一中のころからの伝統は残っている。"}, {"t": 518.0333333333333, "x": "近くの兵庫高校との定期戦だ。"}, {"t": 520.25, "x": "かつては5月に野球の試合をしていたと、\n学校は書いている。"}, {"t": 523.85, "x": "1967年度からは、春と秋の総合定期戦になった。"}, {"t": 528.2666666666667, "x": "野球の試合から始まった定期戦なのね。"}, {"t": 531.0, "x": "2008年には、野球部の歴史を\n学ぶ講座も学校で開かれている。"}, {"t": 535.4, "x": "自分の学校の野球の歴史を学べるのは、いいわね。"}, {"t": 539.2166666666667, "x": "4校目は和歌山中だ。"}, {"t": 540.85, "x": "1879年に和歌山中学校として開かれた、古い学校だ。"}, {"t": 545.5666666666667, "x": "高野連の出場校一覧を見ると、面白いことがわかる。"}, {"t": 549.1, "x": "1915年から1928年まで、\n和歌山の欄は毎年和歌山中だ。"}, {"t": 554.5833333333334, "x": "14年も和歌山の代表を譲らなかったの？"}, {"t": 557.4, "x": "ああ。そして1921年の第7回で、初めて優勝した。"}, {"t": 561.7833333333333, "x": "決勝は京都一商に16対4。"}, {"t": 563.9666666666667, "x": "この年の参加は207校。"}, {"t": 565.8, "x": "初めて200校を超えた年だ。"}, {"t": 567.8166666666667, "x": "この大会では本塁打が10本も出ている。"}, {"t": 570.45, "x": "決勝で16点ってすごい打ち合いね。"}, {"t": 572.85, "x": "次の1922年も、和歌山中が勝ち上がった。"}, {"t": 576.4333333333333, "x": "決勝の相手は神戸商。8対4で勝った。"}, {"t": 579.2666666666667, "x": "夏の大会で初めての連覇だ。"}, {"t": 581.4833333333333, "x": "2年続けて日本一なのね。"}, {"t": 583.5833333333334, "x": "この年の12月には、皇太子が学校を訪れた。"}, {"t": 586.8666666666667, "x": "のちの昭和天皇だ。"}, {"t": 588.25, "x": "学校の記録には、球界初の台覧試合と書かれている。"}, {"t": 591.95, "x": "台覧試合って皇太子が見る試合ってこと？"}, {"t": 594.6666666666666, "x": "そうだ。1923年には、3連覇をかけて決勝に進んだ。"}, {"t": 599.1166666666667, "x": "ただ甲陽中に2対5で敗れた。"}, {"t": 601.3333333333334, "x": "3連覇はあと一歩だったのね。"}, {"t": 603.3166666666667, "x": "1927年には、春の選抜でも優勝している。"}, {"t": 607.05, "x": "第4回の選抜大会だ。"}, {"t": 608.8, "x": "春と夏の両方で、日本一になったことになる。"}, {"t": 612.1666666666666, "x": "春も夏も勝ってるなんて、本当に強かったのね。"}, {"t": 615.4666666666667, "x": "1948年3月に、和歌山中として\n最後の卒業式を迎えた。"}, {"t": 620.4833333333333, "x": "5月に開校式があり、校名は桐蔭高校と決まった。"}, {"t": 624.0833333333334, "x": "それで冒頭の決勝の桐蔭につながるのね。"}, {"t": 626.8333333333334, "x": "そうだ。桐蔭になった最初の夏に、決勝まで進んだ。"}, {"t": 630.4166666666666, "x": "1961年の夏にも準優勝している。"}, {"t": 633.6166666666667, "x": "2015年の春には、21世紀枠で選ばれた。"}, {"t": 636.9333333333333, "x": "53年ぶり16回目の出場だった。"}, {"t": 639.7333333333333, "x": "53年ぶりって半世紀以上ね。"}, {"t": 641.9666666666667, "x": "和歌山の人たちはきっと待ってたのね。"}, {"t": 645.0, "x": "5校目は静岡中だ。"}, {"t": 646.5333333333333, "x": "始まりは1878年。"}, {"t": 648.6333333333333, "x": "静岡師範学校の中に置かれた、中学課だった。"}, {"t": 652.05, "x": "1901年に、静岡県立静岡中学校という名前になった。"}, {"t": 656.5166666666667, "x": "1924年は甲子園球場ができた年だ。"}, {"t": 659.7333333333333, "x": "大きな球場も、3日目には\n満員で入場を断る掲示が出た。"}, {"t": 663.6833333333333, "x": "できたばかりでもう満員なのね。"}, {"t": 665.7, "x": "この大会で、静岡中の田中一塁手が\n大会初の満塁本塁打を打った。"}, {"t": 670.6166666666667, "x": "甲子園の最初の年に、最初の満塁ホームランなのね。"}, {"t": 674.1333333333333, "x": "この大会では、本塁打が19本も記録された。"}, {"t": 677.4833333333333, "x": "広い球場なのにずいぶん出たのね。"}, {"t": 679.7166666666667, "x": "そして1926年の第12回大会だ。"}, {"t": 682.95, "x": "この年に大会の歌が作られている。"}, {"t": 685.2833333333333, "x": "前の年からは、試合の様子がラジオで\n伝えられるようになっていた。"}, {"t": 689.15, "x": "準々決勝で静岡中は、群馬の前橋中と当たった。"}, {"t": 692.7666666666667, "x": "この試合は延長19回までもつれた。"}, {"t": 695.3166666666667, "x": "19回！それを勝ち抜いたの？"}, {"t": 697.4666666666667, "x": "ああ。静岡中は勝ち進んで、決勝にたどり着いた。"}, {"t": 700.8, "x": "決勝の相手は満州の大連商だった。"}, {"t": 703.4, "x": "満州から来た学校もあったのね。"}, {"t": 705.65, "x": "当時は満州や朝鮮、台湾からも代表が来ていた。"}, {"t": 708.9, "x": "決勝は2対1。静岡中が、初めて日本一になった。"}, {"t": 712.8, "x": "戦後の1948年に、静岡第一高校になった。"}, {"t": 716.85, "x": "1949年に静岡城内高校、1953年に\n静岡高校と名前が変わった。"}, {"t": 723.1833333333333, "x": "名前が3回も変わったのね。"}, {"t": 725.1666666666666, "x": "静岡高校は戦後も甲子園に出続けている。"}, {"t": 728.0, "x": "夏の出場は26回。いちばん最近は、2021年だ。"}, {"t": 732.2166666666667, "x": "春も17回出ていて最近は2018年だ。"}, {"t": 735.4666666666667, "x": "今もずっと強いのね。"}, {"t": 737.0333333333333, "x": "野球部の目標は、今も甲子園優勝だと書かれている。"}, {"t": 740.5833333333334, "x": "100年前の優勝をもう一度ってことね。"}, {"t": 743.6333333333333, "x": "最後は冒頭に出てきた小倉中だ。"}, {"t": 745.8666666666667, "x": "1908年4月に、県立小倉中学校として開校した。"}, {"t": 750.15, "x": "戦争で止まった大会は、1946年に再び開かれた。"}, {"t": 754.5833333333334, "x": "そして1947年。会場は、7年ぶりに甲子園に戻った。"}, {"t": 759.1833333333333, "x": "参加校は初めて1000校を超えた。"}, {"t": 761.2833333333333, "x": "全部で1125校が参加した。"}, {"t": 763.7666666666667, "x": "戦争のあとなのにそんなに集まったのね。"}, {"t": 766.4, "x": "8月19日の決勝は、小倉中と岐阜商の試合だった。"}, {"t": 770.2333333333333, "x": "6対3で小倉中が勝った。"}, {"t": 772.2166666666667, "x": "優勝旗が初めて九州に渡った。"}, {"t": 774.6166666666667, "x": "それまで、九州の学校は勝ててなかったのね。"}, {"t": 777.65, "x": "エースはさっきの福嶋一雄だ。"}, {"t": 779.6166666666667, "x": "1947年は、全5試合を1人で投げ切った。"}, {"t": 783.2833333333333, "x": "1948年4月1日に、小倉中は小倉高校になった。"}, {"t": 787.8166666666667, "x": "この年から代表は23校に増えた。"}, {"t": 790.3333333333334, "x": "新しい大会の歌も公募で作られた。"}, {"t": 792.7833333333333, "x": "そして8月20日の決勝で、桐蔭を1対0で破った。"}, {"t": 796.55, "x": "5試合すべて完封しての連覇だ。"}, {"t": 798.7833333333333, "x": "中学で1回、高校で1回。"}, {"t": 800.7333333333333, "x": "名前をまたいだ連覇なのね。"}, {"t": 802.6333333333333, "x": "そういうことだ。"}, {"t": 803.6333333333333, "x": "旧制中学と新制高校の両方で、夏を制したことになる。"}, {"t": 807.6, "x": "福嶋は1931年生まれで、2020年に亡くなった。"}, {"t": 811.9, "x": "2013年には野球殿堂に入っている。"}, {"t": 814.6666666666666, "x": "高校野球の投手で殿堂入りしてるのね。"}, {"t": 817.2833333333333, "x": "ああ。2年連続の偉業が認められたんだ。"}, {"t": 819.8833333333333, "x": "小倉高校は、1949年から男女共学になった。"}, {"t": 823.95, "x": "1950年には小倉商業高校が加わった。"}, {"t": 827.2166666666667, "x": "1960年に、商業科は小倉商業高校として分かれた。"}, {"t": 831.55, "x": "一緒になったり分かれたり、いろいろあったのね。"}, {"t": 834.3, "x": "1963年には、創立55周年の事業で\n野球場の整備も始まった。"}, {"t": 840.25, "x": "公立の6校はわかったけど、私立の学校は？"}, {"t": 843.3833333333333, "x": "私立にも夏を制した中学がある。"}, {"t": 845.6166666666667, "x": "まず1916年の慶応普通部。"}, {"t": 848.0, "x": "決勝で市岡中に、6対2で勝った。"}, {"t": 850.6833333333333, "x": "2023年の夏に、慶応が仙台育英を\n8対2で破って優勝した。"}, {"t": 855.4166666666666, "x": "高野連はこれを、\n107年ぶり2度目の優勝と書いている。"}, {"t": 859.0333333333333, "x": "1916年の優勝から数えてるのね。"}, {"t": 862.0666666666667, "x": "そうだ。107年の時をこえて、記録がつながった。"}, {"t": 865.5, "x": "1920年の関西学院中は、決勝で\n慶応普通部に17対0で勝った。"}, {"t": 870.9333333333333, "x": "17対0って決勝なのに大差ね。"}, {"t": 873.5, "x": "1923年は甲陽中。今の甲陽学院だ。"}, {"t": 877.05, "x": "この年から、優勝校には\nレプリカも贈られるようになった。"}, {"t": 880.55, "x": "甲子園にあった中学が高校になり、\n中学は香櫨園に新しく作られた。"}, {"t": 885.15, "x": "1938年は平安中。"}, {"t": 887.3666666666667, "x": "今の龍谷大平安だ。"}, {"t": 889.1, "x": "1910年に平安中学校が始まり、\n1948年に平安高校になった。"}, {"t": 894.8833333333333, "x": "1939年と1940年は海草中。"}, {"t": 898.3833333333333, "x": "今の、向陽高校になる。"}, {"t": 900.2666666666667, "x": "1939年は、嶋投手が5試合を完封して優勝した。"}, {"t": 904.6666666666666, "x": "小倉の福嶋さんと同じ5試合完封ね。"}, {"t": 907.45, "x": "ああ。海草中の話は、前の回でくわしく取り上げた。"}, {"t": 911.0666666666667, "x": "私立も公立も、名前を変えて今も続いてるのね。"}, {"t": 914.35, "x": "13回の優勝のうち、1校で\n2回勝ったのは和歌山中と海草中だ。"}, {"t": 919.0333333333333, "x": "和歌山の学校が、2校とも連覇してるのね。"}, {"t": 922.5833333333334, "x": "最初の1948年の決勝、小倉と桐蔭だったわよね。"}, {"t": 926.9166666666666, "x": "ああ。あの2校は、どちらも元は旧制中学だ。"}, {"t": 930.0166666666667, "x": "小倉中と和歌山中。どちらも\n中学の名前で夏に勝っている。"}, {"t": 934.0666666666667, "x": "名前が高校に変わったその年に、\n元の優勝校どうしが決勝で会ったのね。"}, {"t": 938.7666666666667, "x": "そうだ。1948年に、どの学校も高校に変わった。"}, {"t": 942.95, "x": "旭丘や神戸高校のように、\n女学校と一緒になった学校もある。"}, {"t": 947.0666666666667, "x": "鳥羽のように今も甲子園に出る学校もあれば、\n出場の記録が無い学校もある。"}, {"t": 951.8666666666667, "x": "じゃあ、旧制中学の優勝校は、今どうなったの？"}, {"t": 955.1833333333333, "x": "名前も形も変わった。"}, {"t": 956.65, "x": "強さが続いた学校も、野球から離れた学校もある。"}, {"t": 960.1833333333333, "x": "それでも、鳥羽は復刻のユニホームで行進し、\n静岡高校は今も甲子園優勝を目標に掲げている。"}, {"t": 966.4166666666666, "x": "神戸高校は、野球から始まった\n定期戦を今も続けている。"}, {"t": 970.3333333333334, "x": "100年前の優勝旗は、\n今の学校の中でまだ生きてるのね。"}, {"t": 974.2, "x": "ああ。君の町の高校も、昔は\n別の名前だったかもしれないぞ。"}, {"t": 978.3833333333333, "x": "その名前をたどったら、思わぬ\n優勝が出てくるかもね。またね。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
