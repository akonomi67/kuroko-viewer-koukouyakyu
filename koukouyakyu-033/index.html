<title>決勝で初めてのタイブレーク</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}

.badge{position:absolute;left:12px;top:12px;background:rgba(127,127,127,.16);color:var(--dim);

<script>
const D={"name": "決勝で初めてのタイブレーク", "file": "033_編集用", "dur": 912.6, "segs": [], "subs": [{"t": 0.0, "x": "2024年8月23日、阪神甲子園球場。"}, {"t": 3.6333333333333333, "x": "夏の大会の決勝だ。"}, {"t": 5.316666666666666, "x": "京都の京都国際と東東京の関東第一が戦った。"}, {"t": 9.1, "x": "京都の学校と東京の学校の決勝だ。"}, {"t": 11.716666666666667, "x": "どちらが勝っても、その学校にとって\n初めての夏の優勝になる組み合わせだった。"}, {"t": 16.55, "x": "スタンドには3万6千人が入っていた。"}, {"t": 19.166666666666668, "x": "1回から9回まで、\nどちらのスコアボードにも0が並んだ。"}, {"t": 22.783333333333335, "x": "9回が終わって0対0。"}, {"t": 24.366666666666667, "x": "試合は延長に入った。"}, {"t": 26.083333333333332, "x": "決勝で延長なら、昔からときどきあったんじゃないの？"}, {"t": 29.516666666666666, "x": "ああ。延長になった決勝は前にもある。"}, {"t": 31.916666666666668, "x": "ただこの日の10回は、\nそれまでの決勝の延長とは始まり方が違った。"}, {"t": 36.416666666666664, "x": "10回の表。京都国際の攻撃は、いきなり\n一塁と二塁に走者がいる場面から始まった。"}, {"t": 42.18333333333333, "x": "アウトは1つもない。無死一・二塁だ。"}, {"t": 44.6, "x": "打つ前から走者がいるの？"}, {"t": 46.333333333333336, "x": "そうだ。これがタイブレークという決まりだ。"}, {"t": 48.7, "x": "日本高等学校野球連盟の大会小史は、\nこの試合をこう書いている。"}, {"t": 53.0, "x": "京都国際が、決勝では初となる\n延長10回タイブレークの末、2対1で\n関東第一に勝って初優勝した。"}, {"t": 59.93333333333333, "x": "決勝では初めてなのね。"}, {"t": 61.71666666666667, "x": "今回はこの1試合だけを追う。"}, {"t": 63.583333333333336, "x": "なぜ2024年まで決勝で\nタイブレークが使われなかったのか。"}, {"t": 67.41666666666667, "x": "そして初めての10回に何が起きたのか。"}, {"t": 70.05, "x": "始める前に、チャンネル登録と高評価をお願いしたい。"}, {"t": 73.46666666666667, "x": "よろしくね。"}, {"t": 74.96666666666667, "x": "そもそもタイブレークって、ふつうの延長と何が違うの？"}, {"t": 78.48333333333333, "x": "ふつうの延長は、9回までと同じだ。"}, {"t": 80.78333333333333, "x": "走者なしで回を始める。"}, {"t": 82.48333333333333, "x": "タイブレークは決まった回から、\n無死一・二塁で始める。"}, {"t": 85.66666666666667, "x": "点が入りやすい形を最初から作っておくわけだ。"}, {"t": 88.88333333333334, "x": "早く決着をつけるための決まりなのね。"}, {"t": 91.51666666666667, "x": "そうだ。もう1つ大事なところがある。打つ順番だ。"}, {"t": 94.78333333333333, "x": "打順は前の回の続きから始まる。"}, {"t": 96.91666666666667, "x": "好きな打者を選んで打たせることはできない。"}, {"t": 99.53333333333333, "x": "じゃあ誰から始まるかは、\nそれまでの試合の流れで決まるのね。"}, {"t": 103.28333333333333, "x": "ああ。2024年の決勝では、\nこれが10回の表に効いてくる。"}, {"t": 107.5, "x": "どう効いたのかは、あとのお楽しみね。"}, {"t": 110.36666666666666, "x": "タイブレークが夏の甲子園で初めて\n使われたのは、2018年の夏だ。"}, {"t": 114.98333333333333, "x": "この年の話は別の動画に回す。\nここでは決勝の扱いだけを見る。"}, {"t": 119.31666666666666, "x": "2018年の決まりでは、タイブレークは\n延長13回から始まった。"}, {"t": 123.68333333333334, "x": "そして決勝だけは、タイブレークを\n使わないと決められていた。"}, {"t": 127.35, "x": "決勝だけ特別だったの？"}, {"t": 129.25, "x": "ああ。決勝は延長15回で打ち切り、\n翌日以降に再試合をする。"}, {"t": 133.4, "x": "その再試合のほうでタイブレークを\n使う、という決まりだった。"}, {"t": 136.76666666666668, "x": "決勝でない試合は逆だ。"}, {"t": 138.25, "x": "13回から走者を置き、決着がつくまで続ける。"}, {"t": 141.63333333333333, "x": "15回を過ぎても打ち切らない。"}, {"t": 143.5, "x": "ただし1人の投手が投げてよいのは\n15回まで、とされた。"}, {"t": 147.13333333333333, "x": "決勝とそれ以外で、終わり方がまるで違ったのね。"}, {"t": 150.26666666666668, "x": "最後の1試合は、できるだけ\nふつうの野球で決めたかったのかしら。"}, {"t": 154.31666666666666, "x": "理由までは、ここで見た記事には書かれていない。"}, {"t": 156.86666666666667, "x": "決まりの中身だけを言っておく。"}, {"t": 158.76666666666668, "x": "そのあと2022年の暮れに、\n日本高野連は始める回を変えた。"}, {"t": 162.96666666666667, "x": "2023年からは、延長13回ではなく\n延長10回からタイブレークになった。"}, {"t": 168.03333333333333, "x": "投手の球数の制限や体の守り、\n夏の暑さを考えたと報じられている。"}, {"t": 172.91666666666666, "x": "13回から10回へ。"}, {"t": 174.33333333333334, "x": "ずいぶん早くなったのね。"}, {"t": 176.08333333333334, "x": "3回早く始まる。9回で決まらなければ、\nすぐ次の回から走者が置かれる。"}, {"t": 181.08333333333334, "x": "延長が長く続くことは、前より少なくなるのね。"}, {"t": 184.45, "x": "そう考えられる。投げる回が減れば\n投手の体の負担も小さくなる。"}, {"t": 188.63333333333333, "x": "そして2024年の夏の決勝では、9回が終わって\n同点なら10回からタイブレークに入る。"}, {"t": 194.45, "x": "その形で迎えたのが、京都国際と\n関東第一の決勝だった。"}, {"t": 199.3, "x": "じゃあ、それまでの決勝の延長は\nどうやって終わってたの？"}, {"t": 202.6, "x": "日本高野連の大会小史から、\n決勝の延長を3つだけ拾う。"}, {"t": 206.63333333333333, "x": "1969年の決勝は松山商と三沢。"}, {"t": 209.83333333333334, "x": "延長18回を0対0で終えた。"}, {"t": 212.11666666666667, "x": "決着がつかず、次の日の再試合で\n松山商が4対2で勝った。"}, {"t": 216.3, "x": "1996年の決勝は松山商と熊本工。"}, {"t": 219.76666666666668, "x": "延長11回で松山商が6対3で勝った。"}, {"t": 222.83333333333334, "x": "これは再試合ではない。ふつうの延長で、\nその日のうちに決まった。"}, {"t": 226.76666666666668, "x": "2006年の決勝は早稲田実業と駒大苫小牧。"}, {"t": 229.95, "x": "延長15回を1対1で終えた。"}, {"t": 232.11666666666667, "x": "再試合で早稲田実業が4対3で勝った。"}, {"t": 234.66666666666666, "x": "小史は、37年ぶりの決勝引き分け\n再試合と書いている。"}, {"t": 238.76666666666668, "x": "同じ延長でも、終わり方がばらばらね。"}, {"t": 241.36666666666667, "x": "そうだ。どれも走者なしで\n回を始める、ふつうの延長だった。"}, {"t": 245.15, "x": "1969年の18回も2006年の15回も、どの回も\n先頭の打者は走者なしで打席に立った。"}, {"t": 252.1, "x": "決まった回で打ち切るか、\nどちらかが点を取るまで続けるか。"}, {"t": 255.53333333333333, "x": "違いはそこだった。"}, {"t": 256.85, "x": "2つの再試合の中身は、それぞれ別の回で話す。"}, {"t": 260.35, "x": "じゃあ走者を置いて始めた\n決勝は、2024年が最初なのね。"}, {"t": 264.4166666666667, "x": "ああ。そこへ向かう2校の夏を、先に見ておこう。"}, {"t": 268.03333333333336, "x": "まず京都国際だ。日本高野連の日程の頁から、\n決勝までの結果を並べる。"}, {"t": 273.2, "x": "1回戦は8月8日。\n南北海道の札幌日大に7対3で勝った。"}, {"t": 278.0833333333333, "x": "1回に4点を取り、3回に1点と4回に2点を足している。"}, {"t": 282.15, "x": "1回から4点。最初から打ってるのね。"}, {"t": 284.8333333333333, "x": "2回戦は8月14日。"}, {"t": 286.55, "x": "新潟の新潟産大付に4対0。"}, {"t": 288.98333333333335, "x": "この試合は6回まで0対0だった。"}, {"t": 291.35, "x": "7回にやっと1点を取り、8回に3点を足した。"}, {"t": 294.65, "x": "3回戦は8月17日。"}, {"t": 296.6, "x": "福岡の西日本短大付に4対0。"}, {"t": 299.28333333333336, "x": "2回に2点。5回に1点。"}, {"t": 301.0, "x": "9回に1点。少しずつ点を重ねた。"}, {"t": 303.71666666666664, "x": "準々決勝は8月19日。"}, {"t": 305.71666666666664, "x": "奈良の智辯学園に4対0。"}, {"t": 307.76666666666665, "x": "4回に2点を先に取り、5回と7回に1点ずつ足した。"}, {"t": 311.68333333333334, "x": "4対0が3つ続いてるわ。"}, {"t": 313.71666666666664, "x": "そうだ。3試合続けて、相手に\n1点もやらずに勝っている。"}, {"t": 317.4166666666667, "x": "27回のあいだ、相手のスコアボードには\n0しか並ばなかったことになる。"}, {"t": 321.95, "x": "決勝の9回までの0も、その続きみたいね。"}, {"t": 325.1333333333333, "x": "準決勝は8月21日。"}, {"t": 327.15, "x": "青森の青森山田と当たった。"}, {"t": 329.1666666666667, "x": "1回に2点を先に取られた。"}, {"t": 331.0833333333333, "x": "京都国際は5回まで0点。"}, {"t": 332.8333333333333, "x": "6回に3点を取ってひっくり返した。"}, {"t": 335.3333333333333, "x": "そのあとは両校とも点が入らず、3対2で逃げ切った。"}, {"t": 338.9, "x": "決勝の前に、もう1点差の試合をしてたのね。"}, {"t": 341.98333333333335, "x": "ああ。決勝までの5試合で取られた\n点は、合わせて5点だった。"}, {"t": 345.6666666666667, "x": "取った点は7点と4点と4点と4点と3点。"}, {"t": 348.75, "x": "合わせて22点だ。"}, {"t": 350.85, "x": "次は関東第一だ。関東第一は2回戦からの登場だった。"}, {"t": 354.8333333333333, "x": "2回戦は8月12日。"}, {"t": 356.56666666666666, "x": "福井の北陸に7対1で勝った。"}, {"t": 358.9166666666667, "x": "1回に1点を先に取られたが、3回から\n8回まで5つの回で点を取った。"}, {"t": 363.81666666666666, "x": "この試合だけは点差が大きいのね。"}, {"t": 366.03333333333336, "x": "3回戦は8月16日。"}, {"t": 367.95, "x": "高知の明徳義塾に3対2。"}, {"t": 370.05, "x": "2回に1点を先に取ったが、3回に\n2点を取られて逆転された。"}, {"t": 374.2, "x": "5回と6回に1点ずつ取って、もう1度ひっくり返した。"}, {"t": 377.85, "x": "7回から9回は、両校とも0点だった。"}, {"t": 380.75, "x": "準々決勝は8月19日。"}, {"t": 382.75, "x": "神奈川の東海大相模に2対1。"}, {"t": 385.1166666666667, "x": "7回に1点を取り、9回表にもう1点。\nその裏に1点を返されて逃げ切った。"}, {"t": 390.35, "x": "2対1、3対2。点差がずっと小さいのね。"}, {"t": 393.48333333333335, "x": "準決勝は8月21日。"}, {"t": 395.48333333333335, "x": "鹿児島の神村学園だ。"}, {"t": 397.31666666666666, "x": "4回に1点を先に取られ、7回に2点を取って逆転した。"}, {"t": 401.25, "x": "9回には、本塁へ突っ込んだ走者を\n中堅手からの返球でアウトにしている。"}, {"t": 405.85, "x": "2対1。これで3試合続けての1点差の勝ちになった。"}, {"t": 409.4, "x": "4試合で取った点は合わせて14点。"}, {"t": 411.56666666666666, "x": "取られた点は5点だった。"}, {"t": 413.21666666666664, "x": "関東第一にとって、夏の甲子園で\n初めての決勝だった。"}, {"t": 417.1666666666667, "x": "どっちも少ない点で勝ってきたチームなのね。"}, {"t": 419.9166666666667, "x": "そうだ。決勝が0対0のまま進んだのも、\nこの並びを見ると分かる気がする。"}, {"t": 424.65, "x": "ここは記録を見たうえでの考えだ。"}, {"t": 426.5833333333333, "x": "決めつけではない。"}, {"t": 428.3666666666667, "x": "では決勝だ。先に攻めたのは京都国際。"}, {"t": 431.05, "x": "関東第一は後から攻める。"}, {"t": 432.9, "x": "京都国際の先発投手は、5回まで\n関東第一の安打を1本に抑えた。"}, {"t": 437.6333333333333, "x": "それでも関東第一は、3回と5回に\n走者を二塁まで進めている。"}, {"t": 441.81666666666666, "x": "そのたびに京都国際の内野が打球を\nさばいて、点を与えなかった。"}, {"t": 446.01666666666665, "x": "守りで止めたのね。"}, {"t": 447.43333333333334, "x": "6回の表は京都国際の好機だった。"}, {"t": 449.9, "x": "1死二・三塁まで攻めた。"}, {"t": 451.6166666666667, "x": "ところが続く打者が倒れて、点は入らなかった。"}, {"t": 454.6666666666667, "x": "その裏の関東第一は、2死から\n内野安打と盗塁で走者を二塁に進めた。"}, {"t": 459.3, "x": "ここも点にはならなかった。"}, {"t": 461.1333333333333, "x": "両方とも、あと1本が出ないのね。"}, {"t": 463.533333333  "決勝だけは再試合、という時代はもう終わったのね。"}, {"t": 820.0833333333334, "x": "そうだ。2018年に入ったとき、\n決勝は延長15回で打ち切りだった。"}, {"t": 824.8833333333333, "x": "2024年の決勝は、延長10回の表から走者がいた。"}, {"t": 828.85, "x": "わずか6年で、決勝の延長の始まり方は\nここまで変わった。"}, {"t": 832.85, "x": "同じ「延長の決勝」でも、1969年や\n2006年とは別の試合になったのね。"}, {"t": 839.4333333333333, "x": "最初の問いに戻るわ。"}, {"t": 840.7166666666667, "x": "夏の決勝の延長は、いつも\n同じ決まりで終わってきたの？"}, {"t": 844.4166666666666, "x": "違う。1969年と2006年は、決まった\n回で打ち切って再試合になった。"}, {"t": 849.8833333333333, "x": "1996年は走者なしのふつうの延長で、\nその日のうちに決まった。"}, {"t": 854.6333333333333, "x": "そして2024年は、10回を\n無死一・二塁から始めて決まった。"}, {"t": 858.8, "x": "公式は、決勝がタイブレークで\n決まったのはこれが初めてと記している。"}, {"t": 863.15, "x": "同じ決勝の延長でも、時代で\n決まりが変わってきたのね。"}, {"t": 866.85, "x": "1969年の決勝は、18回を戦っても決まらなかった。"}, {"t": 871.4666666666667, "x": "2024年の決勝は、10回の1つの回で決まった。"}, {"t": 875.3166666666667, "x": "18回と10回。同じ決勝でも、ずいぶん違うわね。"}, {"t": 878.9, "x": "9回までの0対0も10回の3点も、両方そろって\n初めての決勝の形になったのね。"}, {"t": 884.8, "x": "ああ。2024年の10回の表は、9番の打順に\n代打が立つところから始まった。"}, {"t": 890.1833333333333, "x": "前の回の続きから打つ、という\n決まりがあったから生まれた場面だ。"}, {"t": 894.0833333333334, "x": "次に決勝が延長になったら、\n10回の最初の打者が誰になるかを見てみるわ。"}, {"t": 898.9166666666666, "x": "それがいい。誰から始まるかで、\n守りの形も作戦も変わる。"}, {"t": 902.85, "x": "最後まで見てくれて、ありがとう。"}, {"t": 904.8333333333334, "x": "面白かったら、チャンネル登録と\n高評価をよろしく頼む。"}, {"t": 908.4833333333333, "x": "10回の最初の1球、見逃さないでね。ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
