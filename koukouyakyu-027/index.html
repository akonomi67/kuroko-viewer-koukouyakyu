<script>
const D={"name": "八戸学院光星", "file": "027_編集用", "dur": 942.3333125, "segs": [], "subs": [{"t": 0.0, "x": "2012年8月23日。"}, {"t": 2.1333333333333333, "x": "夏の甲子園の決勝だ。"}, {"t": 3.8833333333333333, "x": "9回、青森の光星学院の最後の打者が三振に倒れた。"}, {"t": 7.716666666666667, "x": "スコアは0対3。相手は大阪桐蔭だった。"}, {"t": 10.666666666666666, "x": "決勝で負けちゃったのね。"}, {"t": 12.366666666666667, "x": "ああ。ただ光星学院にとっては、\nこれが初めての決勝ではない。"}, {"t": 16.266666666666666, "x": "前の年の夏も決勝で負けた。\nこの年の春も決勝で負けた。"}, {"t": 20.433333333333334, "x": "えっ、3回続けて決勝まで行ったの？"}, {"t": 23.083333333333332, "x": "そうだ。そして3回続けて準優勝だった。"}, {"t": 26.033333333333335, "x": "夏・春・夏と3季続けての準優勝は\n史上初めてと報じられている。"}, {"t": 30.816666666666666, "x": "3回も決勝に行けるのに、なんで\n最後だけ勝てなかったのかしら。"}, {"t": 35.36666666666667, "x": "今回はこの学校。いまの名前は八戸学院光星だ。"}, {"t": 38.95, "x": "2013年までは光星学院という名前だった。"}, {"t": 42.05, "x": "無名だった八戸の学校が、なぜ\n3つの決勝にたどり着いたのか。"}, {"t": 46.25, "x": "そしてあと1勝の差は何だったのか。"}, {"t": 48.35, "x": "日付と点数をもとに辿っていく。"}, {"t": 50.583333333333336, "x": "本編の前に、チャンネル登録と\n高評価をしてもらえるとうれしい。"}, {"t": 54.46666666666667, "x": "じゃあまずは、学校ができたところからね。"}, {"t": 57.583333333333336, "x": "始まりは1956年4月18日だ。"}, {"t": 60.81666666666667, "x": "白菊学園という学校法人が、光星学院高校を開いた。"}, {"t": 64.81666666666666, "x": "最初は仮の校舎で開校式と第1回の入学式をした。"}, {"t": 68.65, "x": "最初から自分の校舎があったわけじゃないのね。"}, {"t": 71.45, "x": "ああ。新しい校舎に移ったのは、\nその年の12月20日だ。"}, {"t": 75.38333333333334, "x": "1959年3月には、学校法人光星学院ができた。"}, {"t": 79.75, "x": "ここで高校を開く法人が、白菊学園から\n光星学院に替わっている。"}, {"t": 84.38333333333334, "x": "名前の「光星学院」は、学校を\n持つ法人の名前でもあるのね。"}, {"t": 88.66666666666667, "x": "そうだ。1961年には商業科ができた。"}, {"t": 92.06666666666666, "x": "そのあと自動車科・建築科・\n保育科と、学ぶ科を増やしていった。"}, {"t": 96.33333333333333, "x": "場所は青森県八戸市の湊高台だ。"}, {"t": 99.21666666666667, "x": "野球の話は、いつ出てくるの？"}, {"t": 101.43333333333334, "x": "学校の沿革に、野球が出てくるのは1か所だけだ。"}, {"t": 104.73333333333333, "x": "1996年3月29日、「野球観覧席完成」とある。"}, {"t": 109.58333333333333, "x": "観覧席？　お客さんが座る席ね。"}, {"t": 112.15, "x": "ああ。そしてその翌年、\n光星学院は初めて甲子園に出る。"}, {"t": 116.6, "x": "1997年の春、センバツ大会だ。"}, {"t": 119.8, "x": "光星学院は1回戦で岡山南に3対5で敗れた。"}, {"t": 123.4, "x": "その夏にも甲子園に来た。"}, {"t": 125.21666666666667, "x": "1回戦の相手は佐賀商。"}, {"t": 126.76666666666667, "x": "9対10で敗れた。"}, {"t": 128.31666666666666, "x": "1点差ね。惜しい。"}, {"t": 129.75, "x": "この学校を鍛えたのが、監督の金沢成奉だ。"}, {"t": 133.0, "x": "記事では、全国的に無名だった光星学院を\nゼロから鍛え上げた人と紹介されている。"}, {"t": 138.33333333333334, "x": "金沢は光星学院を、春夏あわせて\n8回の甲子園に連れていった。"}, {"t": 142.8, "x": "どんな野球をする監督だったの？"}, {"t": 144.96666666666667, "x": "本人の言葉が残っている。"}, {"t": 146.63333333333333, "x": "「打って、打って、打ち勝つのが理想」。"}, {"t": 148.95, "x": "スクイズは、ほとんどしたことがないそうだ。"}, {"t": 151.56666666666666, "x": "とにかく打つチームってことね。"}, {"t": 153.46666666666667, "x": "ああ。そして光星学院時代の教え子には、\n巨人の坂本勇人もいる。"}, {"t": 157.86666666666667, "x": "金沢は、坂本のクラス担任も務めていた。"}, {"t": 161.01666666666668, "x": "2020年11月8日、坂本はプロで\n通算2000安打に届いた。"}, {"t": 165.58333333333334, "x": "そのとき金沢は高校時代を振り返る\n手記を新聞に寄せている。"}, {"t": 169.5, "x": "先生と教え子の関係が、ずっと続いてるのね。"}, {"t": 173.16666666666666, "x": "最初の大きな夏は、2000年だ。"}, {"t": 175.46666666666667, "x": "2回戦は愛媛の丹原に10対8。"}, {"t": 177.88333333333333, "x": "3回戦は熊本の九州学院に4対3。"}, {"t": 180.83333333333334, "x": "準々決勝は鹿児島の樟南に2対1。"}, {"t": 183.65, "x": "1点差の試合を2つも勝ったのね。"}, {"t": 185.98333333333332, "x": "これで4強入りだ。準決勝の相手は智弁和歌山だった。"}, {"t": 189.53333333333333, "x": "結果は5対7。2点差で、光星学院はここで止まった。"}, {"t": 193.31666666666666, "x": "智弁和歌山はそのまま勝ち進み、\nこの年の夏の日本一になっている。"}, {"t": 197.85, "x": "優勝したチームに負けたのね。"}, {"t": 199.85, "x": "翌年の2001年も夏の甲子園に来た。"}, {"t": 202.65, "x": "初芝橋本に9対2、神埼に3対2で勝って準々決勝へ。"}, {"t": 206.96666666666667, "x": "ここで滋賀の近江に6対8で敗れた。"}, {"t": 209.38333333333333, "x": "近江はこの夏、決勝まで進んで準優勝している。"}, {"t": 212.73333333333332, "x": "また、勝ち進んだ学校に止められたの？"}, {"t": 215.38333333333333, "x": "2003年の夏もそうだ。"}, {"t": 217.15, "x": "必由館・木更津総合・倉敷工に\n勝って準々決勝まで来た。"}, {"t": 221.43333333333334, "x": "倉敷工には2対0の完封勝ちだった。"}, {"t": 224.1, "x": "準々決勝の相手は宮城の東北。1対2で敗れた。"}, {"t": 227.68333333333334, "x": "東北もこの夏、決勝まで勝ち上がって準優勝だ。"}, {"t": 231.15, "x": "3回とも、決勝まで行くチームに当たってるじゃない。"}, {"t": 234.3, "x": "ああ。2000年は日本一、2001年と\n2003年は準優勝の学校だった。"}, {"t": 239.31666666666666, "x": "あと1つか2つ勝てば決勝。その手前で、\n毎回強い相手が待っていた。"}, {"t": 244.56666666666666, "x": "時は進んで2011年。"}, {"t": 246.3, "x": "3月に東日本大震災が起きた年だ。"}, {"t": 249.33333333333334, "x": "東北の学校には、つらい年ね。"}, {"t": 251.68333333333334, "x": "この年の春、光星学院はセンバツに出ている。"}, {"t": 254.66666666666666, "x": "1回戦は茨城の水城に10対0。"}, {"t": 257.15, "x": "2回戦の相手は、智弁和歌山だった。"}, {"t": 259.78333333333336, "x": "2000年の夏に、準決勝で負けた相手ね。"}, {"t": 262.8, "x": "ああ。結果は2対3。また1点差で止められた。"}, {"t": 265.81666666666666, "x": "この夏、甲子園で光星学院を取材した記事がある。"}, {"t": 269.1666666666667, "x": "青森も被災していて、光星学院のある\n八戸にも被害があったと書かれている。"}, {"t": 273.98333333333335, "x": "選手たちが走っている場所も、被害を受けたそうだ。"}, {"t": 277.1333333333333, "x": "ただ青森は、岩手や宮城や福島ほど\n「被災地」とは言われなかった。"}, {"t": 281.6333333333333, "x": "同じ東北でも、見え方に違いがあったのね。"}, {"t": 284.6, "x": "ベンチで指揮を執ったのは、監督の仲井宗基だ。"}, {"t": 287.6166666666667, "x": "打線の中心は、2年生の田村龍弘と北條史也。"}, {"t": 291.21666666666664, "x": "北條は大阪府堺市の出身で、田村とは\n小学校からのチームメイトだった。"}, {"t": 295.98333333333335, "x": "2回戦は熊本の専大玉名に16対1。"}, {"t": 298.85, "x": "川上竜平が本塁打を2本打った。"}, {"t": 301.3833333333333, "x": "16点も取ったの？"}, {"t": 302.93333333333334, "x": "3回戦は徳島商に6対5。"}, {"t": 305.01666666666665, "x": "田村が逆転のタイムリーを打った。"}, {"t": 307.1, "x": "8月17日の準々決勝は、兵庫の東洋大姫路に\n2対1。粘り勝ちだった。"}, {"t": 312.6333333333333, "x": "準決勝は栃木の作新学院だ。"}, {"t": 315.0, "x": "1回裏、満塁から北條の適時打で2点を先に取る。"}, {"t": 318.55, "x": "6回に相手のミスで2点。"}, {"t": 320.1333333333333, "x": "8回には川上がレフトのポールに当てる本塁打。"}, {"t": 323.1666666666667, "x": "5対0の完封で決勝へ進んだ。"}, {"t": 325.55, "x": "ついに壁を越えたのね！"}, {"t": 327.1333333333333, "x": "仲井監督は「思い描いていた\n通りの展開になった」と話している。"}, {"t": 331.4166666666667, "x": "北條は、春のセンバツで7番に打順を\n下げられて悔しい思いをしたと話している。"}, {"t": 336.28333333333336, "x": "この準決勝は5番。相手が川上と\n田村をマークするのは分かっていた。"}, {"t": 340.51666666666665, "x": "だからチャンスを生かせてよかった、と振り返った。"}, {"t": 343.48333333333335, "x": "田村さんは、どんな考えで打ってたの？"}, {"t": 345.98333333333335, "x": "田村は4番だった。言葉が残っている。"}, {"t": 348.51666666666665, "x": "「全員がつなごうつなごうって\n思っているわけじゃないですよ」。"}, {"t": 351.65, "x": "それぞれが自分の打撃をすれば、\n結果としてつながるという考えだ。"}, {"t": 355.76666666666665, "x": "つなぐより、まず自分のスイングってことね。"}, {"t": 358.48333333333335, "x": "青森の学校が夏の決勝に出るのは、\n1969年の三沢以来42年ぶりだった。"}, {"t": 365.03333333333336, "x": "2011年8月20日の決勝。"}, {"t": 367.3666666666667, "x": "相手は西東京の日大三だ。"}, {"t": 369.48333333333335, "x": "結果は0対11だった。"}, {"t": 371.4166666666667, "x": "うわあ、大差ね。"}, {"t": 372.68333333333334, "x": "ここまでの4試合で、光星学院が\n取られた点は合わせて7点だった。"}, {"t": 376.9166666666667, "x": "その守りが、決勝の1試合で11点を取られた。"}, {"t": 380.15, "x": "日大三はこの大会、6試合続けて\n2桁の安打を打ったチームだった。"}, {"t": 384.81666666666666, "x": "相手の打線がすごすぎたのね。"}, {"t": 386.8333333333333, "x": "ああ。それでも光星学院は、東北の学校として\n初めての優勝にあと1勝まで来た。"}, {"t": 392.8, "x": "夏が終わると、3年生が抜けて新しいチームになる。"}, {"t": 396.1, "x": "田村と北條は、ここから最上級生だ。"}, {"t": 398.78333333333336, "x": "秋の東北大会の準決勝では、\n岩手の花巻東に9対8で競り勝った。"}, {"t": 403.96666666666664, "x": "1点差の勝負ね。"}, {"t": 405.3833333333333, "x": "東北大会は光星学院が優勝。"}, {"t": 407.56666666666666, "x": "準優勝は福島の聖光学院だった。"}, {"t": 410.2, "x": "光星学院はこれで、秋の明治神宮大会に進んだ。"}, {"t": 413.76666666666665, "x": "神宮大会は、秋の地区大会で\n優勝した学校が集まる大会だ。"}, {"t": 418.05, "x": "決勝の相手は愛知の愛工大名電。"}, {"t": 420.18333333333334, "x": "6対5で勝って初優勝した。"}, {"t": 422.45, "x": "秋は日本一になれたのね！"}, {"t": 424.4, "x": "ああ。しかもこの優勝には、もう1つ意味があった。"}, {"t": 427.51666666666665, "x": "神宮大会で勝った学校の地区には、\n春のセンバツの枠が1つ増える。"}, {"t": 432.03333333333336, "x": "自分たちが勝つと、東北から出られる学校が増えるの？"}, {"t": 435.51666666666665, "x": "そうだ。この神宮枠が東北地区に来たのは、\nこのときが初めてだった。"}, {"t": 440.6166666666667, "x": "2012年の春のセンバツだ。"}, {"t": 442.68333333333334, "x": "1回戦は北海道の北照に3対0。"}, {"t": 445.3833333333333, "x": "2回戦は滋賀の近江に13対1。"}, {"t": 447.8, "x": "13点！　やっぱり打つのね。"}, {"t": 449.8333333333333, "x": "準々決勝は愛工大名電に5対2。"}, {"t": 452.48333333333335, "x": "神宮大会の決勝と同じ相手じゃない。"}, {"t": 455.06666666666666, "x": "ああ。秋に続いて、ここでも勝った。"}, {"t": 457.43333333333334, "x": "準決勝は東京の関東一に6対1。"}, {"t": 460.1333333333333, "x": "夏に続いて、2季続けての決勝だ。"}, {"t": 462.71666666666664, "x": "4月4日の決勝。相手は大阪桐蔭。"}, {"t": 465.21666666666664, "x": "投手は藤浪晋太郎だった。"}, {"t": 467.2, "x": "1回に2点を取られたが、3回に4番北條と\n5番武田の連続適時打で追いついた。"}, {"t": 472.6, "x": "2対2ね！"}, {"t": 473.56666666666666, "x": "ところが追いついた直後の3回に、3点を取られる。"}, {"t": 476.76666666666665, "x": "先発の城間竜兵は、3回の途中で\n5点を取られて降りた。"}, {"t": 480.6166666666667, "x": "5回に北條の適時二塁打で1点を返した。"}, {"t": 483.45, "x": "光星学院は藤浪から12本の安打を打った。"}, {"t": 486.5833333333333, "x": "12本も打ったのに？"}, {"t": 488.06666666666666, "x": "取れた点は3点だった。結果は3対7。"}, {"t": 490.95, "x": "2季続けての準優勝だ。"}, {"t": 493.35, "x": "そして2012年の夏だ。"}, {"t": 495.28333333333336, "x": "仲井監督の話では、センバツの\nあと打撃が上向かなかった。"}, {"t": 499.21666666666664, "x": "青森大会は、ぎりぎりの勝ち上がりだったという。"}, {"t": 502.1, "x": "この年、光星学院は岩手の花巻東と\n練習試合を何度もしている。"}, {"t": 506.6666666666667, "x": "花巻東の投手は、大谷翔平だった。"}, {"t": 509.73333333333335, "x": "あの大谷さん？"}, {"t": 510.8333333333333, "x": "ああ。仲井監督によると、当時の大谷は\nまだ球が高めに浮くことが多かった。"}, {"t": 515.65, "x": "だから光星学院の打者はよく打てたそうだ。"}, {"t": 518.2833333333333, "x": "その監督が、対戦した中でいちばん\nすごかった投手に挙げたのが藤浪だった。"}, {"t": 523.15, "x": "甲子園に着くと、大阪桐蔭の初戦を\n選手たちと宿舎で見た。"}, {"t": 527.2, "x": "そのときの藤浪は、春とは別人のようだったそうだ。"}, {"t": 530.5666666666667, "x": "監督は選手の前で、こう口にしてしまったという。"}, {"t": 533.7166666666667, "x": "「こんなん打てるわけないな。"}, {"t": 535.0666666666667, "x": "絶対、無理やぞ」。"}, {"t": 536.5333333333333, "x": "監督がそれを言っちゃったの？"}, {"t": 538.4, "x": "本人が、2024年の取材で振り返っている話だ。"}, {"t": 542.0666666666667, "x": "2回戦は石川の遊学館に4対0。"}, {"t": 544.7, "x": "大会の前、光星学院は大阪桐蔭と\n並ぶ優勝候補に挙げられていた。"}, {"t": 549.25, "x": "ある記事は、この夏を「三度目の正直」と書いている。"}, {"t": 552.7, "x": "3回戦の相手は鹿児島の神村学園。"}, {"t": 555.2, "x": "秋の神宮大会で光星学院が勝った相手だ。"}, {"t": 558.2166666666667, "x": "神村学園の監督は、大会の前からこう話していた。"}, {"t": 561.85, "x": "光星学院が勝ち上がってくれば、秋に\n負けた相手なので対戦したいと。"}, {"t": 566.3, "x": "向こうも、やり返す気まんまんだったのね。"}, {"t": 568.9, "x": "結果は9対4。光星学院が押し切った。"}, {"t": 571.7166666666667, "x": "準々決勝は神奈川の桐光学園。"}, {"t": 573.9333333333333, "x": "投手は松井裕樹だった。"}, {"t": 575.7166666666667, "x": "どんな投手だったの？"}, {"t": 577.1666666666666, "x": "記事では「ドクターK」と呼ばれている。"}, {"t": 579.3833333333333, "x": "三振をたくさん取る投手だ。"}, {"t": 581.3, "x": "光星学院は苦しみながら攻略し、3対0で勝った。"}, {"t": 584.9333333333333, "x": "準決勝は山梨の東海大甲府に9対3。"}, {"t": 587.9333333333333, "x": "4番の北條が、2打席続けて\nバックスクリーンに本塁打を打った。"}, {"t": 592.0666666666667, "x": "またここまで来たのね。"}, {"t": 593.6333333333333, "x": "3季続けての決勝。相手はまた大阪桐蔭だった。"}, {"t": 597.0166666666667, "x": "試合の前、仲井監督はこう話している。"}, {"t": 599.7166666666667, "x": "「いつまでも『白河の関』と\n言われないように結果を出したい」。"}, {"t": 603.45, "x": "白河の関って何？"}, {"t": 605.0833333333334, "x": "福島にあった昔の関所だ。"}, {"t": 607.15, "x": "優勝旗がまだ東北に来ていないことを、\nこの関所を越えられないと言い表していた。"}, {"t": 612.5166666666667, "x": "8月23日の決勝。光星学院の先発は、\n金沢湧紀だった。"}, {"t": 617.3, "x": "金沢は八戸の出身だ。"}, {"t": 619.2333333333333, "x": "仲井監督は、最初は\n城間で行くつもりだったと明かしている。"}, {"t": 622.9166666666666, "x": "大阪桐蔭の打線は、内角を\nきちんと攻めないと抑えられない。"}, {"t": 626.7, "x": "それならコントロールのいい\n城間の方がいい、と考えていたそうだ。"}, {"t": 630.45, "x": "じゃあ、なんで金沢さんに？"}, {"t": 632.2833333333333, "x": "監督は、地元の選手への思いがあったことを\n認めている。"}, {"t": 635.8166666666667, "x": "そして自分で「余計な思いだったかも\nしれませんね」と振り返った。"}, {"t": 639.9833333333333, "x": "決めた本人が、そう言うのね。"}, {"t": 642.0666666666667, "x": "試合は投手戦になった。"}, {"t": 643.6666666666666, "x": "この大会、光星学院はここまで\n7本の本塁打を打っていた。"}, {"t": 647.5333333333333, "x": "その打線が、藤浪に2本の安打しか\n打てなかった。三振は14個だ。"}, {"t": 652.1666666666666, "x": "最後の打者も三振。0対3で試合は終わった。"}, {"t": 655.3333333333334, "x": "冒頭の場面ね。"}, {"t": 656.65, "x": "ああ。夏・春・夏と3季続けての準優勝。"}, {"t": 659.7833333333333, "x": "史上初めてのことだった。"}, {"t": 661.6, "x": "試合のあと、仲井監督は\n「またこれからやり直し」と前を向いた。"}, {"t": 665.7666666666667, "x": "北條はこの夏、甲子園で4本の本塁打を打っている。"}, {"t": 669.1333333333333, "x": "のちに田村はロッテへ、北條は阪神へ\n進んでプロ野球の選手になった。"}, {"t": 674.1, "x": "2012年9月、金沢成奉は\n茨城の明秀日立の監督になった。"}, {"t": 678.85, "x": "就任のときは、3年で甲子園に\n出ると言っていたそうだ。"}, {"t": 682.3333333333334, "x": "明秀日立は2018年の春にセンバツに\n出て、2回戦で高知に10対1で勝った。"}, {"t": 687.85, "x": "別の学校でも、甲子園に連れていったのね。"}, {"t": 690.8, "x": "そして2013年4月1日。"}, {"t": 692.9666666666667, "x": "学校の名前が変わる。"}, {"t": 694.5, "x": "光星学院から、八戸学院光星へ。"}, {"t": 697.4, "x": "3回準優勝した、すぐあとに名前が変わったの？"}, {"t": 700.7, "x": "ああ。同じ日に、系列の八戸大学も\n八戸学院大学になった。"}, {"t": 705.2666666666667, "x": "系列の大学の名前を、高校の名前の頭につけた形だ。"}, {"t": 709.3333333333334, "x": "「光星」の部分は残したのね。"}, {"t": 711.4833333333333, "x": "そうだ。新しい名前になってからも、\n甲子園には何度も来ている。"}, {"t": 715.4833333333333, "x": "2014年の春は、1回戦で\n神奈川の横浜に9対5で勝った。"}, {"t": 719.8666666666667, "x": "2回戦は京都の龍谷大平安に2対8で敗れている。"}, {"t": 723.4, "x": "2015年の春には、2回戦でまた\n大阪桐蔭と当たった。結果は1対4だ。"}, {"t": 728.7, "x": "また大阪桐蔭！　これで3回目？"}, {"t": 730.9833333333333, "x": "ああ。2012年の2回と合わせて\n3回とも大阪桐蔭が勝った。"}, {"t": 735.1, "x": "2018年の夏は、1回戦で兵庫の明石商と当たった。"}, {"t": 739.0333333333333, "x": "延長10回の末、9対8で勝っている。"}, {"t": 741.7666666666667, "x": "2019年の夏は、奈良の智弁学園に\n10対8、長崎の海星に7対6と打ち勝った。"}, {"t": 747.8666666666667, "x": "準々決勝の相手は、また明石商だった。"}, {"t": 750.8, "x": "前の年に延長で勝った相手ね。"}, {"t": 752.95, "x": "今度は6対7。1点差で敗れた。"}, {"t": 755.4833333333333, "x": "2022年の夏は、青森大会の決勝で\n八戸工大一に6対5で競り勝った。"}, {"t": 760.8833333333333, "x": "甲子園では2回戦で、\n愛工大名電に5対6で敗れている。"}, {"t": 764.8666666666667, "x": "神宮大会の決勝とセンバツで勝った相手ね。"}, {"t": 767.85, "x": "ああ。10年たって今度は1点差で負けた。"}, {"t": 770.5166666666667, "x": "2023年の夏は、秋田の明桜に\n7対0、栃木の文星芸大付に6対3。"}, {"t": 776.0666666666667, "x": "準々決勝で茨城の土浦日大に\n2対9で敗れ、8強だった。"}, {"t": 780.5, "x": "2026年の春は、広島の崇徳に\n15対6、滋賀学園に5対4。"}, {"t": 785.5333333333333, "x": "準々決勝は愛知の中京大中京に\n1対2。ここも8強だった。"}, {"t": 789.8666666666667, "x": "部員の数も多い。2024年の夏の部員は124人だった。"}, {"t": 794.1, "x": "その2年前は170人いたと監督が話している。"}, {"t": 797.6166666666667, "x": "170人！　すごい人数ね。"}, {"t": 799.8, "x": "ああ。寮では3年生は原則個室で、\n1年生と2年生は2人部屋だそうだ。"}, {"t": 804.9333333333333, "x": "ずっと強いのに、あと少しのところが続くのね。"}, {"t": 808.5666666666667, "x": "結局、3回の決勝で何が足りなかったのかしら。"}, {"t": 812.05, "x": "点数を並べると、1つ見えてくることがある。"}, {"t": 814.8833333333333, "x": "2011年夏、決勝までの4試合で取られた点は7点。"}, {"t": 818.7833333333333, "x": "2012年春は4点。"}, {"t": 820.3333333333334, "x": "2012年夏もまた7点だ。"}, {"t": 822.5833333333334, "x": "決勝の前までは、どの大会も守りがしっかりしていた。"}, {"t": 826.15, "x": "それなのに決勝では打たれたり、\n抑えられたりしたのね。"}, {"t": 829.4833333333333, "x": "ああ。そして決勝の相手は3回とも、\nその大会で日本一になった学校だ。"}, {"t": 834.4, "x": "2000年からの準決勝や準々決勝で負けた\n相手も、決勝まで行く学校だった。"}, {"t": 839.4, "x": "光星学院は、その年いちばん強い相手に\n毎回たどり着いていたとも言える。"}, {"t": 844.0, "x": "負けたけど、最後の相手まで行っていたってことね。"}, {"t": 847.1, "x": "たとえば2012年春の決勝は、12安打で3点。"}, {"t": 850.6166666666667, "x": "2012年夏は、7本塁打の打線が2安打に止められた。"}, {"t": 854.5, "x": "打って勝つチームが、打てなくなるのが決勝だった。"}, {"t": 857.45, "x": "ただ点差を見ると、少しずつ縮まっている。"}, {"t": 860.1833333333333, "x": "1度目は11点差。2度目は4点差。"}, {"t": 862.65, "x": "3度目は3点差だった。"}, {"t": 864.5, "x": "1回ごとに、日本一の学校に近づいていたのね。"}, {"t": 867.9333333333333, "x": "あと1勝の差は、\n点の取り方1つ分の差だったのではないか。"}, {"t": 871.8333333333334, "x": "その1つ分が、いちばん遠かったのね。"}, {"t": 874.4833333333333, "x": "ただ2011年の決勝のあと、チームは\n秋の神宮大会で日本一になっている。"}, {"t": 879.4833333333333, "x": "決勝で負けても、次の大会で\nまた決勝の舞台まで戻ってきた。"}, {"t": 883.6, "x": "負けるたびに、もう一度決勝まで\n上がってくる。それが3季続いたということだ。"}, {"t": 888.2666666666667, "x": "2022年8月22日、宮城の仙台育英が\n夏の甲子園で優勝した。"}, {"t": 893.45, "x": "東北勢にとって、\n春夏通算13度目の決勝での初めての優勝だった。"}, {"t": 898.45, "x": "その13回のうち、3回が光星学院なのね。"}, {"t": 901.8166666666667, "x": "そうだ。白河の関の前に、3回も立った学校だ。"}, {"t": 906.0, "x": "1956年の開校から、2026年でちょうど70年になる。"}, {"t": 910.7833333333333, "x": "学校の名前は1度変わった。それでも\n「光星」の2文字は残った。"}, {"t": 915.1, "x": "3つの準優勝の記録には、\n光星学院という名前で刻まれている。"}, {"t": 919.3833333333333, "x": "そして初めての優勝を、\n八戸学院光星の名前で取りにいくのね。"}, {"t": 923.8, "x": "ああ。八戸に優勝旗が来た日には、\nその2つの名前が1つにつながる。"}, {"t": 928.5666666666667, "x": "その日が来たら、3つの準優勝も\nきっと一緒に語られるわね。"}, {"t": 932.55, "x": "最後まで付き合ってくれて感謝する。"}, {"t": 934.7, "x": "この話が面白かったら、チャンネル登録と\n高評価で応援してほしい。"}, {"t": 939.0166666666667, "x": "次の学校の話でも、待ってるわね。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
