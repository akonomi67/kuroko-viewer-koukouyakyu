<script>
const D={"name": "甲子園最多勝の監督", "file": "017_編集用", "dur": 915.0833125, "segs": [], "subs": [{"t": 0.0, "x": "2024年の春。センバツの1回戦。"}, {"t": 2.75, "x": "大阪桐蔭が北海道の北海に7対1で勝った。"}, {"t": 6.016666666666667, "x": "この1勝である記録に並んだ。"}, {"t": 8.083333333333334, "x": "どんな記録？"}, {"t": 9.116666666666667, "x": "監督が甲子園で挙げた勝ち星の数だ。"}, {"t": 11.7, "x": "大阪桐蔭の監督、西谷浩一。これで68勝。"}, {"t": 15.483333333333333, "x": "智弁和歌山の高嶋仁が持つ\n歴代最多の68勝に、並んだんだ。"}, {"t": 20.383333333333333, "x": "68勝ってどれくらいかかる数なの？"}, {"t": 22.983333333333334, "x": "高嶋はこの数まで、およそ46年かかった。"}, {"t": 26.233333333333334, "x": "西谷はおよそ26年でたどり着いた。"}, {"t": 28.916666666666668, "x": "20年も早いのね。"}, {"t": 30.45, "x": "そして2回戦。鹿児島の神村学園に4対2。"}, {"t": 33.71666666666667, "x": "69勝目。ここで西谷はひとりで歴代1位になった。"}, {"t": 38.11666666666667, "x": "じゃあ今、いちばん勝った監督は西谷さんなのね。"}, {"t": 41.36666666666667, "x": "そうだ。今は75勝まで伸びている。"}, {"t": 43.96666666666667, "x": "75勝！ ほかの監督はどうなの？"}, {"t": 46.5, "x": "今日は、甲子園で勝った数の多い\n監督を上から順に見ていく。"}, {"t": 50.21666666666667, "x": "先に、数え方を決めておく。"}, {"t": 52.21666666666667, "x": "春のセンバツと夏の選手権、\n両方の勝ちを足した数だ。"}, {"t": 55.9, "x": "数字は2026年10月の時点。\nこの夏の大会が終わったあとのものだ。"}, {"t": 60.7, "x": "記事によって数字がちがうことはないの？"}, {"t": 63.11666666666667, "x": "ある。何年に書かれた記事かで、\n1勝ずれることがある。"}, {"t": 66.46666666666667, "x": "だから今回はいくつかの記録を\n突き合わせて、いちばん新しい数を使う。"}, {"t": 70.83333333333333, "x": "それから10位には2人が並んでいる。"}, {"t": 72.95, "x": "だから上位10位までで、全部で11人になる。"}, {"t": 75.98333333333333, "x": "11人の名将ね。"}, {"t": 77.45, "x": "1位が西谷さんなのは分かったけど、\n2位から下が気になるわね。"}, {"t": 81.45, "x": "名前を聞けば、学校の名前もすぐ浮かぶ人ばかりだ。"}, {"t": 84.73333333333333, "x": "どの学校で、何勝して、\n何回日本一になったか。そこを見ていく。"}, {"t": 89.25, "x": "10位から順に上がっていく。"}, {"t": 90.75, "x": "最後まで見てもらえたらうれしい。"}, {"t": 92.63333333333334, "x": "本編の前に、チャンネル登録と\n高評価をお願いしたい。"}, {"t": 96.63333333333334, "x": "10位に入る前に、そのすぐ下を少しだけ見ておく。"}, {"t": 99.9, "x": "12位は和歌山の箕島、尾藤公。35勝だ。"}, {"t": 103.46666666666667, "x": "13位は中京などで指揮をとった深谷。33勝だ。"}, {"t": 107.1, "x": "14位には3人が並ぶ。勝ち星は31だ。"}, {"t": 110.28333333333333, "x": "福井商の北野、龍谷大平安の原田英彦、"}, {"t": 113.61666666666666, "x": "そして東海大相模などで指揮をとった門馬敬治。"}, {"t": 116.81666666666666, "x": "10位とは何勝ちがうの？"}, {"t": 118.5, "x": "10位が37勝。12位とは2勝、14位とは6勝の差だ。"}, {"t": 122.7, "x": "ここから上が、上位の11人なのね。"}, {"t": 125.85, "x": "10位は誰なの？"}, {"t": 127.03333333333333, "x": "1人目は公立高校の監督だ。"}, {"t": 129.26666666666668, "x": "10位は2人。まずは徳島の池田。蔦文也だ。"}, {"t": 132.5, "x": "勝ち星は37。すべて池田で挙げた。"}, {"t": 135.35, "x": "池田って公立高校よね。"}, {"t": 137.25, "x": "ああ。蔦はその池田を長く率いた。"}, {"t": 139.58333333333334, "x": "1974年の春。池田は部員11人でセンバツを戦った。"}, {"t": 144.11666666666667, "x": "この11人は「さわやかイレブン」と呼ばれた。"}, {"t": 147.1, "x": "11人ってほとんど控えがいないじゃない。"}, {"t": 149.65, "x": "そうだ。それでも勝ち進み、全国に名前を知られた。"}, {"t": 153.06666666666666, "x": "初めて優勝したのは1982年の夏。"}, {"t": 156.15, "x": "監督30年目のことだ。"}, {"t": 158.06666666666666, "x": "続く1983年の春も勝って夏春の連続優勝。"}, {"t": 162.13333333333333, "x": "1986年の春にも優勝している。"}, {"t": 165.25, "x": "公立高校で日本一が3回なのね。"}, {"t": 167.93333333333334, "x": "ああ。蔦は2001年の4月に亡くなった。77歳だった。"}, {"t": 172.68333333333334, "x": "10位のもう1人は小倉全由。"}, {"t": 174.5, "x": "勝ち星は同じ37だ。"}, {"t": 176.43333333333334, "x": "小倉は2つの学校で甲子園に出ている。"}, {"t": 178.9, "x": "東京の関東一で7勝。日大三で30勝。"}, {"t": 182.31666666666666, "x": "同じ東京の学校を2つ。"}, {"t": 184.3, "x": "そうだ。日大三では夏に2回日本一になった。"}, {"t": 187.63333333333333, "x": "2001年の夏と、2011年の夏だ。"}, {"t": 190.78333333333333, "x": "10年あけて、もう一度勝ったのね。"}, {"t": 193.16666666666666, "x": "ああ。小倉は2023年の3月いっぱいで\n日大三の監督を退いた。"}, {"t": 197.9, "x": "そのあとは18歳以下の日本代表の監督も\n務め、2025年9月の大会で退いている。"}, {"t": 203.91666666666666, "x": "日大三の話は、このあと別の回で\nくわしく取り上げる予定だ。"}, {"t": 208.55, "x": "8位も2人。勝ち星は40だ。"}, {"t": 210.76666666666668, "x": "1人目は阪口慶三。愛知の東邦で\n25勝、岐阜の大垣日大で15勝。"}, {"t": 215.95, "x": "こちらも2つの学校ね。"}, {"t": 217.75, "x": "東邦では社会科の先生から野球部の監督になった。"}, {"t": 221.11666666666667, "x": "1989年の春。センバツの決勝で\n大阪の上宮を破って優勝した。"}, {"t": 226.48333333333332, "x": "東邦の日本一ね。"}, {"t": 228.08333333333334, "x": "東邦を定年で退いたあと、\n2005年に大垣日大へ移った。"}, {"t": 232.16666666666666, "x": "そして2007年の春。"}, {"t": 233.73333333333332, "x": "大垣日大は初めてセンバツに出た。"}, {"t": 236.18333333333334, "x": "その初めての大会で、いきなり準優勝している。"}, {"t": 239.43333333333334, "x": "初出場で決勝まで行ったのね。"}, {"t": 241.71666666666667, "x": "2023年の春は初戦で敗れ、\n40勝目はお預けになった。"}, {"t": 245.93333333333334, "x": "そのとき阪口は「夏に取ります」と話している。"}, {"t": 249.36666666666667, "x": "それで、夏は？"}, {"t": 250.66666666666666, "x": "2023年の夏、甲子園で1勝。"}, {"t": 253.2, "x": "言葉どおり40勝に届いた。"}, {"t": 255.18333333333334, "x": "甲子園の出場は35回。"}, {"t": 257.05, "x": "阪口はこの年限りで勇退している。"}, {"t": 260.21666666666664, "x": "8位のもう1人は茨城の木内幸男。"}, {"t": 262.6166666666667, "x": "取手二で8勝、常総学院で32勝。"}, {"t": 265.31666666666666, "x": "合わせて40勝だ。"}, {"t": 266.8666666666667, "x": "この人は前の回にも出てきたわね。"}, {"t": 269.23333333333335, "x": "ああ。1984年の夏、取手二で\nPL学園を破って優勝した。"}, {"t": 274.03333333333336, "x": "そのあと常総学院に移り、\n2001年の春と2003年の夏に日本一。"}, {"t": 278.96666666666664, "x": "2つの学校で、優勝は合わせて3回だ。"}, {"t": 281.75, "x": "木内は2020年11月24日に亡くなった。89歳だった。"}, {"t": 286.45, "x": "くわしい話は常総学院の回で見てほしい。"}, {"t": 289.78333333333336, "x": "7位は広島の広陵。中井哲之だ。勝ち星は41。"}, {"t": 293.8333333333333, "x": "広陵って古くからの強い学校よね。"}, {"t": 296.3333333333333, "x": "ああ。中井は1990年に監督になった。"}, {"t": 299.55, "x": "その翌年、1991年の春。"}, {"t": 302.23333333333335, "x": "広陵はセンバツで優勝する。"}, {"t": 304.05, "x": "広陵にとっては65年ぶりの日本一だった。"}, {"t": 307.2, "x": "65年ぶり？ そんなに間があいていたのね。"}, {"t": 310.18333333333334, "x": "そうだ。そして2003年の春にも、\nもう一度センバツで勝っている。"}, {"t": 314.3333333333333, "x": "中井のもとで日本一は2回だ。"}, {"t": 316.5833333333333, "x": "41勝を、ずっと同じ学校で挙げたのね。"}, {"t": 319.56666666666666, "x": "ああ。広陵ひとつで、35年にわたって指揮をとった。"}, {"t": 323.6666666666667, "x": "ここまでで5人ね。37勝から41勝。"}, {"t": 326.9166666666667, "x": "ああ。10位と7位の差はたった4勝だ。"}, {"t": 329.46666666666664, "x": "けっこう団子になっているのね。"}, {"t": 331.3666666666667, "x": "ところが6位から上はぐっと数字が上がる。"}, {"t": 333.78333333333336, "x": "6位の数字は51。7位とは10勝の差がある。"}, {"t": 337.03333333333336, "x": "10勝！ いきなり離れるのね。"}, {"t": 339.5833333333333, "x": "5位は2人が並んでいる。まずは\n東京の帝京。前田三夫だ。"}, {"t": 343.3666666666667, "x": "勝ち星は51。すべて帝京で挙げた。"}, {"t": 346.03333333333336, "x": "前田が帝京の監督になったのは1972年。"}, {"t": 349.55, "x": "まだ大学4年生、22歳のときだ。"}, {"t": 352.3, "x": "大学生のうちに監督になったの？"}, {"t": 354.71666666666664, "x": "ああ。しかも始めたころの部員は4人しかいなかった。"}, {"t": 358.01666666666665, "x": "4人じゃ、試合もできないじゃない。"}, {"t": 360.15, "x": "そこから甲子園に、春は14回、\n夏は22回出るチームになった。"}, {"t": 364.55, "x": "日本一は3回。1989年の夏、\n1992年の春、1995年の夏だ。"}, {"t": 371.8333333333333, "x": "部員4人から、日本一3回なのね。"}, {"t": 374.6, "x": "前田は2021年の8月に監督を退き、\nいまは名誉監督になっている。"}, {"t": 379.68333333333334, "x": "退いたのは指導者になって50年目の夏だった。"}, {"t": 383.3833333333333, "x": "5位のもう1人は神奈川の横浜。渡辺元智だ。"}, {"t": 386.76666666666665, "x": "勝ち星は同じ51。監督になったのは1968年だ。"}, {"t": 391.31666666666666, "x": "横浜といえば、松坂大輔さんよね。"}, {"t": 394.1166666666667, "x": "ああ。1998年、松坂を中心に\n春と夏を両方とも制した。"}, {"t": 399.05, "x": "同じ年に春も夏も勝つ、春夏連覇だ。"}, {"t": 402.01666666666665, "x": "渡辺のもとで、横浜の日本一は5回。"}, {"t": 404.9166666666667, "x": "1973年の春、1980年の夏、\n1998年の春と夏、2006年の春だ。"}, {"t": 412.6166666666667, "x": "5回も！"}, {"t": 413.46666666666664, "x": "教え子から、50人以上のプロ野球選手が出ている。"}, {"t": 416.68333333333334, "x": "最後の夏は2015年。"}, {"t": 418.3, "x": "神奈川大会の決勝で東海大相模に敗れた。"}, {"t": 421.43333333333334, "x": "そのあとも練習場に足を運んでいたと伝えられている。"}, {"t": 424.6666666666667, "x": "渡辺は2026年8月17日に亡くなった。81歳だった。"}, {"t": 429.6666666666667, "x": "今年の夏のことなのね。"}, {"t": 431.48333333333335, "x": "ああ。夏の甲子園に出ていた横浜の選手たちは、\n練習の中で黙とうをささげた。"}, {"t": 437.23333333333335, "x": "4位は高知の明徳義塾。"}, {"t": 438.9166666666667, "x": "馬淵史郎だ。勝ち星は55。"}, {"t": 441.25, "x": "今も監督を続けている人よね？"}, {"t": 443.56666666666666, "x": "そうだ。この順位の中で、今も\n監督なのは西谷と馬淵の2人だけだ。"}, {"t": 448.26666666666665, "x": "馬淵が明徳義塾の監督になったのは1990年。"}, {"t": 452.05, "x": "2002年の夏に、全国で優勝している。"}, {"t": 455.01666666666665, "x": "明徳義塾の夏の日本一ね。"}, {"t": 457.35, "x": "馬淵にはもう1つ、歴代1位の記録がある。"}, {"t": 460.4, "x": "それって、なに？"}, {"t": 461.68333333333334, "x": "甲子園に出た回数だ。"}, {"t": 463.1, "x": "2026年の夏で、春と夏あわせて40回目。"}, {"t": 466.78333333333336, "x": "これは監督として歴代でいちばん多い。"}, {"t": 469.3, "x": "40回も甲子園に行ったの？"}, {"t": 471.35, "x": "ああ。明徳義塾の監督になって36年。"}, {"t": 474.26666666666665, "x": "70歳で迎えた夏だった。"}, {"t": 476.31666666666   const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
