<style>

<script>
const D={"name": "履正社", "file": "049_編集用", "dur": 718.35, "segs": [], "subs": [{"t": 0.0, "x": "今回は大阪の学校の話よね。"}, {"t": 2.433333333333333, "x": "ああ。2019年の夏の甲子園から始めよう。"}, {"t": 5.55, "x": "この夏に初めて優勝したのが、大阪の履正社だ。"}, {"t": 8.933333333333334, "x": "日本高野連の大会小史には、\nこの夏のことがこう書いてある。"}, {"t": 12.783333333333333, "x": "履正社が初優勝し、前年の大阪桐蔭に続き、\n大阪勢の2連覇となった。"}, {"t": 17.916666666666668, "x": "続けてもう一文ある。"}, {"t": 19.333333333333332, "x": "違う学校による同一府県の連覇は4度目となった。"}, {"t": 22.733333333333334, "x": "同じ府県で学校が違う連覇？"}, {"t": 24.95, "x": "そうだ。同じ大阪の学校が夏を2年続けて勝った。"}, {"t": 28.433333333333334, "x": "でも勝った学校は1年目と2年目で違う。"}, {"t": 31.266666666666666, "x": "同じ学校が2年続けて勝つのとは、別の数え方なのね。"}, {"t": 35.233333333333334, "x": "そこで問題だ。"}, {"t": 36.36666666666667, "x": "2019年の夏までに、違う学校で同じ府県が\n夏を続けて勝った例は何回あったと思う？"}, {"t": 42.31666666666667, "x": "うーん。大阪は強いから、もっとありそうね。"}, {"t": 45.083333333333336, "x": "答えは最後に言う。"}, {"t": 46.28333333333333, "x": "今回は大会小史の一文を、\n4つの府県の2年ずつで数えていく。"}, {"t": 50.583333333333336, "x": "始める前にチャンネル登録と高評価をお願いしたい。"}, {"t": 53.8, "x": "よろしくね。"}, {"t": 55.31666666666667, "x": "履正社ってどんな学校なの？"}, {"t": 57.25, "x": "大阪府の豊中市にある私立の学校だ。"}, {"t": 59.88333333333333, "x": "学校の沿革によると、始まりは1922年。"}, {"t": 63.38333333333333, "x": "大阪の北区福島で、福島商業学校として作られた。"}, {"t": 67.33333333333333, "x": "豊中市に移り終えたのは1967年だ。"}, {"t": 70.6, "x": "1983年にいまの履正社高校という名前になった。"}, {"t": 74.5, "x": "2000年には、男子と女子が\n一緒に学ぶ学校に変わっている。"}, {"t": 78.35, "x": "名前が変わったのはわりと最近なのね。"}, {"t": 80.81666666666666, "x": "校訓の最初の言葉は履正不畏だ。"}, {"t": 83.03333333333333, "x": "自分が正しいと信じることを、何も\n恐れずに行う、という意味だそうだ。"}, {"t": 87.5, "x": "むずかしい言葉だけど、まっすぐな意味なのね。"}, {"t": 90.36666666666666, "x": "2022年には、学校ができて100年を迎えた。"}, {"t": 94.33333333333333, "x": "甲子園にはいつから来ているの？"}, {"t": 96.33333333333333, "x": "初めて来たのは1997年の夏だ。"}, {"t": 99.43333333333334, "x": "2回戦で岩手の専大北上に、1対2で負けた。"}, {"t": 102.95, "x": "最初は1点差で負けたのね。"}, {"t": 104.95, "x": "初めて勝ったのは、2008年の春のセンバツだ。"}, {"t": 108.18333333333334, "x": "山口の下関商に3対2で勝った。"}, {"t": 110.98333333333333, "x": "初めての甲子園から、11年かかったのね。"}, {"t": 114.11666666666666, "x": "夏の初めての勝ちは2010年だ。"}, {"t": 116.31666666666666, "x": "奈良の天理に4対1で勝った。"}, {"t": 118.38333333333334, "x": "2011年の春には4強まで進んだ。"}, {"t": 121.11666666666666, "x": "2014年の春は決勝まで来たが、\n京都の龍谷大平安に2対6で負けた。"}, {"t": 126.16666666666667, "x": "2016年の夏は、神奈川の横浜にも5対1で勝っている。"}, {"t": 130.2, "x": "でも3回戦で茨城の常総学院に4対7で負けた。"}, {"t": 133.81666666666666, "x": "2017年の春も決勝に来た。"}, {"t": 136.05, "x": "相手は同じ大阪の大阪桐蔭だった。"}, {"t": 138.55, "x": "3対8で負けて、2度目の準優勝だ。"}, {"t": 141.38333333333333, "x": "春は決勝で2回も負けているのね。"}, {"t": 143.75, "x": "2019年の春は、1回戦で石川の星稜に0対3で負けた。"}, {"t": 148.35, "x": "星稜ってどこかで聞いた名前ね。"}, {"t": 150.46666666666667, "x": "この学校とは、同じ年の夏にもう一度当たる。"}, {"t": 154.13333333333333, "x": "2019年の夏は101回目の大会だった。"}, {"t": 157.25, "x": "地方大会に出た学校は3730校。"}, {"t": 160.23333333333332, "x": "甲子園に来たのは49校だ。"}, {"t": 162.43333333333334, "x": "大阪の代表は1校。それが履正社だった。"}, {"t": 165.4, "x": "大阪から1校だけなら、府の大会で勝つのも大変ね。"}, {"t": 169.1, "x": "1年前の記念の大会は、大阪から\n2校が来ていた。この違いはあとで出てくる。"}, {"t": 174.11666666666667, "x": "1回戦は茨城の霞ヶ浦に11対6。"}, {"t": 177.05, "x": "2回戦は三重の津田学園に7対3。"}, {"t": 179.5, "x": "3回戦は富山の高岡商に9対4で勝った。"}, {"t": 182.75, "x": "どの試合もたくさん点を取っているのね。"}, {"t": 185.18333333333334, "x": "準々決勝は東東京の関東第一に7対3。"}, {"t": 188.6, "x": "準決勝は兵庫の明石商に7対1だ。"}, {"t": 191.28333333333333, "x": "そして決勝の相手は、春に負けた星稜だった。"}, {"t": 194.5, "x": "春のお返しの試合ね！"}, {"t": 196.1, "x": "星稜が2回に1点を取った。"}, {"t": 198.03333333333333, "x": "履正社は3回に3点を取って、前に出た。"}, {"t": 200.9, "x": "星稜も7回に2点を取って、3対3に追いついた。"}, {"t": 204.33333333333334, "x": "8回に履正社が2点を取った。"}, {"t": 206.36666666666667, "x": "5対3。履正社の初優勝だ。"}, {"t": 208.7, "x": "春に負けた相手に、夏の決勝で勝ったのね。"}, {"t": 211.75, "x": "6試合で取った点は46点。"}, {"t": 213.75, "x": "1試合に7点より多い。"}, {"t": 215.48333333333332, "x": "初めての甲子園から22年後の、初めての優勝だった。"}, {"t": 219.26666666666668, "x": "この決勝は星稜の回でもくわしくやっている。"}, {"t": 222.6, "x": "大会小史の前年の大阪桐蔭っていうのは？"}, {"t": 225.51666666666668, "x": "2018年の夏は、100回目の記念の大会だった。"}, {"t": 229.13333333333333, "x": "代表は56校。大阪からは\n北大阪と南大阪の2校が来た。"}, {"t": 233.55, "x": "地方大会に出た学校は const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
