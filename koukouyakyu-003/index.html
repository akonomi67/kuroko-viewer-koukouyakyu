<title>海草中</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}

<script>
const D={"name": "海草中", "file": "003_編集用", "dur": 1009.06665625, "segs": [], "subs": [{"t": 0.0, "x": "2008年、平成20年8月15日。"}, {"t": 2.8833333333333333, "x": "兵庫県西宮市の甲子園球場。"}, {"t": 5.283333333333333, "x": "夏の大会第90回の14日目だ。"}, {"t": 7.9, "x": "その日の第1試合が始まる前に、表彰式が開かれた。"}, {"t": 11.75, "x": "試合の前に表彰式？"}, {"t": 13.433333333333334, "x": "ああ。この年、野球殿堂に入った1人の投手のためだ。"}, {"t": 17.1, "x": "名前は嶋清一。\n和歌山の海草中学のエースだった人だ。"}, {"t": 20.983333333333334, "x": "本人はその場にいなかった。"}, {"t": 22.733333333333334, "x": "花束とレリーフを受け取ったのは、\n同じ学年だった元選手と、そのときの主将だ。"}, {"t": 28.05, "x": "本人はいなかったのね。"}, {"t": 29.716666666666665, "x": "1945年に24歳で戦死している。"}, {"t": 32.86666666666667, "x": "そして8月15日は戦争が終わった日でもある。"}, {"t": 36.06666666666667, "x": "その日に甲子園で表彰されたのね。"}, {"t": 38.43333333333333, "x": "嶋が残した記録は、1939年の夏の甲子園にある。"}, {"t": 42.71666666666667, "x": "5試合を投げて相手に1点も取らせなかった。"}, {"t": 45.4, "x": "打たれたヒットは、5試合で合わせて8本だ。"}, {"t": 48.21666666666667, "x": "5試合で8本？"}, {"t": 49.45, "x": "しかも準決勝と決勝は、どちらもヒット0本だった。"}, {"t": 52.95, "x": "海草中はその次の年も夏の甲子園で勝っている。"}, {"t": 56.2, "x": "2年続けて日本一。和歌山の県立の学校だ。"}, {"t": 59.733333333333334, "x": "その海草中っていまはどこの学校なの？"}, {"t": 62.36666666666667, "x": "和歌山市にある和歌山県立向陽高校だ。"}, {"t": 65.25, "x": "公立の学校で、2年続けて？"}, {"t": 67.35, "x": "どんな選手がいたのかしら？"}, {"t": 69.1, "x": "それにそのあとはどうなったの？"}, {"t": 70.95, "x": "今回は海草中と向陽高校の野球部の歴史を追っていく。"}, {"t": 74.55, "x": "使うのは学校が残した記録と、大会の記録だ。"}, {"t": 77.9, "x": "最後まで見てもらえるとうれしい。"}, {"t": 79.68333333333334, "x": "始める前にチャンネル登録と高評価をよろしく頼む。"}, {"t": 83.53333333333333, "x": "学校の始まりは、1915年、大正4年だ。"}, {"t": 87.08333333333333, "x": "場所は和歌山市。日前神宮・\n國懸神宮の森のとなりだ。"}, {"t": 91.28333333333333, "x": "その場所にはもともと県立の海草農林学校があった。"}, {"t": 94.73333333333333, "x": "その学校がなくなり、同じ年に\n県立の海草中学校が開かれた。"}, {"t": 99.26666666666667, "x": "海草って海の草のこと？"}, {"t": 101.11666666666666, "x": "字はそうだがここでは土地の名前だ。"}, {"t": 103.2, "x": "当時、このあたりは海草郡と呼ばれていた。"}, {"t": 105.71666666666667, "x": "読みは「かいそう」だ。"}, {"t": 107.4, "x": "郡の名前から取ったのね。"}, {"t": 109.18333333333334, "x": "硬式の野球部ができたのは、6年後の1921年だ。"}, {"t": 113.3, "x": "学校の沿革には部を作った2人の名前も残っている。"}, {"t": 116.7, "x": "そこから甲子園に出るまで、さらに8年かかる。"}, {"t": 120.35, "x": "1929年、昭和4年。"}, {"t": 122.5, "x": "海草中は初めて甲子園に出た。"}, {"t": 124.76666666666667, "x": "まず春。第6回の選抜大会でベスト8に入った。"}, {"t": 128.36666666666667, "x": "そして同じ年の夏。第15回の大会にも初めて出た。"}, {"t": 132.31666666666666, "x": "初めての夏はどうだったの？"}, {"t": 134.2, "x": "決勝まで勝ち進んだ。準優勝だ。"}, {"t": 136.78333333333333, "x": "いきなり決勝まで行ったのね。"}, {"t": 138.7, "x": "ああ。決勝で負けた相手は広島の広島商だ。"}, {"t": 141.75, "x": "このときの投手と捕手の名前も、\n学校の記録に残っている。"}, {"t": 145.53333333333333, "x": "春はこのあと、1931年、\n1932年、1933年と出続けた。"}, {"t": 151.93333333333334, "x": "1931年と1932年は、どちらも2回戦で負けている。"}, {"t": 157.01666666666668, "x": "3年続けて春に出たのね。"}, {"t": 159.06666666666666, "x": "1933年の春には、初戦で森田俊男投手が\nノーヒットノーランをした。"}, {"t": 164.26666666666668, "x": "ノーヒットノーランって、なにかしら？"}, {"t": 166.53333333333333, "x": "相手にヒットを1本も打たせず、点も\n1点も取らせない試合のことだ。"}, {"t": 170.66666666666666, "x": "相手は群馬の桐生中。この大会はベスト8まで進んだ。"}, {"t": 174.31666666666666, "x": "1935年には春にベスト8、夏は2回戦まで進んでいる。"}, {"t": 179.0, "x": "春も夏も毎年のように出ていたのね。"}, {"t": 181.5, "x": "ここまで甲子園には春5回、夏2回。"}, {"t": 184.08333333333334, "x": "ただ、まだ優勝には届いていなかった。"}, {"t": 187.15, "x": "ここで冒頭の嶋清一が出てくる。"}, {"t": 189.3, "x": "1920年、大正9年12月15日、和歌山市に生まれた。"}, {"t": 193.95, "x": "和歌山県の資料では、1936年に\n海草中に入り、野球部に入っている。"}, {"t": 199.56666666666666, "x": "投げるのは右と左どっちだったの？"}, {"t": 201.88333333333333, "x": "左だ。左投げの投手だった。"}, {"t": 204.16666666666666, "x": "1937年の夏。嶋はエースとして甲子園に出た。"}, {"t": 208.15, "x": "海草中にとって3回目の夏で、結果はベスト4だ。"}, {"t": 211.8, "x": "初めてのエースの夏で、ベスト4なのね。"}, {"t": 214.58333333333334, "x": "1938年は春と夏の両方に出た。"}, {"t": 217.73333333333332, "x": "この年の夏は、和歌山と奈良で\n1つの代表を決める紀和大会があった。"}, {"t": 222.21666666666667, "x": "その紀和大会で嶋はノーヒットノーランをしている。"}, {"t": 225.18333333333334, "x": "予選でヒット0本。"}, {"t": 226.68333333333334, "x": "ところが甲子園では、1回戦で負けた。"}, {"t": 229.26666666666668, "x": "春はベスト8だった。"}, {"t": 230.9, "x": "予選では打たれなかったのに、\n甲子園では勝てなかったのね。"}, {"t": 234.46666666666667, "x": "1939年の春も、1回戦で負けている。"}, {"t": 237.96666666666667, "x": "嶋がエースになってから、甲子園は4回。"}, {"t": 240.45, "x": "優勝はまだなかった。"}, {"t": 242.06666666666666, "x": "それで最後の夏になるのね。"}, {"t": 244.0, "x": "ああ。1939年、昭和14年の夏だ。"}, {"t": 248.05, "x": "この夏、和歌山と奈良の学校は、\n紀和大会で代表を争った。"}, {"t": 252.2, "x": "和歌山県の資料にはこの予選の数字がある。"}, {"t": 254.9, "x": "3試合で打たれたヒットは6本。"}, {"t": 256.73333333333335, "x": "四球は7つ。三振は40個だ。"}, {"t": 259.35, "x": "3試合で三振が40個？"}, {"t": 261.35, "x": "1試合で13個から14個の割合になる。"}, {"t": 264.1, "x": "こうして海草中は、3年続けて\n夏の甲子園に出た。夏は5回目だ。"}, {"t": 268.75, "x": "この大会は、まだ\n「全国中等学校優勝野球大会」という名前だった。"}, {"t": 273.76666666666665, "x": "中学の大会だったのね。"}, {"t": 275.65, "x": "ああ。今の高校野球のもとになった大会だ。"}, {"t": 278.48333333333335, "x": "甲子園での最初の相手は、嘉義中だ。"}, {"t": 281.05, "x": "かぎちゅう？　どこの学校なの？"}, {"t": 283.0, "x": "当時、日本が治めていた台湾の学校だ。"}, {"t": 285.78333333333336, "x": "嶋はこの試合をヒット3本に抑えて完封した。"}, {"t": 288.8833333333333, "x": "完封は相手に1点も取らせずに投げきることよね。"}, {"t": 292.0, "x": "そうだ。次の京都商はヒット2本で完封。"}, {"t": 294.81666666666666, "x": "その次の鳥取の米子中も、完封だった。"}, {"t": 297.8833333333333, "x": "3試合続けて、0点なのね。"}, {"t": 300.21666666666664, "x": "ここまでで準決勝に進んだ。"}, {"t": 302.81666666666666, "x": "準決勝の相手は静岡の島田商だ。"}, {"t": 305.31666666666666, "x": "嶋はこの試合で三振を17個取った。"}, {"t": 307.85, "x": "そしてヒットを1本も打たせなかった。"}, {"t": 309.96666666666664, "x": "ノーヒットノーランだ。"}, {"t": 311.43333333333334, "x": "準決勝でノーヒットノーラン？"}, {"t": 313.3, "x": "ああ。そして次が決勝だ。"}, {"t": 315.1666666666667, "x": "資料によると、日付は1939年8月19日。"}, {"t": 319.06666666666666, "x": "相手は山口の下関商だ。"}, {"t": 321.2, "x": "この試合で出した四球は、2つだけだった。"}, {"t": 324.1, "x": "じゃあ決勝もヒット0本だったの？"}, {"t": 326.35, "x": "そうだ。2試合続けてのノーヒットノーランだ。"}, {"t": 329.0833333333333, "x": "海草中はこの大会で初めて優勝した。"}, {"t": 331.9166666666667, "x": "5試合ぜんぶ0点で優勝したのね。"}, {"t": 334.31666666666666, "x": "野球殿堂の記録では、5試合で打たれたヒットは8本。"}, {"t": 337.68333333333334, "x": "取った三振は57個だ。"}, {"t": 339.6333333333333, "x": "57個も。"}, {"t": 340.8, "x": "1試合あたりにすると、11個より多い。"}, {"t": 343.35, "x": "準決勝と決勝で続けたノーヒットノーランは、\n大会の歴史でこの1回だけだ。"}, {"t": 348.23333333333335, "x": "学校の記録にはそう書かれている。"}, {"t": 350.35, "x": "野球殿堂の紹介でも\n「大会史上初の偉業」とされている。"}, {"t": 354.3333333333333, "x": "準決勝と決勝で続けて。"}, {"t": 356.4, "x": "決勝のノーヒットノーランも、\n長いあいだ嶋だけだった。"}, {"t": 359.8, "x": "次にやった人はいるの？"}, {"t": 361.46666666666664, "x": "いる。59年後の1998年の夏、\n横浜高校の松坂大輔投手だ。"}, {"t": 367.3666666666667, "x": "59年もだれも並ばなかったのね。"}, {"t": 369.8666666666667, "x": "この夏、海草中のサードを\n守っていたのが、真田重蔵だ。"}, {"t": 373.71666666666664, "x": "このサードの真田が次の年の主役になる。"}, {"t": 377.01666666666665, "x": "1940年、昭和15年。"}, {"t": 379.23333333333335, "x": "嶋は卒業して明治大学に進んだ。"}, {"t": 381.8333333333333, "x": "海草中のエースになったのは、前の年に\nサードを守っていた真田重蔵だ。"}, {"t": 386.43333333333334, "x": "サードの選手が投手になったの？"}, {"t": 388.55, "x": "ああ。殿堂の紹介には、真田は\n海草中では最初は捕手だったとある。"}, {"t": 392.9, "x": "その後サードを守り、1940年から\n投手としてエースになった。"}, {"t": 397.1333333333333, "x": "最初の大会はこの年の春のセンバツだ。"}, {"t": 399.75, "x": "海草中は3年続けての出場。"}, {"t": 401.95, "x": "初戦の相手はまた島田商だった。"}, {"t": 404.31666666666666, "x": "前の年の準決勝でヒット0本に抑えた相手ね。"}, {"t": 407.6333333333333, "x": "そうだ。このとき島田商は真田を\n打ち、5対4で海草中に勝った。"}, {"t": 412.05, "x": "今度は海草中が負けたのね。"}, {"t": 414.15, "x": "そして夏。海草中は4年続けて夏の甲子園に出た。"}, {"t": 417.81666666666666, "x": "初戦の相手は平壌一中。"}, {"t": 419.46666666666664, "x": "当時、日本が治めていた朝鮮の学校だ。"}, {"t": 422.31666666666666, "x": "この試合は大差で勝った。"}, {"t": 423.93333333333334, "x": "準々決勝の京都一商とは、延長戦になった。"}, {"t": 427.3, "x": "延長までいったのね。"}, {"t": 428.75, "x": "学校の記録は「辛勝」と書いている。\nやっと勝ったという意味だ。"}, {"t": 432.75, "x": "準決勝では長野の松本商に勝った。"}, {"t": 435.98333333333335, "x": "決勝の相手はまた静岡の島田商だった。"}, {"t": 438.8333333333333, "x": "また島田商？　これで何回目なの？"}, {"t": 441.18333333333334, "x": "前の年の夏の準決勝、\nこの年の春、そしてこの夏の決勝。"}, {"t": 445.3333333333333, "x": "甲子園で3回目だ。"}, {"t": 446.96666666666664, "x": "1勝1敗で、3回目なのね。"}, {"t": 449.26666666666665, "x": "試合は投手どうしの点の入らない試合になった。"}, {"t": 452.0833333333333, "x": "学校の記録によると決勝点は3塁打で入った。"}, {"t": 455.25, "x": "スコアは2対1。海草中が勝った。"}, {"t": 457.8, "x": "2年続けての優勝ね。"}, {"t": 459.5833333333333, "x": "ああ。夏の大会を2年続けて\n勝ったのは、海草中で4校目だ。"}, {"t": 463.78333333333336, "x": "真田のこの年の勝ちは、夏だけではない。"}, {"t": 466.46666666666664, "x": "殿堂の紹介によると、この年から\n1942年まで、神宮大会でも優勝している。"}, {"t": 472.43333333333334, "x": "神宮大会って甲子園とは別の大会なの？"}, {"t": 475.4, "x": "そうだ。殿堂の紹介には「神宮大会」とあり、\nそこでも勝ったと書いてある。"}, {"t": 480.2, "x": "この夏のあと、海草中は1941年の春にも出た。"}, {"t": 484.28333333333336, "x": "エースは真田で春・夏・春と3回続けての出場だった。"}, {"t": 488.3, "x": "結果は1回戦で負けている。"}, {"t": 490.78333333333336, "x": "1941年の春には、甲子園とは\n別にもう1つ記録がある。"}, {"t": 495.3, "x": "春の近畿大会だ。相手は兵庫の滝川中。"}, {"t": 498.31666666666666, "x": "この試合は延長25回まで続いた。"}, {"t": 500.85, "x": "25回。ふつうは9回なのにね。"}, {"t": 503.31666666666666, "x": "ああ。9回の試合のほぼ3つ分だ。"}, {"t": 505.6333333333333, "x": "最後は1対0で海草中が勝った。"}, {"t": 507.8333333333333, "x": "投げたのは真田だ。"}, {"t": 509.2, "x": "その年の夏、海草中は紀和大会に\n勝って、甲子園に出る権利を取った。"}, {"t": 514.0, "x": "これで5年続けて夏の甲子園ね。"}, {"t": 516.3833333333333, "x": "ところが、この年の夏の大会は、\n戦争のため開かれなかった。"}, {"t": 520.65, "x": "大会そのものがなくなったの？"}, {"t": 522.6833333333333, "x": "そして1943年、海草中の野球部は、\n戦争が激しくなったため廃部になった。"}, {"t": 528.6166666666667, "x": "部がなくなってしまったのね。"}, {"t": 530.4833333333333, "x": "1921年に始まった部は、22年でいったん終わった。"}, {"t": 535.2, "x": "明治大学に進んだ嶋のその後を、\n和歌山県の資料で見ておく。"}, {"t": 539.2333333333333, "x": "1943年、昭和18年。"}, {"t": 541.7666666666667, "x": "嶋は学徒動員で戦地へ出た。"}, {"t": 543.9333333333333, "x": "大学に入ってまだ数年ね。"}, {"t": 545.8666666666667, "x": "学徒動員って学生が戦争に行くことよね。"}, {"t": 548.8, "x": "そうだ。大学の学生も兵隊として\n送られるようになった。"}, {"t": 552.4333333333333, "x": "1945年、昭和20年3月29日。"}, {"t": 556.0, "x": "ベトナムの海岸線の近くを北へ進んでいたところを、\nアメリカの潜水艦に攻撃された。"}, {"t": 561.4333333333333, "x": "嶋はそこで戦死した。24歳だった。"}, {"t": 564.2833333333333, "x": "甲子園の決勝から、6年もたっていないのね。"}, {"t": 567.4333333333333, "x": "ああ。野球殿堂の記録では、場所は\n「インドシナ半島沖」となっている。"}, {"t": 571.9166666666666, "x": "資料に書かれているのは、ここまでだ。"}, {"t": 574.1666666666666, "x": "その日のくわしい様子は、ここでは言わない。"}, {"t": 576.75, "x": "記録に残っていることだけ、なのね。"}, {"t": 579.2666666666667, "x": "そうだ。"}, {"t": 580.5166666666667, "x": "戦争が終わった次の年、1946年。"}, {"t": 583.65, "x": "野球部は戻ってきた。"}, {"t": 585.1833333333333, "x": "学校の記録には\n「戦後すぐに硬式野球部復活」とある。"}, {"t": 589.1166666666667, "x": "1947年には春と夏の両方の甲子園に出た。"}, {"t": 593.05, "x": "戻ってすぐに甲子園に出たの？"}, {"t": 595.1, "x": "ああ。春は5年ぶり10回目、夏は6年ぶり7回目だ。"}, {"t": 598.8333333333334, "x": "どちらも2回戦で負けている。"}, {"t": 600.6833333333333, "x": "そして1948年、昭和23年。"}, {"t": 603.6833333333333, "x": "学校の仕組みが変わる学制改革があった。"}, {"t": 606.4666666666667, "x": "このとき海草中は和歌山県立向陽高校になった。"}, {"t": 609.9833333333333, "x": "ここでいまの名前になったのね。"}, {"t": 611.9833333333333, "x": "そうだ。ここからは向陽高校の野球部になる。"}, {"t": 614.95, "x": "名前が変わってからも、甲子園には出たの？"}, {"t": 617.6666666666666, "x": "出ている。ただし春だけだ。"}, {"t": 619.45, "x": "その前に近畿の大会で力をつけていく。"}, {"t": 622.15, "x": "1950年の春、和歌山県大会で初めて\n優勝し、近畿大会に初めて出た。"}, {"t": 627.8166666666667, "x": "1964年の秋には近畿大会で準優勝している。"}, {"t": 631.75, "x": "近畿で2番目ね。"}, {"t": 633.15, "x": "1965年の春、18年ぶりに出た。11回目だ。"}, {"t": 637.4333333333333, "x": "このときのエースは、のちに南海などで\nプレーした野崎恒男投手だ。"}, {"t": 641.5, "x": "そのあと1969年と1973年にも、\n春のセンバツに出ている。"}, {"t": 646.8333333333334, "x": "1973年の秋には近畿大会で初めて優勝した。"}, {"t": 650.9333333333333, "x": "その力で、1974年の春にも2年続けて出ている。"}, {"t": 655.1, "x": "ただ、1965年は2回戦、\n1969年からの3回はどれも1回戦で負けた。"}, {"t": 661.5833333333334, "x": "近畿では勝っても甲子園では勝てなかったのね。"}, {"t": 664.35, "x": "1974年までで春は何回になったの？"}, {"t": 667.6166666666667, "x": "14回だ。"}, {"t": 668.6, "x": "1974年の夏は和歌山大会で優勝した。"}, {"t": 672.1333333333333, "x": "だが、そのあとの紀和大会で、\n奈良の郡山高校に1対5で負けた。"}, {"t": 676.65, "x": "和歌山で勝っても、まだ奈良と\n戦わないといけなかったのね。"}, {"t": 680.4333333333333, "x": "そうだ。夏の大会が1県から1校出られる\n形になったのは、1978年からだ。"}, {"t": 686.4333333333333, "x": "その後の夏は、1983年に\n和歌山大会の準決勝まで進んでいる。"}, {"t": 692.1833333333333, "x": "時代が進んで、海草中の2人の投手が\n野球殿堂に入る。"}, {"t": 696.0833333333334, "x": "先に入ったのは真田重蔵だ。"}, {"t": 697.9833333333333, "x": "1990年だった。"}, {"t": 700.0166666666667, "x": "真田さんは海草中のあとどうしたの？"}, {"t": 702.4333333333333, "x": "プロ野球に入った。最初は1943年の朝日軍だ。"}, {"t": 706.5166666666667, "x": "兵役から戻ったあとも投げ続けた。"}, {"t": 708.8166666666667, "x": "1950年には1年で39勝して、沢村賞を取っている。"}, {"t": 713.3833333333333, "x": "1年で39勝も。"}, {"t": 715.1666666666666, "x": "ああ。この年、所属の松竹ロビンスは、\nセ・リーグの最初の優勝チームになった。"}, {"t": 720.3833333333333, "x": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
